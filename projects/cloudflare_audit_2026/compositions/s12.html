    (function () {
      const ID = "s12";
      const R = document.querySelector('[data-composition-id="' + ID + '"]');

      let seed = 1212;

      // near-plane motes (depth)

      // ---- initial states
      ["D", "C", "B", "A"].forEach((k) => tl.set(P[k].el, { z: P[k].z, rotationY: 0 }, 0));
      tl.set([q("#s12-st1"), q("#s12-st2"), q("#s12-sf1"), q("#s12-sf2"), q("#s12-scan"), q("#s12-sh"), q("#s12-shfill")], { opacity: 0 }, 0);
      tl.set(P.D.front, { filter: "blur(0px) brightness(1)" }, 0);
      tl.set(q("#s12-shadow"), { opacity: 0 }, 0);
      ft(q("#s12-shadow"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.05);

      // shield morph geometry: the dog-ear of page D (frontal) → a shield outline (hand-off to s13)
      const tri = [[820, 1340], [940, 1340], [820, 1460]];
      const line3 = (a, b) => [[a[0] + (b[0] - a[0]) / 3, a[1] + (b[1] - a[1]) / 3], [a[0] + 2 * (b[0] - a[0]) / 3, a[1] + 2 * (b[1] - a[1]) / 3], b];
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const tv = [tri[0], mid(tri[0], tri[1]), tri[1], mid(tri[1], tri[2]), tri[2], mid(tri[2], tri[0]), tri[0]];
      const SRC = [tv[0]]; for (let i = 0; i < 6; i++) SRC.push(...line3(tv[i], tv[i + 1]));
      const DST = [[540, 770], [600, 812], [680, 826], [740, 826], [746, 912], [744, 995], [722, 1072], [694, 1160], [626, 1222], [540, 1262],
        [454, 1222], [386, 1160], [358, 1072], [336, 995], [334, 912], [340, 826], [400, 826], [480, 812], [540, 770]];
      const M = { t: 0 }, sh = q("#s12-sh"), shf = q("#s12-shfill");
      function drawShield() {
        const t = M.t, pts = SRC.map((p, i) => [p[0] + (DST[i][0] - p[0]) * t, p[1] + (DST[i][1] - p[1]) * t]);
        let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
        for (let i = 1; i < pts.length; i += 3) d += ` C${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${pts[i + 1][0].toFixed(1)} ${pts[i + 1][1].toFixed(1)} ${pts[i + 2][0].toFixed(1)} ${pts[i + 2][1].toFixed(1)}`;
        d += " Z"; sh.setAttribute("d", d); shf.setAttribute("d", d);
      }
      tl.set(M, { t: 0, onUpdate: drawShield }, 0); drawShield();

      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);

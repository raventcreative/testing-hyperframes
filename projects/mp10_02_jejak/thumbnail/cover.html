<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Jejak 1 Transaksi</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     The order card on a 3D road: three bites (illustrative amounts, labelled) -> what actually lands in the bank. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 306px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t0 { position: absolute; left: 0; width: 1080px; top: 392px; text-align: center; font: italic 400 64px/1 PF; color: #DDE1EE; white-space: nowrap; }
  #t1 { position: absolute; left: 0; width: 1080px; top: 478px; text-align: center; font: 800 132px/1.02 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 92% / 100% 80%; padding: 0 .08em; }
  /* the road in 3D */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1200px; perspective-origin: 540px 700px; }
  #floor { position: absolute; left: 90px; top: 760px; width: 900px; height: 1100px; transform-origin: 50% 0; transform: rotateX(48deg) rotateZ(-8deg); transform-style: preserve-3d; }
  #floor svg { position: absolute; left: 0; top: 0; }
  .card { position: absolute; width: 460px; height: 270px; border-radius: 28px; background: #fff; padding: 26px 30px; box-shadow: 0 30px 60px rgba(3,6,24,.45); overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 10px; background: linear-gradient(90deg, #212C5F, #3448a0); }
  .card .h { display: flex; align-items: center; gap: 14px; font: 700 22px/1 PS; letter-spacing: .08em; color: #5B6478; white-space: nowrap; }
  .card .h i { display: flex; width: 48px; height: 48px; border-radius: 14px; background: #212C5F; align-items: center; justify-content: center; }
  .card .h svg { width: 28px; height: 28px; }
  .card .a { margin-top: 20px; font: 800 80px/1 Rubik; letter-spacing: -1px; color: #212C5F; white-space: nowrap; }
  .card .a small { font: 700 44px/1 Rubik; margin-right: 6px; }
  .card .b { margin-top: 18px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #FED111, #FFE440); }
  .card .f { margin-top: 18px; font: 700 18px/1 PS; letter-spacing: .05em; color: #8E99C2; }
  #cA { left: 70px; top: 760px; transform: rotate(-5deg); }
  .chip { position: absolute; padding: 16px 22px 18px; border-radius: 22px; background: #FFE440; box-shadow: 0 18px 34px rgba(3,6,24,.4); white-space: nowrap; }
  .chip small { display: block; font: 700 19px/1 PS; letter-spacing: .08em; color: #3d4566; }
  .chip b { display: block; margin-top: 8px; font: 800 46px/1 Rubik; color: #212C5F; letter-spacing: -1px; }
  #k1 { left: 600px; top: 900px; transform: rotate(6deg); }
  #k2 { left: 120px; top: 1110px; transform: rotate(-4deg); }
  #k3 { left: 560px; top: 1230px; transform: rotate(5deg); }
  #bank { position: absolute; left: 80px; top: 1340px; display: flex; align-items: center; gap: 18px; padding: 20px 30px 20px 20px; border-radius: 26px; background: #fff; box-shadow: 0 22px 44px rgba(3,6,24,.45); white-space: nowrap; transform: rotate(-3deg); }
  #bank i { display: flex; width: 72px; height: 72px; border-radius: 20px; background: #26367A; align-items: center; justify-content: center; } #bank svg { width: 44px; height: 44px; }
  #bank small { display: block; font: 700 20px/1 PS; letter-spacing: .08em; color: #5B6478; } #bank b { display: block; margin-top: 8px; font: 800 58px/1 Rubik; color: #212C5F; }
  #bank em { font: 800 58px/1 Rubik; font-style: normal; color: #FED111; margin-left: 4px; }
  #ilu { position: absolute; left: 82px; top: 1484px; padding: 9px 14px; border-radius: 10px; background: rgba(255,255,255,.14); font: 700 20px/1 PS; letter-spacing: .05em; color: #DDE1EE; white-space: nowrap; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="stage"><div id="floor">
    <svg width="900" height="1100" viewBox="0 0 900 1100">
      <path d="M 300 40 C 700 160, 760 330, 560 470 S 160 700, 330 860 S 650 1000, 520 1090" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="90" stroke-linecap="round"/>
      <path d="M 300 40 C 700 160, 760 330, 560 470 S 160 700, 330 860 S 650 1000, 520 1090" fill="none" stroke="#FED111" stroke-width="10" stroke-dasharray="2 26" stroke-linecap="round"/>
    </svg>
  </div></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t0">1 pesanan, uangnya lari</div>
  <div id="t1">ke <span>mana aja?</span></div>
  <div class="card" id="cA">
    <div class="h"><i><svg viewBox="0 0 24 24" fill="none" stroke="#FED111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></i>PESANAN #0417</div>
    <div class="a"><small>Rp</small>100.000</div><div class="b"></div><div class="f">Ilustrasi data</div>
  </div>
  <div class="chip" id="k1"><small>BIAYA LAYANAN</small><b>−Rp6.500</b></div>
  <div class="chip" id="k2"><small>ONGKIR</small><b>−Rp9.000</b></div>
  <div class="chip" id="k3"><small>RETUR · KADANG</small><b>−Rp10.000</b></div>
  <div id="bank"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5.5 10v8M10 10v8M14 10v8M18.5 10v8M3 20.5h18"/></svg></i><span><small>MASUK REKENING</small><b>Rp74.500<em>?</em></b></span></div>
  <div id="ilu">Ilustrasi data</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: 870, y: 1650, h: 700, yaw: -24, roll: 0, headYaw: -16, headPitch: -10, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 125, fwd: 28, bend: 26 },
      face: { blink: 0, lookX: -0.9, lookY: 0.7, smile: 1, o: 0.25, happy: 0 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

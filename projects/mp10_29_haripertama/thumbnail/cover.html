<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Hari Pertama Pakai MasterPajak AI</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's shop-room diorama ("Toko Mentari") under a day arc: four stops PAGI / SIANG / SORE / MALAM with what happens at
     each (foto nota, catatan rapi, laporan, tanya AI). The sky behind the arc runs from morning to night. No numbers. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 380px; font: 800 146px/0.97 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 672px; display: flex; align-items: center; gap: 16px; font: italic 400 60px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #t2 svg { width: 56px; height: 56px; }
  /* the day dome: a sky that runs from morning (left) to night (right), clipped to a half-disc behind the arc */
  #dome { position: absolute; left: 90px; top: 830px; width: 900px; height: 900px; border-radius: 50%; overflow: hidden;
          background: linear-gradient(90deg, #FFE6B4 0%, #C6DAF6 26%, #9EC6F3 46%, #FFC97C 68%, #6E5FA8 82%, #141D4C 100%);
          -webkit-mask-image: linear-gradient(180deg, #000 0, #000 52%, transparent 70%); mask-image: linear-gradient(180deg, #000 0, #000 52%, transparent 70%); opacity: .95; }
  #dome i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  #arc { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  .bdg { position: absolute; width: 112px; margin-left: -56px; text-align: center; }
  .bdg .cc { width: 100px; height: 100px; margin: 0 auto; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 28px rgba(3,6,24,.4), 0 0 0 6px rgba(254,209,17,.85); }
  .bdg .cc svg { width: 56px; height: 56px; }
  .bdg .cc.nt { background: #212C5F; }
  .bdg b { display: block; margin-top: 12px; font: 800 26px/1 Rubik; letter-spacing: .06em; color: #fff; white-space: nowrap; }
  .bdg span { position: absolute; left: 50%; top: 152px; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: #fff; font: 700 24px/1 PS; color: #212C5F; white-space: nowrap; box-shadow: 0 10px 22px rgba(3,6,24,.35); }
  .stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 540px 960px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .floorw { background-color: #F4ECDC; background-image: linear-gradient(90deg, rgba(120,86,40,.10) 0 2px, transparent 2px); background-size: 80px 100%; }
  .slabf { background: linear-gradient(180deg, #34489f 0%, #26367A 40%, #1d2a63 100%); box-shadow: inset 0 4px 0 #FED111; }
  .slabs { background: linear-gradient(180deg, #24336f, #172152); box-shadow: inset 0 4px 0 #E2B800; }
  .wall { background: linear-gradient(180deg, #F7F8FC 0%, #EEF1F8 100%); }
  .wains { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, #34489f, #26367A); box-shadow: inset 0 6px 0 #FED111; }
  .rim { background: #1d2a63; } .rimv { background: linear-gradient(180deg, #2a3a84, #1a2458); }
  .ctop { background-color: #F7EFDF; box-shadow: inset 0 0 0 4px rgba(120,86,40,.12); }
  .cfront { background: linear-gradient(180deg, #34489f 0%, #26367A 55%, #1f2d6a 100%); box-shadow: inset 0 10px 0 #FED111; }
  .cside { background: linear-gradient(180deg, #24336f, #172152); box-shadow: inset 0 10px 0 #E2B800; }
  .shelfp { background: #E9DCC2; } .shelfe { background: #C9B48D; }
  .win { position: absolute; left: 116px; top: 90px; width: 300px; height: 270px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, #A9CDF5, #FFF0D2); }
  .wfr { position: absolute; left: 106px; top: 80px; width: 320px; height: 290px; border-radius: 14px; border: 12px solid #fff; box-shadow: 0 0 0 3px rgba(33,44,95,.18); }
  .wfr::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 10px; margin-left: -5px; background: #fff; }
  .wfr::after { content: ""; position: absolute; top: 46%; left: -2px; right: -2px; height: 10px; background: #fff; }
  .sign { position: absolute; left: 556px; top: 40px; width: 330px; height: 86px; border-radius: 14px; background: #212C5F; display: flex; align-items: center; justify-content: center; font: 800 34px/1 Rubik; letter-spacing: .04em; color: #fff; white-space: nowrap; }
  .sign span { color: #FED111; margin-left: 10px; }
  .goods { position: absolute; display: flex; align-items: flex-end; gap: 14px; }
  .goods i { display: block; border-radius: 6px; }
  .bb svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .phn { position: absolute; border-radius: 16px; background: #131B40; box-shadow: 0 0 0 3px #2a3a84, 0 0 40px 10px rgba(254,209,17,.45); }
  .phn .scr { position: absolute; left: 7px; top: 9px; right: 7px; bottom: 9px; border-radius: 10px; background: #fff; overflow: hidden; }
  .phn .scr i { position: absolute; left: 10px; right: 10px; height: 10px; border-radius: 5px; background: #DDE1EE; }
  .phn .scr b { position: absolute; left: 10px; top: 12px; width: 40px; height: 40px; border-radius: 10px; background: #FED111; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="dome"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">HARI<br /><span>PERTAMA</span></div>
  <div id="t2">dari pagi sampai malam<svg viewBox="0 0 24 24" fill="none" stroke="#FED111" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></div>
  <svg id="arc"><path id="arcP" d="" fill="none" stroke="#FED111" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round" opacity=".9"/></svg>
  <div class="stage"><div class="g3" id="cam"><div class="g3" id="yaw"><div class="g3" id="pan"></div></div></div></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (parent) parent.appendChild(e); return e; };
  const ICO = [
    (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0"/><path d="M12 6v3M5.6 9.6l2 2M18.4 9.6l-2 2"/></svg>`,
    (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>`,
    (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M7 17a5 5 0 0 1 10 0"/><path d="M12 6v4M9.5 8.5L12 11l2.5-2.5M4 21h16"/></svg>`,
    (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`,
  ];
  // the day arc + four stops
  const AC = { x: 540, y: 1280, r: 430 }, pos = (th) => [AC.x + AC.r * Math.cos(th * Math.PI / 180), AC.y - AC.r * Math.sin(th * Math.PI / 180)];
  { const a = pos(172), b = pos(8); document.getElementById("arcP").setAttribute("d", `M${a[0].toFixed(1)} ${a[1].toFixed(1)} A${AC.r} ${AC.r} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`); }
  [[158, "PAGI", "foto nota", "#212C5F"], [118, "SIANG", "catatan rapi", "#212C5F"], [72, "SORE", "laporan", "#212C5F"], [32, "MALAM", "tanya AI", "#FED111"]].forEach(([th, n, l, c], k) => {
    const [x, y] = pos(th), e = mk("div", "bdg", document.getElementById("c"), `left:${x.toFixed(0)}px; top:${(y - 50).toFixed(0)}px`);
    e.innerHTML = `<div class="cc${k === 3 ? " nt" : ""}">${ICO[k](c)}</div><b>${n}</b><span>${l}</span>`; });
  [[640, 120], [700, 60], [760, 150], [820, 90], [860, 200], [720, 230]].forEach(([x, y]) => mk("i", "", document.getElementById("dome"), `left:${x}px; top:${y}px`));
  // the shop-room diorama (same build as the film, static camera)
  const k = { ax: 470, ay: 1520, fx: 0, fy: -250, fz: 0, rx: -22, ry: -20, z: -900 };
  document.getElementById("cam").style.transform = `translate3d(${k.ax}px, ${k.ay}px, ${k.z}px) rotateX(${k.rx}deg)`;
  document.getElementById("yaw").style.transform = `rotateY(${k.ry}deg)`;
  document.getElementById("pan").style.transform = `translate3d(${-k.fx}px, ${-k.fy}px, ${-k.fz}px)`;
  const P1 = document.getElementById("pan");
  const pl = (cls, w, h, tr) => mk("div", "pl " + cls, P1, `left:${-w / 2}px; top:${-h / 2}px; width:${w}px; height:${h}px; transform:${tr};`);
  pl("floorw", 960, 640, "rotateX(90deg)");
  pl("slabf", 960, 46, "translate3d(0px, 23px, 320px)"); pl("slabs", 640, 46, "translate3d(480px, 23px, 0px) rotateY(90deg)");
  pl("wall", 936, 560, "translate3d(12px, -280px, -296px)").innerHTML = `<div class="wains"></div><div class="win"></div><div class="wfr"></div>
    <div class="sign">TOKO<span>MENTARI</span></div>
    <div class="goods" style="left:560px; top:146px"><i style="width:80px;height:58px;background:#FED111"></i><i style="width:80px;height:72px;background:#26367A"></i><i style="width:80px;height:46px;background:#fff;box-shadow:inset 0 0 0 3px #DDE1EE"></i><i style="width:60px;height:64px;background:#F2D27A"></i></div>
    <div class="goods" style="left:570px; top:290px"><i style="width:96px;height:66px;background:#F2D27A"></i><i style="width:70px;height:52px;background:#8E99C2"></i><i style="width:96px;height:74px;background:#F2D27A"></i></div>`;
  pl("wall", 616, 560, "translate3d(-456px, -280px, 12px) rotateY(90deg)").innerHTML = `<div class="wains"></div>
    <svg style="position:absolute;left:248px;top:110px;width:144px;height:144px" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#fff" stroke="#212C5F" stroke-width="7"/><path d="M60 60V34" stroke="#212C5F" stroke-width="7" stroke-linecap="round" transform="rotate(225 60 60)"/><path d="M60 64V18" stroke="#FED111" stroke-width="5" stroke-linecap="round"/><circle cx="60" cy="60" r="6" fill="#212C5F"/></svg>`;
  pl("rim", 960, 24, "translate3d(0px, -560px, -308px) rotateX(90deg)"); pl("rim", 24, 616, "translate3d(-468px, -560px, 12px) rotateX(90deg)");
  pl("rimv", 24, 560, "translate3d(-468px, -280px, 320px)"); pl("rimv", 24, 560, "translate3d(480px, -280px, -308px) rotateY(90deg)");
  [-330, -190].forEach((y) => { pl("shelfp", 380, 70, `translate3d(250px, ${y}px, -261px) rotateX(90deg)`); pl("shelfe", 380, 12, `translate3d(250px, ${y + 6}px, -226px)`); });
  pl("ctop", 500, 180, "translate3d(-50px, -260px, 60px) rotateX(90deg)");
  pl("cfront", 500, 260, "translate3d(-50px, -130px, 150px)").innerHTML = `<div style="position:absolute;left:0;right:0;top:86px;text-align:center;font:800 44px/1 Rubik;letter-spacing:.06em;color:#fff;white-space:nowrap">TOKO <span style="color:#FED111">MENTARI</span></div>`;
  pl("cside", 180, 260, "translate3d(200px, -130px, 60px) rotateY(90deg)");
  const bb = (x, y, z, w, h, html) => { const g = mk("div", "g3", P1, `transform: translate3d(${x}px, ${y}px, ${z}px) rotateY(16deg)`); mk("div", "pl bb", g, `left:${-w / 2}px; top:${-h}px; width:${w}px; height:${h}px; overflow:visible`).innerHTML = html; };
  bb(-40, -260, 50, 110, 200, `<div class="phn" style="left:0;top:0;width:110px;height:196px"><div class="scr"><b></b><i style="top:62px"></i><i style="top:82px;right:30px"></i><i style="top:102px"></i><i style="top:122px;right:40px"></i></div></div>`);
  bb(-230, -260, 20, 120, 190, `<svg width="120" height="190" viewBox="0 0 120 190"><ellipse cx="60" cy="184" rx="40" ry="8" fill="#212C5F"/><path d="M60 182V96L36 60" stroke="#26367A" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M12 74 L48 26 L84 56 Z" fill="#FED111" stroke="#E2B800" stroke-width="4" stroke-linejoin="round"/></svg>`);
  bb(-385, 0, 236, 140, 230, `<svg width="140" height="230" viewBox="0 0 140 230"><path d="M70 150 C 30 120, 10 70, 26 30 C 50 60, 64 100, 70 150Z" fill="#3d8a5c"/><path d="M70 150 C 104 116, 128 74, 116 34 C 92 62, 76 102, 70 150Z" fill="#4fa36e"/><path d="M70 150 C 60 100, 64 50, 74 12 C 90 52, 86 104, 70 150Z" fill="#5cb87c"/><path d="M34 148 h72 l-10 78 h-52 z" fill="#26367A"/></svg>`);
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    document.querySelectorAll(".bdg span, #t1, #t2").forEach((e) => { const b = e.getBoundingClientRect(); if (b.left < 60 || b.right > 1020) console.log("pageerror EDGE", e.textContent, b.left, b.right); });
    r.render({ x: 935, y: 1560, h: 600, yaw: -24, roll: 0, headYaw: -18, headPitch: -10, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 140, fwd: 26, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.5, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · POV Tutup Bulan</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 400px 700px; }
  /* desk calendar page "30" in 3D */
  #cal { position: absolute; left: 96px; top: 420px; width: 430px; height: 530px; transform-style: preserve-3d; transform: rotateY(18deg) rotateX(6deg) rotateZ(-5deg); }
  #cal .rings { position: absolute; left: -10px; top: 0; width: 450px; height: 50px; border-radius: 16px; background: linear-gradient(180deg, #34428a, #1b2453); transform: translateZ(6px); box-shadow: 0 10px 20px rgba(0,0,0,.3); }
  #cal .rings i { position: absolute; top: -26px; width: 22px; height: 56px; border-radius: 11px; background: linear-gradient(90deg, #8d96b5, #f4f6fb 45%, #9aa3c0); }
  #cal .pg { position: absolute; left: 0; top: 28px; width: 430px; height: 502px; background: #fff; border-radius: 0 0 22px 22px; overflow: hidden; box-shadow: 0 40px 70px rgba(0,0,0,.45); }
  #cal .hd { height: 120px; padding-top: 38px; background: #26367A; text-align: center; font: 700 28px/1 PS; letter-spacing: .22em; color: #fff; }
  #cal .num { position: absolute; left: 0; width: 430px; top: 150px; text-align: center; font: 800 250px/1 Rubik; letter-spacing: -8px; color: #212C5F; }
  #cal svg { position: absolute; left: 22px; top: 128px; width: 386px; height: 290px; overflow: visible; mix-blend-mode: multiply; }
  #cal svg path { fill: none; stroke: #FED111; stroke-width: 13; stroke-linecap: round; }
  #cal .ft { position: absolute; left: 0; width: 430px; top: 430px; text-align: center; font: 700 34px/1 Rubik; color: #212C5F; }
  #cal .ft span { background: linear-gradient(100deg, rgba(255,228,64,0) 0%, rgba(255,228,64,.95) 3%, rgba(255,228,64,.95) 97%, rgba(255,228,64,0) 100%) no-repeat 0 88% / 100% 70%; padding: 0 .1em; }
  /* notification toasts spilling out */
  .nt { position: absolute; width: 440px; height: 108px; border-radius: 26px; background: rgba(248,249,252,.97); display: flex; align-items: center; padding: 0 20px 0 18px; gap: 14px;
        box-shadow: 0 24px 44px rgba(0,0,0,.4); }
  .nt .ic { flex: none; width: 60px; height: 60px; border-radius: 17px; background: #212C5F; display: flex; align-items: center; justify-content: center; }
  .nt .ic svg { width: 34px; height: 34px; }
  .nt .tx { flex: 1; min-width: 0; }
  .nt .t1 { display: flex; justify-content: space-between; align-items: baseline; font: 700 26px/1.1 PS; color: #212C5F; white-space: nowrap; }
  .nt .t1 small { font: 600 18px/1 PS; color: #8E99C2; }
  .nt .t2 { margin-top: 8px; font: 600 21px/1 PS; color: #5B6478; white-space: nowrap; }
  #n1 { left: 532px; top: 446px; transform: translateZ(30px) rotateZ(5deg) rotateY(-10deg); }
  #n2 { left: 552px; top: 596px; transform: translateZ(10px) rotateZ(-4deg) rotateY(-12deg); }
  #n3 { left: 510px; top: 746px; transform: translateZ(50px) rotateZ(3deg) rotateY(-8deg); }
  #badge { position: absolute; left: 862px; top: 316px; width: 112px; height: 112px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center;
           font: 800 44px/1 Rubik; color: #212C5F; box-shadow: 0 16px 30px rgba(0,0,0,.35); transform: rotate(8deg); }
  #ilu { position: absolute; left: 556px; top: 900px; font: 700 18px/1 PS; letter-spacing: .12em; color: #8E99C2; }
  #pov { position: absolute; left: 80px; top: 1030px; display: inline-flex; padding: 14px 26px 16px; border-radius: 14px; background: #FED111; font: 800 46px/1 Rubik; color: #212C5F; letter-spacing: -.5px; }
  #t1 { position: absolute; left: 74px; top: 1120px; font: 800 168px/0.95 Rubik; letter-spacing: -5px; color: #fff; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 78%; padding: 0 .08em; }
  #t2 { position: absolute; left: 80px; top: 1452px; font: italic 400 76px/1 PF; color: #DDE1EE; }
  #t3 { position: absolute; left: 82px; top: 1556px; display: inline-flex; align-items: center; gap: 14px; padding: 16px 28px; border-radius: 999px; background: #fff; font: 700 32px/1 PS; color: #212C5F; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="stage">
    <div id="cal"><div class="pg"><div class="hd">BULAN INI</div><div class="num">30</div>
      <svg viewBox="0 0 520 380"><path d="M402 46 C300 4, 112 14, 54 116 C4 208, 86 352, 262 362 C438 370, 528 272, 506 170 C490 92, 420 44, 300 34" /></svg>
      <div class="ft"><span>tutup bulan</span></div></div>
      <div class="rings"><i style="left:110px"></i><i style="left:316px"></i></div></div>
    <div class="nt" id="n1"></div><div class="nt" id="n2"></div><div class="nt" id="n3"></div>
    <div id="badge">99+</div>
  </div>
  <div id="ilu">ILUSTRASI DATA</div>
  <div id="pov">POV: tanggal 30</div>
  <div id="t1">TUTUP<br /><span>BULAN</span></div>
  <div id="t2">capek nggak sih?</div>
  <div id="t3">Biar lebih tenang →</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  // generic order notifications (no marketplace names); amounts are illustrations
  const BAG = '<svg viewBox="0 0 24 24" fill="none" stroke="#FED111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>';
  [["n1", "Rp186.500", 2], ["n2", "Rp89.000", 1], ["n3", "Rp297.000", 3]].forEach(([id, a, q]) => {
    document.getElementById(id).innerHTML = '<div class="ic">' + BAG + '</div><div class="tx"><div class="t1">Pesanan baru<small>baru saja</small></div><div class="t2">' + a + " · " + q + " barang</div></div>";
  });
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: 860, y: 1580, h: 760, yaw: -22, roll: 0, headYaw: -6, headPitch: 6, headRoll: 11, t: 2,
      aL: { raise: 60, fwd: 10, bend: 120, bendYaw: 90 }, aR: { raise: 60, fwd: 10, bend: 120, bendYaw: 90 },
      face: { blink: 0.5, lookX: -0.2, lookY: 0, smile: 0, o: 0 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

              <rect x="104" y="29" width="6" height="12" rx="2" fill="#f2c46d" />

        <!-- foreground motes -->

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="s14"]');
          const q = (s) => R.querySelector(s), qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          const NS = "http://www.w3.org/2000/svg";
          const sv = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
          const mk = (cls, parent, css) => { const e = document.createElement("div"); e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
          let seed = 1414;
          const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
          const D = 4.55;
          const reps = (start, cyc) => Math.max(0, Math.floor((D - start) / cyc) - 1);

          // ---------- procedural detail ----------
          // halo ticks
          const ht = q("#s14-haloticks");
          for (let i = 0; i < 72; i++) {
            const a = (i / 72) * Math.PI * 2, r1 = 392, r2 = i % 6 === 0 ? 372 : 384;
            sv("line", { x1: 420 + Math.cos(a) * r1, y1: 420 + Math.sin(a) * r1, x2: 420 + Math.cos(a) * r2, y2: 420 + Math.sin(a) * r2,
              stroke: "rgba(41,75,119,0.16)", "stroke-width": i % 6 === 0 ? 3 : 1.5, "stroke-linecap": "round" }, ht);
          }
          // stopwatch ticks
          const wt = q("#s14-wticks");
          for (let i = 0; i < 60; i++) {
            const a = (i / 60) * Math.PI * 2 - Math.PI / 2, big = i % 5 === 0, r1 = 126, r2 = big ? 106 : 116;
            sv("line", { x1: 200 + Math.cos(a) * r1, y1: 260 + Math.sin(a) * r1, x2: 200 + Math.cos(a) * r2, y2: 260 + Math.sin(a) * r2,
              stroke: big ? "#294b77" : "rgba(41,75,119,0.45)", "stroke-width": big ? 4 : 2, "stroke-linecap": "round" }, wt);
          }
          const bz = q("#s14-bezt");
          for (let i = 0; i < 12; i++) {
            if (i === 0) continue;
            const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
            sv("circle", { cx: 200 + Math.cos(a) * 142, cy: 260 + Math.sin(a) * 142, r: 3, fill: "rgba(255,255,255,0.8)" }, bz);
          }
          const st = q("#s14-subt");
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            sv("line", { x1: 200 + Math.cos(a) * 23, y1: 322 + Math.sin(a) * 23, x2: 200 + Math.cos(a) * 18, y2: 322 + Math.sin(a) * 18, stroke: "rgba(41,75,119,0.5)", "stroke-width": 2 }, st);
          }
          // target rim ticks + screws
          const rt = q("#s14-rimt");
          for (let i = 0; i < 48; i++) {
            const a = (i / 48) * Math.PI * 2;
            sv("line", { x1: 240 + Math.cos(a) * 200, y1: 230 + Math.sin(a) * 200, x2: 240 + Math.cos(a) * 193, y2: 230 + Math.sin(a) * 193, stroke: "rgba(41,75,119,0.35)", "stroke-width": 2, "stroke-linecap": "round" }, rt);
          }
          const sc = q("#s14-screws");
          [45, 135, 225, 315].forEach((d) => {
            const a = (d * Math.PI) / 180, x = 240 + Math.cos(a) * 196, y = 230 + Math.sin(a) * 196;
            sv("circle", { cx: x, cy: y, r: 6.5, fill: "#eef3fa", stroke: "rgba(41,75,119,0.45)", "stroke-width": 1.5 }, sc);
            sv("line", { x1: x - 4, y1: y - 2, x2: x + 4, y2: y + 2, stroke: "rgba(41,75,119,0.6)", "stroke-width": 1.6 }, sc);
          });
          // pedestal flutes
          const fl = q("#s14-flutes");
          for (let x = 100; x <= 404; x += 26) {
            sv("line", { x1: x, y1: 108, x2: x, y2: 224, stroke: "rgba(41,75,119,0.13)", "stroke-width": 3 }, fl);
            sv("line", { x1: x + 4, y1: 108, x2: x + 4, y2: 224, stroke: "rgba(255,255,255,0.85)", "stroke-width": 2 }, fl);
          }

          // gem facets
          const T = [[130, 40], [190, 40], [250, 40], [310, 40]];
          const G = [[20, 130], [90, 130], [160, 130], [220, 130], [280, 130], [350, 130], [420, 130]];
          const P = [220, 392];
          const H = G.map(([x, y]) => [x + 0.42 * (P[0] - x), y + 0.42 * (P[1] - y)]);
          const faces = [];
          faces.push({ pts: [[150, 26], [290, 26], [310, 40], [130, 40]], g: "s14-f1" });
          const crown = [[G[0], T[0], G[1]], [T[0], G[1], G[2]], [T[0], T[1], G[2]], [T[1], G[2], G[3]], [T[1], T[2], G[3]], [T[2], G[3], G[4]], [T[2], T[3], G[4]], [T[3], G[4], G[5]], [T[3], G[5], G[6]]];
          const crownG = ["s14-f1", "s14-f4", "s14-f1", "s14-f2", "s14-f4", "s14-f2", "s14-f4", "s14-f5", "s14-f2"];
          crown.forEach((p, i) => faces.push({ pts: p, g: crownG[i] }));
          const bandG = ["s14-f4", "s14-f2", "s14-f1", "s14-f5", "s14-f2", "s14-f3"];
          const bandG2 = ["s14-f1", "s14-f4", "s14-f2", "s14-f2", "s14-f5", "s14-f3"];
          const lowG = ["s14-f2", "s14-f5", "s14-f4", "s14-f3", "s14-f3", "s14-f5"];
          for (let i = 0; i < 6; i++) {
            faces.push({ pts: [G[i], G[i + 1], H[i + 1]], g: bandG[i] });
            faces.push({ pts: [G[i], H[i + 1], H[i]], g: bandG2[i] });
            faces.push({ pts: [H[i], H[i + 1], P], g: lowG[i] });
          }
          const fg = q("#s14-facets"), sh = q("#s14-shine");
          const shines = [];
          faces.forEach((f) => {
            const pts = f.pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
            sv("polygon", { points: pts, fill: "url(#" + f.g + ")", stroke: "rgba(255,255,255,0.75)", "stroke-width": 1.3, "stroke-linejoin": "round" }, fg);
            const cx = f.pts.reduce((s, p) => s + p[0], 0) / f.pts.length;
            shines.push({ el: sv("polygon", { points: pts, fill: "#ffffff", opacity: 0 }, sh), cx });
          });

          // sparks (seeded)
          const spk = q("#s14-sparks");
          const sparks = [];
          for (let i = 0; i < 16; i++) {
            const a = (i / 16) * Math.PI * 2 + rnd() * 0.3, r = 210 + rnd() * 170;
            const x = 540 + Math.cos(a) * r * 1.05, y = 900 + Math.sin(a) * r * 0.95;
            const s = 0.45 + rnd() * 0.75;
            const d = mk("s14-abs s14-spark", spk, `left:${(x - 30).toFixed(0)}px;top:${(y - 30).toFixed(0)}px`);
            d.innerHTML = `<svg class="s14-svg" viewBox="-30 -30 60 60"><path d="M0 -28 C2 -6 6 -2 28 0 C6 2 2 6 0 28 C-2 6 -6 2 -28 0 C-6 -2 -2 -6 0 -28Z" fill="${i % 4 === 0 ? "#f2c46d" : "#ffffff"}" stroke="rgba(41,75,119,0.25)" stroke-width="1"/></svg>`;
            sparks.push({ d, s, a });
          }
          // speed lines
          const sl = q("#s14-sl");
          const slines = [];
          [[60, 820, 230], [110, 880, 170], [40, 950, 250], [90, 1030, 200], [140, 1100, 150], [70, 760, 140]].forEach(([x, y, w]) => {
            slines.push(mk("s14-abs s14-sline", sl, `left:${x}px;top:${y}px;width:${w}px`));
          });
          // click burst ticks around watch
          const wb = [];
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * 360;
            const d = mk("s14-abs s14-tick", sl, `left:537px;top:963px`);
            const rad = (a * Math.PI) / 180;
            wb.push({ d, a, sx: Math.sin(rad), sy: -Math.cos(rad) });
          }
          // impact rings + shards (inside target)
          const rg = q("#s14-rings");
          const rings = [0, 1, 2].map(() => mk("s14-abs s14-ring", rg));
          const shards = [];
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2 + rnd() * 0.4, r = 90 + rnd() * 90;
            shards.push({ d: mk("s14-abs s14-shard", rg), x: Math.cos(a) * r, y: Math.sin(a) * r, rot: rnd() * 360 });
          }
          // foreground motes
          const fgm = q("#s14-fg");
          const motes = [];
          for (let i = 0; i < 9; i++) {
            const s = 10 + rnd() * 22;
            motes.push(mk("s14-abs s14-fmote", fgm, `left:${(60 + rnd() * 960).toFixed(0)}px;top:${(480 + rnd() * 1000).toFixed(0)}px;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;opacity:${(0.45 + rnd() * 0.4).toFixed(2)}`));
          }

          // ---------- initial states ----------
          tl.set(["#s14-cone", "#s14-rays", "#s14-glow", "#s14-shock"].map(q), { opacity: 0 }, 0);
          tl.set(q("#s14-wflash"), { opacity: 0 }, 0);
          tl.set([q("#s14-l1"), q("#s14-l2"), q("#s14-c1"), q("#s14-c2")], { opacity: 0 }, 0);
          tl.set(q("#s14-target"), { opacity: 0 }, 0);
          tl.set(q("#s14-tshadow"), { opacity: 0 }, 0);
          tl.set(q("#s14-arrow"), { opacity: 0, rotation: -28, transformOrigin: "386px 35px" }, 0);
          tl.set([q("#s14-ped"), q("#s14-pshadow"), q("#s14-gem")], { opacity: 0 }, 0);
          tl.set(q("#s14-pglowe"), { opacity: 0 }, 0);
          tl.set(slines, { scaleX: 0, transformOrigin: "100% 50%", opacity: 1 }, 0);
          wb.forEach((w) => tl.set(w.d, { rotation: w.a, transformOrigin: "50% 50%", opacity: 0 }, 0));
          tl.set(rings, { scale: 0.2, opacity: 0 }, 0);
          shards.forEach((s) => tl.set(s.d, { opacity: 0 }, 0));
          sparks.forEach((s) => tl.set(s.d, { scale: 0, opacity: 0 }, 0));
          tl.set(q("#s14-sheenbar"), { x: 0 }, 0);
          tl.set([q("#s14-lk1"), q("#s14-lk2")], { strokeDasharray: 300, strokeDashoffset: 300 }, 0);

          // ---------- ambient ----------
          tl.fromTo(q("#s14-halo"), { rotation: -8, scale: 0.96 }, { rotation: 22, scale: 1.02, duration: D, ease: "none" }, 0);
          tl.fromTo(q("#s14-key"), { x: -20, opacity: 0.8 }, { x: 40, opacity: 1, duration: D, ease: "sine.inOut" }, 0);
          ["#s14-d1", "#s14-d2", "#s14-d3", "#s14-d4"].forEach((s, i) => {
            tl.fromTo(q(s), { y: 20 * (i % 2 ? 1 : -1), x: 0 }, { y: -30 * (i % 2 ? -1 : 1), x: 14 * (i % 2 ? -1 : 1), duration: D, ease: "sine.inOut" }, 0);
          });
          motes.forEach((m, i) => tl.fromTo(m, { y: 0, x: 0 }, { y: -(90 + i * 14), x: (i % 2 ? 30 : -24), duration: D, ease: "none" }, 0));
          tl.fromTo(q("#s14-stage"), { y: 26, opacity: 0.75 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);

          // ---------- 1) cepat — stopwatch ----------
          const W = q("#s14-watch");
          tl.fromTo(W, { scale: 0.82, y: 46, opacity: 0.9, rotation: -6 }, { scale: 1, y: 0, opacity: 1, rotation: 0, duration: 0.36, ease: "power3.out" }, 0);
          tl.fromTo(q("#s14-wshadow"), { opacity: 0.4, scaleX: 0.8 }, { opacity: 1, scaleX: 1, duration: 0.36, ease: "power3.out" }, 0);
          tl.fromTo(q("#s14-hand"), { rotation: -40, svgOrigin: "200 260" }, { rotation: 728, duration: 0.39, ease: "power2.in" }, 0.05);
          tl.to(q("#s14-hand"), { rotation: 720, duration: 0.22, ease: "back.out(3)" }, 0.44);
          tl.fromTo(q("#s14-trail"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.06);
          tl.to(q("#s14-trail"), { opacity: 0, duration: 0.18, ease: "power2.out" }, 0.44);
          tl.fromTo(q("#s14-subhand"), { rotation: 0, svgOrigin: "200 322" }, { rotation: 1080, duration: 0.44, ease: "power2.in" }, 0);
          tl.to(q("#s14-subhand"), { rotation: 1260, duration: 4.0, ease: "none" }, 0.44);
          tl.fromTo(q("#s14-crown"), { y: 0 }, { y: 11, duration: 0.07, ease: "power2.in" }, 0.37);
          tl.to(q("#s14-crown"), { y: 0, duration: 0.2, ease: "back.out(2)" }, 0.45);
          slines.forEach((s, i) => {
            tl.to(s, { scaleX: 1, duration: 0.2, ease: "power3.out" }, 0.16 + i * 0.03);
            tl.to(s, { x: -90, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.46 + i * 0.02);
          });
          // click
          tl.fromTo(q("#s14-wflash"), { scale: 0.92, opacity: 0.95 }, { scale: 1.32, opacity: 0, duration: 0.42, ease: "power2.out" }, 0.44);
          tl.fromTo(q("#s14-boltg"), { scale: 1, svgOrigin: "202 207" }, { scale: 1.32, duration: 0.08, ease: "power2.out" }, 0.44);
          tl.to(q("#s14-boltg"), { scale: 1, duration: 0.35, ease: "elastic.out(1, 0.45)" }, 0.52);
          tl.fromTo(q("#s14-boltglow"), { opacity: 0 }, { opacity: 1, duration: 0.08 }, 0.44);
          tl.to(q("#s14-boltglow"), { opacity: 0.35, duration: 0.4 }, 0.52);
          tl.to(W, { rotation: -3, duration: 0.05, ease: "power2.out" }, 0.44);
          tl.to(W, { rotation: 0, duration: 0.3, ease: "elastic.out(1, 0.4)" }, 0.49);
          wb.forEach((w) => {
            tl.fromTo(w.d, { opacity: 0, x: w.sx * 272, y: w.sy * 272 }, { opacity: 1, x: w.sx * 306, y: w.sy * 306, duration: 0.16, ease: "power3.out" }, 0.44);
            tl.to(w.d, { opacity: 0, x: w.sx * 346, y: w.sy * 346, duration: 0.2, ease: "power1.in" }, 0.6);
          });
          // shrink to top-left slot
          tl.to(W, { x: -300, y: -415, scale: 0.234, duration: 0.32, ease: "power3.inOut" }, 0.70);
          tl.to(q("#s14-wshadow"), { opacity: 0, duration: 0.2 }, 0.70);
          tl.fromTo(q("#s14-l1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 1.02);
          tl.fromTo(W, { y: -415 }, { y: -423, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 2, immediateRender: false }, 1.12);

          // ---------- 2) terarah — target + arrow ----------
          const TG = q("#s14-target");
          tl.fromTo(TG, { opacity: 0, x: 240, scale: 0.6, rotation: 8 }, { opacity: 1, x: 0, scale: 1, rotation: 0, duration: 0.3, ease: "power3.out" }, 0.84);
          tl.fromTo(q("#s14-tshadow"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.82);
          tl.set(q("#s14-arrow"), { opacity: 1 }, 0.98);
          tl.fromTo(q("#s14-arrow"), { x: -820, y: 436, scale: 1.35 }, { x: 0, y: 0, scale: 1, duration: 0.28, ease: "power1.in" }, 0.98);
          tl.fromTo(q("#s14-streakr"), { opacity: 0.9 }, { opacity: 0, duration: 0.12 }, 1.26);
          tl.set(q("#s14-ahead"), { opacity: 0 }, 1.26);
          tl.set(q("#s14-hole"), { opacity: 1 }, 1.26);
          tl.to(q("#s14-arrow"), { rotation: -21, duration: 0.07, ease: "power2.out" }, 1.26);
          tl.to(q("#s14-arrow"), { rotation: -33, duration: 0.1, ease: "sine.inOut" }, 1.33);
          tl.to(q("#s14-arrow"), { rotation: -25, duration: 0.1, ease: "sine.inOut" }, 1.43);
          tl.to(q("#s14-arrow"), { rotation: -30, duration: 0.1, ease: "sine.inOut" }, 1.53);
          tl.to(q("#s14-arrow"), { rotation: -28, duration: 0.14, ease: "sine.out" }, 1.63);
          tl.to(q("#s14-face"), { x: 9, y: -5, duration: 0.05, ease: "power2.out" }, 1.26);
          tl.to(q("#s14-face"), { x: 0, y: 0, duration: 0.4, ease: "elastic.out(1, 0.4)" }, 1.31);
          rings.forEach((r, i) => tl.fromTo(r, { scale: 0.15, opacity: 1 }, { scale: 1.6 + i * 0.5, opacity: 0, duration: 0.55, ease: "power2.out" }, 1.26 + i * 0.07));
          shards.forEach((s) => tl.fromTo(s.d, { x: 0, y: 0, opacity: 1, rotation: 0 }, { x: s.x, y: s.y, opacity: 0, rotation: s.rot, duration: 0.5, ease: "power3.out" }, 1.26));
          // shrink to top-right slot
          tl.to(TG, { x: 300, y: -519, scale: 0.233, duration: 0.34, ease: "power3.inOut" }, 1.78);
          tl.to(q("#s14-tshadow"), { opacity: 0, duration: 0.2 }, 1.78);
          tl.fromTo(q("#s14-l2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, 2.04);
          tl.fromTo(TG, { y: -519 }, { y: -527, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.14);

          // ---------- 3) hasilnya … premium — gem on pedestal ----------
          tl.fromTo(q("#s14-ped"), { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 1.86);
          tl.fromTo(q("#s14-pshadow"), { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "power3.out" }, 1.9);
          tl.fromTo(q("#s14-cone"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.05);
          const GM = q("#s14-gem");
          tl.fromTo(GM, { opacity: 0, y: 300, scale: 0.55 }, { opacity: 1, y: 0, scale: 1, duration: 0.83, ease: "power3.out" }, 2.17);
          tl.fromTo(q("#s14-gemspin"), { rotation: -10 }, { rotation: 0, duration: 0.83, ease: "power3.out" }, 2.17);
          tl.fromTo(q("#s14-gemspin"), { scaleX: 1 }, { scaleX: 0.87, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: reps(2.17, 0.55) }, 2.17);
          tl.fromTo(GM, { y: 0 }, { y: -12, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: reps(3.0, 0.5), immediateRender: false }, 3.0);
          shines.forEach((s) => {
            const st0 = 2.2 + (s.cx / 440) * 0.5;
            tl.fromTo(s.el, { opacity: 0 }, { opacity: 0.6, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: reps(st0, 0.55) }, st0);
          });
          tl.fromTo(q("#s14-pglowe"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.6);
          tl.fromTo(q("#s14-glint"), { scale: 0, rotation: 0, svgOrigin: "96 84" }, { scale: 1, rotation: 90, duration: 0.4, ease: "back.out(2)" }, 2.95);
          tl.to(q("#s14-glint"), { scale: 0.4, rotation: 180, duration: 0.4, ease: "power2.in" }, 3.35);
          tl.fromTo(q("#s14-glow"), { opacity: 0, scale: 0.7 }, { opacity: 0.55, scale: 0.9, duration: 0.6, ease: "power2.out" }, 2.6);
          tl.to([q("#s14-lk1"), q("#s14-lk2")], { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 2.9);

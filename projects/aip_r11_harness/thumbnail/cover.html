<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Agen ngoding open source dari DeepSeek</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/r11kit.js"></script>
<!-- IG Reels cover 1080x1920 on the client's navy background (R11 = NAVY reel): chip "OPEN SOURCE · DARI DEEPSEEK · MIT", hook
     "Agen AI buat / NGODING / tanpa langganan bulanan" with the code tile, the reel's OTAK socket + the three "brains" from s04
     (DeepSeek API · per token / Claude · GPT · API key / Ollama · lokal), the mascot (host) presenting at bottom-left, the robot
     typing at bottom-right. Poppins 700/400, white + #01ccf7. No DeepSeek/GitHub logo. Everything that matters sits inside the
     4:5 profile-grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs thumbnail/COVER_NGODING_1080x1920.png   (static server on :8931 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  #g1 { left: 40px; top: 330px; width: 1000px; height: 520px; background: radial-gradient(ellipse, rgba(48,93,143,.40), rgba(48,93,143,0) 66%); }
  #g2 { left: -60px; top: 780px; width: 1200px; height: 560px; background: radial-gradient(ellipse, rgba(1,204,247,.22), rgba(1,204,247,0) 62%); }
  .grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(../assets/brand/grain_256.png); opacity: .06; z-index: 40; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; filter: drop-shadow(0 2px 8px rgba(4,8,30,.55)); z-index: 30; }
  #chip { top: 366px; display: flex; justify-content: center; }
  #chip > span { height: 60px; padding: 0 28px 0 7px; border-radius: 30px; display: flex; align-items: center; gap: 15px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.5); font: 700 24px/1 Poppins; letter-spacing: 3.5px; color: #6adfff; }
  #chip b { height: 46px; padding: 0 18px 0 21px; border-radius: 23px; display: flex; align-items: center; background: #01ccf7; color: #0b1440; letter-spacing: 3px;
    box-shadow: 0 0 20px rgba(1,204,247,.5), inset 0 1px 0 rgba(255,255,255,.4); margin-right: 3px; }
  #chip i { width: 7px; height: 7px; border-radius: 50%; background: #6adfff; opacity: .7; }
  #l1 { top: 452px; display: flex; justify-content: center; align-items: center; gap: 22px; font: 700 80px/1 Poppins; letter-spacing: -2px; color: #fff; text-shadow: 0 6px 22px rgba(4,8,30,.5); }
  #l1 .mk { width: 84px; height: 84px; border-radius: 24px; position: relative; flex: 0 0 84px; color: #0b1440;
    background: linear-gradient(160deg, #9cecff 0%, #01ccf7 52%, #0aa7d6 100%); box-shadow: 0 0 0 5px rgba(1,204,247,.18), 0 0 34px rgba(1,204,247,.55); }
  #l1 .mk svg { position: absolute; left: 18px; top: 18px; width: 48px; height: 48px; stroke-width: 2.6; }
  #h1 { top: 548px; font: 700 168px/1 Poppins; letter-spacing: -5px; color: #fff; }
  #h1 span { display: inline-block; background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 46%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(1,204,247,.5)); padding: 0 8px; }
  #l3 { top: 734px; font: 400 46px/1 Poppins; letter-spacing: -1px; color: #e3edfa; }
  #l3 b { font-weight: 700; color: #fff; }
  /* the OTAK socket + three brains (s04 component, simplified) */
  #rig { position: absolute; left: 60px; top: 836px; width: 960px; height: 330px; z-index: 15; }
  #sock { position: absolute; left: 0; top: 0; width: 300px; height: 330px; border-radius: 28px; background: rgba(12,22,64,.86);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.10), 0 20px 40px rgba(2,6,26,.45); }
  #sock .k-lab { left: 24px; top: 18px; }
  #sock .fr { position: absolute; left: 22px; top: 56px; width: 256px; height: 180px; border-radius: 22px; border: 2.5px dashed rgba(106,223,255,.9);
    background: rgba(1,204,247,.06); box-shadow: 0 0 0 3px rgba(106,223,255,.25), 0 0 34px rgba(1,204,247,.35); }
  #sock .fr .cp { position: absolute; left: 92px; top: 26px; width: 68px; height: 68px; color: #6adfff; }
  #sock .fr .cp svg { width: 68px; height: 68px; }
  #sock .fr b { position: absolute; left: 0; top: 102px; width: 252px; text-align: center; font: 700 30px/40px Poppins; color: #fff; letter-spacing: 3px; }
  #sock .fr span { position: absolute; left: 0; top: 140px; width: 252px; text-align: center; font: 400 20px/26px Poppins; color: #9fdcf2; }
  #sock .ft { position: absolute; left: 24px; top: 258px; width: 256px; font: 400 19px/28px Poppins; color: #9fdcf2; white-space: normal; }
  #sock .ft b { color: #fff; }
  .op { position: absolute; left: 320px; width: 640px; height: 102px; border-radius: 26px; background: rgba(12,22,64,.86);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.10), 0 16px 32px rgba(2,6,26,.4); }
  .op.on { box-shadow: inset 0 0 0 2.5px #6adfff, 0 0 30px rgba(1,204,247,.45); }
  .op .ib { position: absolute; left: 18px; top: 17px; width: 68px; height: 68px; border-radius: 20px; background: rgba(1,204,247,.14); box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.45); color: #6adfff; }
  .op .ib svg { position: absolute; left: 17px; top: 17px; width: 34px; height: 34px; }
  .op b { position: absolute; left: 104px; top: 14px; font: 700 31px/42px Poppins; color: #fff; white-space: nowrap; }
  .op span { position: absolute; left: 104px; top: 56px; font: 400 21px/30px Poppins; color: #9fdcf2; white-space: nowrap; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #r { z-index: 21; } #m { z-index: 22; }
  #kb { position: absolute; left: 0; top: 0; width: 300px; height: 100px; margin: -50px 0 0 -150px; opacity: .9; transform-origin: 50% 50%; z-index: 23; }
  #kb .pl { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(1,204,247,.30), rgba(1,204,247,.10));
    box-shadow: 0 0 0 1.5px rgba(106,223,255,.7), 0 0 26px rgba(1,204,247,.55), inset 0 0 18px rgba(1,204,247,.25); }
  #kb .ks { position: absolute; left: 16px; top: 13px; width: 268px; height: 74px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
  #kb .ks i { display: block; border-radius: 4px; background: rgba(160,235,255,.22); box-shadow: inset 0 0 0 1px rgba(160,235,255,.35); }
  #kb .ks i.on { background: rgba(220,250,255,.95); box-shadow: 0 0 10px rgba(1,204,247,.95); }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div>
  <div id="rig"></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <div id="kb"><div class="pl"></div><div class="ks" id="keys"></div></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR">
  <div id="chip" class="ctr"><span><b>OPEN SOURCE</b>DARI DEEPSEEK<i></i>MIT</span></div>
  <div id="l1" class="ctr"><span class="mk" id="mk"></span><span>Agen AI buat</span></div>
  <div id="h1" class="ctr"><span>NGODING</span></div>
  <div id="l3" class="ctr">tanpa <b>langganan bulanan</b></div>
  <div class="grain"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const K = window.R11K, M3 = window.Mascot3D;
  document.getElementById("mk").innerHTML = K.svg("code");
  const OPS = [["coins", "DeepSeek API", "bayar per pemakaian"], ["key", "Claude &middot; GPT &middot; dll.", "pakai API key provider-nya"], ["laptop", "Model lokal &middot; Ollama", "tanpa tagihan API"]];
  document.getElementById("rig").innerHTML =
    `<div id="sock"><div class="k-lab">PILIH OTAKNYA</div><div class="fr"><div class="cp">${K.svg("cpu")}</div><b>OTAK</b><span>model AI</span></div>` +
    `<div class="ft">harness-nya <b>gratis (MIT)</b></div></div>` +
    OPS.map(([ic, b, s], i) => `<div class="op${i === 0 ? " on" : ""}" style="top:${i * 114}px"><div class="ib">${K.svg(ic)}</div><b>${b}</b><span>${s}</span></div>`).join("");
  document.getElementById("keys").innerHTML = Array.from({ length: 30 }, (_, i) => `<i class="${[3, 7, 12, 16, 21, 25, 28].includes(i) ? "on" : ""}"></i>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    const fx = P("rx", "860"), fy = P("ry", "1700"), hh = P("rh", "330");
    rb.setView({ fx, fy, h: hh, pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0.05, ry: P("bry", "-0.12"), rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] + 0.1, HF[1] - 0.16, HF[2]], hand_L: [0.55, 0, 0], hand_R: [0.6, 0, 0] },
      offs: { hand_L: [-0.09, -0.06, 0.15], hand_R: [0.09, -0.07, 0.15], head: [0, 0, 0] },
      face: { blink: 0, gaze: [-0.24, 0.12], happy: 0.8, squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.4, shadow: false });
    rb.render();
    const kb = document.getElementById("kb"), x = fx - 0.06 * hh, y = fy - 0.1 * hh;
    kb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) perspective(600px) rotateX(52deg) scale(1)`;
  }
  async function buildMascot() {
    const src = await (await fetch("../compositions/mascot.html")).text();
    const FACE = JSON.parse(src.match(/const FACE = (\{.*?\});\n/s)[1]);
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.9; o.color.setRGB(0.5, 0.86, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct([["lihat", 0.3, 3.2, 1]], 6, { intents: [{ t: 0.3, action: q.get("act") || "point", side: q.get("side") || "right" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 6.05, { smooth: 1 });
    m.setView({ fx: P("mx", "290"), fy: P("my", "1905"), h: P("mh", "600"), yaw: 0, pitch: 4 });
    const pf = PERF(P("pt", "0.9")), B = Object.assign({}, pf.bones);
    m.setState({ root: { x: pf.root.x, y: pf.root.y, ry: P("mry", "0.22"), rz: 0, rx: 0, s: 1 }, bones: B,
      face: { blink: [0, 0], gaze: [0, 0], mouthMix: 1, mouth: [0.03, 0.012, 0.012, 0.5] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, q.get("nor") ? 0 : buildRobot(), q.get("nom") ? 0 : buildMascot()]);
</script>
</body>
</html>

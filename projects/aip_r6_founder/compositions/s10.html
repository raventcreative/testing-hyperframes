  <script>
    (function () {
      // s10 "Ingat, panelnya simulasi. Jadi ide yang menang, tes lagi ke pembeli beneran."
      // START: empty stage · the PANEL (100 avatars) in a box · "simulasi.": the box turns dashed violet, the SIMULASI tag slams, the

      const D = 4.5333, ST = 42.1333, VW = window.VO_WORDS, R6 = window.R6;
      const L = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 0.05); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);

      h += R6.crowd("s10", 100, 346);
      h += `<div class="s10-a" id="s10-tag">${R6.svg("flask", 2.2)}SIMULASI</div><div class="s10-a" id="s10-tn">angka beli = batas atas, bukan ramalan</div>`;

      h += `<div class="s10-a r6-card" id="s10-win"><div class="s10-a" id="s10-wi">${R6.svg("star", 2.2)}</div><div class="s10-a r6-grad" id="s10-wt">Ide yang menang</div>` +

      h += `<div class="s10-ar" id="s10-ar1" style="top:744px">${R6.svg("arrowD", 2.4)}</div>`;

      const cam = $("s10-cam"), glow = $("s10-glow"), box = $("s10-box"), cr = $("s10-cr"), tag = $("s10-tag"), tn = $("s10-tn"), a0 = $("s10-ar0"), a1 = $("s10-ar1"),

      I(glow, { opacity: 0 }); ft(glow, { opacity: 0 }, { opacity: 0.9, duration: 0.3 }, 0);
      I(box, { opacity: 0, scale: 0.96 }); ft(box, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.0);
      I(cr, { opacity: 0, y: 20 }); ft(cr, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.04);
      ft(cr, { opacity: 1 }, { opacity: 0.42, duration: 0.3 }, tSim + 0.05);
      I(tag, { opacity: 0, scale: 1.8, rotation: -6 });
      ft(tag, { opacity: 0, scale: 1.8, rotation: -6 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.22, ease: "power4.in" }, tSim - 0.12);
      [[0, 6], [0, -4], [0, 2], [0, 0]].forEach(([x, y], k) => tl.set(cam, { x, y }, tSim + 0.1 + k * 0.034));
      ft(box, { scale: 1 }, { scale: 1.015, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, tSim + 0.08);
      I(tn, { opacity: 0, x: -10 }); ft(tn, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" }, tSim + 0.35);
      // "ide yang menang"

      I(win, { opacity: 0, y: -30, scale: 0.7 }); ft(win, { opacity: 0, y: -30, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.8)" }, tMen - 0.22);
      I(wi, { rotation: -90, scale: 0.6 }); ft(wi, { rotation: -90, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, tMen - 0.15);
      // "tes lagi ke pembeli beneran"
      I(a1, { opacity: 0, y: -10 }); ft(a1, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, tTes - 0.2);
      I(rl, { opacity: 0, y: 40 }); ft(rl, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.32, ease: "back.out(1.4)" }, tTes - 0.12);
      PX.forEach((x, k) => {
        const p = $("s10-p" + k), ok = $("s10-k" + k);
        I(p, { opacity: 0, scale: 0.3 }); ft(p, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2.4)" }, tPem - 0.12 + k * 0.07);
        I(ok, { opacity: 0, scale: 0.3 }); ft(ok, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.6)" }, Math.min(tBen + 0.12 + k * 0.06, D - 0.5));
      });

      // ================================================================ TRANSITION → s11
      const tOut = D - 0.24;
      ft([box, tag, tn], { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.2, ease: "power2.in" }, tOut);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s10"] = tl;
    })();

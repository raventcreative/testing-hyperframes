            veils.forEach((v, j) => { if (j !== i) tl.to(v, { opacity: 1, duration: 0.25, ease: "power2.out" }, t - 0.22); });
            tl.to(veils[i], { opacity: 0, duration: 0.25, ease: "power2.out" }, t - 0.22);
            tl.to(tabs[i], { backgroundColor: "#294b77", color: "#fbfcfe", duration: 0.15 }, t);
            tl.fromTo(tabs[i], { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t);
          });
          tl.to(veils, { opacity: 0, duration: 0.35, ease: "power2.out" }, 4.48);
          // checks (panel badge + header pill + note checkbox)
          const CT = [1.42, 2.18, 3.02, 3.9, 4.5];
          tl.set(chks, { scale: 0, opacity: 0 }, 0);
          tl.set(pfs, { scaleX: 0, transformOrigin: "0% 50%" }, 0);
          tl.set(nks, { scale: 0, transformOrigin: "50% 50%" }, 0);
          CT.forEach((t, i) => {
            tl.fromTo(chks[i], { scale: 0, opacity: 0, rotation: -60 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, t);
            tl.fromTo(pfs[i], { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo(nks[i], { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)", immediateRender: false }, t + 0.04);
          });
          // finale stamp + sweep
          const stamp = q(".s08-stamp");
          tl.set(stamp, { opacity: 0, scale: 2.2, rotation: -40 }, 0);
          tl.fromTo(stamp, { opacity: 0, scale: 2.2, rotation: -40 }, { opacity: 1, scale: 1, rotation: -12, duration: 0.18, ease: "power4.in", immediateRender: false }, 4.72);
          tl.fromTo(q(".s08-note"), { y: 0 }, { y: 5, duration: 0.05, yoyo: true, repeat: 1, immediateRender: false }, 4.9);
          tl.fromTo(q(".s08-bsweep"), { x: -460 }, { x: 900, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 4.62);

          // ---------- P1 style: swatch fan ----------
          strips.forEach((s, i) => {
            const pre = (i - 4) * 1.4, fan = -56 + i * 14;
            tl.set(s, { transformOrigin: "22px 190px", rotation: pre }, 0);
            tl.fromTo(s, { rotation: pre }, { rotation: fan, duration: 0.5, ease: "back.out(1.3)", immediateRender: false }, T.style + Math.abs(i - 4) * 0.025);
            tl.fromTo(s, { rotation: fan }, { rotation: fan * 1.05, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 1.8);
          });
          tl.fromTo(strips[1], { y: 0 }, { y: -16, duration: 0.25, ease: "back.out(2)" }, 1.36);
          tl.fromTo(q(".s08-dsh"), { scaleX: 0.4 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, T.style);

          // ---------- P2 ritme: metronome + waveform ----------
          const arm = q(".s08-arm");
          const BEAT = 0.38, NB = Math.floor((D - T.ritme) / BEAT);
          tl.set(arm, { svgOrigin: "82 182", rotation: -26 }, 0);
          tl.fromTo(arm, { rotation: -26 }, { rotation: 26, duration: BEAT, ease: "sine.inOut", yoyo: true, repeat: NB - 1, immediateRender: false }, T.ritme);
          bars.forEach((b, i) => { tl.set(b, { scaleY: 0.1 + 0.06 * Math.sin(i * 1.3) + 0.04, transformOrigin: "50% 50%" }, 0); });
          tl.fromTo(bars, { scaleY: 0.12 }, { scaleY: 0.22, duration: 0.3, stagger: { each: 0.03, yoyo: true, repeat: 1 }, ease: "sine.inOut", immediateRender: false }, 0.6);
          const bdots = qa(".s08-bd");
          tl.set(bdots, { backgroundColor: "#e2eaf5" }, 0);
          for (let k = 0; k <= NB; k++) {
            const tb = T.ritme + k * BEAT;
            if (tb > D - 0.05) break;
            bars.forEach((b, i) => {
              const env = 0.55 + 0.45 * Math.sin((i / 13) * Math.PI);
              const h = Math.min(1, (0.35 + rnd() * 0.65) * env + (k === 0 ? 0.15 : 0));
              tl.fromTo(b, { scaleY: 0.14 }, { scaleY: h, duration: 0.07, ease: "power2.out", immediateRender: false }, tb + i * 0.006);
              tl.fromTo(b, { scaleY: h }, { scaleY: 0.14, duration: BEAT - 0.1, ease: "power2.in", immediateRender: false }, tb + 0.07 + i * 0.006);
            });
            tl.fromTo(bdots[k % 4], { backgroundColor: "#294b77", scale: 1.35 }, { backgroundColor: "#e2eaf5", scale: 1, duration: BEAT, ease: "power2.out", immediateRender: false }, tb);
          }

          // ---------- P3 komposisi: subject snaps to a thirds intersection ----------
          const subj = q(".s08-subj");
          tl.set(subj, { x: 146, y: 86 }, 0);
          tl.fromTo(subj, { y: 86 }, { y: 80, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.2);
          tl.fromTo(subj, { x: 146, y: 86 }, { x: 202, y: 58, duration: 0.26, ease: "back.out(1.7)", immediateRender: false }, T.komp);
          tl.fromTo(qa(".s08-gv"), { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.25, stagger: 0.05, ease: "power3.out" }, 2.06);
          tl.fromTo(qa(".s08-gh"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.25, stagger: 0.05, ease: "power3.out" }, 2.12);
          tl.fromTo(qa(".s08-ix"), { scale: 0 }, { scale: 1, duration: 0.2, stagger: 0.03, ease: "back.out(2)" }, 2.2);
          tl.fromTo(q(".s08-ixt"), { backgroundColor: "rgba(255,255,255,0)" }, { backgroundColor: "#294b77", duration: 0.15 }, T.komp + 0.1);
          const brs = qa(".s08-br");
          const BS = [[120, 22], [300, 22], [120, 176], [300, 176]], BE = [[190, 46], [238, 46], [190, 128], [238, 128]];
          brs.forEach((b, i) => {
            tl.set(b, { x: BS[i][0], y: BS[i][1], opacity: 0.5 }, 0);
            tl.fromTo(b, { x: BS[i][0], y: BS[i][1], opacity: 0.5 }, { x: BE[i][0], y: BE[i][1], opacity: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false }, T.komp + 0.06);
          });
          tl.set(q(".s08-iring"), { opacity: 0 }, 0);
          tl.fromTo(q(".s08-iring"), { scale: 0.3, opacity: 1 }, { scale: 1.8, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, T.komp + 0.2);
          tl.fromTo(q(".s08-rec"), { opacity: 1 }, { opacity: 0.2, duration: 0.3, yoyo: true, repeat: 7, ease: "steps(1)" }, 0.2);

          // ---------- P4 transisi: circle -> square across frames ----------
          const RAD = ["50%", "34%", "18%", "5%"];
          shapes.forEach(([f, s], i) => {
            tl.set(s, { borderRadius: "50%", opacity: 0.4, scale: 0.8 }, 0);
            const t = T.trans + 0.04 + i * 0.16;
            tl.fromTo(s, { borderRadius: i ? RAD[i - 1] : "50%", opacity: 0.4, scale: 0.6, rotation: -45 }, { borderRadius: RAD[i], opacity: 1, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
            tl.fromTo(f, { boxShadow: "inset 0 0 0 2px rgba(255,255,255,0.4)" }, { boxShadow: "inset 0 0 0 4px #acc6e7", duration: 0.15, immediateRender: false }, t);
          });
          const plh = q(".s08-plh");
          tl.set(plh, { x: 0 }, 0);
          tl.fromTo(plh, { x: 0 }, { x: 352, duration: 0.7, ease: "power1.inOut", immediateRender: false }, T.trans);
          tl.fromTo(film, { x: 10 }, { x: 0, duration: 0.6, ease: "power3.out" }, 2.9);

          // ---------- P5 hierarki: type scale stacks with weight ----------
          const blks = qa(".s08-blk"), slots = qa(".s08-slot"), wls = qa(".s08-wl");
          tl.set(blks, { y: -90, opacity: 0, transformOrigin: "50% 100%" }, 0);
          tl.set(wls, { scaleX: 0, transformOrigin: "0% 50%" }, 0);
          tl.fromTo(blks, { y: -90, opacity: 0 }, { y: -30, opacity: 1, duration: 0.24, stagger: 0.05, ease: "power3.out", immediateRender: false }, T.dan - 0.04);
          tl.fromTo(slots, { borderColor: "rgba(58,98,153,0.35)" }, { borderColor: "rgba(58,98,153,0.9)", duration: 0.2, stagger: 0.05 }, T.dan);
          blks.forEach((b, i) => {
            const hit = T.hier + i * 0.09;
            tl.fromTo(b, { y: -30 }, { y: 0, duration: 0.12, ease: "power3.in", immediateRender: false }, hit - 0.12);
            tl.fromTo(b, { scaleY: 0.86, scaleX: 1.06 }, { scaleY: 1, scaleX: 1, duration: 0.32, ease: "elastic.out(1.1, 0.45)", immediateRender: false }, hit);
            tl.fromTo(wls[i], { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, hit);
          });
          tl.to(slots, { opacity: 0, duration: 0.2 }, T.hier + 0.25);
          tl.set(dust.map((d) => d[2]), { opacity: 0 }, 0);
          dust.forEach(([b, i, el]) => {
            const hit = T.hier + b * 0.09, dir = i < 3 ? -1 : 1;
            tl.fromTo(el, { x: 0, y: 0, scale: 1, opacity: 0.9 }, { x: dir * (30 + (i % 3) * 22), y: -10 - (i % 3) * 8, scale: 0.3, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, hit);
          });

          window.__timelines["s08"] = tl;
        })();
      </script>
    </template>

<template>
  <script src="assets/presenter.js"></script>
  <style>
    #e14-root { position: absolute; inset: 0; overflow: hidden; }
    .e14-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
    #e14-dim { background: radial-gradient(ellipse 620px 560px at 540px 640px, rgba(4,10,30,0.25), rgba(3,7,22,0.78)); opacity: 0; }
    #e14-doodle { overflow: visible; }
  </style>
  <div id="e14-root" data-composition-id="e14" data-width="1080" data-height="1350">
    <div id="e14-bd" class="e14-layer"></div>
    <div id="e14-dim" class="e14-layer"></div>
    <div id="e14-figwrap" class="e14-layer"></div>
    <svg id="e14-doodle" class="e14-layer" viewBox="0 0 1080 1350" data-layout-ignore>
      <g id="e14-sil" transform="translate(220,380)">
        <path id="e14-glow" fill="none" stroke="#00c9ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.16" pathLength="1"/>
        <path id="e14-line" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
        <path id="e14-line2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" pathLength="1"/>
      </g>
      <g id="e14-icoL"><path id="e14-bulb" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="e14-bulbA" fill="none" stroke="#00c9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="e14-icoR"><path id="e14-star" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="e14-starA" fill="none" stroke="#00c9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
      <path id="e14-arrow" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
      <path id="e14-emo" fill="none" stroke="#00c9ff" stroke-width="6" stroke-linecap="round"/>
      <path id="e14-under" fill="none" stroke="#00c9ff" stroke-width="7" stroke-linecap="round" pathLength="1"/>
    </svg>
    <div id="e14-cap" class="k-cap" style="opacity:0">Konten jadi <span class="hl">hidup</span>.</div>
    <div id="e14-chrome" class="e14-layer"></div>
  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const ei = (x) => Math.pow(clamp(x, 0, 1), 3);
      const eb = (x) => { x = clamp(x, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const H = window.HFP;
      document.getElementById("e14-bd").innerHTML = H.backdropHTML("e14b");
      const R = H.mount(document.getElementById("e14-figwrap"), "e14f");
      document.getElementById("e14-chrome").innerHTML = H.chromeHTML("e14c", 14, "Doodle Boil");
      const $ = (id) => document.getElementById("e14-" + id);

      // ---- hand-wobble: sample a path, push each point along its normal by a fixed pseudo-noise, rebuild a smooth curve
      const NS = "http://www.w3.org/2000/svg";
      const probe = document.createElementNS(NS, "path");
      $("doodle").appendChild(probe); probe.setAttribute("visibility", "hidden");
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      function wobble(d, seed, amp, step, push) {
        let out = "";
        for (const sub of d.split(/(?=M)/)) {
          const closed = /Z\s*$/i.test(sub);
          probe.setAttribute("d", sub);
          const L = probe.getTotalLength(), n = Math.max(3, Math.round(L / step));
          const raw = [];
          for (let i = 0; i <= n; i++) { const p = probe.getPointAtLength((closed ? i % n : i) / n * L); raw.push([p.x, p.y]); }
          const pts = raw.map((p, i) => {
            const a = raw[Math.max(0, i - 1)], b = raw[Math.min(raw.length - 1, i + 1)];
            let dx = b[0] - a[0], dy = b[1] - a[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
            const k = closed ? i % n : i;
            const nz = Math.sin(k * 0.55 + seed * 2.1) * 0.55 + Math.sin(k * 1.37 + seed * 5.3) * 0.3 + (hash(k + seed * 97) - 0.5) * 0.5;
            const off = push + amp * nz;
            return [p[0] + dy * off, p[1] - dx * off];
          });
          if (closed) pts[pts.length - 1] = pts[0];
          // Catmull-Rom → cubic Bezier
          let s = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
            s += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " +
              (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
          }
          out += s + " ";
        }
        return out;
      }
      // silhouette without the off-frame bottom edge (open path up the left side, over the head, down the right)
      const SILOPEN = H.SIL.replace(/^M20 1000 /, "M24 1010 L30 600 ").replace(/ L620 1000 Z$/, " L622 1010").replace("M24 1010 L30 600 L30 600", "M24 1010 L30 600");
      const V = [0, 1, 2].map((k) => ({
        main: wobble(SILOPEN, k + 1, 6.5, 19, 7),
        sec: wobble(SILOPEN, k + 7, 6.5, 22, 18),
      }));
      // doodle icons (frame coords): light bulb top-left, sparkle star top-right
      const BULB = "M200 330 C160 312 146 268 162 232 C176 200 224 192 246 216 C270 242 262 290 236 312 L236 334 Z M206 346 L236 346 M208 360 L232 360 M214 372 L228 372";
      const BULBA = "M140 196 L124 182 M200 168 L200 146 M262 196 L278 182 M128 262 L106 264 M272 262 L294 264";
      const STAR = "M880 172 L898 230 L958 236 L912 272 L928 330 L880 296 L832 330 L848 272 L802 236 L862 230 Z";
      const STARA = "M976 186 L976 214 M962 200 L990 200 M790 312 L790 332 M780 322 L800 322";
      const ICO = [0, 1, 2].map((k) => ({
        bulb: wobble(BULB, k + 11, 2.2, 12, 0), bulbA: wobble(BULBA, k + 21, 2.0, 8, 0),
        star: wobble(STAR, k + 31, 2.4, 12, 0), starA: wobble(STARA, k + 41, 1.6, 8, 0),
        arrow: wobble("M276 384 C320 430 350 436 392 432 M372 414 L394 432 L372 448", k + 51, 1.8, 10, 0),
        emo: wobble("M698 456 L728 436 M704 494 L740 492 M698 530 L728 550", k + 61, 1.6, 8, 0),
        under: wobble("M584 1268 C640 1262 700 1266 760 1258", k + 71, 1.6, 12, 0),
      }));
      probe.remove();

      function setDash(el, f) { el.setAttribute("stroke-dasharray", "1 1"); el.setAttribute("stroke-dashoffset", (1 - f).toFixed(4)); }
      function render(t) {
        H.animate(R, t);
        const k = Math.floor(t / 0.1 + 1e-6) % 3;                      // boil: new hand-drawn variant every 0.1 s
        const out = ei(seg(t, 3.4, 3.85));
        const dim = eo(seg(t, 0.15, 0.55)) * (1 - out);
        $("dim").style.opacity = dim.toFixed(3);
        // outline draws on (0.25–0.75 s), erases at the end
        const draw = eo(seg(t, 0.25, 0.75)) * (1 - out);
        for (const id of ["glow", "line"]) { $(id).setAttribute("d", V[k].main); setDash($(id), draw); }
        $("line2").setAttribute("d", V[k].sec); setDash($("line2"), eo(seg(t, 0.45, 0.95)) * (1 - out));
        // icons pop in with an overshoot and boil along with the outline
        const pl = eb(seg(t, 0.55, 0.9)) * (1 - ei(seg(t, 3.3, 3.65)));
        const pr = eb(seg(t, 0.68, 1.03)) * (1 - ei(seg(t, 3.35, 3.7)));
        $("bulb").setAttribute("d", ICO[k].bulb); $("bulbA").setAttribute("d", ICO[k].bulbA);
        $("star").setAttribute("d", ICO[k].star); $("starA").setAttribute("d", ICO[k].starA);
        const tilt = [0, 1.2, -1][k];
        $("icoL").setAttribute("transform", "translate(204 270) rotate(" + (tilt - 4) + ") scale(" + Math.max(0.001, pl).toFixed(3) + ") translate(-204 -270)");
        $("icoR").setAttribute("transform", "translate(880 252) rotate(" + (-tilt + 6) + ") scale(" + Math.max(0.001, pr).toFixed(3) + ") translate(-880 -252)");
        $("icoL").setAttribute("opacity", clamp(pl * 3, 0, 1).toFixed(3)); $("icoR").setAttribute("opacity", clamp(pr * 3, 0, 1).toFixed(3));
        $("arrow").setAttribute("d", ICO[k].arrow); setDash($("arrow"), eo(seg(t, 0.95, 1.3)) * (1 - ei(seg(t, 3.25, 3.6))));
        $("emo").setAttribute("d", ICO[k].emo); $("emo").setAttribute("opacity", (clamp(seg(t, 1.0, 1.15) * 1, 0, 1) * (1 - seg(t, 3.3, 3.5))).toFixed(3));
        const cap = $("cap"), c = eo(seg(t, 0.35, 0.65)) * (1 - seg(t, 3.5, 3.8));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px) rotate(" + [-0.6, 0.4, 0][k] + "deg)";
        $("under").setAttribute("d", ICO[k].under); setDash($("under"), eo(seg(t, 0.75, 1.05)) * (1 - seg(t, 3.45, 3.75)));
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e14"] = tl;
    })();
  </script>
</template>

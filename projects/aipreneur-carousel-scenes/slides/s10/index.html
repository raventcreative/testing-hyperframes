<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1350" />
<title>AIpreneur — Ribbon twist</title>
<script src="vendor/gsap/dist/gsap.min.js"></script>
<link rel="stylesheet" href="assets/shared.css" />
<style>
#cv { position:absolute; inset:0; }
</style>
</head>
<body>
<div id="root" data-composition-id="s10" data-start="0" data-duration="6" data-width="1080" data-height="1350" data-fps="30">
  <div id="stage" class="clip" data-start="0" data-duration="6" data-track-index="0" data-track-kind="graphics" style="position:absolute;inset:0">
    <div class="bg"></div>
    <div class="logo" id="logo"></div>
    <div class="eyebrow g b" id="eyebrow">SCENE · 10 DARI 16</div>
    <div class="title" id="title"><span class="g b">Ribbon</span><svg class="arrow" width="78" height="52" viewBox="0 0 78 52"><defs><linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="#121532"/><stop offset="1" stop-color="#274976"/></linearGradient></defs><path d="M4 26H70M48 6l22 20-22 20" fill="none" stroke="url(#ag)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></svg><span class="g r">twist</span></div>
    <div class="sub g r" id="sub">Pita sutra yang berputar</div>
    <div class="card" id="card">
      <div class="panel dark" id="panel">
        <canvas id="cv" width="1608" height="1404" style="width:804px;height:702px"></canvas>
      </div>
    </div>
    <div class="swap" id="swap">
      <div class="lbl g b">GANTI DI SCENE INI</div>
      <div class="txt g r">Pita sutra dari sekitar 26 helai gradasi tipis yang berputar di ruang 3D di atas navy gelap, dengan cahaya berbeda di sisi depan dan belakang.</div>
    </div>
    <div class="foot" id="foot">
      <div class="who"><div class="dot">FK</div><span class="g b">FREDDIE KASHAWAN</span><span class="g r">AIpreneur</span></div>
      <div class="pg g b">11 / 18 &nbsp;&nbsp; GESER &rarr;</div>
    </div>
  </div>
</div>
<script>
(function () {
  const D = 6, TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (p) => { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); };
  const tl = gsap.timeline({ paused: true });
  const st = { t: 0 };

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const W = 804, H = 702, N = 26;
  const stops = [[0, [127, 208, 255]], [0.5, [79, 134, 232]], [1, [214, 228, 255]]];
  function col(u) {
    u = clamp(u, 0, 1);
    const i = u < 0.5 ? 0 : 1, a = stops[i], b = stops[i + 1], p = (u - a[0]) / (b[0] - a[0]);
    return a[1].map((c, j) => c + (b[1][j] - c) * p);
  }
  function render(t) {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 1.5; ctx.lineCap = "round";
    const ph = TAU * t / D;
    for (let i = 0; i < N; i++) {
      const s = -1 + 2 * i / (N - 1);
      let px = null, py = 0;
      for (let x = -24; x <= W + 24; x += 5) {
        const u = x / W;
        const cy = H * 0.5 + 118 * Math.sin(TAU * u * 1.05 - ph);
        const th = TAU * u * 0.85 + ph;
        const amp = 104 * (0.7 + 0.3 * Math.sin(Math.PI * clamp(u, 0, 1)));
        const y = cy + s * amp * Math.cos(th);
        if (px !== null) {
          const front = Math.cos(th) >= 0;
          const c = col(u), lit = front ? 1 : 0.55;
          const edge = 0.55 + 0.45 * Math.abs(Math.sin(th));
          ctx.strokeStyle = "rgba(" + (c[0] * lit) + "," + (c[1] * lit) + "," + (c[2] * (front ? 1 : 0.8)) + "," + (0.5 * edge + 0.24).toFixed(3) + ")";
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
        }
        px = x; py = y;
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  tl.to(st, { t: D, duration: D, ease: "none", onUpdate: () => render(st.t) }, 0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["s10"] = tl;
})();
</script>
</body>
</html>

<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #m-canvas { position: absolute; left: 0; top: 0; width: 2160px; height: 2700px; }
  </style>
  <div id="root" data-composition-id="mascot" data-width="2160" data-height="2700">
    <canvas id="m-canvas" width="2160" height="2700" data-layout-ignore data-layout-allow-occlusion></canvas>
  </div>
  <script>
    (function () {
      // AIpreneur rigged GLB mascot (same asset as the 20-effects / Six Worlds projects), talking + gesturing,
      // a seamless 4.0 s loop: every motion term is periodic in 4 s or settles to the frame-0 pose before 4 s.
      const M3 = window.Mascot3D, D = 4;
      const canvas = document.getElementById("m-canvas");
      const TAU = Math.PI * 2, per = (k, ph) => Math.sin((TAU * k) / D * 0 + ph); // placeholder (unused)
      const P = (t, k, ph) => Math.sin(TAU * k * t / D + (ph || 0));            // periodic in D
      // gestures (both arms), head acting — keys settle back to rest before 3.6 s
      const PERF = M3.buildPerformance({
        armR: [[0, "low", 0.3], [0.35, "explainHi", 0.3], [1.15, "present", 0.32], [1.9, "low", 0.38], [2.2, "together", 0.3], [3.0, "low", 0.42]],
        armL: [[0, "low", 0.3], [0.55, "explain", 0.32], [1.3, "low", 0.38], [1.65, "palmUp", 0.3], [2.2, "together", 0.3], [3.0, "low", 0.42]],
        head: [[0, [0, 0, 0], 0.4], [0.5, [0.03, -0.12, 0.03], 0.4], [1.3, [-0.02, 0.1, -0.03], 0.45], [2.15, [0.06, 0, 0], 0.35], [2.95, [0, 0, 0], 0.5]],
      }, D);
      // synthetic speech: vowels every ~0.15 s with two breaths, closed at the loop point
      const V = "aeoaiueoaeaoiaeuoaeiao";
      const phones = [], env = new Array(D * 100 + 2).fill(0);
      let t0 = 0.18, k = 0;
      while (t0 < 3.45) {
        if ((t0 > 1.28 && t0 < 1.52) || (t0 > 2.55 && t0 < 2.78)) { t0 += 0.06; continue; }
        const d = 0.1 + 0.04 * ((k * 7) % 3) / 2;
        phones.push([V[k % V.length], t0, t0 + d]);
        for (let i = Math.floor(t0 * 100); i < Math.ceil((t0 + d) * 100) && i < env.length; i++) env[i] = 88;
        t0 += d + 0.05; k++;
      }
      const mouthAt = M3.buildLipTrack(phones, env, D);

      let mascot = null;
      const VIEW = { fx: 1080, fy: 2384, h: 2000, yaw: 0, pitch: 5 };
      function apply(t) {
        const Pf = PERF(t);
        const b = Pf.bones;
        const addB = (n, v) => { const a = b[n] || [0, 0, 0]; b[n] = [a[0] + v[0], a[1] + v[1], a[2] + v[2]]; };
        addB("chest", [0.012 * P(t, 1), 0, 0]);
        addB("spine", [0, 0.03 * P(t, 1, 0.7), 0.02 * P(t, 2, 1.1)]);
        addB("head", [0.02 * P(t, 3, 0.4), 0.03 * P(t, 1, 2.0), 0.02 * P(t, 2, 0.3)]);
        const root = { x: Pf.root.x, y: Pf.root.y, ry: Pf.root.ry + 0.03 * P(t, 1, 0.5), rz: Pf.root.rz, rx: 0, s: Pf.root.s };
        mascot.setView(VIEW);
        mascot.setState({ root, bones: b, face: { blink: [0, 0], mouthMix: 1, mouth: mouthAt(t) } });
        mascot.render();
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const FACE = {"eyeA":{"c":[-0.099,0.583],"r":[0.049,0.039],"J":[-0.012594276485253965,0.5728894913572795,0.5928449952437722,0.008744878544633893]},"eyeB":{"c":[0.1,0.584],"r":[0.046,0.04],"J":[0.6644280491730516,0.030130365931821397,0.015549679888023958,-0.6054649097597234]},"browA":{"c":[-0.085,0.675],"J":[-0.04070834735419224,0.5537413339891137,0.591952051964936,0.06466756331213208]},"browB":{"c":[0.089,0.674],"J":[-0.1673063019885604,0.6553582065976762,0.5221243728997077,0.18775902203022735]},"mouth":{"c":[0.001,0.521],"r":[0.0266,0.0164]},"skin":[243,207,186],"skinEye":[246,214,195]};
      const ready = M3.Mascot.create(canvas, { url: "assets/mascot3d/mascot_rigged_v4.glb", face: FACE, width: 2160, height: 2700, envIntensity: 0.55 })
        .then((m) => {
          mascot = m;
          for (const o of m.scene.children) {
            if (!o.isDirectionalLight) continue;
            if (o.position.z < 0) { o.intensity = 2.6; o.color.setRGB(0.62, 0.9, 1.0); o.position.set(1.6, 1.5, -1.4); }
          }
          apply(0);
        });
      window.__hf.buildReady["mascot"] = ready;
      window.addEventListener("hf-seek", (e) => {
        const t = e.detail.time;
        if (mascot) apply(t);
        else if (e.detail.waitUntil) e.detail.waitUntil(ready.then(() => apply(t)));
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, D - 0.02);
      window.__timelines["mascot"] = tl;
    })();
  </script>
</template>

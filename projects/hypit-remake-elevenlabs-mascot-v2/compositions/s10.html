  <script>
    (function () {

      const qa = (s) => R.querySelectorAll(s);

      const pop = (sel, t, out) => {
        tl.fromTo(sel, { scale: 0, rotation: -14 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t);
        if (out) tl.to(sel, { scale: 0, duration: 0.2, ease: "power2.in" }, out);

        qa(".s10-pt").forEach((el, i) => {
          const dy = 40 + ((i * 37) % 70), dx = Math.round(16 * Math.sin(i * 1.7));
          gsap.set(el, { x: 0, y: 0 });
          tl.fromTo(el, { x: 0, y: 0 }, { x: dx, y: -dy, duration: dur, ease: "none", immediateRender: false }, 0);
        });
      };
      const chase = (sels, t0, step, on, off) => {
        sels.forEach((s, i) => {
          tl.fromTo(s, { fill: off }, { fill: on, duration: 0.05, immediateRender: false }, t0 + i * step);
          tl.to(s, { fill: off, duration: 0.12 }, t0 + i * step + 0.1);
        });
      };
      gsap.set("#s10-pu1", { scale: 0, rotation: -14, svgOrigin: "220 1334" });
      gsap.set("#s10-pu2", { scale: 0, rotation: -14, svgOrigin: "860 1334" });

      const A = 0.783; // 'dipertahankan,'

      gsap.set("#s10-near", { x: 0, y: 0 });
      driftParts(1.76);

      tl.fromTo("#s10-xf", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 0);

      tl.fromTo("#s10-near", { x: 0, y: 0 }, { x: 60, y: -26, duration: 1.76, ease: "none", immediateRender: false }, 0);

      // pop-ups along the base: film + grid ('Formatnya') + lock ('bisa')
      pop("#s10-pu1", 0.1, null);
      pop("#s10-pu2", 0.19, null);
      pop("#s10-pu3", 0.40, null);
      chase(leds, 0.12, 0.06, "#ffffff", "#9fb6d6");

      // 'Formatnya bisa': frame descends along the rails and aligns
      tl.fromTo("#s10-frame", { y: -50 }, { y: -8, duration: 0.58, ease: "power2.inOut", immediateRender: false }, 0.02);
      // anticipation: tiny lift, latches cock open
      tl.to("#s10-frame", { y: -18, duration: 0.1, ease: "power2.out" }, 0.6);

      tl.to("#s10-pun", { scale: 1.03, duration: 0.35, ease: "back.out(2)" }, A + 0.07);

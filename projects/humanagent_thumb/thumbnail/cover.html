<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — 1 Human Agent setara 10 orang</title>
<!-- Elegant IG Reels cover 1080x1920 for Freddie's talking-head "Human Agent + AI" video. Navy palette, one soft-blue accent,
     Poppins 700/400 with generous tracking. Subject = a local background-removed still from the video (0.3 s), faded into navy at
     the chest (the burned-in caption sits there). Behind the head: a hairline ring with 10 nodes = "1 human, 10 functions".
     Everything that matters sits inside the 4:5 grid crop (y 285–1635). Render: node thumbnail/render_cover.cjs <out.png> -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060c24; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(180deg, #040919 0%, #081332 30%, #0c1d4c 58%, #0a1840 80%, #050b22 100%); }
  .glow { position: absolute; border-radius: 50%; }
  #g1 { left: 90px; top: 860px; width: 900px; height: 820px; background: radial-gradient(ellipse at 50% 45%, rgba(74,128,236,.42), rgba(52,96,200,.14) 45%, rgba(40,80,180,0) 70%); }
  #g2 { left: 140px; top: 300px; width: 800px; height: 560px; background: radial-gradient(ellipse, rgba(60,100,200,.16), rgba(60,100,200,0) 68%); }
  .grain { position: absolute; inset: 0; background: url(../assets/grain_256.png); opacity: .05; mix-blend-mode: screen; }
  #net { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #hero { position: absolute; left: -45px; top: 941px; width: 1105px; height: auto;
    filter: drop-shadow(0 0 18px rgba(110,160,255,.22)) drop-shadow(0 30px 60px rgba(2,6,24,.55)); }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 449px; top: 300px; width: 182px; height: auto; opacity: .92; }
  #eyebrow { top: 372px; display: flex; justify-content: center; align-items: center; gap: 22px;
    font: 400 24px/1 Poppins; letter-spacing: 9px; color: #a9c4f5; }
  #eyebrow i { display: block; width: 74px; height: 1.5px; background: linear-gradient(90deg, rgba(169,196,245,0), rgba(169,196,245,.75)); }
  #eyebrow i:last-child { transform: scaleX(-1); }
  #eyebrow b { font-weight: 700; color: #ffffff; letter-spacing: 9px; }
  #h1 { top: 432px; font: 700 128px/1 Poppins; letter-spacing: -3px; color: #ffffff; }
  #h2 { top: 606px; font: 400 54px/1 Poppins; letter-spacing: 10px; color: #c3d3f2; }
  #h3 { top: 668px; font: 700 178px/1 Poppins; letter-spacing: -5px;
    background: linear-gradient(180deg, #ffffff 18%, #a9c8ff 72%, #7fa6ef 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 10px 30px rgba(70,120,230,.28));  padding-bottom: .26em; }
  #rule { position: absolute; left: 470px; top: 1548px; width: 140px; height: 1.5px; background: linear-gradient(90deg, rgba(169,196,245,0), rgba(169,196,245,.8), rgba(169,196,245,0)); }
  #tag { top: 1566px; font: 400 33px/1.2 Poppins; color: #dbe5f8; letter-spacing: .5px; text-shadow: 0 2px 14px rgba(2,6,24,.9); }
  #tag b { font-weight: 700; color: #ffffff; }
  #name { top: 1614px; font: 700 19px/1 Poppins; letter-spacing: 7px; color: #8fa9d8; text-shadow: 0 2px 10px rgba(2,6,24,.9); }
</style>
</head>
<body>
<div id="c">
  <div class="glow" id="g2"></div>
  <div class="glow" id="g1"></div>
  <svg id="net" viewBox="0 0 1080 1920"></svg>
  <img id="hero" src="../assets/hero_bust.png" alt="" />
  <img id="logo" src="../assets/logo_white_trim.png" alt="AI PRENEUR" />
  <div class="ctr" id="eyebrow"><i></i><span><b>HUMAN AGENT</b>&nbsp;+&nbsp;AI</span><i></i></div>
  <div class="ctr" id="h1">1 Orang</div>
  <div class="ctr" id="h2">KERJA SETARA</div>
  <div class="ctr" id="h3">10 Orang</div>
  <div id="rule"></div>
  <div class="ctr" id="tag">Bukan cuma AI. <b>Ini sistemnya.</b></div>
  <div class="ctr" id="name">FREDDIE KASHAWAN</div>
  <div class="grain"></div>
</div>
<script>
  // "1 human, 10 functions": a hairline ring of 10 nodes around the head, thin spokes into it (they disappear behind the subject)
  const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) ? +q.get(k) : d);
  const CX = num("cx", 540), CY = num("cy", 1236), R = num("r", 372), R2 = num("r2", 262);
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("net");
  let el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  // the ring dissolves toward the bottom so the tagline sits on clean navy
  const defs = el("defs", {}), lg = document.createElementNS(NS, "linearGradient");
  lg.setAttribute("id", "fadeY"); lg.setAttribute("x1", "0"); lg.setAttribute("y1", "0"); lg.setAttribute("x2", "0"); lg.setAttribute("y2", "1");
  [[0, 1], [0.68, 1], [0.86, 0]].forEach(([o, a]) => { const st = document.createElementNS(NS, "stop"); st.setAttribute("offset", o); st.setAttribute("stop-color", "#fff"); st.setAttribute("stop-opacity", a); lg.appendChild(st); });
  defs.appendChild(lg);
  const mk = document.createElementNS(NS, "mask"); mk.setAttribute("id", "ringMask"); mk.setAttribute("maskUnits", "userSpaceOnUse");
  mk.setAttribute("x", "0"); mk.setAttribute("y", String(CY - R - 120)); mk.setAttribute("width", "1080"); mk.setAttribute("height", String(2 * R + 240));
  const mr = document.createElementNS(NS, "rect"); mr.setAttribute("x", "0"); mr.setAttribute("y", String(CY - R - 120)); mr.setAttribute("width", "1080"); mr.setAttribute("height", String(2 * R + 240)); mr.setAttribute("fill", "url(#fadeY)");
  mk.appendChild(mr); defs.appendChild(mk);
  const grp = el("g", { mask: "url(#ringMask)" });
  const _el = el;
  el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); grp.appendChild(e); return e; };
  el("circle", { cx: CX, cy: CY, r: R, fill: "none", stroke: "rgba(150,185,250,.30)", "stroke-width": 1.5 });
  el("circle", { cx: CX, cy: CY, r: R2, fill: "none", stroke: "rgba(150,185,250,.16)", "stroke-width": 1.2, "stroke-dasharray": "3 9" });
  el("circle", { cx: CX, cy: CY, r: R + 74, fill: "none", stroke: "rgba(150,185,250,.08)", "stroke-width": 1 });
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + (k * 2 * Math.PI) / 10, x = CX + R * Math.cos(a), y = CY + R * Math.sin(a);
    el("line", { x1: CX + R2 * Math.cos(a), y1: CY + R2 * Math.sin(a), x2: x, y2: y, stroke: "rgba(150,185,250,.22)", "stroke-width": 1.2 });
    el("circle", { cx: x, cy: y, r: 13, fill: "rgba(120,165,245,.16)" });
    el("circle", { cx: x, cy: y, r: 6.5, fill: k === 0 ? "#ffffff" : "#a9c4f5" });
  }
  document.fonts.ready.then(() => { window.COVER_READY = true; });
</script>
</body>
</html>

    (function () {
      window.__timelines = window.__timelines || {};

      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const io = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);

      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

      // ----- shared video-call frame (identical in the opening card and on the laptop screen) -----

        '<rect x="440" y="50" width="62" height="170" rx="6" fill="#6f95cf" opacity=".35"/>' +

      const ringPos = (el) => { el.style.left = (318 / 636 * 486 - 60).toFixed(1) + "px"; el.style.top = (150 / 356 * 271 - 60).toFixed(1) + "px"; };
      ringPos($("#s1-ring1")); ringPos($("#s1-ring2"));

      // button label letters
      const LAB = "MULAI INTERVIEW";
      const lab = $("#s1-btn-ui .lab");
      LAB.split("").forEach((c) => { const s = document.createElement("span"); s.textContent = c === " " ? " " : c; s.setAttribute("data-layout-allow-overlap", ""); lab.appendChild(s); });
      // typed question
      const Q = "“Gimana kamu menghadapi masalah paling sulit?”";
      const qbox = $("#s1-qtext");
      Q.split("").forEach((ch) => { const sp = document.createElement("span"); sp.textContent = ch; sp.setAttribute("data-layout-allow-overlap", ""); qbox.appendChild(sp); });
      const caret = document.createElement("i"); caret.id = "s1-caret"; qbox.appendChild(caret);
      // extruded question-mark: 14 depth layers + face
      const qm = $("#s1-qm");
      for (let i = 14; i >= 1; i--) {
        const g = document.createElement("div"); g.className = "s1-g"; g.textContent = "?"; g.setAttribute("data-layout-ignore", "");
        const k = i / 14; g.style.color = "rgb(" + Math.round(18 + 30 * (1 - k)) + "," + Math.round(52 + 70 * (1 - k)) + "," + Math.round(96 + 80 * (1 - k)) + ")";
        g.style.transform = "translateZ(" + (-i * 2.2) + "px)"; qm.appendChild(g);
      }
      const face = document.createElement("div"); face.className = "s1-g"; face.id = "s1-gface"; face.textContent = "?"; face.setAttribute("data-layout-allow-overlap", ""); qm.appendChild(face);

      // ----- camera: one pure function of t, applied with differential parallax -----
      const Ld = $("#s1-Ld"), Ll = $("#s1-Ll"), Lp = $("#s1-Lp"), headEl = $("#s1-head"), bodyEl = $("#s1-body");
      function camS(t) {
        if (t < 2.05) return 1.9;
        if (t < 3.35) return lerp(1.9, 1.0, io(seg(t, 2.05, 3.35)));
        if (t < 6.6) return 1.0 + 0.025 * io(seg(t, 3.35, 6.5));
        if (t < 9.9) return lerp(1.025, 1.1, io(seg(t, 6.6, 7.4))) + 0.03 * io(seg(t, 7.4, 9.8));
        return lerp(1.13, 1.0, io(seg(t, 9.9, 10.7)));
      }
      function camY(t) { // a gentle tilt: look slightly down at the answer card, back up for the hand-off
        return lerp(0, -40, io(seg(t, 6.6, 7.4))) * (1 - io(seg(t, 9.9, 10.7)));
      }
      function render(t) {
        const s = camS(t), y = camY(t);
        const L = (f) => "translate(0px," + (y * f).toFixed(2) + "px) scale(" + (1 + (s - 1) * f).toFixed(4) + ")";
        Ld.style.transform = L(0.85); Ll.style.transform = L(1.0);
        const rise = 260 * (1 - eo(seg(t, 2.1, 3.3)));
        Lp.style.transform = "translate(0px," + (y * 1.35 + rise).toFixed(2) + "px) scale(" + (1 + (s - 1) * 1.35).toFixed(4) + ")";
        const wv = t >= 2.0 ? 1 : 0;
        Ld.style.opacity = String(eo(seg(t, 2.05, 2.7)) * wv);
        Lp.style.opacity = String(eo(seg(t, 2.1, 2.8)) * wv);
        Ll.style.opacity = String(wv);
        $("#s1-lap-img").style.opacity = String(eo(seg(t, 2.0, 2.45)));
        // applicant acting: breathing (closed form) + head drops on "kepala", lifts a little after the blank
        const br = Math.sin((t / 3.4) * Math.PI * 2);
        bodyEl.setAttribute("transform", "translate(0," + (br * 1.6).toFixed(2) + ")");
        const drop = io(seg(t, 8.62, 9.3)) * (1 - 0.4 * io(seg(t, 10.0, 10.8)));
        headEl.setAttribute("transform", "translate(0," + (br * 1.4 + drop * 10).toFixed(2) + ") rotate(" + (drop * -5).toFixed(2) + " 280 330)");
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 10.9, duration: 10.9, ease: "none", onUpdate: () => render(state.t) }, 0);

      // ===== B01 0.00–3.40 =====
      // headline: hook already on frame 0, words land with the voice
      tl.fromTo("#s1-h1 .k-hl:nth-child(2)", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, 0.76);
      tl.fromTo("#s1-h1 .s1-line:nth-child(2) .k-hl", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 0.98);
      tl.fromTo("#s1-count", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
      tl.fromTo("#s1-cone", { opacity: 0.25 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0.2);
      // box tumbles in and lands (fall accelerates, lands, squash, settle)
      tl.fromTo("#s1-btn", { y: -430, rotation: 72, scaleX: 1, scaleY: 1 }, { y: 0, rotation: 0, duration: 0.5, ease: "power2.in" }, 0.0);
      tl.to("#s1-btn", { scaleX: 1.08, scaleY: 0.9, duration: 0.08, ease: "power2.out", transformOrigin: "401px 511px" }, 0.5);
      tl.to("#s1-btn", { scaleX: 1, scaleY: 1, duration: 0.26, ease: "back.out(2)" }, 0.58);
      tl.fromTo("#s1-btn-sh", { x: 455, y: 990, scale: 0.35, opacity: 0 }, { scale: 1, opacity: 0.9, duration: 0.5, ease: "power2.in" }, 0.0);
      // square → pill (ref: morph by widening), label types in
      tl.fromTo("#s1-btn", { clipPath: "inset(361px 447px 3px 326px round 24px)" }, { clipPath: "inset(361px 242px 3px 121px round 30px)", duration: 0.42, ease: "power3.inOut" }, 0.78);
      tl.to("#s1-btn-sh", { scaleX: 3.4, x: 455, duration: 0.42, ease: "power3.inOut" }, 0.78);
      tl.fromTo("#s1-btn-ico", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.0);

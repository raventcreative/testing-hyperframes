      // s10 CTA "Komen IDE, aku kirim lewat DM."  (structure = the house CTA of R8/R12/R20/R24; content + colours ours, brand only)
      // The package card "Panduan setup MiroFish · cara pasang, contoh prompt, catatan aman" pops at the top · "Komen": a comment sheet

      // logo's exit): glow blooms, the dark AI PRENEUR logo settles under the DM card with one glint. Ends on this end card.
      const ID = "s10", ST = window.SCN[ID][0], D = window.SCN[ID][1], VW = window.VO_WORDS, K = window.K;
      const L = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 0.05); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };

      h += `<div class="s10-a s10-card" id="s10-dm"><div class="s10-a" id="s10-dav">${K.svg("message-circle", 2.2)}</div><div class="s10-a" id="s10-dt">Pesan langsung · DM</div>` +

        `<div class="s10-a" id="s10-sent"><div id="s10-ok"><svg viewBox="0 0 24 24"><path id="s10-okp" d="M18 6 7 17l-5-5M22 10l-7.5 7.5L13 16" fill="none" stroke="#294b77" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg></div><span>terkirim</span></div></div>`;
      h += `<div class="s10-a s10-card" id="s10-pk"><div class="ic">${K.svg("list-checks", 2)}</div><div class="eb">DIKIRIM LEWAT DM</div><div class="tt k-grad">Panduan setup MiroFish</div><div class="ts">langkah pasang · prompt Claude Code · catatan biaya</div></div>`;
      h += `<div class="s10-a" id="s10-pl"><i>${K.svg("send", 1.8)}</i></div>`;
      h += `<img class="s10-a" id="s10-logo" src="assets/brand/logo_dark_trim.png" alt="AI PRENEUR"><div class="s10-a" id="s10-lg"></div>`;
      $("s10-cam").innerHTML = h;

      ft(pk, { y: 0 }, { y: -8, duration: 0.5, ease: "power2.out" }, tEnd);

      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);

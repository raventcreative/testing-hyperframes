<!doctype html>
<html lang="id" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>AIpreneur — Maskot Jas (tes)</title>
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="vendor/fx.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #eef4fc; }
      body { font-family: "Poppins", sans-serif; font-synthesis: none; color: #0A0D2C; -webkit-font-smoothing: antialiased; }
      #main { position: relative; width: 1080px; height: 1080px; overflow: hidden; isolation: isolate; background: #eef4fc; }
      #bg { position: absolute; inset: 0; z-index: 0; background: url(assets/brand/bg_1080.png) 0 0 / 1080px 1080px no-repeat; }
      .host-back { z-index: 10 !important; position: absolute !important; }
      #puppet { z-index: 40 !important; position: absolute !important; }
      .host-front { z-index: 50 !important; position: absolute !important; }
      #grain { position: absolute; left: -64px; top: -64px; width: 1208px; height: 1208px; z-index: 80; opacity: .3; background: url(assets/brand/grain_256.png); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080" data-fps="30">
      <div id="bg" data-layout-ignore></div>
      <div id="s01" class="clip host-back" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="6" data-track-index="2" data-width="1080" data-height="1080"></div>
      <div id="puppet" class="clip" data-composition-id="puppet" data-composition-src="compositions/puppet.html" data-start="0" data-duration="6" data-track-index="3" data-width="1080" data-height="1080"></div>
      <div id="s01f" class="clip host-front" data-composition-id="s01f" data-composition-src="compositions/s01f.html" data-start="0" data-duration="6" data-track-index="5" data-width="1080" data-height="1080"></div>
      <div id="grain" data-layout-ignore></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#grain", { x: 0, y: 0 }, { x: 64, y: 40, duration: 6, ease: "steps(72)", immediateRender: false }, 0);
        tl.set({}, {}, 5.99);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>

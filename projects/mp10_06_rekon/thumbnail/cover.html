<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Bulanan vs Tahunan</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     The two totals from the hook (monthly vs annual, Ilustrasi data) as tilted 3D cards with the yellow ≠ between them. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1300px; perspective-origin: 540px 640px; }
  .tile { position: absolute; width: 196px; height: 122px; padding: 16px 18px; border-radius: 20px; background: #fff; box-shadow: 0 22px 40px rgba(3,6,24,.4); }
  .tile b { display: block; font: 700 22px/1 Rubik; letter-spacing: .1em; color: #5B6478; }
  .tile span { display: block; margin-top: 18px; font: 800 44px/1 Rubik; color: #212C5F; white-space: nowrap; }
  .tile small { font-size: .5em; color: #5B6478; margin-right: 3px; }
  .card { position: absolute; width: 640px; height: 250px; padding: 32px 40px; border-radius: 30px; }
  .card .k { display: flex; align-items: center; gap: 14px; font: 600 28px/1 PS; white-space: nowrap; }
  .card .k b { font: 700 32px/1 Rubik; letter-spacing: .06em; padding: 11px 18px 10px; border-radius: 12px; }
  .card .a { margin-top: 22px; font: 800 116px/1.1 Rubik; letter-spacing: -3px; white-space: nowrap; }
  .card .a small { font-size: .5em; letter-spacing: 0; margin-right: .08em; }
  #cL { left: 70px; top: 418px; background: #fff; color: #5B6478; box-shadow: 0 34px 60px rgba(3,6,24,.5); transform: rotateY(16deg) rotateX(8deg) rotateZ(-4deg); }
  #cL .k b { background: #212C5F; color: #fff; } #cL .a { color: #212C5F; }
  #cR { left: 370px; top: 668px; background: #26367A; color: #8E99C2; box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 34px 60px rgba(3,6,24,.55); transform: rotateY(-14deg) rotateX(8deg) rotateZ(3deg) translateZ(40px); }
  #cR .k b { background: #FED111; color: #212C5F; } #cR .a { color: #fff; }
  #ne { position: absolute; left: 640px; top: 506px; width: 170px; height: 170px; border-radius: 50%; background: #FED111; box-shadow: 0 0 0 12px rgba(254,209,17,.22), 0 24px 40px rgba(3,6,24,.5); display: flex; align-items: center; justify-content: center; transform: translateZ(140px) rotate(-8deg); }
  #ne svg { width: 104px; height: 104px; }
  #id { position: absolute; left: 76px; top: 935px; font: 700 20px/1 PS; letter-spacing: .12em; color: #8E99C2; }
  #t1 { position: absolute; left: 66px; top: 985px; font: 800 150px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 78%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 1312px; font: italic 400 70px/1 PF; color: #DDE1EE; white-space: nowrap; }
  #t3 { position: absolute; left: 80px; top: 1420px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px; background: #fff; font: 700 34px/1 PS; color: #212C5F; white-space: nowrap; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div class="stage">
    <div class="tile" style="left:40px;top:640px;transform:rotateX(18deg) rotateZ(-10deg) translateZ(-260px);filter:blur(3px);opacity:.75"><b>JAN</b><span><small>Rp</small>48,2<small> jt</small></span></div>
    <div class="tile" style="left:820px;top:380px;transform:rotateX(14deg) rotateZ(12deg) translateZ(-300px);filter:blur(3.5px);opacity:.7"><b>MAR</b><span><small>Rp</small>52,9<small> jt</small></span></div>
    <div class="tile" style="left:870px;top:860px;transform:rotateX(-10deg) rotateZ(-8deg) translateZ(-200px);filter:blur(2.5px);opacity:.8"><b>AGU</b><span><small>Rp</small>53,6<small> jt</small></span></div>
    <div class="card" id="cL"><div class="k"><b>BULANAN</b>jumlah 12 bulan</div><div class="a"><small>Rp</small>612,4 jt</div></div>
    <div class="card" id="cR"><div class="k"><b>TAHUNAN</b>rekap setahun</div><div class="a"><small>Rp</small>618,9 jt</div></div>
    <div id="ne"><svg viewBox="0 0 100 100" fill="none" stroke="#212C5F" stroke-width="11" stroke-linecap="round"><path d="M18 38h64M18 62h64" /><path d="M64 14L36 86" /></svg></div>
  </div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="id">ILUSTRASI DATA</div>
  <div id="t1">ANGKANYA<br /><span>KOK BEDA?</span></div>
  <div id="t2">bulanan vs tahunan</div>
  <div id="t3">Ini cara ceknya →</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  // demo numbers are the film's illustration data (labelled on the cover)
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: 868, y: 1660, h: 700, yaw: -24, roll: 0, headYaw: -16, headPitch: -8, headRoll: 12, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 142, fwd: 12, bend: 118, bendYaw: -80 },
      face: { blink: 0, lookX: -0.9, lookY: 0.6, smile: 0, o: 0.6 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

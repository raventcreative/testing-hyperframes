<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Target Bulan Depan dari Data, Bukan Feeling</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's straw target boss tilted in 3D, the navy "DATA" arrow (fletching labelled terjual / modal / biaya / laba)
     stuck in its inner rings, and the coral "?" feeling arrow flying off past the board. No numbers on the cover. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 384px; font: 800 160px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 726px; display: flex; align-items: center; gap: 18px; font: italic 400 70px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #t2 s { text-decoration-color: rgba(232,115,90,.95); text-decoration-thickness: 6px; }
  #glow { position: absolute; left: 0; top: 820px; width: 960px; height: 860px; background: radial-gradient(closest-side, rgba(254,209,17,.16), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 500px 1150px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .pl { position: absolute; backface-visibility: hidden; }
  /* straw boss + face (as in the film) */
  .bsf { background-color: #F7EED6; background-image: repeating-linear-gradient(0deg, rgba(143,111,0,.07) 0 3px, transparent 3px 11px), repeating-linear-gradient(90deg, rgba(143,111,0,.04) 0 2px, transparent 2px 17px); border-radius: 10px; box-shadow: inset 0 0 0 6px rgba(143,111,0,.10); }
  .bss { background-color: #E9DDB8; background-image: repeating-linear-gradient(0deg, rgba(120,90,0,.10) 0 3px, transparent 3px 11px); }
  .bst { background-color: #F1E6C6; }
  .leg { background: linear-gradient(90deg, #3a4fab, #26367A); border-radius: 6px; }
  /* arrows (film artwork, numbers left out) */
  .arw { position: absolute; left: -750px; top: -150px; width: 780px; height: 300px; }
  .arw .shaft { position: absolute; left: 48px; top: 143px; width: 640px; height: 14px; border-radius: 7px; background: linear-gradient(180deg, #4a60c0, #26367A 60%, #1a2458); }
  .arw.fe .shaft { background: linear-gradient(180deg, #f2f4f8, #c9cfe0 60%, #b7bfd3); }
  .arw .nock { position: absolute; left: 28px; top: 137px; width: 30px; height: 26px; border-radius: 6px; background: #FED111; }
  .arw.fe .nock { background: #DDE1EE; }
  .arw .head { position: absolute; left: 660px; top: 118px; width: 94px; height: 64px; }
  .fin { position: absolute; width: 190px; height: 84px; padding: 16px 0 0 16px; white-space: nowrap; font: 800 26px/1 Rubik; letter-spacing: .02em; }
  .fin.t { top: 58px; clip-path: polygon(0 0, 80% 0, 100% 100%, 0 100%); }
  .fin.b { top: 158px; padding-top: 14px; clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); }
  .fin.r { left: 60px; } .fin.f { left: 262px; }
  .fin.y { background: linear-gradient(180deg, #FFE440, #FED111); color: #212C5F; }
  .fin.n { background: linear-gradient(180deg, #4a60c0, #31459c); color: #FED111; }
  .fin.c { background: linear-gradient(180deg, #F08A73, #E8735A); color: #fff; padding: 0; text-align: center; font: 800 56px/84px Rubik; }
  .dpill { position: absolute; left: 498px; top: 100px; height: 36px; padding: 0 16px; border-radius: 999px; background: #FED111; display: flex; align-items: center; font: 800 20px/1 Rubik; letter-spacing: .08em; color: #212C5F; }
  #xb { position: absolute; left: 912px; top: 728px; width: 92px; height: 92px; border-radius: 50%; background: #E8735A; box-shadow: 0 14px 28px rgba(3,6,24,.4), inset 0 0 0 6px rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); }
  #xb svg { width: 50px; height: 50px; }
  #trail { position: absolute; left: 470px; top: 930px; width: 300px; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, rgba(232,115,90,.75) 0 26px, rgba(232,115,90,0) 26px 44px); transform-origin: 100% 50%; transform: rotate(-21deg); }
  #t3 { position: absolute; left: 70px; top: 1538px; display: inline-flex; align-items: center; gap: 12px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 31px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-2deg); box-shadow: 0 16px 34px rgba(3,6,24,.35); }
  #t3 b { color: #8F6F00; font-weight: 800; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">TARGET<br /><span>DARI DATA</span></div>
  <div id="t2"><span>bukan dari <s>feeling</s></span></div>
  <div class="stage">
    <!-- the boss: front face + right side + top, two legs; the data arrow is a child of the boss, stuck in the inner rings -->
    <div class="g3" style="transform: translate3d(490px, 1195px, -260px) rotateY(-34deg) rotateX(4deg);">
      <div class="pl leg" style="left:-240px; top:300px; width:34px; height:170px; transform: translateZ(40px);"></div>
      <div class="pl leg" style="left:206px; top:300px; width:34px; height:170px; transform: translateZ(40px);"></div>
      <div class="pl bss" style="left:-60px; top:-300px; width:120px; height:600px; transform: translate3d(300px, 0px, 0px) rotateY(90deg);"></div>
      <div class="pl bst" style="left:-300px; top:-60px; width:600px; height:120px; transform: translate3d(0px, -300px, 0px) rotateX(90deg);"></div>
      <div class="pl bsf" style="left:-300px; top:-300px; width:600px; height:600px; transform: translateZ(60px);">
        <svg style="position:absolute; left:40px; top:40px; width:520px; height:520px;" viewBox="-400 -400 800 800">
          <circle r="398" fill="#fff" stroke="#212C5F" stroke-width="6"/><circle r="320" fill="#212C5F"/><circle r="240" fill="#3a4fab"/><circle r="160" fill="#fff"/><circle r="80" fill="#FED111"/>
          <g fill="none" stroke-width="3"><circle r="360" stroke="rgba(33,44,95,.25)"/><circle r="280" stroke="rgba(255,255,255,.22)"/><circle r="200" stroke="rgba(255,255,255,.22)"/><circle r="120" stroke="rgba(33,44,95,.22)"/><circle r="40" stroke="rgba(143,111,0,.35)"/></g>
          <circle cx="-30" cy="26" r="120" fill="none" stroke="#FED111" stroke-width="10" opacity=".55"/></svg>
      </div>
      <div class="g3" style="transform: translate3d(-18px, 18px, -10px) rotateY(90deg) rotate(4deg) scale(0.8);">
        <div class="pl arw" id="arD"></div>
      </div>
    </div>
    <!-- the feeling arrow, flying off past the board (screen-flat) -->
    <div class="g3" style="transform: translate3d(1012px, 812px, 0px) rotate(-11deg) scale(0.56);"><div class="pl arw fe" id="arF"></div></div>
  </div>
  <div id="xb"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
  <div id="t3">bidik pakai <b>laporan laba rugi</b></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const HEAD = (c1, c2) => `<svg viewBox="0 0 94 64"><path d="M2 12 L90 32 L2 52 L16 32 Z" fill="${c1}"/><path d="M2 12 L90 32 L16 32 Z" fill="${c2}"/></svg>`;
  document.getElementById("arD").innerHTML = `<div class="shaft"></div><div class="nock"></div>
    <div class="fin t r y">TERJUAL</div><div class="fin b r n">MODAL</div><div class="fin b f n">BIAYA</div><div class="fin t f y">LABA</div><div class="dpill">DATA</div>`;
  document.getElementById("arF").innerHTML = `<div class="shaft"></div><div class="nock"></div><div class="head">${HEAD("#DDE1EE", "#fff")}</div><div class="fin t r c">?</div><div class="fin b r c">?</div>`;
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: nothing may be wider than its box; the title must stay inside the safe zone
    document.querySelectorAll(".fin, #t3").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror OVERFLOW", e.className, e.textContent); });
    const t1 = document.getElementById("t1").getBoundingClientRect(), t2 = document.getElementById("t2").getBoundingClientRect();
    if (t1.right > 1010 || t2.right > 1010) console.log("pageerror TITLE WIDE", t1.right, t2.right);
    r.render({ x: 930, y: 1610, h: 600, yaw: -24, roll: 0, headYaw: -18, headPitch: -8, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 140, fwd: 26, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.4, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

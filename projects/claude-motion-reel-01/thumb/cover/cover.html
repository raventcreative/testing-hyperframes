<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../assets/fonts/poppins-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(../../assets/fonts/poppins-latin-400-normal.woff2);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0D2C}
.a{position:absolute}
#bg{left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.glow{border-radius:50%;background:radial-gradient(circle,rgba(0,208,254,.30) 0%,rgba(0,208,254,.10) 40%,rgba(0,208,254,0) 70%)}
.vig{inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(2,4,20,.55) 100%)}
.hd{left:60px;top:285px;width:960px;font:700 132px/1.0 P;color:#fff;letter-spacing:-.025em;text-shadow:0 8px 30px rgba(2,4,20,.6)}
.hd .cy{color:#00D0FE;text-shadow:0 0 30px rgba(0,208,254,.45),0 8px 30px rgba(2,4,20,.6)}
.ul{display:inline-block;position:relative}
.ul:after{content:"";position:absolute;left:4px;right:4px;bottom:-2px;height:12px;border-radius:6px;background:#00D0FE}
.stage{left:40px;top:760px;width:600px;height:640px;perspective:1400px}
.stack{left:0;top:0;width:600px;height:640px;transform-style:preserve-3d;transform:rotateX(14deg) rotateY(24deg) rotateZ(-4deg)}
.pan{width:540px;height:365px;border-radius:22px;overflow:hidden;border:2px solid rgba(0,208,254,.55)}
.pan img{width:100%;height:100%;display:block}
.ghost{border:2px dashed rgba(0,208,254,.55);border-radius:22px;background:rgba(10,13,44,.35)}
.chip{font:700 30px/1 P;color:#0A0D2C;background:#00D0FE;border-radius:14px;padding:12px 18px;letter-spacing:.02em;box-shadow:0 10px 24px -8px rgba(0,208,254,.6)}
.chipd{font:700 26px/1 P;color:#fff;background:rgba(10,13,44,.85);border:2px solid rgba(0,208,254,.7);border-radius:12px;padding:10px 14px}
.ring{border-radius:50%;border:5px solid rgba(0,208,254,.95);box-shadow:0 0 20px rgba(0,208,254,.7)}
.cta{left:60px;top:1530px;font:700 38px/1.18 P;color:#fff;background:linear-gradient(135deg,rgba(10,13,44,.95),rgba(41,75,119,.92));border:2px solid rgba(0,208,254,.7);border-radius:20px;padding:24px 30px;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.cta b{color:#00D0FE}
</style></head><body>
<img id="bg" class="a" src="../../assets/brand/bg_1080x1920.png">

  <div class="a pan" style="left:30px;top:200px;transform:translateZ(-40px);box-shadow:0 40px 60px -20px rgba(0,0,0,.75)"><img src="../../assets/ui/01_session_crop_safe.png"></div>
  <img class="a" src="../../assets/ui/02_claude_logo_3d_clean.png" style="left:-40px;top:-10px;width:300px;height:300px;transform:translateZ(150px);filter:drop-shadow(0 30px 30px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(0,208,254,.35))">
  <div class="a ring" style="left:186px;top:396px;width:110px;height:110px;transform:translateZ(120px)"></div>
  <img class="a" src="../../assets/ui/09_cursor_trim.png" style="left:220px;top:428px;width:130px;transform:translateZ(130px);filter:drop-shadow(0 14px 14px rgba(0,0,0,.6))">
</div></div>
<div class="a chipd" style="left:280px;top:790px">LOGO</div>
<div class="a chipd" style="left:60px;top:1060px">PANEL</div>

</body></html>

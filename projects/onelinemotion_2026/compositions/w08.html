  <script>
    (function () {
      // WORLD 8/10 — SINEMATIK: deep space, slow and grand. Layered starfield + galaxy band + nebulae, a crescent moon,
      // tumbling asteroids, and a night-side planet (city lights, blue atmosphere) at the bottom where the SUN RISES over the
      // limb on "megah" (anamorphic flare, starburst, ghosts) while the camera pushes in (dolly parallax: far layers scale less).
      // Entry: ANAMORPHIC LIGHT STREAK — a gold-white streak flares out of the rocket's nose, then OPENS VERTICALLY LIKE AN EYE
      // (almond clip-path, glowing gold lids) while letterbox bars slide in. Palette matches the cinematic rocket (metal + amber).
      const ID = "w08", D = 2.85, TR = 0.55;
      const root = document;   // the runtime strips the id of the template root: look elements up document-wide (ids are prefixed)
      const $ = (id) => root.querySelector("#" + id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false, lazy: false }, b), t);   // lazy:false: chained string tweens must not read their start before startAt is written
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };   // initial state: applied now (frame 0) AND on every re-seek
      let seed = 8; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
      const f1 = (v) => v.toFixed(1);
      // words (local s): Sinematik 0.27 · megah 1.12 · kayak 1.65 · film 1.78
      const T_TITLE = 0.24, T_MEGAH = 1.12, T_FILM = 1.78;
      const NX = 795, NY = 861;              // rocket nose at the cut
      const SUN = { x: 900, y: 1482 };       // sunrise point on the planet's limb

      // ---------------------------------------------------------------- stars
      const star = (x, y, r, a, warm) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r.toFixed(2)}" fill="${warm ? "#ffe6c4" : "#e8f0ff"}" fill-opacity="${a.toFixed(2)}"/>`;
      {
        let m = "";
        for (let i = 0; i < 260; i++) m += star(rnd() * 1300, rnd() * 1500, 0.5 + rnd() * 0.8, 0.3 + rnd() * 0.5, rnd() < 0.2);
        // dense dust of the galaxy band (runs lower-left -> upper-right, behind the moon and the title's right side)
        for (let i = 0; i < 220; i++) { const x = -100 + rnd() * 1500, y = 770 - 0.78 * (x - 550) + gauss() * 95; m += star(x, y, 0.45 + rnd() * 0.7, 0.25 + rnd() * 0.5, rnd() < 0.35); }
        $("w08-st0").innerHTML = m;
      }
      {
        let m = "";
        for (let i = 0; i < 110; i++) { const x = rnd() * 1500, y = rnd() * 1480, r = 0.9 + rnd() * 1.1; m += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${(r * 3.2).toFixed(1)}" fill="#bcd2ff" fill-opacity=".07"/>` + star(x, y, r, 0.55 + rnd() * 0.4, rnd() < 0.25); }
        $("w08-st1").innerHTML = m;
      }
      // hero stars: 4-point glints that twinkle (kept out of the robot/rocket zone)
      const HERO = [[120, 520], [930, 560], [1010, 1010], [380, 1120], [760, 1180], [150, 930], [1160, 640], [1320, 1060], [1480, 560], [1650, 940], [560, 520], [1250, 1240]];
      {
        let m = `<defs><radialGradient id="w08-hg"><stop offset="0" stop-color="#fffaf0"/><stop offset=".35" stop-color="#ffe6b8" stop-opacity=".5"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>`;
        HERO.forEach(([x, y], i) => { const L = 9 + (i % 4) * 4;
          m += `<g id="w08-hs${i}"><circle cx="${x}" cy="${y}" r="${L * 1.3}" fill="url(#w08-hg)"/><path d="M ${x},${y - L} Q ${x},${y} ${x + L},${y} Q ${x},${y} ${x},${y + L} Q ${x},${y} ${x - L},${y} Q ${x},${y} ${x},${y - L} Z" fill="#fffaf0"/></g>`; });
        $("w08-st2").innerHTML = m;
      }
      // near dust: thin motion streaks (the fast layer, matches the line speed)
      {
        let m = "";
        for (let i = 0; i < 46; i++) { let y = 480 + rnd() * 1000; if (y > 760 && y < 1000) y += 260; const x = rnd() * 4100, l = 20 + rnd() * 70;
          const w = 0.6 + rnd() * 0.8;
          m += `<path d="M ${f1(x)},${f1(y - w)} L ${f1(x + l)},${f1(y)} L ${f1(x)},${f1(y + w)} Z" fill="#ffe8c8" fill-opacity="${(0.14 + rnd() * 0.2).toFixed(2)}"/>`; }
        $("w08-dust").innerHTML = m;
      }
      // ---------------------------------------------------------------- moon (crescent lit from the lower right, by the rising sun)
      $("w08-moon").innerHTML = `<defs><clipPath id="w08-mc"><circle r="40"/></clipPath></defs>
        <circle r="40" fill="#e9dcc0"/><g clip-path="url(#w08-mc)"><circle cx="-11" cy="-12" r="40" fill="#141a28"/>
        <circle cx="14" cy="22" r="5" fill="#cdbd9e"/><circle cx="26" cy="6" r="3" fill="#cdbd9e"/><circle cx="4" cy="31" r="2.6" fill="#cdbd9e"/></g>
        <circle r="40" fill="none" stroke="#2a3348" stroke-opacity=".6" stroke-width="1"/>`;
      // ---------------------------------------------------------------- asteroids (dark rock, warm rim light from the sun = lower right)
      const rockPts = (r, k, n = 11) => { const p = []; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 + k; const rr = r * (0.7 + 0.3 * rnd()); p.push([Math.cos(a) * rr, Math.sin(a) * rr * (0.78 + 0.1 * rnd())]); } return p; };
      const poly = (p, dx = 0, dy = 0, s = 1) => p.map(([x, y]) => `${f1(x * s + dx)},${f1(y * s + dy)}`).join(" ");
      const rock = (x, y, r, k, rim = "#c98a4a") => { const p = rockPts(r, k), o = Math.max(1.2, r * 0.06);
        let m = `<g transform="translate(${f1(x)} ${f1(y)})"><polygon points="${poly(p)}" fill="${rim}" fill-opacity=".9"/><polygon points="${poly(p, -o, -o * 0.9, 0.985)}" fill="url(#w08-rg)"/>`;
        for (let c = 0; c < 3; c++) { const cx = (rnd() - 0.6) * r * 0.9, cy = (rnd() - 0.6) * r * 0.8, cr = r * (0.08 + rnd() * 0.12); m += `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(cr)}" ry="${f1(cr * 0.8)}" fill="#0b0d12" fill-opacity=".55"/>`; }
        return m + `</g>`; };
      const RG = (id) => `<defs><radialGradient id="${id}" cx=".78" cy=".82" r=".95"><stop offset="0" stop-color="#6a4c32"/><stop offset=".3" stop-color="#33281f"/><stop offset=".7" stop-color="#16151a"/><stop offset="1" stop-color="#0c0c10"/></radialGradient></defs>`;
      $("w08-rk0").innerHTML = RG("w08-rg") + [[980, 540, 9], [1180, 1060, 7], [1420, 560, 11], [1560, 1180, 8], [1720, 1020, 6], [300, 1210, 6], [700, 540, 5], [1830, 600, 9]].map(([x, y, r], i) => rock(x, y, r, i)).join("");
      $("w08-rk1").innerHTML = RG("w08-rg1") + [[1250, 560, 30], [1720, 1150, 38], [2150, 520, 22]].map(([x, y, r], i) => rock(x, y, r, i + 3).replace("url(#w08-rg)", "url(#w08-rg1)")).join("");
      $("w08-big").innerHTML = RG("w08-rg2") + rock(0, 0, 125, 1.3, "#e6aa62").replace("url(#w08-rg)", "url(#w08-rg2)");
      // ---------------------------------------------------------------- planet: night side, city lights, atmosphere, warm rim at the sunrise
      const PC = { x: 380, y: 3420, r: 2000 };
      {
        let lights = "";
        const LW = 1080 + 170 * D + 200;
        for (let c = 0; c < 26; c++) { const cx = rnd() * LW, cy = 1450 + rnd() * 420, n = 6 + Math.floor(rnd() * 14), sp = 14 + rnd() * 40;
          for (let i = 0; i < n; i++) { const x = cx + gauss() * sp, y = cy + gauss() * sp * 0.45; lights += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${(0.7 + rnd() * 1.5).toFixed(2)}" fill="${rnd() < 0.75 ? "#ffc46b" : "#fff0c8"}" fill-opacity="${(0.35 + rnd() * 0.6).toFixed(2)}"/>`; } }
        let clouds = "";
        for (let i = 0; i < 9; i++) { const x = rnd() * LW, y = 1480 + rnd() * 380; clouds += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(90 + rnd() * 160)}" ry="${f1(6 + rnd() * 10)}" fill="#7ea4d6" fill-opacity=".05"/>`; }
        const C = (r, attrs) => `<circle cx="${PC.x}" cy="${PC.y}" r="${r}" ${attrs}/>`;
        $("w08-planet").innerHTML = `<defs>
            <radialGradient id="w08-pg" cx="${SUN.x}" cy="${SUN.y}" r="1250" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2a3a58"/><stop offset=".18" stop-color="#121d33"/><stop offset=".5" stop-color="#080d19"/><stop offset="1" stop-color="#04060c"/></radialGradient>
            <radialGradient id="w08-rim" cx="${SUN.x}" cy="${SUN.y}" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff6dc"/><stop offset=".3" stop-color="#ffcf7e" stop-opacity=".95"/><stop offset=".7" stop-color="#ff9e48" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/></radialGradient>
            <clipPath id="w08-pc">${C(PC.r - 3, "")}</clipPath></defs>` +
          C(PC.r, 'fill="url(#w08-pg)"') +
          `<g clip-path="url(#w08-pc)"><g id="w08-lights">${clouds}${lights}</g></g>` +
          C(PC.r + 14, 'fill="none" stroke="#3a86ff" stroke-opacity=".07" stroke-width="120"') +
          C(PC.r + 6, 'fill="none" stroke="#56a6ff" stroke-opacity=".17" stroke-width="44"') +
          C(PC.r + 1, 'fill="none" stroke="#9ed6ff" stroke-opacity=".5" stroke-width="10"') +
          C(PC.r, 'fill="none" stroke="#e6f6ff" stroke-opacity=".9" stroke-width="2.4"') +
          `<g id="w08-rimw">` + C(PC.r + 8, 'fill="none" stroke="url(#w08-rim)" stroke-opacity=".5" stroke-width="56"') + C(PC.r + 1, 'fill="none" stroke="url(#w08-rim)" stroke-width="9"') + `</g>`;
      }
      // starburst rays around the sun

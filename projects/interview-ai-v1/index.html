    <script>
      window.__timelines = window.__timelines || {};
      // Per-word headline animation: give EACH word its own .k-hl (gradient text), then call
      // window.__kitAlign(fieldEl) once at build — it offsets every word's gradient so the whole block
      // still reads as one #00c9ff→#294b77 field (opacity/blur on a child of a single .k-hl does not hide it).
      window.__kitAlign = function (field) {
        if (!field) return;
        const run = () => field.querySelectorAll(".k-hl").forEach((el) => {
          let x = 0, n = el;
          while (n && n !== field) { x += n.offsetLeft || 0; n = n.offsetParent; if (n && !field.contains(n)) break; }
          el.style.backgroundSize = "900px 100%";
          el.style.backgroundPosition = (-x) + "px 0";
        });
        run();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
      };
      const tl = gsap.timeline({ paused: true });
      try {
        const v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
        if (v && v["show-captions"] === false) document.getElementById("captions").style.display = "none";
      } catch (e) {}
      window.__timelines["main"] = tl;
    </script>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 7 Prompt Motion</title>
<!-- Minimal, high-end Reels cover 1080x1920: one headline, one example frame, the mascot, lots of negative space.
     Key content sits inside the centred 4:5 grid crop (y 285-1635).
     Render: node thumbnail/render_thumb.cjs <pose t> <out.png> [mouth t]   (static server on :8765 at project root) -->
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<style>
  @font-face { font-family: "Poppins"; src: url("../assets/fonts/poppins-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Poppins"; src: url("../assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050a1c; font-family: "Poppins", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #main { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse 70% 40% at 50% 74%, rgba(1,204,247,.16) 0%, rgba(1,204,247,0) 70%), linear-gradient(180deg, #040818 0%, #08142f 55%, #050a1c 100%); }
  .abs { position: absolute; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { left: 450px; top: 330px; width: 180px; height: 17.9px; opacity: .9; }
  #rule { left: 510px; top: 380px; width: 60px; height: 2px; background: #01ccf7; }
  #l1 { top: 430px; font-size: 64px; line-height: 76px; font-weight: 400; color: rgba(255,255,255,.88); letter-spacing: 1px; }
  #l1 b { color: #01ccf7; font-weight: 700; }
  #l2 { top: 500px; font-size: 196px; line-height: 200px; font-weight: 700; letter-spacing: -8px; }
  #l2 i { font-style: normal; color: #01ccf7; }
  #l3 { top: 720px; font-size: 22px; letter-spacing: 10px; color: rgba(255,255,255,.55); }
  #frame { left: 300px; top: 820px; width: 480px; height: 270px; border-radius: 22px; overflow: hidden; transform: rotate(-4deg);
    box-shadow: 0 0 0 1.5px rgba(1,204,247,.5), 0 40px 80px rgba(0,0,0,.6), 0 0 60px rgba(1,204,247,.2); }
  #frame img { width: 100%; height: 100%; object-fit: cover; }
  #m { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #cta { top: 1790px; font-size: 26px; letter-spacing: 6px; color: rgba(255,255,255,.7); }
  #cta b { color: #01ccf7; }
  #grain { inset: 0; opacity: .08; background: url(../assets/brand/grain_256.png); }
  #vig { inset: 0; background: radial-gradient(ellipse 90% 75% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%); }
</style>
</head>
<body>
<div id="main">
  <img id="logo" class="abs" src="../assets/brand/logo_trim.png" alt="AIpreneur">
  <div id="rule" class="abs"></div>
  <div id="l1" class="ctr"><b>7</b> prompt</div>
  <div id="l2" class="ctr">motion<i>.</i></div>
  <div id="l3" class="ctr">SATU PROMPT · SATU VIDEO</div>
  <div id="frame" class="abs"><img src="still_jumat.jpg" alt=""></div>
  <canvas id="m" width="1080" height="1920"></canvas>
  <div id="vig" class="abs"></div><div id="grain" class="abs"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), Tp = parseFloat(q.get("t") || "21");
  const M3 = window.Mascot3D, VW = window.VO_WORDS, PH = window.VO_PHR, D = 41.2;
  const W0 = PH.hook[2].start + 0.2;
  const intents = [{ t: PH.hook[0].start + 0.05, action: "present", side: "right" }, { t: PH.hook[1].start, action: "emphasize", side: "left" }, { t: W0 + 0.3, action: "idle" }, { t: PH.hook[2].end - 1.4, action: "reveal" }];
  const ROT = ["pointFwd", "present", "explain", "pointFwd", "emphasize", "present", "pointFwd"];
  PH.items.forEach((c, i) => { intents.push({ t: c.label.start - 0.05, action: ROT[i % ROT.length], side: i % 2 ? "left" : "right" }); intents.push({ t: c.desc.start + 0.2, action: "explain", side: i % 2 ? "right" : "left" }); });
  intents.push({ t: PH.cta[0].start, action: "cta", side: "right" }, { t: PH.cta[1].start + 1.0, action: "welcome", side: "left" });
  const DIR = M3.direct(VW, D, { intents, seed: 5, quiet: 0.2, look: 0 });
  const PERF = M3.buildPerformance(DIR.tracks, D + 0.05, { smooth: 1 });
  const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.036, 0.031], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.036, 0.031], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [253, 198, 152], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "headC": [0, 0.72, 0]};
  window.THUMB_READY = fetch("../tools/decals.json").then((r) => r.json()).then((decals) => {
    decals.forEach((d) => { d.url = "../" + d.url; });
    return M3.Mascot.create(document.getElementById("m"), { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals, width: 1080, height: 1920, envIntensity: 0.6 });
  }).then((m) => {
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 2.1; o.color.setRGB(0.45, 0.85, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const Pf = PERF(Tp);
    m.setView({ fx: 540, fy: 2075, h: 960, yaw: 0, pitch: 4 });
    m.setState({ root: { x: Pf.root.x, y: Pf.root.y, ry: Pf.root.ry, rz: Pf.root.rz, rx: 0, s: Pf.root.s }, bones: Pf.bones,
      face: { blink: [0, 0], gaze: [0, 0], mouthMix: 1, mouth: M3.buildLipTrack(window.VO_PHONES, window.VO_ENV, D)(parseFloat(q.get("mt") || Tp)) } });
    m.render();
    return document.fonts.ready;
  });
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Jualan di Banyak Tempat, Catatannya Satu</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's idea: three generic places drawn as rivers (Toko online A / Toko online B / Media sosial) flowing on a tilted navy
     map into ONE lake that stands up as one "Pembukuan" card. No numbers, no platform names or colours. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t0 { position: absolute; left: 0; width: 1080px; top: 376px; text-align: center; font: italic 400 62px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #t1 { position: absolute; left: 0; width: 1080px; top: 458px; text-align: center; font: 800 150px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .1em; }
  #glow { position: absolute; left: 0; top: 920px; width: 900px; height: 760px; background: radial-gradient(closest-side, rgba(254,209,17,.22), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 470px 1300px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  #map { position: absolute; left: -480px; top: -1150px; width: 960px; height: 1250px; }
  #map > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .rl .src { width: 56px; height: 56px; } .rl .src svg { width: 32px; height: 32px; }
  .rl { position: absolute; display: flex; align-items: center; gap: 12px; height: 76px; padding: 0 24px 0 10px; border-radius: 38px; background: #fff; font: 700 36px/1 PS; color: #212C5F; white-space: nowrap; box-shadow: 0 12px 26px rgba(3,6,24,.4); }
  .src { flex: none; width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; }
  .src svg { width: 26px; height: 26px; }
  .src.a { background: #4B63C9; } .src.b { background: #8FA2EA; border-radius: 23px; } .src.c { background: #F2BE12; border-radius: 13px 13px 13px 4px; }
  .card { position: absolute; background: #fff; border-radius: 28px; padding: 24px 24px 18px; box-shadow: 0 40px 80px rgba(3,6,24,.55), 0 0 0 4px rgba(254,209,17,.9); }
  .card .h { display: flex; align-items: center; gap: 14px; height: 66px; }
  .card .h i { flex: none; width: 64px; height: 64px; border-radius: 18px; background: #212C5F; display: flex; align-items: center; justify-content: center; }
  .card .h i img { width: 36px; }
  .card .h b { display: block; font: 800 38px/1 Rubik; color: #212C5F; white-space: nowrap; }
  .card .h span { display: block; margin-top: 6px; font: 600 18px/1 PS; color: #5B6478; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 12px; height: 66px; margin-top: 10px; padding: 0 14px 0 10px; border-radius: 18px; background: #EDEFF5; white-space: nowrap; overflow: hidden; }
  .row:first-of-type { margin-top: 16px; }
  .row b { flex: 1; font: 700 25px/1 PS; color: #212C5F; }
  .row em { flex: none; width: 38px; height: 38px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .row em svg { width: 24px; height: 24px; }
  #t3 { position: absolute; left: 76px; top: 1508px; display: inline-flex; align-items: center; gap: 12px; padding: 18px 26px; border-radius: 999px; background: #FED111; font: 700 31px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-2deg); box-shadow: 0 16px 34px rgba(3,6,24,.35); }
  #t3 svg { width: 30px; height: 30px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t0">jualan di banyak tempat,</div>
  <div id="t1">CATATANNYA<br /><span>SATU</span></div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <div id="t3">Rekonsiliasi tiap bulan<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const sv = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
  const STORE = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5V20h15v-9.5"/><path d="M3 10l1.8-6h14.4L21 10"/><path d="M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M10 20v-5h4v5"/></svg>';
  const SOCIAL = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5A8.5 8.5 0 1 1 21 11.5z"/><path d="M12 15.2s-3.6-2.1-3.6-4.4a1.9 1.9 0 0 1 3.6-.9 1.9 1.9 0 0 1 3.6.9c0 2.3-3.6 4.4-3.6 4.4z"/></svg>';
  // world: origin = the lake centre; the map plane lies back (rotateX), the card and the three labels stand up on it
  const w = document.getElementById("w");
  w.style.transform = "translate3d(450px, 1440px, 0px) rotateY(4deg)";
  const map = mk("div", "", w); map.id = "map"; map.style.transform = "rotateX(40deg)"; map.style.transformOrigin = "480px 1150px";
  const svg = sv("svg", { width: 960, height: 1250, viewBox: "0 0 960 1250" }, map);
  const g = sv("g", { stroke: "rgba(255,255,255,.08)", "stroke-width": 2 }, svg);
  for (let x = 0; x <= 960; x += 80) sv("line", { x1: x, y1: 0, x2: x, y2: 1250 }, g);
  for (let y = 0; y <= 1250; y += 80) sv("line", { x1: 0, y1: y, x2: 960, y2: y }, g);
  const defs = sv("defs", {}, svg);
  const lg = sv("radialGradient", { id: "lk" }, defs); sv("stop", { offset: "0", "stop-color": "#FFE98A" }, lg); sv("stop", { offset: ".55", "stop-color": "#8FA2EA" }, lg); sv("stop", { offset: "1", "stop-color": "#4B63C9" }, lg);
  const RV = [["#6F86EA", "#B9C6FF", 66, "M 110 40 C 150 380 330 520 340 780 S 420 1060 450 1140"], ["#A9B8F4", "#E1E7FF", 56, "M 480 0 C 390 300 570 520 490 790 S 475 1060 480 1140"], ["#FED111", "#FFF0A0", 50, "M 850 40 C 820 380 640 520 640 780 S 540 1060 510 1140"]];
  RV.forEach(([c, hi, wd, d]) => { sv("path", { d, fill: "none", stroke: c, "stroke-width": wd * 2.6, "stroke-linecap": "round", opacity: .18 }, svg); sv("path", { d, fill: "none", stroke: c, "stroke-width": wd, "stroke-linecap": "round" }, svg);
    sv("path", { d, fill: "none", stroke: hi, "stroke-width": wd * .36, "stroke-linecap": "round", opacity: .85 }, svg); sv("path", { d, fill: "none", stroke: "#fff", "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": "22 50", opacity: .8 }, svg); });
  sv("ellipse", { cx: 480, cy: 1150, rx: 330, ry: 200, fill: "url(#lk)", stroke: "#FED111", "stroke-width": 8 }, svg);
  // the three places stand at the river heads
  const LBL = [["Toko online A", "a", STORE, 110, 40], ["Toko online B", "b", STORE, 480, 0], ["Media sosial", "c", SOCIAL, 850, 40]];
  // one pembukuan stands up out of the lake
  const card = mk("div", "card", w, "left:-200px; top:-356px; width:400px; height:356px; transform-origin: 50% 100%; transform: translate3d(0px, -10px, 40px) rotateX(2deg) rotateY(-6deg);");
  card.innerHTML = `<div class="h"><i><img src="../assets/mp/mp_m_reverse.png" alt="" /></i><div><b>Pembukuan</b><span>semua tempat jualan</span></div></div>` +
    LBL.map(([t, k, ic]) => `<div class="row"><i class="src ${k}">${ic}</i><b>${t}</b><em>${CHECK}</em></div>`).join("");
  document.fonts.ready.then(() => {
    LBL.forEach(([t, k, ic, x, y]) => { const e = mk("div", "rl", map); e.innerHTML = `<i class="src ${k}">${ic}</i>${t}`;
      e.style.left = (x - e.offsetWidth / 2) + "px"; e.style.top = (y - e.offsetHeight - 6) + "px"; e.style.transformOrigin = "50% 100%"; e.style.transform = "rotateX(-40deg)"; });
    map.style.transformStyle = "preserve-3d";
    // self-checks: headline inside the frame, card rows not overflowing
    const t1 = document.getElementById("t1"); const r = document.createRange(); r.selectNodeContents(t1); const b = r.getBoundingClientRect();
    if (b.left < 60 || b.right > 1020) console.log("pageerror HEADLINE WIDE", b.left, b.right);
    document.querySelectorAll(".row, .rl").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror OVERFLOW", e.textContent); });
    return RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" });
  }).then((r) => {
    r.render({ x: 905, y: 1500, h: 640, yaw: -24, roll: 0, headYaw: -18, headPitch: -8, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 128, fwd: 28, bend: 14, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.4, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

<template>
  <style>
    #rb-root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #rb-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #rb-kb { position: absolute; left: 0; top: 0; width: 300px; height: 100px; margin: -50px 0 0 -150px; opacity: 0; transform-origin: 50% 50%; }
    #rb-kb .pl { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(1,204,247,.30), rgba(1,204,247,.10));
      box-shadow: 0 0 0 1.5px rgba(106,223,255,.7), 0 0 26px rgba(1,204,247,.55), inset 0 0 18px rgba(1,204,247,.25); }
    #rb-kb .ks { position: absolute; left: 16px; top: 13px; width: 268px; height: 74px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
    #rb-kb .ks i { display: block; border-radius: 4px; background: rgba(160,235,255,.22); box-shadow: inset 0 0 0 1px rgba(160,235,255,.35); }
    #rb-kb .ks i.on { background: rgba(220,250,255,.95); box-shadow: 0 0 10px rgba(1,204,247,.95); }
  </style>
  <div data-hf-id="hf-qqwu" id="rb-root" data-composition-id="robot" data-width="1080" data-height="1920">
    <canvas data-hf-id="hf-su0m" id="rb-canvas" width="1080" height="1920" data-layout-ignore data-layout-allow-occlusion></canvas>
    <div data-hf-id="hf-sjel" id="rb-kb"><div data-hf-id="hf-3f18" class="pl"></div><div data-hf-id="hf-gedt" class="ks" id="rb-keys"></div></div>
  </div>
  <script>
    (function () {
      // AI PRENEUR ROBOT = the CO-HOST / operator (screen right): flies in on "Kamu punya buktinya?" in the hook and thinks, nods
      // through the checklist, points at the agent's badge, shakes its head on "bukan admin" / "sudo" / "jangan ... yolo" / "nggak
      // bisa" / "bukan pagar", TYPES on its holo keyboard when a command is set up (commit, permission, git status), scans the receipt
      // and the diff, cheers when a guard rail holds ("ask", "jejaknya", "sistem"), cheers the CTA and waves at the end.
      // Pure function of global time (hf-seek, __T0).
      const VW = window.VO_WORDS, SC = window.VO_SCENES, D = window.TOTAL, M3 = window.Mascot3D;
      const one = (x) => Math.max(0, Math.min(1, x));
      const sm = (u) => { u = one(u); return u * u * (3 - 2 * u); };
      const io3 = (u) => { u = one(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const L = (a, b, u) => a + (b - a) * u;
      const vn = M3.vnoise;
      const S = (id) => SC.find((s) => s.id === id);
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= after); return w ? w[1] : -99; };
      const HEAD_FIX = [-0.0775, -0.227, -0.1287];
      const STAND = { fx: 832, fy: 1668, h: 330, ry: -0.38 };
      const T_IN = wt("Kamu") - 0.25;                               // flies in on "Kamu punya buktinya?" (the hook's question)
      function frame(t) {
        if (t < T_IN) return null;
        const u = io3((t - T_IN) / 0.75), arc = Math.sin(Math.PI * u) * 160;
        let f = { fx: L(1330, STAND.fx, u), fy: L(1500, STAND.fy, u) - arc, h: L(300, STAND.h, u), ry: L(-1.1, STAND.ry, u), fly: u };
        // small hops on scene cuts (keeps it alive between gestures)
        for (const sc of SC) { if (sc.id === "s01") continue; const k = t - sc.start; if (k > 0 && k < 0.5) f.fy -= 34 * Math.sin(Math.PI * k / 0.5); }
        return f;
      }
      // ---------------------------------------------------------------- gestures
      const G = [];
      const add = (t, k, d = 0.9, x) => { if (t > 0) G.push(Object.assign({ t, k, d }, x || {})); };
      add(wt("buktinya?") + 0.08, "think", 0.7);
      add(wt("checklist") - 0.05, "nod", 0.5);
      add(wt("tiga") - 0.05, "point", 0.6, { up: 1 });
      add(wt("selama,") - 0.05, "scan", wt("kerja.") - wt("selama,"));
      add(wt("kerja.") + 0.02, "happy", 0.5);
      add(wt("agent", S("s03").start) - 0.08, "point", 0.6);
      add(wt("akun", S("s03").start) - 0.05, "nod", 0.45);
      add(wt("bukan", S("s03").start) - 0.05, "no", 0.7);
      add(wt("sudo.") - 0.05, "no", 0.6);
      add(wt("Commit") - 0.05, "type", wt("git,") - wt("Commit") + 0.25);
      add(wt("awal.") - 0.02, "happy", 0.6);
      add(wt("Hermes,") - 0.05, "present", 0.7, { side: "L" });
      add(wt("manual,") - 0.05, "nod", 0.5);
      add(wt("jangan") - 0.05, "no", 0.9);
      add(wt("yolo.") + 0.05, "shock", 0.5);
      add(wt("OpenCode,") - 0.05, "scan", 0.7);
      add(wt("boleh,") - 0.08, "think", 0.5);
      add(wt("ubah") - 0.08, "type", wt("ask.") - wt("ubah") + 0.1);
      add(wt("ask.") + 0.12, "cheer", 0.55);
      add(wt("auditd") - 0.08, "point", 0.6, { up: 1 });
      add(wt("merekam") - 0.05, "scan", wt("agent,") - wt("merekam") + 0.2);
      add(wt("jamnya.") - 0.02, "nod", 0.5);
      add(wt("root,") - 0.05, "happy", 0.6);
      add(wt("nggak", S("s08").start) - 0.05, "no", 0.7);
      add(wt("hapus") + 0.05, "shock", 0.45);
      add(wt("jejaknya.") + 0.05, "cheer", 0.6);
      add(wt("Sesudah:") - 0.05, "nod", 0.5);
      add(wt("status") - 0.1, "type", wt("diff") - wt("status") + 0.1);
      add(wt("diff") + 0.08, "scan", wt("ubah.") - wt("diff") - 0.1);
      add(wt("ubah.") - 0.02, "point", 0.6);
      add(wt("Ingat,") - 0.05, "think", 0.6);
      add(wt("bukan", S("s10").start) - 0.05, "no", 0.8);
      add(wt("Pagarnya") - 0.05, "present", 0.7, { side: "L" });
      add(wt("sistem.") + 0.02, "cheer", 0.6);
      add(wt("Komen") + 0.05, "cheer", 0.8); add(wt("DM.") - 0.1, "point", 0.7, { up: 1 }); add(D - 1.1, "wave", 1.0);
      const envG = (t, g) => sm((t - g.t + 0.16) / 0.2) * (1 - sm((t - (g.t + g.d)) / 0.26));
      const BL = []; { let x = T_IN + 1.2, h = 13; while (x < D) { BL.push(x); h = (h * 9301 + 49297) % 233280; x += 2.1 + (h / 233280) * 2.3; } }
      const blinkAt = (t) => { let v = 0; for (const b of BL) { const d = t - b; if (d > -0.06 && d < 0.18) v = Math.max(v, d < 0 ? 1 + d / 0.06 : 1 - sm((d - 0.04) / 0.14)); } return Math.max(0, v); };
      function perf(t) {
        const fr = frame(t); if (!fr) return null;
        const root = { x: 0, y: 0, z: 0, rx: 0, ry: fr.ry, rz: 0, s: 1 };
        const bones = { body: [0, 0, 0], head: [0, 0, 0], hand_L: [0, 0, 0], hand_R: [0, 0, 0] };
        const offs = { hand_L: [0, 0, 0], hand_R: [0, 0, 0], head: [0, 0, 0] };
        const face = { blink: blinkAt(t), gaze: [0, 0.03], happy: 0, squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 };
        root.y = 0.014 * Math.sin(2 * Math.PI * 0.55 * t) + 0.006 * Math.sin(2 * Math.PI * 1.27 * t + 1.1);
        root.rz = 0.03 * Math.sin(2 * Math.PI * 0.41 * t + 0.4);
        root.rx = 0.018 * Math.sin(2 * Math.PI * 0.5 * t + 1.7);
        bones.head = [HEAD_FIX[0] + 0.02 * vn(t, 5, 0.25), HEAD_FIX[1] + 0.05 * vn(t, 6, 0.18), HEAD_FIX[2] + 0.03 * vn(t, 7, 0.2)];
        offs.hand_L = [-0.07 + 0.006 * vn(t, 11, 0.4), 0.018 * Math.sin(2 * Math.PI * 0.55 * t + 1.3), 0.008 * vn(t, 12, 0.35)];
        offs.hand_R = [0.07 + 0.006 * vn(t, 13, 0.4), 0.018 * Math.sin(2 * Math.PI * 0.55 * t + 2.4), 0.008 * vn(t, 14, 0.35)];
        bones.hand_L = [0.08 * Math.sin(2 * Math.PI * 0.5 * t), 0, 0.06 * vn(t, 15, 0.3)];
        bones.hand_R = [0.08 * Math.sin(2 * Math.PI * 0.5 * t + 1), 0, 0.06 * vn(t, 16, 0.3)];
        face.gaze = [-0.06 + 0.05 * vn(t, 21, 0.22), 0.05 + 0.04 * vn(t, 22, 0.2)];
        if (fr.fly < 1) { const k = 1 - fr.fly; root.rz += 0.3 * Math.sin(Math.PI * fr.fly) * k; root.rx += 0.15 * k; offs.hand_L[0] += 0.08 * k; offs.hand_R[0] += 0.08 * k; offs.hand_L[1] += 0.06 * k; offs.hand_R[1] += 0.06 * k; }
        let ring = 1, kb = 0, keys = 0;
        for (const g of G) {
          const w = envG(t, g); if (w < 1e-3) continue;
          const lt = t - g.t;
          switch (g.k) {
            case "type": { kb = Math.max(kb, w); keys = lt;
              const a = Math.sin(lt * 2 * Math.PI * 5.2), b = Math.sin(lt * 2 * Math.PI * 4.6 + 1.7);
              offs.hand_L = [L(offs.hand_L[0], -0.09, w), L(offs.hand_L[1], -0.07 + 0.016 * Math.max(0, a), w), L(offs.hand_L[2], 0.15, w)];
              offs.hand_R = [L(offs.hand_R[0], 0.09, w), L(offs.hand_R[1], -0.07 + 0.016 * Math.max(0, b), w), L(offs.hand_R[2], 0.15, w)];
              bones.hand_L[0] += 0.55 * w; bones.hand_R[0] += 0.55 * w; bones.head[0] += 0.14 * w;
              root.ry = L(root.ry, -0.04, w); root.rx += 0.05 * w;            // faces the viewer, leans over the keyboard in front of it
              face.gaze = [L(face.gaze[0], -0.05, w), L(face.gaze[1], -0.2, w)]; ring += 0.4 * w; break; }
            case "scan": { const sw = Math.sin(lt * 2 * Math.PI * 1.1);
              bones.head[1] += 0.26 * w * sw; face.gaze = [L(face.gaze[0], 0.28 * sw, w), L(face.gaze[1], 0.12, w)]; face.squint = Math.max(face.squint, 0.45 * w); ring += 0.3 * w; break; }
            case "lookmascot": root.ry -= 0.45 * w; bones.head[1] -= 0.2 * w; face.gaze = [L(face.gaze[0], -0.32, w), face.gaze[1]]; face.happy = Math.max(face.happy, 0.6 * w); break;
            case "shock": face.blink = 0; root.rx -= 0.1 * w; root.y += 0.03 * w * sm(lt / 0.15); offs.hand_L[1] += 0.08 * w; offs.hand_R[1] += 0.08 * w;
              offs.hand_L[0] += 0.03 * w; offs.hand_R[0] -= 0.03 * w; ring += 1.0 * w; bones.head[1] += 0.06 * w * Math.sin(lt * 40) * Math.exp(-lt * 6); break;
            case "no": bones.head[1] += 0.22 * w * Math.sin(lt * 2 * Math.PI * 2.6); face.squint = Math.max(face.squint, 0.6 * w); break;
            case "nod": bones.head[0] += 0.12 * w * Math.max(0, Math.sin(lt * 2 * Math.PI * 1.6)); break;
            case "happy": face.happy = Math.max(face.happy, w); ring += 0.5 * w; break;
            case "think": face.squint = Math.max(face.squint, 0.45 * w); face.gaze = [L(face.gaze[0], 0.16, w), L(face.gaze[1], 0.24, w)]; bones.head[2] += 0.14 * w;
              offs.hand_R = [L(offs.hand_R[0], 0.16, w), L(offs.hand_R[1], 0.17, w), L(offs.hand_R[2], 0.14, w)]; bones.hand_R[0] -= 0.4 * w; break;
            case "cheer": face.happy = Math.max(face.happy, w); ring += 0.7 * w; { const b = 0.5 + 0.5 * Math.sin(lt * 2 * Math.PI * 3);
              offs.hand_L = [L(offs.hand_L[0], -0.13, w), L(offs.hand_L[1], 0.24 + 0.04 * b, w), L(offs.hand_L[2], 0.06, w)];
              offs.hand_R = [L(offs.hand_R[0], 0.13, w), L(offs.hand_R[1], 0.24 + 0.04 * (1 - b), w), L(offs.hand_R[2], 0.06, w)]; root.y += 0.02 * w * b; } break;
            case "clap": { const c = 0.5 + 0.5 * Math.cos(lt * 2 * Math.PI * 4.5); const k = w * (0.65 + 0.35 * c);
              offs.hand_L = [L(offs.hand_L[0], -0.24, k), L(offs.hand_L[1], 0.09, w), L(offs.hand_L[2], 0.16, w)];
              offs.hand_R = [L(offs.hand_R[0], 0.24, k), L(offs.hand_R[1], 0.05, w), L(offs.hand_R[2], 0.1, w)]; face.happy = Math.max(face.happy, w); break; }
            case "point": { const up = g.up ? 0.14 : 0;
              offs.hand_R = [L(offs.hand_R[0], 0.02, w), L(offs.hand_R[1], 0.12 + up, w), L(offs.hand_R[2], 0.25, w)];
              bones.hand_R = [L(bones.hand_R[0], -0.35 - up, w), 0, L(bones.hand_R[2], 0.3, w)]; face.gaze = [L(face.gaze[0], -0.2, w), L(face.gaze[1], 0.1 + up, w)]; bones.head[0] -= 0.06 * w; break; }
            case "present": { const up = w * (1 + 0.06 * Math.sin(lt * 9) * Math.exp(-lt * 3));
              offs.hand_R = [L(offs.hand_R[0], 0.05, up), L(offs.hand_R[1], 0.30, up), L(offs.hand_R[2], 0.12, up)]; bones.hand_R = [L(bones.hand_R[0], -0.5, w), 0, L(bones.hand_R[2], 0.45, w)];
              face.gaze = [L(face.gaze[0], -0.12, w), L(face.gaze[1], 0.2, w)]; face.happy = Math.max(face.happy, 0.4 * w); break; }
            case "wave": { const k = w;
              offs.hand_L = [L(offs.hand_L[0], 0.04, k), L(offs.hand_L[1], 0.30, k), L(offs.hand_L[2], 0.1, k)];
              bones.hand_L = [L(bones.hand_L[0], -0.3, k), 0, L(bones.hand_L[2], -0.35, k) + 0.45 * k * Math.sin(lt * 2 * Math.PI * 2.2)];
              face.happy = Math.max(face.happy, 0.7 * k); break; }
          }
        }
        face.blink *= 1 - face.happy;
        return { fr, kb, keys, state: { root, bones, offs, face, ring, shadow: false } };
      }
      const cv = document.getElementById("rb-canvas"), kbEl = document.getElementById("rb-kb"), KEYS = [];
      document.getElementById("rb-keys").innerHTML = Array.from({ length: 30 }, (_, i) => `<i id="rb-k${i}"></i>`).join("");
      for (let i = 0; i < 30; i++) KEYS.push(document.getElementById("rb-k" + i));
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      let robot = null;
      function apply(t) {
        const p = perf(t);
        if (!p) { robot.setState({ visible: false }); robot.render(); kbEl.style.opacity = "0"; return; }
        robot.setView({ fx: p.fr.fx, fy: p.fr.fy, h: p.fr.h, pitch: 5 });
        robot.setState(p.state); robot.render();
        // holo keyboard in front of the hands while typing (keys light up at 14 Hz, deterministic)
        const o = (0.9 * p.kb).toFixed(3); if (kbEl.style.opacity !== o) kbEl.style.opacity = o;
        if (p.kb > 0.001) {
          // in FRONT of the robot, just under its hands (the robot faces the viewer while typing)
          const x = p.fr.fx - 0.06 * p.fr.h, y = p.fr.fy - 0.1 * p.fr.h;
          kbEl.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) perspective(600px) rotateX(52deg) scale(${(0.75 + 0.25 * p.kb).toFixed(3)})`;
          const f = Math.floor(t * 14);
          for (let i = 0; i < 30; i++) KEYS[i].classList.toggle("on", hash(f * 31 + i) > 0.82);
        }
      }
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      const ready = window.Robot3D.Robot.create(cv, { url: "assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 })
        .then((r) => { robot = r; apply(0); });
      window.__hf.buildReady["robot"] = ready;
      window.addEventListener("hf-seek", (e) => { const t = e.detail.time + (window.__T0 || 0); if (robot) apply(t); else if (e.detail.waitUntil) e.detail.waitUntil(ready.then(() => apply(t))); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true }); tl.set({}, {}, D - 0.02);
      window.__timelines["robot"] = tl;
    })();
  </script>
</template>

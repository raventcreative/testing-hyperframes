<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business Roles Carousel</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(assets/fonts/Poppins-Regular.ttf)}
@font-face{font-family:Poppins;font-weight:600;src:url(assets/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
/* Safe zone: everything stays inside x 110–970, y 110–1240 (IG 4:5 post + 3:4 grid crop) */
:root{--cyan:#00c9ff;--white:#fff;--dim:rgba(255,255,255,.62);--line:rgba(255,255,255,.14);--sx:110px;--sy:110px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1030;font-family:Poppins,sans-serif;color:var(--white)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:url(assets/bg.png) center/cover;
  padding:230px var(--sx) var(--sy);display:flex;flex-direction:column}
b{font-weight:700}
.c{color:var(--cyan)}
.tag{align-self:flex-start;font-weight:600;font-size:21px;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);border:2px solid var(--cyan);border-radius:100px;padding:10px 26px}
.top{position:absolute;top:var(--sy);left:var(--sx)}
.logo-a{height:30px;display:block}
.bot{position:absolute;bottom:var(--sy);right:var(--sx);font-size:22px;font-weight:600;color:var(--cyan)}

/* COVER */
.cover .h{font-weight:700;font-size:96px;line-height:1.02;letter-spacing:-3px;margin-top:44px}
.cover .chips{margin-top:auto;margin-bottom:90px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cover .chips span{font-size:32px;font-weight:700;padding:30px 30px;border-radius:20px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);display:flex;align-items:center;gap:18px}
.cover .chips span i{font-style:normal;width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}

/* ROLE */
.role .name{font-weight:700;letter-spacing:-4px;line-height:1;margin-top:40px}
.role .name span{color:var(--cyan)}
.role .grid{margin-top:64px;margin-bottom:90px;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:22px}
.role .card{border-radius:26px;padding:34px;background:rgba(0,0,0,.24);border:1.5px solid var(--line);display:flex;flex-direction:column}
.role .card .k{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--cyan)}
.role .card .k svg{width:36px;height:36px;flex:none}
.role .card .v{margin-top:auto;font-size:44px;font-weight:400;line-height:1.15;letter-spacing:-.5px}
.role .card .v b{font-weight:700}
.role .card.risk{border:2px solid var(--cyan);background:rgba(0,201,255,.09)}

/* END */
.end{justify-content:center;align-items:center;text-align:center;padding-top:var(--sy)}
.end .pre{font-size:40px;font-weight:400;color:var(--dim)}
.end .big{font-size:104px;font-weight:700;letter-spacing:-3px;line-height:1.05;margin-top:18px}
.end .big .amp{color:var(--white);font-weight:400}
.end .line{width:120px;height:5px;border-radius:4px;background:var(--cyan);margin-top:46px;box-shadow:0 0 20px var(--cyan)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-aud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17 14.6c2.4.2 4 1.8 4.6 4.6"/></symbol>
    <symbol id="i-work" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18"/></symbol>
    <symbol id="i-risk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21.5 20h-19Z"/><path d="M12 10v4.5M12 17.4v.1"/></symbol>
    <symbol id="i-res" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20.5 7.5 12 12 3.5 7.5Z"/><path d="M3.5 12 12 16.5 20.5 12M3.5 16.5 12 21l8.5-4.5"/></symbol>
  </defs>
</svg>

<!-- 1 COVER -->
<section class="slide cover">
  <div class="top"><img class="logo-a" src="assets/logo.png" alt="AIpreneur"></div>
  <span class="tag">Business roles</span>
  <h1 class="h">6 roles.<br><span class="c">Audience, daily work, risk &amp; resources.</span></h1>
  <div class="chips">
    <span><i></i>Founder</span><span><i></i>CEO</span>
    <span><i></i>Entrepreneur</span><span><i></i>Business Owner</span>
    <span><i></i>Influencer</span><span><i></i>Investor</span>
  </div>
  <div class="bot">Swipe →</div>
</section>

<!--ROLES-->

<!-- END -->
<section class="slide end">
  <div class="top"><img class="logo-a" src="assets/logo.png" alt="AIpreneur"></div>
  <div class="pre">Follow for more</div>
  <div class="big"><span class="c">Branding</span> <span class="amp">&amp;</span><br><span class="c">Marketing</span></div>
  <div class="line"></div>
</section>

</body>
</html>

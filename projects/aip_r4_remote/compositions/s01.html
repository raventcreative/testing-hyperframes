  <script>
    (function () {
      // s01 HOOK "Aku bikin tim isi tiga Claude, yang tugasnya nyariin aku kerja remote."
      // Frame 0: eyebrow "TIM LOKER REMOTE" + three face-down seat cards ("?") already on screen · "tim": the seats bump together ·
      // "isi tiga": the cards flip one by one into the 3 Claude members (Pencari / Penyaring / Penulis CV) · "Claude,": the Claude marks
      // pulse · "tugasnya": each card's job line writes in · "nyariin … kerja": connectors draw down into a navy target pill ·
      // "remote.": the pill "Kerja remote" slams (ripple, camera kick).
      // TRANSITION → s02: the cards drop away (stagger), pill + eyebrow lift and fade. END STATE (t = D): everything invisible.
      const D = 4.8667, ST = 0, VW = window.VO_WORDS, R4 = window.R4;
      const L = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 0.05); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }

      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const tAku = L("Aku"), tTim = L("tim"), tIsi = L("isi"), tTiga = L("tiga"), tCl = L("Claude,"), tTug = L("tugasnya"), tNya = L("nyariin"),
        tKer = L("kerja"), tRem = L("remote.");
      const M = R4.M, CX = [90, 405, 720], CY = 404, JOB = ["Cari lowongan", "Saring yang cocok", "CV + cover letter"], ROLE = ["PENCARI", "PENYARING", "PENULIS CV"];

      let h = `<div class="s01-a" id="s01-glow"></div>`;
      h += `<div class="s01-a" id="s01-eb"><i>${R4.svg("brief", 2.2)}</i><b class="r4-grad">TIM LOKER REMOTE</b></div>`;
      h += `<svg class="s01-a" id="s01-lines" viewBox="0 0 1080 1920" fill="none">` +

          `<path id="s01-ln${k}" d="M${x0} ${y0} C ${x0} ${y0 + 40}, ${x1} ${y1 - 34}, ${x1} ${y1}" stroke="${M[k].c}" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>`).join("") +

      M.forEach((m, k) => {
        h += `<div class="s01-cd" id="s01-cd${k}" style="left:${CX[k]}px;top:${CY}px">` +
          `<div class="s01-fr" id="s01-fr${k}" style="--c:${m.c};--soft:${m.soft}"><div class="hd"></div><div class="av" id="s01-av${k}"><i></i></div><div class="bd">${R4.svg(m.ic, 2.4)}</div>` +
          `<div class="nm r4-grad">${m.n}</div><div class="rp">${ROLE[k]}</div><div class="dv"></div>` +
          `<div class="jb" id="s01-jb${k}">${R4.svg(["search", "funnel", "fileText"][k], 2.2)}<span>${JOB[k]}</span></div></div>` +
          `<div class="s01-bk" id="s01-bk${k}"><div class="gl"></div><div class="ring"></div><div class="q">?</div><div class="t">ANGGOTA ${k + 1}</div></div>` +
          `<div class="s01-sk" id="s01-sk${k}" style="left:135px;top:96px;--c:${m.c}"><i id="s01-sr${k}"></i></div></div>`;
      });
      h += `<div class="s01-a" id="s01-rip"></div>`;
      h += `<div class="s01-a" id="s01-tg"><div class="gi" id="s01-gi">${R4.svg("globe", 2)}</div><b>Kerja remote</b><div class="lp">${R4.svg("laptop", 1.8)}</div></div>`;
      $("s01-cam").innerHTML = h;
      const cam = $("s01-cam"), glow = $("s01-glow"), eb = $("s01-eb"), tg = $("s01-tg"), rip = $("s01-rip");

      // ================================================================ frame 0: eyebrow + three face-down seats already there
      I(cam, { x: 0, y: 0 });
      I(glow, { opacity: 0.9, scale: 0.92 }); ft(glow, { scale: 0.92 }, { scale: 1.02, duration: 4.2, ease: "sine.inOut" }, 0);
      I(eb, { opacity: 1, scale: 0.94, y: 6 }); ft(eb, { scale: 0.94, y: 6 }, { scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      M.forEach((m, k) => {
        const cd = $("s01-cd" + k), bk = $("s01-bk" + k), fr = $("s01-fr" + k);
        I(cd, { opacity: 1, y: 26 + k * 8, scale: 0.97, rotation: (k - 1) * 2.5 });
        ft(cd, { y: 26 + k * 8, scale: 0.97, rotation: (k - 1) * 2.5 }, { y: 0, scale: 1, rotation: 0, duration: 0.55 + k * 0.06, ease: "power3.out" }, 0);
        I(bk, { opacity: 1, rotationY: 0, transformPerspective: 900 });
        I(fr, { opacity: 0, rotationY: -90, transformPerspective: 900 });
        I($("s01-jb" + k), { opacity: 0, y: 10 });
        I($("s01-sr" + k), { opacity: 0, scale: 1 });
        I($("s01-av" + k), { scale: 1 });
        // "tim": the three seats bump together
        ft(cd, { y: 0 }, { y: -14, duration: 0.11, yoyo: true, repeat: 1, ease: "power2.out" }, tTim - 0.06 + k * 0.05);
        // "isi tiga": flip one by one (two flat faces, each with its own perspective — no nested 3D)
        const tf = tIsi + 0.02 + k * ((tTiga + 0.12 - tIsi) / 2);
        ft(bk, { rotationY: 0 }, { rotationY: 90, duration: 0.13, ease: "power2.in" }, tf);

      const tOut = D - 0.3;
      M.forEach((m, k) => ft($("s01-cd" + k), { opacity: 1, y: 0, scale: 1 }, { opacity: 0, y: 70, scale: 0.9, duration: 0.24, ease: "power2.in" }, tOut + k * 0.03));
      [0, 1, 2].forEach((k) => ft($("s01-ln" + k), { opacity: 1 }, { opacity: 0, duration: 0.15 }, tOut));
      ft(tg, { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.24, ease: "power2.in" }, tOut + 0.04);

      ft(glow, { opacity: 0.9 }, { opacity: 0, duration: 0.25 }, tOut + 0.03);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s01"] = tl;
    })();

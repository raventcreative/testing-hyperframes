      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="s13"]');
          const q = (s) => R.querySelector(s), qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
          let seed = 1313;
          const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
          const DUR = 3.05;
          const T = { dan: 0.18, inilah: 0.38, cara: 0.86, brand: 1.21, arah: 1.89, ai: 2.53 };

          // ---------- clapperboard entrance ----------
          const board = q("#s13-board"), stick = q("#s13-stickT"), cam = q("#s13-cam");
          tl.set(board, { y: 80, scale: 0.95, transformOrigin: "440px 0px" }, 0);
          tl.to(board, { y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
          tl.set(stick, { rotation: 0, transformOrigin: "40px 90px" }, 0);
          // inilah: stick lifts open
          tl.to(stick, { rotation: -12, duration: 0.3, ease: "power3.out" }, T.inilah);
          // cara: pull back further (anticipation)
          tl.to(stick, { rotation: -16, duration: 0.27, ease: "sine.out" }, T.cara);
          // AI PRENEUR: snap shut + small bounce
          tl.to(stick, { rotation: 0, duration: 0.08, ease: "power4.in" }, T.brand - 0.08);
          tl.to(stick, { rotation: -3, duration: 0.05, ease: "power2.out" }, T.brand);
          tl.to(stick, { rotation: 0, duration: 0.14, ease: "power2.in" }, T.brand + 0.05);
          tl.to(board, { y: 10, duration: 0.04, ease: "power2.out" }, T.brand);
          tl.to(board, { y: 0, duration: 0.28, ease: "back.out(3)" }, T.brand + 0.04);

          // title: placeholder → genuine logo stamps in on the snap
          const logo = q("#s13-logo"), ph = q("#s13-titleph");
          tl.set(logo, { opacity: 0, scale: 1.12, transformOrigin: "50% 50%" }, 0);
          tl.to(logo, { opacity: 1, scale: 1, duration: 0.16, ease: "power3.out" }, T.brand - 0.02);
          tl.to(ph, { opacity: 0, duration: 0.08, ease: "none" }, T.brand - 0.02);
          tl.fromTo(q("#s13-sweep"), { x: -260, rotation: 16 }, { x: 900, rotation: 16, duration: 0.6, ease: "power2.inOut" }, T.brand + 0.08);

          // spotlight beams flare from behind
          const rays = q("#s13-rays"), raysb = q("#s13-raysb");
          tl.set(rays, { opacity: 0, scale: 0.6, rotation: 0 }, 0);
          tl.set(raysb, { opacity: 0.25, scale: 0.7 }, 0);
          tl.to(raysb, { opacity: 0.45, scale: 0.8, duration: 0.35, ease: "sine.out" }, T.cara);
          tl.to(rays, { opacity: 0.18, scale: 0.75, duration: 0.35, ease: "sine.out" }, T.cara);
          tl.to(rays, { opacity: 1, scale: 1.08, duration: 0.18, ease: "power3.out" }, T.brand);
          tl.to(raysb, { opacity: 1, scale: 1.05, duration: 0.18, ease: "power3.out" }, T.brand);
          tl.to(rays, { opacity: 0.55, scale: 1, duration: 0.6, ease: "power2.out" }, T.brand + 0.2);
          tl.to(raysb, { opacity: 0.75, duration: 0.6, ease: "power2.out" }, T.brand + 0.2);
          tl.to(rays, { rotation: 14, duration: DUR, ease: "none" }, 0);

          // shockwave rings + chalk dust
          [["#s13-shock", 0, 2.5], ["#s13-shock2", 0.06, 2.1]].forEach(([s, d, sc]) => {
            const e = q(s);
            tl.set(e, { scale: 0.3, opacity: 0 }, 0);
            tl.to(e, { opacity: 1, duration: 0.03, ease: "none" }, T.brand + d);
            tl.to(e, { scale: sc, duration: 0.5, ease: "power3.out" }, T.brand + d);
            tl.to(e, { opacity: 0, duration: 0.35, ease: "power2.in" }, T.brand + d + 0.15);
          });
          const dusts = q("#s13-dusts");
          for (let i = 0; i < 18; i++) {
            const x0 = 160 + rnd() * 820, y0 = 720;
            const d = mk("div", "s13-dust", dusts, "left:" + x0 + "px;top:" + y0 + "px");
            const sz = 0.6 + rnd() * 1.4;
            tl.set(d, { opacity: 0, scale: sz }, 0);
            tl.to(d, { opacity: 1, duration: 0.03, ease: "none" }, T.brand);
            tl.to(d, { x: (rnd() - 0.5) * 220, y: -40 - rnd() * 160, duration: 0.6, ease: "power3.out" }, T.brand);
            tl.to(d, { opacity: 0, duration: 0.3, ease: "power1.in" }, T.brand + 0.3 + rnd() * 0.2);
          }

          // camera: drift + micro push on the snap, release for the console
          tl.set(cam, { scale: 1, y: 0, transformOrigin: "540px 960px" }, 0);
          tl.to(cam, { scale: 1.015, duration: T.brand, ease: "sine.inOut" }, 0);
          tl.to(cam, { scale: 1.05, duration: 0.22, ease: "power3.out" }, T.brand);
          tl.to(cam, { scale: 1.03, duration: 0.45, ease: "sine.inOut" }, T.brand + 0.22);
          tl.to(cam, { scale: 1, duration: 0.4, ease: "power3.inOut" }, T.arah);
          tl.to(cam, { scale: 1.02, duration: DUR - T.arah - 0.4, ease: "sine.inOut" }, T.arah + 0.4);

          // mengarahkan: board rises & scales to make room for the director console
          tl.to(board, { y: -210, scale: 0.82, duration: 0.42, ease: "power3.inOut" }, T.arah - 0.04);
          tl.to(board, { y: -218, duration: DUR - T.arah - 0.38, ease: "sine.inOut" }, T.arah + 0.38);
          tl.to(q("#s13-contact"), { opacity: 0.4, duration: 0.4, ease: "power2.out" }, T.arah);

          // ---------- director console ----------
          const con = q("#s13-console");
          tl.set(con, { y: 140, opacity: 0, scale: 0.94, transformOrigin: "50% 0%" }, 0);
          tl.to(con, { y: 0, opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" }, T.arah);
          tl.fromTo(q("#s13-knob"), { x: 0 }, { x: 110, duration: 0.6, ease: "power2.inOut" }, T.arah + 0.2);
          const CX = 90, CY = 1020, OX = 37, OY = 72, CW = 262, CH = 178, G = 20;
          const slots = q("#s13-slots"), cards = q("#s13-cards");
          const order = [0, 1, 2, 5, 4, 3]; // snake path for the cursor
          const content = [
            // 1 frame / image
            '<div class="s13-chd"></div><svg style="position:absolute;left:14px;top:32px" width="234" height="132" viewBox="0 0 234 132"><defs><linearGradient id="s13-g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0fb"/><stop offset="1" stop-color="#cbdbf4"/></linearGradient></defs><rect width="234" height="132" rx="10" fill="url(#s13-g1)"/><circle cx="178" cy="36" r="16" fill="#f2c46d" opacity="0.8"/><path d="M0 132 L70 56 L120 104 L156 74 L234 132 Z" fill="#3a6299"/><path d="M60 132 L120 84 L180 132 Z" fill="#294b77"/></svg>',
            // 2 waveform
            '<div class="s13-chd"></div><svg style="position:absolute;left:18px;top:44px" width="226" height="110" viewBox="0 0 226 110">' + Array.from({ length: 28 }, (_, i) => { const h = 14 + Math.abs(Math.sin(i * 0.9) * 70) + (i % 3) * 6; return '<rect x="' + (i * 8) + '" y="' + (55 - h / 2) + '" width="5" height="' + h + '" rx="2.5" fill="' + (i < 15 ? '#294b77' : '#acc6e7') + '"/>'; }).join("") + '</svg>',
            // 3 swatches
            '<div class="s13-chd"></div><div style="position:absolute;left:16px;top:48px;display:flex;gap:10px"><i style="width:48px;height:48px;border-radius:50%;background:#294b77;box-shadow:0 4px 8px rgba(28,51,84,.3)"></i><i style="width:48px;height:48px;border-radius:50%;background:#acc6e7"></i><i style="width:48px;height:48px;border-radius:50%;background:#9fd8c4"></i><i style="width:48px;height:48px;border-radius:50%;background:#f2c46d"></i></div><div class="s13-cln" style="left:16px;top:120px;width:200px"></div><div class="s13-cln" style="left:16px;top:140px;width:130px"></div>',
            // 4 mini timeline
            '<div class="s13-chd"></div><div class="s13-cln" style="left:16px;top:52px;width:228px;background:#3a6299;height:12px;border-radius:6px"></div><div class="s13-cln" style="left:60px;top:80px;width:150px;background:#acc6e7;height:12px;border-radius:6px"></div><div class="s13-cln" style="left:30px;top:108px;width:110px;background:#cbdbf4;height:12px;border-radius:6px"></div><i style="position:absolute;left:150px;top:44px;width:3px;height:110px;background:#294b77;border-radius:2px"></i><i style="position:absolute;left:94px;top:136px;width:14px;height:14px;background:#294b77;transform:rotate(45deg);border-radius:3px"></i><i style="position:absolute;left:190px;top:136px;width:14px;height:14px;background:#fbfcfe;border:2.5px solid #294b77;transform:rotate(45deg);border-radius:3px"></i>',
            // 5 play / progress
            '<div class="s13-chd"></div><div style="position:absolute;left:96px;top:40px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#3a6299,#1f3a5f);box-shadow:0 8px 14px -4px rgba(28,51,84,.5)"><i style="position:absolute;left:27px;top:20px;width:0;height:0;border-left:24px solid #fbfcfe;border-top:15px solid transparent;border-bottom:15px solid transparent"></i></div><div class="s13-cln" style="left:16px;top:134px;width:228px"></div><div class="s13-cln" style="left:16px;top:134px;width:140px;background:#294b77"></div><i style="position:absolute;left:150px;top:128px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #294b77"></i>',
            // 6 layout grid
            '<div class="s13-chd"></div><div style="position:absolute;left:16px;top:36px;width:230px;height:126px;display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:8px"><i style="grid-row:span 2;border-radius:10px;background:linear-gradient(160deg,#cbdbf4,#acc6e7)"></i><i style="border-radius:10px;background:#e8f0fb;border:2px solid #cbdbf4"></i><i style="border-radius:10px;background:#294b77;opacity:.85"></i></div>',
          ];
          const LAND0 = 2.12, STEP = 0.07;
          const cursor = q("#s13-cursor"), tap = q("#s13-tap");
          tl.set(cursor, { x: 1000, y: 1560, opacity: 0, scale: 1 }, 0);
          tl.set(tap, { scale: 0.3, opacity: 0 }, 0);
          tl.to(cursor, { opacity: 1, duration: 0.12, ease: "none" }, T.arah + 0.08);
          const cardEls = [];
          order.forEach((slotIdx, k) => {
            const col = slotIdx % 3, row = Math.floor(slotIdx / 3);
            const lx = OX + col * (CW + G), ly = OY + row * (CH + G);
            mk("div", "s13-slot", slots, "left:" + lx + "px;top:" + ly + "px");
            const c = mk("div", "s13-card", cards, "left:" + (CX + lx) + "px;top:" + (CY + ly) + "px");
            c.innerHTML = content[slotIdx] + '<div class="s13-cmint"></div>';
            cardEls.push(c);
            const land = LAND0 + k * STEP;
            const ang = -2.4 + k * 0.95;
            const fx = Math.cos(ang) * 520 + (rnd() - 0.5) * 80, fy = -120 + Math.sin(ang) * 260 + (rnd() - 0.5) * 60;
            tl.set(c, { x: fx, y: fy, rotation: (rnd() - 0.5) * 50, scale: 0.72, opacity: 0 }, 0);
            tl.to(c, { opacity: 1, duration: 0.08, ease: "none" }, land - 0.3);
            tl.to(c, { x: 0, y: 0, rotation: 0, scale: 1.05, duration: 0.28, ease: "power3.out" }, land - 0.3);
            tl.to(c, { scale: 1, duration: 0.16, ease: "back.out(3)" }, land - 0.02);
            tl.set(c.querySelector(".s13-cmint"), { opacity: 0 }, 0);
            // the cursor directs each card into its slot
            const px = CX + lx + CW * 0.62, py = CY + ly + CH * 0.58;
            tl.to(cursor, { x: px, y: py, duration: k === 0 ? 0.2 : STEP, ease: k === 0 ? "power3.out" : "power1.inOut" }, land - (k === 0 ? 0.2 : STEP));
            tl.to(cursor, { scale: 0.86, duration: 0.03, ease: "none" }, land - 0.01);
            tl.to(cursor, { scale: 1, duration: 0.05, ease: "power2.out" }, land + 0.02);
          });
          // tap ripples
          cardEls.forEach((c, k) => {
            const t = LAND0 + k * STEP;
            const tp = k === 0 ? tap : mk("div", "s13-tap", cursor);
            tl.set(tp, { scale: 0.3, opacity: 0 }, 0);
            tl.to(tp, { opacity: 1, duration: 0.02, ease: "none" }, t);
            tl.to(tp, { scale: 1.6, duration: 0.25, ease: "power2.out" }, t);
            tl.to(tp, { opacity: 0, duration: 0.18, ease: "power1.in" }, t + 0.08);
          });
          // cursor glides away after the grid locks
          tl.to(cursor, { x: 960, y: 1440, duration: 0.35, ease: "power2.inOut" }, T.ai + 0.05);
          tl.to(cursor, { opacity: 0, duration: 0.2, ease: "none" }, T.ai + 0.3);

          // AI.: grid locks with mint check glow
          const lg = q("#s13-lockglow"), chk = q("#s13-check"), chp = q("#s13-checkp");
          tl.set(lg, { opacity: 0, scale: 1.03 }, 0);
          tl.to(lg, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, T.ai);
          tl.to(lg, { opacity: 0.55, duration: 0.3, ease: "sine.inOut" }, T.ai + 0.25);
          tl.set(chk, { scale: 0, rotation: -40, opacity: 0 }, 0);
          tl.to(chk, { scale: 1, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, T.ai);
          tl.set(chp, { strokeDasharray: 70, strokeDashoffset: 70 }, 0);
          tl.to(chp, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, T.ai + 0.08);
          cardEls.forEach((c, k) => {
            const m = c.querySelector(".s13-cmint");
            tl.to(m, { opacity: 1, duration: 0.1, ease: "none" }, T.ai + k * 0.025);
            tl.to(m, { opacity: 0.35, duration: 0.3, ease: "sine.inOut" }, T.ai + 0.15 + k * 0.025);
          });
          tl.to(con, { scale: 1.012, duration: 0.1, ease: "power2.out" }, T.ai);
          tl.to(con, { scale: 1, duration: 0.25, ease: "back.out(2)" }, T.ai + 0.1);

          // ---------- far plane ambience ----------
          tl.set(q("#s13-coneL"), { rotation: -26, opacity: 0.6 }, 0);
          tl.set(q("#s13-coneR"), { rotation: 26, opacity: 0.45 }, 0);
          tl.to(q("#s13-coneL"), { rotation: -20, opacity: 0.85, duration: DUR, ease: "sine.inOut" }, 0);
          tl.to(q("#s13-coneR"), { rotation: 21, opacity: 0.7, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo(q("#s13-reel1"), { rotation: 0, x: 0 }, { rotation: 70, x: 30, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s13-reel2"), { rotation: 0, y: 0 }, { rotation: -60, y: -40, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s13-bk1"), { x: 0, y: 0 }, { x: -40, y: 30, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s13-bk2"), { x: 0, y: 0 }, { x: 50, y: -40, duration: DUR, ease: "none" }, 0);
          tl.set(q("#s13-halo"), { opacity: 0.7, scale: 0.92 }, 0);
          tl.to(q("#s13-halo"), { opacity: 1, scale: 1.04, duration: 0.3, ease: "power2.out" }, T.brand);

          window.__timelines["s13"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

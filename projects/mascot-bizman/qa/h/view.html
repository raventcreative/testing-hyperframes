<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#e8e8e8}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="viewer.js"></script>
<script>
  // ?url=..&views=0,90&box=x0,x1,y0,y1&w=1400&h=1000&unlit=1
  const q = new URLSearchParams(location.search);
  const c = document.getElementById('c');
  c.width = +(q.get('w') || 1400); c.height = +(q.get('h') || 1000);
  const views = (q.get('views') || '0').split(',').map(Number);
  const box = q.get('box') ? q.get('box').split(',').map(Number) : null;
  window.READY = MascotViewer.render(c, q.get('url'), views, box, q.get('unlit') === '1').then(() => true);
</script></body></html>

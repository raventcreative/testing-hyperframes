    #s15-far2 { left: 830px; top: 1380px; width: 210px; height: 210px; background: radial-gradient(circle at 30% 30%, #ffffff, #c6d6ec 60%, #8ea9cc); filter: blur(16px); opacity: .45; }
    #s15-far3 { left: 800px; top: 440px; width: 220px; height: 140px; border-radius: 26px; background: linear-gradient(160deg, rgba(255,255,255,.85), rgba(220,232,246,.5)); border: 2px solid rgba(255,255,255,.8); filter: blur(6px); opacity: .5; }

  <div id="root" data-composition-id="s15" data-width="1080" data-height="1920">

    <div class="s15-far" id="s15-far2" data-layout-ignore></div>

    <div id="s15-cam">
      <svg id="s15-svg" viewBox="0 0 1080 1920" aria-hidden="true">
        <defs>
          <linearGradient id="s15-porc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#edf3fb"/><stop offset="1" stop-color="#c3d4ea"/></linearGradient>
          <linearGradient id="s15-porc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5e2f2"/></linearGradient>
          <linearGradient id="s15-well" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8cbe4"/><stop offset=".3" stop-color="#dce8f6"/><stop offset="1" stop-color="#eef4fc"/></linearGradient>
          <linearGradient id="s15-navy" x1="0" y1="0" x2="1" y2=".25"><stop offset="0" stop-color="#121532"/><stop offset="1" stop-color="#274976"/></linearGradient>
          <linearGradient id="s15-screen" x1="0" y1="0" x2="1" y2=".55"><stop offset="0" stop-color="#121532"/><stop offset="1" stop-color="#274976"/></linearGradient>
          <linearGradient id="s15-chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#dce8f6"/><stop offset="1" stop-color="#7f9cc4"/></linearGradient>
          <radialGradient id="s15-shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#121532" stop-opacity=".30"/><stop offset=".55" stop-color="#121532" stop-opacity=".08"/><stop offset="1" stop-color="#121532" stop-opacity="0"/></radialGradient>
          <radialGradient id="s15-sheen" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="#8ea9cc" stop-opacity=".35"/><stop offset="1" stop-color="#274976" stop-opacity="0"/></radialGradient>
          <filter id="s15-drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#121532" flood-opacity=".22"/></filter>
          <filter id="s15-drop-s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#121532" flood-opacity=".25"/></filter>
          <clipPath id="s15-screenclip"><rect x="92" y="582" width="826" height="406" rx="22"/></clipPath>
        </defs>

        <!-- contact shadows -->
        <ellipse cx="505" cy="1430" rx="480" ry="40" fill="url(#s15-shadow)"/>
        <ellipse cx="1000" cy="1478" rx="90" ry="14" fill="url(#s15-shadow)"/>

        <!-- cable from the docking socket to the floor -->
        <path d="M1002 860 C1004 960 1050 1010 1040 1120 C1030 1240 960 1300 990 1470 L1090 1470" fill="none" stroke="#274976" stroke-width="16" stroke-linecap="round"/>
        <path d="M1002 860 C1004 960 1050 1010 1040 1120 C1030 1240 960 1300 990 1470" fill="none" stroke="#3a5d8f" stroke-width="5" stroke-linecap="round" opacity=".8"/>

        <!-- ===== TERMINAL SLAB ===== -->
        <g id="s15-slab">
          <!-- rubber feet x4 -->
          <g fill="url(#s15-navy)"><rect x="110" y="1392" width="90" height="22" rx="9"/><rect x="330" y="1392" width="90" height="22" rx="9"/><rect x="590" y="1392" width="90" height="22" rx="9"/><rect x="810" y="1392" width="90" height="22" rx="9"/></g>
          <!-- docking socket (side) -->
          <g filter="url(#s15-drop-s)">
            <rect x="930" y="690" width="110" height="180" rx="40" fill="url(#s15-porc)" stroke="#ffffff" stroke-width="4"/>
          </g>
          <rect x="962" y="716" width="54" height="120" rx="27" fill="url(#s15-chrome)" stroke="#ffffff" stroke-width="2"/>
          <rect x="974" y="730" width="30" height="92" rx="15" fill="#121532"/>
          <rect x="982" y="744" width="14" height="64" rx="7" fill="#274976"/>
          <circle id="s15-sockled" cx="989" cy="852" r="7" fill="#5f7fa8"/>
          <rect id="s15-sockring" x="958" y="712" width="62" height="128" rx="31" fill="none" stroke="#ffffff" stroke-width="5"/>

          <g filter="url(#s15-drop)">
            <rect x="48" y="538" width="914" height="862" rx="50" fill="url(#s15-porc)" stroke="#ffffff" stroke-width="5"/>
          </g>
          <rect x="62" y="552" width="886" height="834" rx="42" fill="none" stroke="#c9d8ec" stroke-width="2"/>
          <path d="M62 1300 L62 610 Q62 552 120 552 L640 552" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".95"/>
          <!-- bezel screws x4 -->
          <g fill="url(#s15-chrome)" stroke="#5f7fa8" stroke-width="1.5"><circle cx="76" cy="566" r="7"/><circle cx="934" cy="566" r="7"/><circle cx="76" cy="1006" r="7"/><circle cx="934" cy="1006" r="7"/></g>

          <!-- screen bezel + navy screen (the required navy box) -->
          <rect x="84" y="574" width="842" height="422" rx="28" fill="url(#s15-chrome)" stroke="#ffffff" stroke-width="3"/>
          <rect x="92" y="582" width="826" height="406" rx="22" fill="url(#s15-screen)"/>
          <g clip-path="url(#s15-screenclip)">
            <rect id="s15-glow" x="92" y="582" width="826" height="406" fill="url(#s15-sheen)"/>
            <!-- title bar -->
            <rect x="92" y="582" width="826" height="62" fill="#121532" opacity=".45"/>
            <circle cx="132" cy="613" r="9" fill="#dce8f6"/><circle cx="160" cy="613" r="9" fill="#8ea9cc"/><circle cx="188" cy="613" r="9" fill="#3a5d8f"/>
            <rect x="230" y="606" width="170" height="14" rx="7" fill="#3a5d8f"/>
            <rect x="830" y="606" width="56" height="14" rx="7" fill="#26354e"/>
            <rect x="92" y="644" width="826" height="2" fill="#3a5d8f"/>
            <!-- line 1: prompt + command -->
            <text x="130" y="742" class="s15-ch" fill="#8ea9cc">$</text>
            <g id="s15-cmd"></g>
            <!-- line 2: install progress + check badge -->
            <rect x="172" y="808" width="560" height="14" rx="7" fill="#26354e"/>
            <rect id="s15-prog" x="172" y="808" width="560" height="14" rx="7" fill="#dce8f6"/>
            <g id="s15-badge">
              <circle cx="800" cy="815" r="32" fill="#f7faff" stroke="#8ea9cc" stroke-width="4"/>
              <path d="M784 816 L796 828 L818 804" fill="none" stroke="#121532" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <!-- line 3: next prompt -->
            <text id="s15-p2" x="130" y="912" class="s15-ch" fill="#8ea9cc">$</text>
            <!-- cursor block -->
            <rect id="s15-cursor" x="172" y="712" width="20" height="40" rx="3" fill="#dce8f6"/>
            <!-- glass reflection band -->
            <path d="M560 582 L700 582 L420 988 L280 988Z" fill="#ffffff" opacity=".06"/>
            <path d="M730 582 L770 582 L490 988 L450 988Z" fill="#ffffff" opacity=".05"/>
          </g>
          <path d="M100 960 L100 610 Q100 590 120 590 L420 590" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".35"/>

          <!-- keyboard well -->
          <rect x="92" y="1028" width="826" height="300" rx="26" fill="url(#s15-well)" stroke="#ffffff" stroke-width="3"/>
          <rect x="92" y="1028" width="826" height="10" rx="5" fill="#9fb6d6" opacity=".5"/>
          <g id="s15-keys"></g>
          <!-- port lights x3 + grille -->
          <g fill="#b8cbe4"><rect x="120" y="1352" width="60" height="8" rx="4"/><rect x="194" y="1352" width="60" height="8" rx="4"/><rect x="268" y="1352" width="60" height="8" rx="4"/></g>
          <rect x="770" y="1342" width="126" height="28" rx="14" fill="url(#s15-navy)"/>
          <circle id="s15-pl1" cx="796" cy="1356" r="7" fill="#5f7fa8"/>
          <circle id="s15-pl2" cx="833" cy="1356" r="7" fill="#5f7fa8"/>
          <circle id="s15-pl3" cx="870" cy="1356" r="7" fill="#5f7fa8"/>
        </g>

        <!-- fx -->
        <circle id="s15-shock" cx="800" cy="815" r="70" fill="none" stroke="#ffffff" stroke-width="7"/>
        <circle id="s15-shock0" cx="505" cy="1180" r="120" fill="none" stroke="#ffffff" stroke-width="6"/>
        <g fill="#ffffff">
          <path id="s15-sp1" d="M872 770 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 l18 -6Z"/>
          <path id="s15-sp2" d="M730 856 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5Z"/>
          <path id="s15-sp3" d="M884 880 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4Z"/>
          <path id="s15-sp4" d="M906 812 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4Z"/>
        </g>
      </svg>
    </div>
    <svg id="s15-near" viewBox="0 0 130 110" aria-hidden="true" data-layout-ignore>
      <rect x="8" y="22" width="114" height="80" rx="16" fill="#8ea9cc"/>
      <rect x="8" y="8" width="114" height="80" rx="16" fill="#f7faff" stroke="#ffffff" stroke-width="3"/>
      <rect x="26" y="24" width="78" height="10" rx="5" fill="#dce8f6"/>
    </svg>
  </div>
  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="s15"]');
      const q = (s) => R.querySelector(s);
      const qa = (s) => R.querySelectorAll(s);
      const NS = "http://www.w3.org/2000/svg";
      const CMD = "npx skills add hypit-ai/hypit -g";
      const X0 = 172, ADV = 21; // 35px JetBrains Mono advance = 0.6em

      // ---- command glyphs, one fixed-advance <text> per char (deterministic layout) ----
      const cmd = q("#s15-cmd");
      const chars = [];
      for (let i = 0; i < CMD.length; i++) {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", X0 + i * ADV); t.setAttribute("y", 742);
        t.setAttribute("class", "s15-ch"); t.setAttribute("fill", "#ffffff");
        t.textContent = CMD[i];
        cmd.appendChild(t); chars.push(t);
      }

      // ---- keycaps (3 rows) ----
      const keysG = q("#s15-keys");
      const caps = [];
      function key(x, y, w) {
        const g = document.createElementNS(NS, "g");
        g.innerHTML = '<rect x="' + x + '" y="' + (y + 7) + '" width="' + w + '" height="62" rx="13" fill="#8ea9cc"/>';
        const cap = document.createElementNS(NS, "g");
        cap.innerHTML = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="62" rx="13" fill="url(#s15-porc2)" stroke="#ffffff" stroke-width="2"/>' +
          '<rect x="' + (x + 10) + '" y="' + (y + 8) + '" width="' + (w - 20) + '" height="5" rx="2.5" fill="#ffffff" opacity=".9"/>';
        g.appendChild(cap); keysG.appendChild(g);
        return cap;
      }
      const letters = [];
      for (let i = 0; i < 11; i++) letters.push(key(116 + i * 72, 1050, 62));
      for (let i = 0; i < 9; i++) letters.push(key(152 + i * 72, 1130, 62));
      const enter = key(800, 1130, 98);
      const fnL = [key(116, 1210, 62), key(188, 1210, 62)];
      const space = key(260, 1210, 420);
      const fnR = [key(692, 1210, 62), key(764, 1210, 62), key(836, 1210, 62)];
      caps.push(...letters, enter, space, ...fnL, ...fnR);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const A = 1.129;          // apex 'pasang' — typing starts
      const STEP = 0.028;       // 33 chars -> last char at ~2.025
      const T_ENTER = 2.09, T_CHECK = 2.22;
      const sparks = ["#s15-sp1", "#s15-sp2", "#s15-sp3", "#s15-sp4"];

      // ---- initial states ----
      gsap.set("#s15-cam", { scale: 1.0, x: 0 });
      gsap.set(chars, { opacity: 0 });
      gsap.set(caps, { y: 0 });
      gsap.set("#s15-cursor", { x: 0, y: 0, opacity: 1 });
      gsap.set("#s15-p2", { opacity: 0 });
      gsap.set("#s15-prog", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#s15-badge", { scale: 0, opacity: 0, svgOrigin: "800 815" });
      gsap.set("#s15-shock", { scale: 0.6, opacity: 0, svgOrigin: "800 815" });
      gsap.set("#s15-shock0", { scale: 0.6, opacity: 0, svgOrigin: "505 1180" });
      gsap.set(sparks, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(["#s15-pl1", "#s15-pl2", "#s15-pl3", "#s15-sockled"], { fill: "#5f7fa8" });
      gsap.set("#s15-sockring", { opacity: 0 });
      gsap.set("#s15-glow", { opacity: 0.6 });
      gsap.set("#s15-slab", { scale: 1, svgOrigin: "505 1400" });
      gsap.set(["#s15-far1", "#s15-far2", "#s15-far3"], { x: 0 });
      gsap.set("#s15-near", { x: 0, y: 0, rotation: 10 });

      // ---- camera: push in toward the screen ----
      tl.fromTo("#s15-cam", { scale: 1.0 }, { scale: 1.05, duration: 2.95, ease: "power1.inOut", immediateRender: false }, 0);
      tl.fromTo("#s15-far1", { x: 0 }, { x: 16, duration: 2.95, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s15-far2", { x: 0 }, { x: -14, duration: 2.95, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s15-far3", { x: 0 }, { x: -10, duration: 2.95, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s15-near", { x: 0, y: 0, rotation: 10 }, { x: -50, y: -16, rotation: 2, duration: 2.95, ease: "none", immediateRender: false }, 0);

      // ---- 'Untuk mulai': deterministic cursor blink (keyed steps) ----
      [0.27, 0.8].forEach((t) => tl.set("#s15-cursor", { opacity: 0 }, t));
      [0.53, 1.06].forEach((t) => tl.set("#s15-cursor", { opacity: 1 }, t));

      // ---- APEX 'pasang' 1.129: typing begins, slab answers with a micro punch ----
      tl.fromTo("#s15-slab", { scale: 1 }, { scale: 1.012, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
      tl.fromTo("#s15-glow", { opacity: 0.6 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, A);
      tl.fromTo("#s15-shock0", { scale: 0.6, opacity: 0.6 }, { scale: 2.2, opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, A);
      let li = 0;
      for (let i = 0; i < CMD.length; i++) {
        const t = A + i * STEP;
        tl.set(chars[i], { opacity: 1 }, t);
        tl.set("#s15-cursor", { x: (i + 1) * ADV }, t);
        let cap;
        if (CMD[i] === " ") cap = space;
        else { cap = letters[(li * 8) % letters.length]; li++; }
        tl.set(cap, { y: 6 }, t);
        tl.set(cap, { y: 0 }, t + 0.07);
      }

      // ---- enter: progress fills, cursor drops to a fresh prompt ----
      tl.set(enter, { y: 7 }, T_ENTER);
      tl.set(enter, { y: 0 }, T_ENTER + 0.1);
      tl.set("#s15-cursor", { x: 0, y: 170 }, T_ENTER);
      tl.set("#s15-p2", { opacity: 1 }, T_ENTER);
      tl.fromTo("#s15-prog", { scaleX: 0 }, { scaleX: 1, duration: 0.13, ease: "power2.out", immediateRender: false }, T_ENTER);

      // ---- check badge + shockwave ----
      tl.fromTo("#s15-badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.4)", immediateRender: false }, T_CHECK);
      tl.fromTo("#s15-shock", { scale: 0.6, opacity: 0.9 }, { scale: 2.0, opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, T_CHECK);
      tl.fromTo(sparks, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)", stagger: 0.035, immediateRender: false }, T_CHECK);
      tl.to(sparks, { scale: 0, opacity: 0, duration: 0.26, ease: "power2.in", stagger: 0.035 }, T_CHECK + 0.26);

      // ---- 'coding agent': port lights + docking socket wake ----
      tl.fromTo(["#s15-pl1", "#s15-pl2", "#s15-pl3"], { fill: "#5f7fa8" }, { fill: "#ffffff", duration: 0.08, stagger: 0.09, immediateRender: false }, 2.24);
      tl.fromTo("#s15-sockled", { fill: "#5f7fa8" }, { fill: "#ffffff", duration: 0.08, immediateRender: false }, 2.52);
      tl.fromTo("#s15-sockring", { opacity: 0 }, { opacity: 0.9, duration: 0.14, ease: "power2.out", immediateRender: false }, 2.52);
      tl.to("#s15-sockring", { opacity: 0.45, duration: 0.3, ease: "power1.out" }, 2.66);

      // ---- settled cursor blink on the fresh prompt ----
      tl.set("#s15-cursor", { opacity: 0 }, 2.4);
      tl.set("#s15-cursor", { opacity: 1 }, 2.66);

      window.__timelines["s15"] = tl;
    })();
  </script>
</template>

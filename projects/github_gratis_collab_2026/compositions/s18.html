  <script>
    (function () {
      const D = 3.2;
      const root = document.querySelector('[data-composition-id="s18"]');
      const $ = (id) => root.querySelector("#" + id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      // words (local s): Komen 0.21 · GRATIS 0.62 · nanti 1.21 · aku 1.56 · kirim 1.67 · ke 2.03 · DM 2.08 · kamu 2.22 — everything is still from 2.6 to the end
      const bar = $("s18-bar"), caret = $("s18-caret"), typed = $("s18-typed");
      tl.set($("s18-blob"), { opacity: 0.55 }, 0);
      ft($("s18-blob"), { opacity: 0.55 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      // "Komen": the bar takes focus, caret starts blinking
      tl.set($("s18-focus"), { opacity: 0 }, 0);
      ft($("s18-focus"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.16);
      ft(bar, { scale: 1 }, { scale: 1.03, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, 0.2);
      tl.set($("s18-avring"), { opacity: 0, scale: 0.6 }, 0);
      ft($("s18-avring"), { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 1.25, duration: 0.45, ease: "power3.out" }, 0.21);
      tl.set(caret, { opacity: 0 }, 0);
      [[0.12, 1], [0.36, 0], [0.5, 1]].forEach(([t, v]) => tl.set(caret, { opacity: v }, t));

      // "GRATIS": typed letter by letter, starting exactly on the word
      const letters = Array.from(typed.querySelectorAll("span"));
      tl.set($("s18-ph"), { opacity: 1 }, 0);
      tl.set($("s18-ph"), { opacity: 0 }, 0.6);
      letters.forEach((s, k) => {
        const t = 0.6 + k * 0.05;
        tl.set(s, { display: "none" }, 0);
        tl.set(s, { display: "inline-block" }, t);
        ft(s, { scale: 0.5, y: 10 }, { scale: 1, y: 0, duration: 0.14, ease: "back.out(3)" }, t);
      });
      [[0.95, 0], [1.0, 1]].forEach(([t, v]) => tl.set(caret, { opacity: v }, t));

      // send: button press, the word lifts out of the bar into a sent comment
      const send = $("s18-send");
      ft(send, { scale: 1 }, { scale: 0.84, duration: 0.07, ease: "power2.in" }, 0.94);
      ft(send, { scale: 0.84 }, { scale: 1, duration: 0.32, ease: "back.out(3)" }, 1.01);
      tl.set($("s18-sring"), { opacity: 0, scale: 0.6 }, 0);
      ft($("s18-sring"), { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 1.4, duration: 0.45, ease: "power3.out" }, 1.0);
      ft(typed, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, 1.0);
      letters.forEach((s) => tl.set(s, { display: "none" }, 1.1));
      ft(typed, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 1.12);
      ft($("s18-ph"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.16);
      [[1.4, 0], [1.66, 1], [1.92, 0], [2.18, 1]].forEach(([t, v]) => tl.set(caret, { opacity: v }, t));
      const sent = $("s18-sent");
      tl.set(sent, { opacity: 0, x: 40, y: 170, scale: 0.86, transformOrigin: "0% 50%" }, 0);
      ft(sent, { opacity: 0, x: 40, y: 170, scale: 0.86 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, 1.0);

      // "kirim ke DM": a paper plane flies from the comment to the DM bubble along an arc
      const dm = $("s18-dm");
      tl.set(dm, { opacity: 0, x: 60, scale: 0.8, transformOrigin: "20% 50%" }, 0);
      ft(dm, { opacity: 0, x: 60, scale: 0.8 }, { opacity: 1, x: 0, scale: 1, duration: 0.38, ease: "back.out(1.8)" }, 1.8);
      const P = [[440, 440], [520, 296], [716, 288], [790, 440]];
      const bz = (u, k) => { const v = 1 - u; return v * v * v * P[0][k] + 3 * v * v * u * P[1][k] + 3 * v * u * u * P[2][k] + u * u * u * P[3][k]; };
      const bzd = (u, k) => { const v = 1 - u; return 3 * v * v * (P[1][k] - P[0][k]) + 6 * v * u * (P[2][k] - P[1][k]) + 3 * u * u * (P[3][k] - P[2][k]); };
      const E = gsap.parseEase("power2.inOut"), T0 = 1.64, TD = 0.44;
      const plane = $("s18-plane"), pw = $("s18-planew"), fly = { p: 0 };
      const place = (p) => { const u = E(p); gsap.set(plane, { x: bz(u, 0), y: bz(u, 1), rotation: Math.atan2(bzd(u, 1), bzd(u, 0)) * 180 / Math.PI + 45, scale: 1 - 0.35 * Math.max(0, (u - 0.75) / 0.25) }); };
      place(0);
      tl.set(pw, { opacity: 0 }, 0);
      tl.set(fly, { p: 0 }, 0);
      ft(pw, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, T0);
      ft(fly, { p: 0 }, { p: 1, duration: TD, ease: "none", onUpdate: () => place(fly.p) }, T0);
      ft(pw, { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "power1.in" }, T0 + TD - 0.05);
      // dotted trail left behind (each dot appears as the plane passes it)
      const dots = $("s18-dots"), inv = (target) => { let a = 0, b = 1; for (let n = 0; n < 30; n++) { const m = (a + b) / 2; if (E(m) < target) a = m; else b = m; } return (a + b) / 2; };
      for (let k = 0; k < 12; k++) {
        const u = 0.06 + k * 0.071, d = document.createElement("div"); d.className = "s18-abs s18-dot"; dots.appendChild(d);
        d.style.left = bz(u, 0).toFixed(1) + "px"; d.style.top = bz(u, 1).toFixed(1) + "px";
        tl.set(d, { opacity: 0, scale: 0 }, 0);
        ft(d, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(3)" }, T0 + inv(u) * TD);
      }
      // "DM": the plane lands, the bubble answers
      ft(dm, { scale: 1 }, { scale: 1.1, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, 2.08);
      tl.set($("s18-dring"), { opacity: 0, scale: 0.5 }, 0);
      ft($("s18-dring"), { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.5, duration: 0.45, ease: "power3.out" }, 2.08);

      // ---------------- the calm lockup: the bar steps away, the brand settles; still from 2.6 ----------------
      ft(bar, { scale: 1, y: 0, opacity: 1 }, { scale: 0.72, y: 24, opacity: 0, duration: 0.2, ease: "power3.in" }, 2.12);
      ft($("s18-cta"), { y: 0 }, { y: 60, duration: 0.36, ease: "power3.inOut" }, 2.22);   // the comment → DM line settles into the lockup
      const logo = $("s18-logo");
      tl.set(logo, { opacity: 0, y: 14, clipPath: "inset(0% 50% 0% 50%)" }, 0);
      ft(logo, { opacity: 0, y: 14, clipPath: "inset(0% 50% 0% 50%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: "power3.out" }, 2.26);
      tl.set($("s18-rule"), { scaleX: 0 }, 0);
      ft($("s18-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.inOut" }, 2.26);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s18"] = tl;
    })();
  </script>

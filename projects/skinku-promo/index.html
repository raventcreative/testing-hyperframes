<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      :root {
        --ink: #800000;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f6d3dc;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font);
        color: var(--ink);
      }
      .bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .logo-wrap {
        position: absolute;
        top: 170px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
      }
      .logo {
        display: block;
        width: 200px;
        height: auto;
      }
      .copy {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 18px;
      }
      .line-reg {
        display: block;
        font-weight: 400;
        font-size: 58px;
        line-height: 1.15;
      }
      .line-bold {
        display: block;
        font-weight: 700;
        font-size: 104px;
        line-height: 1.02;
        letter-spacing: -0.02em;
      }
      .tag {
        display: block;
        margin-top: 26px;
        font-weight: 400;
        font-size: 40px;
        letter-spacing: 0.04em;
      }
      .tag b { font-weight: 700; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="bg clip" data-start="0" data-duration="4" data-track-index="0">
        <img id="bg-img" data-layout-allow-overflow src="assets/brand/bg-pink.png" alt="" />
      </div>

      <div id="logo" class="logo-wrap clip" data-start="0" data-duration="4" data-track-index="1">
        <img id="logo-img" class="logo" src="assets/brand/skinku-logo.png" alt="SKIN-KU" />
      </div>

      <div id="copy" class="copy clip" data-start="0" data-duration="4" data-track-index="2">
        <span id="l1" class="line-reg">Udah mandi 2x sehari,</span>
        <span id="l2" class="line-bold">kok badan masih kusam?</span>
        <span id="l3" class="tag">Produk Jepang <b>glownya beda level</b></span>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-img", { scale: 1.08 }, { scale: 1, duration: 4, ease: "none" }, 0);
      tl.fromTo("#logo-img", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);
      tl.fromTo("#l2", { opacity: 0, y: 50, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.55);
      tl.fromTo("#l3", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

  <script>

      // "film.": it snaps shut (tiny flash). Bars open out right before the CTA. Premium, restrained: nothing else.
      const R = window.ROUNDS[9], DUR = R.dur, S = R.start;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }

      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const VW = window.VO_WORDS, wt = (txt) => { const w = VW.find((x) => x[0] === txt && x[1] >= S - 0.05); return (w ? w[1] : S) - S; };
      // local beats: sweep lands 0.785 · sinematik 1.993 · cuplikan 3.029 · film 3.378 · out by 3.833

      const BH = 104, CX = 410, CYc = 490, FY = 262;          // bar height · frame centre · flare line (just above the robot's head)

        I(g, { x: gx(FX0), y: gy }); ft(g, { x: gx(FX0) }, { x: gx(FX1), duration: FD, ease: EZ }, FT0);

      ft(bb, { y: 0 }, { y: BH + 4, duration: 0.22, ease: "power3.in" }, OUT);
      ft(vig, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in" }, OUT);

      // ---- slate line: clapper + scene/take + 24 fps timecode of the reel itself
      const sl = $("r10-sl"), t1 = $("r10-t1"), t2 = $("r10-t2"), cs = $("r10-cs"), cf = $("r10-cf");

      t2.innerHTML = [...tcStr(S + TS)].map((ch, i) => `<span class="${ch === ":" ? "k" : ""}" id="r10-d${i}">${ch}</span>`).join("");
      I(sl, { opacity: 0, x: 18 });
      ft(sl, { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, TS);
      let prev = tcStr(S + TS);
      for (let f = Math.ceil((S + TS) * 24); f / 24 < S + DUR; f++) {
        const gt = f / 24, str = tcStr(gt + 1e-6);
        for (let i = 0; i < str.length; i++) if (str[i] !== prev[i]) tl.set($("r10-d" + i), { textContent: str[i] }, gt - S);
        prev = str;
      }
      for (let i = 0; i < prev.length; i++) I($("r10-d" + i), { textContent: tcStr(S + TS)[i] });

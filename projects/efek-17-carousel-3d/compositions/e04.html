  <style>

    .e4-fig { transform-origin: 540px 1204px; }
  </style>
  <div id="e4-root" data-composition-id="e04" data-width="1080" data-height="1350">
    <div id="e4-bd" class="e4-layer">
      <img src="assets/background/plate.png" alt="" style="position:absolute;left:0;top:0;width:1080px;height:1350px;opacity:0.32"/>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 55% 50% at 50% 55%, rgba(0,120,190,0.22), rgba(3,7,20,0.75))"></div>

      <div id="e4-phone">
        <div class="e4-btn" style="left:-5px;top:230px;height:90px"></div><div class="e4-btn" style="left:-5px;top:340px;height:90px"></div>

    <!-- the mascot twice (same 4 s loop; 1x and 2x plates so they are distinct media): one copy cropped to the phone screen, one cropped to everything above the screen edge -->
    <div id="e4-in" class="e4-layer">
      <div id="e4-figIn" class="e4-layer e4-fig"><video id="e4-mascotIn" class="clip" data-start="0" data-duration="4" src="assets/mascot/mascot_jas_loop_1x.webm" muted playsinline
        style="position:absolute;left:0;top:0;width:1080px;height:1350px"></video></div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const eio = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const eback = (x) => { x = clamp(x, 0, 1); const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const $ = (id) => document.getElementById(id);
      const H = window.HFP;
      $("e4-vid").innerHTML = H.backdropHTML("e4b");
      $("e4-chrome").innerHTML = H.chromeHTML("e4c", 4, "Frame Break");

      const phone = $("e4-phone"), scr = $("e4-screen"), vid = $("e4-vid"), isl = $("e4-island"), glare = $("e4-glare");
      const inL = $("e4-in"), outL = $("e4-out"), outSh = $("e4-outsh"), figIn = $("e4-figIn"), figOut = $("e4-figOut"), edge = $("e4-edge"), cap = $("e4-cap");
      // mascot framing inside the phone: scale 0.7, feet on y 1180 → hair ≈ 477, chin ≈ 848, chest ≈ 967
      const S = 0.7, FEET = 1180;
      // phone top: 300 (mascot fully inside) → 900 (screen edge across the chest: head, arms and hands break out)
      const P0 = 300, P1 = 900, B = 16, SX0 = 230 + B, SX1 = 850 - B;
      function render(t) {
        const slide = eio(seg(t, 0.3, 0.72)) * (1 - eio(seg(t, 3.38, 3.85)));
        const rise = eback(seg(t, 0.45, 0.75)) * (1 - eio(seg(t, 3.42, 3.82)));        // body up 40 px in 0.3 s
        const P = P0 + (P1 - P0) * slide, ST = P + B;                                  // phone top, screen top
        phone.style.transform = "translateY(" + P.toFixed(1) + "px)";
        const clipIn = "inset(" + ST.toFixed(1) + "px " + (1080 - SX1) + "px 0px " + SX0 + "px round 60px 60px 0 0)";
        scr.style.clipPath = clipIn; inL.style.clipPath = clipIn; glare.style.clipPath = clipIn;
        vid.style.transform = "translateY(" + (P - P0).toFixed(1) + "px)";             // the video travels with the phone
        isl.style.top = (ST + 18).toFixed(1) + "px";
        const tf = "translate(0px," + (FEET - 1204 - 40 * rise).toFixed(2) + "px) scale(" + S + ")";
        figIn.style.transform = tf; figOut.style.transform = tf;
        outL.style.clipPath = "inset(0px 0px " + (1350 - ST).toFixed(1) + "px 0px)";      // only what is above the screen edge
        // shadow of the escaped part falling on the bezel/screen, grows as he comes out
        const so = clamp(slide * 1.2, 0, 1);
        outSh.style.filter = so > 0.01 ? "drop-shadow(0 26px 20px rgba(0,0,0," + (0.6 * so).toFixed(3) + "))" : "none";
        // energy line on the edge at the moment of the break
        edge.style.top = (P - 2).toFixed(1) + "px";
        edge.style.opacity = (0.9 * Math.max(0, 1 - Math.abs(t - 0.74) / 0.22)).toFixed(3);
        const c = eo(seg(t, 0.8, 1.15)) * (1 - seg(t, 3.3, 3.6));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px)";
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e04"] = tl;
    })();
  </script>

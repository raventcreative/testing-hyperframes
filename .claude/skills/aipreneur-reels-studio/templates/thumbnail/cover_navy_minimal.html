<!doctype html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Cover R26 — minimal, brand navy</title>
<!-- Brand format (REELS_PIPELINE.md, blue theme): the client's navy background (assets/brand/bg_navy_1080x1920.png, same plate as R25),
     white text, accent #01ccf7 only, white logo. Minimal: logo, cyan chip, 2-line headline, tagline, ONE topic logo in 3D (Meta, Simple Icons
     CC0, extruded in thumbnail/logo3d.html) above the mascot. Earlier busy version: cover_ramai.html. -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_navy_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; }
  #g1 { left: 140px; top: 860px; width: 800px; height: 760px; background: radial-gradient(ellipse, rgba(1,204,247,.22), rgba(1,204,247,0) 64%); }
  .grain { position: absolute; inset: 0; background: url(../assets/brand/grain_256.png); opacity: .05; }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 450px; top: 170px; width: 180px; opacity: .95; }
  #chip { top: 290px; } #chip span { display: inline-block; padding: 14px 30px 16px 36px; border-radius: 34px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.55); font: 700 26px/1 Poppins; letter-spacing: 7px; color: #6adfff; }
  #h1 { top: 384px; font: 700 104px/1 Poppins; letter-spacing: -3px; color: #fff; }
  #h2 { top: 498px; font: 700 124px/1.05 Poppins; letter-spacing: -4px; padding-bottom: .15em;
        background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 50%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tag { top: 668px; font: 400 36px/1 Poppins; color: #e3edfa; }
  #tag b { font-weight: 700; color: #fff; }
  #ico { position: absolute; left: 405px; top: 732px; width: 270px; height: auto; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(1,204,247,.25)); }
  #host { position: absolute; left: 190px; bottom: -30px; width: 700px; height: auto; filter: drop-shadow(0 30px 50px rgba(0,0,0,.45)); }
</style></head>
<body>
  <div class="plate"></div><div class="glow" id="g1"></div><div class="grain"></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR" />
  <div class="c" id="chip"><span>PROMPT GRATIS</span></div>
  <div class="c" id="h1">50 Hook Iklan</div>
  <div class="c" id="h2">Dari 1 Prompt</div>
  <div class="c" id="tag">Hook × Isi × CTA · <b>siap copy-paste</b></div>
  <img id="ico" src="logo3d_meta_cut.png" alt="Meta" />
  <img id="host" src="host_cut.png" alt="" />
  <script>document.fonts.ready.then(() => (window.COVER_READY = true));</script>
</body></html>

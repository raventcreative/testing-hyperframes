<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #m-xf { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 960px; will-change: transform, filter; }
    #m-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="mascot" data-width="1080" data-height="1920">
    <div id="m-xf" data-layout-ignore data-layout-allow-occlusion><canvas id="m-canvas" width="1080" height="1920" data-layout-ignore data-layout-allow-occlusion></canvas></div>
  </div>
  <script>
    (function () {
      // ============================================================================
      // 3D MASCOT DIRECTOR — one rigged character, driven only by global time t.
      // Rig/face controls: vendor/mascot3d.js (built from tools/mascot3d/src).
      // Conventions (verified in pose tests): root.ry < 0 turns him toward screen-left;
      // upperarm_L z+ raises his left arm (screen-right); upperarm_R z- raises his right
      // arm (screen-left); x- on arms/legs swings them forward; x+ on spine/head = lean/nod forward.
      // ============================================================================
      const M3 = window.Mascot3D;
      const { track: K, osc, blink, walk, lipsync, addBones, E } = M3;
      const canvas = document.getElementById("m-canvas");
      const xf = document.getElementById("m-xf");
      const D = 61.1;

      const RELAX = { upperarm_L: [0, 0, -0.16], upperarm_R: [0, 0, 0.16], forearm_L: [-0.14, 0, 0.04], forearm_R: [-0.14, 0, -0.04] };
      const breath = (t) => ({ chest: [osc(t, -99, 999, 0.32, 0.012), 0, 0], spine: [osc(t, -99, 999, 0.32, 0.006, 0.4), 0, 0] });
      const HAPPY = { blink: [0.33, 0.33], lower: [0.62, 0.62] };
      const mixFace = (a, b, u) => {
        const o = {};
        for (const k of ["blink", "lower", "gaze", "brow", "browTilt"]) {
          const x = a[k] || [0, 0], y = b[k] || [0, 0];
          o[k] = [x[0] + (y[0] - x[0]) * u, x[1] + (y[1] - x[1]) * u];
        }
        return o;
      };
      const withBlink = (f, b) => {
        const o = Object.assign({}, f);
        const base = o.blink || [0, 0];
        o.blink = [Math.max(base[0], b), Math.max(base[1], b)];
        return o;
      };

      // transition helpers (mirror the scene wrapper moves at the cuts)
      function xfIn(t, t0, kind, ox, oy) {
        const u = Math.min(1, Math.max(0, (t - t0) / 0.45)), e = E.out4(u);
        if (kind === "zoom") return { s: 1.45 + (1 - 1.45) * e, blur: 10 * (1 - e), ox, oy };
        if (kind === "whip") return { x: 620 * (1 - e), blur: 16 * (1 - e) };
        if (kind === "push") return { y: 520 * (1 - e), blur: 12 * (1 - e) };
        if (kind === "settle") return { s: 1.12 + (1 - 1.12) * e, ox, oy };
        if (kind === "pop") { const b = E.back(Math.min(1, (t - t0) / 0.4)); return { s: 0.88 + 0.12 * b, ox, oy }; }
        return {};
      }
      function xfOut(t, t1, kind, ox, oy) {
        const u = Math.min(1, Math.max(0, (t - (t1 - 0.27)) / 0.27)), e = E.in(u);
        if (kind === "zoom") return { s: 1 + 1.5 * e, blur: 10 * e, ox, oy };
        if (kind === "whipL") return { x: -620 * e, blur: 16 * e };
        if (kind === "whipR") return { x: 620 * e, blur: 16 * e };
        if (kind === "push") return { y: -520 * e, blur: 12 * e };
        if (kind === "shrink") return { s: 1 - 0.1 * e, ox, oy };
        return {};
      }

      // ------------------------------------------------------------------ CAMEOS
      // A — HYPIT INTRO (s02): hidden behind the vault, peeks out, holds the edge,
      //     curious head tilt, steps out, friendly wave; curious → delighted.
      const A = {
        t0: 4.2, t1: 9.167, view: { fx: 875, fy: 1505, h: 600, pitch: 5 },
        inK: ["zoom", 400, 1050], outK: ["whipL"],
        rootX: K([[0, -0.52], [0.45, -0.52], [1.05, -0.47, "out"], [1.95, -0.47], [2.65, 0.0, "io"]]),
        rootRz: K([[0, 0], [0.45, 0], [1.05, -0.36, "back"], [1.5, -0.32, "sine"], [1.95, -0.33], [2.4, 0.04, "io"], [2.65, 0, "out"]]),
        rootRy: K([[0, -0.15], [1.95, -0.15], [2.65, 0.1, "io"], [3.9, 0.05], [4.35, -0.35, "io"], [4.967, -0.3]]),
        headRz: K([[0, 0], [0.6, 0], [1.1, -0.2, "back"], [1.55, 0.16, "io"], [1.95, 0.05], [2.6, 0], [3.0, 0.1], [3.9, -0.05], [4.57, 0.12, "back"], [4.967, 0.1]]),
        headRy: K([[0, 0], [0.6, 0.0], [0.75, -0.35, "out"], [1.2, 0.05, "io"], [3.9, 0.0], [4.35, -0.35, "io"], [4.967, -0.35]]),
        headRx: K([[0, 0], [0.75, 0.12, "out"], [1.2, 0, "io"], [4.967, 0]]),
        // left hand grips the vault edge while peeking
        gripW: K([[0, 0], [0.8, 0], [1.1, 1, "out"], [1.9, 1], [2.25, 0, "io"]]),
        waveW: K([[0, 0], [2.6, 0], [2.85, 1, "back"], [3.85, 1], [4.15, 0, "io"]]),
        hop: (a) => (a > 4.45 && a < 4.85 ? Math.sin(((a - 4.45) / 0.4) * Math.PI) * 0.03 : 0),
        clipX: K([[0, 700], [2.05, 700], [2.45, 0, "in"]]),
        face(a) {
          const curious = { brow: [0.0, 0.008], browTilt: [0, 0], gaze: [0.006, 0.0] };
          const lookChip = { brow: [0.004, 0.009], gaze: [-0.011, -0.004] };
          const delighted = HAPPY;
          const lookStars = { gaze: [-0.012, 0.002], ...HAPPY };
          let f = curious;
          if (a > 0.6 && a < 1.25) f = mixFace(curious, lookChip, Math.min(1, (a - 0.6) / 0.15) * Math.min(1, (1.25 - a) / 0.2));
          if (a >= 2.55) f = mixFace(curious, delighted, Math.min(1, (a - 2.55) / 0.25));
          if (a >= 4.3) f = mixFace(delighted, lookStars, Math.min(1, (a - 4.3) / 0.2));
          return f;
        },
        pose(a) {
          const g = this.gripW(a), w = this.waveW(a);
          const wk = walk(a, 1.95, 2.65, 2, 0.4);
          const grip = { upperarm_L: [-0.9 * g, 0, 1.0 * g], forearm_L: [-0.5 * g, 0, 0.55 * g], hand_L: [0, 0, 0.3 * g], spine: [0, 0, -0.08 * g] };
          const wave = {
            upperarm_L: [-0.15 * w, 0, 2.05 * w], forearm_L: [0, 0, (0.45 + osc(a, 2.85, 3.85, 2.3, 0.42)) * w],
            hand_L: [0, 0, osc(a, 2.9, 3.85, 2.3, 0.32, -0.9) * w], chest: [0, 0, 0.05 * w + osc(a, 2.85, 3.85, 1.15, 0.03)],
          };
          const head = { head: [this.headRx(a), this.headRy(a), this.headRz(a)], neck: [this.headRx(a) * 0.3, this.headRy(a) * 0.3, 0] };
          return {
            root: { x: this.rootX(a), y: wk.bob + this.hop(a), rz: this.rootRz(a), ry: this.rootRy(a) },
            bones: addBones(RELAX, breath(a), grip, wave, wk.bones, head),
          };
        },
      };

      // B — coding-agent cameo (s04): watches the core, "ooh" on 'kode'.
      const B = {
        t0: 13.8, t1: 16.867, view: { fx: 912, fy: 1500, h: 470, pitch: 5 },
        inK: ["zoom", 500, 820], outK: ["push"],
        ry: K([[0, -0.75], [3.067, -0.7]]),
        lean: K([[0, 0.02], [2.2, 0.16, "io"], [2.42, 0.12, "out"], [2.62, -0.06, "out"], [3.0, 0.04, "io"]]),
        headRx: K([[0, 0.05], [2.4, 0.12], [2.6, -0.12, "out"], [2.85, 0.14, "io"], [3.067, 0.06]]),
        ooh: K([[0, 0], [2.48, 0], [2.56, 1, "out"], [2.85, 1], [3.0, 0, "io"]]),
        face(a) {
          const o = this.ooh(a);
          const f = { gaze: [-0.008, -0.004], brow: [0.009 * o, 0.009 * o] };
          if (a > 2.95) Object.assign(f, mixFace(f, HAPPY, Math.min(1, (a - 2.95) / 0.1)));
          return f;
        },
        mouth(a) { const o = this.ooh(a); return o > 0.01 ? { mix: o, m: [0.017, 0.019 * o, 0.0, 0.4] } : null; },
        pose(a) {
          const l = this.lean(a);
          return {
            root: { ry: this.ry(a), y: a > 2.56 && a < 2.8 ? Math.sin(((a - 2.56) / 0.24) * Math.PI) * 0.012 : 0 },
            bones: addBones(RELAX, breath(a), { spine: [l * 0.6, 0, 0], chest: [l * 0.5, 0, 0], head: [this.headRx(a), -0.1, 0.06], upperarm_L: [-0.25, 0, 0.1], forearm_L: [-0.7, 0, 0.1], upperarm_R: [-0.2, 0, -0.1], forearm_R: [-0.5, 0, -0.1] }),
          };
        },
      };

      // C — EDITING WORKFLOW (s06–s08): tracks every module click, flinches at the paper
      //     peel, follows the playhead, leans in thoughtfully, brows up, points at the trim handle.
      const C = {
        t0: 20.467, t1: 27.967, view: { fx: 912, fy: 1530, h: 505, pitch: 5 },
        inK: ["zoom", 400, 1050], outK: ["zoom", 400, 760],
        ry: K([[0, -0.55], [7.5, -0.55]]),
        headRy: K([[0, -0.42], [0.18, -0.45, "back"], [0.75, -0.32, "io"], [0.87, -0.34, "back"], [1.45, -0.22, "io"], [1.59, -0.25, "back"], [2.12, -0.12, "io"], [2.25, -0.15, "back"],
                   [3.6, -0.18], [4.1, 0.05, "out"], [4.6, -0.3, "io"], [4.75, -0.55, "io"], [6.2, -0.12, "sine"], [6.45, -0.3, "io"], [7.5, -0.32]]),
        headRx: K([[0, 0.05], [0.18, 0.13, "out"], [0.4, 0.05], [0.87, 0.13, "out"], [1.1, 0.05], [1.59, 0.13, "out"], [1.8, 0.05], [2.25, 0.14, "out"], [2.5, 0.05], [5.5, 0.06], [6.0, 0.16, "io"], [7.5, 0.1]]),
        lean: K([[0, 0], [3.9, 0], [4.12, -0.12, "out"], [4.6, 0.0, "io"], [5.5, 0.0], [6.1, 0.17, "io"], [6.35, 0.12], [6.55, 0.2, "back"], [7.5, 0.16]]),
        point: K([[0, 0], [6.2, 0], [6.38, -0.25, "io"], [6.55, 1, "back"], [7.25, 1], [7.5, 0.85]]),
        face(a) {
          const watch = { gaze: [-0.01, -0.004] };
          let f = watch;
          if (a > 4.05 && a < 4.7) f = mixFace(watch, { brow: [0.01, 0.01], gaze: [-0.004, 0.004] }, Math.min(1, (a - 4.05) / 0.08) * Math.min(1, (4.7 - a) / 0.2));
          if (a >= 5.9) f = mixFace(watch, { brow: [0.006, 0.011], browTilt: [0.003, -0.003], gaze: [-0.012, -0.006] }, Math.min(1, (a - 5.9) / 0.25));
          if (a >= 6.6) f = mixFace(f, Object.assign({ gaze: [-0.012, -0.004] }, HAPPY), Math.min(1, (a - 6.6) / 0.2));
          return f;
        },
        pose(a) {
          const p = this.point(a), l = this.lean(a);
          const pt = { upperarm_R: [-0.38 * p, -0.1 * p, -1.02 * Math.max(0, p)], forearm_R: [0.1 * p, 0, -0.08 * p], hand_R: [0, 0, -0.12 * p], chest: [0, -0.1 * p, 0] };
          const think = { upperarm_L: [-0.25, 0, 0.12], forearm_L: [-0.95 * Math.min(1, Math.max(0, (a - 5.4) / 0.4)), 0, 0.2] };
          return {
            root: { ry: this.ry(a) },
            bones: addBones(RELAX, breath(a), pt, think, { spine: [l * 0.55, 0, 0], chest: [l * 0.45, 0, 0], head: [this.headRx(a), this.headRy(a), 0.05], neck: [0, this.headRy(a) * 0.3, 0] }),
          };
        },
      };

      // D — SWAP (s11): tracks hook/presenter/produk/bahasa, surprised on 'presenter',
      //     smiles, then opens both hands to present the result.
      const D_ = {
        t0: 31.867, t1: 35.933, view: { fx: 178, fy: 1540, h: 520, pitch: 5 },
        inK: ["settle", 540, 960], outK: ["shrink", 540, 960],
        ry: K([[0, 0.5], [2.9, 0.42], [3.2, 0.12, "io"], [4.067, 0.1]]),
        headRy: K([[0, 0.05], [0.56, 0.12, "io"], [0.66, 0.1, "back"], [0.98, 0.22, "io"], [1.06, 0.2, "back"], [1.9, 0.32, "io"], [1.97, 0.3, "back"], [2.62, 0.45, "io"], [2.72, 0.42, "back"], [3.2, 0.05, "io"], [4.067, 0.0]]),
        headRz: K([[0, 0], [2.6, 0], [2.8, 0.14, "back"], [3.2, 0.0, "io"], [3.6, -0.08, "sine"], [4.067, -0.05]]),
        surprise: K([[0, 0], [1.0, 0], [1.08, 1, "out"], [1.42, 1], [1.62, 0, "io"]]),
        present: K([[0, 0], [3.05, 0], [3.2, -0.15, "io"], [3.45, 1, "back"], [4.067, 1]]),
        face(a) {
          const s = this.surprise(a);
          const track_ = { gaze: [0.011, -0.003] };
          let f = mixFace(track_, { brow: [0.012, 0.012], gaze: [0.006, 0.004] }, s);
          if (a > 1.6 && a < 3.05) f = mixFace(f, Object.assign({ gaze: [0.01, -0.002] }, HAPPY), Math.min(1, (a - 1.6) / 0.2) * Math.min(1, (3.05 - a) / 0.15));
          if (a >= 3.3) f = mixFace(f, HAPPY, Math.min(1, (a - 3.3) / 0.15));
          return f;
        },
        mouth(a) { const s = this.surprise(a); return s > 0.01 ? { mix: s, m: [0.017, 0.021 * s, 0.0, 0.4] } : null; },
        pose(a) {
          const s = this.surprise(a), p = Math.max(0, this.present(a)), pn = this.present(a);
          const hop = a > 1.04 && a < 1.32 ? Math.sin(((a - 1.04) / 0.28) * Math.PI) * 0.03 : 0;
          const recoil = { spine: [-0.14 * s, 0, 0], head: [-0.1 * s, 0, 0], upperarm_L: [0, 0, 0.35 * s], upperarm_R: [0, 0, -0.35 * s], forearm_L: [-0.5 * s, 0, 0], forearm_R: [-0.5 * s, 0, 0] };
          const open = { upperarm_L: [-0.35 * pn, 0, 0.85 * p], upperarm_R: [-0.35 * pn, 0, -0.85 * p], forearm_L: [-0.5 * p, 0, 0.25 * p], forearm_R: [-0.5 * p, 0, -0.25 * p], hand_L: [0, 0, 0.35 * p], hand_R: [0, 0, -0.35 * p], chest: [-0.05 * p, 0, 0] };
          // a small nod on each swap word
          const nod = [0.656, 1.968, 2.709].reduce((acc, w) => acc + (a > w - 0.02 && a < w + 0.3 ? Math.sin(((a - w + 0.02) / 0.32) * Math.PI) * 0.12 : 0), 0);
          return {
            root: { ry: this.ry(a), x: -0.03 * s, y: hop + (a > 3.2 && a < 3.5 ? Math.sin(((a - 3.2) / 0.3) * Math.PI) * 0.015 : 0) },
            bones: addBones(RELAX, breath(a), recoil, open, { head: [nod, this.headRy(a), this.headRz(a)], neck: [0, this.headRy(a) * 0.3, 0] }),
          };
        },
      };

      // E — asset rights cameo (s14): follows the media entering, approving nod on 'jelas'.
      const E_ = {
        t0: 42.867, t1: 46.867, view: { fx: 912, fy: 1500, h: 470, pitch: 5 },
        inK: ["pop", 540, 960], outK: ["zoom", 380, 1050],
        headRy: K([[0, -0.3], [0.4, -0.42, "io"], [0.77, -0.3, "io"], [1.46, -0.18, "io"], [2.6, -0.25], [4.0, -0.25]]),
        nod: (a) => (a > 3.26 && a < 3.95 ? Math.sin(((a - 3.26) / 0.345) * Math.PI) * 0.28 * (a < 3.6 ? 1 : 0.6) : 0),
        face(a) { return a > 3.3 ? mixFace({ gaze: [-0.008, 0] }, HAPPY, Math.min(1, (a - 3.3) / 0.12)) : { gaze: [-0.009, -0.002], brow: [0.004, 0.004] }; },
        pose(a) {
          const hip = Math.min(1, Math.max(0, (a - 3.2) / 0.25));
          return {
            root: { ry: -0.42 },
            bones: addBones(RELAX, breath(a), { head: [this.nod(a), this.headRy(a), 0.04], neck: [this.nod(a) * 0.4, 0, 0], upperarm_R: [-0.1 * hip, 0, 0.35 * hip], forearm_R: [-1.2 * hip, 0, -0.5 * hip], hand_R: [0, 0, -0.2 * hip] }),
          };
        },
      };

      // F — brief cameo (s16): watches the two ports, nods on 'brief'.
      const F_ = {
        t0: 49.867, t1: 51.767, view: { fx: 912, fy: 1480, h: 460, pitch: 5 },
        inK: ["settle", 540, 960], outK: ["whipL"],
        headRx: K([[0, 0.08], [0.6, 0.16, "out"], [0.9, 0.08], [1.44, 0.26, "back"], [1.7, 0.08, "io"], [1.9, 0.1]]),
        face(a) { return a > 1.5 ? mixFace({ gaze: [-0.01, -0.004] }, HAPPY, Math.min(1, (a - 1.5) / 0.12)) : { gaze: [-0.011, -0.005] }; },
        pose(a) { return { root: { ry: -0.8 }, bones: addBones(RELAX, breath(a), { spine: [0.08, 0, 0], head: [this.headRx(a), -0.1, 0], upperarm_L: [-0.15, 0, 0.05], forearm_L: [-0.55, 0, 0.1] }) }; },
      };

      // G — CTA (s19): hops in, faces camera, lip-syncs "Komen HYPIT. Nanti gue bagiin.",
      //     points at the bubble on 'HYPIT', small wave, calm final pose with the mouth closed.
      const CTA_WORDS = [
        { text: "Komen", start: 58.924, end: 59.271 },
        { text: "HYPIT", phon: "haipit", start: 59.271, end: 59.708 },
        { text: "Nanti", start: 60.066, end: 60.354 },
        { text: "gue", start: 60.354, end: 60.527 },
        { text: "bagiin", start: 60.527, end: 60.864 },
      ];
      const G = {
        t0: 58.733, t1: 61.1, view: { fx: 868, fy: 1515, h: 640, pitch: 4 },
        inK: null, outK: null,
        x: K([[0, 0.55], [0.33, 0.0, "out"]]),
        jump: (a) => (a < 0.33 ? Math.sin((a / 0.33) * Math.PI) * 0.09 : 0),
        squash: K([[0, 1], [0.33, 1], [0.38, 0.93, "out"], [0.55, 1.0, "back"]]),
        ry: K([[0, -0.45], [0.33, -0.2, "out"], [0.55, -0.12, "io"], [2.367, -0.12]]),
        point: K([[0, 0], [0.4, 0], [0.47, -0.2, "io"], [0.6, 1, "back"], [1.12, 1], [1.32, 0, "io"]]),
        waveW: K([[0, 0], [1.3, 0], [1.45, 1, "back"], [1.85, 1], [2.05, 0, "io"]]),
        headRz: K([[0, 0], [0.55, 0], [0.62, 0.1, "back"], [1.2, 0.0, "io"], [1.5, -0.08, "sine"], [2.05, 0.05, "io"], [2.367, 0.05]]),
        face(a) {
          let f = { gaze: [0.0, 0.0], brow: [0.004, 0.004] };
          if (a > 0.45 && a < 1.2) f = mixFace(f, { gaze: [-0.012, 0.0], brow: [0.008, 0.008] }, Math.min(1, (a - 0.45) / 0.12) * Math.min(1, (1.2 - a) / 0.15));
          if (a > 0.5 && a < 1.0) f = mixFace(f, { gaze: [-0.012, 0.0], brow: [0.011, 0.011] }, Math.min(1, (a - 0.5) / 0.08) * Math.min(1, (1.0 - a) / 0.12));
          if (a >= 2.1) f = mixFace(f, { gaze: [0, -0.002], brow: [0.003, 0.003] }, Math.min(1, (a - 2.1) / 0.15));
          return f;
        },
        mouth(a, t) {
          const mix = Math.min(1, Math.max(0, (a - 0.12) / 0.1));
          return { mix, m: lipsync(t, CTA_WORDS) };
        },
        pose(a) {
          const p = Math.max(0, this.point(a)), pn = this.point(a), w = this.waveW(a);
          const wk = walk(a, 0.0, 0.33, 1, 0.3);
          const pt = { upperarm_R: [-0.35 * pn, -0.05 * p, -1.0 * p], forearm_R: [0.08 * p, 0, -0.06 * p], hand_R: [0, 0, -0.1 * p], chest: [0, -0.12 * p, 0] };
          const wave = { upperarm_L: [-0.1 * w, 0, 1.85 * w], forearm_L: [0, 0, (0.4 + osc(a, 1.45, 1.85, 2.5, 0.35)) * w], hand_L: [0, 0, osc(a, 1.48, 1.85, 2.5, 0.28, -0.9) * w] };
          return {
            root: { x: this.x(a), y: this.jump(a), ry: this.ry(a), sy: this.squash(a) },
            bones: addBones(RELAX, breath(a), wk.bones, pt, wave, { head: [0.04, -0.06, this.headRz(a)] }),
          };
        },
      };

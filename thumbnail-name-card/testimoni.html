<!doctype html><html><head><meta charset="utf-8">
<!-- White "Testimoni Peserta" thumbnail (layout of the Eka reference). Edit the data-* texts and photo paths. -->
<style>
@font-face{font-family:Poppins;src:url(fonts/poppins400.woff2);font-weight:400}
@font-face{font-family:Poppins;src:url(fonts/poppins500.woff2);font-weight:500}
@font-face{font-family:Poppins;src:url(fonts/poppins600.woff2);font-weight:600}
@font-face{font-family:Poppins;src:url(fonts/poppins700.woff2);font-weight:700}
:root{--navy:#13204d;--muted:#55648f;--b1:#1b3cc0;--b2:#2d66f2}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:Poppins,sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff}
.layer{position:absolute;left:-54px;top:220px;width:1188px}
/* room behind the person: faded in from white, kept hazy */
.bg{-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 230px,rgba(0,0,0,.6) 420px,#000 600px);opacity:.78;filter:saturate(.85) brightness(1.06)}
.haze{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.2) 62%)}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(19,32,77,.085) 2px,transparent 2px),linear-gradient(90deg,rgba(19,32,77,.085) 2px,transparent 2px);
  background-size:135px 135px;background-position:0 -10px}
.person{-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 300px,#000 400px);filter:saturate(.95) contrast(1.03)}
/* bottom: photo melts into white under the name */
.bottom{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 60%,rgba(255,255,255,.45) 70%,rgba(255,255,255,.78) 80%,rgba(255,255,255,.93) 90%,#fff 100%)}
.top{position:absolute;left:0;right:0;top:118px;text-align:center}
.logo{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--navy);font-weight:600;font-size:24px;letter-spacing:.04em}
.logo img{height:24px}
.kick{margin-top:30px;font-size:22px;letter-spacing:.42em;color:var(--muted);font-weight:500;padding-left:.42em}
.kick b{color:var(--navy);font-weight:700}
h1{margin-top:12px;font-weight:700;color:var(--navy);font-size:74px;line-height:1.08;letter-spacing:-.01em}
h1 em{display:block;font-style:normal;font-size:98px;line-height:1.06;background:linear-gradient(90deg,var(--b1),var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
.who{position:absolute;left:144px;top:1352px}
.who h2{font-weight:700;font-size:92px;line-height:1;color:var(--navy);letter-spacing:.005em;text-transform:uppercase}
.pill{display:inline-block;margin-top:22px;padding:13px 26px 14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;font-size:30px;box-shadow:0 10px 22px rgba(19,32,77,.22)}
.nologo .logo{display:none}
</style></head><body>
<div class="stage">
  <img class="layer bg" src="andreas/photo_up.jpg">
  <div class="haze"></div>
  <div class="grid"></div>
  <img class="layer person" src="andreas/person.png">
  <div class="bottom"></div>
  <div class="top">
    <div class="logo"><img src="andreas/logo_navy.png">AI PRENEUR</div>
    <div class="kick"><b>TESTIMONI</b> PESERTA</div>
    <h1>Kata Mereka Setelah<em>Belajar AI</em></h1>
  </div>
  <div class="who"><h2>Andreas</h2><span class="pill">Konsultan Sistem &amp; HR · Semarang</span></div>
</div></body></html>

<!doctype html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Cover R38 — minimal, brand white</title>
<!-- Brand white theme (CLAUDE.md / brand.md): white brand plate (brand/bg-light.png cover-fit = assets/brand/bg_light_1080x1920.png), text gradient
     #0a0d2c -> #294b77, accent #294b77 (blue gradient #13307e -> #2f6bff on line 2), dark logo. Minimal: logo, one chip, 2-line headline,
     tagline, the 3D mascot (the reel's own rig, thumbnail/host.html), ONE topic logo in 3D above its head: Wi-Fi (no Simple Icons
     entry exists, so an UNBRANDED generic Wi-Fi symbol built from our own geometry, extruded, thumbnail/logo3d.html?name=wifi). No value hook:
     the chip states what the repo is (open source, MIT); every claim is from the RuView README. -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f3f7fd; font-family: Poppins, sans-serif; -webkit-font-smoothing: antialiased; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_light_1080x1920.png) center / 1080px 1920px no-repeat; }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 450px; top: 170px; width: 180px; }
  #chip { top: 290px; } #chip span { display: inline-block; padding: 14px 30px 16px 36px; border-radius: 34px; background: rgba(41,75,119,.06);
    box-shadow: inset 0 0 0 2px #294b77; font: 700 26px/1 Poppins; letter-spacing: 7px; color: #294b77; }
  #h1 { top: 384px; font: 700 104px/1 Poppins; letter-spacing: -3px; padding-bottom: .12em;
        background: linear-gradient(172deg, #0a0d2c 10%, #294b77 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #h2 { top: 500px; font: 700 104px/1.05 Poppins; letter-spacing: -4px; padding-bottom: .15em;
        background: linear-gradient(180deg, #13307e 10%, #2f6bff 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tag { top: 670px; font: 400 33px/1 Poppins; color: #294b77; }
  #tag b { font-weight: 700; color: #0a0d2c; }
  #ico { position: absolute; left: 430px; top: 752px; width: 220px; height: auto; filter: drop-shadow(0 18px 26px rgba(10,13,44,.22)); }
  #host { position: absolute; left: 300px; bottom: 30px; width: 480px; height: auto; filter: drop-shadow(0 26px 40px rgba(10,13,44,.22)); }
</style></head>
<body>
  <div class="plate"></div>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR" />
  <div class="c" id="chip"><span>OPEN SOURCE · MIT</span></div>
  <div class="c" id="h1">Wi-Fi Bisa</div>
  <div class="c" id="h2">Deteksi Gerakan</div>
  <div class="c" id="tag">tembus tembok · tanpa kamera · <b>RuView</b></div>
  <img id="ico" src="logo3d_wifi_cut.png" alt="" />
  <img id="host" src="host_cut.png" alt="" />
  <script>document.fonts.ready.then(() => (window.COVER_READY = true));</script>
</body></html>

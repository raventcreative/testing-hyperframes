<template>
  <style>
    #r6-clip { position: absolute; left: 130px; top: 450px; width: 820px; height: 980px; overflow: hidden; border-radius: 34px; pointer-events: none; }
    #r6-svg { position: absolute; left: 0; top: 0; overflow: visible; }
    #r6-dot { position: absolute; left: 0; top: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255,255,255,.14), 0 0 10px rgba(255,255,255,.55); }
  </style>
  <div data-hf-id="hf-xt1n" id="r6-root" data-composition-id="r6" data-width="1080" data-height="1920">
    <div id="r6-clip">
      <svg id="r6-svg" width="820" height="980" viewBox="0 0 820 980">
        <path id="r6-line" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          d="M -24,800 C 70,842 160,862 268,862 L 556,862 C 700,862 806,770 794,590 C 782,370 650,104 432,98 C 236,94 108,250 100,440 C 92,650 168,862 300,862 L 562,862"></path>
      </svg>
      <div id="r6-dot"></div>
    </div>
  </div>
  <script>
    (function () {
      // r6 MINIMAL LINE "Enam, Minimal Line, cuma satu garis, tapi elegan."
      // ONE thin white line, nothing else. On the pen-stroke SFX (sweep end) a tiny pen-tip dot enters from the left, skims the floor under
      // the robot, rises up the right side, arcs over the whole set and comes down the left side in a single graceful loop around the robot,
      // landing back on the floor. Its tail follows it round (only ever one stroke on screen) and on "tapi elegan." the whole loop has
      // settled into a single hairline the robot stands on. The dot breathes once on "elegan", then the hairline slides into the dot and it's gone.
      const R = window.ROUNDS[5], DUR = R.dur, T = (g) => g - R.start;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const wt = (w) => T(window.VO_WORDS.find((x) => x[0] === w && x[1] > R.start)[1]);
      const one = (x) => Math.max(0, Math.min(1, x));
      const pen = (u) => { u = one(u); return 0.6 * u + 1.8 * u * u - 1.4 * u * u * u; };                   // starts moving at once (pen-stroke SFX), lands softly
      const io2 = (u) => { u = one(u); return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };      // quad in-out

      const line = $("r6-line"), dot = $("r6-dot");
      const L = line.getTotalLength() || 3900;
      const U = 562 - 300;                                              // the final hairline (last straight) = what remains
      const pt = (l) => { try { const p = line.getPointAtLength(Math.max(0, Math.min(L, l))); return [p.x, p.y]; } catch (e) { return [0, 0]; } };

      // head (pen tip) and tail along the path, as pure functions of local time
      const tH0 = T(R.sweep[1]) + 0.04, tH1 = wt("garis") + 0.12;        // draw: pen-stroke SFX -> "garis"
      const tT0 = wt("cuma") - 0.1, tT1 = wt("elegan.") - 0.04;           // tail chases it round, lands on "elegan"
      const tX0 = DUR - 0.3, tX1 = DUR - 0.07;                            // exit: hairline slides into the dot
      const head = (t) => L * pen((t - tH0) / (tH1 - tH0));
      const tail = (t) => t < tX0 ? (L - U) * io2((t - tT0) / (tT1 - tT0)) : (L - U) + U * io2((t - tX0) / (tX1 - tX0));
      // drive dash window + dot on a 60 Hz grid (no onUpdate: explicit sets)
      I(line, { attr: { "stroke-dasharray": `0 ${L + 20}`, "stroke-dashoffset": 0 }, opacity: 1 });
      I(dot, { x: pt(0)[0], y: pt(0)[1], opacity: 0, scale: 1 });
      const step = 1 / 60;
      for (let t = tH0; t <= tX1 + 1e-6; t += step) {
        const h = head(t), a = Math.min(h, tail(t)), vis = Math.max(0, h - a);
        tl.set(line, { attr: { "stroke-dasharray": `${vis.toFixed(2)} ${(L + 20).toFixed(1)}`, "stroke-dashoffset": (-a).toFixed(2) } }, t);
        const p = pt(h); tl.set(dot, { x: p[0], y: p[1] }, t);
      }
      tl.set(line, { opacity: 0 }, tX1 + 0.01);
      // the pen tip: blinks on, breathes on "elegan", shrinks away with the line
      ft(dot, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, tH0);
      const te = wt("elegan.");
      ft(dot, { scale: 1 }, { scale: 1.9, duration: 0.16, ease: "sine.out" }, te);
      ft(dot, { scale: 1.9 }, { scale: 1, duration: 0.2, ease: "sine.inOut" }, te + 0.16);
      ft(dot, { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.11, ease: "power2.in" }, tX1 - 0.11);

      tl.set({}, {}, DUR - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["r6"] = tl;
    })();
  </script>
</template>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 15 Kode Visual</title>
<!-- Reels cover 1080x1920. Key content sits inside the centred 4:5 grid crop (y 285-1635).
     Rendered by thumbnail/render_thumb.cjs (Playwright) from the project root: ?t=<pose time> -->
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<script src="../vendor/visuals.js"></script>
<style>
  @font-face { font-family: "Poppins"; src: url("../assets/fonts/poppins-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Poppins"; src: url("../assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root { --c: #01ccf7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1a44; font-family: "Poppins", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: url(../assets/brand/bg_1080x1920.png) 0 0 / 1080px 1920px; }
  .abs { position: absolute; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #orb { left: -200px; top: 200px; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(circle, rgba(1,204,247,.28), rgba(1,204,247,0) 62%); }
  #halo { left: 90px; top: 1000px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(1,204,247,.38), rgba(1,204,247,.08) 42%, rgba(1,204,247,0) 66%); }
  #floorWrap { left: 0; top: 1240px; width: 1080px; height: 680px; overflow: hidden; perspective: 620px; perspective-origin: 540px 0;
    -webkit-mask: linear-gradient(180deg, transparent, #000 40%); }
  #floor { position: absolute; left: -760px; top: 0; width: 2600px; height: 1700px; transform-origin: 50% 0; transform: rotateX(74deg); opacity: .28;
    background-image: linear-gradient(rgba(1,204,247,.55) 2px, transparent 2px), linear-gradient(90deg, rgba(1,204,247,.55) 2px, transparent 2px); background-size: 110px 110px; }
  .card { position: absolute; width: 900px; height: 450px; border-radius: 34px; overflow: hidden; transform-origin: 50% 50%;
    background: linear-gradient(160deg, rgba(10,32,84,.92), rgba(4,14,44,.9)); border: 3px solid rgba(1,204,247,.55);
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 40px rgba(1,204,247,.25); }
  .card svg { position: absolute; left: 0; top: 0; }
  .card .dr { stroke-dashoffset: 0 !important; }
  .card .pop, .card .fd { opacity: 1 !important; }
  .card .ctag { position: absolute; right: 24px; top: 18px; font-size: 24px; font-weight: 700; color: var(--c); }
  .tag { position: absolute; padding: 12px 26px; border-radius: 40px; font-size: 36px; font-weight: 700; white-space: nowrap;
    background: rgba(6,19,52,.82); border: 2px solid rgba(1,204,247,.8); box-shadow: 0 0 26px rgba(1,204,247,.4); }
  .tag i { font-style: normal; color: var(--c); }
  #m { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #chip { left: 50%; top: 340px; transform: translateX(-50%); height: 60px; padding: 0 30px; border-radius: 30px; background: var(--c); color: #061334;
    font-size: 28px; font-weight: 700; line-height: 60px; letter-spacing: 3px; white-space: nowrap; }
  #big { top: 410px; font-size: 236px; line-height: 280px; font-weight: 700; letter-spacing: -7px; color: var(--c);
    text-shadow: 0 0 70px rgba(1,204,247,.6), 0 10px 0 rgba(0,40,90,.55); }
  #l2 { top: 695px; font-size: 64px; line-height: 80px; font-weight: 400; }
  #l3 { top: 765px; font-size: 168px; line-height: 180px; font-weight: 700; letter-spacing: -3px; text-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #ul { left: 270px; top: 932px; width: 540px; height: 16px; border-radius: 8px; background: var(--c); box-shadow: 0 0 24px var(--c); }
  #badge { left: 50%; top: 1790px; transform: translateX(-50%); height: 96px; padding: 0 40px; border-radius: 48px; white-space: nowrap;
    background: rgba(255,255,255,.96); color: #061334; font-size: 40px; line-height: 96px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  #badge b { color: #0192c4; }
  #logo { left: 410px; top: 205px; width: 260px; height: 25.8px; opacity: .95; }
  #vig { inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(2,8,28,.5) 100%); }
  #grain { inset: 0; opacity: .1; background: url(../assets/brand/grain_256.png); }
</style>
</head>
<body>
<div id="main">
  <div id="orb" class="abs"></div>
  <div id="floorWrap" class="abs"><div id="floor"></div></div>
  <div id="cardA" class="card" style="left:-150px;top:930px;transform:scale(.56) rotate(-9deg)"></div>
  <div id="cardB" class="card" style="left:330px;top:930px;transform:scale(.56) rotate(8deg)"></div>
  <div id="halo" class="abs"></div>
  <div class="tag" style="left:40px;top:1300px;transform:rotate(-8deg)"><i>/</i>blueprint</div>
  <div class="tag" style="left:780px;top:1290px;transform:rotate(7deg)"><i>/</i>iceberg</div>
  <div class="tag" style="left:30px;top:1500px;transform:rotate(5deg) scale(.85)"><i>/</i>roadmap</div>
  <div class="tag" style="left:800px;top:1500px;transform:rotate(-6deg) scale(.85)"><i>/</i>tree</div>
  <canvas id="m" width="1080" height="1920"></canvas>
  <div id="chip" class="abs">KODE PROMPT AI</div>
  <div id="big" class="ctr">15 KODE</div>
  <div id="l2" class="ctr">bikin materi apa pun jadi</div>
  <div id="l3" class="ctr">VISUAL</div>
  <div id="ul" class="abs"></div>
  <img id="logo" class="abs" src="../assets/brand/logo_trim.png" alt="AIpreneur">
  <div id="badge" class="abs">Komen <b>PROMPT</b> → kirim ke DM</div>
  <div id="vig" class="abs"></div>
  <div id="grain" class="abs"></div>
</div>
<script>
  // static cards: fully built visuals (blueprint + iceberg)
  const VIS = window.VISUALS;
  document.getElementById("cardA").innerHTML = VIS[0].svg + '<div class="ctag">/blueprint</div>';
  document.getElementById("cardB").innerHTML = VIS[11].svg + '<div class="ctag">/iceberg</div>';
  // mascot: same rig, face calibration and director as the reel; pose taken from the reel at ?t=
  const q = new URLSearchParams(location.search), T = parseFloat(q.get("t") || "41.9");
  const M3 = window.Mascot3D, VW = window.VO_WORDS, PH = window.VO_PHR, D = 44.6;
  const W0 = PH.hook[1].start + 1.15;
  const intents = [{ t: PH.hook[0].start + 0.1, action: "question" }, { t: PH.hook[1].start, action: "emphasize", side: "left" }, { t: W0, action: "idle" },
    { t: PH.hook[2].start, action: "present", side: "right" }, { t: PH.hook[3].start + 0.2, action: "reveal" }];
  const ROT = ["pointFwd", "explain", "present", "emphasize", "explain", "pointFwd", "compare", "explain"];
  PH.codes.forEach((c, i) => intents.push({ t: c.name - 0.05, action: ROT[i % ROT.length], side: i % 2 ? "left" : "right" }));
  intents.push({ t: PH.cta[0].start, action: "cta", side: "right" }, { t: PH.cta[1].start + 1.0, action: "welcome", side: "left" });
  const DIR = M3.direct(VW, D, { intents, seed: 5, quiet: 0.2, look: 0 });
  const PERF = M3.buildPerformance(DIR.tracks, D + 0.05);
  const FACE = {"eyeA": {"c": [-0.091, 0.596], "r": [0.041, 0.034], "n": 757, "J": [0.4997633976754324, 0.3065330127591157, 0.314518943050391, -0.453702164567319], "uv0": [0.6328573151105054, 0.6167170084324972], "maxErr": 0.003818576762005663}, "eyeB": {"c": [0.091, 0.596], "r": [0.041, 0.034], "n": 753, "J": [0.5500133280433187, -0.06824460818744192, -0.09499495020823343, -0.5077214816509605], "uv0": [0.12402271349668496, 0.8611807690751265], "maxErr": 0.0028305745008792753}, "browA": {"c": [-0.09, 0.68], "n": 510, "J": [0.43108254869646895, 0.4376875904621281, 0.3523513551101368, -0.4754305212249294], "uv0": [0.6629852372177631, 0.5810053999225538], "maxErr": 0.004289199391581338}, "browB": {"c": [0.09, 0.68], "n": 362, "J": [0.5552915360962205, 0.08489039751259354, 0.1020935044591921, -0.6884358006120392], "uv0": [0.8350086373766634, 0.9448922678325264], "maxErr": 0.0020738571975070096}, "mouth": {"c": [0, 0.548], "r": [0.026, 0.016]}, "skin": [252, 240, 232], "skinEye": [252, 244, 234], "coverNormal": 0, "lidLit": [0.992, 0.975, 0.968], "mouthDy": 0.0, "faceSmooth": 1.0, "headC": [0, 0.7, -0.02]};
  window.THUMB_READY = fetch("../tools/decals.json").then((r) => r.json()).then((decals) => {
    decals.forEach((d) => { d.url = "../" + d.url; });
    return M3.Mascot.create(document.getElementById("m"), { url: "../assets/mascot3d/mascot_jas3_rigged.glb", face: FACE, decals, width: 1080, height: 1920, envIntensity: 0.6 });
  }).then((m) => {
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 2.1; o.color.setRGB(0.45, 0.85, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const Pf = PERF(T);
    m.setView({ fx: 540, fy: 2160, h: 1010, yaw: 0, pitch: 4 });
    m.setState({ root: { x: Pf.root.x, y: Pf.root.y, ry: Pf.root.ry, rz: Pf.root.rz, rx: 0, s: Pf.root.s }, bones: Pf.bones,
      face: { blink: [0, 0], gaze: [0, 0], mouthMix: 1, mouth: q.get("mouth") ? q.get("mouth").split(",").map(Number) : M3.buildLipTrack(window.VO_PHONES, window.VO_ENV, D)(parseFloat(q.get("mt") || T)) } });
    m.render();
    return document.fonts.ready;
  });
</script>
</body>
</html>

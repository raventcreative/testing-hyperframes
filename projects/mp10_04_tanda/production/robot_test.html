<!doctype html>
<html><head><meta charset="UTF-8" /><script src="../vendor/robot_mp.js"></script>
<style>html,body{margin:0;width:1080px;height:1920px;background:#F6F7FB;overflow:hidden} canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}</style></head>
<body><canvas id="a" width="1080" height="1920"></canvas><canvas id="b" width="1080" height="1920"></canvas><canvas id="c" width="1080" height="1920"></canvas><canvas id="d" width="1080" height="1920"></canvas>
<script>
// pose test: a = armR raised (screen side?), b = armL raised, c = shrug, d = x eyes
const P = [
  ["a", { x: 270, y: 640, h: 560, yaw: 0, aL: { raise: 15, bend: 10 }, aR: { raise: 140, fwd: 20, bend: 10 }, face: { lookX: 0 } }],
  ["b", { x: 810, y: 640, h: 560, yaw: 0, aL: { raise: 140, fwd: 20, bend: 10 }, aR: { raise: 15, bend: 10 }, face: { lookX: 1, lookY: -0.5 } }],
  ["c", { x: 270, y: 1500, h: 560, yaw: 0, aL: { raise: 70, fwd: 30, bend: 100, bendYaw: 90 }, aR: { raise: 70, fwd: 30, bend: 100, bendYaw: 90 }, face: { happy: 0, smile: 0, o: 0.4 }, headRoll: 12 }],
  ["d", { x: 810, y: 1500, h: 560, yaw: -25, aL: { raise: 15, bend: 10 }, aR: { raise: 15, bend: 10 }, face: { x: 1, smile: 0 }, rim: 1, shadow: .32 }],
];
let n = 0;
P.forEach(([id, st]) => RobotMP.create(document.getElementById(id), { url: "../assets/robot/robot_mp.glb", width: 1080, height: 1920 }).then((r) => { r.render(Object.assign({ t: 1 }, st)); if (++n === 4) window.COVER_READY = true; }));
</script></body></html>

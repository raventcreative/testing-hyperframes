<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Untung Tapi Uang Kok Nggak Ada?</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's plumbing wall as one tilted 3D panel: a full LABA tank whose water runs through glass pipes into three tanks
     (stok belum laku, dana belum cair, belanja stok lagi — each tagged "nyangkut"), while only a drip falls from the faucet into the
     almost empty KAS cash box. No numbers on the cover. The robot points at the cash box. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 0; width: 1080px; top: 372px; text-align: center; font: 800 150px/1 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t2 { position: absolute; left: 0; width: 1080px; top: 532px; text-align: center; white-space: nowrap; }
  #t2 span { display: inline-block; font: 800 112px/1.08 Rubik; letter-spacing: -3px; color: #161D3A; padding: 0 .1em;
             background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 82%; }
  #t3 { position: absolute; left: 0; width: 1080px; top: 676px; text-align: center; font: italic 400 58px/1.1 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: 40px; top: 760px; width: 1000px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.15), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 540px 1180px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  #pn { position: absolute; left: -390px; top: -380px; width: 780px; height: 760px; border-radius: 36px; overflow: hidden;
        background-color: #EBEFF7; background-image: linear-gradient(90deg, rgba(33,44,95,.06) 0 3px, transparent 3px), linear-gradient(0deg, rgba(33,44,95,.06) 0 3px, transparent 3px); background-size: 110px 74px;
        box-shadow: 0 50px 90px rgba(3,6,24,.5), inset 0 0 0 4px rgba(255,255,255,.6); }
  .pipe { position: absolute; background: linear-gradient(90deg, #8E98B6, #E2E7F2 45%, #A3ADC7); border-radius: 14px; }
  .pipe.h { background: linear-gradient(180deg, #8E98B6, #E2E7F2 45%, #A3ADC7); }
  .pipe i { position: absolute; inset: 7px; border-radius: 8px; background: repeating-linear-gradient(180deg, #4A84F7 0 18px, #7FA8FF 18px 26px); }
  .pipe.h i { background: repeating-linear-gradient(90deg, #4A84F7 0 18px, #7FA8FF 18px 26px); }
  .tank { position: absolute; border-radius: 16px; overflow: hidden; background: linear-gradient(100deg, rgba(255,255,255,.55), rgba(215,228,252,.35)); box-shadow: inset 0 0 0 7px #26367A, 0 18px 30px rgba(19,27,64,.25); }
  .tank .w { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(92,147,255,.85), rgba(42,88,214,.95)); border-top: 5px solid #D6E4FF; }
  .tank .shn { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0) 0 16%, rgba(255,255,255,.4) 16% 20%, rgba(255,255,255,0) 20%); }
  .tank .pl { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 9px 14px; border-radius: 10px; background: #212C5F; color: #fff; font: 800 21px/1 Rubik; letter-spacing: .05em; white-space: nowrap; }
  .tank .pl.big { padding: 12px 26px; font-size: 44px; color: #FED111; letter-spacing: .08em; }
  .ny { position: absolute; padding: 8px 13px 7px; border-radius: 999px; background: #FED111; font: 800 18px/1 PS; letter-spacing: .06em; color: #212C5F; white-space: nowrap; box-shadow: 0 8px 16px rgba(19,27,64,.25); }
  .vlv { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 8px solid #FED111; box-shadow: 0 6px 10px rgba(19,27,64,.28); }
  .vlv::before, .vlv::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 7px; margin: -3.5px 0 0 -23px; background: #FED111; border-radius: 4px; }
  .vlv::after { transform: rotate(90deg); }
  .box { position: absolute; left: 150px; top: 618px; width: 340px; height: 118px; border-radius: 10px; background: linear-gradient(180deg, #5D6C9E, #3E4A78); box-shadow: 0 16px 26px rgba(19,27,64,.3); }
  .box .in { position: absolute; left: 14px; right: 14px; top: -40px; height: 56px; border-radius: 10px 10px 0 0; background: #222A4C; box-shadow: inset 0 0 0 6px #8D9AC6; overflow: hidden; }
  .box .in i { position: absolute; left: 6px; right: 6px; bottom: 0; height: 9px; background: #6FA0FF; }
  .box .kp { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); padding: 12px 24px; border-radius: 12px; background: #FED111; font: 800 40px/1 Rubik; letter-spacing: .12em; color: #212C5F; }
  .noz { position: absolute; left: 290px; top: 446px; width: 48px; height: 86px; background: linear-gradient(90deg, #8E98B6, #E2E7F2 45%, #A3ADC7); border-radius: 0 0 8px 8px; }
  .noz::after { content: ""; position: absolute; left: -7px; bottom: -14px; width: 62px; height: 18px; border-radius: 4px; background: #26367A; }
  .drop { position: absolute; left: 303px; top: 556px; width: 24px; height: 24px; border-radius: 0 50% 50% 50%; background: #4A84F7; transform: rotate(45deg); }
  .qk { position: absolute; left: 512px; top: 590px; width: 76px; height: 76px; border-radius: 50%; background: #212C5F; display: flex; align-items: center; justify-content: center; font: 800 52px/1 Rubik; color: #FED111; box-shadow: 0 10px 20px rgba(19,27,64,.3); transform: rotate(10deg); }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">UNTUNG, TAPI</div>
  <div id="t2"><span>UANG KOK NGGAK ADA?</span></div>
  <div id="t3">labamu nyangkut di mana?</div>
  <div class="stage">
    <div class="g3" style="transform: translate3d(520px, 1185px, -40px) rotateY(12deg) rotateX(5deg) rotateZ(-1deg);"><div id="pn">
      <!-- pipes -->
      <div class="pipe" style="left:150px; top:330px; width:44px; height:150px;"><i></i></div>
      <div class="pipe h" style="left:150px; top:436px; width:186px; height:44px;"><i></i></div>
      <div class="pipe h" style="left:296px; top:250px; width:84px; height:40px;"><i></i></div>
      <div class="pipe" style="left:340px; top:96px; width:40px; height:356px;"><i></i></div>
      <div class="pipe h" style="left:340px; top:96px; width:120px; height:40px;"><i></i></div>
      <div class="pipe h" style="left:340px; top:252px; width:120px; height:40px;"><i></i></div>
      <div class="pipe h" style="left:340px; top:412px; width:120px; height:40px;"><i></i></div>
      <div class="vlv" style="left:386px; top:87px"></div><div class="vlv" style="left:386px; top:243px"></div><div class="vlv" style="left:386px; top:403px"></div>
      <!-- the LABA tank (full) -->
      <div class="tank" style="left:34px; top:36px; width:276px; height:300px;"><div class="w" style="height:80%"></div><i class="shn"></i><div class="pl big">LABA</div></div>
      <!-- three tanks where the money sits -->
      <div class="tank" style="left:450px; top:30px; width:296px; height:146px;"><div class="w" style="height:72%"></div><i class="shn"></i><div class="pl">STOK BELUM LAKU</div></div>
      <div class="tank" style="left:450px; top:200px; width:296px; height:146px;"><div class="w" style="height:66%"></div><i class="shn"></i><div class="pl">DANA BELUM CAIR</div></div>
      <div class="tank" style="left:450px; top:370px; width:296px; height:146px;"><div class="w" style="height:60%"></div><i class="shn"></i><div class="pl">BELANJA STOK LAGI</div></div>
      <div class="ny" style="left:604px; top:16px; transform: rotate(4deg)">NYANGKUT</div>
      <div class="ny" style="left:604px; top:186px; transform: rotate(-3deg)">NYANGKUT</div>
      <div class="ny" style="left:604px; top:356px; transform: rotate(3deg)">NYANGKUT</div>
      <!-- the faucet: one drip into the almost empty cash box -->
      <div class="noz"></div><div class="drop"></div>
      <div class="box"><div class="in"><i></i></div><div class="kp">KAS</div></div>
      <div class="qk">?</div>
    </div></div>
  </div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  document.fonts.ready.then(() => {
    // titles must fit inside x 60..1020; plates inside their tanks
    const tw = (el) => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
    const fit = (el, box) => { let fs = parseFloat(getComputedStyle(el).fontSize), k = 0; while (tw(el) > box && k < 40) { fs *= 0.97; el.style.fontSize = fs + "px"; k++; } };
    fit(document.getElementById("t1"), 900); fit(document.querySelector("#t2 span"), 900); fit(document.getElementById("t3"), 900);
    document.querySelectorAll(".tank .pl").forEach((p) => fit(p, p.parentElement.clientWidth - 60));
    return RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" });
  }).then((r) => {
    r.render({ x: 900, y: 1700, h: 500, yaw: -22, roll: 0, headYaw: -18, headPitch: 6, headRoll: 6, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 100, fwd: 28, bend: 16, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: -0.2, happy: 0, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

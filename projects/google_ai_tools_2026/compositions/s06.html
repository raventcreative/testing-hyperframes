              '<div class="s06-pshadow"></div>' +
              '<div class="s06-frame"><div class="s06-img"><img src="' + FILES[i] + '" alt="' + ALT[i] + '" /><div class="s06-sheen"></div><div class="s06-glaze"></div></div>' +
              '<div class="s06-pacc"></div><div class="s06-pdots"><i style="left:0"></i><i style="left:14px"></i><i style="left:28px;background:#294b77"></i></div>' +
              '<div class="s06-clip">' + CLIP + '</div></div>';
            return p;
          });
          const glazes = plates.map((p) => p.querySelector(".s06-glaze"));
          const paccs = plates.map((p) => p.querySelector(".s06-pacc"));

          // sparkles
          const STAR = '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff" stroke="#acc6e7" stroke-width="1.5"/></svg>';
          const sparks = [];
          for (let i = 0; i < 16; i++) {
            const sp = document.createElement("div");
            sp.className = "s06-abs s06-spark"; sp.innerHTML = STAR;
            sp.style.left = 513 + "px"; sp.style.top = 1000 + "px";
            q("#s06-sparks").appendChild(sp);
            const a = (i / 16) * Math.PI * 2 + rnd() * 0.35, r = 400 + rnd() * 160;
            sparks.push([sp, Math.cos(a) * r, Math.sin(a) * r * 0.85, 0.5 + rnd() * 0.7]);
          }

          // ---------- refs + poses ----------
          const world = q("#s06-world"), easel = q("#s06-easel");
          // loose, inconsistent poses (before "konsisten") — x, y, rotation, rotationY, scale
          const LOOSE = [
            { x: -14, y: -26, rotation: -6, rotationY: 12, scale: 0.93 },
            { x: 6, y: 30, rotation: 4.5, rotationY: -10, scale: 1.05 },
            { x: 16, y: -12, rotation: -3, rotationY: -12, scale: 0.95 },
          ];
          const HALF = LOOSE.map((p) => ({ x: p.x * 0.45, y: p.y * 0.45, rotation: p.rotation * 0.45, rotationY: p.rotationY * 0.45, scale: 1 + (p.scale - 1) * 0.45 }));
          const ALIGN = { x: 0, y: 0, rotation: 0, rotationY: 0, scale: 1 };
          const ENTER = [
            { x: -520, y: 110, rotation: -22, rotationY: 30, scale: 0.9 },
            { x: 0, y: 760, rotation: 10, rotationY: 0, scale: 0.9 },
            { x: 620, y: 140, rotation: 22, rotationY: -40, scale: 0.9 },
          ];
          const LAND = [T.membantu + 0.08, T.materi, T.promosi];

          // ---------- initial states ----------
          tl.set(world, { transformOrigin: "540px 960px" }, 0);
          tl.set(easel, { transformOrigin: "50% 100%", rotationX: 22, y: 90, scale: 0.94 }, 0);
          plates.forEach((p, i) => tl.set(p, Object.assign({ transformOrigin: "50% 100%", opacity: i === 0 ? 1 : 0, z: 46 }, ENTER[i]), 0));
          tl.set(q("#s06-header"), { y: -40, opacity: 0 }, 0);
          tl.set([q("#s06-guidelines"), q("#s06-guidemarks")], { opacity: 0 }, 0);
          const acc = q("#s06-accent"); const AL = 860;
          tl.set(acc, { attr: { "stroke-dasharray": AL + " " + AL, "stroke-dashoffset": AL } }, 0);
          tl.set(q("#s06-accdot"), { scale: 0, transformOrigin: "50% 50%" }, 0);
          tl.set([q("#s06-glow"), q("#s06-shock"), q("#s06-cone")], { opacity: 0 }, 0);
          tl.set(q("#s06-check"), { scale: 0 }, 0);
          tl.set(sparks.map((s) => s[0]), { opacity: 0 }, 0);
          tl.set(glazes, { x: 0 }, 0);

          // ---------- camera + planes ----------
          tl.fromTo(world, { scale: 1 }, { scale: 1.065, duration: DUR, ease: "sine.inOut", immediateRender: false }, 0);
          tl.fromTo("#s06-far", { y: 0, x: 0 }, { y: -50, x: -14, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo("#s06-near", { y: 80 }, { y: -170, duration: DUR, ease: "none", immediateRender: false }, 0);

          // frosted swipe wipe clears left -> right (frame 0 already mid-swipe)
          tl.fromTo(q("#s06-swipe"), { x: 60, opacity: 0.8 }, { x: 1300, opacity: 0.8, duration: 0.34, ease: "power2.in", immediateRender: false }, 0);
          tl.fromTo(qa("#s06-wipe .s06-streak"), { x: -200, opacity: 1 }, { x: 1300, opacity: 0, duration: 0.36, ease: "power2.in", stagger: 0.03, immediateRender: false }, 0);

          // easel stands up on "Lalu"
          tl.fromTo(easel, { rotationX: 22, y: 90, scale: 0.94 }, { rotationX: 6, y: 0, scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s06-legs"), { y: 60, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s06-shadow"), { scaleX: 0.8, opacity: 0.5 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(easel, { rotationX: 6 }, { rotationX: 4, duration: DUR - 0.55, ease: "sine.inOut", immediateRender: false }, 0.55);
          // real 'Campaign' header plaque drops in on "membantu"
          tl.fromTo(q("#s06-header"), { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "back.out(1.6)", immediateRender: false }, T.membantu - 0.12);

          // plates fly in and land (loose) on "bikin" / "materi" / "promosi"
          plates.forEach((p, i) => {
            const d = i === 0 ? LAND[0] : 0.42, t0 = i === 0 ? 0 : LAND[i] - d * 0.62;
            tl.fromTo(p, Object.assign({ opacity: i === 0 ? 1 : 0 }, ENTER[i]), Object.assign({ opacity: 1, duration: d, ease: i === 0 ? "power3.out" : "back.out(1.4)", immediateRender: false }, LOOSE[i]), t0);
            // loose idle drift (inconsistent, slightly wobbly)
            tl.fromTo(p, { y: LOOSE[i].y }, { y: LOOSE[i].y + (i % 2 ? -8 : 8), duration: 0.5, ease: "sine.inOut", immediateRender: false }, (i === 0 ? LAND[0] : t0 + d) + 0.02);
          });

          // "tampilan" -> alignment guides appear, plates start pulling toward the grid
          tl.fromTo([q("#s06-guidelines"), q("#s06-guidemarks")], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, T.tampilan - 0.05);
          tl.fromTo(q("#s06-guidelines"), { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -64 }, duration: 1.0, ease: "none", immediateRender: false }, T.tampilan);
          plates.forEach((p, i) => {
            const from = Object.assign({}, LOOSE[i], { y: LOOSE[i].y + (i % 2 ? -8 : 8) });
            tl.fromTo(p, from, Object.assign({ duration: 0.5, ease: "power2.inOut", immediateRender: false }, HALF[i]), T.tampilan);
            // "yang" -> lift a touch (anticipation)
            tl.fromTo(p, HALF[i], Object.assign({}, HALF[i], { y: HALF[i].y - 26, scale: HALF[i].scale * 1.02, duration: 0.14, ease: "power2.out", immediateRender: false }), T.yang - 0.02);
            // APEX "konsisten." -> snap into one aligned row (power4.in into contact)
            tl.fromTo(p, Object.assign({}, HALF[i], { y: HALF[i].y - 26, scale: HALF[i].scale * 1.02 }), Object.assign({ duration: 0.05, ease: "power4.in", immediateRender: false }, ALIGN), T.konsisten - 0.05);
            // settle
            tl.fromTo(p, { y: 0 }, { y: -7, duration: 0.11, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.konsisten + 0.02 + i * 0.02);
          });

          // ---------- APEX FX ----------
          const A = T.konsisten;
          tl.fromTo(acc, { attr: { "stroke-dashoffset": AL } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power3.out", immediateRender: false }, A);
          tl.fromTo(q("#s06-accdot"), { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, A + 0.1);
          tl.fromTo(paccs, { backgroundColor: "#cbdbf4", scaleX: 1 }, { backgroundColor: "#294b77", scaleX: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo([q("#s06-guidelines"), q("#s06-guidemarks")], { opacity: 1 }, { opacity: 0.25, duration: 0.4, ease: "power2.out", immediateRender: false }, A + 0.15);
          tl.fromTo(q("#s06-glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.8, scale: 1.1, duration: 0.25, ease: "power2.out", immediateRender: false }, A - 0.03);
          tl.fromTo(q("#s06-glow"), { opacity: 0.8 }, { opacity: 0.25, duration: 0.45, ease: "power2.out", immediateRender: false }, A + 0.22);
          tl.fromTo(q("#s06-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s06-cone"), { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power2.out", immediateRender: false }, A - 0.2);
          tl.fromTo(easel, { scale: 1 }, { scale: 1.04, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
          tl.fromTo(q("#s06-check"), { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, A + 0.08);
          glazes.forEach((g, i) => tl.fromTo(g, { x: 0 }, { x: 560, duration: 0.5, ease: "power2.inOut", immediateRender: false }, A + 0.02 + i * 0.06));
          sparks.forEach(([sp, dx, dy, s], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: s, opacity: 0, rotation: 90, duration: 0.7, ease: "power3.out", immediateRender: false }, A + i * 0.01);
          });

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>

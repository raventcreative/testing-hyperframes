      <audio id="sfx29" class="clip" src="assets/sfx/vo_safe/click.wav" data-start="37.805" data-duration="0.365" data-track-index="12" data-volume="0.08"></audio>
      <audio id="sfx30" class="clip" src="assets/sfx/vo_safe/ping.wav" data-start="38.09" data-duration="1.320" data-track-index="13" data-volume="0.1"></audio>
      <audio id="sfx31" class="clip" src="assets/sfx/vo_safe/sparkle.wav" data-start="40.04" data-duration="1.160" data-track-index="10" data-volume="0.07"></audio>
      <!--/AUDIO-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const D = 41.2, PH = window.VO_PHR, VW = window.VO_WORDS;
        const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });
        const ft = (el, a, b, at) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), at);
        const st = (el, v, at) => tl.set(el, v, at);
        const wt = (ph, txt, end, nth = 1) => { let c = 0; for (let k = ph.w0; k <= ph.w1; k++) if (VW[k][0].replace(/[.,?:]/g, "").toLowerCase() === txt.toLowerCase() && ++c === nth) return end ? VW[k][2] : VW[k][1]; throw new Error("word " + txt); };
        const pop = (el, at, k = 1) => ft(el, { opacity: 0, y: 26, scale: 1.3 * k, filter: "blur(8px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "back.out(1.8)" }, at);
        const out = (el, at, d = 0.2) => ft(el, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: d, ease: "power2.in" }, at);
        const H = PH.hook, IT = PH.items, CT = PH.cta;
        const ITEMS = [
          ["3D page flythrough", "LANDING PAGE", "Pamer website yang baru launching.", "zero · @twoclipping"],
          ["Product tour promo", "PRODUCT UI", "Launching fitur SaaS.", "Joseph Lee · @jhylee95"],
          ["Dashboard launch film", "CHARTS", "Dashboard fintech &amp; SaaS.", "prompt-motion.com"],
          ["AI food finder", "PHONE", "Video launching app AI.", "ultima · @ultimaxbt"],
          ["Weekday countdown", "KINETIC TYPE", "Drop event &amp; launching mingguan.", "prompt-motion.com"],
          ["UGC creator promo", "PHONE", "Brand kreator &amp; tools AI.", "zero · @twoclipping"],
          ["Claymation music video", "CHARACTERS", "Cerita brand pakai karakter.", "David Shulman · @DavidShulmanFL"]];
        const HL = [[2, 3], [1, 2, 3], [0, 3], [0, 6, 7], [0, 1, 6], [0, 1, 4], [0, 1, 4, 6]];
        const WIN = IT.map((it, k) => [it.label.start - 0.2, k < 6 ? IT[k + 1].label.start - 0.2 : CT[0].start - 0.25]);
        // ================================================= background life
        ft("#grain", { x: 0, y: 0 }, { x: 64, y: 40, duration: D, ease: "steps(494)" }, 0);
        // ================================================= motion ball (+2 ghosts trailing)
        const balls = [$("#ball"), $(".ball.g1"), $(".ball.g2")];
        const hop = (from, to, t, d = 0.42, peak = 140) => balls.forEach((b, i) => {
          const lag = i * 0.045, top = Math.min(from[1], to[1]) - peak;
          ft(b, { x: from[0] }, { x: to[0], duration: d, ease: "power1.inOut" }, t + lag);
          ft(b, { y: from[1] }, { keyframes: [{ y: top, ease: "power2.out" }, { y: to[1], ease: "power2.in" }], duration: d }, t + lag);
          if (i === 0) ft(b, { scaleX: 1, scaleY: 1 }, { keyframes: [{ scaleX: 1.35, scaleY: 0.7 }, { scaleX: 0.9, scaleY: 1.1 }, { scaleX: 1, scaleY: 1 }], duration: 0.3, ease: "none" }, t + d);
        });
        gsap.set(balls, { x: 540, y: -60 });
        ft(balls[0], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
        ft(balls[1], { opacity: 0 }, { opacity: 0.45, duration: 0.2 }, 0.25);
        ft(balls[2], { opacity: 0 }, { opacity: 0.22, duration: 0.2 }, 0.3);
        // ================================================= HOOK 1: "Video kayak gini dulu butuh satu tim editor."
        const h1 = $$("#h1 .w");
        st(h1[0], { opacity: 1 }, 0); ft(h1[0], { scale: 1.5, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.3, ease: "back.out(2)" }, 0);
        ["kayak", "gini", "dulu", "butuh", "satu"].forEach((x, i) => pop(h1[i + 1], wt(H[0], x) - 0.04, i === 4 ? 1.4 : 1));
        hop([540, -60], [540, 240], 0.15, 0.5, 40);
        hop([540, 240], [880, 250], wt(H[0], "satu") - 0.3, 0.35, 90);
        // montage punch on every cut
        $$(".mont").forEach((v, k) => ft("#frame", { scale: 1.04 }, { scale: 1, duration: 0.22, ease: "power2.out" }, 0.08 + k * 0.28));
        ft("#frame", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0);
        out("#h1", H[1].start - 0.15, 0.15);
        // HOOK 2: "Sekarang, cukup satu prompt."
        const h2 = $$("#h2 .w");
        pop(h2[0], wt(H[1], "sekarang") - 0.04); pop(h2[1], wt(H[1], "cukup") - 0.04); pop(h2[2], wt(H[1], "satu") - 0.04, 1.5);
        ft("#prompt", { opacity: 0, x: 90, y: 380, scale: 0.9 }, { opacity: 1, x: 90, y: 380, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, H[1].start - 0.05);
        const PT = "Bikin video launch 3D dari landing page-ku, kamera terbang pelan…";
        const ptx = $("#prompt .tx"); ptx.innerHTML = Array.from(PT).map((c) => `<s>${c}</s>`).join("");
        $$("#prompt .tx s").forEach((c, k) => ft(c, { display: "none" }, { display: "inline", duration: 0.01 }, H[1].start + 0.1 + k * 0.019));
        ft("#prompt .sd", { scale: 1 }, { keyframes: [{ scale: 0.82 }, { scale: 1.12 }, { scale: 1 }], duration: 0.3, ease: "none" }, H[1].end - 0.2);
        ft("#flash", { opacity: 0 }, { opacity: 0.45, duration: 0.05, yoyo: true, repeat: 1 }, H[1].end - 0.05);
        hop([880, 250], [930, 640], H[1].end - 0.45, 0.4, 60);
        ft("#prompt", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.15, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, H[2].start - 0.2);
        out("#h2", H[2].start - 0.15, 0.15);
        // HOOK 3: "Ini tujuh prompt motion terbaik minggu ini, dan nomor tujuh paling gila."
        const h3 = $$("#h3 .w");
        [["ini", 1], ["tujuh", 1], ["prompt", 1], ["terbaik", 1], ["minggu", 1], ["ini", 2]].forEach(([x, n], i) => pop(h3[i], wt(H[2], x, false, n) - 0.04, i === 1 ? 1.8 : 1));
        const list = $("#list"), NM = ITEMS.map((x) => x[0]);
        NM.forEach((n, k) => { const d = document.createElement("div"); d.className = "li" + (k === 6 ? " hot" : ""); d.style.top = 20 + k * 65 + "px"; d.innerHTML = `<b>${String(k + 1).padStart(2, "0")}</b>${n}${k === 6 ? '<div class="fire">paling gila 🔥</div>' : ""}`; list.appendChild(d); });
        ft("#list", { opacity: 0 }, { opacity: 1, duration: 0.25 }, H[2].start);
        $$(".li").forEach((d, k) => ft(d, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, H[2].start + 0.15 + k * 0.17));
        const TG = wt(H[2], "paling");
        ft(".li.hot", { scale: 1 }, { keyframes: [{ scale: 1.06, x: -6 }, { x: 6 }, { x: -4 }, { scale: 1, x: 0 }], duration: 0.4, ease: "none" }, TG - 0.05);
        ft(".li .fire", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, TG);
        hop([930, 640], [870, 865], TG - 0.4, 0.38, 80);
        out("#hook", WIN[0][0] - 0.05, 0.2);
        ft("#list", { opacity: 1 }, { opacity: 0, duration: 0.2 }, WIN[0][0] - 0.05);
        // ================================================= ITEMS
        const itemsEl = $("#items");
        ITEMS.forEach(([name, tag, best, cred], k) => {
          const it = IT[k], [t0, t1] = WIN[k];
          const el = document.createElement("div"); el.className = "it"; itemsEl.appendChild(el);
          const dw = it.desc.text.split(" ");
          el.innerHTML = `<div class="num"><b>${String(k + 1).padStart(2, "0")}</b><span>/ 07</span></div><div class="tag" style="left:${k < 9 ? 250 : 260}px"><i></i>${tag}</div>
            <div class="ttl">${name.split(" ").map((w) => `<span class="w">${w}</span>`).join(" ")}</div>
            <div class="cap">${dw.map((w, j) => `<span class="w${HL[k].includes(j) ? " k" : ""}">${w}</span>`).join(" ")}</div>
            <div class="best"><b>COCOK BUAT</b>${best}</div><div class="cred">Ide prompt: <b>${cred.split(" · ")[0]}</b>${cred.includes(" · ") ? " · " + cred.split(" · ")[1] : ""} · dibuat ulang versi AIpreneur</div>`;
          st(el, { opacity: 1 }, t0); if (k < 6) st(el, { opacity: 0 }, t1);
          // zoom-out entry (from the previous point)
          ft("#stage", { scale: 0.82, filter: "blur(12px)", opacity: 0.2 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "expo.out" }, t0);
          pop($(".num", el), it.label.start - 0.05, 1.3);
          ft($(".tag", el), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, it.label.start + 0.1);
          $$(".ttl .w", el).forEach((w, j) => pop(w, it.name.start - 0.06 + j * 0.07));
          $$(".cap .w", el).forEach((w, j) => ft(w, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, VW[it.desc.w0 + j][1] - 0.04));
          ft([$(".best", el), $(".cred", el)], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.1 }, it.name.start + 0.1);
          // motion ball: lands on the number, hops to the frame corner, then dives into the frame at the sentence end
          const prev = k === 0 ? [870, 865] : [540, 686];
          hop(prev, [92, 183], t0 + 0.02, 0.36, 120);
          hop([92, 183], [985, 445], it.name.start + 0.05, 0.45, 110);
          ft(balls[0], { y: 445 }, { y: 432, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((t1 - it.name.start - 1.6) / 0.35)) }, it.name.start + 0.55);
          if (k < 6) {
            hop([985, 445], [540, 686], t1 - 0.48, 0.3, 50);
            // zoom-in exit at the sentence end ("titik")
            ft("#stage", { scale: 1, filter: "blur(0px)", opacity: 1 }, { scale: 1.32, filter: "blur(10px)", opacity: 0.2, duration: 0.3, ease: "power2.in" }, t1 - 0.3);
            ft(balls, { scale: 1 }, { scale: 2.4, duration: 0.18, ease: "power2.in" }, t1 - 0.2);
            ft(balls, { scale: 2.4 }, { scale: 1, duration: 0.2, ease: "power2.out" }, t1 + 0.02);
          }
        });
        // ================================================= CTA
        const C0 = CT[0].start, TC = WIN[6][1];
        ft("#stage", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 1.25, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, TC - 0.05);
        hop([985, 445], [540, 330], TC - 0.1, 0.4, 60);
        const ctw = $$("#cta .w");
        pop(ctw[0], wt(CT[0], "komen") - 0.05);
        ft("#mpill", { opacity: 0, scale: 2.2, rotation: -12, filter: "blur(16px)" }, { opacity: 1, scale: 1, rotation: -3, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, wt(CT[0], "motion") - 0.05);
        ft("#flash", { opacity: 0 }, { opacity: 0.4, duration: 0.05, yoyo: true, repeat: 1 }, wt(CT[0], "motion"));
        ft(balls, { opacity: 1 }, { opacity: 0, duration: 0.2 }, wt(CT[0], "motion"));
        ft("#cbox", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, C0 - 0.1);
        const ty = $("#cbox .ty"); ty.innerHTML = Array.from("MOTION").map((c) => `<s>${c}</s>`).join("");
        const TM0 = wt(CT[0], "motion"), TM1 = wt(CT[0], "motion", true);
        ft("#cbox .ph", { opacity: 1 }, { opacity: 0, duration: 0.01 }, TM0 - 0.02);
        $$("#cbox .ty s").forEach((c, k) => ft(c, { display: "none" }, { display: "inline", duration: 0.01 }, TM0 + k * (TM1 - TM0) / 6));
        ft("#cbox .po", { scale: 1 }, { keyframes: [{ scale: 0.84 }, { scale: 1.1 }, { scale: 1 }], duration: 0.3, ease: "none" }, CT[1].start - 0.05);
        pop(ctw[1], wt(CT[1], "kirim") - 0.15); pop(ctw[2], wt(CT[1], "ketujuh") - 0.05, 1.2); pop(ctw[3], wt(CT[1], "dm") - 0.05);
        const drs = $("#drs");
        ITEMS.forEach(([n, , , c], k) => { const d = document.createElement("div"); d.className = "dr"; d.style.top = 118 + k * 39 + "px";
          d.innerHTML = `<b>${String(k + 1).padStart(2, "0")}</b>${n}<span>${c}</span>`; drs.appendChild(d); });
        ft("#dm", { opacity: 0, y: 60, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, wt(CT[1], "kirim") - 0.05);
        $$(".dr").forEach((d, k) => ft(d, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, wt(CT[1], "kirim") + 0.3 + k * 0.12));
        tl.set({}, {}, D - 0.01);
        window.__timelines["main"] = tl;
      })();
    </script>

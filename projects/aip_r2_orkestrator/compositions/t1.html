  <script>

      // t1 "Satu, OpenHands Agent Canvas. Satu pusat kontrol buat jalanin Claude Code, Codex, sampai Gemini, di laptop, server, atau cloud."

      // "OpenHands … Canvas.": title wipes up, repo line, "open source" chip · "pusat kontrol": the control-centre panel lights ·

      // · "laptop, / server, / cloud.": the 3 backend tiles switch on. END: pill 1 done; the card flips edge-on (rotationY 90) → t2 flips in from −90.
      const ID = "t1", K = 0;
      const SC = window.VO_SCENES.find((s) => s.id === ID), ST = SC.start, D = SC.dur, VW = window.VO_WORDS, R2 = window.R2, RD = window.ROUNDS[K];
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 1e-3); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }

        `<div class="t1-lab" style="left:28px;top:128px">AGENT</div><div class="t1-lab" style="left:488px;top:128px">JALAN DI</div>`;

        `<div class="t1-bn" id="t1-bn${i}">${R2.ic(icn, 48, "#ffffff")}<div class="t1-bl">${n}</div></div><div class="t1-bk" id="t1-bk${i}">${R2.CHECK(20)}</div></div>`).join("");
      h += `<div class="t1-a" id="t1-cc"><div class="t1-a" id="t1-ccb"></div><div class="t1-a" id="t1-ccr"></div><div class="t1-a rk-nav" id="t1-cci">${R2.ic("layout-dashboard", 22, "#ffffff")}</div>` +
        `<div class="t1-a" id="t1-cct">Pusat kontrol</div><div class="t1-a" id="t1-ccs">self-hosted · 1 layar</div>` +
        `<div class="t1-a" id="t1-ccn"><span class="rk-g" id="t1-ccv">0</span></div><div class="t1-a" id="t1-ccl">agent jalan</div><div class="t1-a" id="t1-ccm">dari satu dashboard</div></div>`;
      h += `</div>`;

      // ---------------------------------------------------------------- rail + card entrance
      R2.railInit(tl, "t1", [0, 0, 0, 0]);

      const card = $("t1-card"), glow = $("t1-glow");

      I(card, { opacity: 0, y: 90, scale: 0.94, rotationY: 0, transformPerspective: 3200 });
      ft(card, { opacity: 0, y: 90, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      const hic = $("t1-hic"), ht = $("t1-ht"), hr = $("t1-hr"), hos = $("t1-hos");
      I(hic, { scale: 0.4, opacity: 0, rotation: -30 }); ft(hic, { scale: 0.4, opacity: 0, rotation: -30 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" }, 0.18);

      I(hr, { opacity: 0, x: -14 }); ft(hr, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, tName + 0.3);

      // "jalanin … Claude Code, Codex, … Gemini,": each agent starts on its word
      const tRun = [tJal + 0.1, tCl - 0.04, tCx - 0.04, tGe - 0.04];
      tRun.forEach((t, i) => {
        const r = $("t1-r" + i);
        ft($("t1-rr" + i), { opacity: 0 }, { opacity: 1, duration: 0.18 }, t);
        ft($("t1-tn" + i), { opacity: 0 }, { opacity: 1, duration: 0.18 }, t);
        ft($("t1-s1" + i), { opacity: 0 }, { opacity: 1, duration: 0.14 }, t + 0.04);
        ft($("t1-s0" + i), { opacity: 1 }, { opacity: 0, duration: 0.14 }, t + 0.04);
        ft(r, { scale: 1 }, { scale: 1.035, duration: 0.11, yoyo: true, repeat: 1, ease: "power2.out" }, t);
        const sp = $("t1-sp" + i);   // status ping, repeating
        for (let k = 0; t + 0.1 + k * 0.7 < D - 0.3; k++) ft(sp, { scale: 0.5, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.6, ease: "power2.out" }, t + 0.1 + k * 0.7);
        tl.set(ccv, { textContent: String(i + 1) }, t + 0.04);
        ft(ccn, { scale: 1 }, { scale: 1.18, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, t + 0.04);
      });
      const more = $("t1-more"); I(more, { opacity: 0, y: 16 });
      ft(more, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, tSam);
      // "laptop, server, cloud.": the backends switch on
      [tLap, tSrv, tClo].forEach((t, i) => {
        const b = $("t1-b" + i);

        ft(b, { scale: 1, y: 0 }, { scale: 1.08, y: -6, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, t - 0.04);
        ft($("t1-bk" + i), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(3)" }, t + 0.06);
      });

      R2.railDone(tl, "t1", K, D - 0.42);
      ft(card, { rotationY: 0, scale: 1 }, { rotationY: 90, scale: 0.9, duration: 0.3, ease: "power2.in" }, D - 0.31);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};

    })();

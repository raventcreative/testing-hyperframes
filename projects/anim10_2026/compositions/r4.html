  <script>
    (function () {
      // r4 CHALKBOARD "Empat, Chalkboard, gambar kapur, pas buat konten edukasi."
      // A floating chalk stick annotates the board like a teacher, in 12 fps stop-motion steps (the stage steps the robot at 12 fps too):
      // sweep lands (chalk-scratch SFX) -> it hand-writes "ini / robot" in the clean column above the robot's head ·

      // "konten edukasi" -> an "A+" in the top-right corner, circled on "edukasi" · then the board is wiped clean (stepped smear) by the end.
      const R = window.ROUNDS[3], DUR = R.dur, T = (g) => g - R.start;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const FPS = 12, q = (t) => Math.round(t * FPS) / FPS;            // stop-motion grid (local time)
      const NS = "http://www.w3.org/2000/svg";
      // the chalk mask must be decoded before any frame is captured (chunked renders start mid-scene)
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      { const g = new Image(); g.src = "assets/fx/chalk_grain.png"; window.__hf.buildReady["r4-grain"] = (g.decode ? g.decode() : Promise.resolve()).catch(() => {}); }
      let seed = 4; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      // ---------------------------------------------------------------- hand-lettered single-stroke glyphs (baseline 0, x-height 34)
      const GL = {
        i: { w: 14, s: ["M5,-31 L4,0", "M6,-47 L6.5,-49"] },
        n: { w: 32, s: ["M4,-33 L3,0 L4,-19 C8,-30 14,-34 20,-33 C27,-31 28,-22 28,-12 L28,0"] },
        r: { w: 25, s: ["M4,-33 L3,0 L4,-17 C8,-28 14,-34 23,-31"] },
        o: { w: 33, s: ["M19,-33 C8,-34 1,-25 2,-15 C3,-4 10,1 18,0 C27,-1 32,-11 30,-21 C28,-30 21,-35 13,-31"] },
        b: { w: 31, s: ["M5,-58 L4,-2 C10,1 21,1 26,-7 C31,-16 27,-32 17,-33 C10,-33 6,-27 4,-20"] },

      };
      const SK = Math.tan(-9 * Math.PI / 180);                         // handwriting slant
      // word -> list of {d, tx, ty, s}  (glyph space mapped by translate + scale + skew)
      const word = (txt, x, y, s) => { const out = []; let cx = 0; for (const ch of txt) { const g = GL[ch]; g.s.forEach((d) => out.push({ d, tx: x + cx * s, ty: y, s })); cx += g.w + 3; } return out; };
      const width = (txt) => [...txt].reduce((a, ch) => a + GL[ch].w + 3, -3);
      const strokesEl = $("r4-strokes");
      // one SVG path per stroke; geometry transform baked in so lengths / points are in stage-local px
      function mkStroke(o, color) {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", o.d); p.setAttribute("stroke", color); p.setAttribute("fill", "none");
        p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
        if (!o.raw) p.setAttribute("transform", `translate(${o.tx} ${o.ty}) scale(${o.s}) skewX(-9)`);
        strokesEl.appendChild(p);
        const L = p.getTotalLength() || 60;
        const map = o.raw ? (pt) => ({ x: pt.x, y: pt.y }) : (pt) => ({ x: o.tx + o.s * (pt.x + SK * pt.y), y: o.ty + o.s * pt.y });
        const at = (l) => { try { return map(p.getPointAtLength(l)); } catch (e) { return { x: o.tx, y: o.ty }; } };
        const S = { el: p, L, at, len: L * (o.raw ? 1 : o.s) };                         // len = on-screen length (for pacing)
        p.setAttribute("stroke-dasharray", `${L + 1} ${L + 40}`);
        I(p, { attr: { "stroke-dashoffset": L + 1 } });

      }
      const CH = "#f5f3ea", YEL = "#f9e98f", PINK = "#ff8fa9";
      const stick = $("r4-stick");
      I(stick, { x: 420, y: 140, opacity: 0, rotation: 0 });
      // write a list of strokes on the 12 fps grid from t0 for dur; the stick tip rides the stroke tip
      function write(list, t0, dur) {
        const tot = list.reduce((a, s) => a + s.len, 0), n = Math.max(2, Math.round(dur * FPS));
        const last = new Map();
        for (let k = 1; k <= n; k++) {
          const tk = q(t0) + k / FPS, d = tot * k / n;
          let acc = 0, tip = null;
          for (const s of list) {
            const u = Math.max(0, Math.min(1, (d - acc) / s.len)); acc += s.len;
            const off = u >= 1 ? 0 : u <= 0 ? s.L + 1 : s.L * (1 - u);
            if (last.get(s) !== off) { tl.set(s.el, { attr: { "stroke-dashoffset": off } }, tk); last.set(s, off); }
            if (u > 0) tip = s.at(s.L * u);
          }
          if (tip) { tl.set(stick, { x: tip.x, y: tip.y, rotation: (k % 2 ? -3 : 2) }, tk); lastTip = tip; }
        }
        return q(t0) + n / FPS;
      }
      let lastTip = { x: 420, y: 140 };
      const stickIn = (t, x, y) => { tl.set(stick, { x, y, opacity: 1, scale: 1.12 }, q(t)); tl.set(stick, { scale: 1 }, q(t) + 1 / FPS); };
      const stickOut = (t) => { const p = lastTip; tl.set(stick, { x: p.x + 18, y: p.y - 22, opacity: 0.6 }, q(t)); tl.set(stick, { x: p.x + 40, y: p.y - 48, opacity: 0 }, q(t) + 1 / FPS); };

      // ---------------------------------------------------------------- beat 1: "ini / robot" (sweep lands, chalk-scratch SFX)
      const CX = 398, SL = 1.1;
      const W1 = word("ini", CX - width("ini") * SL / 2 - 6, 222, SL).map((o) => mkStroke(o, CH));
      const W2 = word("robot", CX - width("robot") * SL / 2, 294, SL).map((o) => mkStroke(o, CH));
      const tA = T(R.sweep[1]) + 0.04;
      stickIn(tA, W1[0].at(0).x, W1[0].at(0).y);
      const tB = write(W1, tA, 0.17);
      write(W2, tB, 0.42);

      // ---------------------------------------------------------------- beat 2: "gambar kapur" -> underline swoosh curling into an arrow onto the head
      const tG = T(window.VO_WORDS.find((w) => w[0] === "gambar")[1]);
      const tK = T(window.VO_WORDS.find((w) => w[0] === "kapur")[1]);
      const arr = mkStroke({ d: "M304,312 C360,305 432,303 488,308 C516,311 514,344 490,362 C468,378 438,391 414,404", raw: 1 }, CH);
      // arrowhead from the tangent at the tip
      const pA = arr.at(arr.L), pB = arr.at(arr.L - 14), ang = Math.atan2(pA.y - pB.y, pA.x - pB.x);
      const head = (da) => `M${(pA.x - 26 * Math.cos(ang + da)).toFixed(1)},${(pA.y - 26 * Math.sin(ang + da)).toFixed(1)} L${pA.x.toFixed(1)},${pA.y.toFixed(1)}`;
      const h1 = mkStroke({ d: head(0.62), raw: 1 }, CH), h2 = mkStroke({ d: head(-0.62), raw: 1 }, CH);
      tl.set(stick, { x: arr.at(0).x, y: arr.at(0).y, rotation: 0 }, q(tG) - 1 / FPS);
      const tH = write([arr], tG, 0.33);
      write([h1, h2], tH, 0.09);
      // "kapur": a puff of chalk dust off the arrow tip
      const dust = $("r4-dust"), DU = [];
      for (let i = 0; i < 7; i++) {
        const c = document.createElementNS(NS, "circle"); c.setAttribute("r", (2.2 + rnd() * 2.6).toFixed(1)); c.setAttribute("fill", CH);
        dust.appendChild(c); const a = -Math.PI / 2 + (i / 6 - 0.5) * 2.4 + (rnd() - 0.5) * 0.3, dd = 24 + rnd() * 26;
        DU.push(c); I(c, { x: pA.x, y: pA.y, opacity: 0 });
        for (let k = 0; k < 4; k++) {
          const u = (k + 1) / 4, tk = q(tK) + k / FPS;
          tl.set(c, { x: pA.x + Math.cos(a) * dd * u, y: pA.y + Math.sin(a) * dd * u + 10 * u * u, opacity: k === 3 ? 0 : 0.85 - k * 0.22 }, tk);
        }
      }
      stickOut(q(tK) + 2 / FPS);

      // ---------------------------------------------------------------- beat 3: "buat konten edukasi" -> A+ in the corner, circled on "edukasi"
      const tKo = T(window.VO_WORDS.find((w) => w[0] === "buat" && w[1] > R.start)[1]);
      const tE = T(window.VO_WORDS.find((w) => w[0] === "edukasi.")[1]);
      const AP = { tx: 622, ty: 176, s: 1.22 };
      const A1 = ["M0,0 L22,-64 L44,0", "M11,-25 L35,-26"].map((d) => mkStroke(Object.assign({ d }, AP), YEL));
      const A2 = ["M56,-31 L90,-32", "M74,-48 L73,-14"].map((d) => mkStroke(Object.assign({ d }, AP), YEL));
      const ring = mkStroke(Object.assign({ d: "M98,-66 C72,-96 -6,-92 -18,-44 C-28,-2 18,22 60,17 C106,11 122,-30 104,-58 C95,-72 82,-80 64,-82" }, AP), PINK);
      stickIn(tKo - 0.02, A1[0].at(0).x, A1[0].at(0).y);

      const board = $("r4-board");
      I(board, { x: 0, opacity: 1 });
      const tW = q(DUR - 0.25);
      [[0.62, 7], [0.3, 15], [0, 22]].forEach(([o, dx], k) => tl.set(board, { opacity: o, x: dx }, tW + k / FPS));

      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["r4"] = tl;
    })();

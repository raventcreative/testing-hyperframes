<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #m-xf { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 960px; }
    #m-clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #m-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="mascot" data-width="1080" data-height="1920">
    <div id="m-xf" data-layout-ignore data-layout-allow-occlusion><div id="m-clip" data-layout-ignore data-layout-allow-occlusion><canvas id="m-canvas" width="1080" height="1920" data-layout-ignore data-layout-allow-occlusion></canvas></div></div>
  </div>
  <script>
    (function () {
      // =====================================================================================
      // 3D MASCOT (HIDDEN MARKS — suit mascot) (source: tools/mascot_src.html -> tools/gen_mascot.py).
      // The user's rigged GLB (19 joints, 0 morph targets) rendered live in one WebGL canvas.
      // Framing per scene = a real camera change (setView: feet px, figure px, yaw/pitch), never a CSS
      // upscale of a rendered bitmap. Wrapper #m-xf / #m-clip carry the per-effect compositing (clip to a
      // frame, phone screen, avatar circle, paper outline ...). All of it lives on a private timeline `vt`
      // that is seeked with the frame time inside the hf-seek handler -> deterministic, order-independent.
      // Acting: key poses on measured VO words -> damped springs; lip sync = CTC phones x VO energy
      // (low-passed, never ahead of the voice). Blinks: shader eyelids (skin lid + lash line), seeded schedule.
      // =====================================================================================
      const M3 = window.Mascot3D;
      const { buildPerformance, buildLipTrack, syllableAccents, vnoise, bump, osc } = M3;
      const VW = window.VO_WORDS, D = 29.3667;
      const w = (i) => VW[i][1], we = (i) => VW[i][2];
      const canvas = document.getElementById("m-canvas");
      const mouthAt = buildLipTrack(window.VO_PHONES, window.VO_ENV, D);
      const ACC = syllableAccents(window.VO_ENV, VW, window.VO_PHONES, D);
      const one = (x) => Math.max(0, Math.min(1, x));
      const sm = (u) => { u = one(u); return u * u * u * (u * (u * 6 - 15) + 10); };
      const H = (rx, ry, rz) => [rx, ry, rz];
      const add = (...ds) => { const o = {}; for (const d of ds) for (const [k, v] of Object.entries(d || {})) { const a = o[k] || [0, 0, 0]; o[k] = [a[0] + v[0], a[1] + v[1], a[2] + v[2]]; } return o; };
      function accents(t) {
        let n = 0;
        for (const a of ACC) { const d = t - a[0]; if (d > -0.25 && d < 0.35) n += bump(t, a[0] + 0.05, 0.17) * a[1]; }
        return Math.min(1.3, n);
      }
      function idle(t, seed) {
        return {
          chest: [0.012 * Math.sin(t * 2 * Math.PI * 0.27), 0, 0],
          spine: [0, 0.03 * vnoise(t, seed + 1, 0.3), 0.022 * vnoise(t, seed + 2, 0.27)],
          head: [0.02 * vnoise(t, seed + 3, 0.4), 0.05 * vnoise(t, seed + 4, 0.31), 0.03 * vnoise(t, seed + 5, 0.36)],
          forearm_L: [0.04 * vnoise(t, seed + 6, 0.45), 0, 0], forearm_R: [0.04 * vnoise(t, seed + 7, 0.42), 0, 0],
        };
      }

      // ---------------------------------------------------------------- per-scene framing / compositing track
      const V = { fx: 540, fy: 2050, h: 1700, yaw: 0, pitch: 5, vis: 1, rx: 0, rz: 0, ry: 0, ty: 0 };
      const vt = gsap.timeline({ paused: true });
      const RESET = {"V": {"fx": 540, "fy": 1800, "h": 1470, "yaw": 0, "pitch": 5, "vis": 1, "rx": 0, "rz": 0, "ry": 0, "ty": 0}, "X": {"x": 0, "y": 0, "scale": 1, "rotation": 0, "rotationX": 0, "rotationY": 0, "opacity": 1, "transformPerspective": 1400, "filter": "drop-shadow(0px 0px 0px rgba(0,208,254,0))", "transformOrigin": "540px 960px"}, "C": {"clipPath": "inset(-400px -400px -400px -400px round 0px)"}};
      // ---- s01 ROOM HOOK (0.0-2.7)
      vt.set(V, RESET.V, 0); vt.set("#m-xf", RESET.X, 0); vt.set("#m-clip", RESET.C, 0);
      vt.set(V, {"fx": 330, "fy": 1700, "h": 930, "yaw": 0, "pitch": 5}, 0);
      vt.fromTo(V, {"fx": 330, "fy": 1700, "h": 930, "yaw": 0, "pitch": 5}, {"fx": 330, "fy": 1800, "h": 1080, "yaw": 0, "pitch": 5, "duration": 0.85, "ease": "power2.out", "immediateRender": false}, 0);
      // ---- s02 LAPTOP > GOOGLE (2.7-6.5)
      vt.set(V, RESET.V, 2.7); vt.set("#m-xf", RESET.X, 2.7); vt.set("#m-clip", RESET.C, 2.7);
      vt.set(V, {"fx": 330, "fy": 1800, "h": 1080, "yaw": 0, "pitch": 5}, 2.7);
      vt.fromTo(V, {"fx": 330, "fy": 1800, "h": 1080, "yaw": 0, "pitch": 5}, {"fx": -380, "fy": 3100, "h": 2700, "yaw": 0, "pitch": 5, "duration": 0.62, "ease": "power2.in", "immediateRender": false}, 2.7);
      vt.fromTo(V, {"fx": -380, "fy": 3100, "h": 2700, "yaw": 0, "pitch": 5}, {"fx": -380, "fy": 3100, "h": 2700, "yaw": 0, "pitch": 5, "vis": 0, "duration": 0.04, "ease": "none", "immediateRender": false}, 3.32);
      // ---- s03 CLICK > CLAUDE (6.5-7.5)
      vt.set(V, RESET.V, 6.5); vt.set("#m-xf", RESET.X, 6.5); vt.set("#m-clip", RESET.C, 6.5);
      vt.set(V, {"fx": -600, "fy": 3000, "h": 1000, "yaw": 0, "pitch": 5, "vis": 0}, 6.5);
      // ---- s04 CLAUDE CODE PROMPT (7.5-13.0667)
      vt.set(V, RESET.V, 7.5); vt.set("#m-xf", RESET.X, 7.5); vt.set("#m-clip", RESET.C, 7.5);
      vt.set(V, {"fx": -600, "fy": 3000, "h": 1000, "yaw": 0, "pitch": 5, "vis": 0}, 7.5);
      // ---- s05 POCKET UNIVERSE (13.0667-18.1)
      vt.set(V, RESET.V, 13.067); vt.set("#m-xf", RESET.X, 13.067); vt.set("#m-clip", RESET.C, 13.067);
      vt.set(V, {"fx": -600, "fy": 3000, "h": 1000, "yaw": 0, "pitch": 5, "vis": 0}, 13.067);
      // ---- s06 MASCOT + PIP (18.1-25.9667)
      vt.set(V, RESET.V, 18.1); vt.set("#m-xf", RESET.X, 18.1); vt.set("#m-clip", RESET.C, 18.1);
      vt.set(V, {"fx": 540, "fy": 3400, "h": 1300, "yaw": 0, "pitch": 4, "vis": 1}, 18.1);
      vt.fromTo(V, {"fx": 540, "fy": 3400, "h": 1300, "yaw": 0, "pitch": 4, "vis": 1}, {"fx": 540, "fy": 3400, "h": 1300, "yaw": 0, "pitch": 4, "vis": 1, "duration": 0.25, "ease": "none", "immediateRender": false}, 18.1);
      vt.fromTo(V, {"fx": 540, "fy": 3400, "h": 1300, "yaw": 0, "pitch": 4, "vis": 1}, {"fx": 540, "fy": 2060, "h": 1300, "yaw": 0, "pitch": 4, "vis": 1, "duration": 0.65, "ease": "power3.out", "immediateRender": false}, 18.35);
      // ---- s07 FINISH (25.9667-29.3667)
      vt.set(V, RESET.V, 25.967); vt.set("#m-xf", RESET.X, 25.967); vt.set("#m-clip", RESET.C, 25.967);
      vt.set(V, {"fx": 540, "fy": 2060, "h": 1300, "yaw": 0, "pitch": 4}, 25.967);
      vt.fromTo(V, {"fx": 540, "fy": 2060, "h": 1300, "yaw": 0, "pitch": 4}, {"fx": 330, "fy": 1800, "h": 1080, "yaw": 0, "pitch": 5, "duration": 0.9, "ease": "power3.inOut", "immediateRender": false}, 25.967);
      vt.set({}, {}, D);
      vt.shiftChildren(0.01);   // nothing sits at exactly 0, so a forward replay from 0 always applies the frame-zero sets

      // ---------------------------------------------------------------- acting (one continuous performance)
      const DIR = M3.direct(VW, D, { intents: [{"t": 0.96, "action": "present", "side": "right"}, {"t": 1.78, "action": "emphasize", "side": "left"}, {"t": 18.34, "action": "explain", "side": "left"}, {"t": 20.0, "action": "question"}, {"t": 21.48, "action": "pointFwd", "side": "right"}, {"t": 23.02, "action": "emphasize", "side": "left"}, {"t": 24.32, "action": "present", "side": "right"}, {"t": 24.94, "action": "emphasize", "side": "left"}, {"t": 26.26, "action": "question"}, {"t": 27.6, "action": "cta", "side": "right"}], seed: 3, quiet: 0.3 });
      const PERF0 = buildPerformance(DIR.tracks, D + 0.05);
      const PERF = (t) => PERF0(t);
      const WALK = [0.0, 0.85, 2, 0.3];
      const EXTRA = (t) => M3.walk(t, WALK[0], WALK[1], WALK[2], WALK[3]).bones;
      const BOB = (t) => M3.walk(t, WALK[0], WALK[1], WALK[2], WALK[3]).bob;


      let mascot = null;
      // continuity between scenes: for CUT_BLEND s after each cut the camera view glides from where the previous scene
      // left the mascot to where the new scene wants him (no position jump at the cut)
      const CUTS = [2.7, 6.5, 7.5, 13.067, 18.1, 25.967], CUT_BLEND = 0.5;
      const VKEYS = ["fx", "fy", "h", "yaw", "pitch"];
      function apply(t) {
        let blendFrom = null, bw = 0;
        for (let i = CUTS.length - 1; i >= 0; i--) {
          const c = CUTS[i];
          if (t >= c && t < c + CUT_BLEND) {
            vt.seek(0, false); vt.seek(c - 0.002 + 0.01, false);
            blendFrom = {}; for (const k of VKEYS) blendFrom[k] = V[k];
            bw = 1 - sm((t - c) / CUT_BLEND);
            break;
          }
          if (t >= c) break;
        }
        vt.seek(0, false); vt.seek(t + 0.01, false);   // always replay forward: chained tweens resolve in time order whatever the seek history
        if (blendFrom && V.vis > 0.001) for (const k of VKEYS) V[k] = V[k] + (blendFrom[k] - V[k]) * bw;
        if (V.vis <= 0.001) { canvas.style.visibility = "hidden"; return; }
        canvas.style.visibility = "visible";
        const Pf = PERF(t);
        const acc = accents(t);
        const still = 1 - sm((t - (D - 0.55)) / 0.4);
        const id = M3.micro(t, 17, vnoise); for (const k in id) id[k] = id[k].map((x) => x * still);
        const bones = add(Pf.bones, id, EXTRA(t), { head: [0.03 * acc * still, 0, 0], neck: [0.012 * acc * still, 0, 0] });
        const root = { x: Pf.root.x, y: Pf.root.y + V.ty + (typeof BOB === "function" ? BOB(t) : 0), ry: Pf.root.ry + V.ry + 0.012 * vnoise(t, 26, 0.18) * still, rz: Pf.root.rz + V.rz, rx: V.rx, s: Pf.root.s };
        mascot.setView({ fx: V.fx, fy: V.fy, h: V.h, yaw: V.yaw, pitch: V.pitch });
        const bl = M3.blink(t, 0, D, 3, DIR.blinks);
        mascot.setState({ root, bones, face: { blink: [bl, bl], gaze: DIR.gaze(t), mouthMix: 1, mouth: mouthAt(t) } });
        mascot.render();
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const FACE = {"eyeA": {"c": [-0.091, 0.596], "r": [0.041, 0.034], "n": 757, "J": [0.4997633976754324, 0.3065330127591157, 0.314518943050391, -0.453702164567319], "uv0": [0.6328573151105054, 0.6167170084324972], "maxErr": 0.003818576762005663}, "eyeB": {"c": [0.091, 0.596], "r": [0.041, 0.034], "n": 753, "J": [0.5500133280433187, -0.06824460818744192, -0.09499495020823343, -0.5077214816509605], "uv0": [0.12402271349668496, 0.8611807690751265], "maxErr": 0.0028305745008792753}, "browA": {"c": [-0.09, 0.68], "n": 510, "J": [0.43108254869646895, 0.4376875904621281, 0.3523513551101368, -0.4754305212249294], "uv0": [0.6629852372177631, 0.5810053999225538], "maxErr": 0.004289199391581338}, "browB": {"c": [0.09, 0.68], "n": 362, "J": [0.5552915360962205, 0.08489039751259354, 0.1020935044591921, -0.6884358006120392], "uv0": [0.8350086373766634, 0.9448922678325264], "maxErr": 0.0020738571975070096}, "mouth": {"c": [0, 0.548], "r": [0.026, 0.016]}, "skin": [252, 240, 232], "skinEye": [252, 244, 234], "coverNormal": 0, "lidLit": [0.992, 0.975, 0.968], "mouthDy": 0.0, "faceSmooth": 1.0, "headC": [0, 0.7, -0.02]};
      const ready = M3.Mascot.create(canvas, { url: "assets/mascot3d/mascot_jas3_rigged.glb", face: FACE, decals: [{"url": "assets/mascot3d/logo_decal.png", "bone": "chest", "box": [-0.098, -0.026, 0.37211, 0.37989], "zgrid": [[0.08087, 0.08404, 0.08699, 0.08956, 0.09213, 0.09443, 0.09632, 0.09816, 0.09999, 0.10171, 0.103, 0.10434, 0.10568, 0.10699, 0.10813, 0.10911, 0.11001, 0.1109, 0.11179, 0.1125, 0.11305, 0.1136, 0.11403, 0.11428], [0.08051, 0.08349, 0.08659, 0.08969, 0.09209, 0.09435, 0.09643, 0.09842, 0.10026, 0.10176, 0.10328, 0.10472, 0.10605, 0.10738, 0.10843, 0.10947, 0.11041, 0.11129, 0.1123, 0.11285, 0.11339, 0.11394, 0.11442, 0.11483], [0.07996, 0.08326, 0.08624, 0.08922, 0.092, 0.09428, 0.09649, 0.09844, 0.10028, 0.10181, 0.10332, 0.10483, 0.10611, 0.10765, 0.10871, 0.10976, 0.11082, 0.11176, 0.11251, 0.11319, 0.11383, 0.11437, 0.11481, 0.11523], [0.07929, 0.08271, 0.08569, 0.08898, 0.09192, 0.09424, 0.09648, 0.09854, 0.1003, 0.10209, 0.10361, 0.10511, 0.10649, 0.10764, 0.10873, 0.11003, 0.11109, 0.11208, 0.11279, 0.11353, 0.11417, 0.11471, 0.11527, 0.11563], [0.07862, 0.08215, 0.08546, 0.08844, 0.09175, 0.09407, 0.0963, 0.09856, 0.10031, 0.10213, 0.10365, 0.10511, 0.10676, 0.10791, 0.10901, 0.11005, 0.11108, 0.11229, 0.11308, 0.11376, 0.1145, 0.11506, 0.11561, 0.11614]], "offset": 0.0012}], width: 1080, height: 1920, envIntensity: 0.55 })
        .then((m) => {
          mascot = m;
          // pale studio lighting (brand plate is cool white): soft key upper-left (renderer default), cool-white rim behind-right
          for (const o of m.scene.children) {
            if (!o.isDirectionalLight) continue;
            if (o.position.z < 0) { o.intensity = 1.5; o.color.setRGB(0.86, 0.92, 1.0); o.position.set(1.5, 1.4, -1.5); }
          }
          apply(0);
        });
      window.__hf.buildReady["mascot"] = ready;
      window.addEventListener("hf-seek", (e) => {
        const t = e.detail.time;
        if (mascot) apply(t);
        else if (e.detail.waitUntil) e.detail.waitUntil(ready.then(() => apply(t)));
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, D - 0.02);
      window.__timelines["mascot"] = tl;
    })();
  </script>
</template>

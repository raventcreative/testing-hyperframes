<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    /* everything lives inside the stage screen (x 130–950, y 450–1430) */
    #r1-clip { position: absolute; left: 130px; top: 450px; width: 820px; height: 980px; overflow: hidden; border-radius: 34px; }
    /* the stack container's origin = the world anchor (front-bottom-left of the first brick, on top of the chart board) */
    #r1-stack { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; filter: drop-shadow(0 6px 5px rgba(52,36,12,.34)); }
    .r1-b { position: absolute; transform-origin: 50% 100%; opacity: 0; }
    .r1-b svg { position: absolute; left: 0; top: 0; overflow: visible; }
    #r1-klik { position: absolute; left: 0; top: 0; width: 200px; height: 120px; margin: -60px 0 0 -100px; opacity: 0; transform-origin: 50% 50%; }
    #r1-klik svg { position: absolute; left: 0; top: 0; overflow: visible; }
    #r1-klik text { font: 700 38px Poppins, sans-serif; letter-spacing: -0.01em; }
  </style>
  <div id="root" data-composition-id="r1" data-width="1080" data-height="1920">
    <div id="r1-clip"><div id="r1-stack"></div></div>
  </div>
  <script>
    (function () {
      // r1 LEGO — "Satu, gaya Lego, kayak mainan yang hidup."
      // A tiny brick build sits ON TOP of the stage's chart board (world-anchored: the anchor is projected through the stage
      // camera every frame, so the stack rides the camera drift like a real object in the set). Stop motion at 12 fps:
      // brick-click stinger (sweep end) -> three bricks snap-stack, one per click · "mainan" -> a white mini-robot brick drops
      // on top, eyes shut · "hidup." -> its eyes pop open, it hops, "klik!" · it un-builds in two frames before the round ends.
      const R = window.ROUNDS[0], NX = window.ROUNDS[1], ST = R.start, DUR = R.dur;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const word = (txt) => { const w = window.VO_WORDS.find((x) => x[0] === txt && x[1] >= ST); return w ? w[1] : null; };

      // ---------------------------------------------------------------- the stage camera (same model as stage.html; the live one when registered)
      const one = (x) => Math.max(0, Math.min(1, x)), Lr = (a, b, u) => a + (b - a) * u;
      const hsh = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      const vn = (t, seed, f) => { const x = t * f + seed * 17.13, i = Math.floor(x), u = x - i, w = u * u * (3 - 2 * u); return Lr(hsh(i + seed * 31), hsh(i + 1 + seed * 31), w) * 2 - 1; };
      const CA = { yaw: 8, pitch: 11, dist: 4.3, ty: 0.72 }, CB = { yaw: 19, pitch: 9, dist: 3.95, ty: 0.7 };
      const camLocal = (t) => { const u = 0.5 - 0.5 * Math.cos(Math.PI * one((t - R.sweep[1]) / (NX.sweep[0] - R.sweep[1])));
        return { yaw: Lr(CA.yaw, CB.yaw, u) + 0.6 * vn(t, 3, 0.35), pitch: Lr(CA.pitch, CB.pitch, u) + 0.35 * vn(t, 4, 0.3), dist: Lr(CA.dist, CB.dist, u), ty: Lr(CA.ty, CB.ty, u), tx: 0, roll: 0 }; };
      const camAt = (t) => (window.__STAGE && window.__STAGE.camAt ? window.__STAGE.camAt(t) : camLocal(t));
      // world point -> stage-local px (fov 27, 820×980), plus camera depth
      function proj(c, p) {
        const r = Math.PI / 180, a = c.yaw * r, pi = c.pitch * r, T = [c.tx || 0, c.ty == null ? 0.8 : c.ty, 0];
        const cp = [T[0] + Math.sin(a) * Math.cos(pi) * c.dist, T[1] + Math.sin(pi) * c.dist, T[2] + Math.cos(a) * Math.cos(pi) * c.dist];
        const nz = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
        const cr = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
        const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
        const Z = nz([cp[0] - T[0], cp[1] - T[1], cp[2] - T[2]]), X = nz(cr([0, 1, 0], Z)), Y = cr(Z, X);
        const ro = (c.roll || 0) * r, X2 = X.map((x, i) => Math.cos(ro) * x + Math.sin(ro) * Y[i]), Y2 = Y.map((y, i) => -Math.sin(ro) * X[i] + Math.cos(ro) * y);
        const d = [p[0] - cp[0], p[1] - cp[1], p[2] - cp[2]], xc = dot(d, X2), yc = dot(d, Y2), zc = -dot(d, Z);
        const f = 1 / Math.tan(13.5 * r);
        return [((f * 980 / 820) * xc / zc + 1) * 410, (1 - f * yc / zc) * 490, zc];
      }

      // ---------------------------------------------------------------- the bricks (true proportions: pitch S, height 1.2 S, studs Ø0.6 S)
      const S = 0.088, BH = 1.2 * S, SR = 0.3 * S, SH = 0.2125 * S;
      const Y0 = 0.995, ZB = -0.94, ZF = ZB + 2 * S, X0 = -1.06;          // on top of the desk monitor (set.js: top 0.99, x -1.22…-0.70, z -0.86)
      const ANCH = [X0, Y0, ZF];
      const cRef = camAt(8.2), aRef = proj(cRef, ANCH);
      const P2 = (p) => { const q = proj(cRef, p); return [q[0] - aRef[0], q[1] - aRef[1]]; };
      const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      const mix = (h, k) => { const c = rgb(h), t = k > 0 ? 255 : 0, a = Math.abs(k); return `rgb(${c.map((v) => Math.round(v + (t - v) * a)).join(",")})`; };
      const pts = (a, ox, oy) => a.map((p) => `${(p[0] - ox).toFixed(1)},${(p[1] - oy).toFixed(1)}`).join(" ");
      function hull(P) {
        const p = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]), cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
        const lo = [], up = [];
        for (const q of p) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
        for (const q of p.reverse()) { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
        return lo.slice(0, -1).concat(up.slice(0, -1));
      }
      // [key, x (studs), layer, width (studs), colour]
      const BR = [["a", 0, 0, 4, "#cc1d10"], ["b", 0, 1, 2, "#f4c21a"], ["c", 2, 1, 2, "#0b5cbf"], ["d", 1, 2, 2, "#f1f3f6"]];
      const stack = $("r1-stack"), EL = {}, GEO = {};
      BR.forEach(([k, bx, ly, w, col]) => {
        const x0 = X0 + bx * S, x1 = x0 + w * S, y0 = Y0 + ly * BH, y1 = y0 + BH;
        const F = [[x0, y0, ZF], [x1, y0, ZF], [x1, y1, ZF], [x0, y1, ZF]].map(P2);
        const Rt = [[x1, y0, ZF], [x1, y0, ZB], [x1, y1, ZB], [x1, y1, ZF]].map(P2);
        const Tp = [[x0, y1, ZF], [x1, y1, ZF], [x1, y1, ZB], [x0, y1, ZB]].map(P2);
        const studs = [];
        for (let j = 0; j < 2; j++) for (let i = 0; i < w; i++) {
          const cx = x0 + (i + 0.5) * S, cz = ZB + (j + 0.5) * S, lo = [], hi = [];
          for (let q = 0; q < 28; q++) { const an = (q / 28) * Math.PI * 2; lo.push(P2([cx + SR * Math.cos(an), y1, cz + SR * Math.sin(an)])); hi.push(P2([cx + SR * Math.cos(an), y1 + SH, cz + SR * Math.sin(an)])); }
          studs.push({ side: hull(lo.concat(hi)), top: hi });
        }
        const all = F.concat(Rt, Tp, ...studs.map((s) => s.top));
        const pad = 4, mnx = Math.min(...all.map((p) => p[0])) - pad, mny = Math.min(...all.map((p) => p[1])) - pad;
        const mxx = Math.max(...all.map((p) => p[0])) + pad, mxy = Math.max(...F.map((p) => p[1])) + pad;
        const id = "r1-" + k, edge = mix(col, -0.48);
        let s = `<defs><linearGradient id="${id}-gf" x1="0" y1="0" x2="0.18" y2="1"><stop offset="0" stop-color="${mix(col, 0.16)}"/><stop offset=".55" stop-color="${col}"/><stop offset="1" stop-color="${mix(col, -0.1)}"/></linearGradient>
          <linearGradient id="${id}-gs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${mix(col, 0.2)}"/><stop offset=".45" stop-color="${col}"/><stop offset="1" stop-color="${mix(col, -0.32)}"/></linearGradient></defs>`;
        s += `<polygon points="${pts(Rt, mnx, mny)}" fill="${mix(col, -0.3)}" stroke="${edge}" stroke-width="1" stroke-linejoin="round" stroke-opacity=".55"/>`;
        s += `<polygon points="${pts(F, mnx, mny)}" fill="url(#${id}-gf)" stroke="${edge}" stroke-width="1" stroke-linejoin="round" stroke-opacity=".55"/>`;
        s += `<polygon points="${pts(Tp, mnx, mny)}" fill="${mix(col, 0.28)}" stroke="${edge}" stroke-width="1" stroke-linejoin="round" stroke-opacity=".45"/>`;
        // glossy ABS: a soft specular streak across the front face + a bright bevel on the top edges
        const fw = F[1][0] - F[0][0], fh = F[0][1] - F[3][1];
        const sp = [[F[3][0] + fw * 0.06, F[3][1] + fh * 0.16], [F[3][0] + fw * 0.6, F[3][1] + fh * 0.16], [F[3][0] + fw * 0.5, F[3][1] + fh * 0.34], [F[3][0] + fw * 0.06, F[3][1] + fh * 0.34]];
        s += `<polygon points="${pts(sp, mnx, mny)}" fill="#ffffff" opacity="${k === "d" ? 0.5 : 0.2}"/>`;
        s += `<polyline points="${pts([F[3], F[2], Rt[2]], mnx, mny)}" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity=".7" stroke-linejoin="round"/>`;
        studs.forEach((st) => {
          s += `<polygon points="${pts(st.side, mnx, mny)}" fill="url(#${id}-gs)" stroke="${edge}" stroke-width=".9" stroke-opacity=".5"/>`;
          s += `<polygon points="${pts(st.top, mnx, mny)}" fill="${mix(col, 0.32)}"/>`;
          const c0 = st.top.reduce((a, p) => [a[0] + p[0] / st.top.length, a[1] + p[1] / st.top.length], [0, 0]);
          s += `<ellipse cx="${(c0[0] - mnx - 3).toFixed(1)}" cy="${(c0[1] - mny - 0.6).toFixed(1)}" rx="3.2" ry="1.2" fill="#ffffff" opacity=".75"/>`;
        });
        if (k === "d") {
          // the mini AI PRENEUR robot printed on the front face: dark visor, sleepy eyes -> open glowing eyes
          const e = [F[0][0] - mnx, F[0][1] - mny], ua = [F[1][0] - F[0][0], F[1][1] - F[0][1]], va = [F[3][0] - F[0][0], F[3][1] - F[0][1]];
          s += `<g transform="matrix(${ua[0].toFixed(3)},${ua[1].toFixed(3)},${va[0].toFixed(3)},${va[1].toFixed(3)},${e[0].toFixed(2)},${e[1].toFixed(2)})">
            <rect x=".13" y=".16" width=".74" height=".68" rx=".1" ry=".17" fill="#0a1030"/>
            <rect x=".17" y=".62" width=".42" height=".1" rx=".05" ry=".05" fill="#ffffff" opacity=".22"/>
            <g id="r1-shut"><path d="M.29 .46 Q.36 .41 .43 .46 M.57 .46 Q.64 .41 .71 .46" fill="none" stroke="#dff8ff" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>
            <g id="r1-open" opacity="0"><ellipse cx=".36" cy=".48" rx=".1" ry=".26" fill="#01ccf7" opacity=".35"/><ellipse cx=".64" cy=".48" rx=".1" ry=".26" fill="#01ccf7" opacity=".35"/>
              <ellipse cx=".36" cy=".48" rx=".062" ry=".17" fill="#c8f6ff"/><ellipse cx=".64" cy=".48" rx=".062" ry=".17" fill="#c8f6ff"/></g></g>`;
        }
        // snap ticks at the two bottom corners (white with a navy keyline so they read on the wall)
        const tk = (p, dir) => { const a0 = dir < 0 ? Math.PI : 0; let o = "";
          [-0.55, 0, 0.55].forEach((da) => { const an = a0 + dir * da, c = Math.cos(an), sn = Math.sin(an);
            const p1 = [p[0] - mnx + c * 7, p[1] - mny + sn * 7], p2 = [p[0] - mnx + c * 17, p[1] - mny + sn * 17];
            o += `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}"/>`; });
          return o; };
        const ticks = tk([F[0][0] - 1, F[0][1] - 2], -1) + tk([Rt[1][0] + 1, (Rt[1][1] + F[1][1]) / 2 - 2], 1);
        s += `<g id="${id}-tk" opacity="0" stroke-linecap="round"><g stroke="#0b1440" stroke-width="6" stroke-opacity=".55">${ticks}</g><g stroke="#ffffff" stroke-width="3">${ticks}</g></g>`;
        const el = document.createElement("div"); el.className = "r1-b"; el.id = id;
        el.style.left = mnx.toFixed(1) + "px"; el.style.top = mny.toFixed(1) + "px"; el.style.width = (mxx - mnx).toFixed(1) + "px"; el.style.height = (mxy - mny).toFixed(1) + "px";
        el.innerHTML = `<svg width="${(mxx - mnx).toFixed(1)}" height="${(mxy - mny).toFixed(1)}">${s}</svg>`;
        stack.appendChild(el); EL[k] = el; GEO[k] = { F, mnx, mny };
      });
      // "klik!" burst, popping off the mini-robot brick's top-right corner (over the window, away from the robot)
      const kl = document.createElement("div"); kl.id = "r1-klik";
      const dTR = GEO.d.F[2]; kl.style.left = (dTR[0] + 4).toFixed(1) + "px"; kl.style.top = (dTR[1] - 6).toFixed(1) + "px";
      const rays = [[-92, 6, 24], [-52, 8, 28], [-12, 6, 24]].map(([a, r0, r1]) => { const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180);
        return `<line x1="${(100 + c * r0).toFixed(1)}" y1="${(60 + s * r0).toFixed(1)}" x2="${(100 + c * r1).toFixed(1)}" y2="${(60 + s * r1).toFixed(1)}"/>`; }).join("");
      kl.innerHTML = `<svg width="200" height="120"><g stroke-linecap="round"><g stroke="#0b1440" stroke-width="8" stroke-opacity=".6">${rays}</g><g stroke="#ffffff" stroke-width="4">${rays}</g></g>
        <text x="124" y="44" transform="rotate(-10 124 30)" fill="#ffffff" stroke="#0b1440" stroke-width="8" stroke-linejoin="round" paint-order="stroke">klik!</text></svg>`;
      kl.style.transformOrigin = "100px 60px";
      stack.appendChild(kl);

      // ---------------------------------------------------------------- timing (global 12 fps steps, like the stage's stop-motion pose)
      const kOf = (g) => Math.ceil(g * 12 - 1e-6), tk = (k) => k / 12 - ST - 0.004;
      const k0 = kOf(R.sweep[1]);                    // first step after the sweep lands (7.333): the click stinger
      const kM = kOf(word("mainan") - 0.02);         // "mainan"
      const kH = kOf(word("hidup.") - 0.02);         // "hidup."
      const kEnd = kOf(ST + DUR) - 1;                // last step inside the round
      // camera tracking: the anchor re-projected every 30 fps frame, scaled by depth (only while visible)
      const f0 = Math.round((k0 / 12) * 30), f1 = Math.round((ST + DUR) * 30);
      I(stack, { x: aRef[0], y: aRef[1], scale: 1 });
      for (let f = f0; f < f1; f++) {
        const g = f / 30, c = camAt(g), a = proj(c, ANCH);
        tl.set(stack, { x: +a[0].toFixed(2), y: +a[1].toFixed(2), scale: +(aRef[2] / a[2]).toFixed(4) }, Math.max(0, g - ST - 0.004));
      }
      const B = (k) => EL[k], TK = (k) => $("r1-" + k + "-tk");
      ["a", "b", "c", "d"].forEach((k) => I(B(k), { opacity: 0, y: 0, rotation: 0 }));
      ["a", "b", "c", "d"].forEach((k) => I(TK(k), { opacity: 0 }));
      I($("r1-open"), { opacity: 0 }); I($("r1-shut"), { opacity: 1 }); I(kl, { opacity: 0, scale: 0.6 });
      // snap: hover one step just above the seat (tilted), then click home + ticks
      const snap = (k, kk, rot) => {
        tl.set(B(k), { opacity: 1, y: -15, rotation: rot }, tk(kk - 1));
        tl.set(B(k), { y: 0, rotation: 0 }, tk(kk));
        tl.set(TK(k), { opacity: 1, scale: 1 }, tk(kk)); tl.set(TK(k), { opacity: 0.4 }, tk(kk + 1)); tl.set(TK(k), { opacity: 0 }, tk(kk + 2));
      };
      // brick-click stinger: A pops home on the first step, B and C follow one step each (one per click)
      tl.set(B("a"), { opacity: 1, y: 0 }, tk(k0)); tl.set(TK("a"), { opacity: 1 }, tk(k0)); tl.set(TK("a"), { opacity: 0.4 }, tk(k0 + 1)); tl.set(TK("a"), { opacity: 0 }, tk(k0 + 2));
      snap("b", k0 + 1, 7); snap("c", k0 + 2, -6);
      // "mainan": the mini-robot brick falls in (two airborne steps), sleepy
      tl.set(B("d"), { opacity: 1, y: -46, rotation: -10 }, tk(kM - 1));
      tl.set(B("d"), { y: -16, rotation: 5 }, tk(kM));
      tl.set(B("d"), { y: 0, rotation: 0 }, tk(kM + 1));
      tl.set(TK("d"), { opacity: 1 }, tk(kM + 1)); tl.set(TK("d"), { opacity: 0.4 }, tk(kM + 2)); tl.set(TK("d"), { opacity: 0 }, tk(kM + 3));
      tl.set(B("d"), { y: -4 }, tk(kM + 2)); tl.set(B("d"), { y: 0 }, tk(kM + 3));
      // "hidup.": eyes pop open, a happy hop, "klik!"
      tl.set($("r1-shut"), { opacity: 0 }, tk(kH)); tl.set($("r1-open"), { opacity: 1 }, tk(kH));
      tl.set(B("d"), { y: -18, rotation: -4 }, tk(kH)); tl.set(B("d"), { y: -22, rotation: 5 }, tk(kH + 1)); tl.set(B("d"), { y: 0, rotation: 0 }, tk(kH + 2));
      tl.set(kl, { opacity: 1, scale: 0.78, rotation: -4 }, tk(kH)); tl.set(kl, { scale: 1.08, rotation: 2 }, tk(kH + 1)); tl.set(kl, { scale: 1, rotation: 0 }, tk(kH + 2));
      // un-build (stop motion, no fades): the mini robot and the burst pop off, the others jump, then all gone before the round ends
      tl.set(kl, { opacity: 0 }, tk(kEnd - 1)); tl.set(B("d"), { opacity: 0 }, tk(kEnd - 1));
      tl.set(B("c"), { y: -12, rotation: 7 }, tk(kEnd - 1)); tl.set(B("b"), { y: -9, rotation: -6 }, tk(kEnd - 1));
      ["a", "b", "c"].forEach((k) => tl.set(B(k), { opacity: 0 }, tk(kEnd)));

      tl.set({}, {}, DUR - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["r1"] = tl;
    })();
  </script>
</template>

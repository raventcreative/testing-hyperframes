  <script>
    (function () {
      const D = 1.8333;

      const $ = (id) => root.querySelector("#" + id);
      const tl = gsap.timeline({ paused: true });
      // runtime guard (lead): never let the `scale` shorthand reach GSAP — it can leave scaleY stale depending on seek order
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const mk = (cls, css) => { const e = document.createElement("div"); e.className = "s04-abs " + cls; e.style.cssText = css; $("s04-fx").appendChild(e); return e; };

      const APEX = 0.33, W1 = 1.03, W2 = 1.29;
      const rig = $("s04-rig"), far = $("s04-far"), mid = $("s04-mid"), near = $("s04-near"), nw = $("s04-nw"), pill = $("s04-pill");
      const C = 1369.73, F0 = 0.0, F1 = 0.25;   // progress ring: this round's quarter
      const XS = D - 0.41;                       // exit wind-up starts here

      // ---------------- ENTRY: out of s03's zoom-through into the laptop — zoom-out from big + blur, lands on "Pertama"
      tl.set(rig, { scaleX: 2.6, scaleY: 2.6, opacity: 0.4, filter: "blur(14px)" }, 0);
      ft(rig, { scaleX: 2.6, scaleY: 2.6 }, { scaleX: 1, scaleY: 1, duration: 0.42, ease: "expo.out" }, 0);
      ft(rig, { opacity: 0.4 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 0);
      ft(rig, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 0);
      tl.set(rig, { filter: "none" }, 0.31);
      // depth: the near discs rush past faster than the hero
      ft(near, { scaleX: 2.2, scaleY: 2.2 }, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "expo.out" }, 0);

      // converging speed lines sell the zoom-out (wrappers carry the static angle; GSAP only moves the inner line)
      for (let k = 0; k < 18; k++) {
        const a = k * 20 + (k % 3) * 6 - 6;
        const w = mk("s04-spk", "transform: rotate(" + a + "deg);");
        const l = document.createElement("div"); l.className = "s04-spl"; w.appendChild(l);
        const r0 = 760 + (k % 4) * 70, r1 = 230 + (k % 3) * 30, d0 = (k % 5) * 0.012;
        tl.set(l, { x: r0, opacity: 0 }, 0);
        ft(l, { x: r0, opacity: 0.9 }, { x: r1, opacity: 0, duration: 0.34, ease: "power2.out" }, d0);
      }

      // ---------------- ROUND-TITLE SYSTEM (identical in s04 / s07 / s10 / s13) ----------------
      // far plane: the light breathes, the near discs drift
      ft($("s04-blob"), { scaleX: 0.92, scaleY: 0.92, opacity: 0.7 }, { scaleX: 1.06, scaleY: 1.06, opacity: 1, duration: D, ease: "sine.inOut" }, 0);

      ft($("s04-dial"), { rotation: -50 }, { rotation: 0, duration: 0.9, ease: "expo.out" }, 0);
      ft($("s04-dial"), { rotation: 0 }, { rotation: 5, duration: D - 0.9, ease: "none" }, 0.9);
      ft($("s04-b1"), { x: 0, y: 0 }, { x: 26, y: -34, duration: D, ease: "sine.inOut" }, 0);

      // APEX (ordinal word): the numeral lifts off the page — its soft duplicate separates — pulse, shock ring, glint

      ft($("s04-shock"), { opacity: 1, attr: { r: 120 } }, { opacity: 0, attr: { r: 320 }, duration: 0.62, ease: "power3.out" }, APEX);
      tl.set(dig, { "--gx": "-320px" }, 0);
      ft(dig, { "--gx": "-320px" }, { "--gx": "480px", duration: 0.55, ease: "power2.inOut" }, APEX - 0.02);

        tl.set(w, { yPercent: 115 }, 0);

  <script>
    (function () {
      // s05 CLAUDE 2 · PENYARING "Claude kedua nyaring: mana yang cocok sama skill aku, bisa dikerjain dari Indonesia, dan yang mencurigakan dibuang."
      // START = s04's end (rail: chip 1 active, 2 + 3 dim · tray with the 6 example listings). · "kedua": chip 1 → done (check), chip 2 → active ·

      // "dibuang.": the 3 rejects fly into the bin ("Dibuang · 3"); the 3 survivors get green checks and line up in the centre.
      // END STATE (t = D): rail: chip 1 done, chip 2 active (ring, spinner, scale 1.05), chip 3 opacity .5 · tray as s04 (same spot), bin
      // "Dibuang · 3" · survivors J0 / J2 / J5 at x 330, y 662 / 744 / 826, green check + green ring on · criteria pills all checked.
      const D = 6.9333, ST = 21.3667, VW = window.VO_WORDS, R4 = window.R4;
      const L = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 0.05); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const tKed = L("kedua"), tNya = L("nyaring:"), tCoc = L("cocok"), tSki = L("skill"), tDik = L("dikerjain"), tIndo = L("Indonesia,"),

      const M = R4.M, J = R4.JOBS;
      const SLX = (k) => (k % 2 ? 558 : 102), SLY = (k) => 662 + Math.floor(k / 2) * 82;

      const CR = [["userCheck", "Cocok sama skill", "profil: React · UI · Inggris"], ["pin", "Bisa dari Indonesia", "tanpa syarat warga negara"],

      // ================================================================ DOM

      h += `<div class="s05-a" id="s05-tr"><div class="s05-a" id="s05-thi">${R4.svg("inbox", 2.2)}</div><div class="s05-a" id="s05-thw"><span class="r4-grad" id="s05-tht">Lowongan remote terkumpul</span>` +
        `<span id="s05-tex">CONTOH</span></div><div class="s05-a" id="s05-more">+ banyak lagi</div></div>`;
      h += `<div class="s05-a" id="s05-scan"></div>`;
      h += J.map((j, k) => `<div class="r4-job" id="s05-j${k}" style="left:${SLX(k)}px;top:${SLY(k)}px;--jc:${j.c};--jt:${j.tc || "#ffffff"}"><div class="jb"></div>` +
        `<i class="s05-gl" id="s05-gl${k}"></i><div class="s05-fl" id="s05-fl${k}"></div><div class="jl">${j.L}</div><b class="jt">${j.t}</b><span class="jm">${j.m}</span>` +
        `<div class="s05-x" id="s05-x${k}">${R4.svg("x", 3)}</div><div class="s05-ok" id="s05-ok${k}">${R4.svg("check", 3.2)}</div></div>`).join("");
      h += `<div class="s05-a" id="s05-warn">${R4.svg("shieldAlert", 2.4)}MENCURIGAKAN</div>`;
      h += `<div class="s05-a" id="s05-bin">${R4.svg("trash", 2.2)}<span id="s05-bn">Dibuang · 0</span></div>`;
      h += R4.rail("s05");
      $("s05-cam").innerHTML = h;
      const cam = $("s05-cam"); I(cam, { x: 0, y: 0 });
      I($("s05-glow"), { opacity: 1 });

      // ================================================================ rail: s04's end → chip 1 done, chip 2 active
      M.forEach((m, i) => {
        I($("s05-c" + i), { opacity: i ? 0.5 : 1, scale: i ? 1 : 1.05, y: 0 }); I($("s05-c" + i + "g"), { opacity: i ? 0 : 1, scale: 1 });
        I($("s05-c" + i + "d"), { opacity: i ? 1 : 0, scale: i ? 1 : 0.4 }); I($("s05-c" + i + "s"), { opacity: i ? 0 : 1, rotation: 0 }); I($("s05-c" + i + "k"), { opacity: 0, scale: 0.4 });
      });
      const a0 = R4.spinAt(ST);
      [0, 1].forEach((i) => ft($("s05-c" + i + "s"), { rotation: a0 }, { rotation: a0 + 420 * D, duration: D, ease: "none" }, 0));
      const tk = tKed - 0.06;
      ft($("s05-c0"), { scale: 1.05 }, { scale: 1, duration: 0.25, ease: "power2.out" }, tk);
      ft($("s05-c0g"), { opacity: 1 }, { opacity: 0, duration: 0.2 }, tk);
      ft($("s05-c0s"), { opacity: 1 }, { opacity: 0, duration: 0.12 }, tk);
      ft($("s05-c0k"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(3)" }, tk + 0.05);

      });
      J.forEach((j, k) => { I($("s05-j" + k), { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0 }); ["fl", "x", "ok", "gl"].forEach((p) => I($("s05-" + p + k), { opacity: 0, scale: 1 })); });

      // ================================================================ the three criteria: each check rejects one listing
      const CT = [tCoc - 0.05, tIndo - 0.25, tMen - 0.05];
      CT.forEach((t, i) => {
        ft($("s05-crg" + i), { opacity: 0 }, { opacity: 1, duration: 0.15 }, t);
        ft($("s05-crg" + i), { opacity: 1 }, { opacity: 0, duration: 0.35 }, t + 0.7);
        ft($("s05-crk" + i), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(3)" }, t + 0.05);
        ft($("s05-cr" + i), { y: 0 }, { y: -8, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, t);

      const warn = $("s05-warn"), sk = J.findIndex((j) => j.k === "scam");
      I(warn, { opacity: 0, x: SLX(sk) + 236, y: SLY(sk) - 24, scale: 2, rotation: -12 });
      ft(warn, { opacity: 0, scale: 2, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.2, ease: "power4.in" }, FAIL.scam + 0.05);
      [[5, -3], [-4, 2], [3, -2], [0, 0]].forEach(([x, y], q) => tl.set(cam, { x, y }, FAIL.scam + 0.25 + q * 0.034));

      const BX = 796 + 91, BY = 594 + 22;

        if (!j.k) return;
        const e = $("s05-j" + k), t = tBua - 0.12 + n * 0.08, dx = BX - (SLX(k) + 210), dy = BY - (SLY(k) + 38); n++;

        ft(e, { y: 0 }, { y: dy, duration: 0.36, ease: "back.in(1.6)" }, t);
        ft(e, { scale: 1, rotation: 0 }, { scale: 0.12, rotation: (n % 2 ? 1 : -1) * 18, duration: 0.36, ease: "power2.in" }, t);
        tl.set(e, { opacity: 0 }, t + 0.36);
        tl.set(bn, { textContent: "Dibuang · " + n }, t + 0.36);

        const e = $("s05-j" + k), t = tBua + 0.36 + q * 0.07;

        ft($("s05-ok" + k), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(3)" }, t + 0.2);
        ft($("s05-gl" + k), { opacity: 0 }, { opacity: 1, duration: 0.25 }, t + 0.24);
      });

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s05"] = tl;
    })();

  <script>
    (function () {
      // THE PLUGIN DOCK (persistent, hf-seek): 4 slots under the logo (y 318–396). They pop in on "empat" in the hook; slot k FILLS
      // (cartridge colour, icon, name, ✓) at F[k] = the plugin's name word + 0.6 s — the round scene flies its big plugin card into
      // the slot rect and fades it at exactly F[k]. The slot of the running round wears a glowing ring. CTA: a ripple on "SETUP,".
      // Slot k rect: x 66 + 240k, y 318, 228 × 78 (radius 22). Pure f(t).
      const VW = window.VO_WORDS, SC = window.VO_SCENES, D = SC.reduce((a, s) => Math.max(a, s.start + s.dur), 0);
      const S = (id) => SC.find((s) => s.id === id);
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= after); return w ? w[1] : -99; };
      const one = (x) => Math.max(0, Math.min(1, x));
      const sm = (u) => { u = one(u); return u * u * (3 - 2 * u); };
      const e3 = (u) => { u = one(u); return 1 - Math.pow(1 - u, 3); };
      const back = (u) => { u = one(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
      const $ = (id) => document.getElementById(id);
      const set = (el, k, v) => { if (el.style[k] !== v) el.style[k] = v; };
      const T_IN = wt("empat") - 0.05;
      const F = [wt("Superpowers.") + 0.6, wt("Skills.") + 0.6, wt("Caveman.") + 0.6, wt("Codex,", S("r4").start) + 0.6];
      const R = ["r1", "r2", "r3", "r4"].map((id) => [S(id).start, S(id).start + S(id).dur]);
      const T_CTA = wt("SETUP,");
      window.DOCK = { F, rect: (k) => ({ x: 66 + 240 * k, y: 318, w: 228, h: 78 }), T_IN };
      function draw(t) {
        for (let k = 0; k < 4; k++) {
          const a = (t - T_IN - 0.07 * k) / 0.38, u = back(a);
          const f = t - F[k], fu = e3(f / 0.32);
          const act = sm((t - R[k][0] + 0.1) / 0.3) * (1 - sm((t - R[k][1] + 0.25) / 0.3));
          const pulse = 0.55 + 0.35 * Math.sin(2 * Math.PI * 1.1 * t);
          const rip = Math.exp(-Math.pow((t - T_CTA - 0.12 - 0.09 * k) / 0.14, 2));
          const pop = f > 0 && f < 0.4 ? 0.1 * Math.sin(Math.PI * f / 0.4) : 0;
          const sc = (a <= 0 ? 0.7 : 0.7 + 0.3 * u) * (1 + 0.035 * act + pop + 0.08 * rip);
          set($("dk-s" + k), "opacity", one(a * 2.2).toFixed(3));
          set($("dk-s" + k), "transform", `translateY(${(16 * (1 - one(a))).toFixed(1)}px) scale(${sc.toFixed(4)})`);
          set($("dk-e" + k), "opacity", ((1 - fu) * (1 - sm((t - F[k] + 0.17) / 0.1))).toFixed(3));   // steps away just before the cartridge lands
          set($("dk-e" + k), "borderColor", act > 0.5 && f < 0 ? "rgba(1,204,247,.85)" : "rgba(227,237,250,.30)");
          set($("dk-f" + k), "opacity", (f > 0 ? fu : 0).toFixed(3));
          set($("dk-x" + k), "opacity", (f > 0 ? 0.85 * (1 - e3(f / 0.35)) : 0).toFixed(3));
          set($("dk-r" + k), "opacity", (act * pulse).toFixed(3));
          const b = f - 0.18, bs = b <= 0 ? 0 : back(b / 0.3);
          set($("dk-b" + k), "opacity", one(b / 0.1).toFixed(3));
          set($("dk-b" + k), "transform", `scale(${bs.toFixed(3)})`);
        }
      }
      draw(0);
      window.addEventListener("hf-seek", (e) => draw(e.detail.time + (window.__T0 || 0)));
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true }); tl.set({}, {}, D - 0.02);
      window.__timelines["dock"] = tl;
    })();
  </script>

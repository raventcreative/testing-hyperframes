<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 4 open source buat ngatur banyak AI agent</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<!-- IG Reels cover 1080x1920 on the client's light background (+ its grid): "4 open source" / "buat ngatur banyak AI agent", the reel's
     four tool cards (names + repo paths as TEXT, no third-party logos; lucide icons ISC), the green GRATIS seal (as s01), mascot (host)
     + robot. Poppins 700/400, navy gradient. Everything that matters sits inside the 4:5 crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8782 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f8fe; font-family: Poppins, sans-serif; color: #0a0d2c; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .a { position: absolute; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  #gridtint { position: absolute; left: 520px; top: -260px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(126,164,226,.22), rgba(126,164,226,0) 64%); }
  #gridwrap { position: absolute; left: 330px; top: 160px; width: 900px; height: 820px;
    -webkit-mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); }
  #grid { position: absolute; left: -473px; top: -473px; width: 1846px; height: 1766px; background-image: linear-gradient(90deg, rgba(104,132,186,.30) 2px, transparent 2px), linear-gradient(0deg, rgba(104,132,186,.30) 2px, transparent 2px); background-size: 43px 43px; transform: translate(172px, 172px); }
  #glow { position: absolute; left: 20px; top: 560px; width: 1040px; height: 700px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.95), rgba(255,255,255,0) 66%); }
  .grad { background: linear-gradient(172deg, #0a0d2c 8%, #294b77 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  .ic { display: block; flex: none; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; z-index: 30; }
  #eyebrow { top: 372px; display: flex; justify-content: center; }
  #eyebrow > span { height: 58px; padding: 0 26px 0 14px; border-radius: 29px; display: flex; align-items: center; gap: 12px; background: #ffffff;
    box-shadow: 0 12px 26px -12px rgba(20,40,90,.4), 0 0 0 1.5px rgba(10,13,44,.07); font: 700 21px/1 Poppins; letter-spacing: 2px; }
  #h1 { top: 452px; font: 700 132px/1 Poppins; letter-spacing: -5px; filter: drop-shadow(0 16px 26px rgba(10,13,44,.14)); }
  #h2 { top: 604px; display: flex; justify-content: center; align-items: baseline; gap: 16px; font: 400 54px/1 Poppins; letter-spacing: -1px; }
  #h2 b { position: relative; font-weight: 700; }
  #h2 b::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: -12px; height: 7px; border-radius: 4px; background: linear-gradient(90deg, #0a0d2c, #294b77); }
  /* the four tool cards */
  .tc { position: absolute; width: 440px; height: 168px; z-index: 12; }
  .tb { position: absolute; inset: 0; border-radius: 30px; background: linear-gradient(180deg, #ffffff, #f6f8fd); box-shadow: 0 34px 60px -32px rgba(10,13,44,.5), 0 0 0 1.5px rgba(10,13,44,.06); }
  .tn { position: absolute; left: 22px; top: 22px; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #0a0d2c, #294b77); color: #fff; text-align: center; font: 700 20px/40px Poppins; }
  .tt { position: absolute; left: 78px; top: 16px; font: 700 38px/50px Poppins; letter-spacing: -0.02em; white-space: nowrap; }
  .td { position: absolute; left: 24px; top: 78px; height: 40px; display: flex; align-items: center; gap: 10px; font: 700 22px/40px Poppins; color: #294b77; white-space: nowrap; }
  .tr { position: absolute; left: 24px; top: 122px; font: 400 17px/26px Poppins; color: #5d6f8f; white-space: nowrap; }
  #seal { position: absolute; left: 812px; top: 1092px; width: 210px; height: 210px; z-index: 20; transform: rotate(-12deg); filter: drop-shadow(0 18px 22px rgba(20,90,45,.35)); }
  #seal svg { position: absolute; left: 0; top: 0; width: 210px; height: 210px; }
  #seal b { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 700 38px/210px Poppins, sans-serif; color: #fff; text-shadow: 0 2px 8px rgba(0,60,20,.25); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 20; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="gridtint"></div><div id="gridwrap"><div id="grid"></div></div><div id="glow"></div>
  <div id="cards"></div>
  <div class="a" id="seal"><svg viewBox="0 0 236 236"><defs><linearGradient id="sgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3cc061"/><stop offset="1" stop-color="#1f8a3c"/></linearGradient>
    <path id="sp" d="M118,118 m-88,0 a88,88 0 1,1 176,0 a88,88 0 1,1 -176,0"/></defs><circle cx="118" cy="118" r="116" fill="url(#sgr)"/>
    <circle cx="118" cy="118" r="107" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="118" cy="118" r="66" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-dasharray="3 6"/>
    <text fill="#fff" font-family="Poppins, sans-serif" font-weight="700" font-size="19" letter-spacing="3"><textPath href="#sp" textLength="546">OPEN SOURCE • OPEN SOURCE •</textPath></text></svg><b>GRATIS</b></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><i class="ic" style="width:34px;height:34px;background:#2da44e;-webkit-mask-image:url(../assets/icons/lucide-badge-check.svg);mask-image:url(../assets/icons/lucide-badge-check.svg)"></i><b class="grad">MULTI-AGENT · LISENSI MIT</b></span></div>
  <div id="h1" class="ctr"><span class="grad">4 open source</span></div>
  <div id="h2" class="ctr"><span class="grad">buat ngatur banyak</span><b class="grad">AI agent</b></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS;
  const ic = (n, s, c) => `<i class="ic" style="width:${s}px;height:${s}px;background:${c};-webkit-mask-image:url(../assets/icons/lucide-${n}.svg);mask-image:url(../assets/icons/lucide-${n}.svg)"></i>`;
  const T = [["OpenHands", "layout-dashboard", "1 dashboard, banyak agent", "OpenHands/OpenHands"], ["Paperclip", "building-2", "perusahaan isi AI agent", "paperclipai/paperclip"],
    ["Orca", "workflow", "agent kerja paralel", "stablyai/orca"], ["TeamAI", "folder-git-2", "1 repo buat semua agent", "Tencent/teamai-cli"]];
  const GX = [80, 560], GY = [728, 920], ROT = [-2, 1.5, 1.2, -1.5];
  document.getElementById("cards").innerHTML = T.map((t, i) => `<div class="tc" style="left:${GX[i % 2]}px;top:${GY[Math.floor(i / 2)]}px;transform:rotate(${ROT[i]}deg)"><div class="tb"></div>` +
    `<div class="tn">${i + 1}</div><div class="tt grad">${t[0]}</div><div class="td">${ic(t[1], 26, "#294b77")}${t[2]}</div><div class="tr">github.com/${t[3]}</div></div>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    rb.setView({ fx: P("rx", "800"), fy: P("ry", "1640"), h: P("rh", "270"), pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0, ry: -0.42, rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] - 0.06, HF[1] - 0.12, HF[2]], hand_L: [-0.3, 0, -0.35], hand_R: [-0.3, 0, 0.35] },
      offs: { hand_L: [-0.13, 0.26, 0.06], hand_R: [0.13, 0.26, 0.06], head: [0, 0, 0] },
      face: { blink: 0, gaze: [-0.12, 0.06], happy: 1, squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.6, shadow: false });
    rb.render();
  }
  async function buildMascot() {
    const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.037, 0.034], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.037, 0.034], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [243, 186, 141], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "lidRing": 1.5, "browNy": 0.98, "headC": [0, 0.72, 0]};
    const src = await (await fetch("../compositions/mascot.html")).text();
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.6; o.color.setRGB(0.72, 0.84, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 60, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 60.05, { smooth: 1 });
    m.setView({ fx: P("mx", "300"), fy: P("my", "2050"), h: P("mh", "760"), yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    B.upperarm_R = [-2.7, 0, -0.25]; B.forearm_R = [0, 0, 0]; B.hand_R = [-0.12, 0.1, -0.12];
    B.head = [-0.08, 0.08, 0.04]; B.neck = [-0.02, 0.03, 0.02];
    m.setState({ root: { x: 0, y: 0, ry: 0.22, rz: 0, rx: 0, s: 1 }, bones: B, face: { blink: [0, 0], gaze: [-0.003, 0.006], mouthMix: 1, mouth: [0.04, 0.012, 0.005, 0.2] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, buildRobot(), buildMascot()]);
</script>
</body>
</html>

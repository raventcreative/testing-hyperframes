<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
      :root { --ink: #800000; --sans: "Montserrat", sans-serif; --serif: "Cormorant Garamond", serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #eef0f2; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--sans); }
      .full { position: absolute; inset: 0; overflow: hidden; }

      /* camera: photo + stickers share one transform so stickers stay glued to the face */
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      #photo { position: absolute; left: -324px; top: 0; width: 1433.6px; height: 1920px; display: block; }
      .stk { position: absolute; display: block; }
      .note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
        background: linear-gradient(165deg, #9c1414 0%, #800000 55%, #690000 100%); color: #fff;
        font-family: var(--sans); font-weight: 700; font-size: 44px; line-height: 1.0; letter-spacing: 0.02em;
        box-shadow: 0 14px 22px rgba(60, 0, 0, 0.35), 0 2px 4px rgba(60, 0, 0, 0.3); }
      .note::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22%; background: rgba(0, 0, 0, 0.1); }
      .note::after { content: ""; position: absolute; right: 0; bottom: 0; width: 34px; height: 34px;
        background: linear-gradient(315deg, rgba(255,255,255,0) 50%, rgba(255,255,255,0.22) 50%, rgba(0,0,0,0.12) 100%); }
      .note span { position: relative; display: block; }

      /* overlays */
      #scrim { top: 1150px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.66) 32%, rgba(255,255,255,0.8) 100%); }
      #scrimEnd { background: linear-gradient(180deg, rgba(255,255,255,0) 34%, rgba(255,255,255,0.86) 50%, rgba(255,255,255,0.94) 100%); opacity: 0; }
      .kick { display: block; font-family: var(--sans); font-weight: 700; font-size: 40px; letter-spacing: 0.16em; text-transform: uppercase; }
      .big { display: block; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 128px; line-height: 0.95; }
      #hook { position: absolute; left: 70px; top: 1290px; width: 700px; display: block; }
      #pname { position: absolute; left: 400px; top: 1310px; width: 540px; display: block; }
      #pname .t { display: block; font-family: var(--serif); font-weight: 700; font-size: 84px; line-height: 0.95; text-transform: uppercase; }
      #pname .s { display: block; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 56px; margin-top: 8px; }
      .serum { position: absolute; display: block; filter: drop-shadow(0 30px 34px rgba(90, 0, 20, 0.3)); }
      .serum img { width: 100%; height: 100%; display: block; }
      #badge { position: absolute; left: 300px; top: 1085px; width: 210px; height: 210px; border-radius: 50%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; color: #fff;
        background: radial-gradient(circle at 35% 30%, #a3122a, #800000 60%, #5c0000); box-shadow: 0 18px 40px rgba(128, 0, 0, 0.35); }
      #badge .n { display: block; font-family: var(--sans); font-weight: 700; font-size: 64px; line-height: 0.95; }
      #badge .l { display: block; font-family: var(--sans); font-weight: 700; font-size: 28px; line-height: 1.02; width: 160px; margin-top: 4px; }
      #drop { position: absolute; left: 0; top: 0; width: 66px; height: 80px; display: block; }
      #drop .j { position: absolute; inset: 0; display: block; border-radius: 50% 50% 46% 46% / 62% 62% 40% 40%;
        background: radial-gradient(circle at 36% 34%, #ffb3bf 0%, #e0283f 34%, #a3001a 72%, #7a0012 100%);
        box-shadow: inset -5px -7px 12px rgba(70, 0, 10, 0.45), 0 10px 18px rgba(128, 0, 0, 0.3); }
      #ripple { position: absolute; left: 0; top: 0; width: 160px; height: 160px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.9); display: block; opacity: 0; }
      #sweep { position: absolute; left: -700px; top: -400px; width: 520px; height: 2800px; display: block; opacity: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,240,244,0.75) 45%, rgba(255,255,255,0.95) 50%, rgba(255,240,244,0.75) 55%, rgba(255,255,255,0) 100%); }
      .chip { position: absolute; left: 0; right: 0; top: 1390px; display: flex; justify-content: center; }
      .chip span { display: block; background: rgba(255, 255, 255, 0.9); border-radius: 999px; padding: 18px 40px; font-family: var(--sans);
        font-weight: 400; font-size: 40px; white-space: nowrap; box-shadow: 0 14px 34px rgba(128, 0, 0, 0.14); }
      .chip b { font-weight: 700; }
      #endLogo { position: absolute; left: 330px; top: 880px; width: 130px; display: block; }
      #endTag { position: absolute; left: 330px; top: 1030px; width: 580px; display: block; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 66px; line-height: 1.02; }
      #endIng { position: absolute; left: 332px; top: 1185px; width: 580px; display: block; font-family: var(--sans); font-weight: 400; font-size: 28px; line-height: 1.4; }
      #endIng b { font-weight: 700; }
      .ln { display: block; white-space: nowrap; }
      #cta { position: absolute; left: 0; right: 0; top: 1440px; display: flex; justify-content: center; }
      #cta .btn { display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 999px; padding: 18px 40px 18px 20px;
        box-shadow: 0 22px 46px rgba(128, 0, 0, 0.22); font-family: var(--sans); font-size: 40px; font-weight: 400; white-space: nowrap; }
      #cta .btn b { font-weight: 700; }
      #cta .cart { width: 80px; height: 80px; border-radius: 50%; background: #ffc928; display: flex; align-items: center; justify-content: center; }
      #cta .cart svg { width: 48px; height: 48px; display: block; }
      #flash { background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <!-- photo + stickers under one camera -->
      <div id="camLayer" class="full clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="cam" data-layout-allow-overflow>
          <div id="shake">
            <img id="photo" src="assets/model/model-3x.jpg" alt="Model SKIN-KU" data-layout-allow-overflow />
            <div id="s1" class="stk" style="left:354px; top:275px; width:260px; height:170px"><div class="note"><span>KUSAM</span></div></div>
            <div id="s2" class="stk" style="left:251px; top:647px; width:210px; height:210px"><div class="note"><span>KERING</span></div></div>
            <div id="s3" class="stk" style="left:622px; top:541px; width:230px; height:230px"><div class="note" style="font-size:40px; flex-direction:column"><span>TEKSTUR</span><span>KASAR</span></div></div>
            <div id="s4" class="stk" style="left:403px; top:881px; width:210px; height:190px"><div class="note"><span>NODA</span></div></div>
          </div>
        </div>
      </div>

      <div id="fx" class="full clip" data-start="0" data-duration="10" data-track-index="1">
        <div id="scrim" class="full"></div>
        <div id="scrimEnd" class="full"></div>
        <div id="sweep" data-layout-allow-overflow></div>
        <div id="ripple" data-layout-allow-overflow></div>
        <div id="drop"><span class="j"></span></div>

        <div id="hook"><span class="kick" id="hk1">Masalah kulit</span><span class="big" id="hk2">numpuk?</span></div>

        <div id="serumA" class="serum" style="left:70px; top:820px; width:278px; height:840px"><img src="assets/product/serum.png" alt="Hada Hydra Glow Glow Jelly Serum" /></div>
        <div id="badge"><span class="n">10X</span><span class="l">GLOW BOOSTING EFFECT</span></div>
        <div id="pname"><span class="t">Hada Hydra Glow</span><span class="s">Glow Jelly Serum</span></div>

        <div id="c1" class="chip"><span>Bantu <b>haluskan tekstur</b></span></div>
        <div id="c2" class="chip"><span>Bantu jaga <b>kelembapan</b></span></div>
        <div id="c3" class="chip"><span>Kulit tampak <b>glowing</b></span></div>

        <div id="serumB" class="serum" style="left:80px; top:850px; width:186px; height:560px"><img src="assets/product/serum.png" alt="" /></div>
        <img id="endLogo" src="assets/brand/skinku-logo.png" alt="SKIN-KU" />
        <span id="endTag"><span class="ln">Glownya emang</span><span class="ln">beda level.</span></span>
        <span id="endIng"><span class="ln"><b>10%</b> Niacinamide · <b>2%</b> Panthenol</span><span class="ln"><b>5%</b> Lycoric Extract</span></span>
        <div id="cta">
          <div class="btn">
            <span class="cart">
              <svg viewBox="0 0 24 24" fill="none" stroke="#800000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 3.5h2.6l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.2l1.6-6.8H6.2" />
                <circle cx="9.5" cy="20" r="1.3" /><circle cx="17.5" cy="20" r="1.3" />
              </svg>
            </span>
            <span>Checkout di <b>keranjang kuning</b></span>
          </div>
        </div>
        <div id="flash" class="full"></div>
      </div>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        // camera framing helper: keep canvas point (px,py) at screen point (sx,sy) with zoom k
        const frame = (k, px, py, sx, sy) => ({ scale: k, x: sx - k * px, y: sy - k * py });

        /* ---------- camera ---------- */
        tl.fromTo("#cam", { ...frame(1, 524, 650, 524, 650) }, { ...frame(1.16, 524, 650, 524, 650), duration: 4.6, ease: "sine.inOut" }, 0);
        // glow cuts (hard cuts on the same photo)
        tl.set("#cam", { ...frame(2.3, 430, 640, 540, 820) }, 4.6);
        tl.to("#cam", { ...frame(2.42, 430, 640, 540, 820), duration: 0.8, ease: "none" }, 4.6);
        tl.set("#cam", { ...frame(2.0, 610, 860, 540, 860) }, 5.4);
        tl.to("#cam", { ...frame(2.1, 610, 860, 540, 860), duration: 0.8, ease: "none" }, 5.4);
        tl.set("#cam", { ...frame(1.45, 524, 700, 540, 860) }, 6.2);
        tl.to("#cam", { ...frame(1.52, 524, 700, 540, 860), duration: 0.8, ease: "none" }, 6.2);
        tl.set("#cam", { ...frame(1, 524, 650, 524, 650) }, 7.0);
        tl.to("#cam", { ...frame(1.05, 524, 650, 524, 650), duration: 3.0, ease: "sine.out" }, 7.0);
        // white flash on every cut
        [4.6, 5.4, 6.2, 7.0].forEach((t) => tl.fromTo("#flash", { opacity: 0.65 }, { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, t));

        /* ---------- hook ---------- */
        tl.fromTo("#hk1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
        tl.fromTo("#hk2", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.2);
        tl.to("#hook", { opacity: 0, y: -20, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 2.3);

        /* ---------- sticker slaps ---------- */
        const slaps = [["#s1", 0.45, -6], ["#s2", 0.9, -10], ["#s3", 1.35, 8], ["#s4", 1.8, 4]];
        slaps.forEach(([s, t, r]) => {
          tl.fromTo(s + " .note", { opacity: 0, scale: 1.7, rotation: r + 18 }, { opacity: 1, scale: 1, rotation: r, duration: 0.16, ease: "power4.in" }, t);
          tl.fromTo(s + " .note", { scaleX: 1, scaleY: 1 }, { scaleX: 1.05, scaleY: 0.95, duration: 0.06, ease: "power1.out", yoyo: true, repeat: 1, immediateRender: false }, t + 0.16);
          tl.fromTo("#shake", { x: 0, y: 0 }, { keyframes: [{ x: -9, y: 5, duration: 0.04 }, { x: 7, y: -4, duration: 0.05 }, { x: -3, y: 2, duration: 0.05 }, { x: 0, y: 0, duration: 0.05 }], immediateRender: false }, t + 0.15);
        });

        /* ---------- serum reveal ---------- */
        tl.fromTo("#serumA", { opacity: 0, x: -360, rotation: -18 }, { opacity: 1, x: 0, rotation: -4, duration: 0.6, ease: "back.out(1.4)" }, 2.4);
        tl.fromTo("#badge", { opacity: 0, scale: 0.2, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, 2.8);
        tl.fromTo("#pname .t", { opacity: 0, y: 34, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 2.6);
        tl.fromTo("#pname .s", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.8);
        tl.to(["#pname", "#badge"], { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 3.55);

        /* ---------- drop, shimmer, stickers fly off ---------- */
        // drop leaves the dropper tip and lands on the right cheek (screen ~765,657)
        tl.fromTo("#drop", { opacity: 0, x: 175, y: 790, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, 3.6);
        tl.to("#drop", { x: 732, duration: 0.45, ease: "power1.inOut" }, 3.7);
        tl.fromTo("#drop", { y: 790 }, { keyframes: [{ y: 560, duration: 0.2, ease: "power2.out" }, { y: 620, duration: 0.25, ease: "power2.in" }], immediateRender: false }, 3.7);
        tl.to("#drop", { scaleX: 1.6, scaleY: 0.4, opacity: 0, duration: 0.18, ease: "power2.out" }, 4.15);
        tl.fromTo("#ripple", { x: 685, y: 580, scale: 0.2, opacity: 0.9 }, { x: 685, y: 580, scale: 2.6, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 4.15);
        tl.fromTo("#sweep", { x: 0, rotation: 22, opacity: 0.9 }, { x: 2400, rotation: 22, opacity: 0.9, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 4.12);
        tl.to("#sweep", { opacity: 0, duration: 0.1 }, 4.72);
        const fly = [["#s3", 4.18, 200, 50], ["#s1", 4.26, -40, -60], ["#s2", 4.34, -220, -40], ["#s4", 4.42, 160, 40]];
        fly.forEach(([s, t, dx, rot]) => {
          tl.to(s + " .note", { x: dx, y: -320, rotation: rot, scale: 0.55, opacity: 0, duration: 0.42, ease: "power2.in" }, t);
        });
        tl.to("#serumA", { opacity: 0, x: -300, rotation: -14, duration: 0.4, ease: "power2.in" }, 4.2);
        tl.to("#scrim", { opacity: 0, duration: 0.3 }, 4.4);

        /* ---------- glow chips ---------- */
        [["#c1", 4.62], ["#c2", 5.42], ["#c3", 6.22]].forEach(([c, t]) => {
          tl.fromTo(c + " span", { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "power3.out" }, t + 0.05);
          tl.to(c + " span", { opacity: 0, y: -16, duration: 0.18, ease: "power2.in" }, t + 0.62);
        });

        /* ---------- end card ---------- */
        tl.fromTo("#scrimEnd", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 7.0);
        tl.fromTo("#serumB", { opacity: 0, y: 120, rotation: -10 }, { opacity: 1, y: 0, rotation: -4, duration: 0.6, ease: "back.out(1.4)" }, 7.15);
        tl.to("#serumB", { y: -12, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.8);
        tl.fromTo("#endLogo", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.2);
        tl.fromTo("#endTag", { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 7.4);
        tl.fromTo("#endIng", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 7.75);
        tl.fromTo("#cta .btn", { opacity: 0, scale: 0.6, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 7.95);
        tl.fromTo("#cta .cart", { rotation: 0 }, { rotation: 14, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 8.45);
        tl.to("#cta .btn", { scale: 1.05, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 9.0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>

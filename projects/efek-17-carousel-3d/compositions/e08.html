  </style>
  <div id="e8-root" data-composition-id="e08" data-width="1080" data-height="1350">
    <div id="e8-bd" class="e8-layer"></div>
    <div id="e8-back" class="e8-layer" data-layout-ignore><div id="e8-dim"></div></div>
    <div id="e8-figwrap" class="e8-layer"><video id="e8-mascot" class="clip" data-start="0" data-duration="4" src="assets/mascot/mascot_talk_loop_1x.webm" muted playsinline style="position:absolute;left:0;top:0;width:1080px;height:1350px"></video></div>
    <div id="e8-front" class="e8-layer" data-layout-ignore></div>

  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const ei = (x) => Math.pow(clamp(x, 0, 1), 3);
      const H = window.HFP;
      const $ = (id) => document.getElementById(id);
      $("e8-bd").innerHTML = H.backdropHTML("e8b");
      $("e8-figwrap").style.transformOrigin = "540px 1204px";
      $("e8-figwrap").style.transform = "translate(0px,-44px) scale(0.78)";
      $("e8-chrome").innerHTML = H.chromeHTML("e8c", 8, "Headline Wall");

      const art = (src, hd, opt) => `<div class="fold"></div><div class="ms"><span>${src}</span><span>2026</span></div><div class="hd">${hd}</div>` +
        (opt.img ? '<div class="im"><svg viewBox="0 0 260 70" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M0 58 L50 40 L92 48 L150 22 L200 30 L260 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/></svg></div>' : "") +
        '<div class="ln"></div><div class="ln"></div><div class="ln s"></div>' + (opt.tape ? '<div class="e8-tape"></div>' : '<div class="e8-pin"></div>');
      // 7 papers: left / above head / right, all behind the body. order = pop order
      const P = [
        { x: 70, y: 150, w: 300, h: 206, r: -5, k: "a", html: art("Tekno Harian", "AI Bikin Kreator <em>10x</em> Lebih Cepat", { tape: 1 }) },
        { x: 422, y: 168, w: 196, h: 196, r: 4, k: "s", html: '<div class="big">+312%</div><div class="tg">reach sebulan</div><div class="e8-pin" style="top:-4px"></div>' },
        { x: 664, y: 146, w: 300, h: 210, r: 6, k: "a", html: art("Bisnis Kini", "Video Pendek Kuasai Feed <em>2026</em>", {}) },
        { x: 56, y: 440, w: 240, h: 300, r: 4, k: "a", html: art("Kabar UMKM", "UMKM Ramai-Ramai Pakai <em>AI</em>", { img: 1 }) },
        { x: 770, y: 420, w: 204, h: 204, r: -7, k: "s", html: '<div class="sm">Tim kecil,<br>konten jalan.</div><div class="e8-tape" style="top:-12px;width:80px;margin-left:-40px"></div>' },
        { x: 712, y: 700, w: 282, h: 214, r: 3, k: "a", html: art("Kreator.id", "Konsisten Posting Tanpa <em>Burnout</em>", { tape: 1 }) },
        { x: 96, y: 866, w: 206, h: 196, r: -4, k: "s", html: '<div class="sm">Mulai pakai AI hari ini.</div><div class="e8-pin" style="top:6px"></div>' },
      ];
      const host = $("e8-back"), els = [];
      P.forEach((p) => {
        const d = document.createElement("div");
        d.className = "e8-p " + (p.k === "a" ? "e8-art" : "e8-st");
        d.style.width = p.w + "px"; d.style.height = p.h + "px";
        d.innerHTML = p.html; host.appendChild(d); els.push(d);
      });
      const dim = $("e8-dim"), cap = $("e8-cap");
      const T0 = 0.35, GAP = 0.06, DUR = 0.24;

      function render(t) {
        dim.style.opacity = (eo(seg(t, 0.25, 0.6)) * (1 - seg(t, 3.5, 3.9))).toFixed(3);
        for (let i = 0; i < P.length; i++) {
          const p = P[i], e = els[i];
          const a = T0 + i * GAP, inP = seg(t, a, a + DUR);
          const o0 = 3.42 + (P.length - 1 - i) * 0.05, outP = ei(seg(t, o0, o0 + 0.2));   // peel off in reverse order
          const k = eo(inP);
          const sc = (1.4 - 0.4 * k) * (1 - 0.12 * outP);
          const lift = 1 - k;                                                   // 1 = still in the air
          const rot = p.r + lift * (p.r > 0 ? 5 : -5) + outP * (p.r > 0 ? 6 : -6);
          e.style.opacity = (clamp(inP * 4, 0, 1) * (1 - outP)).toFixed(3);
          e.style.transform = "translate(" + p.x + "px," + (p.y + outP * 40).toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")";
          // shadow tightens as the paper lands on the wall
          const sy = 6 + lift * 30, sb = 10 + lift * 40, so = 0.5 - lift * 0.2;
          e.style.boxShadow = "0 " + sy.toFixed(1) + "px " + sb.toFixed(1) + "px rgba(2,8,26," + so.toFixed(3) + "), 0 1px 2px rgba(2,8,26,0.35)";
        }
        const c = eo(seg(t, 0.85, 1.2)) * (1 - seg(t, 3.45, 3.8));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px)";
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e08"] = tl;
    })();
  </script>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Reseller &amp; Dropship: Uang Lewat vs Untung</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's relay: the KAMU pictogram runner (navy, yellow headband) on the blue track holds up the small yellow stub of
     the baton while the big navy part flies off to the supplier. Title "OMZET ≠ UNTUNG". No numbers. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t0 { position: absolute; left: 0; width: 1080px; top: 368px; text-align: center; font: 700 34px/1 PS; letter-spacing: .2em; color: #DDE1EE; white-space: nowrap; }
  #t1 { position: absolute; left: 0; width: 1080px; top: 420px; text-align: center; font: 800 196px/0.92 Rubik; letter-spacing: -6px; color: #fff; white-space: nowrap; }
  #t1b { position: absolute; left: 0; width: 1080px; top: 610px; text-align: center; font: 800 120px/1 Rubik; letter-spacing: -3px; white-space: nowrap; }
  #t1b span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 82%; padding: 0 .1em; }
  #t2 { position: absolute; left: 0; width: 1080px; top: 760px; text-align: center; font: italic 400 54px/1.1 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: 40px; top: 860px; width: 1000px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.16), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 520px 1200px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  #trk { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform: rotateX(90deg); }
  #trk div { position: absolute; }
  .tsurf { background: linear-gradient(90deg, rgba(58,79,177,0) 0%, #3a4fb1 18%, #3a4fb1 82%, rgba(58,79,177,0) 100%); }
  .tl { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.8) 18%, rgba(255,255,255,.8) 82%, rgba(255,255,255,0) 100%); }
  .zone { border: 6px dashed #FED111; border-radius: 6px; background: rgba(254,209,17,.16); }
  .fig { position: absolute; left: -150px; top: -300px; width: 300px; height: 300px; }
  .tq { position: absolute; left: 0; top: 0; width: 300px; height: 300px; transform-origin: 150px 150px; }
  .tq div { position: absolute; }
  .ua { left: 139px; top: 73px; width: 26px; height: 76px; border-radius: 13px; transform-origin: 13px 13px; }
  .fa { left: 1px; top: 51px; width: 24px; height: 70px; border-radius: 12px; transform-origin: 12px 12px; }
  .bh, .bl { left: 12px; top: 58px; width: 0; height: 0; transform-origin: 0 0; } .bl { left: 0; top: 0; }
  .th { left: 133px; top: 133px; width: 34px; height: 106px; border-radius: 17px; transform-origin: 17px 17px; }
  .shn { left: 2px; top: 74px; width: 30px; height: 96px; border-radius: 15px; transform-origin: 15px 15px; }
  .ft { left: 3px; top: 69px; width: 46px; height: 24px; border-radius: 12px; }
  .to { left: 124px; top: 54px; width: 52px; height: 122px; border-radius: 26px; }
  .hd { left: 133px; top: 17px; width: 54px; height: 54px; border-radius: 50%; }
  .near, .near > div, .near .shn, .near .ft, .near .fa, .to, .hd { background: #3448a6; } .far, .far .shn, .far .ft, .far .fa { background: #0f1638; }
  .band { left: -2px !important; top: 12px !important; width: 58px; height: 12px; border-radius: 6px; background: #FED111 !important; transform: rotate(-8deg); }
  .bib { left: 10px !important; top: 26px !important; width: 32px; height: 34px; border-radius: 9px; background: #FED111 !important; }
  .stub { left: -21px !important; top: -16px !important; width: 42px; height: 32px; border-radius: 16px 6px 6px 16px; background: linear-gradient(180deg, #FFF4B0 0%, #FED111 36%, #E5B800 78%, #C99E00 100%) !important;
          box-shadow: 0 0 0 3px rgba(19,27,64,.85), inset -8px 0 0 #B88F00, 0 0 40px 10px rgba(254,209,17,.45); }
  .navyb { position: absolute; left: 0; top: 0; width: 330px; height: 72px; border-radius: 36px 12px 12px 36px; background: linear-gradient(180deg, #7d8be0 0%, #3a4fb1 34%, #26367A 72%, #161f4d 100%);
           box-shadow: 0 0 0 5px #0f1638, 0 30px 60px rgba(3,6,24,.5); }
  .navyb i { position: absolute; left: 20px; top: 9px; width: 290px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.45); }
  .speed { position: absolute; height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(221,225,238,0), rgba(221,225,238,.6)); }
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 26px; border-radius: 32px; font: 700 30px/1 PS; white-space: nowrap; box-shadow: 0 18px 36px rgba(3,6,24,.4); }
  #cS { background: #fff; color: #212C5F; } #cS svg { width: 30px; height: 30px; }
  #cK { background: #FED111; color: #212C5F; font: 800 32px/1 Rubik; letter-spacing: .06em; }
  #t3 { position: absolute; left: 56px; top: 1530px; display: inline-flex; align-items: center; gap: 14px; padding: 20px 30px; border-radius: 999px; background: #fff; font: 700 34px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-3deg); box-shadow: 0 20px 40px rgba(3,6,24,.35); }
  #t3 i { flex: none; width: 46px; height: 46px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  #t3 svg { width: 28px; height: 28px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t0">RESELLER &amp; DROPSHIP</div>
  <div id="t1">OMZET</div>
  <div id="t1b"><span>&ne; UNTUNG</span></div>
  <div id="t2">uangnya cuma numpang lewat</div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <div class="speed" style="left:560px; top:930px; width:150px"></div><div class="speed" style="left:600px; top:968px; width:110px"></div><div class="speed" style="left:575px; top:1006px; width:130px"></div>
  <div class="navyb" id="nb" style="left:700px; top:925px; transform: rotate(-9deg)"><i></i></div>
  <div class="chip" id="cS" style="left:690px; top:1040px; transform: rotate(-4deg)">ke supplier<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="chip" id="cK" style="left:150px; top:880px; transform: rotate(-3deg)">UNTUNGMU</div>
  <div id="t3"><i><svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></i>Catat dua sisinya</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // camera: low, slightly from the side, the track runs left -> right
  w.style.transform = "translate3d(420px, 1430px, 0px) rotateX(-14deg) rotateY(-10deg)";
  const tr = mk("div", "", w); tr.id = "trk";
  mk("div", "tsurf", tr, "left:-900px; top:-240px; width:1800px; height:480px;");
  for (const z of [-120, 0, 120]) mk("div", "tl", tr, `left:-900px; top:${z - 60 - 3}px; width:1800px; height:6px;`);
  mk("div", "zone", tr, "left:-90px; top:-56px; width:240px; height:112px;");
  // the KAMU pictogram (same rig as the film), running, the near arm raised holding the yellow stub
  const g = mk("div", "g3", w); g.style.transform = "translate3d(0px, 0px, 0px) scale(1.75)";
  const fig = mk("div", "fig", g); const tq = mk("div", "tq", fig);
  const lean = 12, U = -150, Fo = -14;
  tq.style.transform = `rotate(${lean}deg)`;
  const arm = (side, u, f) => { const ua = mk("div", "ua " + side, tq); ua.style.transform = `rotate(${u}deg)`; const fa = mk("div", "fa", ua); fa.style.transform = `rotate(${f}deg)`; return fa; };
  const leg = (side, a, b) => { const th = mk("div", "th " + side, tq); th.style.transform = `rotate(${a}deg)`; const sh = mk("div", "shn", th); sh.style.transform = `rotate(${b}deg)`; mk("div", "ft", sh); };
  arm("far", 40, -88); leg("far", 30, 88); const to = mk("div", "to", tq); leg("near", -44, 10); const hd = mk("div", "hd", tq); const fa = arm("near", U, Fo);
  mk("div", "band", hd); mk("div", "bib", to);
  const bh = mk("div", "bh", fa); bh.style.transform = `rotate(${-(U + Fo)}deg)`; const bl = mk("div", "bl", bh); bl.style.transform = `rotate(${-lean}deg)`;
  mk("div", "stub", bl);
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: nothing wider than the frame safe width
    document.querySelectorAll("#t0, #t1, #t1b span, #t2, #t3, .chip").forEach((e) => { const rg = document.createRange(); rg.selectNodeContents(e); const q = rg.getBoundingClientRect(); if (q.left < 60 || q.right > 1020) console.log("pageerror TEXT OUTSIDE SAFE", e.id || e.className, Math.round(q.left), Math.round(q.right)); });
    r.render({ x: 930, y: 1560, h: 600, yaw: -24, roll: 0, headYaw: -22, headPitch: -12, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 150, fwd: 22, bend: 10, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.7, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

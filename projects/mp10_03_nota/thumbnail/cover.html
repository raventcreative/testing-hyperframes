<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Foto Nota ke Pembukuan</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     The nota + chips are the same illustration data as the video (labelled). -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: INT; src: url(../assets/fonts/inter-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 540px 560px; }
  .p3 { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  #nota { width: 330px; padding: 24px 24px 28px; background: linear-gradient(180deg, #FFFEFA, #F4F0E4); color: #2b3040; box-shadow: 0 30px 60px rgba(0,0,0,.5);
          transform: translate3d(640px, 392px, 0) rotateY(-24deg) rotateX(10deg) rotate(5deg); transform-origin: 165px 230px;
          clip-path: polygon(0 6px,4% 0,8% 6px,12% 0,16% 6px,20% 0,24% 6px,28% 0,32% 6px,36% 0,40% 6px,44% 0,48% 6px,52% 0,56% 6px,60% 0,64% 6px,68% 0,72% 6px,76% 0,80% 6px,84% 0,88% 6px,92% 0,96% 6px,100% 0,100% 100%,0 100%); }
  #nota .h { font: 700 22px/1.1 Rubik; text-align: center; letter-spacing: .04em; }
  #nota .s { margin-top: 6px; font: 400 14px/1 INT; text-align: center; color: #6c7080; }
  #nota .d { margin: 12px 0; border-top: 2px dashed #CFCBBF; }
  #nota .r { display: flex; justify-content: space-between; font: 400 16px/1.6 INT; white-space: nowrap; }
  #nota .r.t { font: 700 20px/1.3 PS; }
  #nota .bx { position: absolute; border: 3px solid #FED111; border-radius: 8px; background: rgba(254,209,17,.14); box-shadow: 0 0 0 5px rgba(254,209,17,.22); }
  #nota .scan { position: absolute; left: 0; right: 0; top: 250px; height: 70px; background: linear-gradient(180deg, rgba(254,209,17,0), rgba(254,209,17,.35) 92%, #FFE440 96%, rgba(254,209,17,0)); }
  .chip { position: absolute; left: 0; top: 0; padding: 14px 24px; border-radius: 16px; background: #fff; border: 3px solid #FED111; box-shadow: 0 22px 44px rgba(3,6,24,.5);
          font: 700 38px/1 PS; color: #161D3A; white-space: nowrap; display: flex; align-items: center; gap: 12px; }
  .chip i { width: 15px; height: 15px; border-radius: 50%; background: #FED111; }
  .chip.n { font: 700 40px/1 Rubik; color: #212C5F; }
  .trail { position: absolute; height: 0; border-top: 3px dashed rgba(254,209,17,.55); transform-origin: 0 50%; }
  #lbl { position: absolute; left: 640px; top: 820px; display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 16px 0 12px; border-radius: 999px;
         background: rgba(10,15,40,.55); border: 1.5px solid rgba(221,225,238,.28); font: 700 18px/1 PS; letter-spacing: .08em; color: #C9CFE4; white-space: nowrap; }
  #lbl i { width: 9px; height: 9px; border-radius: 50%; background: #FED111; }
  #t1 { position: absolute; left: 66px; top: 880px; font: 800 190px/0.9 Rubik; letter-spacing: -6px; color: #fff; }
  #t2 { position: absolute; left: 70px; top: 1240px; font: 800 96px/1 Rubik; letter-spacing: -2px; color: #161D3A; padding: 0 .1em;
        background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 82%; }
  #t3 { position: absolute; left: 76px; top: 1378px; font: italic 400 72px/1 PF; color: #DDE1EE; white-space: nowrap; }
  #t4 { position: absolute; left: 80px; top: 1490px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px; background: #fff; font: 700 34px/1 PS; color: #212C5F; white-space: nowrap; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="stage"><div class="p3" id="world">
    <div id="nota" class="p3">
      <div class="h">TOKO KEMASAN JAYA</div><div class="s">Jl. Mawar No. 12</div><div class="d"></div>
      <div class="r"><span id="fd">12/07/2026</span><span>14:32</span></div><div class="d"></div>
      <div id="fi"><div class="r"><span>Lakban bening ×6</span><span>54.000</span></div><div class="r"><span>Bubble wrap 1 roll</span><span>85.000</span></div><div class="r"><span>Kardus 20×20 ×25</span><span>47.500</span></div></div>
      <div class="d"></div><div class="r t"><span>TOTAL</span><span id="fn">Rp186.500</span></div><div class="d"></div>
      <div class="scan"></div>
    </div>
    <div class="trail" id="tr1"></div><div class="trail" id="tr2"></div><div class="trail" id="tr3"></div>
    <div class="chip" id="ch1">12/07/2026</div>
    <div class="chip" id="ch2"><i></i>Kemasan</div>
    <div class="chip n" id="ch3">Rp186.500</div>
  </div></div>
  <div id="lbl"><i></i>SIMULASI ALUR · ILUSTRASI DATA</div>
  <div id="t1">FOTO<br />NOTA</div>
  <div id="t2">→ PEMBUKUAN</div>
  <div id="t3">tanpa ketik ulang</div>
  <div id="t4">Lihat caranya →</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  // field boxes on the nota, chips flying out of it in depth (dashed trails from each field)
  document.fonts.ready.then(() => {
    const n = document.getElementById("nota");
    const box = (e, pad) => { let x = 0, y = 0; for (let q = e; q && q !== n; q = q.offsetParent) { x += q.offsetLeft; y += q.offsetTop; }
      const b = document.createElement("div"); b.className = "bx"; Object.assign(b.style, { left: x - pad + "px", top: y - pad + "px", width: e.offsetWidth + 2 * pad + "px", height: e.offsetHeight + 2 * pad + "px" }); n.appendChild(b); };
    box(document.getElementById("fd"), 5); box(document.getElementById("fi"), 5); box(document.getElementById("fn"), 5);
    const C = [["ch1", 120, 420, 120, -8, -4], ["ch2", 250, 560, 200, -6, 3], ["ch3", 150, 700, 260, -10, -3]];
    C.forEach(([id, x, y, z, ry, rz]) => { document.getElementById(id).style.transform = "translate3d(" + x + "px," + y + "px," + z + "px) rotateY(" + ry + "deg) rotate(" + rz + "deg)"; });
    const T = [["tr1", 470, 452, 250, 188], ["tr2", 560, 590, 150, 172], ["tr3", 455, 735, 250, 178]];
    T.forEach(([id, x, y, w, a]) => Object.assign(document.getElementById(id).style, { left: x + "px", top: y + "px", width: w + "px", transform: "rotate(" + a + "deg)" }));
    return RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" });
  }).then((r) => {
    r.render({ x: 870, y: 1700, h: 760, yaw: -26, roll: 0, headYaw: -18, headPitch: -12, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 142, fwd: 12, bend: 118, bendYaw: -80 },
      face: { blink: 0, lookX: -0.9, lookY: -0.7, smile: 0, o: 0.6, happy: 0 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

    #s04-rs .v { position: absolute; right: 18px; top: 0; font: 700 36px/64px Poppins, sans-serif; color: #2a57c2; white-space: nowrap; transform-origin: 100% 50%; }
    /* the real margin */

  <div id="root" data-composition-id="s04" data-width="1080" data-height="1920">

  </div>
  <script>
    (function () {
      // s04 "Satu lagi jadi CFO, yang ngitung margin asli kamu."
      // START: empty stage · the CFO card rises (/founder-cfo, label CONTOH, "Contoh: katering · per porsi") · "CFO,": the title slams ·
      // then (through "ngitung") the per-portion rows tick in (price 25.000, bahan −11.000, kemasan −2.000, kurir −3.000) · "margin": the rule draws and
      // "Sisa per porsi Rp9.000" lands · "asli": the ring sweeps to 36 % (9.000 / 25.000), "kelihatannya Rp25.000" gets struck through.
      // Numbers = the reel's example (R6.EX), illustrative. TRANSITION → s05: all out. END STATE: all invisible.
      const D = 3.5, ST = 14.6, VW = window.VO_WORDS, R6 = window.R6, EX = R6.EX;
      const L = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 0.05); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const tSat = L("Satu"), tCfo = L("CFO,"), tNg = L("ngitung"), tMar = L("margin"), tAs = L("asli"), tKam = L("kamu.");
      const ROWS = [["Harga jual", R6.rp(EX.price), ""], ["Bahan makanan", "−" + R6.rp(EX.bahan), "m"], ["Kemasan", "−" + R6.rp(EX.kemasan), "m"], ["Ongkir kurir", "−" + R6.rp(EX.kurir), "m"]];
      const C = 2 * Math.PI * 36;

      // ================================================================ DOM
      let h = `<div class="s04-a" id="s04-glow"></div>`;
      h += `<div class="s04-a r6-card" id="s04-cd"><div class="s04-a" id="s04-ic">${R6.svg("calc", 2)}</div><div class="s04-a" id="s04-cm">/founder-cfo</div>` +
        `<div class="s04-a r6-grad" id="s04-tt">CFO</div><div class="r6-ex" id="s04-ex">${R6.svg("flask", 2.2)}CONTOH</div>` +
        `<div class="s04-a" id="s04-sub">${R6.svg("utensils", 2.2)}Katering · hitungan per porsi</div>`;
      ROWS.forEach((r, k) => { h += `<div class="s04-rw" id="s04-r${k}" style="top:${172 + k * 58}px"><span class="l">${r[0]}</span><b class="v ${r[2]}">${r[1]}</b></div>`; });
      h += `<div class="s04-a" id="s04-dv"></div><div class="s04-a" id="s04-rs"><span class="l">Sisa per porsi</span><b class="v" id="s04-rv">${R6.rp(EX.sisa)}</b></div>`;
      h += `<div class="s04-a" id="s04-mg"><svg class="s04-a" id="s04-ring" viewBox="0 0 88 88"><circle cx="44" cy="44" r="36" fill="none" stroke="#e6ecf6" stroke-width="10"/>` +
        `<circle id="s04-arc" cx="44" cy="44" r="36" fill="none" stroke="#3a6fe0" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" transform="rotate(-90 44 44)"/></svg>` +
        `<div class="s04-a" id="s04-ml">Margin asli</div><div class="s04-a r6-grad" id="s04-mv"><b id="s04-pc">0</b>%</div>` +
        `<div class="s04-a" id="s04-lk"><span class="l">Kelihatannya untung</span><b class="v">${R6.rp(EX.price)}</b><i class="s" id="s04-sk"></i><span class="n" id="s04-nn">bukan segini</span></div></div></div>`;
      $("s04-cam").innerHTML = h;
      const cam = $("s04-cam"), glow = $("s04-glow"), cd = $("s04-cd"), tt = $("s04-tt"), dv = $("s04-dv"), rs = $("s04-rs"), rv = $("s04-rv"), mg = $("s04-mg"),
        arc = $("s04-arc"), pc = $("s04-pc"), sk = $("s04-sk"), nn = $("s04-nn"), lk = $("s04-lk");

      // ================================================================ the CFO card · "CFO," title slam
      I(cam, { x: 0, y: 0 });
      I(glow, { opacity: 0 }); ft(glow, { opacity: 0 }, { opacity: 0.9, duration: 0.3 }, 0);
      I(cd, { opacity: 0, y: 70, scale: 0.94 });
      ft(cd, { opacity: 0, y: 70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.4)" }, Math.max(0.02, tSat - 0.2));
      I(tt, { opacity: 0, scale: 1.6 });
      ft(tt, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in" }, tCfo - 0.14);
      [[0, 5], [0, -3], [0, 1], [0, 0]].forEach(([x, y], k) => tl.set(cam, { x, y }, tCfo + 0.08 + k * 0.034));
      // right after "CFO," (through "ngitung"): the rows tick in
      ROWS.forEach((r, k) => { const e = $("s04-r" + k); I(e, { opacity: 0, x: -30 });
        ft(e, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" }, tCfo + 0.22 + k * 0.13); });
      // "margin": rule + rest per portion
      I(dv, { scaleX: 0 }); ft(dv, { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.inOut" }, tMar - 0.32);
      I(rs, { opacity: 0, y: 12 }); ft(rs, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, tMar - 0.14);
      I(rv, { scale: 1.5 }); ft(rv, { scale: 1.5 }, { scale: 1, duration: 0.24, ease: "back.out(2)" }, tMar - 0.1);
      // "asli": the ring sweeps to 36 %, the "looks like" number is struck through
      I(mg, { opacity: 0, y: 14 }); ft(mg, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, tMar + 0.06);
      I(arc, { attr: { "stroke-dashoffset": C } });
      ft(arc, { attr: { "stroke-dashoffset": C } }, { attr: { "stroke-dashoffset": C * (1 - EX.margin / 100) }, duration: 0.5, ease: "power2.out" }, tAs - 0.1);
      I(pc, { innerText: 0 }); ft(pc, { innerText: 0 }, { innerText: EX.margin, duration: 0.5, ease: "power2.out", snap: { innerText: 1 } }, tAs - 0.1);
      I(sk, { scaleX: 0 }); ft(sk, { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.in" }, tAs + 0.12);
      I(nn, { opacity: 0, scale: 0.5 }); ft(nn, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2.4)" }, tAs + 0.3);
      ft(lk, { x: 0 }, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, tAs + 0.3);

      // ================================================================ TRANSITION → s05
      const tOut = D - 0.26;
      ft(cd, { opacity: 1, y: 0, scale: 1 }, { opacity: 0, y: 60, scale: 0.96, duration: 0.22, ease: "power2.in" }, tOut);
      ft(glow, { opacity: 0.9 }, { opacity: 0, duration: 0.22 }, tOut);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s04"] = tl;
    })();
  </script>

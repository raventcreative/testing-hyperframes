<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 6 agent AI, pilih yang mana?</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/r21icons.js"></script>
<script src="../vendor/r21kit.js"></script>
<!-- IG Reels cover 1080x1920 on the client's navy background (R21 PILIH): chip "6 AGENT AI · CLOUD · OPEN SOURCE", hook
     "6 agent AI lagi rame, / PILIH MANA? / cloud atau open source?", the reel's own road-fork metaphor (two signposts "Tinggal pakai ·
     jalan di cloud mereka" and "Pegang sendiri · open source, di mesinmu", the "kamu" disc at the junction, "?" bubble), the mascot
     (host) presenting at bottom-left, the robot thinking at bottom-right. No third-party logos (agent names not shown). Poppins 700/400,
     white + #01ccf7. Everything that matters sits inside the 4:5 profile-grid crop (y 285-1635).
     Render: PORT=8951 node thumbnail/render_cover.cjs thumbnail/COVER_PILIH_1080x1920.png   (static server on :8951 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  #g1 { left: 40px; top: 330px; width: 1000px; height: 520px; background: radial-gradient(ellipse, rgba(48,93,143,.40), rgba(48,93,143,0) 66%); }
  #g2 { left: -60px; top: 800px; width: 1200px; height: 560px; background: radial-gradient(ellipse, rgba(1,204,247,.24), rgba(1,204,247,0) 62%); }
  .grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(../assets/brand/grain_256.png); opacity: .06; z-index: 40; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; filter: drop-shadow(0 2px 8px rgba(4,8,30,.55)); z-index: 30; }
  #chip { top: 366px; display: flex; justify-content: center; }
  #chip > span { height: 60px; padding: 0 28px 0 7px; border-radius: 30px; display: flex; align-items: center; gap: 15px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.5); font: 700 23px/1 Poppins; letter-spacing: 3px; color: #6adfff; }
  #chip b { height: 46px; padding: 0 18px 0 21px; border-radius: 23px; display: flex; align-items: center; background: #01ccf7; color: #0b1440; letter-spacing: 2.5px;
    box-shadow: 0 0 20px rgba(1,204,247,.5), inset 0 1px 0 rgba(255,255,255,.4); margin-right: 3px; }
  #chip i { width: 7px; height: 7px; border-radius: 50%; background: #6adfff; opacity: .7; }
  #l1 { top: 456px; font: 700 76px/1 Poppins; letter-spacing: -2px; color: #fff; text-shadow: 0 6px 22px rgba(4,8,30,.5); }
  #h1 { top: 548px; font: 700 134px/1 Poppins; letter-spacing: -4px; color: #fff; }
  #h1 span { display: inline-block; background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 46%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(1,204,247,.5)); padding: 0 8px; }
  #l3 { top: 712px; font: 400 44px/1 Poppins; letter-spacing: -1px; color: #e3edfa; }
  #l3 b { font-weight: 700; color: #fff; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 15; }
  #svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 14; }
  .sign { position: absolute; top: 830px; width: 440px; height: 190px; border-radius: 30px; background: rgba(12,22,64,.9); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12), 0 24px 50px rgba(2,6,26,.55); z-index: 15; }
  .sign .ic { position: absolute; left: 26px; top: 28px; width: 92px; height: 92px; border-radius: 26px; background: linear-gradient(160deg, #9cecff, #01ccf7 55%, #0aa7d6); color: #0b1440; }
  .sign .ic svg { position: absolute; left: 23px; top: 23px; width: 46px; height: 46px; }
  .sign b { position: absolute; left: 136px; top: 30px; font: 700 36px/50px Poppins; color: #fff; white-space: nowrap; letter-spacing: -.5px; }
  .sign span { position: absolute; left: 136px; top: 82px; font: 400 22px/30px Poppins; color: #9fdcf2; white-space: nowrap; }
  .sign i { position: absolute; left: 26px; top: 138px; height: 34px; padding: 0 13px; border-radius: 17px; font: 700 16px/34px Poppins; font-style: normal; letter-spacing: 1.5px; color: #b8c7dd;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1.2px rgba(255,255,255,.2); white-space: nowrap; }
  .sign.on { box-shadow: inset 0 0 0 3px rgba(106,223,255,.95), 0 0 44px rgba(1,204,247,.5), 0 24px 50px rgba(2,6,26,.55); }
  #you { position: absolute; left: 502px; top: 1118px; width: 76px; height: 76px; border-radius: 38px; background: #ffffff; color: #0b1440; box-shadow: 0 0 0 6px rgba(1,204,247,.35), 0 0 30px rgba(1,204,247,.6); z-index: 16; }
  #you svg { position: absolute; left: 20px; top: 18px; width: 36px; height: 36px; }
  #qb { position: absolute; left: 560px; top: 1062px; width: 64px; height: 64px; border-radius: 32px; background: #01ccf7; color: #0b1440; font: 700 40px/64px Poppins; text-align: center; box-shadow: 0 0 22px rgba(1,204,247,.8); z-index: 17; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #r { z-index: 21; } #m { z-index: 22; }
  #kb { position: absolute; left: 0; top: 0; width: 300px; height: 100px; margin: -50px 0 0 -150px; opacity: .9; transform-origin: 50% 50%; z-index: 23; }
  #kb .pl { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(1,204,247,.30), rgba(1,204,247,.10));
    box-shadow: 0 0 0 1.5px rgba(106,223,255,.7), 0 0 26px rgba(1,204,247,.55), inset 0 0 18px rgba(1,204,247,.25); }
  #kb .ks { position: absolute; left: 16px; top: 13px; width: 268px; height: 74px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
  #kb .ks i { display: block; border-radius: 4px; background: rgba(160,235,255,.22); box-shadow: inset 0 0 0 1px rgba(160,235,255,.35); }
  #kb .ks i.on { background: rgba(220,250,255,.95); box-shadow: 0 0 10px rgba(1,204,247,.95); }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div>
  <svg id="svg" viewBox="0 0 1080 1920"><path d="M540 1290 L540 1160" fill="none" stroke="#e3edfa" stroke-width="18" stroke-linecap="round"/>
    <path d="M540 1160 Q500 1090 300 1030" fill="none" stroke="#01ccf7" stroke-width="18" stroke-linecap="round"/>
    <path d="M540 1160 Q580 1090 780 1030" fill="none" stroke="#01ccf7" stroke-width="18" stroke-linecap="round"/></svg>
  <div class="sign on" id="s1" style="left:70px"><div class="ic" id="i1"></div><b>Tinggal pakai</b><span>jalan di cloud mereka</span><i>DAFTAR &middot; LANGSUNG JALAN</i></div>
  <div class="sign on" id="s2" style="left:570px"><div class="ic" id="i2"></div><b>Pegang sendiri</b><span>open source, di mesinmu</span><i>PASANG &middot; KAMU YANG ATUR</i></div>
  <div id="you"></div><div id="qb">?</div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <div id="kb"><div class="pl"></div><div class="ks" id="kbk"></div></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR">
  <div id="chip" class="ctr"><span><b>6 AGENT AI</b>CLOUD<i></i>OPEN SOURCE</span></div>
  <div id="l1" class="ctr"><span>6 agent AI lagi rame,</span></div>
  <div id="h1" class="ctr"><span>PILIH MANA?</span></div>
  <div id="l3" class="ctr"><b>cloud</b> atau <b>open source</b>? jawab 1 ini</div>
  <div class="grain"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const K = window.R21K, M3 = window.Mascot3D;
  document.getElementById("i1").innerHTML = K.svg("cloud"); document.getElementById("i2").innerHTML = K.svg("key-round"); document.getElementById("you").innerHTML = K.svg("user");
  document.getElementById("kbk").innerHTML = Array.from({ length: 30 }, () => `<i></i>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    const fx = P("rx", "860"), fy = P("ry", "1700"), hh = P("rh", "330");
    rb.setView({ fx, fy, h: hh, pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0.05, ry: P("bry", "-0.12"), rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] + 0.02, HF[1] - 0.1, HF[2] + 0.14], hand_L: [0, 0, 0], hand_R: [-0.4, 0, 0] },
      offs: { hand_L: [-0.07, 0, 0], hand_R: [0.16, 0.17, 0.14], head: [0, 0, 0] },
      face: { blink: 0, gaze: [-0.1, 0.24], happy: 0.3, squint: 0.4, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.2, shadow: false });
    rb.render();
    document.getElementById("kb").style.display = "none";
  }
  async function buildMascot() {
    const src = await (await fetch("../compositions/mascot.html")).text();
    const FACE = JSON.parse(src.match(/const FACE = (\{.*?\});\n/s)[1]);
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.9; o.color.setRGB(0.5, 0.86, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct([["lihat", 0.3, 3.2, 1]], 6, { intents: [{ t: 0.3, action: q.get("act") || "point", side: q.get("side") || "right" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 6.05, { smooth: 1 });
    m.setView({ fx: P("mx", "290"), fy: P("my", "1905"), h: P("mh", "600"), yaw: 0, pitch: 4 });
    const pf = PERF(P("pt", "0.9")), B = Object.assign({}, pf.bones);
    m.setState({ root: { x: pf.root.x, y: pf.root.y, ry: P("mry", "0.22"), rz: 0, rx: 0, s: 1 }, bones: B,
      face: { blink: [0, 0], gaze: [0, 0], mouthMix: 1, mouth: [0.03, 0.012, 0.012, 0.5] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, q.get("nor") ? 0 : buildRobot(), q.get("nom") ? 0 : buildMascot()]);
</script>
</body>
</html>

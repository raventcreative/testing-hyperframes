  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const P = ["serum", "day", "mist", "night"];
      // poses: x, y (cam-local centre), s (scale), r (deg)
      const S0 = { serum: [480, 1040, 0.15, -14], day: [646, 1140, 0.14, 12], mist: [408, 1220, 0.14, -18], night: [604, 1300, 0.13, 8] };
      const S2 = { serum: [360, 830, 1, -6], day: [690, 1580, 1, 5], mist: [350, 2200, 1, -7], night: [690, 2900, 1, -4] };
      const S3 = { serum: [610, 870, 0.52, 8], day: [800, 1150, 0.5, -6], mist: [250, 950, 0.56, -10], night: [460, 1200, 0.5, 5] };
      const pose = (p) => ({ x: p[0], y: p[1], scale: p[2], rotation: p[3] });
      const cams = "#a-cam-b, #a-cam-s";
      const head1 = "#a-head1 .w";
      const head2 = "#a-head2 .w";

      gsap.set(".a-prod, .a-cam", { transformOrigin: "0px 0px" });

      // ---------- 1. RISE (0 – 2.7) ----------
      tl.fromTo(cams, { x: 0, y: 150, scale: 1 }, { x: 0, y: 0, scale: 1, duration: 2.0, ease: "sine.out" }, 0);
      P.forEach((k) => {
        tl.fromTo(".p-" + k, pose(S0[k]), { ...pose(S2[k]), duration: 2.5, ease: "power3.inOut" }, 0.2);
      });
      tl.fromTo("#a-blur .a-prod img", { filter: "blur(2px) drop-shadow(0px 24px 28px rgba(128,0,0,0.20))" },
        { filter: "blur(14px) drop-shadow(0px 24px 28px rgba(128,0,0,0.20))", duration: 1.6, ease: "power2.in" }, 1.0);
      // far extras recede
      tl.fromTo("#a-bg1", { x: 850, y: 760, rotation: 14, opacity: 0.55 }, { x: 900, y: 420, rotation: 20, opacity: 0, duration: 2.6, ease: "sine.inOut" }, 0);
      tl.fromTo("#a-bg2", { x: 150, y: 1500, rotation: -20, opacity: 0.55 }, { x: 60, y: 1250, rotation: -26, opacity: 0, duration: 2.6, ease: "sine.inOut" }, 0);
      tl.fromTo("#a-bg3", { x: 780, y: 1560, rotation: 8, opacity: 0.5 }, { x: 860, y: 1380, rotation: 12, opacity: 0, duration: 2.6, ease: "sine.inOut" }, 0);
      // headline 1, word by word
      // line 1 is on frame 0 (thumbnail hook); the big lines blur in word by word
      tl.fromTo("#a-head1 .a-small .w", { opacity: 1, filter: "blur(0px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.01 }, 0);
      tl.fromTo("#a-head1 .a-big .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.16, ease: "power2.out" }, 0.3);

      // ---------- 2. LOUPE (2.45 – 6.75) ----------
      const stops = [
        { t: 2.95, lx: 380, cy: -29 },
        { t: 4.05, lx: 700, cy: -669 },
        { t: 5.15, lx: 361, cy: -1338 },
        { t: 6.25, lx: 686, cy: -1965 },
      ];
      P.forEach((k) => {
        tl.to(".p-" + k, { rotation: "+=2", duration: 4.1, ease: "none" }, 2.7);
      });
      tl.fromTo("#a-stage", { "--lr": "0px", "--ringo": 0 }, { "--lr": "180px", "--ringo": 1, duration: 0.5, ease: "expo.out" }, 2.45);
      tl.to(cams, { y: stops[0].cy, duration: 0.95, ease: "sine.inOut" }, 2.0);
      for (let i = 1; i < stops.length; i++) {
        tl.to(cams, { y: stops[i].cy, duration: 1.1, ease: "sine.inOut" }, stops[i - 1].t);
        tl.to("#a-stage", { "--lx": stops[i].lx + "px", duration: 0.8, ease: "power2.inOut" }, stops[i - 1].t + 0.22);
      }
      for (let i = 0; i < 4; i++) {
        const t = stops[i].t;
        const sel = "#a-tag" + (i + 1) + " .w";
        tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.07, ease: "power2.out" }, t - 0.18);
        tl.to(sel, { opacity: 0, filter: "blur(6px)", duration: 0.14, stagger: 0.03, ease: "power2.in" }, t + 0.5);
      }

      // ---------- 3. REVEAL / PULL-BACK (6.65 – 9.0) ----------
      tl.to("#a-stage", { "--lr": "1500px", duration: 0.75, ease: "power2.in" }, 6.78);
      tl.to("#a-stage", { "--ringo": 0, duration: 0.3, ease: "power1.in" }, 6.78);
      tl.to("#a-stage", { "--mag": 1, duration: 0.6, ease: "power2.inOut" }, 6.78);
      tl.to(head1, { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.035, ease: "power2.in" }, 6.7);
      tl.to(cams, { y: 0, duration: 1.45, ease: "power3.inOut" }, 6.88);
      P.forEach((k) => {
        tl.to(".p-" + k, { ...pose(S3[k]), duration: 1.45, ease: "power3.inOut" }, 6.88);
      });
      // gentle camera drift keeps the constellation alive while the headline reads
      tl.to(cams, { y: -26, x: 6, duration: 0.72, ease: "sine.in" }, 8.33);
      tl.fromTo(head2, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.12, ease: "power2.out" }, 7.5);

      // ---------- 4. WHIP — zoom through the serum label (9.0 – 9.6) ----------
      const zx = 595.5, zy = 973, zs = 4.4;
      tl.to(head2, { opacity: 0, filter: "blur(8px)", duration: 0.14, stagger: 0.03, ease: "power2.in" }, 8.9);
      tl.to(cams, { x: 540 - zs * zx, y: 960 - zs * zy, scale: zs, duration: 0.55, ease: "power3.in" }, 9.05);
      tl.to("#a-stage", { filter: "blur(18px)", duration: 0.35, ease: "power2.in" }, 9.25);
      tl.to("#a-stage", { opacity: 0, duration: 0.2, ease: "power1.in" }, 9.4);

      window.__timelines["float"] = tl;
    })();
  </script>

          const fill = new Path2D(); b.outer.forEach((r) => { fill.moveTo(r[0] / Q, r[1] / Q); for (let i = 2; i < r.length; i += 2) fill.lineTo(r[i] / Q, r[i + 1] / Q); fill.closePath(); });
          BPATH[c.id] = { fill, rings: ringPaths(b.outer), parts: (b.parts || []).flatMap((pr) => ringPaths(pr)) };
        }
        const LAKES = mkPath((BND.lakes || []));
        const BORDERS = (() => { const p = new Path2D(); for (const r of BND.borders || []) { p.moveTo(r[0] / Q, r[1] / Q); for (let i = 2; i < r.length; i += 2) p.lineTo(r[i] / Q, r[i + 1] / Q); } return p; })();
        function drawBoundary(c, t, k) {
          const B = BPATH[c.id]; if (!B) return;
          const on = clamp((t - (c.A - 0.15)) / 1.1), fade = 1 - clamp((t - c.depart) / 0.9);
          if (on <= 0 || fade <= 0) return;
          const draw = 1 - Math.pow(1 - on, 3);
          ctx.globalAlpha = fade;
          ctx.fillStyle = `rgba(172,198,231,${(0.26 * clamp((t - (c.A + 0.2)) / 0.6)).toFixed(3)})`; ctx.fill(B.fill, "evenodd");
          ctx.lineJoin = "round"; ctx.lineCap = "round";
          for (const part of B.parts) { ctx.setLineDash([]); ctx.strokeStyle = `rgba(251,252,254,${(0.45 * clamp((t - (c.A + 0.5)) / 0.5)).toFixed(3)})`; ctx.lineWidth = 1 / k; ctx.stroke(part.p); }
          for (const r of B.rings) {
            ctx.setLineDash([r.L * draw, r.L * 2]);
            ctx.strokeStyle = "rgba(14,30,54,0.55)"; ctx.lineWidth = 6.5 / k; ctx.stroke(r.p);
            ctx.strokeStyle = "#FBFCFE"; ctx.lineWidth = 2.6 / k; ctx.stroke(r.p);
          }
          ctx.setLineDash([]); ctx.globalAlpha = 1;
        }
        // assets to wait for before a frame is captured
        function framePromises(t) {
          const C = cam(t), k = W / C.w, need = [];
          for (const [z, x, y] of tilesFor(C, k)) { const key = `${z}/${x}/${y}`; if (TILESET.has(key)) need.push(img(`assets/tiles/${key}.webp`)); }
          for (const c of CITY) if (satAlpha(c, C, k) > 0) need.push(img(SAT[c.id].file));
          return need.filter((e) => !e.ok).map((e) => e.p);
        }
        const kNatPre0 = W / PL.NATIONAL.w;

        function renderAt(t) {
          const C = cam(t), k = W / C.w, tx = W / 2 - C.ux * k, ty = H / 2 - C.uy * k;

          // relief basemap (tiles) -----------------------------------------------------------
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#1F4E86"; ctx.fillRect(0, 0, W, H);
          for (const [z, x, y] of tilesFor(C, k)) drawTile(z, x, y, k, tx, ty, null);
          // relief-mode overlays: lakes, a light veil over neighbouring countries, land borders (all fade out up close)
          ctx.setTransform(k, 0, 0, k, tx, ty);
          const far = 1 - clamp((k - 2.2) / 3);
          ctx.fillStyle = "rgba(92,166,204,0.95)"; ctx.fill(LAKES);
          if (far > 0) {
            ctx.globalAlpha = far;
            ctx.fillStyle = "rgba(236,242,248,0.20)"; ctx.fill(PATH.other);
            ctx.strokeStyle = "rgba(251,252,254,0.55)"; ctx.lineWidth = 1.1 / k; ctx.setLineDash([4 / k, 3 / k]); ctx.stroke(BORDERS); ctx.setLineDash([]);
            ctx.globalAlpha = 1;
          }
          // cloud shadows on the ground
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          drawClouds(C, k, t, true);
          // Sentinel-2 close-ups crossfade in during each descent
          for (const c of CITY) {
            const sa = satAlpha(c, C, k); if (sa <= 0) continue;
            const s = SAT[c.id], e = img(s.file); if (!e.ok) continue;
            const [X0, Y0, X1, Y1] = s.world;
            ctx.globalAlpha = sa; ctx.drawImage(e.im, X0 * k + tx, Y0 * k + ty, (X1 - X0) * k, (Y1 - Y0) * k); ctx.globalAlpha = 1;
          }
          // atmospheric haze grows with altitude
          const alt = clamp(Math.log(40 / k) / Math.log(40 / kNatPre0));
          ctx.fillStyle = `rgba(200,220,242,${(0.10 * alt).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
          // official boundaries
          ctx.setTransform(k, 0, 0, k, tx, ty);
          for (const c of CITY) drawBoundary(c, t, k);

          // opening light trace along Java toward East Java
          const lt0 = 1.15, lt1 = 3.15;
          if (t > lt0 && t < 3.9) {
            const h = travelEase((t - lt0) / (lt1 - lt0)), tail = Math.max(0, h - 0.32), fade = 1 - clamp((t - 3.3) / 0.6);
            ctx.lineCap = "round";
            ctx.globalAlpha = 0.45 * fade; ctx.strokeStyle = "#CBDBF4"; ctx.lineWidth = 7 / k; strokeCurve(javaTrace.a, javaTrace.c, javaTrace.b, tail, h, k);
            ctx.globalAlpha = 0.95 * fade; ctx.strokeStyle = "#FBFCFE"; ctx.lineWidth = 2.2 / k; strokeCurve(javaTrace.a, javaTrace.c, javaTrace.b, Math.max(tail, h - 0.12), h, k);
            ctx.globalAlpha = 1;
          }

          // sequence trails (dashed when complete), leading point = next locator ring
          ctx.lineCap = "round";
          for (const r of PL.routes) {
            const p = travelEase((t - r.t0) / (r.t1 - r.t0));
            if (p <= 0) continue;
            const [u0, u1] = trimRoute(r, k), pe = u0 + (u1 - u0) * p;
            ctx.setLineDash([]); ctx.strokeStyle = "rgba(10,24,44,0.35)"; ctx.lineWidth = 4 / k;
            strokeCurve(r.a, r.c, r.b, u0, pe, k);
            ctx.setLineDash([7 / k, 6 / k]); ctx.strokeStyle = "rgba(251,252,254,0.85)"; ctx.lineWidth = 1.7 / k;
            strokeCurve(r.a, r.c, r.b, u0, pe, k);
            ctx.setLineDash([]);
            if (p < 1) { ctx.strokeStyle = "#FBFCFE"; ctx.lineWidth = 2.6 / k; strokeCurve(r.a, r.c, r.b, Math.max(u0, pe - 0.14), pe, k); }
          }
          // locator rings at route tips / opening trace tip, until the marker lands
          for (const c of CITY) {
            const r = PL.routes.find((q) => q.to === c.id);
            const appear = r ? r.t1 - 0.25 : 3.0;
            if (t < appear || t > c.A + 0.15) continue;
            const a = clamp((t - appear) / 0.25) * (1 - clamp((t - (c.A - 0.1)) / 0.25));
            const tu = r ? trimRoute(r, k) : null;
            const tip = r ? qpt(r.a, r.c, r.b, tu[0] + (tu[1] - tu[0]) * travelEase((t - r.t0) / (r.t1 - r.t0))) : c.w;
            ring(tip[0], tip[1], 7, k, a);
            // gentle locator pulse (one or two, finite)
            const pulseStart = c.id === "bandung" ? 52.55 : appear + 0.1;
            for (let n = 0; n < (c.island ? 0 : c.id === "bandung" ? 2 : 1); n++) {
              const u = (t - (pulseStart + n * 1.0)) / 1.0;
              if (u > 0 && u < 1) { ctx.globalAlpha = 0.8 * (1 - u) * a; ctx.beginPath(); ctx.arc(c.w[0], c.w[1], (8 + 30 * cubicOut(u)) / k, 0, Math.PI * 2); ctx.lineWidth = 1.8 / k; ctx.strokeStyle = "#FBFCFE"; ctx.stroke(); ctx.globalAlpha = 1; }
            }
          }
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          drawClouds(C, k, t, false);

          // ---------- overlay ----------
          const zf = clamp((1.7 * kNat - k) / (0.6 * kNat));
          const sizeF = 0.8 + 0.2 * clamp(Math.log(k / kNat) / Math.log(8));
          CITY.forEach((c, i) => {
            const x = c.w[0] * k + tx, y = c.w[1] * k + ty;
            const u = (t - (c.A - 0.2)) / 0.55;
            if (u <= 0) { c.g.setAttribute("opacity", 0); c.lg.setAttribute("opacity", 0); return; }
            const land = expoOut(clamp(u)), visited = clamp((t - (c.depart - 0.3)) / 0.5);
            const dy = -18 * (1 - land);
            c.g.setAttribute("opacity", clamp(u * 3).toFixed(3));
            c.g.setAttribute("transform", `translate(${x.toFixed(2)} ${(y + dy).toFixed(2)})`);
            const activeR = c.island ? 0 : 9.5;
            const visR = c.island ? 7.5 : 6.5;
            let r = (activeR + (visR - activeR) * sineIO(visited)) * sizeF * (0.4 + 0.6 * land);
            if (c.island && visited <= 0) r = 0;
            c.dot.setAttribute("r", Math.max(0, r).toFixed(2));
            c.dot.setAttribute("opacity", c.island ? visited.toFixed(3) : 1);
            c.halo.setAttribute("opacity", c.island ? 0 : ((1 - visited) * land).toFixed(3));
            const pu = (t - (c.A + 0.1)) / 0.9;
            if (!c.island && pu > 0 && pu < 1) { c.pulse.setAttribute("r", (10 + 40 * cubicOut(pu)).toFixed(2)); c.pulse.setAttribute("opacity", (0.6 * (1 - pu)).toFixed(3)); }
            else c.pulse.setAttribute("opacity", 0);
            // national-view labels with leader lines
            let la = 0;
            for (const o of PL.overviews) la = Math.max(la, windowAlpha(t, o.labelsFrom + i * 0.07, o.labelsTo, 0.35, 0.35));
            la *= zf * (t >= c.depart ? 1 : 0);
            c.lg.setAttribute("opacity", la.toFixed(3));
            if (la > 0) {
              const [ox, oy, anchor] = c.off, L = Math.hypot(ox, oy);
              const sx = x + (ox / L) * 11, sy = y + (oy / L) * 11, ex = x + ox, ey = y + oy;
              c.lead.setAttribute("d", `M${sx.toFixed(1)} ${sy.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}`);
              const lx = ex + (anchor === "start" ? 8 : anchor === "end" ? -8 : 0), ly = ey + (oy < 0 ? -8 : oy > 30 ? 26 : 8);
              c.txt.setAttribute("x", lx.toFixed(1)); c.txt.setAttribute("y", ly.toFixed(1));
            }
          });
          const ia = zf * Math.max(windowAlpha(t, -1, 3.2, 0.4, 0.5), windowAlpha(t, 50.1, 53.1, 0.5, 0.4), windowAlpha(t, 79.25, 999, 0.6, 0.4));
          indo.setAttribute("opacity", (0.82 * ia).toFixed(3));
          indo.setAttribute("x", (indoW[0] * k + tx).toFixed(1)); indo.setAttribute("y", (indoW[1] * k + ty).toFixed(1));
        }

        window.addEventListener("hf-seek", (e) => {
          const t = e.detail.time;
          renderAt(t);
          const p = framePromises(t);
          if (p.length && e.detail.waitUntil) e.detail.waitUntil(Promise.all(p).then(() => renderAt(t)));
        });
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["mj-map"] = Promise.all([...CLOUD_SPR, ...SHADOW_SPR].map((e) => e.p).concat(framePromises(0))).then(() => renderAt(0));
        window.__mjRender = renderAt;
        window.__mjCam = cam;
        const proxy = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(proxy, { t: PL.duration, duration: PL.duration, ease: "none", onUpdate: () => renderAt(proxy.t) }, 0);
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Retur Juga Harus Dicatat</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's U-shaped track in 3D: a navy KIRIM lane out, a yellow RETUR lane curving back like a boomerang, one parcel
     (RETUR sticker) whirling round the far end, one already landed on the dashed retur mat. No numbers. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 0; width: 1080px; top: 372px; text-align: center; font: 800 210px/0.92 Rubik; letter-spacing: -6px; color: #fff; white-space: nowrap; }
  #t1b { position: absolute; left: 0; width: 1080px; top: 580px; text-align: center; font: 800 112px/1 Rubik; letter-spacing: -3px; white-space: nowrap; }
  #t1b span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 82%; padding: 0 .1em; }
  #t2 { position: absolute; left: 0; width: 1080px; top: 724px; text-align: center; font: italic 400 54px/1.1 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: 40px; top: 860px; width: 1000px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.16), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 520px 1150px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  #ff { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform: rotateX(90deg); }
  #ff svg { position: absolute; left: -600px; top: -900px; width: 1200px; height: 1400px; overflow: visible; }
  .pkt { background: linear-gradient(90deg, #E9CF9C 0 41%, #26367A 41% 59%, #E9CF9C 59%); box-shadow: inset 0 0 0 3px rgba(150,110,50,.25); }
  .pkf { background: linear-gradient(90deg, #D9B57B 0 41%, #2b3d8c 41% 59%, #D9B57B 59%); box-shadow: inset 0 0 0 3px rgba(130,90,40,.22); }
  .pkb { background: #D1AC70; }
  .pks { background: linear-gradient(180deg, #C9A266, #BB945A); box-shadow: inset 0 0 0 3px rgba(120,80,30,.2); }
  .stk { position: absolute; left: 50%; top: 50%; border-radius: 10px; background: #FED111; box-shadow: 0 0 0 4px #212C5F; font: 800 30px/1 Rubik; letter-spacing: .08em; color: #212C5F; text-align: center; transform: translate(-50%, -50%); padding: 10px 14px 9px; white-space: nowrap; }
  .sh { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(3,6,24,.55), rgba(3,6,24,0)); }
  #t3 { position: absolute; left: 56px; top: 1530px; display: inline-flex; align-items: center; gap: 14px; padding: 20px 30px; border-radius: 999px; background: #fff; font: 700 34px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-3deg); box-shadow: 0 20px 40px rgba(3,6,24,.35); }
  #t3 i { flex: none; width: 46px; height: 46px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  #t3 svg { width: 28px; height: 28px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">RETUR</div>
  <div id="t1b"><span>juga dicatat?</span></div>
  <div id="t2">paket balik, uangnya juga balik</div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <div id="t3"><i><svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></i>Biar penjualan nggak kegedean</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // camera: like the film's yard key, a little lower and closer
  w.style.transform = "translate3d(500px, 1250px, 0px) rotateX(-30deg) rotateY(-10deg)";
  const ff = mk("div", "", w); ff.id = "ff";
  ff.innerHTML = `<svg viewBox="-600 -900 1200 1400" xmlns="http://www.w3.org/2000/svg">
    <path d="M -190 330 L -190 -420 A 190 190 0 0 1 190 -420 L 190 330" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="170" stroke-linecap="round"/>
    <rect x="65" y="140" width="250" height="200" rx="28" fill="rgba(254,209,17,.14)" stroke="#E2B400" stroke-width="6" stroke-dasharray="20 13"/>
    <path d="M -190 250 L -190 -380" fill="none" stroke="#8E99C2" stroke-width="18" stroke-linecap="round"/>
    <polygon points="-190,-446 -236,-366 -144,-366" fill="#8E99C2"/>
    <path d="M -190 -420 A 190 190 0 0 1 190 -420 L 190 60" fill="none" stroke="#E2B400" stroke-width="34" stroke-linecap="round"/>
    <path d="M -190 -420 A 190 190 0 0 1 190 -420 L 190 60" fill="none" stroke="#FED111" stroke-width="24" stroke-linecap="round"/>
    <polygon points="190,146 244,52 136,52" fill="#FED111" stroke="#E2B400" stroke-width="6" stroke-linejoin="round"/>
    <text x="-300" y="-60" text-anchor="middle" transform="rotate(-90 -300 -60)" style="font: 800 66px Rubik; letter-spacing: 8px" fill="rgba(221,225,238,.55)">KIRIM</text>
    <text x="300" y="-60" text-anchor="middle" transform="rotate(-90 300 -60)" style="font: 800 66px Rubik; letter-spacing: 8px" fill="#FED111">RETUR</text>
  </svg>`;
  function parcel(W, H, D, x, y, z, ry, rz, sticker) {
    const g = mk("div", "g3", w); g.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${ry}deg) rotateZ(${rz}deg)`;
    const F = (cls, wd, ht, tr, html) => { const e = mk("div", "pl " + cls, g, `left:${-wd / 2}px; top:${-ht / 2}px; width:${wd}px; height:${ht}px; transform:${tr};`); if (html) e.innerHTML = html; return e; };
    F("pkb", W, H, `translate3d(0px, 0px, ${-D / 2}px) rotateY(180deg)`);
    F("pks", D, H, `translate3d(${-W / 2}px, 0px, 0px) rotateY(-90deg)`);
    F("pks", D, H, `translate3d(${W / 2}px, 0px, 0px) rotateY(90deg)`);
    F("pkt", W, D, `translate3d(0px, ${-H / 2}px, 0px) rotateX(90deg)`, sticker ? '<b class="stk">RETUR</b>' : "");
    F("pkf", W, H, `translate3d(0px, 0px, ${D / 2}px)`, sticker ? '<b class="stk">RETUR</b>' : "");
    return g;
  }
  // shadows on the floor plane
  const sh = (x, z, r, o) => mk("div", "sh", ff, `left:${x - r}px; top:${z - r}px; width:${2 * r}px; height:${2 * r}px; opacity:${o};`);
  sh(20, -560, 120, 0.5); sh(190, 236, 110, 0.9);
  // the boomerang parcel whirling round the far end + one landed on the retur mat
  parcel(170, 128, 170, 20, -175, -560, -28, -12, true);
  parcel(150, 112, 150, 190, -59, 236, 14, 0, true);
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: nothing wider than the frame safe width
    document.querySelectorAll("#t1, #t1b span, #t2, #t3").forEach((e) => { const b = e.getBoundingClientRect(); const rg = document.createRange(); rg.selectNodeContents(e); const q = rg.getBoundingClientRect(); if (q.left < 60 || q.right > 1020) console.log("pageerror TEXT OUTSIDE SAFE", e.id, Math.round(q.left), Math.round(q.right)); });
    r.render({ x: 940, y: 1590, h: 600, yaw: -24, roll: 0, headYaw: -22, headPitch: -18, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 162, fwd: 18, bend: 10, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.9, happy: 0, smile: 1, o: 0.35 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

  <script>
    (function () {
      // s02 "Soalnya, kamu udah ngelamar ke puluhan lowongan, tapi nggak pernah dikasih tahu kenapa ditolak."
      // FRAME 0 = s01's end (stamped CV, "7× ditolak" pill, spot). "Soalnya,": the CV straightens and shrinks into the first slot of an

      // ("Mohon maaf, kamu belum lolos…") · "kenapa": its "Alasan:" field stays empty — a big "?" pops in it · "ditolak.": the "?" shakes.
      // OUT (last 0.34 s): the whole board pushes up and away (s03 rises in from below).
      const SC = window.VO_SCENES.find((s) => s.id === "s02");
      const D = SC.dur, ST = SC.start, VW = window.VO_WORDS, K = window.CVK;
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= after); return w ? w[1] : 0; };
      const L = (txt) => wt(txt, ST - 0.05) - ST;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const KF = (el, init, steps) => { I(el, init); const cur = Object.assign({}, init);
        steps.sort((a, b) => a[0] - b[0]).forEach(([t, d, to, ease]) => { const fr = {}; for (const k in to) fr[k] = cur[k];
          if (d <= 0) tl.set(el, to, t); else ft(el, fr, Object.assign({ duration: d, ease: ease || "power3.out" }, to), t); Object.assign(cur, to); }); };

      $("s02-zone").insertAdjacentHTML("afterbegin", `<style>${K.css("s02")}</style>`);
      $("s02-cvw").innerHTML = K.cv("s02", "cv", 1);
      $("s02-cv-st").innerHTML = K.stamps("s02", "cv");
      $("s02-pill").querySelector("i").innerHTML = K.isvg("x", 3);
      $("s02-hd").querySelector("i").innerHTML = K.isvg("mail", 2.2);
      $("s02-et").innerHTML = K.isvg("mail-x", 2.2);

      const tSoa = L("Soalnya,"), tNge = L("ngelamar"), tPul = L("puluhan"), tLow = L("lowongan,"), tTap = L("tapi"), tNgg = L("nggak"),
            tDik = L("dikasih"), tTah = L("tahu"), tKen = L("kenapa"), tDit = L("ditolak.");
      const OUT = D - 0.36;

      // ---------------------------------------------------------------- 0) s01's end state, then the CV becomes application #1
      const cv = $("s02-cv"), pill = $("s02-pill"), spot = $("s02-spot");
      const G = { x0: 46, y0: 118, w: 136, h: 70, gx: 12, gy: 10 };   // tile grid inside the board (board-local)
      const tileXY = (i) => { const c = i % 6, r = Math.floor(i / 6); return [60 + G.x0 + c * (G.w + G.gx), 322 + G.y0 + r * (G.h + G.gy)]; };   // frame coords (top-left)
      const [t0x, t0y] = tileXY(0);
      K.STAMPS.forEach(([x, y, r], i) => I($("s02-cv-s" + i), { x, y, rotation: r, scale: 1, opacity: 1 }));
      KF(cv, { x: 540, y: 722, scale: 0.75, rotationX: 10, transformPerspective: 1400, rotation: 0, opacity: 1 }, [
        [tSoa - 0.1, 0.5, { rotationX: 0, scale: 0.6, y: 690 }, "power2.inOut"],
        [tSoa + 0.4, 0.55, { x: t0x + 68, y: t0y + 35, scale: 0.13, rotation: -6 }, "power3.inOut"],
        [tSoa + 0.85, 0.12, { opacity: 0 }, "none"]]);
      KF(pill, { opacity: 1, scale: 1, x: 0 }, [[tSoa - 0.1, 0.3, { opacity: 0, scale: 0.6, x: 30 }, "power2.in"]]);
      KF(spot, { opacity: 1 }, [[tSoa, 0.6, { opacity: 0 }, "power1.out"]]);

      // ---------------------------------------------------------------- 1) the board + 36 tiles + the counter
      const bd = $("s02-bd");
      KF(bd, { opacity: 0, y: 40, scale: 0.96 }, [[tSoa + 0.05, 0.5, { opacity: 1, y: 0, scale: 1 }, "power3.out"],
        [OUT, 0.34, { y: -40, opacity: 0, scale: 0.9 }, "power2.in"]]);
      const hd = $("s02-hd"), ct = $("s02-ct");
      KF(hd, { opacity: 0, x: -24 }, [[tSoa + 0.25, 0.35, { opacity: 1, x: 0 }]]);
      KF(ct, { opacity: 0, x: 24 }, [[tSoa + 0.3, 0.35, { opacity: 1, x: 0 }]]);
      const COL = ["#01ccf7", "#9d8cff", "#ffb35c", "#3ddc97", "#ff8f6b", "#5ec8ff", "#ffd66b", "#ff9ec0"];
      const LET = "BKSTMPAGDRJLNWCHIEFOUYVZ";
      let seed = 11; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      const tiles = $("s02-tiles"); let html = "";
      for (let i = 0; i < 36; i++) html += `<div class="s02-a s02-t" id="s02-t${i}"><div class="q" style="background:${COL[Math.floor(rnd() * 8)]}">${LET[Math.floor(rnd() * LET.length)]}</div>` +
        `<i class="l1" style="width:${44 + Math.floor(rnd() * 24)}px"></i><i class="l2" style="width:${28 + Math.floor(rnd() * 22)}px"></i><i class="dt"></i><i class="xx">${K.isvg("x", 3.4)}</i><i class="dim"></i></div>`;
      tiles.innerHTML = html;
      const tS = tSoa + 0.85, tE = tLow + 0.4;       // tiles pop in from the CV's slot onward
      const tF0 = tTap - 0.05, tF1 = tTah - 0.05;    // the rejection wave
      for (let i = 0; i < 36; i++) {
        const t = $("s02-t" + i), c = i % 6, r = Math.floor(i / 6), ti = tS + (tE - tS) * (i / 35);
        const xx = t.querySelector(".xx"), dt = t.querySelector(".dt"), dm = t.querySelector(".dim");
        const tf = tF0 + (tF1 - tF0) * ((c + r) / 10);
        KF(t, { x: G.x0 + c * (G.w + G.gx), y: G.y0 + r * (G.h + G.gy), scale: 0.3, opacity: 0, scaleY: 0.3, scaleX: 0.3 }, [

        tl.set(dt, { opacity: 1 }, 0); tl.set(dt, { opacity: 0 }, tf + 0.09);
        tl.set(xx, { opacity: 0 }, 0); tl.set(xx, { opacity: 1 }, tf + 0.09);
        tl.set(dm, { opacity: 0 }, 0); tl.set(dm, { opacity: 1 }, tf + 0.09);
      }
      // TERKIRIM counter 0→36 (per-value sets), then the label turns to DITOLAK (coral)
      const ctn = $("s02-ctn"); ctn.innerHTML = Array.from({ length: 37 }, (_, n) => `<b id="s02-n${n}">${n}</b>`).join("");
      for (let n = 0; n <= 36; n++) { const b = $("s02-n" + n), on = n === 0 ? 0 : tS + (tE - tS) * ((n - 1) / 35) + 0.05, off = n === 36 ? 99 : tS + (tE - tS) * (n / 35) + 0.05;
        tl.set(b, { opacity: 0 }, 0); if (on < 99) tl.set(b, { opacity: 1 }, n === 0 ? tSoa + 0.3 : on); if (off < 50) tl.set(b, { opacity: 0 }, off); }
      const ctl = $("s02-ctl"), n36 = $("s02-n36");
      KF(n36, { scale: 1, color: "#01ccf7" }, [[tE + 0.06, 0.12, { scale: 1.18 }, "power2.out"], [tE + 0.18, 0.2, { scale: 1 }, "power2.out"],
        [tF1 - 0.1, 0.2, { color: "#ff6b70" }, "power1.out"]]);
      KF(ctl, { opacity: 1 }, [[tF1 - 0.1, 0.15, { opacity: 0 }, "power1.out"]]);
      KF($("s02-ctl2"), { opacity: 0 }, [[tF1 - 0.05, 0.2, { opacity: 1 }, "power1.out"]]);

      // ---------------------------------------------------------------- 2) the rejection email + the empty "Alasan"
      const em = $("s02-em"), bx = $("s02-bx"), q = $("s02-q"), kos = $("s02-kos");
      KF(em, { opacity: 0, y: 220, rotation: 3, scale: 0.92 }, [[tDik - 0.22, 0.12, { opacity: 1 }, "none"], [tDik - 0.22, 0.5, { y: 0, rotation: 0, scale: 1 }, "back.out(1.3)"],
        [OUT, 0.34, { y: -40, opacity: 0, scale: 0.9 }, "power2.in"]]);
      KF($("s02-bdim"), { opacity: 0 }, [[tDik - 0.2, 0.4, { opacity: 1 }, "power1.out"]]);
      ["s02-et", "s02-e1", "s02-e2", "s02-e3", "s02-e4"].forEach((id, i) => KF($(id), { opacity: 0, x: -20 }, [[tDik + 0.02 + i * 0.05, 0.3, { opacity: 1, x: 0 }]]));
      KF(bx, { opacity: 0, scaleX: 0.6 }, [[tTah, 0.3, { opacity: 1, scaleX: 1 }, "power3.out"]]);
      I(bx, { transformOrigin: "0% 50%" });
      KF(kos, { opacity: 0 }, [[tTah + 0.2, 0.25, { opacity: 1 }, "power1.out"], [tKen - 0.06, 0.12, { opacity: 0 }, "power1.in"]]);
      KF(q, { opacity: 0, scale: 2.6, rotation: -20 }, [[tKen - 0.04, 0.08, { opacity: 1 }, "none"], [tKen - 0.04, 0.34, { scale: 1, rotation: 0 }, "back.out(2.6)"]]);
      const wig = []; for (let k = 0; k < 6; k++) wig.push([tDit + 0.02 + k * 0.06, 0.06, { rotation: k % 2 ? -10 : 10 }, "sine.inOut"]);
      wig.push([tDit + 0.38, 0.12, { rotation: 0 }, "sine.out"]);
      KF(q, { rotation: 0 }, wig);
      KF(bx, { boxShadow: "0 0 0 0 rgba(229,72,77,0)" }, [[tKen, 0.25, { boxShadow: "0 0 0 6px rgba(229,72,77,.25)" }, "power2.out"]]);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};

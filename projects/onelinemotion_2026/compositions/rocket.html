          else if (inn(finT, x, y) || inn(finB, x, y)) c = "#d8343a"; else if (inn(noz, x, y)) c = "#5b6478";
          if (c) cells[gx + "," + gy] = c;
        }
        svg.removeChild(probe);
        let m = "";
        for (const k in cells) { const [gx, gy] = k.split(",").map(Number); const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => !cells[(gx + a) + "," + (gy + b)]);
          m += `<rect x="${gx * Z - Z / 2}" y="${gy * Z - Z / 2}" width="${Z}" height="${Z}" fill="${edge && cells[k] !== "#1e2a55" ? "#1a1030" : cells[k]}"/>`; }
        variant("pixel", `<g class="pxfl"></g>` + m);
        FL.pixel.px = V.pixel.querySelector(".pxfl");
      }

      // ---------------------------------------------------------------- per-frame
      const fmt = (v) => v.toFixed(1);
      const smoothD = (p) => {
        if (p.length < 2) return "";
        let d = `M${fmt(p[0].x)},${fmt(p[0].y)}`;
        for (let i = 0; i < p.length - 1; i++) {
          const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
          d += `C${fmt(p1.x + (p2.x - p0.x) / 6)},${fmt(p1.y + (p2.y - p0.y) / 6)} ${fmt(p2.x - (p3.x - p1.x) / 6)},${fmt(p2.y - (p3.y - p1.y) / 6)} ${fmt(p2.x)},${fmt(p2.y)}`;
        }
        return d;
      };
      // resample a polyline every `step` px: [{x,y,age}]
      const resample = (p, step) => {
        const out = []; if (p.length < 2) return out;
        let total = 0; for (let i = 1; i < p.length; i++) total += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
        if (total < 1e-3) return out;
        let dist = 0, next = 0;
        for (let i = 1; i < p.length; i++) {
          const ax = p[i - 1].x, ay = p[i - 1].y, bx = p[i].x, by = p[i].y, seg = Math.hypot(bx - ax, by - ay); if (seg < 1e-6) continue;
          while (next <= dist + seg) { const u = (next - dist) / seg; out.push({ x: L(ax, bx, u), y: L(ay, by, u), age: next / total, nx: -(by - ay) / seg, ny: (bx - ax) / seg }); next += step; }
          dist += seg;
        }
        return out;
      };
      let curStyle = null;
      function draw(t) {
        const o = F.state(t);
        if (!o.vis) { ship.setAttribute("style", "display:none"); trailRoot.setAttribute("style", "display:none"); ring.setAttribute("opacity", 0); return; }
        ship.removeAttribute("style"); trailRoot.removeAttribute("style");
        const wi = F.worldAt(t), st = wi >= 0 && t < F.T.wEnd ? STY[wi + 1] : "brand";
        if (st !== curStyle) { for (const k of STY) { V[k].setAttribute("style", k === st ? "" : "display:none"); TR[k].g.setAttribute("style", k === st ? "" : "display:none"); } curStyle = st; }
        halo.setAttribute("style", st === "brand" ? "" : "display:none");
        // pop + ring when the style switches (world cuts)
        let pop = 0, rt = -1;
        if (wi >= 0) { const s0 = window.VO_SCENES.find((s) => s.id === F.WIDS[wi]).start; rt = t - s0; }
        else if (t >= F.T.wEnd && t < F.T.wEnd + 0.6) rt = t - F.T.wEnd;
        if (rt >= 0 && rt < 0.5) { pop = Math.sin(Math.PI * one(rt / 0.32)) * (rt < 0.32 ? 1 : 0);
          const u = one(rt / 0.45); ring.setAttribute("cx", fmt(o.x)); ring.setAttribute("cy", fmt(o.y)); ring.setAttribute("r", fmt(L(70, 300, 1 - Math.pow(1 - u, 3)) * o.s));
          ring.setAttribute("stroke", ACCENT[st]); ring.setAttribute("stroke-width", fmt(L(14, 2, u))); ring.setAttribute("opacity", fmt(0.9 * (1 - u))); }
        else ring.setAttribute("opacity", 0);
        // stickman boil (12 fps), pixel snapping
        let jx = 0, jy = 0, rot = o.rot, x = o.x, y = o.y;
        if (st === "stick") { const f = Math.floor(t * 12); jx = (hash(f) - 0.5) * 2.4; jy = (hash(f + 33) - 0.5) * 2.4; rot += (hash(f + 77) - 0.5) * 1.6; }
        if (st === "pixel") { x = Math.round(x / 6) * 6; y = Math.round(y / 6) * 6; rot = Math.round(rot / 7.5) * 7.5; }
        const sc = o.s * (1 + 0.16 * pop);
        ship.setAttribute("transform", `translate(${fmt(x + jx)} ${fmt(y + jy)}) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(4)})`);
        // flame
        const fl = Math.max(0.2, o.flame) * (1 + 0.12 * noise(t * 14, 3) + 0.06 * Math.sin(t * 61));
        const len = 46 + 52 * fl, h = 21 + 3 * Math.sin(t * 47);
        const fpath = (l, hh, x0 = -154) => `M ${x0},${-hh} C ${x0 - l * 0.38},${-hh * 1.12} ${x0 - l * 0.82},${-hh * 0.34} ${x0 - l},0 C ${x0 - l * 0.82},${hh * 0.34} ${x0 - l * 0.38},${hh * 1.12} ${x0},${hh} Z`;
        const f = FL[st];
        if (st === "comic" || st === "poly") {
          const n = 7, pts = []; for (let i = 0; i <= n; i++) { const a = i / n, r = i % 2 ? 0.55 : 1; pts.push([-154 - len * Math.sin(Math.PI * a) * r * (0.75 + 0.25 * Math.sin(t * 40 + i)), (a - 0.5) * 2 * h * 1.15]); }
          const d = "M -154," + (-h) + " " + pts.map((p) => `L ${fmt(p[0])},${fmt(p[1])}`).join(" ") + " Z";
          f.o.setAttribute("d", d); f.i.setAttribute("d", fpath(len * 0.5, h * 0.5));
        } else if (st === "pixel") {
          let m = ""; const Z = 12, cols = ["#fff27a", "#ffb238", "#ff6a2b", "#c8321e"]; const n = Math.round(len / Z);
          for (let i = 0; i < n; i++) { const span = Math.max(0, Math.round((1 - i / n) * 2.2 + (hash(Math.floor(t * 15) * 13 + i) > 0.6 ? 1 : 0))); for (let j = -span; j <= span; j++) m += `<rect x="${-162 - i * Z - Z / 2}" y="${j * Z - Z / 2}" width="${Z}" height="${Z}" fill="${cols[Math.min(3, Math.floor((i / n) * 4 + Math.abs(j) * 0.6))]}"/>`; }
          f.px.innerHTML = m;
        } else if (st === "stick") {
          const w = (k) => `M -156,${k * 8} q ${-len * 0.3},${-6 + 4 * Math.sin(t * 30 + k)} ${-len * 0.55},0 t ${-len * 0.45},0`;
          f.o.setAttribute("d", w(-1) + " " + w(1)); f.i.setAttribute("d", w(0));
        } else {
          f.o.setAttribute("d", fpath(len, h)); f.i.setAttribute("d", fpath(len * 0.55, h * 0.55));
          if (st === "neon" && f.x) f.x.setAttribute("d", fpath(len * 1.15, h * 1.3));
          if (st === "cine" && f.x) { f.x.setAttribute("rx", fmt(90 + 50 * fl)); f.x.setAttribute("ry", fmt(48 + 16 * fl)); f.x.setAttribute("cx", fmt(-160 - 30 * fl)); }
        }
        // trail
        const pts = F.trail(t, 64, st === "brand" ? 1.6 : 1.3);
        const tr = TR[st];
        if (pts.length < 2) { for (const p of tr.p) p.setAttribute("d", ""); return; }
        if (pts.length > 1) {
          const a = pts[pts.length - 1], b = pts[0];
          const g = document.getElementById("rk-g-trail"); g.setAttribute("x1", fmt(a.x)); g.setAttribute("y1", fmt(a.y)); g.setAttribute("x2", fmt(b.x)); g.setAttribute("y2", fmt(b.y));
        }
        let P = pts;
        if (st === "stick") { const f2 = Math.floor(t * 12); P = pts.map((p, k) => ({ x: p.x + (hash(f2 * 3.1 + k) - 0.5) * 3, y: p.y + (hash(f2 * 5.7 + k + 50) - 0.5) * 3 })); }
        if (st === "pixel") {
          const Z = 16, seen = {}, d = ["", "", "", ""]; const R = resample(pts, 9);
          for (const q of R) { const gx = Math.round(q.x / Z), gy = Math.round(q.y / Z), k = gx + "," + gy; if (seen[k]) continue; seen[k] = 1;
            const band = Math.min(3, Math.floor(q.age * 5)); if (q.age > 0.35 && hash(gx * 3.3 + gy * 7.7 + Math.floor(t * 10)) < q.age * 0.75) continue;
            d[3 - band] += `M${gx * Z - Z / 2},${gy * Z - Z / 2}h${Z}v${Z}h-${Z}z`; }
          tr.p.forEach((p, i) => p.setAttribute("d", d[i]));
          return;
        }
        if (st === "poly") {
          const R = resample(pts, 30); const d = ["", "", ""];
          for (let i = 0; i < R.length - 1; i++) { const a = R[i], b = R[i + 1], wa = 15 * (1 - 0.55 * a.age), wb = 15 * (1 - 0.55 * b.age);
            const al = [a.x + a.nx * wa, a.y + a.ny * wa], ar = [a.x - a.nx * wa, a.y - a.ny * wa], bl = [b.x + b.nx * wb, b.y + b.ny * wb], br = [b.x - b.nx * wb, b.y - b.ny * wb];
            const T3 = (p, q, r) => `M${fmt(p[0])},${fmt(p[1])}L${fmt(q[0])},${fmt(q[1])}L${fmt(r[0])},${fmt(r[1])}Z`;
            d[i % 2 ? 0 : 2] += T3(al, bl, ar); d[1] += T3(ar, bl, br); }
          tr.p.forEach((p, i) => p.setAttribute("d", d[i]));
          return;
        }
        const dd = smoothD(P);
        tr.p.forEach((p, i) => { if (st === "cine" && i === 3) return; p.setAttribute("d", dd); });
        if (st === "cine") { const R = resample(pts, 34); let m = ""; R.forEach((q, i) => { if (i < 1) return; const tw = hash(i * 9.1 + Math.floor(t * 20)); if (tw < 0.45) return; const r = (1 - q.age) * 3.4 * tw; const ox = (hash(i * 2.7) - 0.5) * 26, oy = (hash(i * 5.3) - 0.5) * 26; m += `M${fmt(q.x + ox - r)},${fmt(q.y + oy)}a${fmt(r)},${fmt(r)} 0 1,0 ${fmt(2 * r)},0a${fmt(r)},${fmt(r)} 0 1,0 ${fmt(-2 * r)},0`; }); tr.p[3].setAttribute("d", m); }
      }
      draw(0);
      window.addEventListener("hf-seek", (e) => draw(e.detail.time + (window.__T0 || 0)));
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true }); tl.set({}, {}, D - 0.02);
      window.__timelines["rocket"] = tl;
    })();
  </script>
</template>

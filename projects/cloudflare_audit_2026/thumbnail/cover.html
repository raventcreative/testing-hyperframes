<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Cloudflare Security Audit Skill</title>
<!-- Minimal IG Reels cover 1080x1920 on the client's navy gradient: one hook, one hero (the s13 glass shield), generous negative
     space, Poppins 700/400 white + cyan #01CCF7 with the crisp white marker. Key content inside the 4:5 grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8768 at project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #090e2e; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .hero { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(hero_shield.png) 0 0 / 1080px 1920px no-repeat;
    transform-origin: 545px 935px; transform: translate(-5px, 320px) scale(0.86);
    -webkit-mask-image: radial-gradient(ellipse 400px 450px at 545px 935px, #000 70%, transparent 100%); mask-image: radial-gradient(ellipse 400px 450px at 545px 935px, #000 70%, transparent 100%); }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 435px; top: 318px; width: 210px; height: auto; opacity: .95; }
  #rule { position: absolute; left: 521px; top: 360px; width: 38px; height: 3px; border-radius: 2px; background: #01ccf7; box-shadow: 0 0 10px rgba(1,204,247,.7); }
  #eyebrow { top: 398px; font: 400 21px/1 Poppins; letter-spacing: 8px; color: rgba(227,237,250,.6); }
  #l1 { top: 462px; font: 400 50px/1.1 Poppins; color: #e3edfa; letter-spacing: -.3px; }
  #l1 b { font-weight: 700; color: #fff; }
  #l2 { top: 548px; font: 700 106px/1 Poppins; letter-spacing: -3px; color: #fff; }
  #l2 .k { display: inline-block; color: #01ccf7; background: #fff; padding: 6px 16px 10px; border-radius: 3px; margin-right: 12px; line-height: 1; }
  .grain { position: absolute; inset: 0; background: url(../assets/brand/grain_256.png); opacity: .06; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 52%, rgba(0,0,0,0) 55%, rgba(4,6,24,.5) 100%); }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div>
  <div class="hero"></div>
  <div class="vig"></div>
  <img id="logo" src="../assets/brand/logo_user_white.png" alt="AI PRENEUR">
  <div id="rule"></div>
  <div id="eyebrow" class="ctr">CLOUDFLARE · SECURITY AUDIT SKILL</div>
  <div id="l1" class="ctr">Website buatan <b>AI</b> kamu</div>
  <div id="l2" class="ctr"><span class="k">aman</span>belum?</div>
  <div class="grain"></div>
</div>
<script>window.COVER_READY = document.fonts.ready.then(() => new Promise((r) => { const i = new Image(); i.onload = r; i.src = "hero_shield.png"; }));</script>
</body>
</html>

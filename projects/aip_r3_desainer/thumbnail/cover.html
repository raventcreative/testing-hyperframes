<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Instagram Agent Skill</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<!-- IG Reels cover 1080x1920 on the client's navy background ("Claude jadi tim konten Instagram kamu"): a "13 skill · gratis ·
     open source" chip, the hook "Claude jadi / TIM KONTEN / Instagram kamu" with the Claude mark, the content TEAM as the reel's ID
     badges on lanyards (compositions/s02.html BADGE COMPONENT, copied 1:1, prefix cv-): the 9 crew badges hang behind, the 4 leads
     (Pemburu Tren /ig-viral, Penulis Naskah /ig-reel, Auditor Profil /ig-profile, Perencana Jadwal /ig-plan) big in front, the
     mascot (host) presenting at bottom-left and the AI PRENEUR robot typing on its holo keyboard at bottom-right.
     Poppins 700/400, white + #01ccf7. Everything that matters sits inside the 4:5 profile-grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8785 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  #g1 { left: 40px; top: 330px; width: 1000px; height: 520px; background: radial-gradient(ellipse, rgba(48,93,143,.40), rgba(48,93,143,0) 66%); }
  #g2 { left: -60px; top: 760px; width: 1200px; height: 560px; background: radial-gradient(ellipse, rgba(1,204,247,.22), rgba(1,204,247,0) 62%); }
  #g3 { left: 140px; top: 1150px; width: 800px; height: 420px; background: radial-gradient(ellipse, rgba(1,204,247,.10), rgba(1,204,247,0) 64%); }
  .grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(../assets/brand/grain_256.png); opacity: .06; z-index: 40; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; filter: drop-shadow(0 2px 8px rgba(4,8,30,.55)); z-index: 30; }
  /* eyebrow chip */
  #chip { top: var(--chipY, 366px); display: flex; justify-content: center; }
  #chip > span { height: 60px; padding: 0 28px 0 7px; border-radius: 30px; display: flex; align-items: center; gap: 15px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.5); font: 700 24px/1 Poppins; letter-spacing: 3.5px; color: #6adfff; }
  #chip b { height: 46px; padding: 0 18px 0 21px; border-radius: 23px; display: flex; align-items: center; background: #01ccf7; color: #0b1440; letter-spacing: 3px;
    box-shadow: 0 0 20px rgba(1,204,247,.5), inset 0 1px 0 rgba(255,255,255,.4); margin-right: 3px; }
  #chip i { width: 7px; height: 7px; border-radius: 50%; background: #6adfff; opacity: .7; }
  /* the hook */
  #l1 { top: var(--l1Y, 446px); display: flex; justify-content: center; align-items: center; gap: 22px; font: 700 80px/1 Poppins; letter-spacing: -2px; color: #fff; text-shadow: 0 6px 22px rgba(4,8,30,.5); }
  #l1 .mk { width: 80px; height: 80px; border-radius: 50%; background: #fbf4ec; position: relative; flex: 0 0 80px;
    box-shadow: 0 0 0 5px rgba(217,119,87,.22), 0 0 34px rgba(217,119,87,.55), 0 10px 22px rgba(0,0,0,.35); }
  #l1 .mk img { position: absolute; left: 13px; top: 13px; width: 54px; height: 54px; }
  #h1 { top: var(--h1Y, 538px); font: 700 var(--h1S, 158px)/1 Poppins; letter-spacing: -6px; color: #fff; text-shadow: 0 8px 26px rgba(4,8,30,.5); }
  #h1 .n { display: inline-block; background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 46%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(0 0 28px rgba(1,204,247,.55)); margin-right: 30px; }
  #l3 { top: var(--l3Y, 692px); font: 400 56px/1 Poppins; letter-spacing: -1px; color: #e3edfa; }
  #l3 b { font-weight: 700; color: #01ccf7; text-shadow: 0 0 22px rgba(1,204,247,.45); }
  /* sparkles */
  #sparks { position: absolute; inset: 0; z-index: 3; }
  .st { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #e3edfa; box-shadow: 0 0 10px rgba(227,237,250,.9); }
  .sp { position: absolute; z-index: 3; filter: drop-shadow(0 0 8px rgba(106,223,255,.8)); }
  /* the team (full-frame layers; a .hang wrapper = badge centre + scale, the badge root swings around its strap top) */
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #crew { z-index: 10; filter: brightness(.84) saturate(.92); }
  #leads { z-index: 12; }
  #lstraps { z-index: 9; filter: brightness(.9); }
  #lstraps .cv-bdg-card, #lstraps .cv-bdg-back, #lstraps .cv-bdg-clip { visibility: hidden; }   /* the leads' lanyards only: they run up behind the crew */
  .hang { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  #floor { position: absolute; left: 70px; top: 1150px; width: 940px; height: 90px; border-radius: 50%; z-index: 9;
    background: radial-gradient(closest-side, rgba(1,204,247,.28), rgba(1,204,247,0)); }
  /* ======================================================================================================================
     BADGE COMPONENT — copied exactly from compositions/s02.html (prefix "s02-" → "cv-")
     ====================================================================================================================== */
    .cv-bdg { position: absolute; left: 0; top: 0; width: 150px; height: 204px; margin: -102px 0 0 -75px; transform-origin: 50% 50%; }
    .cv-bdg-strap { position: absolute; left: 72px; bottom: 188px; width: 6px; height: var(--strap, 120px); border-radius: 3px 3px 0 0; transform-origin: 50% 100%;
      background: linear-gradient(90deg, rgba(0,0,0,.24), rgba(255,255,255,.22) 45%, rgba(0,0,0,.24)), var(--c);
      -webkit-mask-image: linear-gradient(0deg, #000 0, #000 calc(100% - 36px), transparent 100%); mask-image: linear-gradient(0deg, #000 0, #000 calc(100% - 36px), transparent 100%); }
    .cv-bdg-card, .cv-bdg-back { position: absolute; left: 0; top: 0; width: 150px; height: 204px; border-radius: 20px; overflow: hidden; }
    .cv-bdg-card { background: linear-gradient(180deg, #ffffff, #eef3fb); box-shadow: 0 18px 34px -16px rgba(2,6,28,.78), inset 0 0 0 1px rgba(255,255,255,.7); }
    .cv-bdg-band { position: absolute; left: 0; top: 0; width: 150px; height: 54px; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 75%), var(--c); }
    .cv-bdg-slot { position: absolute; left: 58px; top: 12px; width: 34px; height: 8px; border-radius: 4px; background: #0b1440;
      box-shadow: inset 0 2px 2px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.35); }
    .cv-bdg-ic { position: absolute; left: 47px; top: 26px; width: 56px; height: 56px; border-radius: 50%; background: var(--c); color: #ffffff;
      box-shadow: 0 0 0 4px #ffffff, 0 7px 12px -5px rgba(10,13,44,.5); }
    .cv-bdg-ic svg { position: absolute; left: 14px; top: 14px; width: 28px; height: 28px; stroke-width: 2.25; }
    .cv-bdg-role { position: absolute; left: 6px; top: 90px; width: 138px; height: 48px; display: flex; align-items: center; justify-content: center; text-align: center;
      font: 700 19px/23px Poppins, sans-serif; color: #0a0d2c; letter-spacing: -.01em; }
    .cv-bdg-cmd { position: absolute; left: 0; top: 144px; width: 150px; text-align: center; font: 400 17px/22px Poppins, sans-serif; color: #294b77; white-space: nowrap; }
    .cv-bdg-bar { position: absolute; left: 40px; top: 178px; width: 70px; height: 10px; opacity: .26;
      background: repeating-linear-gradient(90deg, #294b77 0 2px, transparent 2px 4px, #294b77 4px 7px, transparent 7px 9px, #294b77 9px 10px, transparent 10px 13px); }
    .cv-bdg-back { opacity: 0; background: linear-gradient(180deg, #1c2b6a, #0f1a4c); box-shadow: 0 18px 34px -16px rgba(2,6,28,.78), inset 0 0 0 1.5px rgba(255,255,255,.12); }
    .cv-bdg-back .cv-bdg-slot { background: #060a24; box-shadow: inset 0 2px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.12); }
    .cv-bdg-no { position: absolute; left: 0; top: 60px; width: 150px; text-align: center; font: 700 66px/76px Poppins, sans-serif; color: #ffffff; letter-spacing: -.02em; }
    .cv-bdg-cbar { position: absolute; left: 51px; top: 148px; width: 48px; height: 6px; border-radius: 3px; background: var(--c); box-shadow: 0 0 12px var(--c); }
    .cv-bdg-clip { position: absolute; left: 68px; top: -7px; width: 14px; height: 24px; border-radius: 4px;
      background: linear-gradient(90deg, #8a9ab6, #f4f7fc 45%, #7d8daa); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
    /* ROUND HEADER text (r1–r4, s07): beside the badge at BDG_HEAD, box x 236–1020, y 320–470 */
    .cv-rh { position: absolute; left: 236px; top: 320px; width: 784px; height: 150px; display: flex; flex-direction: column; justify-content: center; }
    .cv-rh-role { font: 700 52px/62px Poppins, sans-serif; color: #ffffff; letter-spacing: -.015em; white-space: nowrap; }
    .cv-rh-cmd { font: 700 30px/40px Poppins, sans-serif; color: #01ccf7; white-space: nowrap; margin-top: 4px; }
  /* ============================================== END BADGE COMPONENT ============================================== */
  /* robot's holo keyboard */
  #kb { position: absolute; left: 0; top: 0; width: 300px; height: 100px; margin: -50px 0 0 -150px; opacity: .9; transform-origin: 50% 50%; z-index: 23; }
  #kb .pl { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(1,204,247,.30), rgba(1,204,247,.10));
    box-shadow: 0 0 0 1.5px rgba(106,223,255,.7), 0 0 26px rgba(1,204,247,.55), inset 0 0 18px rgba(1,204,247,.25); }
  #kb .ks { position: absolute; left: 16px; top: 13px; width: 268px; height: 74px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
  #kb .ks i { display: block; border-radius: 4px; background: rgba(160,235,255,.22); box-shadow: inset 0 0 0 1px rgba(160,235,255,.35); }
  #kb .ks i.on { background: rgba(220,250,255,.95); box-shadow: 0 0 10px rgba(1,204,247,.95); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #r { z-index: 21; } #m { z-index: 22; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div><div id="g3" class="glow"></div>
  <div id="sparks"></div>
  <div id="floor"></div>
  <div id="lstraps" class="layer"></div>
  <div id="crew" class="layer"></div>
  <div id="leads" class="layer"></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <div id="kb"><div class="pl"></div><div class="ks" id="keys"></div></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR">
  <div id="chip" class="ctr"><span><b>13 SKILL</b>GRATIS<i></i>OPEN SOURCE</span></div>
  <div id="l1" class="ctr"><span class="mk"><img src="../assets/icons/lobe-claude-color.svg" alt=""></span><span>Claude jadi</span></div>
  <div id="h1" class="ctr"><span class="n">TIM</span>KONTEN</div>
  <div id="l3" class="ctr">Instagram kamu</div>
  <div class="grain"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  for (const k of ["chipY", "l1Y", "h1Y", "h1S", "l3Y"]) if (q.get(k)) document.documentElement.style.setProperty("--" + k, q.get(k) + "px");
  const M3 = window.Mascot3D;
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  // ====================================================================================================================
  // BADGE COMPONENT — copied exactly from compositions/s02.html (JS half)
  // ====================================================================================================================
      const BDG = [null,
        ["/ig-viral", "Pemburu Tren", "trending-up", "#ff5c8a"], ["/ig-reel", "Penulis Naskah", "clapperboard", "#01ccf7"],
        ["/ig-profile", "Auditor Profil", "scan-face", "#9d8cff"], ["/ig-plan", "Perencana Jadwal", "calendar-days", "#ffb35c"],
        ["/ig-caption", "Caption", "type", "#3ddc97"], ["/ig-carousel", "Carousel", "gallery-horizontal", "#6adfff"],
        ["/ig-story", "Story", "circle-dashed", "#ff8f6b"], ["/ig-human", "Penghalus Tulisan", "eraser", "#c7a6ff"],
        ["/ig-comment", "Komentar", "message-circle", "#5ec8ff"], ["/ig-reply", "Balas Komentar", "reply", "#7ee2b8"],
        ["/ig-dm", "DM", "send", "#ffd66b"], ["/ig-repurpose", "Daur Ulang", "repeat", "#ff9ec0"], ["/ig-audit", "Audit Postingan", "chart-column", "#8fb6ff"]];
      const BDG_IC = {   // lucide-static 1.70 (ISC), assets/icons/lucide-*.svg
        "trending-up": '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
        "clapperboard": '<path d="m12.296 3.464 3.02 3.956"/><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m6.18 5.276 3.1 3.899"/>',
        "scan-face": '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/>',
        "calendar-days": '<path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/>',
        "type": '<path d="M12 4v16"/><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M9 20h6"/>',
        "gallery-horizontal": '<path d="M2 3v18"/><rect width="12" height="18" x="6" y="3" rx="2"/><path d="M22 3v18"/>',
        "circle-dashed": '<path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 21.818a10 10 0 0 1-3.8 0"/><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"/><path d="M2.182 13.9a10 10 0 0 1 0-3.8"/><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"/><path d="M21.818 10.1a10 10 0 0 1 0 3.8"/><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"/><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"/>',
        "eraser": '<path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/>',
        "message-circle": '<path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>',
        "reply": '<path d="M20 18v-2a4 4 0 0 0-4-4H4"/><path d="m9 17-5-5 5-5"/>',
        "send": '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
        "repeat": '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
        "chart-column": '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>' };
      const bdgSVG = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${BDG_IC[name]}</svg>`;
      // badge k (1..13) → markup string. o.id = id suffix (a 2nd copy of the same badge), o.strap = lanyard length in px (default 120, 0 = none)
      const bdgHTML = (P, k, o = {}) => {
        const [cmd, role, ic, c] = BDG[k], id = `${P}-bdg${k}${o.id || ""}`, st = o.strap == null ? 120 : o.strap;
        return `<div class="${P}-bdg" id="${id}" style="--c:${c};--strap:${st}px">` + (st ? `<div class="${P}-bdg-strap" id="${id}-strap"></div>` : "") +
          `<div class="${P}-bdg-card" id="${id}-card"><div class="${P}-bdg-band"><i class="${P}-bdg-slot"></i></div>` +
          `<div class="${P}-bdg-ic" id="${id}-ic">${bdgSVG(ic)}</div><div class="${P}-bdg-role">${role}</div><div class="${P}-bdg-cmd">${cmd}</div><i class="${P}-bdg-bar"></i></div>` +
          `<div class="${P}-bdg-back" id="${id}-back"><i class="${P}-bdg-slot"></i><div class="${P}-bdg-no">${String(k).padStart(2, "0")}</div><i class="${P}-bdg-cbar"></i></div>` +
          `<i class="${P}-bdg-clip"></i></div>`;
      };
      // ROUND HEADER text markup (place it next to the badge at BDG_HEAD)
      const rhHTML = (P, k) => `<div class="${P}-rh" id="${P}-rh"><div class="${P}-rh-role" id="${P}-rh-role">${BDG[k][1]}</div><div class="${P}-rh-cmd" id="${P}-rh-cmd">${BDG[k][0]}</div></div>`;
      // geometry (centres, full-frame coordinates): TEAM WALL rows 5/4/4 at y 400/625/850, pitch 164 (150×.92 + 26 gap), centred in x
      const BDG_WALL = (k) => { const r = k <= 5 ? 0 : k <= 9 ? 1 : 2, i = k - [1, 6, 10][r], n = r ? 4 : 5; return { x: 540 + (i - (n - 1) / 2) * 164, y: [400, 625, 850][r], scale: 0.92 }; };
      const BDG_HEAD = { x: 135, y: 402, scale: 1 };
      const BDG_WALL_STRAP = 28;   // the lanyard stub every badge shows on the wall
  // ============================================== END BADGE COMPONENT ==============================================
  // ---- the team: [k, centre x, centre y, scale, swing deg, strap px]
  const LY = P("ly", "1060"), LS = P("ls", "1.32"), CY = P("cy", "862"), CS = P("cs", "0.74");
  const LEADS = [[1, 192, LY - 14, LS, -3.2], [2, 424, LY, LS, -1.2], [3, 656, LY, LS, 1.2], [4, 888, LY - 14, LS, 3.2]];
  const CREW = [5, 6, 7, 8, 9, 10, 11, 12, 13].map((k, i) => { const u = i - 4; return [k, 540 + u * P("cp", "110"), CY - P("ca", "2.6") * u * u, CS, u * 2.4, 10 - Math.abs(u)]; });
  const hangHTML = (k, x, y, s, rot, strap, z = 1, sfx = "") =>
    `<div class="hang" style="transform:translate(${x}px,${y}px) scale(${s});z-index:${z}">` +
    bdgHTML("cv", k, { strap, id: sfx }).replace(`id="cv-bdg${k}${sfx}"`, `id="cv-bdg${k}${sfx}" data-rot="${rot}"`) + `</div>`;
  document.getElementById("crew").innerHTML = CREW.map(([k, x, y, s, r, z]) => hangHTML(k, x, y, s, r, P("cst", "56"), z)).join("");
  document.getElementById("lstraps").innerHTML = LEADS.map(([k, x, y, s, r]) => hangHTML(k, x, y, s, r, P("lst", "150"), 1, "s")).join("");
  document.getElementById("leads").innerHTML = LEADS.map(([k, x, y, s, r]) => hangHTML(k, x, y, s, r, 0)).join("");
  document.querySelectorAll(".cv-bdg[data-rot]").forEach((b) => {
    const st = parseFloat(b.style.getPropertyValue("--strap")) || 0;
    b.style.transformOrigin = `75px ${16 - st}px`; b.style.transform = `rotate(${b.dataset.rot}deg)`;
  });
  // ---- sparkles + a few dots (seeded), never inside the logo / chip / hook / team
  {
    let h = "";
    for (let i = 0; i < 46; i++) {
      const x = 24 + rnd() * 1032, y = 120 + rnd() * 700, s = 0.45 + rnd() * 0.8, o = 0.25 + rnd() * 0.5;
      if ((x > 60 && x < 1020 && y > 430 && y < 790) || (x > 250 && x < 830 && y > 300 && y < 440)) continue;
      h += `<i class="st" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;opacity:${o.toFixed(2)};transform:scale(${s.toFixed(2)})"></i>`;
    }
    const SP = [[160, 400, 30], [930, 392, 26], [1036, 640, 20], [44, 600, 22], [80, 250, 16], [960, 230, 18], [1040, 860, 16], [36, 880, 18]];
    for (const [x, y, s] of SP) h += `<svg class="sp" style="left:${x - s / 2}px;top:${y - s / 2}px" width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0Z" fill="#eaf8ff"/></svg>`;
    document.getElementById("sparks").innerHTML = h;
  }
  document.getElementById("keys").innerHTML = Array.from({ length: 30 }, (_, i) => `<i class="${[3, 7, 12, 16, 21, 25, 28].includes(i) ? "on" : ""}"></i>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    const fx = P("rx", "842"), fy = P("ry", "1560"), h = P("rh", "360");
    rb.setView({ fx, fy, h, pitch: 5 });
    // typing on the holo keyboard (robot.html "type" gesture at full weight)
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0.05, ry: P("bry", "-0.12"), rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] + P("rhx", "0.1"), HF[1] + P("rhy", "-0.16"), HF[2]], hand_L: [0.55, 0, 0], hand_R: [0.6, 0, 0] },
      offs: { hand_L: [-0.09, -0.06, 0.15], hand_R: [0.09, -0.07, 0.15], head: [0, 0, 0] },
      face: { blink: 0, gaze: [P("gx", "-0.24"), P("gy", "0.12")], happy: P("hap", "0.8"), squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.4, shadow: false });
    rb.render();
    const kb = document.getElementById("kb"), x = fx - 0.06 * h + P("kx", "0"), y = fy - 0.1 * h + P("ky", "0");
    kb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) perspective(600px) rotateX(52deg) scale(${P("ks", "1")})`;
  }
  async function buildMascot() {
    const src = await (await fetch("../compositions/mascot.html")).text();
    const FACE = JSON.parse(src.match(/const FACE = (\{.*?\});\n/s)[1]);
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.9; o.color.setRGB(0.5, 0.86, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    // presenting the team (mascot.html's "present" intent, sampled once the gesture is held)
    const DIR = M3.direct([["lihat", 0.3, 3.2, 1]], 6, { intents: [{ t: 0.3, action: q.get("act") || "point", side: q.get("side") || "right" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 6.05, { smooth: 1 });
    m.setView({ fx: P("mx", "300"), fy: P("my", "1912"), h: P("mh", "720"), yaw: 0, pitch: 4 });
    const pf = PERF(P("pt", "0.9")), B = Object.assign({}, pf.bones);
    const hd = B.head || [0, 0, 0];
    B.head = [hd[0] + P("hx", "0"), hd[1] + P("hy", "0"), hd[2] + P("hz", "0")];
    m.setState({ root: { x: pf.root.x, y: pf.root.y, ry: P("mry", "0.22"), rz: P("mrz", "0"), rx: 0, s: 1 }, bones: B,
      face: { blink: [0, 0], gaze: [P("mgx", "0"), P("mgy", "0")], mouthMix: 1, mouth: [P("mw", "0.03"), P("mo", "0.012"), P("ms", "0.012"), 0.5] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, q.get("nor") ? 0 : buildRobot(), q.get("nom") ? 0 : buildMascot()]);
</script>

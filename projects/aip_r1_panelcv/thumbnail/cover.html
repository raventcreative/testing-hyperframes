<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Panel rekrutmen 7 Claude</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/cvkit.js"></script>
<!-- IG Reels cover 1080x1920 on the client's navy background ("7 Claude nolak CV kamu duluan"): a "7 CLAUDE · PANEL REKRUTMEN" chip,
     the hook "[Claude] 7 Claude / NOLAK CV / kamu duluan", the reel's 7 reviewer cards (compositions/panel.html, same markup) on the judges'
     table, YOUR CV (vendor/cvkit.js, same as the reel) in front with TOLAK stamps and the "7× ditolak" pill, the mascot (host) at bottom-left
     and the AI PRENEUR robot typing at bottom-right. Poppins 700/400, white + #01ccf7. Everything that matters sits inside the 4:5
     profile-grid crop (y 285-1635). Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8821 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  #g1 { left: 40px; top: 330px; width: 1000px; height: 520px; background: radial-gradient(ellipse, rgba(48,93,143,.40), rgba(48,93,143,0) 66%); }
  #g2 { left: -60px; top: 860px; width: 1200px; height: 620px; background: radial-gradient(ellipse, rgba(1,204,247,.24), rgba(1,204,247,0) 62%); }
  .grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(../assets/brand/grain_256.png); opacity: .06; z-index: 40; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; filter: drop-shadow(0 2px 8px rgba(4,8,30,.55)); z-index: 30; }
  #chip { top: 366px; display: flex; justify-content: center; }
  #chip > span { height: 60px; padding: 0 28px 0 7px; border-radius: 30px; display: flex; align-items: center; gap: 15px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.5); font: 700 24px/1 Poppins; letter-spacing: 3.5px; color: #6adfff; }
  #chip b { height: 46px; padding: 0 18px 0 21px; border-radius: 23px; display: flex; align-items: center; background: #01ccf7; color: #0b1440; letter-spacing: 3px;
    box-shadow: 0 0 20px rgba(1,204,247,.5), inset 0 1px 0 rgba(255,255,255,.4); margin-right: 3px; }
  #l1 { top: 446px; display: flex; justify-content: center; align-items: center; gap: 22px; font: 700 80px/1 Poppins; letter-spacing: -2px; color: #fff; text-shadow: 0 6px 22px rgba(4,8,30,.5); }
  #l1 .mk { width: 80px; height: 80px; border-radius: 50%; background: #fbf4ec; position: relative; flex: 0 0 80px;
    box-shadow: 0 0 0 5px rgba(217,119,87,.22), 0 0 34px rgba(217,119,87,.55), 0 10px 22px rgba(0,0,0,.35); }
  #l1 .mk img { position: absolute; left: 13px; top: 13px; width: 54px; height: 54px; }
  #h1 { top: 538px; font: 700 160px/1 Poppins; letter-spacing: -6px; color: #fff; text-shadow: 0 8px 26px rgba(4,8,30,.5); }
  #h1 .n { display: inline-block; background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 46%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(0 0 28px rgba(1,204,247,.55)); margin-right: 34px; }
  #l3 { top: 700px; font: 400 56px/1 Poppins; letter-spacing: -1px; color: #e3edfa; }
  #l3 b { font-weight: 700; color: #01ccf7; text-shadow: 0 0 22px rgba(1,204,247,.45); }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #panel { z-index: 10; } #cvl { z-index: 12; }
  /* judge cards — same as compositions/panel.html */
  .pn-a { position: absolute; }
  .pn-card { left: 0; top: 0; width: 124px; height: 156px; margin: -78px 0 0 -62px; }
  .pn-ring { left: -8px; top: -8px; width: 140px; height: 172px; border-radius: 28px; box-shadow: 0 0 0 3px var(--c), 0 0 34px 4px var(--c); opacity: .55; }
  .pn-face { left: 0; top: 0; width: 124px; height: 156px; border-radius: 22px; background: linear-gradient(180deg, #ffffff, #eef3fb); box-shadow: 0 20px 34px -16px rgba(2,6,28,.85), inset 0 0 0 1px rgba(255,255,255,.7); overflow: hidden; }
  .pn-no { left: 12px; top: 9px; font: 700 15px/20px Poppins, sans-serif; color: #5d6f8f; }
  .pn-dot { left: 98px; top: 13px; width: 13px; height: 13px; border-radius: 50%; background: #e5484d; }
  .pn-mk { left: 33px; top: 20px; width: 58px; height: 58px; border-radius: 50%; background: #fbf4ec; box-shadow: 0 0 0 3px rgba(217,119,87,.20), 0 6px 12px -6px rgba(10,13,44,.45); }
  .pn-mk svg { position: absolute; left: 12px; top: 12px; width: 34px; height: 34px; }
  .pn-pc { left: 72px; top: 52px; width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: #fff; box-shadow: 0 0 0 3px #ffffff; }
  .pn-pc svg { position: absolute; left: 7px; top: 7px; width: 18px; height: 18px; stroke-width: 2.4; }
  .pn-role { left: 4px; top: 84px; width: 116px; height: 46px; display: flex; align-items: center; justify-content: center; text-align: center; font: 700 17px/21px Poppins, sans-serif; color: #0a0d2c; letter-spacing: -.01em; }
  #table { position: absolute; left: 40px; top: 952px; width: 1000px; height: 50px; border-radius: 18px; z-index: 11;
    background: linear-gradient(180deg, rgba(36,62,138,.96), rgba(12,22,64,.96)); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.10), inset 0 2px 0 rgba(106,223,255,.55), 0 26px 40px -22px rgba(0,0,0,.85); }
  #table span { position: absolute; left: 0; top: 0; width: 1000px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 16px; font: 700 18px/50px Poppins; letter-spacing: .32em; color: #6adfff; }
  #table i { width: 6px; height: 6px; border-radius: 50%; background: #01ccf7; box-shadow: 0 0 8px #01ccf7; }
  #pill { position: absolute; z-index: 13; left: 712px; top: 1018px; height: 68px; padding: 0 24px 0 12px; border-radius: 34px; display: flex; align-items: center; gap: 12px; white-space: nowrap;
    background: #ffffff; color: #e5484d; font: 700 32px/68px Poppins, sans-serif; box-shadow: 0 18px 34px -14px rgba(0,0,0,.7), 0 0 0 3px rgba(229,72,77,.35); transform: rotate(4deg); }
  #pill i { position: relative; width: 46px; height: 46px; border-radius: 50%; background: #e5484d; color: #fff; }
  #pill i svg { position: absolute; left: 11px; top: 11px; width: 24px; height: 24px; }
  /* robot's holo keyboard */
  #kb { position: absolute; left: 0; top: 0; width: 300px; height: 100px; margin: -50px 0 0 -150px; opacity: .9; transform-origin: 50% 50%; z-index: 23; }
  #kb .pl { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(1,204,247,.30), rgba(1,204,247,.10));
    box-shadow: 0 0 0 1.5px rgba(106,223,255,.7), 0 0 26px rgba(1,204,247,.55), inset 0 0 18px rgba(1,204,247,.25); }
  #kb .ks { position: absolute; left: 16px; top: 13px; width: 268px; height: 74px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
  #kb .ks i { display: block; border-radius: 4px; background: rgba(160,235,255,.22); box-shadow: inset 0 0 0 1px rgba(160,235,255,.35); }
  #kb .ks i.on { background: rgba(220,250,255,.95); box-shadow: 0 0 10px rgba(1,204,247,.95); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #r { z-index: 21; } #m { z-index: 22; }
  #sparks { position: absolute; inset: 0; z-index: 3; }
  .st { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #e3edfa; box-shadow: 0 0 10px rgba(227,237,250,.9); }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div>
  <div id="sparks"></div>
  <div id="panel" class="layer"></div>
  <div id="table"><span><i></i>PANEL REKRUTMEN<i></i></span></div>
  <div id="cvl" class="layer"></div>
  <div id="pill"><i></i>7× ditolak</div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <div id="kb"><div class="pl"></div><div class="ks" id="keys"></div></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR">
  <div id="chip" class="ctr"><span><b>CARI KERJA?</b>COBA INI DULU</span></div>
  <div id="l1" class="ctr"><span class="mk"><img src="../assets/icons/lobe-claude-color.svg" alt=""></span><span>7 Claude</span></div>
  <div id="h1" class="ctr"><span class="n">NOLAK</span>CV</div>
  <div id="l3" class="ctr">kamu <b>duluan</b></div>
  <div class="grain"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const K = window.CVK, M3 = window.Mascot3D;
  // ---- the 7 reviewers on the table (a gentle arc)
  const PY = P("py", "872");
  document.getElementById("panel").innerHTML = K.JUDGES.slice(1).map(([role, ic, c], i) => { const k = i + 1, u = k - 4, x = 540 + u * 134, y = PY + u * u * 1.2, r = u * 1.4;
    return `<div class="pn-a pn-card" style="--c:${c};transform:translate(${x}px,${y}px) rotate(${r}deg)"><div class="pn-a pn-ring"></div><div class="pn-a pn-face">` +
      `<div class="pn-a pn-no">#${k}</div><i class="pn-a pn-dot"></i><div class="pn-a pn-mk">${K.CLAUDE}</div><div class="pn-a pn-pc">${K.isvg(ic, 2.4)}</div>` +
      `<div class="pn-a pn-role">${role}</div></div></div>`; }).join("");
  // ---- your CV, stamped
  const style = document.createElement("style"); style.textContent = K.css("cvc"); document.head.appendChild(style);
  const cvl = document.getElementById("cvl"); cvl.innerHTML = K.cv("cvc", "cv", 1);
  const cv = document.getElementById("cvc-cv"), CS = P("cs", "0.66");
  cv.style.transform = `translate(${P("cx", "540")}px, ${P("cy", "1220")}px) perspective(1400px) rotateX(8deg) rotate(-3deg) scale(${CS})`;
  const ST = [[150, 214, -14], [318, 330, 11], [170, 446, -8]];
  document.getElementById("cvc-cv-st").innerHTML = ST.map(([x, y, r], i) => `<div class="cvc-stamp" style="transform:translate(${x}px,${y}px) rotate(${r}deg) scale(1.15)">TOLAK</div>`).join("");
  document.querySelector("#pill i").innerHTML = K.isvg("x", 3);
  // ---- sparkles (seeded), never inside the hook / panel / CV
  { let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; let h = "";
    for (let i = 0; i < 40; i++) { const x = 24 + rnd() * 1032, y = 120 + rnd() * 700, s = 0.45 + rnd() * 0.8, o = 0.25 + rnd() * 0.5;
      if ((x > 60 && x < 1020 && y > 430 && y < 790) || (x > 250 && x < 830 && y > 300 && y < 440)) continue;
      h += `<i class="st" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;opacity:${o.toFixed(2)};transform:scale(${s.toFixed(2)})"></i>`; }
    document.getElementById("sparks").innerHTML = h; }
  document.getElementById("keys").innerHTML = Array.from({ length: 30 }, (_, i) => `<i class="${[3, 7, 12, 16, 21, 25, 28].includes(i) ? "on" : ""}"></i>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    const fx = P("rx", "866"), fy = P("ry", "1606"), h = P("rh", "330");
    rb.setView({ fx, fy, h, pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0.05, ry: P("bry", "-0.12"), rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] + P("rhx", "0.1"), HF[1] + P("rhy", "-0.16"), HF[2]], hand_L: [0.55, 0, 0], hand_R: [0.6, 0, 0] },
      offs: { hand_L: [-0.09, -0.06, 0.15], hand_R: [0.09, -0.07, 0.15], head: [0, 0, 0] },
      face: { blink: 0, gaze: [P("gx", "-0.24"), P("gy", "0.12")], happy: P("hap", "0.8"), squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.4, shadow: false });
    rb.render();
    const kb = document.getElementById("kb"), x = fx - 0.06 * h + P("kx", "0"), y = fy - 0.1 * h + P("ky", "0");
    kb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) perspective(600px) rotateX(52deg) scale(${P("ks", "0.92")})`;
  }
  async function buildMascot() {
    const src = await (await fetch("../compositions/mascot.html")).text();
    const FACE = JSON.parse(src.match(/const FACE = (\{.*?\});\n/s)[1]);
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.9; o.color.setRGB(0.5, 0.86, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct([["lihat", 0.3, 3.2, 1]], 6, { intents: [{ t: 0.3, action: q.get("act") || "point", side: q.get("side") || "right" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 6.05, { smooth: 1 });
    m.setView({ fx: P("mx", "250"), fy: P("my", "1990"), h: P("mh", "660"), yaw: 0, pitch: 4 });
    const pf = PERF(P("pt", "0.9")), B = Object.assign({}, pf.bones);
    const hd = B.head || [0, 0, 0];
    B.head = [hd[0] + P("hx", "0"), hd[1] + P("hy", "0"), hd[2] + P("hz", "0")];
    m.setState({ root: { x: pf.root.x, y: pf.root.y, ry: P("mry", "0.22"), rz: P("mrz", "0"), rx: 0, s: 1 }, bones: B,
      face: { blink: [0, 0], gaze: [P("mgx", "0"), P("mgy", "0")], mouthMix: 1, mouth: [P("mw", "0.03"), P("mo", "0.012"), P("ms", "0.012"), 0.5] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, q.get("nor") ? 0 : buildRobot(), q.get("nom") ? 0 : buildMascot()]);
</script>
</body>
</html>

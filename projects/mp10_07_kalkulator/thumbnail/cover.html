<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Kalkulator Gratis 3 Langkah</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Phone UI = the same generic calculator simulation as the video ("Simulasi alur"); the value is labelled "Ilustrasi data"; no rate. -->
<script src="../vendor/robot_mp.js"></script>
<style>

  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 44%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;

  #lock { position: absolute; left: 70px; top: 306px; display: flex; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; white-space: nowrap; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t0 { position: absolute; left: 70px; top: 380px; font: italic 400 76px/1.1 PF; color: #DDE1EE; white-space: nowrap; }
  #t1 { position: absolute; left: 62px; top: 470px; font: 800 136px/1 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t2 { position: absolute; left: 62px; top: 612px; font: 800 136px/1 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t2 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FED111 1.5%, #FED111 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 70% / 100% 84%; padding: 0 .1em; margin-left: -.04em; }
  #t3 { position: absolute; left: 70px; top: 790px; display: inline-flex; align-items: center; gap: 14px; padding: 20px 32px; border-radius: 999px; background: #fff; font: 700 36px/1 PS; color: #212C5F; white-space: nowrap; }
  #t3 b { display: inline-flex; width: 46px; height: 46px; border-radius: 50%; background: #212C5F; color: #FED111; align-items: center; justify-content: center; font: 800 28px/1 Rubik; }
  /* 3D phone (same build as the video, scaled) */
  #stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 760px 1200px; }
  #phone { position: absolute; left: 560px; top: 880px; width: 420px; height: 874px; transform-style: preserve-3d; transform: rotateY(-20deg) rotateX(7deg) rotateZ(2deg); transform-origin: 210px 437px; }
  #phone .lf { position: absolute; }
  .pth { left: 0; top: 0; width: 420px; height: 874px; border-radius: 62px; background: linear-gradient(160deg, #46528a 0%, #1d2650 45%, #0b1030 100%); }
  .pbody { left: 0; top: 0; width: 420px; height: 874px; border-radius: 62px; background: #0c1130; box-shadow: inset 0 0 0 3px #3b4677, inset 0 0 0 6px #0c1130, inset 0 0 0 7px rgba(255,255,255,.10); }
  .pshadow { left: 40px; top: 70px; width: 400px; height: 840px; border-radius: 80px; background: rgba(3,6,24,.6); filter: blur(40px); transform: translateZ(-70px); }
  .pscreen { left: 14px; top: 14px; width: 392px; height: 846px; border-radius: 50px; overflow: hidden; background: #F6F7FB; transform: translateZ(0.5px); font-family: PS; color: #161D3A; }
  .pglare { left: 14px; top: 14px; width: 392px; height: 846px; border-radius: 50px; transform: translateZ(1px); background: linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.16) 44%, rgba(255,255,255,.04) 52%, rgba(255,255,255,0) 60%); }
  .isl { position: absolute; left: 146px; top: 12px; width: 100px; height: 28px; border-radius: 14px; background: #05070f; }
  .ab { position: absolute; left: 0; top: 54px; width: 392px; text-align: center; font: 700 20px/1 PS; white-space: nowrap; }
  .tt { position: absolute; left: 22px; top: 104px; font: 700 34px/1.1 Rubik; white-space: nowrap; }
  .sg { position: absolute; left: 22px; top: 152px; width: 348px; display: flex; gap: 7px; } .sg i { flex: 1; height: 7px; border-radius: 4px; background: #FED111; }
  .res { position: absolute; left: 20px; top: 186px; width: 352px; height: 236px; border-radius: 24px; background: linear-gradient(150deg, #2c3d8c 0%, #212C5F 62%, #1a2350 100%); overflow: hidden; }
  .res .gl { position: absolute; right: -70px; top: -80px; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle, rgba(254,209,17,.38), rgba(254,209,17,0) 70%); }
  .res .rl { position: absolute; left: 22px; top: 24px; font: 700 15px/1 PS; letter-spacing: .16em; color: #8E99C2; white-space: nowrap; }
  .res .rv { position: absolute; left: 22px; top: 58px; display: flex; align-items: baseline; white-space: nowrap; }
  .res .rv .rp { font: 700 30px/1 Rubik; color: #DDE1EE; margin-right: 8px; } .res .rv .n { font: 800 64px/1 Rubik; color: #fff; letter-spacing: -1.5px; }
  .res .ri { position: absolute; left: 22px; top: 148px; padding: 7px 12px; border-radius: 999px; background: #FED111; font: 700 14px/1 PS; color: #212C5F; white-space: nowrap; }
  .res .rn { position: absolute; left: 22px; top: 188px; font: 400 17px/1.2 PS; color: #DDE1EE; white-space: nowrap; }
  .row { position: absolute; left: 22px; width: 348px; display: flex; justify-content: space-between; height: 48px; align-items: center; border-bottom: 1.5px solid #E1E5EE; font: 400 17px/1 PS; color: #5B6478; white-space: nowrap; }
  .row b { font: 700 17px/1 PS; color: #161D3A; }
  .btn { position: absolute; left: 20px; top: 744px; width: 352px; height: 62px; border-radius: 18px; background: #FED111; display: flex; align-items: center; justify-content: center; font: 700 22px/1 PS; color: #212C5F; }
  /* the lifted result card floating off the glass */
  #lift { position: absolute; left: 34px; top: 200px; width: 352px; height: 236px; transform: translateZ(46px); }
  #lift .res { left: 0; top: 0; box-shadow: 0 34px 60px rgba(3,6,24,.55), 0 8px 18px rgba(3,6,24,.3); }
  #sim { position: absolute; right: 60px; top: 304px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: rgba(9,14,40,.6); box-shadow: inset 0 0 0 1.5px rgba(221,225,238,.35);
         font: 700 18px/1 PS; letter-spacing: .14em; color: #DDE1EE; white-space: nowrap; }
  #sim i { width: 9px; height: 9px; border-radius: 50%; background: #FED111; }
  .num { position: absolute; font: 800 300px/1 Rubik; color: #FED111; text-shadow: 3px 3px 0 #E2AE00, 6px 6px 0 #C79A00, 9px 9px 0 #A88200, 12px 12px 0 #8a6a00, 16px 22px 40px rgba(0,0,0,.45); }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t0">cek estimasi pajakmu</div>
  <div id="t1">KALKULATOR</div>
  <div id="t2"><span>GRATIS</span></div>
  <div id="t3"><b>3</b>langkah · cuma beberapa menit</div>
  <div class="num" style="left: 90px; top: 930px; transform: rotate(-8deg); opacity: .95">3</div>
  <div id="stage">
    <div id="phone">
      <div class="lf pshadow"></div>
      <div class="lf pth" style="transform: translateZ(-14px)"></div><div class="lf pth" style="transform: translateZ(-10px)"></div><div class="lf pth" style="transform: translateZ(-6px)"></div><div class="lf pth" style="transform: translateZ(-3px)"></div>
      <div class="lf pbody"></div>
      <div class="lf pscreen">
        <i class="isl"></i>
        <div class="ab">Kalkulator Pajak</div>
        <div class="tt">Estimasi</div>
        <div class="sg"><i></i><i></i><i></i></div>

        <div class="row" style="top: 518px">Jenis usaha<b>Fashion</b></div>
        <div class="row" style="top: 566px">Jualan lewat<b>Marketplace +1</b></div>
        <div style="position:absolute;left:22px;top:446px;font:700 13px/1 PS;letter-spacing:.14em;color:#8E99C2">RINGKASAN · ILUSTRASI DATA</div>
        <div class="btn">Hitung ulang</div>
      </div>
      <div class="lf pglare"></div>
      <div id="lift">
        <div class="res"><div class="gl"></div><div class="rl">ESTIMASI PAJAK</div><div class="rv"><span class="rp">Rp</span><span class="n">96.500</span></div><div class="ri">Ilustrasi data</div><div class="rn">Hasil berupa estimasi</div></div>
      </div>
    </div>
  </div>
  <div id="sim"><i></i>SIMULASI ALUR</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: 300, y: 1640, h: 620, yaw: 26, roll: 0, headYaw: 18, headPitch: -10, headRoll: -6, t: 2,
      aL: { raise: 140, fwd: 30, bend: 12, bendYaw: 0 }, aR: { raise: 18, fwd: 0, bend: 14 },
      face: { blink: 0, lookX: 0.9, lookY: 0.6, happy: 1, smile: 1, o: 0.2 }, rim: 2.0, shadow: 0.5 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

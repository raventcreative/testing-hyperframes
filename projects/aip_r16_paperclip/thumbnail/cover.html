<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Perusahaan AI pakai Paperclip</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<script src="../vendor/r16icons.js"></script>
<script src="../vendor/r16kit.js"></script>
<!-- IG Reels cover 1080x1920 on the client's light background (+ its grid): eyebrow "PAPERCLIP · OPEN SOURCE", headline "Perusahaan AI" /
     "isinya agent, kamu bosnya", the reel's own org chart (goal banner CONTOH, Kamu chip, CEO + Tim Web / Konten / Riset, same design as
     the scenes), pill "Gratis · jalan di komputer kamu", mascot (host) + robot. Poppins 700/400, navy gradient. No Paperclip logo (lucide
     paperclip glyph only). Everything that matters sits inside the 4:5 crop (y 285-1635).
     Render: COVER_URL=http://127.0.0.1:8936/thumbnail/cover.html node thumbnail/render_cover.cjs thumbnail/COVER_TIM_1080x1920.png
     (static server on :8936 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f8fe; font-family: Poppins, sans-serif; color: #0a0d2c; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .a { position: absolute; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  #gridtint { position: absolute; left: 520px; top: -260px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(126,164,226,.22), rgba(126,164,226,0) 64%); }
  #gridwrap { position: absolute; left: 330px; top: 160px; width: 900px; height: 820px;
    -webkit-mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); }
  #grid { position: absolute; left: -473px; top: -473px; width: 1846px; height: 1766px; background-image: linear-gradient(90deg, rgba(104,132,186,.30) 2px, transparent 2px), linear-gradient(0deg, rgba(104,132,186,.30) 2px, transparent 2px); background-size: 43px 43px; }
  #glow { position: absolute; left: 0; top: 620px; width: 1080px; height: 720px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.95), rgba(255,255,255,0) 66%); }
  .grad { background: linear-gradient(172deg, #0a0d2c 8%, #294b77 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; z-index: 30; }
  #eyebrow { top: 372px; display: flex; justify-content: center; }
  #eyebrow > span { height: 58px; padding: 0 24px 0 12px; border-radius: 29px; display: flex; align-items: center; gap: 12px; background: #ffffff;
    box-shadow: 0 12px 26px -12px rgba(20,40,90,.4), 0 0 0 1.5px rgba(10,13,44,.07); font: 700 21px/1 Poppins; letter-spacing: 2px; }
  #eyebrow i { position: relative; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #0a0d2c, #294b77); color: #fff; }
  #eyebrow i svg { position: absolute; left: 9px; top: 9px; width: 20px; height: 20px; display: block; }
  #h1 { top: 452px; font: 700 112px/1 Poppins; letter-spacing: -4px; filter: drop-shadow(0 16px 26px rgba(10,13,44,.14)); }
  #h2 { top: 586px; display: flex; justify-content: center; align-items: baseline; gap: 14px; font: 400 54px/1 Poppins; letter-spacing: -1px; }
  #h2 b { position: relative; font-weight: 700; }
  #h2 b::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: -12px; height: 7px; border-radius: 4px; background: linear-gradient(90deg, #0a0d2c, #294b77); }
  #org { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 12; transform-origin: 540px 600px; transform: translateY(354px) scale(0.92); }
  #pill { left: 230px; top: 1232px; width: 620px; height: 86px; border-radius: 43px; background: linear-gradient(135deg, #0a0d2c, #294b77); z-index: 14;
    box-shadow: 0 26px 40px -22px rgba(10,13,44,.75), inset 0 0 0 1.5px rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; gap: 14px; color: #ffffff; }
  #pill .di { position: relative; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.14); flex: none; }
  #pill .di svg { position: absolute; left: 13px; top: 13px; width: 26px; height: 26px; display: block; color: #8fd8ff; }
  #pill b { font: 700 34px/86px Poppins, sans-serif; white-space: nowrap; }
  #pill span { font: 400 28px/86px Poppins, sans-serif; white-space: nowrap; color: rgba(227,237,250,.88); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #m { z-index: 22; } #r { z-index: 21; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="gridtint"></div><div id="gridwrap"><div id="grid"></div></div><div id="glow"></div>
  <div id="org"></div>
  <div class="a" id="pill"></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><i id="ebi"></i><b class="grad">PAPERCLIP · OPEN SOURCE</b></span></div>
  <div id="h1" class="ctr"><span class="grad">Perusahaan AI</span></div>
  <div id="h2" class="ctr"><span class="grad">isinya agent,</span><b class="grad">kamu bosnya</b></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS, R16 = window.R16;
  document.getElementById("ebi").innerHTML = R16.svg("paperclip", 2.2);
  document.getElementById("pill").innerHTML = `<div class="di">${R16.svg("house", 2.2)}</div><b>Gratis</b><span>· jalan di komputer kamu</span>`;
  document.getElementById("org").innerHTML = R16.org("cv", { layout: 3 });
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    rb.setView({ fx: P("rx", "850"), fy: P("ry", "1640"), h: P("rh", "235"), pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0, ry: -0.42, rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] - 0.06, HF[1] - 0.12, HF[2]], hand_L: [-0.3, 0, -0.35], hand_R: [-0.3, 0, 0.35] },
      offs: { hand_L: [-0.13, 0.26, 0.06], hand_R: [0.13, 0.26, 0.06], head: [0, 0, 0] },
      face: { blink: 0, gaze: [-0.12, 0.06], happy: 1, squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.6, shadow: false });
    rb.render();
  }
  async function buildMascot() {
    const src = await (await fetch("../compositions/mascot.html")).text();
    const FACE = JSON.parse(src.match(/const FACE = (\{.*?\});\n/s)[1]);
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.6; o.color.setRGB(0.72, 0.84, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 60, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 60.05, { smooth: 1 });
    m.setView({ fx: P("mx", "290"), fy: P("my", "2110"), h: P("mh", "760"), yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    B.upperarm_R = [-2.7, 0, -0.25]; B.forearm_R = [0, 0, 0]; B.hand_R = [-0.12, 0.1, -0.12];
    B.head = [-0.08, 0.08, 0.04]; B.neck = [-0.02, 0.03, 0.02];
    m.setState({ root: { x: 0, y: 0, ry: 0.22, rz: 0, rx: 0, s: 1 }, bones: B, face: { blink: [0, 0], gaze: [-0.003, 0.006], mouthMix: 1, mouth: [0.04, 0.012, 0.005, 0.2] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, buildRobot(), buildMascot()]);
</script>
</body>
</html>

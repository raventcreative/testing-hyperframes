        <defs><linearGradient id="r8-ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".46" stop-color="#bfe2ff"/>

        <path d="M62 8 L10 48 L62 88 Z" fill="url(#r8-ga)" stroke="#050a26" stroke-width="7" stroke-linejoin="round"/><path d="M55 72 L23 48" stroke="#123a8a" stroke-width="4" stroke-linecap="round" opacity=".7"/>

      <div class="r8-a r8-arw" id="r8-ar"><svg width="90" height="116" viewBox="0 0 74 96">

        <path d="M20 22 L52 46" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".85"/></svg></div>
      <div class="r8-a" id="r8-p1"><svg width="92" height="70" viewBox="0 0 92 70">
        <defs><linearGradient id="r8-gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset=".5" stop-color="#ff2f3c"/><stop offset="1" stop-color="#b3000f"/></linearGradient></defs>
        <path d="M8 4 H84 Q88 4 88 8 V40 Q88 44 84 44 H58 L46 64 L34 44 H8 Q4 44 4 40 V8 Q4 4 8 4 Z" fill="url(#r8-gp)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/></svg><b>1P</b></div>

  <script>
    (function () {
      // r8 PS2 STYLE — "Delapan, gaya PS2, kotak-kotak khas game tahun 2000-an."
      // A 2000s console CHARACTER-SELECT screen boots over the stage when the sweep lands (synth pad): CRT scanlines, chrome ◄ ► arrows
      // bobbing at the sides, a red 1P cursor bobbing over the (turntabling) robot, a "PILIH KARAKTER" tab with a countdown (top-right).
      // "kotak-kotak": the stat panel slides in and three stat bars fill BOX BY BOX · "2000-an": GAYA tops out — MAX — the cursor confirms.
      const R = window.ROUNDS[7], DUR = R.dur, S = R.start;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const VW = window.VO_WORDS, wt = (txt) => { const w = VW.find((x) => x[0] === txt && x[1] >= S - 0.05); return (w ? w[1] : S) - S; };
      // local beats: sweep lands 1.38 · kotak-kotak 2.15 · game 3.131 · 2000-an 3.452 · out by 4.2
      const LAND = R.sweep[1] - S, KK = wt("kotak-kotak"), GAME = wt("game"), Y2K = wt("2000-an."), OUT = DUR - 0.3;
      // layout (stage-local px; robot ≈ x 180–645, y 370–840, head top ≈ (410, 370) — it turntables in place)
      const ARW_Y = 560, ARW_LX = 56, ARW_RX = 764, HEAD = { x: 412, y: 350 }, PAN = { x: 500, y: 68 };

      // ---- boot: scanlines + a soft CRT flash on the synth pad
      const scan = $("r8-scan"), flash = $("r8-flash");
      I(scan, { opacity: 0 }); ft(scan, { opacity: 0 }, { opacity: 0.55, duration: 0.12, ease: "none" }, LAND - 0.04);
      ft(scan, { opacity: 0.55 }, { opacity: 0, duration: 0.2, ease: "none" }, OUT + 0.06);
      I(flash, { opacity: 0 }); ft(flash, { opacity: 0.9 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, LAND);
      ft(flash, { opacity: 0.55 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, Y2K);

      // ---- ◄ ► arrows: slide in from the edges, bob outward in stepped beats, the right one "pressed" on the beats
      const al = $("r8-al"), ar = $("r8-ar");
      I(al, { x: ARW_LX - 120, y: ARW_Y, opacity: 0 }); I(ar, { x: ARW_RX + 120, y: ARW_Y, opacity: 0 });
      tl.set([al, ar], { opacity: 1 }, LAND + 0.02);
      ft(al, { x: ARW_LX - 120 }, { x: ARW_LX, duration: 0.26, ease: "back.out(2)" }, LAND + 0.02);
      ft(ar, { x: ARW_RX + 120 }, { x: ARW_RX, duration: 0.26, ease: "back.out(2)" }, LAND + 0.06);
      const BOB0 = LAND + 0.32, BOBP = 0.36, nB = Math.floor((OUT - BOB0) / BOBP);
      for (let k = 0; k < nB; k++) {
        const t = BOB0 + k * BOBP;
        ft(al, { x: ARW_LX }, { x: ARW_LX - 12, duration: BOBP / 2, ease: "steps(3)", yoyo: true, repeat: 1 }, t);
        ft(ar, { x: ARW_RX }, { x: ARW_RX + 12, duration: BOBP / 2, ease: "steps(3)", yoyo: true, repeat: 1 }, t);
      }
      const arS = ar.firstElementChild; I(arS, { scale: 1, transformOrigin: "50% 50%" });
      [KK - 0.04, GAME - 0.04].forEach((t) => ft(arS, { scale: 0.74 }, { scale: 1, duration: 0.22, ease: "back.out(3)" }, t));
      ft(al, { opacity: 1, x: ARW_LX }, { opacity: 0, x: ARW_LX - 120, duration: 0.2, ease: "power2.in" }, OUT);
      ft(ar, { opacity: 1, x: ARW_RX }, { opacity: 0, x: ARW_RX + 120, duration: 0.2, ease: "power2.in" }, OUT);

      // ---- 1P cursor drops onto the robot's head and bobs
      const p1 = $("r8-p1");
      I(p1, { x: HEAD.x, y: HEAD.y - 64 - 90, opacity: 0 });
      tl.set(p1, { opacity: 1 }, LAND + 0.16);
      ft(p1, { y: HEAD.y - 64 - 90 }, { y: HEAD.y - 64, duration: 0.3, ease: "bounce.out" }, LAND + 0.16);
      const PB0 = LAND + 0.5, PBP = 0.4, nP = Math.floor((Y2K - 0.05 - PB0) / PBP);
      for (let k = 0; k < nP; k++) ft(p1, { y: HEAD.y - 64 }, { y: HEAD.y - 64 - 10, duration: PBP / 2, ease: "steps(3)", yoyo: true, repeat: 1 }, PB0 + k * PBP);
      // "2000-an": confirm — the cursor pumps and blinks (selected!)
      I(p1, { scale: 1, transformOrigin: "50% 100%" });
      ft(p1, { scale: 1.3 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, Y2K);
      [0.22, 0.32].forEach((d) => { tl.set(p1, { opacity: 0.3 }, Y2K + d); tl.set(p1, { opacity: 1 }, Y2K + d + 0.05); });
      ft(p1, { opacity: 1, y: HEAD.y - 64 }, { opacity: 0, y: HEAD.y - 64 - 60, duration: 0.2, ease: "power2.in" }, OUT);

      // ---- select panel: tab (with countdown) slides in after the boot, body right before "kotak-kotak"
      const pan = $("r8-pan"), tab = $("r8-tab"), body = $("r8-body"), tm = $("r8-tm");
      I(pan, { x: PAN.x, y: PAN.y });
      I(tab, { x: 360 }); ft(tab, { x: 360 }, { x: 0, duration: 0.3, ease: "power4.out" }, LAND + 0.12);
      I(body, { x: 380 }); ft(body, { x: 380 }, { x: 0, duration: 0.3, ease: "power4.out" }, KK - 0.22);
      I(tm, { textContent: "30" });
      [29, 28].forEach((n, k) => tl.set(tm, { textContent: String(n) }, LAND + 0.62 + k * 1.0));
      // "kotak-kotak": the stat bars fill BOX BY BOX (stepped sets, a little overshoot on each box)
      const VAL = [8, 7, 10], NSEG = 10, SEGW = 24;
      VAL.forEach((v, r) => {
        const row = $("r8-row" + r);
        for (let s = 0; s < NSEG; s++) {
          const seg = document.createElement("div"); seg.className = "seg" + (r === 2 ? " g" : ""); seg.style.left = (s * SEGW + 3) + "px";
          const fill = document.createElement("i"); seg.appendChild(fill); row.appendChild(seg);
          I(fill, { opacity: 0, scale: 1 });
          if (s < v) {
            const t = KK + 0.04 + r * 0.17 + s * (r === 2 ? 0.07 : 0.045);
            tl.set(fill, { opacity: 1, scale: 1.3 }, t); tl.set(fill, { scale: 1 }, t + 0.034);
          }
        }
      });
      // GAYA tops out: MAX stamps in on "2000-an" and blinks
      const mx = $("r8-max");
      I(mx, { opacity: 0, scale: 2.2, transformOrigin: "30% 50%" });
      ft(mx, { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, Y2K - 0.14);
      [0.16, 0.26, 0.34, 0.42].forEach((d, k) => tl.set(mx, { opacity: k % 2 ? 1 : 0.35 }, Y2K + d));
      ft(tab, { x: 0 }, { x: 360, duration: 0.22, ease: "power3.in" }, OUT + 0.04);
      ft(body, { x: 0 }, { x: 380, duration: 0.22, ease: "power3.in" }, OUT);

      tl.set({}, {}, DUR - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["r8"] = tl;
    })();
  </script>

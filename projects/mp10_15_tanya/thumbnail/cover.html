<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Tanya Cepat ke Robot</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). The three FAQ questions as chat bubbles in
     CSS 3D (same look as the film), robot host rendered live with the project runtime, looking up at them. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  .in { display: inline-block; white-space: nowrap; }
  #t1 { top: 382px; font: 800 158px/1 Rubik; letter-spacing: -5px; color: #fff; }
  #t2 { top: 548px; font: 800 158px/1.04 Rubik; letter-spacing: -5px; color: #212C5F; }
  #t2 .y { display: inline-block; padding: 0 .16em .02em; border-radius: 30px; background: #FED111; box-shadow: 0 12px 0 #d6ad00, 0 30px 60px rgba(3,6,24,.4); transform: rotate(-2deg); }
  #t3 { top: 748px; font: italic 400 60px/1 PF; color: #DDE1EE; }
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1200px; perspective-origin: 540px 980px; }
  .cam { position: absolute; left: 540px; top: 1012px; transform-style: preserve-3d; transform: rotateY(-8deg); }
  .qb { position: absolute; padding: 24px 32px 28px; border-radius: 40px 40px 40px 12px; background: #fff; color: #212C5F; font: 700 40px/1.15 PS; white-space: nowrap;
        box-shadow: 0 30px 60px rgba(3,6,24,.45); }
  .qb.n { background: linear-gradient(160deg, #4a60c0, #2f4292); color: #fff; box-shadow: 0 30px 60px rgba(3,6,24,.5), inset 0 0 0 2px rgba(255,255,255,.18); }
  .qb .nb { position: absolute; left: -26px; top: -28px; width: 64px; height: 64px; border-radius: 50%; background: #FED111; border: 5px solid #fff; display: flex; align-items: center; justify-content: center;
            font: 800 32px/1 Rubik; color: #212C5F; box-shadow: 0 10px 22px rgba(3,6,24,.35); }
  #b1 { left: -440px; top: -170px; transform: translateZ(40px) rotateY(16deg) rotate(-2deg); }
  #b2 { left: -400px; top: -10px; transform: translateZ(0px) rotateY(16deg) rotate(1.5deg); }
  #b3 { left: -450px; top: 150px; transform: translateZ(60px) rotateY(16deg) rotate(-1.5deg); }
  #sim { position: absolute; left: 92px; top: 1312px; font: 700 18px/1 PS; letter-spacing: .14em; color: #8E99C2; }
  #t4 { position: absolute; left: 70px; top: 1372px; }
  #t4 span { display: inline-flex; align-items: center; gap: 14px; padding: 20px 32px; border-radius: 999px; background: #fff; font: 700 36px/1 PS; color: #212C5F; white-space: nowrap; }
  #t4 svg { width: 34px; height: 34px; }
  .bok { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,228,64,.5), rgba(255,228,64,0) 70%); filter: blur(4px); }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div class="bok" style="left: 860px; top: 820px; width: 120px; height: 120px"></div>
  <div class="bok" style="left: 60px; top: 1500px; width: 90px; height: 90px; opacity: .6"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1" class="ctr"><span class="in">Tanya cepat</span></div>
  <div id="t2" class="ctr"><span class="in"><span class="y">ke Robot</span></span></div>
  <div id="t3" class="ctr"><span class="in">3 pertanyaan paling sering</span></div>
  <div class="stage"><div class="cam">
    <div class="qb" id="b1"><span class="nb">1</span>Usaha kecil, perlu pembukuan?</div>
    <div class="qb n" id="b2"><span class="nb">2</span>Harus ngerti akuntansi?</div>
    <div class="qb" id="b3"><span class="nb">3</span>Bingung, tanya siapa?</div>
  </div></div>
  <div id="sim">SIMULASI ALUR</div>
  <div id="t4"><span>Ini jawabannya<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const fit = (el, maxW) => { const w = el.offsetWidth; if (w > maxW) { const fs = parseFloat(getComputedStyle(el).fontSize); el.style.fontSize = (fs * maxW / w * 0.995).toFixed(2) + "px"; } };
  document.fonts.ready.then(() => {
    fit(document.querySelector("#t1 .in"), 960); fit(document.querySelector("#t2 .in"), 940); fit(document.querySelector("#t3 .in"), 940);
    document.querySelectorAll(".qb").forEach((e) => fit(e, 640));
    return RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" });
  }).then((r) => {
    r.render({ x: 830, y: 1580, h: 860, yaw: -22, roll: 0, headYaw: -18, headPitch: -12, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 118, fwd: 34, bend: 28, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.7, smile: 1, happy: 0.7, o: 0 }, rim: 2.0, shadow: 0.0, chest: 1 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Penyusun Master Prompt</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<!-- IG Reels cover 1080x1920 on the client's light background (+ its grid): "Stop beli prompt" / "bikin alatnya sendiri", the Claude
     chip (lobehub mark, MIT), the reel's tool card "Penyusun Master Prompt" with the 6 prompt blocks snapping in (same CSS as
     compositions/s02.html .s02-blk), the green "Rp 0 · GRATIS" seal (as s01), mascot (host) + robot. Poppins 700/400, navy gradient.
     Everything that matters sits inside the 4:5 crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8782 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f8fe; font-family: Poppins, sans-serif; color: #0a0d2c; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .a { position: absolute; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  #gridtint { position: absolute; left: 520px; top: -260px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(126,164,226,.22), rgba(126,164,226,0) 64%); }
  #gridwrap { position: absolute; left: 330px; top: 160px; width: 900px; height: 820px;
    -webkit-mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); }
  #grid { position: absolute; left: -473px; top: -473px; width: 1846px; height: 1766px; background-image: linear-gradient(90deg, rgba(104,132,186,.30) 2px, transparent 2px), linear-gradient(0deg, rgba(104,132,186,.30) 2px, transparent 2px); background-size: 43px 43px; }
  #glow { position: absolute; left: 40px; top: 560px; width: 1000px; height: 860px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.95), rgba(255,255,255,0) 66%); }
  .grad { background: linear-gradient(172deg, #0a0d2c 8%, #294b77 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  .ic { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; z-index: 30; }
  #eyebrow { top: 372px; display: flex; justify-content: center; }
  #eyebrow > span { height: 58px; padding: 0 24px 0 12px; border-radius: 29px; display: flex; align-items: center; gap: 12px; background: #ffffff;
    box-shadow: 0 12px 26px -12px rgba(20,40,90,.4), 0 0 0 1.5px rgba(10,13,44,.07); font: 700 21px/1 Poppins; letter-spacing: 2px; }
  #eyebrow img { width: 36px; height: 36px; }
  #h1 { top: 452px; font: 700 124px/1 Poppins; letter-spacing: -5px; filter: drop-shadow(0 16px 26px rgba(10,13,44,.14)); }
  #h2 { top: 596px; display: flex; justify-content: center; align-items: baseline; gap: 16px; font: 400 58px/1 Poppins; letter-spacing: -1px; }
  #h2 b { font-weight: 700; }
  /* ---- the tool card "Penyusun Master Prompt" (reel r3–r5 look) */
  #card { left: 140px; top: 730px; width: 800px; height: 530px; border-radius: 34px; background: linear-gradient(180deg, #ffffff, #f6f8fd); z-index: 12;
    box-shadow: 0 50px 80px -40px rgba(10,13,44,.5), 0 0 0 1.5px rgba(10,13,44,.06); }
  #cib { left: 36px; top: 26px; width: 66px; height: 66px; border-radius: 20px; background: linear-gradient(135deg, #0a0d2c, #294b77); box-shadow: 0 10px 18px -10px rgba(10,13,44,.7); }
  #cib svg { position: absolute; left: 16px; top: 16px; width: 34px; height: 34px; stroke: #fff; stroke-width: 2; }
  #ctt { left: 120px; top: 22px; font: 700 36px/42px Poppins; letter-spacing: -.5px; white-space: nowrap; }
  #cst { left: 121px; top: 64px; font: 400 21px/28px Poppins; color: #5d6f8f; white-space: nowrap; }
  #cdv { left: 36px; right: 36px; top: 118px; height: 2px; background: #e9eef7; }
  #blks { left: 38px; top: 142px; width: 630px; height: 228px; transform-origin: 0 0; transform: scale(1.15); }
  .s02-sl { position: absolute; width: 300px; height: 66px; border-radius: 18px; border: 2px dashed #cbd7ea; background: #f6f8fc; }
  #cbt { left: 38px; top: 414px; width: 486px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, #0a0d2c, #294b77); box-shadow: 0 16px 26px -14px rgba(10,13,44,.75);
    display: flex; align-items: center; justify-content: center; gap: 14px; font: 700 29px/80px Poppins; color: #fff; white-space: nowrap; }
  #cbt svg { width: 32px; height: 32px; stroke: #fff; stroke-width: 2.1; }
  #ccp { left: 544px; top: 414px; width: 218px; height: 80px; border-radius: 24px; background: #fff; box-shadow: inset 0 0 0 2px #d9e3f2, 0 12px 22px -16px rgba(10,13,44,.5);
    display: flex; align-items: center; justify-content: center; gap: 12px; font: 700 28px/80px Poppins; color: #294b77; white-space: nowrap; }
  #ccp svg { width: 30px; height: 30px; stroke: #294b77; stroke-width: 2.1; }
  /* ---- the 6 prompt blocks — identical CSS to compositions/s02.html (.s02-blk) */
  .s02-blk { position: absolute; left: 0; top: 0; width: 300px; height: 66px; transform-origin: 50% 50%; filter: drop-shadow(0 10px 12px rgba(10,13,44,.18)); }
  .s02-blk .bg { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, var(--c), var(--d));
    -webkit-mask-image: radial-gradient(circle 12px at 254px 0, transparent 95%, #000 100%); mask-image: radial-gradient(circle 12px at 254px 0, transparent 95%, #000 100%); }
  .s02-blk .bg::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0)); }
  .s02-blk .tab { position: absolute; left: 244px; top: 56px; width: 20px; height: 20px; border-radius: 50%; background: var(--d); }
  .s02-blk svg { position: absolute; left: 20px; top: 16px; width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .s02-blk b { position: absolute; left: 66px; top: 0; font: 700 26px/66px Poppins, sans-serif; color: #fff; letter-spacing: .06em; text-shadow: 0 1px 2px rgba(10,13,44,.2); white-space: nowrap; }
  .spd { position: absolute; height: 5px; border-radius: 3px; background: linear-gradient(270deg, rgba(229,72,77,0), rgba(229,72,77,.6)); }
  /* ---- the green "Rp 0 · GRATIS" seal (as s01) */
  #seal { left: 820px; top: 640px; width: 230px; height: 230px; z-index: 14; transform: rotate(12deg); filter: drop-shadow(0 18px 22px rgba(20,90,45,.35)); }
  #seal svg { position: absolute; left: 0; top: 0; width: 230px; height: 230px; }
  #seal b { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 700 58px/230px Poppins; letter-spacing: -1px; color: #fff; text-shadow: 0 2px 8px rgba(0,60,20,.25); }
  /* ---- a generic "prompt pack" price tag, struck (the thing we stop buying) */
  #tagw { left: 486px; top: 1318px; width: 232px; height: 104px; z-index: 13; transform: rotate(-9deg); filter: drop-shadow(0 16px 18px rgba(10,13,44,.22)); }
  #tag { position: absolute; inset: 0; background: linear-gradient(180deg, #ffffff, #f3f6fc); border-radius: 20px;
    clip-path: polygon(30px 0, 100% 0, 100% 100%, 30px 100%, 0 50%); }
  #tag i { position: absolute; left: 22px; top: 43px; width: 18px; height: 18px; border-radius: 50%; background: #dfe7f3; box-shadow: inset 0 2px 3px rgba(10,13,44,.18); }
  #tag .k { position: absolute; left: 52px; top: 16px; font: 700 15px/20px Poppins; letter-spacing: 2px; color: #5d6f8f; white-space: nowrap; }
  #tag .v { position: absolute; left: 51px; top: 40px; font: 700 36px/48px Poppins; letter-spacing: -1px; color: #0a0d2c; white-space: nowrap; }
  #tagx { left: 44px; top: 62px; width: 180px; height: 8px; border-radius: 4px; background: #e5484d; transform: rotate(-8deg); box-shadow: 0 3px 10px rgba(229,72,77,.35); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #m { z-index: 22; } #r { z-index: 21; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="gridtint"></div><div id="gridwrap"><div id="grid"></div></div><div id="glow"></div>
  <div class="a" id="card">
    <div class="a" id="cib"><svg class="ic" viewBox="0 0 24 24"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg></div>
    <div class="a grad" id="ctt">Penyusun Master Prompt</div>
    <div class="a" id="cst">6 bagian · 1 klik · tinggal salin</div>
    <div class="a" id="cdv"></div>
    <div class="a" id="blks"></div>
    <div class="a" id="cbt"><svg class="ic" viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>Susun master prompt</div>
    <div class="a" id="ccp"><svg class="ic" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Salin</div>
  </div>
  <div class="a" id="seal"><svg viewBox="0 0 236 236"><defs><linearGradient id="sgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3cc061"/><stop offset="1" stop-color="#1f8a3c"/></linearGradient>
    <path id="sp" d="M118,118 m-88,0 a88,88 0 1,1 176,0 a88,88 0 1,1 -176,0"/></defs><circle cx="118" cy="118" r="116" fill="url(#sgr)"/>
    <circle cx="118" cy="118" r="107" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="118" cy="118" r="68" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-dasharray="3 6"/>
    <text fill="#fff" font-family="Poppins, sans-serif" font-weight="700" font-size="21" letter-spacing="3"><textPath href="#sp" textLength="546">GRATIS • GRATIS • GRATIS •</textPath></text></svg><b>Rp 0</b></div>
  <div class="a" id="tagw"><div id="tag"><i></i><span class="k">PROMPT PACK</span><span class="v">Rp 499rb</span></div><div class="a" id="tagx"></div></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><img src="../assets/icons/lobe-claude-color.svg" alt=""><b class="grad">DIBIKIN CLAUDE · 5 LANGKAH</b></span></div>
  <div id="h1" class="ctr"><span class="grad">Stop beli prompt</span></div>
  <div id="h2" class="ctr"><span class="grad">bikin alatnya</span><b class="grad">sendiri</b></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS;
  // ---- the 6 prompt blocks (same palette/icons as s02): 2 columns × 3 rows; BATASAN is still snapping in (lifted + tilted)
  const ICO = {
    user: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
    pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
    list: '<path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/>',
    layout: '<rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/>',
    bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  };
  const BK = [["PERAN", "#294b77", "#1c3658", "user"], ["KONTEKS", "#3a6fe0", "#2a57c2", "pin"], ["TUGAS", "#2da44e", "#218a3e", "list"],
    ["FORMAT", "#7c5cff", "#6141e8", "layout"], ["CONTOH", "#f4b400", "#d99a00", "bulb"], ["BATASAN", "#e5484d", "#c7343a", "shield"]];
  const blk = (k, x, y, rot) => `<div class="s02-blk" style="--c:${BK[k][1]};--d:${BK[k][2]};left:${x}px;top:${y}px;transform:rotate(${rot || 0}deg)"><div class="bg"></div><i class="tab"></i><svg viewBox="0 0 24 24">${ICO[BK[k][3]]}</svg><b>${BK[k][0]}</b></div>`;
  const CX = [0, 330], RY = [0, 76, 152];                 // column-major: PERAN KONTEKS TUGAS | FORMAT CONTOH BATASAN
  const DX = P("dx", "48"), DY = P("dy", "12"), TILT = P("tilt", "-5");
  let h = `<div class="s02-sl" style="left:${CX[1]}px;top:${RY[2]}px"></div>`;
  for (let k = 0; k < 5; k++) h += blk(k, CX[Math.floor(k / 3)], RY[k % 3]);
  h += `<i class="spd" style="left:${CX[1] + DX + 312}px;top:${RY[2] + DY + 16}px;width:44px"></i><i class="spd" style="left:${CX[1] + DX + 316}px;top:${RY[2] + DY + 40}px;width:62px"></i>`;
  h += blk(5, CX[1] + DX, RY[2] + DY, TILT);
  document.getElementById("blks").innerHTML = h;
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    rb.setView({ fx: P("rx", "815"), fy: P("ry", "1575"), h: P("rh", "235"), pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0, ry: -0.42, rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] - 0.06, HF[1] - 0.12, HF[2]], hand_L: [-0.3, 0, -0.35], hand_R: [-0.3, 0, 0.35] },
      offs: { hand_L: [-0.13, 0.26, 0.06], hand_R: [0.13, 0.26, 0.06], head: [0, 0, 0] },
      face: { blink: 0, gaze: [-0.12, 0.06], happy: 1, squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.6, shadow: false });
    rb.render();
  }
  async function buildMascot() {
    const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.037, 0.034], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.037, 0.034], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [243, 186, 141], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "lidRing": 1.5, "browNy": 0.98, "headC": [0, 0.72, 0]};
    const src = await (await fetch("../compositions/mascot.html")).text();
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.6; o.color.setRGB(0.72, 0.84, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 60, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 60.05, { smooth: 1 });
    m.setView({ fx: P("mx", "300"), fy: P("my", "2050"), h: P("mh", "760"), yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    B.upperarm_R = [-2.7, 0, -0.25]; B.forearm_R = [0, 0, 0]; B.hand_R = [-0.12, 0.1, -0.12];
    B.head = [-0.08, 0.08, 0.04]; B.neck = [-0.02, 0.03, 0.02];
    m.setState({ root: { x: 0, y: 0, ry: 0.22, rz: 0, rx: 0, s: 1 }, bones: B, face: { blink: [0, 0], gaze: [-0.003, 0.006], mouthMix: 1, mouth: [0.04, 0.012, 0.005, 0.2] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, buildRobot(), buildMascot()]);
</script>
</body>
</html>

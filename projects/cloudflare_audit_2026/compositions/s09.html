      const jl = q("#s09-jl"), jr = q("#s09-jr");
      tl.set(stage, { x: 0, y: 0, scale: 1 }, 0);
      tl.set(rig, { rotationY: -40 }, 0);
      tl.set([q("#s09-floor"), q("#s09-fshadow")], { rotationX: 90, opacity: 1 }, 0);

      tl.set([q("#s09-cf"), q("#s09-cb"), q("#s09-csvg")], { opacity: 1 }, 0);
      tl.set(tile, { y: -12, scale: 1.12, rotationY: 0, rotationX: 0 }, 0);
      tl.set([tf, tb], { filter: "blur(0px)" }, 0);
      tl.set(q("#s09-aura"), { z: -40, opacity: 1, scale: 1.12 }, 0);

      tl.set([q("#s09-rail"), q("#s09-hex"), q("#s09-vpill"), jl, jr], { opacity: 0 }, 0);

      tl.set(q("#s09-slotw"), { scale: 1.17, y: 260, opacity: 0 }, 0);

      tl.set(q("#s09-quline"), { scaleX: 0 }, 0);

      // ---- 0 → 0.85: SIGNATURE 180° PIVOT — the camera completes the orbit to the far side of the same tile
      const OD = 0.85;
      ft(rig, { rotationY: -40 }, { rotationY: -180, duration: OD, ease: "power1.out" }, 0);

      ft(q("#s09-far"), { filter: "blur(10px)" }, { filter: "blur(5px)", duration: 0.5, ease: "power1.inOut" }, 0.35);
      ft([tf, tb], { filter: "blur(0px)" }, { filter: "blur(2.5px)", duration: 0.18 }, 0.04);
      ft([tf, tb], { filter: "blur(2.5px)" }, { filter: "blur(0px)", duration: 0.35 }, 0.3);
      ft([q("#s09-cf"), q("#s09-cb"), q("#s09-csvg")], { opacity: 1 }, { opacity: 0, duration: 0.25 }, 0.12);
      ft(q("#s09-brk"), { opacity: 1 }, { opacity: 0, duration: 0.18 }, 0);

      ft(q("#s09-rail"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, T.lain - 0.12);
      ft(q("#s09-hex"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.2)" }, T.lain - 0.05);
      ft([jl, jr], { opacity: 0 }, { opacity: 1, duration: 0.12 }, T.lain - 0.1);
      ft(jl, { x: 0 }, { x: -340, duration: 0.34, ease: "power3.out" }, T.lain - 0.1);
      ft(jr, { x: 0 }, { x: 340, duration: 0.34, ease: "power3.out" }, T.lain - 0.1);
      ft(q("#s09-vpill"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.22, ease: "power2.out" }, T.lain + 0.08);

      // "ditugaskan": the README rule appears — and the verifier is dispatched onto the tile
      ft(q("#s09-quote"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T.ditugaskan - 0.06);
      ft(q("#s09-beam"), { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.22, ease: "power2.out" }, T.ditugaskan + 0.18);
      ft(q("#s09-hcore"), { attr: { r: 15 } }, { attr: { r: 19 }, duration: 0.12, yoyo: true, repeat: 1 }, T.ditugaskan + 0.36);
      ft(jl, { x: -340 }, { x: -278, duration: 0.8, ease: "power2.inOut" }, T.ditugaskan + 0.12);
      ft(jr, { x: 340 }, { x: 278, duration: 0.8, ease: "power2.inOut" }, T.ditugaskan + 0.12);
      ft([q("#s09-chl"), q("#s09-chr")], { opacity: 0 }, { opacity: 1, duration: 0.2 }, T.untuk);

      // "membantah": the jaws CLAMP — pressure test: tile squeezes, evidence lines realign, crisp glint, white ring
      const M = T.membantah;
      ft(jl, { x: -278 }, { x: -232, duration: 0.09, ease: "power4.in" }, M - 0.09);
      ft(jr, { x: 278 }, { x: 232, duration: 0.09, ease: "power4.in" }, M - 0.09);
      ft(tile, { scaleX: 1.12 }, { scaleX: 1.06, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out" }, M);
      bars.forEach((b, i) => ft(b, { x: 0 }, { x: BX[i % 4], duration: 0.22, ease: "back.out(2)" }, M + 0.02));
      [tf, tb].forEach((f) => ft(f.querySelector(".s09-tglint"), { x: 0 }, { x: 760, duration: 0.42, ease: "power2.inOut" }, M - 0.06));
      ft(q("#s09-ring"), { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 1.35, duration: 0.5, ease: "power2.out" }, M);
      ft(q("#s09-flash"), { opacity: 0 }, { opacity: 1, duration: 0.05 }, M);
      ft(q("#s09-flash"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, M + 0.05);

      ft(q("#s09-quline"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, M);
      ft(q("#s09-aura"), { opacity: 0.5 }, { opacity: 1, duration: 0.15 }, M);
      // release
      ft(jl, { x: -232 }, { x: -262, duration: 0.25, ease: "power2.out" }, M + 0.26);
      ft(jr, { x: 232 }, { x: 262, duration: 0.25, ease: "power2.out" }, M + 0.26);
      ft([q("#s09-chl"), q("#s09-chr")], { opacity: 1 }, { opacity: 0, duration: 0.2 }, M + 0.26);

      // "temuannya": the pressure FLIPS the tile out of the vice and tips it back toward a filter slot (s10's slot plate,
      // matched exactly: same geometry at s10's opening world scale 1.17) — the verifier and hunter step out of frame
      const F = T.temuannya - 0.13, FD = DUR - F;
      ft(tile, { rotationY: 0, rotationX: 0, x: 0, y: -12, scale: 1.12 }, { rotationY: 170, rotationX: 52, x: -50, y: -195, scale: 1.75, duration: FD, ease: "power3.inOut" }, F);
      ft(jl, { x: -262, opacity: 1 }, { x: -520, opacity: 0, duration: 0.4, ease: "power2.in" }, F);
      ft(jr, { x: 262, opacity: 1 }, { x: 520, opacity: 0, duration: 0.4, ease: "power2.in" }, F);
      ft([q("#s09-rail"), q("#s09-hex"), q("#s09-vpill")], { opacity: 1 }, { opacity: 0, duration: 0.3 }, F + 0.05);
      ft([q("#s09-quote"), q("#s09-beam")], { opacity: 1 }, { opacity: 0, duration: 0.3 }, F + 0.05);
      ft([q("#s09-lsvg"), q("#s09-lpf"), q("#s09-lpb")], { opacity: 0.55 }, { opacity: 0, duration: 0.3 }, F);
      ft([q("#s09-floor"), q("#s09-fshadow")], { opacity: 1 }, { opacity: 0, duration: 0.35 }, F);
      ft(q("#s09-aura"), { opacity: 1 }, { opacity: 0.35, duration: 0.4 }, F + 0.1);
      ft(q("#s09-far"), { opacity: 1 }, { opacity: 0, duration: 0.35 }, F);
      ft(q("#s09-far2"), { opacity: 0 }, { opacity: 1, duration: 0.45 }, F + 0.2);
      ft(q("#s09-slotw"), { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, F + 0.12);
      ft(q("#s09-sline"), { scaleX: 0.3 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, F + 0.3);

      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);

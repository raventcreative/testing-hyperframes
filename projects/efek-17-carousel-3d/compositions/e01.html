<template>
  <script src="assets/presenter.js"></script>
  <style>
    #e1-root { position: absolute; inset: 0; overflow: hidden; }
    .e1-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
    .e1-card { position: absolute; left: 0; top: 0; width: 150px; height: 196px; padding: 10px; opacity: 0; }
    .e1-card .th { width: 130px; height: 120px; border-radius: 10px; position: relative; overflow: hidden; }
    .e1-card .ln { height: 10px; border-radius: 5px; background: #c7d4e3; margin-top: 10px; }
    .e1-card .ln.s { width: 70%; background: #dde6f0; margin-top: 7px; }
    .e1-play { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: rgba(255,255,255,0.92); }
    .e1-play::after { content: ""; position: absolute; left: 15px; top: 11px; border-left: 13px solid #0d1a3d; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  </style>
  <div id="e1-root" data-composition-id="e01" data-width="1080" data-height="1350">
    <div id="e1-bd" class="e1-layer"></div>
    <div id="e1-back" class="e1-layer" data-layout-ignore></div>
    <div id="e1-figwrap" class="e1-layer"><video id="e1-mascot" class="clip" data-start="0" data-duration="4" src="assets/mascot/mascot_jas_loop_1x.webm" muted playsinline
      style="position:absolute;left:0;top:0;width:1080px;height:1350px"></video></div>
    <div id="e1-front" class="e1-layer" data-layout-ignore></div>
    <div id="e1-cap" class="k-cap" style="opacity:0">Konten, <span class="hl">klien</span>, hasil.</div>
    <div id="e1-chrome" class="e1-layer"></div>
  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const ei = (x) => Math.pow(clamp(x, 0, 1), 3);
      const H = window.HFP;
      document.getElementById("e1-bd").innerHTML = H.backdropHTML("e1b");
      // 3D mascot plate (transparent talking loop), default framing: scale 0.78 about the feet, feet on y 1160
      document.getElementById("e1-figwrap").style.transform = "translate(0px,-44px) scale(0.78)";
      document.getElementById("e1-figwrap").style.transformOrigin = "540px 1204px";
      document.getElementById("e1-chrome").innerHTML = H.chromeHTML("e1c", 1, "Orbit");

      // 5 screenshot cards; each exists in the BACK layer and the FRONT layer, only one copy visible per frame
      const THEMES = [
        "linear-gradient(150deg,#00c9ff,#294b77)", "linear-gradient(150deg,#ffd166,#ef8354)",
        "linear-gradient(150deg,#7f5af0,#2cb1bc)", "linear-gradient(150deg,#2ec4b6,#0b3c5d)", "linear-gradient(150deg,#f15bb5,#3a0ca3)"];
      const cardHTML = (i) => `<div class="th" style="background:${THEMES[i]}">${i % 2 === 0 ? '<div class="e1-play"></div>' : '<svg viewBox="0 0 130 120" style="position:absolute;inset:0"><path d="M12 96 L40 70 L62 82 L92 44 L118 30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>'}</div><div class="ln"></div><div class="ln s"></div>`;
      const back = [], front = [];
      for (let i = 0; i < 5; i++) {
        for (const [host, arr] of [[document.getElementById("e1-back"), back], [document.getElementById("e1-front"), front]]) {
          const d = document.createElement("div"); d.className = "e1-card k-card"; d.innerHTML = cardHTML(i); host.appendChild(d); arr.push(d);
        }
      }
      // orbit around the chest: centre (540, 905), ellipse rx 330 / ry 64 — stays below the chin (732)
      const C = { x: 540, y: 905 }, RX = 340, RY = 70, PER = 1.3;
      function render(t) {
        const grow = eo(seg(t, 0.35, 0.95)) * (1 - ei(seg(t, 3.35, 3.85)));       // spring out of the chest, fold back in for the loop
        const spin = (t - 0.35) / PER * Math.PI * 2;
        for (let i = 0; i < 5; i++) {
          const a = spin + (i / 5) * Math.PI * 2;
          const x = C.x + Math.cos(a) * RX * grow, y = C.y + Math.sin(a) * RY * grow;
          const depth = Math.sin(a);                                                  // >0 = in front of the body
          const sc = (0.78 + (1.05 - 0.78) * (depth * 0.5 + 0.5)) * (0.4 + 0.6 * grow);
          const rot = -Math.cos(a) * 9;                                               // cards tilt with the orbit
          const tf = "translate(" + (x - 75).toFixed(1) + "px," + (y - 98).toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")";
          const op = clamp(grow * 1.6, 0, 1);
          back[i].style.transform = tf; front[i].style.transform = tf;
          back[i].style.opacity = depth < 0 ? (op * 0.92).toFixed(3) : "0";
          front[i].style.opacity = depth >= 0 ? op.toFixed(3) : "0";
          back[i].style.filter = "brightness(" + (0.78 + 0.22 * (depth + 1) / 2).toFixed(3) + ")";
        }
        const cap = document.getElementById("e1-cap");
        const c = eo(seg(t, 0.3, 0.6)) * (1 - seg(t, 3.5, 3.8));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px)";
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e01"] = tl;
    })();
  </script>
</template>

      // Layers: key poses on measured VO word times -> per-bone damped springs (anticipation, overlap,
      // follow-through, settle) -> stressed-syllable head accents from the VO energy -> audio-driven lip
      // sync (CTC-aligned phones x energy, zero-phase low-pass: never ahead of the voice, closed in

      const M3 = window.Mascot3D;
      const { buildPerformance, buildLipTrack, syllableAccents, vnoise, bump, osc, E } = M3;

      // Green Screen Compositing (Smart Motion Director): ivory light wrap + soft contact shadow
      gsap.set(canvas, { filter: "drop-shadow(0 0 2px rgba(255,254,251,.95)) drop-shadow(14px 22px 26px rgba(28,51,84,.22))" });
      const mouthAt = buildLipTrack(window.VO_PHONES, window.VO_ENV, D);
      const ACC = syllableAccents(window.VO_ENV, VW, window.VO_PHONES, D);
      const one = (x) => Math.max(0, Math.min(1, x));
      const sm = (u) => { u = one(u); return u * u * u * (u * (u * 6 - 15) + 10); };

      const HOST = { fx: 230, fy: 2075, h: 760 };       // chest-up, bottom-left corner
      const HOST_BIG = { fx: 305, fy: 2085, h: 840 }; // a little closer (hook + CTA)
      const HIDE = -1.05;

      function waveLayer(t, t0, t1, side) {
        const e = sm((t - t0) / 0.25) * sm((t1 - t) / 0.3);
        if (e <= 0) return {};
        const ph = (t - t0) * 2 * Math.PI * 2.1, s = side === "L" ? 1 : -1;
        return { ["forearm_" + side]: [0, 0, s * 0.42 * Math.sin(ph) * e], ["hand_" + side]: [0, 0, s * 0.3 * Math.sin(ph - 0.9) * e] };
      }
      function shake(t, t0, t1, amp) { return osc(t, t0, t1, 3.3, amp, 0, 0.12, 0.2); }
      function accents(t) {
        let n = 0;
        for (const a of ACC) { const d = t - a[0]; if (d > -0.25 && d < 0.35) n += bump(t, a[0] + 0.05, 0.17) * a[1]; }
        return Math.min(1.3, n);
      }
      function idle(t, seed) {
        return {
          chest: [0.012 * Math.sin(t * 2 * Math.PI * 0.27), 0, 0],
          spine: [0, 0.03 * vnoise(t, seed + 1, 0.3), 0.022 * vnoise(t, seed + 2, 0.27)],
          head: [0.02 * vnoise(t, seed + 3, 0.4), 0.05 * vnoise(t, seed + 4, 0.31), 0.03 * vnoise(t, seed + 5, 0.36)],
          forearm_L: [0.04 * vnoise(t, seed + 6, 0.45), 0, 0], forearm_R: [0.04 * vnoise(t, seed + 7, 0.42), 0, 0],
        };
      }
      const add = (...ds) => { const o = {}; for (const d of ds) for (const [k, v] of Object.entries(d || {})) { const a = o[k] || [0, 0, 0]; o[k] = [a[0] + v[0], a[1] + v[1], a[2] + v[2]]; } return o; };
      function win(def) {
        const loc = (k) => k.map((x) => [x[0] - def.t0, x[1], x[2]]);
        const tr = {};
        for (const n of ["armL", "armR", "torso", "head", "root"]) if (def[n]) tr[n] = loc(def[n]);
        def.perf = buildPerformance(tr, def.t1 - def.t0 + 0.05);
        return def;
      }

      // ===================================================================== HOST PERFORMANCE (0 – D)
      // One continuous chest-up performance in the bottom-left corner. armL (his left) reaches toward the
      // hero (screen-right); armR gestures on his side. Every key sits on a measured VO word (w(i)).
      // Head yaw > 0 = looking toward the hero; the head tracks the moving mechanism like eye-follow.
      const TOWARD = { ry: 0.26 };
      const H = (rx, ry, rz) => [rx, ry, rz];
      const W1 = win({
        t0: 0, t1: D, seed: 17,
        view(t) {
          if (t < 0.6) return lerpV(HOST_BIG, HOST, sm(t / 0.6));
          if (t > 52.15) return lerpV(HOST, HOST_BIG, sm((t - 52.15) / 0.6));
          return HOST;
        },
        root: [[0, { y: -0.42, ry: 0.1 }, 0.01], [0.02, { y: 0, ry: 0.18 }, 0.38], [w(4) - 0.2, TOWARD, 0.4], [w(9), { ry: 0.32 }, 0.5],
               [w(20), { ry: 0.2 }, 0.5], [w(40), { ry: 0.3 }, 0.5], [w(47), { ry: 0.15 }, 0.5], [w(53), { ry: 0.28 }, 0.5],
               [w(69), { ry: 0.22 }, 0.5], [w(81), TOWARD, 0.5], [w(99), { ry: 0.3 }, 0.5], [w(116) - 0.2, { ry: 0.18 }, 0.5]],
        armL: [
          [0, "low", 0.2], [w(0) - 0.12, "open", 0.3], [w(2) - 0.1, "explain", 0.35], [w(4) - 0.18, "pointUp", 0.32], [w(6) - 0.12, "present", 0.35],
          [w(7) - 0.16, "point", 0.28], [w(9) - 0.12, "present", 0.32],                                               // s02 Lihat / kebuka
          [w(10) - 0.12, "explainHi", 0.3], [w(11) - 0.08, "low", 0.35], [w(12) - 0.12, "palmUp", 0.3],                // s03 beats
          [w(14) - 0.15, "point", 0.32], [w(17), "point", 0.6], [w(19) - 0.15, "together", 0.32], [w(19) + 0.55, "open", 0.4], // s04 rail
          [w(20) + 0.1, "low", 0.45], [w(24) - 0.12, "explainHi", 0.35], [w(26), "low", 0.4], [w(28) - 0.14, "fist", 0.26],   // s05 kode
          [w(29) - 0.12, "palmUp", 0.32], [w(31), "low", 0.4], [w(35) - 0.16, "pointUp", 0.3],                         // s06 Claude Code
          [w(37) - 0.12, "present", 0.32], [w(39), "low", 0.4],                                                        // s07
          [w(40) - 0.12, "point", 0.3], [w(42) - 0.1, "pointUp", 0.24], [w(43) - 0.1, "explain", 0.32], [w(45), "low", 0.35], [w(46) - 0.14, "fist", 0.24], // s08 s09
          [w(47) + 0.2, "low", 0.45], [w(52) - 0.12, "together", 0.3], [w(52) + 0.5, "open", 0.4],                     // s10
          [w(55) - 0.16, "point", 0.28], [w(56), "low", 0.35], [w(59) - 0.14, "stop", 0.28],                          // s11
          [w(61) - 0.1, "low", 0.35], [w(63) - 0.16, "pointUp", 0.28], [w(64) + 0.1, "explain", 0.35], [w(68) - 0.14, "fist", 0.24], // s12
          [w(69) - 0.1, "open", 0.32], [w(74) - 0.12, "together", 0.32], [w(77) - 0.14, "point", 0.28], [w(78) - 0.12, "present", 0.28], [w(80) - 0.14, "pointUp", 0.28], // s13
          [w(81) + 0.1, "explain", 0.35], [w(84), "low", 0.3], [w(86) - 0.12, "point", 0.28],                         // s14
          [w(91) + 0.1, "low", 0.4], [w(92) - 0.12, "explain", 0.32], [w(95) - 0.05, "low", 0.35], [w(98) - 0.16, "shrug", 0.3], // s15
          [w(99), "low", 0.4], [w(102) - 0.16, "pointUp", 0.28], [w(103) - 0.08, "explain", 0.28], [w(104) - 0.08, "explainHi", 0.28], [w(106) - 0.12, "point", 0.28], // s16
          [w(109) - 0.1, "present", 0.3], [w(113) - 0.12, "palmUp", 0.3], [w(115) - 0.08, "open", 0.3],              // s17
          [w(116) - 0.18, "pointUp", 0.3], [w(118) - 0.05, "present", 0.35],                   // s18
        ],
        armR: [
          [0, "low", 0.2], [w(0) - 0.12, "open", 0.3], [w(2), "low", 0.4], [w(6) - 0.12, "open", 0.35], [w(7) - 0.1, "low", 0.35],
          [w(9) - 0.12, "open", 0.32], [w(10) - 0.05, "low", 0.35], [w(11) - 0.12, "explain", 0.3], [w(12) + 0.1, "low", 0.35],
          [w(19) - 0.15, "together", 0.32], [w(19) + 0.55, "open", 0.4], [w(20) + 0.1, "explain", 0.4], [w(23), "low", 0.4],
          [w(28) + 0.3, "low", 0.4], [w(32) - 0.12, "palmUp", 0.32], [w(34), "low", 0.4],
          [w(38) - 0.1, "explain", 0.3], [w(40) - 0.05, "low", 0.35],
          [w(47) - 0.1, "chin", 0.4], [w(51), "low", 0.4], [w(52) - 0.12, "together", 0.3], [w(52) + 0.5, "open", 0.4], [w(53), "low", 0.4],
          [w(57) - 0.12, "explain", 0.3], [w(58), "low", 0.35],
          [w(64) - 0.1, "explain", 0.32], [w(67), "low", 0.4],
          [w(69) - 0.1, "open", 0.32], [w(74) - 0.12, "together", 0.32], [w(76), "low", 0.4],
          [w(84) - 0.12, "stop", 0.26], [w(86) + 0.1, "low", 0.4],
          [w(91) - 0.12, "palmUp", 0.3], [w(93), "low", 0.4], [w(95) - 0.12, "explain", 0.3], [w(97), "low", 0.35], [w(98) - 0.16, "shrug", 0.3],
          [w(99), "low", 0.4], [w(105) - 0.1, "explainHi", 0.3], [w(107), "low", 0.4],
          [w(115) - 0.08, "open", 0.3], [w(116), "low", 0.35], [w(118) - 0.1, "wave", 0.3], [53.7, "low", 0.38],
        ],
        torso: [
          [0, { spine: [-0.05, 0, 0] }, 0.2], [w(0), { spine: [-0.08, 0, 0.03], chest: [-0.03, 0, 0] }, 0.3], [w(2), {}, 0.4],
          [w(4) - 0.15, { chest: [0.02, 0.12, 0] }, 0.35], [w(7) - 0.1, { chest: [0.07, 0.14, 0], spine: [0.04, 0, 0] }, 0.3],   // lean in: "Lihat"
          [w(9), { spine: [-0.06, 0, 0] }, 0.4], [w(10), {}, 0.4], [w(19) - 0.1, { chest: [-0.05, 0, 0] }, 0.3], [w(20), {}, 0.5],
          [w(28) - 0.1, { chest: [0.06, 0.08, 0] }, 0.25], [w(29), {}, 0.4], [w(35) - 0.1, { chest: [0.04, 0.12, 0] }, 0.3], [w(37), {}, 0.4],
          [w(46) - 0.1, { chest: [0.06, 0.06, 0] }, 0.25], [w(47), { spine: [0, 0, 0.05] }, 0.5], [w(52) - 0.1, { chest: [-0.04, 0, 0] }, 0.3], [w(53), {}, 0.4],
          [w(55) - 0.1, { chest: [0.05, 0.12, 0] }, 0.3], [w(60), {}, 0.4], [w(63) - 0.1, { chest: [0.04, 0.1, 0] }, 0.3], [w(68) - 0.1, { chest: [0.07, 0.06, 0] }, 0.25],
          [w(69), {}, 0.4], [w(77) - 0.1, { chest: [0, 0.06, 0] }, 0.4], [w(80) - 0.1, { chest: [0, 0.16, 0] }, 0.4], [w(81), {}, 0.5],
          [w(98) - 0.12, { spine: [-0.03, 0, -0.04], chest: [-0.03, 0, 0] }, 0.3], [w(99), {}, 0.4],

        ],
        head: [
          [0, H(-0.06, 0.1, 0.05), 0.2], [w(0), H(-0.1, 0.16, 0.08), 0.28], [w(2) - 0.05, H(0.02, 0.18, 0), 0.3], [w(4) - 0.1, H(-0.08, 0.36, 0.02), 0.3],
          [w(6), H(0.04, 0.08, -0.04), 0.3], [w(7) - 0.08, H(0.04, 0.34, 0.02), 0.25], [w(9) - 0.05, H(-0.1, 0.28, 0.06), 0.3],
          [w(10), H(-0.06, 0.3, 0), 0.25], [w(11), H(0, 0.2, 0.05), 0.25], [w(12), H(-0.04, 0.32, -0.03), 0.25],
          [w(14), H(0, 0.12, 0), 0.4], [w(16), H(-0.04, 0.38, 0.02), 1.0], [w(19), H(-0.1, 0.24, 0.05), 0.3],                       // follows the rail
          [w(20), H(0.03, 0.05, 0), 0.4], [w(24), H(0, 0.22, 0.04), 0.35], [w(28) - 0.05, H(0.1, 0.25, 0), 0.22],
          [w(29), H(0.02, 0.15, 0), 0.4], [w(35) - 0.08, H(-0.06, 0.34, 0.03), 0.3], [w(37), H(0, 0.24, 0), 0.4],
          [w(40), H(-0.02, 0.36, 0), 0.4], [w(41), H(0.03, 0.26, 0.04), 0.3], [w(42) - 0.05, H(0.06, 0.3, -0.03), 0.22], [w(43), H(0, 0.2, 0), 0.35], [w(46) - 0.06, H(0.1, 0.24, 0), 0.22],
          [w(47), H(-0.1, -0.08, 0.12), 0.45], [w(52) - 0.05, H(0.04, 0.2, 0), 0.3],                                                     // "bayangin": thinking tilt
          [w(55) - 0.08, H(-0.02, 0.36, 0), 0.25], [w(57), H(0.02, 0.2, 0.05), 0.3], [w(59) - 0.05, H(0, 0.3, -0.04), 0.25],
          [w(63) - 0.1, H(-0.08, 0.32, 0), 0.3], [w(65), H(0.02, 0.12, 0.04), 0.35], [w(68) - 0.06, H(0.1, 0.22, 0), 0.22],
          [w(69), H(0, 0.1, 0), 0.4], [w(77) - 0.1, H(0.02, 0.18, 0), 0.3], [w(78) - 0.1, H(0, 0.3, 0), 0.3], [w(80) - 0.1, H(-0.08, 0.42, 0), 0.3],
          [w(81), H(0, 0.2, 0), 0.4], [w(86) - 0.08, H(0.02, 0.34, 0), 0.3], [w(91), H(0.02, 0.1, 0.04), 0.4],
          [w(98) - 0.1, H(0.04, 0.05, 0.14), 0.3], [w(99), H(0, 0.2, 0), 0.4], [w(102) - 0.1, H(-0.06, 0.36, 0), 0.3],
          [w(103), H(0, 0.26, 0.04), 0.25], [w(104), H(0, 0.34, -0.03), 0.25], [w(106), H(-0.02, 0.3, 0.02), 0.3],
          [w(109), H(0, 0.28, 0), 0.35], [w(115) - 0.05, H(-0.04, 0.12, 0.08), 0.3], [w(116) - 0.1, H(-0.1, 0.24, 0), 0.3],
          [w(118), H(0.04, 0.1, 0.05), 0.35], [53.7, H(0.02, 0.12, 0.03), 0.38],
        ],
        extra(t) {
          const calm = 1 - sm((t - 53.9) / 0.5);  // final frame settles still
          return add(waveLayer(t, w(118), 53.72, "R"),
                     { head: [0, shake(t, w(84) - 0.02, w(85) + 0.12, 0.16) * calm, 0], neck: [0, shake(t, w(84) - 0.02, w(85) + 0.12, 0.06), 0] });
        },
      });
      const WINDOWS = [W1];


      let mascot = null, lastVisible = null;
      function apply(t) {
        const c = WINDOWS.find((k) => t >= k.t0 - 0.001 && t < k.t1 - 0.001);
        if (!c) {
          if (lastVisible !== false) { mascot.setState({ visible: false }); mascot.render(); lastVisible = false; }
          canvas.style.visibility = "hidden";
          return;
        }
        lastVisible = true;
        canvas.style.visibility = "visible";
        const P = c.perf(t - c.t0);
        const acc = accents(t);
        const still = 1 - sm((t - (D - 0.7)) / 0.45);  // the last frames hold perfectly still
        const id = idle(t, c.seed); for (const k in id) id[k] = id[k].map((x) => x * still);
        const bones = add(P.bones, id, c.extra ? c.extra(t) : {}, { head: [0.06 * acc, 0, 0], neck: [0.02 * acc, 0, 0], chest: [0.015 * acc, 0, 0] });
        const root = { x: P.root.x, y: P.root.y, ry: P.root.ry + 0.03 * vnoise(t, c.seed + 9, 0.22) * still, rz: P.root.rz, s: P.root.s };
        const face = { blink: [0, 0], mouthMix: 1, mouth: mouthAt(t) }; // eyes stay open (the GLB has no eyelids)
        const v = Object.assign({}, c.view(t));
        v.yaw = 4 * Math.sin(t * 2 * Math.PI * 0.09) * still;   // Cinematic Orbit: slow camera orbit around the host
        mascot.setView(v);
        mascot.setState({ root, bones, face });
        mascot.render();
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const FACE = {"eyeA":{"c":[-0.099,0.583],"r":[0.049,0.039],"J":[-0.012594276485253965,0.5728894913572795,0.5928449952437722,0.008744878544633893]},"eyeB":{"c":[0.1,0.584],"r":[0.046,0.04],"J":[0.6644280491730516,0.030130365931821397,0.015549679888023958,-0.6054649097597234]},"browA":{"c":[-0.085,0.675],"J":[-0.04070834735419224,0.5537413339891137,0.591952051964936,0.06466756331213208]},"browB":{"c":[0.089,0.674],"J":[-0.1673063019885604,0.6553582065976762,0.5221243728997077,0.18775902203022735]},"mouth":{"c":[0.001,0.521],"r":[0.0266,0.0164]},"skin":[243,207,186],"skinEye":[246,214,195]};
      const ready = M3.Mascot.create(canvas, { url: "assets/mascot3d/mascot_rigged_v4.glb", face: FACE, width: 1080, height: 1920 })
        .then((m) => { mascot = m; apply(0); });
      window.__hf.buildReady["mascot"] = ready;
      window.addEventListener("hf-seek", (e) => {
        const t = e.detail.time;
        if (mascot) apply(t);
        else if (e.detail.waitUntil) e.detail.waitUntil(ready.then(() => apply(t)));
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, D - 0.02);
      window.__timelines["mascot"] = tl;
    })();
  </script>

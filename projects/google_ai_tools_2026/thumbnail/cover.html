<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Google AI Tools</title>
<!-- Minimal REF-H Reels cover 1080x1920: one hook line, one hero (the s02 hub: 2 tools retired, 3 kept), lots of negative space.
     Key content sits inside the centred 4:5 grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8767 at project root) -->
<style>
  @font-face { font-family: Montserrat; src: url(../assets/fonts/montserrat-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Montserrat; src: url(../assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Montserrat; src: url(../assets/fonts/montserrat-latin-900-normal.woff2) format("woff2"); font-weight: 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f7fb; font-family: Montserrat, sans-serif; color: #202b3b; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/pastel_background_1080x1920.png) center / cover no-repeat; }
  .wash { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 42% at 50% 30%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); }
  /* hero: the real s02 frame, scaled down and feathered into the plate */
  .hero { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(hero_s02.png) center / 1080px 1920px no-repeat;
    transform-origin: 540px 1060px; transform: translate(0, 120px) scale(0.74);
    -webkit-mask-image: radial-gradient(ellipse 50% 30% at 50% 55%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 30% at 50% 55%, #000 62%, transparent 100%); }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 445px; top: 318px; width: 190px; }
  #rule { position: absolute; left: 516px; top: 378px; width: 48px; height: 2px; background: #294b77; opacity: .7; }
  #eyebrow { top: 408px; font: 700 20px/1 Montserrat; letter-spacing: 9px; color: rgba(41,75,119,.62); }
  #l1 { top: 470px; font: 400 58px/1.1 Montserrat; letter-spacing: -.5px; color: #202b3b; }
  #l2 { top: 536px; font: 900 168px/1 Montserrat; letter-spacing: -7px; color: #1c3354; }
  #l2 i { font-style: normal; color: #3a6299; margin-right: 6px; }
  #l3 { top: 724px; font: 400 32px/1.3 Montserrat; color: #5b6676; }
  #l3 b { font-weight: 700; color: #294b77; }
  .grain { position: absolute; inset: 0; background: url(../assets/brand/grain_256.png); opacity: .35; mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div>
  <div class="wash"></div>
  <div class="hero"></div>
  <img id="logo" src="../assets/brand/ai_preneur_logo_trimmed.png" alt="AI PRENEUR">
  <div id="rule"></div>
  <div id="eyebrow" class="ctr">GOOGLE AI TOOLS · 2026</div>
  <div id="l1" class="ctr">Google pensiunkan</div>
  <div id="l2" class="ctr"><i>2</i> tools.</div>
  <div id="l3" class="ctr">Ini <b>3</b> yang masih layak kamu coba.</div>
  <div class="grain"></div>
</div>
<script>window.COVER_READY = document.fonts.ready.then(() => new Promise((r) => { const i = new Image(); i.onload = r; i.src = "hero_s02.png"; }));</script>
</body>
</html>

<!doctype html>
<html><head><meta charset="UTF-8" />
<!-- R36: open-source brand logo (Simple Icons CC0 path) -> SVGLoader -> ExtrudeGeometry (small bevel, brand colour) rendered as a
     36-frame turntable sprite (6 x 6 grid of 240 px cells, 10° per frame) so the reel can spin/pop the real 3D object without a
     live WebGL context per scene. ?name=claudecode&col=%23D97757 -->
<script src="../vendor/logos.js"></script>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>html,body{margin:0;width:1440px;height:1440px;background:transparent;overflow:hidden}</style></head>
<body><canvas id="c" width="1440" height="1440"></canvas>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search), name = q.get("name"), Lg = window.LOGOS[name], col = q.get("col") || Lg.hex;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(1440, 1440, false); r.setClearColor(0, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
r.setScissorTest(true);
const scene = new THREE.Scene(); scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const k = new THREE.DirectionalLight(0xffffff, 2.2); k.position.set(2, 3, 5); scene.add(k);
const rim = new THREE.DirectionalLight(0x6adfff, 2.2); rim.position.set(-4, 2, -3); scene.add(rim);
const data = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="${Lg.path}"/></svg>`);
const shapes = data.paths.flatMap((p) => SVGLoader.createShapes(p));
const geo = new THREE.ExtrudeGeometry(shapes, { depth: 3, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.35, bevelSegments: 4, curveSegments: 24 });
geo.center(); geo.scale(1, -1, 1);
const c = new THREE.Color(col);
const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: c, roughness: 0.35, metalness: 0.0, emissive: c, emissiveIntensity: 0.16 }));
const piv = new THREE.Group(); piv.add(mesh); piv.rotation.x = 0.1; scene.add(piv);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 200); cam.position.set(0, 0, 60); cam.lookAt(0, 0, 0);
for (let i = 0; i < 36; i++) {
  mesh.rotation.y = (i * 10 * Math.PI) / 180;
  const x = (i % 6) * 240, y = 1440 - 240 - Math.floor(i / 6) * 240;   // GL origin = bottom-left
  r.setViewport(x, y, 240, 240); r.setScissor(x, y, 240, 240); r.render(scene, cam);
}
window.READY = true;
</script></body></html>

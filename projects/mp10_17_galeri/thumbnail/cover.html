<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Bukti Transfer Nyelip di Galeri</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero object = the film's tilted gallery phone (own flat illustrations: selfies, food, memes) with a transfer screenshot and a
     receipt photo popping out of the grid with yellow "found" rings. No numbers (amounts drawn as bars). -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: PFD; src: url(../assets/fonts/playfair-display-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 384px; font: 800 150px/1.0 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 712px; font: italic 400 60px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: -60px; top: 860px; width: 900px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.18), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 420px 1200px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; }
  .scr { position: absolute; left: -232px; top: -470px; width: 464px; height: 940px; border-radius: 52px; overflow: hidden; background: #fff; transform: translateZ(1px); }
  .sbar { position: absolute; left: 0; top: 0; width: 100%; height: 50px; padding: 20px 36px 0 40px; display: flex; justify-content: space-between; font: 700 19px/1 PS; color: #161D3A; }
  .hd { position: absolute; left: 26px; top: 64px; font: 700 38px/1 PS; color: #161D3A; }
  .hd small { display: block; margin-top: 8px; font: 600 18px/1 PS; color: #5B6478; }
  .gr { position: absolute; left: 6px; top: 150px; width: 452px; display: grid; grid-template-columns: repeat(3, 146px); gap: 7px; }
  .gr i { display: block; width: 146px; height: 146px; border-radius: 8px; overflow: hidden; position: relative; }
  .gr i.gone { opacity: .0; }
  .gr svg, .pop svg { display: block; width: 100%; height: 100%; }
  .pop { position: absolute; width: 206px; height: 206px; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 60px rgba(3,6,24,.5); }
  .pop b { position: absolute; inset: 0; border-radius: 14px; border: 9px solid #FED111; box-shadow: inset 0 0 0 3px rgba(255,255,255,.6); }
  #t3 { position: absolute; left: 600px; top: 846px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 32px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(3deg); box-shadow: 0 20px 40px rgba(3,6,24,.4); }
  #t3 svg { width: 32px; height: 32px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">BUKTI<br /><span>NYELIP?</span></div>
  <div id="t2">di antara selfie &amp; foto makanan</div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <div id="t3"><svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>Mana buktinya?</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const S0 = '<svg viewBox="0 0 206 206" xmlns="http://www.w3.org/2000/svg">', S1 = "</svg>";
  const T = {
    selfie: (bg, skin, hair, shirt) => S0 + `<rect width="206" height="206" fill="${bg}"/><circle cx="168" cy="42" r="28" fill="#fff" opacity=".32"/>` +
      `<path d="M30 206 C34 160 64 146 103 146 C142 146 172 160 176 206Z" fill="${shirt}"/><rect x="90" y="118" width="26" height="34" rx="10" fill="${skin}" opacity=".85"/>` +
      `<path d="M64 96 C60 54 86 40 106 42 C134 44 148 64 142 98 L146 132 C136 118 132 100 132 84 C120 76 96 74 74 86 C72 104 70 118 62 130Z" fill="${hair}"/>` +
      `<ellipse cx="103" cy="94" rx="35" ry="39" fill="${skin}"/><path d="M68 90 C66 58 88 50 106 52 C128 54 140 68 138 90 C128 72 112 68 98 70 C86 72 76 78 68 90Z" fill="${hair}"/>` +
      `<circle cx="90" cy="98" r="4.2" fill="#2b2118"/><circle cx="116" cy="98" r="4.2" fill="#2b2118"/><path d="M91 113 Q103 124 115 113" fill="none" stroke="#7a3b2e" stroke-width="4" stroke-linecap="round"/>` + S1,
    hijab: (bg, skin, hj, shirt) => S0 + `<rect width="206" height="206" fill="${bg}"/><path d="M30 206 C34 162 62 150 103 150 C144 150 172 162 176 206Z" fill="${shirt}"/><path d="M50 206 C44 150 58 122 103 122 C148 122 162 150 156 206Z" fill="${hj}"/>` +
      `<path d="M60 100 C56 50 82 38 103 38 C124 38 150 50 146 100 C146 132 128 146 103 146 C78 146 60 132 60 100Z" fill="${hj}"/><ellipse cx="103" cy="98" rx="27" ry="31" fill="${skin}"/>` +
      `<circle cx="93" cy="97" r="3.8" fill="#2b2118"/><circle cx="113" cy="97" r="3.8" fill="#2b2118"/><path d="M93 110 Q103 119 113 110" fill="none" stroke="#7a3b2e" stroke-width="3.6" stroke-linecap="round"/>` + S1,
    kopi: () => S0 + `<rect width="206" height="206" fill="#C89B72"/><path d="M0 44h206M0 104h206M0 160h206" stroke="#b5875f" stroke-width="4"/><circle cx="103" cy="106" r="72" fill="#F4EFE6"/>` +
      `<path d="M160 92 h24 a13 13 0 0 1 0 28 h-24" fill="none" stroke="#fff" stroke-width="11"/><circle cx="103" cy="106" r="52" fill="#fff"/><circle cx="103" cy="106" r="43" fill="#8A5A3C"/>` +
      `<path d="M103 128 C80 112 82 90 95 88 C101 87 103 94 103 94 C103 94 105 87 111 88 C124 90 126 112 103 128Z" fill="#F3E2C7"/>` + S1,
    mie: () => S0 + `<rect width="206" height="206" fill="#F7E3C2"/><circle cx="103" cy="110" r="80" fill="#fff"/><circle cx="103" cy="110" r="80" fill="none" stroke="#D9534A" stroke-width="6"/><circle cx="103" cy="110" r="64" fill="#F2B63D"/>` +
      `<path d="M56 100 q12 -12 24 0 t24 0 t24 0 t24 0 M52 120 q12 -12 24 0 t24 0 t24 0 t24 0 M62 82 q10 -10 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#FFE08A" stroke-width="6" stroke-linecap="round"/>` +
      `<ellipse cx="132" cy="126" rx="18" ry="14" fill="#fff"/><circle cx="132" cy="126" r="8" fill="#F5A623"/><path d="M152 6 L74 186 M168 10 L90 190" stroke="#8B5A2B" stroke-width="7" stroke-linecap="round"/>` + S1,
    sunset: () => S0 + `<rect width="206" height="206" fill="#FF9A62"/><rect width="206" height="60" fill="#C86DD7"/><rect y="60" width="206" height="44" fill="#FF7A7A"/><circle cx="103" cy="120" r="34" fill="#FFE08A"/>` +
      `<rect y="128" width="206" height="78" fill="#3A4C8F"/><path d="M70 146h66M82 160h42M92 174h22" stroke="#FFE08A" stroke-width="5" stroke-linecap="round" opacity=".8"/>` + S1,
    kucing: () => S0 + `<rect width="206" height="206" fill="#EDE3D6"/><ellipse cx="108" cy="126" rx="66" ry="40" fill="#9AA0AE"/><circle cx="64" cy="112" r="30" fill="#A7ADBA"/><path d="M42 96 L44 68 L62 86Z M78 86 L90 64 L94 92Z" fill="#A7ADBA"/>` +
      `<path d="M50 114 q6 5 12 0 M70 114 q6 5 12 0" fill="none" stroke="#3b3f4a" stroke-width="3" stroke-linecap="round"/><path d="M168 136 C196 130 196 160 170 160" fill="none" stroke="#9AA0AE" stroke-width="12" stroke-linecap="round"/>` + S1,
    meme: (bg, top, bot) => S0 + `<rect width="206" height="206" fill="${bg}"/><circle cx="103" cy="110" r="50" fill="#F5A55B"/><path d="M58 88 L62 44 L92 70Z M148 88 L144 44 L114 70Z" fill="#F5A55B"/>` +
      `<circle cx="84" cy="104" r="14" fill="#fff"/><circle cx="122" cy="104" r="14" fill="#fff"/><circle cx="84" cy="106" r="5.5" fill="#222"/><circle cx="122" cy="106" r="5.5" fill="#222"/><ellipse cx="103" cy="132" rx="7" ry="9" fill="#5a2a1a"/>` +
      `<g font-family="Rubik" font-weight="800" text-anchor="middle" fill="#fff" stroke="#111" stroke-width="6" paint-order="stroke" stroke-linejoin="round"><text x="103" y="42" font-size="30">${top}</text><text x="103" y="192" font-size="30">${bot}</text></g>` + S1,
    // the story's key photos, drawn without amounts (bars instead of numbers)
    transfer: () => S0 + `<rect width="206" height="206" fill="#fff"/><rect width="206" height="28" fill="#EEF0F6"/><circle cx="103" cy="70" r="27" fill="#212C5F"/><path d="M90 70 l9 9 l17 -18" fill="none" stroke="#FED111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<text x="103" y="124" text-anchor="middle" font-family="PS" font-weight="700" font-size="18" fill="#4F5872">Transfer berhasil</text><rect x="46" y="140" width="114" height="18" rx="9" fill="#161D3A"/><rect x="62" y="174" width="82" height="9" rx="4.5" fill="#C9CFE0"/>` + S1,
    nota: () => S0 + `<rect width="206" height="206" fill="#5B4636"/><path d="M0 50h206M0 116h206M0 172h206" stroke="#4E3B2D" stroke-width="5"/><g transform="rotate(-6 103 103)">` +
      `<path d="M40 12 H166 V184 ${Array.from({ length: 14 }, (_, i) => `l-9 ${i % 2 ? -8 : 8}`).join(" ")} V12Z" fill="#FBF8EF"/>` +
      `<text x="103" y="46" text-anchor="middle" font-family="PFD" font-weight="700" font-size="24" letter-spacing="3" fill="#212C5F">NOTA</text><rect x="54" y="58" width="98" height="2.5" fill="#212C5F" opacity=".5"/>` +
      [76, 98, 120].map((y) => `<rect x="54" y="${y}" width="60" height="8" rx="4" fill="#C9CFE0"/><rect x="122" y="${y}" width="30" height="8" rx="4" fill="#C9CFE0"/>`).join("") +
      `<rect x="96" y="150" width="56" height="12" rx="6" fill="#26304f"/></g>` + S1,
  };
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // the phone: tilted back and turned, origin = phone centre
  w.style.transform = "translate3d(410px, 1300px, 0px) rotateX(16deg) rotateY(20deg) rotateZ(-5deg)";
  const W = 496, H = 1004, R = 66;
  for (let k = 9; k >= 1; k--) mk("div", "pl", w, `left:${-W / 2}px; top:${-H / 2}px; width:${W}px; height:${H}px; border-radius:${R}px; transform: translateZ(${-k * 3}px); background:${k === 9 ? "#04060f" : `rgb(${30 - k * 2},${38 - k * 2},${82 - k * 5})`};`);
  mk("div", "pl", w, `left:${-W / 2}px; top:${-H / 2}px; width:${W}px; height:${H}px; border-radius:${R}px; background: linear-gradient(150deg, #4a578f 0%, #1a2248 14%, #0b1029 55%, #232c5e 100%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), inset 0 0 0 9px #05081a;`);
  const scr = mk("div", "scr", w);
  scr.innerHTML = `<div class="sbar"><span>9:41</span><span>●●●</span></div><div class="hd">Galeri<small>Terbaru</small></div><div class="gr" id="gr"></div>`;
  mk("div", "pl", w, `left:-55px; top:${-H / 2 + 28}px; width:110px; height:32px; border-radius:16px; background:#04060f; transform: translateZ(2px);`);
  const tiles = [T.sunset(), T.selfie("#FFD8C9", "#E9B48A", "#2b2118", "#26367A"), T.kopi(), T.meme("#BFD8F5", "KOK UDAH", "SENIN?"), "TR", T.mie(),
                 T.hijab("#FCE4B4", "#EDBB90", "#9C6ADE", "#26367A"), T.kucing(), "NO", T.kopi(), T.selfie("#CDE4F7", "#C98E62", "#3a2a1e", "#E07A5F"), T.sunset(),
                 T.mie(), T.hijab("#D3F0E0", "#D9A27A", "#E86A92", "#F2B63D"), T.meme("#F4C7D6", "AKU", "TIAP PAGI"), T.kucing(), T.selfie("#E6DAF5", "#F0C29A", "#4a2f1d", "#2F8F83"), T.kopi()];
  tiles.forEach((s) => { const i = mk("i", s.length < 3 ? "gone" : "", document.getElementById("gr")); if (s.length > 3) i.innerHTML = s; });
  // the two found photos lift out of the screen towards the camera (slots 5 and 9 of the grid are left empty under them)
  const pop = (svg, x, y, z, rz, sc) => { const p = mk("div", "pop pl", w, `left:-103px; top:-103px; transform: translate3d(${x}px, ${y}px, ${z}px) rotateZ(${rz}deg) scale(${sc});`); p.innerHTML = svg + "<b></b>"; return p; };
  pop(T.transfer(), 40, -150, 150, 6, 1.18);
  pop(T.nota(), 170, 40, 90, -7, 1.05);
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no line may overflow the frame width
    ["t1", "t2", "t3"].forEach((id) => { const e = document.getElementById(id), q = e.getBoundingClientRect(); if (q.left < 60 || q.right > 1020) console.log("pageerror TEXT OUTSIDE", id, q.left, q.right); });
    r.render({ x: 905, y: 1530, h: 640, yaw: -26, roll: 0, headYaw: -20, headPitch: -12, headRoll: 9, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 128, fwd: 30, bend: 16, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.5, happy: 0, smile: 1, o: 0.35 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

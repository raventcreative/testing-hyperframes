        ['  .page { <span class="s01-p">position</span>: absolute; <span class="s01-p">width</span>: <span class="s01-s">1200px</span>;'],

        ['    <span class="s01-p">box-shadow</span>: <span class="s01-s">0 30px 90px</span> rgba(26,33,51,.28); }'],
        ['  .tile { <span class="s01-p">width</span>: <span class="s01-s">64px</span>; <span class="s01-p">height</span>: <span class="s01-s">64px</span>;'],

        ['<span class="s01-k">&lt;/style&gt;</span>'],
        ['<span class="s01-k">&lt;div</span> <span class="s01-p">class</span>=<span class="s01-s">"badge"</span><span class="s01-k">&gt;</span>AIPRENEUR<span class="s01-k">&lt;/div&gt;</span>'],

        ['<span class="s01-k">&lt;div</span> <span class="s01-p">class</span>=<span class="s01-s">"t2"</span><span class="s01-k">&gt;</span>hemat ratusan juta.<span class="s01-k">&lt;/div&gt;</span>'],

        ['  <span class="s01-k">const</span> tl = gsap.timeline({ paused: <span class="s01-s">true</span> });'],
        ['  gsap.set(<span class="s01-s">".tilt"</span>, { rotationX: <span class="s01-s">56</span> });'],
        ['  tl.to(<span class="s01-s">".page"</span>, { y: <span class="s01-s">-12615</span>, ease: <span class="s01-s">"none"</span> });'],
        ['  window.__timelines[<span class="s01-s">"main"</span>] = tl;'],
        ['<span class="s01-k">&lt;/script&gt;</span>'],
      ];
      const code = q("#s01-code");
      CODE.forEach(([h], i) => { const d = document.createElement("div"); d.className = "s01-ln"; d.style.top = (40 + i * 46) + "px"; d.innerHTML = "<i>" + (i + 1) + "</i>" + h; code.appendChild(d); });

      // near-plane motes (depth)
      const near = q("#s01-near");
      for (let i = 0; i < 9; i++) { const m = document.createElement("div"); m.className = "s01-abs s01-mote"; const s = 10 + rnd() * 26;

        tl.set(m, { opacity: 0.25 + rnd() * 0.35 }, 0); ft(m, { y: 0 }, { y: -160 - rnd() * 120, duration: DUR, ease: "none" }, 0); }

      // ---- peel geometry (diagonal page curl from the bottom-right corner)

      const peel = { d: 0 };
      function drawPeel() {
        const d = peel.d, c = Wd + Ht - d;                     // fold line: x + y = c
        const corners = [[0, 0], [Wd, 0], [Wd, Ht], [0, Ht]];
        const keep = [], gone = [];
        const inside = (p) => p[0] + p[1] < c;
        for (let i = 0; i < 4; i++) {
          const A = corners[i], B = corners[(i + 1) % 4];
          if (inside(A)) keep.push(A); else gone.push(A);
          const fa = A[0] + A[1] - c, fb = B[0] + B[1] - c;
          if ((fa < 0) !== (fb < 0)) { const t = fa / (fa - fb); const X = [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]; keep.push(X); gone.push(X); }
        }
        const poly = (pts) => "polygon(" + pts.map((p) => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",") + ")";

        page.style.clipPath = keep.length >= 3 ? poly(keep) : "polygon(0px 0px, 0px 0px, 0px 0px)";   // fully peeled: hide (an empty polygon would be rejected and keep the old clip)

      ft(q("#s01-flash"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, T.aman + 0.08);

      // the page glass PEELS back from the corner to reveal the code underneath

      const P0 = T.aman + 0.02, P1 = T.belum + 0.40, PD = P1 - P0, a1 = 0.2 / PD, h1 = (T.belum - 0.02 - P0) / PD, F = 640 / 1900;

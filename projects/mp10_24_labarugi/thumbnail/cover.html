<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Laporan Laba Rugi dalam 30 Detik</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's recipe card ("Resep · Laporan Laba Rugi": bahan, langkah, hasil laba) tilted in 3D, with the mixing bowl of
     coins on the kitchen scale in front of it and the kitchen timer. No numbers are shown (the scale reads only "LABA ✓"). -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 384px; font: 800 160px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 726px; display: flex; align-items: center; gap: 18px; font: italic 400 70px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #t2 svg { width: 78px; height: 78px; }
  #glow { position: absolute; left: 0; top: 820px; width: 960px; height: 860px; background: radial-gradient(closest-side, rgba(254,209,17,.16), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 420px 1180px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  /* the recipe card (same design as in the film, numbers left out) */
  .rc { position: absolute; left: -280px; top: -350px; width: 560px; height: 700px; background: #FBF8EF; border-radius: 26px; padding: 34px 34px 0; overflow: hidden;
        box-shadow: 0 50px 90px rgba(3,6,24,.5), inset 0 0 0 2px rgba(33,44,95,.06); }
  .rc::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 12px; background: repeating-linear-gradient(90deg, #26367A 0 34px, #FED111 34px 68px); }
  .rch { display: flex; align-items: center; gap: 18px; margin-top: 6px; }
  .rch .hat { flex: none; width: 76px; height: 76px; border-radius: 22px; background: #212C5F; display: flex; align-items: center; justify-content: center; }
  .rch .hat svg { width: 44px; height: 44px; }
  .rch div { flex: 1; min-width: 0; }
  .rch span { display: block; font: 700 19px/1 PS; letter-spacing: .26em; color: #5B6478; white-space: nowrap; }
  .rch b { display: block; margin-top: 9px; font: 800 41px/1 Rubik; letter-spacing: -.5px; color: #212C5F; white-space: nowrap; }
  .rcs { margin-top: 24px; height: 30px; display: flex; align-items: center; gap: 12px; font: 700 18px/1 PS; letter-spacing: .24em; color: #5B6478; white-space: nowrap; }
  .rcs::after { content: ""; flex: 1; height: 2px; background: rgba(33,44,95,.12); }
  .rb { display: flex; align-items: center; gap: 14px; height: 58px; margin-top: 4px; white-space: nowrap; }
  .rb i { flex: none; width: 42px; height: 42px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; font: 800 22px/1 Rubik; font-style: normal; color: #212C5F; }
  .rb span { font: 700 29px/1 PS; color: #161D3A; }
  .rbs { margin: -4px 0 0 56px; font: 600 22px/1 PS; color: #5B6478; white-space: nowrap; }
  .rl { display: flex; align-items: center; gap: 12px; height: 50px; font: 600 24px/1 PS; color: #161D3A; white-space: nowrap; }
  .rl i { flex: none; width: 34px; height: 34px; border-radius: 10px; background: #EDEFF5; display: flex; align-items: center; justify-content: center; font: 800 19px/1 Rubik; font-style: normal; color: #212C5F; }
  .rl .tk { width: 32px; height: 32px; margin-left: auto; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .rl .tk svg { width: 21px; height: 21px; }
  .hs { margin-top: 18px; height: 76px; border-radius: 18px; background: #212C5F; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 24px; white-space: nowrap; }
  .hs span { font: 700 21px/1 PS; letter-spacing: .2em; color: #DDE1EE; }
  .hs b { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; background: #FED111; font: 800 32px/1 Rubik; color: #212C5F; }
  .hs b svg { width: 26px; height: 26px; }
  /* kitchen scale with the bowl of coins */
  .sco { position: absolute; left: -200px; top: -66px; width: 400px; height: 132px; border-radius: 0 0 20px 20px; background: linear-gradient(180deg, #4a60c0 0%, #34489f 55%, #26367A 100%); box-shadow: 0 30px 60px rgba(3,6,24,.5), inset 0 4px 0 rgba(255,255,255,.2); }
  .sct { position: absolute; left: -200px; top: -150px; width: 400px; height: 300px; border-radius: 22px; background: radial-gradient(ellipse 70% 70% at 45% 40%, #ffffff 0%, #E9ECF4 70%, #D9DEEA 100%); box-shadow: inset 0 0 0 5px #C9CFE0; }
  .lcd { position: absolute; left: 28px; top: 20px; width: 344px; height: 86px; border-radius: 14px; background: linear-gradient(180deg, #0c1331, #121a45); box-shadow: inset 0 0 0 3px rgba(131,150,234,.45); display: flex; align-items: center; justify-content: center; gap: 14px; font: 800 46px/1 Rubik; color: #FED111; white-space: nowrap; }
  .lcd svg { width: 40px; height: 40px; }
  .bowl { position: absolute; left: -200px; top: -200px; width: 400px; height: 200px; overflow: visible; }
  #t3 { position: absolute; left: 70px; top: 1538px; display: inline-flex; align-items: center; gap: 12px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 31px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-2deg); box-shadow: 0 16px 34px rgba(3,6,24,.35); }
  #t3 b { color: #8F6F00; font-weight: 800; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">RESEP<br /><span>LABA RUGI</span></div>
  <div id="t2">dalam 30 detik<svg viewBox="0 0 100 100"><rect x="42" y="2" width="16" height="12" rx="4" fill="#FED111"/><circle cx="50" cy="56" r="40" fill="#fff" stroke="#FED111" stroke-width="8"/><circle cx="50" cy="56" r="27" fill="none" stroke="#FED111" stroke-width="18" stroke-dasharray="120 170" transform="rotate(-90 50 56)"/><path d="M50 56V26" stroke="#212C5F" stroke-width="7" stroke-linecap="round" transform="rotate(150 50 56)"/><circle cx="50" cy="56" r="7" fill="#212C5F"/></svg></div>
  <div class="stage">
    <!-- recipe card -->
    <div class="g3" style="transform: translate3d(320px, 1172px, -230px) rotateY(16deg) rotateX(5deg) rotateZ(-3deg);"><div class="rc" id="card"></div></div>
    <!-- scale + bowl, in front of the card's lower right -->
    <div class="g3" style="transform: translate3d(800px, 1172px, -90px) rotateX(-16deg) rotateY(-20deg);">
      <div class="sct" style="transform: translate3d(0px, -66px, 0px) rotateX(90deg);"></div>
      <div class="sco" style="transform: translate3d(0px, 0px, 150px);"><div class="lcd">LABA<svg viewBox="0 0 24 24" fill="none" stroke="#FED111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div></div>
      <svg class="bowl" viewBox="0 0 480 240" style="transform: translate3d(0px, -66px, -30px);"><defs>
        <linearGradient id="bwB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a60c0"/><stop offset=".55" stop-color="#2b3d8c"/><stop offset="1" stop-color="#1a2458"/></linearGradient>
        <linearGradient id="bwI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a45"/><stop offset="1" stop-color="#26367A"/></linearGradient>
        <radialGradient id="cnG" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#FFF3A8"/><stop offset=".5" stop-color="#FED111"/><stop offset="1" stop-color="#E2AF00"/></radialGradient></defs>
        <ellipse cx="240" cy="58" rx="226" ry="46" fill="url(#bwI)"/>
        <path d="M34 74 C 70 10, 150 -26, 240 -28 C 330 -26, 410 10, 446 74 Z" fill="url(#cnG)"/>
        <g fill="#FFE98A" stroke="#D9A600" stroke-width="3"><ellipse cx="160" cy="18" rx="30" ry="10"/><ellipse cx="250" cy="-6" rx="30" ry="10"/><ellipse cx="330" cy="22" rx="30" ry="10"/><ellipse cx="205" cy="44" rx="30" ry="10"/><ellipse cx="300" cy="50" rx="30" ry="10"/></g>
        <path d="M14 58 A226 46 0 0 0 466 58 C 462 150 382 230 240 234 C 98 230 18 150 14 58 Z" fill="url(#bwB)"/>
        <path d="M14 58 A226 46 0 0 0 466 58" fill="none" stroke="#9fb0f5" stroke-width="7"/>
        <path d="M14 58 A226 46 0 0 1 466 58" fill="none" stroke="#5c70cf" stroke-width="5"/>
        <path d="M60 120 C 80 170, 120 200, 170 214" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="10" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div id="t3">penjualan − modal − biaya <b>=</b> laba</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const CHECK = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c || "#212C5F"}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>`;
  const HAT = '<svg viewBox="0 0 24 24" fill="none" stroke="#FED111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5a4 4 0 0 1-.6-7.9A5.2 5.2 0 0 1 12 3.5a5.2 5.2 0 0 1 5.6 3.1A4 4 0 0 1 17 14.5z"/><path d="M7 14.5V20h10v-5.5M7 17.5h10"/></svg>';
  document.getElementById("card").innerHTML = `<div class="rch"><i class="hat">${HAT}</i><div><span>RESEP</span><b>Laporan Laba Rugi</b></div></div>
    <div class="rcs">BAHAN</div>
    <div class="rb"><i>1</i><span>Penjualan</span></div>
    <div class="rb"><i>2</i><span>Modal barang</span></div>
    <div class="rb"><i>3</i><span>Biaya</span></div>
    <div class="rbs">ongkir · iklan · kemasan</div>
    <div class="rcs">LANGKAH</div>
    <div class="rl"><i>1</i>Penjualan − modal barang<span class="tk">${CHECK()}</span></div>
    <div class="rl"><i>2</i>Kurangi biaya satu-satu<span class="tk">${CHECK()}</span></div>
    <div class="hs"><span>HASIL</span><b>LABA${CHECK()}</b></div>`;
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: nothing on the card may be wider than its box
    document.querySelectorAll(".rc > *, #t3, #t1, #t2").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5 && e.id !== "t1" && e.id !== "t2") console.log("pageerror OVERFLOW", e.className, e.textContent); });
    const t1 = document.getElementById("t1").getBoundingClientRect(), t2 = document.getElementById("t2").getBoundingClientRect();
    if (t1.right > 1010 || t2.right > 1010) console.log("pageerror TITLE WIDE", t1.right, t2.right);
    r.render({ x: 930, y: 1610, h: 600, yaw: -24, roll: 0, headYaw: -18, headPitch: -8, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 140, fwd: 26, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.4, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

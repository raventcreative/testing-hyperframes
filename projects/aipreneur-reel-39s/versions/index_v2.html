          { s: 19.89, e: 21.3, lines: [["k", [45]], ["h xl mkr", [46]], ["h", [47, 48]]] },

        let prevExit = -9;

          prevExit = b.e < 39.3 ? wordsGone : -9;
        });

        window.__timelines["main"] = tl;
      })();

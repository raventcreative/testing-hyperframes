<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — Corporate Training Moment PT Growth Sumatra (white theme)</title>
<!-- Same system as projects/adopsi5_thumb/thumbnail/cover.html, white version: the client's screenshot (caption + watermark removed,
     4x upscaled, face restored — tools/build_testi.py) full-bleed, WHITE gradients top and bottom, thin navy grid behind the subject
     only, navy logo + eyebrow + 2-line headline + tagline. ?text=0 -> clean photo only. Headline lines via ?e= &h1= &h2= &tag= .
     Render: HTTP=<port> node thumbnail/render_cover.cjs <out.png> [query] -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050b22; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .layer { position: absolute; left: 0; width: 1080px; }
  #top { top: 0; height: 820px; background: linear-gradient(180deg, rgba(5,11,34,.97) 0%, rgba(6,14,42,.92) 36%, rgba(7,16,48,.66) 58%, rgba(7,16,48,.22) 80%, rgba(7,16,48,0) 100%); }
  #bot { bottom: 0; height: 900px; background: linear-gradient(0deg, rgba(5,11,34,.98) 0%, rgba(6,14,42,.92) 28%, rgba(7,16,48,.66) 50%, rgba(7,16,48,.24) 76%, rgba(7,16,48,0) 100%); }
  #vig { top: 0; height: 1920px; background: radial-gradient(ellipse 780px 1180px at 50% 54%, rgba(5,11,34,0) 58%, rgba(5,11,34,.55) 100%); }
  #grid { top: 0; height: 1920px; opacity: .09;
    background-image: linear-gradient(90deg, rgba(214,228,255,1) 0 1.6px, transparent 1.6px), linear-gradient(0deg, rgba(214,228,255,1) 0 1.6px, transparent 1.6px);
    background-size: 108px 108px; background-position: -0.8px 12px;
    -webkit-mask-image: url(../assets/gridmask3.png); mask-image: url(../assets/gridmask3.png); -webkit-mask-size: 1080px 1920px; mask-size: 1080px 1920px; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  .t { display: none; }
  body.text .t { display: block; }
  #logo { position: absolute; left: 460px; top: 150px; width: 160px; height: auto; }
  #eyebrow { top: 204px; font: 400 22px/1 Poppins; letter-spacing: 9px; color: #01ccf7; }
  #eyebrow b { font-weight: 700; color: #ffffff; }
  #h1 { top: 246px; font: 700 84px/1 Poppins; letter-spacing: -2px; color: #ffffff; text-shadow: 0 6px 30px rgba(2,6,24,.6); }
  #h2 { top: 340px; font: 700 112px/1 Poppins; letter-spacing: -3px;
    color: #ffffff; text-shadow: 0 8px 30px rgba(2,6,24,.6); padding-bottom: .26em; }
  #person { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; filter: drop-shadow(0 0 34px rgba(150,210,255,.30)) drop-shadow(0 0 10px rgba(190,230,255,.22)); }
  #chip { position: absolute; left: 0; width: 1080px; top: 470px; text-align: center; }
  #chip span { display: inline-block; padding: 13px 30px 14px; border-radius: 40px; background: #01ccf7;
    font: 700 30px/1 Poppins; letter-spacing: 6px; color: #0a0d2c; box-shadow: 0 10px 30px rgba(1,204,247,.28); }
</style>
</head>
<body class="text">
<div id="c">
  <img id="bg" src="../assets/room.jpg" alt="" />
  <div class="layer" id="grid"></div>
  <img id="person" src="../assets/person_c.png" alt="" />
  <div class="layer" id="vig"></div>
  <div class="layer" id="top"></div>
  <div class="layer" id="bot"></div>
  <img class="t" id="logo" src="../assets/logo_white_trim.png" alt="AI PRENEUR" />
  <div class="ctr t" id="eyebrow"><b>AI</b>&nbsp;CORPORATE TRAINING</div>
  <div class="ctr t" id="h1">Corporate Training Moment</div>
  <div class="ctr t" id="h2">PT Growth Sumatra</div>
  <div class="t" id="chip"><span>TEASER</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("text") === "0") document.body.classList.remove("text");
  for (const [k, id] of [["e", "eyebrow"], ["h1", "h1"], ["h2", "h2"]]) if (q.has(k)) document.getElementById(id).innerHTML = q.get(k);
  const fit = (id, max) => { const e = document.getElementById(id); let s = parseFloat(getComputedStyle(e).fontSize);
    const r = document.createRange(); r.selectNodeContents(e);
    while (r.getBoundingClientRect().width > max && s > 40) { s -= 2; e.style.fontSize = s + "px"; } };
  Promise.all([document.fonts.ready, new Promise((r) => { const i = document.getElementById("person"); if (i.complete && i.naturalWidth) r(); else { i.onload = r; i.onerror = r; } })]).then(() => {
    if (document.body.classList.contains("text")) { fit("h1", 940); fit("h2", 960); }
    window.COVER_READY = true;
  });
</script>
</body>
</html>

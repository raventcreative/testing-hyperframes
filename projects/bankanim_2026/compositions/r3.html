      const e3 = (u) => { u = Math.max(0, Math.min(1, u)); return 1 - Math.pow(1 - u, 3); };   // = GSAP power3.out

      I(num, { textContent: "0\u2060", scale: 1, transformOrigin: "0% 70%" });

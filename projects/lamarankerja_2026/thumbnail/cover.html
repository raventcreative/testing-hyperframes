<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — Kamu tidur, CV-mu lembur</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<!-- IG Reels cover 1080x1920 on the client's navy background (InstaJob remake, NIGHT SHIFT): the hook ("Kamu tidur, CV-mu LEMBUR"),
     a crescent moon + stars, a lit office skyline, a CV card firing paper planes to the offices, the mascot (host) asleep at
     bottom-left and the AI PRENEUR robot typing on its holo keyboard at bottom-right.
     Poppins 700/400, white + #01ccf7 (+ warm window light). Everything that matters sits inside the 4:5 profile-grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8781 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  #g1 { left: 60px; top: 330px; width: 960px; height: 700px; background: radial-gradient(ellipse, rgba(48,93,143,.42), rgba(48,93,143,0) 66%); }
  #g2 { left: 90px; top: 820px; width: 900px; height: 560px; background: radial-gradient(ellipse, rgba(1,204,247,.16), rgba(1,204,247,0) 64%); }
  .grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(../assets/brand/grain_256.png); opacity: .06; z-index: 40; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; filter: drop-shadow(0 2px 8px rgba(4,8,30,.55)); z-index: 30; }
  /* eyebrow chip */
  #eyebrow { top: 362px; display: flex; justify-content: center; }
  #eyebrow > span { height: 60px; padding: 0 26px 0 10px; border-radius: 30px; display: flex; align-items: center; gap: 12px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.5); font: 700 21px/1 Poppins; letter-spacing: 3px; color: #6adfff; }
  #eyebrow .ic { width: 42px; height: 42px; border-radius: 50%; background: #01ccf7; position: relative; box-shadow: 0 0 14px rgba(1,204,247,.55); }
  #eyebrow .ic i { position: absolute; left: 9px; top: 9px; width: 24px; height: 24px; background: #071033;
    -webkit-mask: url(../assets/icons/lucide-moon-star.svg) center / contain no-repeat; mask: url(../assets/icons/lucide-moon-star.svg) center / contain no-repeat; }
  /* the hook */
  #k1 { top: 452px; font: 400 70px/1 Poppins; letter-spacing: -1px; color: #e3edfa; }
  #h1 { top: 528px; font: 700 150px/1 Poppins; letter-spacing: -5px; color: #fff; text-shadow: 0 8px 26px rgba(4,8,30,.5); }
  #h2 { top: 660px; font: 700 230px/1 Poppins; letter-spacing: -9px; }
  #h2 span { background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 46%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(1,204,247,.45)); }
  /* night sky */
  #stars { position: absolute; inset: 0; z-index: 2; }
  .st { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #e3edfa; box-shadow: 0 0 10px rgba(227,237,250,.9); }
  .sp { position: absolute; z-index: 3; filter: drop-shadow(0 0 8px rgba(227,237,250,.8)); }
  #mglow { position: absolute; left: 790px; top: 352px; width: 270px; height: 270px; border-radius: 50%; background: radial-gradient(circle, rgba(255,231,166,.20), rgba(255,231,166,0) 65%); z-index: 3; }
  #moon { position: absolute; left: 860px; top: 420px; width: 136px; height: 136px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fff9e8, #ffe7a6 60%, #f4cf72);
    -webkit-mask: radial-gradient(circle at 92% 22%, transparent 47%, #000 48.5%); mask: radial-gradient(circle at 92% 22%, transparent 47%, #000 48.5%);
    filter: drop-shadow(0 0 26px rgba(255,231,166,.45)); transform: rotate(-8deg); z-index: 4; }
  /* office skyline at the horizon (behind the cast) */
  #city { position: absolute; left: 0; top: 900px; width: 1080px; height: 420px; z-index: 6;
    -webkit-mask: linear-gradient(180deg, #000 0, #000 62%, transparent 100%); mask: linear-gradient(180deg, #000 0, #000 62%, transparent 100%); }
  .bd { position: absolute; bottom: 0; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, #1d2e6c, #111c4a); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.07); }
  .win { position: absolute; width: 14px; height: 18px; border-radius: 3px; background: rgba(227,237,250,.09); }
  .win.on { background: #ffd66b; box-shadow: 0 0 10px rgba(255,214,107,.55); opacity: .88; }
  .win.cy { background: #6adfff; box-shadow: 0 0 12px rgba(1,204,247,.8); }
  .ant { position: absolute; width: 4px; background: #2a3d80; }
  .ant i { position: absolute; left: -4px; top: -10px; width: 12px; height: 12px; border-radius: 50%; background: #e5484d; box-shadow: 0 0 14px rgba(229,72,77,.9); }
  /* trails + planes + the CV */
  #fly { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 14; overflow: visible; }
  #cv { position: absolute; left: 432px; top: 932px; width: 216px; height: 284px; border-radius: 22px; background: linear-gradient(180deg, #ffffff, #eef3fb);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 6px rgba(1,204,247,.14), 0 0 46px rgba(1,204,247,.35); transform: rotate(-5deg); z-index: 15; }
  #cv .av { position: absolute; left: 20px; top: 20px; width: 60px; height: 60px; border-radius: 50%; background: #e3ecfb; }
  #cv .av i { position: absolute; left: 13px; top: 12px; width: 34px; height: 34px; background: #294b77; -webkit-mask: url(../assets/icons/lucide-user-round.svg) center / contain no-repeat; mask: url(../assets/icons/lucide-user-round.svg) center / contain no-repeat; }
  #cv .tg { position: absolute; right: 18px; top: 26px; height: 30px; padding: 0 12px; border-radius: 15px; background: #0b1440; color: #01ccf7; font: 700 17px/30px Poppins; letter-spacing: .1em; }
  #cv .ln { position: absolute; left: 20px; height: 11px; border-radius: 6px; background: #d4def0; }
  #cv .ln.d { background: #8fa3c7; height: 15px; }
  #cv .ok { position: absolute; left: 20px; bottom: 20px; height: 34px; padding: 0 14px 0 8px; border-radius: 17px; background: #2da44e; color: #fff; font: 700 17px/34px Poppins; display: flex; align-items: center; gap: 6px; }
  #cv .ok i { width: 20px; height: 20px; background: #fff; -webkit-mask: url(../assets/icons/lucide-check.svg) center / contain no-repeat; mask: url(../assets/icons/lucide-check.svg) center / contain no-repeat; }
  .zz { position: absolute; font: 700 64px/1 Poppins; color: #fff; text-shadow: 0 0 18px rgba(106,223,255,.9), 0 4px 14px rgba(4,8,30,.9), 0 0 4px rgba(4,8,30,.8); z-index: 24; }
  /* robot's holo keyboard */
  #kb { position: absolute; left: 0; top: 0; width: 300px; height: 100px; margin: -50px 0 0 -150px; opacity: .9; transform-origin: 50% 50%; z-index: 23; }
  #kb .pl { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(1,204,247,.30), rgba(1,204,247,.10));
    box-shadow: 0 0 0 1.5px rgba(106,223,255,.7), 0 0 26px rgba(1,204,247,.55), inset 0 0 18px rgba(1,204,247,.25); }
  #kb .ks { position: absolute; left: 16px; top: 13px; width: 268px; height: 74px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
  #kb .ks i { display: block; border-radius: 4px; background: rgba(160,235,255,.22); box-shadow: inset 0 0 0 1px rgba(160,235,255,.35); }
  #kb .ks i.on { background: rgba(220,250,255,.95); box-shadow: 0 0 10px rgba(1,204,247,.95); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #r { z-index: 21; } #m { z-index: 22; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div>
  <div id="stars"></div><div id="mglow"></div><div id="moon"></div>
  <div id="city"></div>
  <svg id="fly" viewBox="0 0 1080 1920"></svg>
  <div id="cv"><div class="av"><i></i></div><div class="tg">CV</div>
    <div class="ln d" style="top:98px;width:130px"></div><div class="ln" style="top:126px;width:176px"></div><div class="ln" style="top:148px;width:150px"></div>
    <div class="ln" style="top:178px;width:170px"></div><div class="ln" style="top:200px;width:120px"></div>
    <div class="ok"><i></i>Terkirim</div></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <div id="kb"><div class="pl"></div><div class="ks" id="keys"></div></div>
  <div id="zz"></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><span class="ic"><i></i></span>AI · LAMAR KERJA OTOMATIS</span></div>
  <div id="k1" class="ctr">Kamu tidur,</div>
  <div id="h1" class="ctr">CV-mu</div>
  <div id="h2" class="ctr"><span>LEMBUR</span></div>
  <div class="grain"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS;
  let seed = 11; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  // ---- stars (seeded) + a few 4-point sparkles
  {
    let h = "";
    for (let i = 0; i < 60; i++) {
      const x = 30 + rnd() * 1020, y = 290 + rnd() * 620, s = 0.45 + rnd() * 0.9, o = 0.3 + rnd() * 0.6;
      if ((x > 100 && x < 990 && y > 440 && y < 880) || (x > 280 && x < 800 && y > 300 && y < 440)) continue;   // never inside the hook / logo / chip
      h += `<i class="st" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;opacity:${o.toFixed(2)};transform:scale(${s.toFixed(2)})"></i>`;
    }
    const SP = [[770, 455, 30], [990, 640, 22], [120, 520, 26], [48, 700, 18], [70, 880, 16]];
    for (const [x, y, s] of SP) h += `<svg class="sp" style="left:${x - s / 2}px;top:${y - s / 2}px" width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0Z" fill="#f2f7ff"/></svg>`;
    document.getElementById("stars").innerHTML = h;
  }
  const ZS = [[372, 1150, 46, -8, 0.8], [306, 1078, 62, 6, 0.92], [218, 990, 84, -6, 1]];    // Zzz: left, top, size, rot, opacity
  const ZC = ZS.map(([x, y, s]) => [x + s * 0.3, y + s * 0.55, s * 0.95]);
  // ---- the office skyline (windows lit warm, a few cyan = "applications landing")
  {
    const B = [[-10, 112, 250], [92, 120, 330], [205, 92, 212], [290, 130, 292], [414, 104, 204], [506, 118, 262], [616, 112, 344], [722, 128, 240], [842, 104, 302], [940, 150, 224]];
    let h = "";
    B.forEach(([x, w, ht], i) => {
      h += `<div class="bd" style="left:${x}px;width:${w}px;height:${ht}px">`;
      const cols = Math.floor((w - 16) / 26), rows = Math.floor((ht - 26) / 30), ox = (w - (cols * 26 - 12)) / 2;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const v = rnd(), wx = x + ox + c * 26 + 7, wy = 900 + 420 - ht + 16 + r * 30 + 9;
        const nearZ = ZC.some(([zx, zy, zr]) => Math.hypot(wx - zx, wy - zy) < zr);                      // dark offices behind the Zzz
        const cls = nearZ || v < 0.56 ? "win" : v < 0.95 ? "win on" : "win cy";
        h += `<i class="${cls}" style="left:${(ox + c * 26).toFixed(0)}px;top:${16 + r * 30}px"></i>`;
      }
      h += `</div>`;
    });
    document.getElementById("city").innerHTML = h;
  }
  // ---- paper planes on dotted arcs from the CV to the offices
  {
    const PL = [ // start, control, end, size
      [[452, 1014], [300, 846], [128, 962], 58],
      [[470, 952], [400, 856], [300, 922], 44],
      [[628, 994], [800, 838], [968, 954], 60],
      [[612, 944], [690, 868], [790, 892], 42],
    ];
    const plane = (s) => `<g><path d="M2 30 L62 6 L22 37 Z" fill="#ffffff"/><path d="M22 37 L62 6 L38 56 Z" fill="#cfe6ff"/><path d="M22 37 L27 52 L34 45 Z" fill="#8fb6e6"/></g>`;
    let h = "";
    for (const [a, c, b, s] of PL) {
      h += `<path d="M${a[0]} ${a[1]} Q${c[0]} ${c[1]} ${b[0]} ${b[1]}" fill="none" stroke="rgba(150,232,255,.75)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 14"/>`;
      // heading at the end of the curve
      const ang = Math.atan2(b[1] - c[1], b[0] - c[0]) * 180 / Math.PI, k = s / 64;
      h += `<g transform="translate(${b[0]} ${b[1]}) rotate(${ang.toFixed(1)}) scale(${k.toFixed(3)}) translate(-34 -30)" style="filter:drop-shadow(0 0 10px rgba(1,204,247,.85))">${plane(s)}</g>`;
    }
    document.getElementById("fly").innerHTML = h;
  }
  // ---- Zzz rising from the sleeping host
  {
    document.getElementById("zz").innerHTML = ZS.map(([x, y, s, r, o]) => `<div class="zz" style="left:${x}px;top:${y}px;font-size:${s}px;opacity:${o};transform:rotate(${r}deg)">z</div>`).join("");
  }
  document.getElementById("keys").innerHTML = Array.from({ length: 30 }, (_, i) => `<i class="${[3, 7, 12, 16, 21, 25, 28].includes(i) ? "on" : ""}"></i>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    const fx = P("rx", "842"), fy = P("ry", "1560"), h = P("rh", "360");
    rb.setView({ fx, fy, h, pitch: 5 });
    // typing on the holo keyboard (robot.html "type" gesture at full weight)
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0.05, ry: P("bry", "-0.12"), rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] + P("rhx", "0.1"), HF[1] + P("rhy", "-0.16"), HF[2]], hand_L: [0.55, 0, 0], hand_R: [0.6, 0, 0] },
      offs: { hand_L: [-0.09, -0.06, 0.15], hand_R: [0.09, -0.07, 0.15], head: [0, 0, 0] },
      face: { blink: 0, gaze: [P("gx", "-0.24"), P("gy", "0.12")], happy: P("hap", "0.8"), squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.4, shadow: false });
    rb.render();
    const kb = document.getElementById("kb"), x = fx - 0.06 * h + P("kx", "0"), y = fy - 0.1 * h + P("ky", "0");
    kb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) perspective(600px) rotateX(52deg) scale(${P("ks", "1")})`;
  }
  async function buildMascot() {
    const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.037, 0.034], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.037, 0.034], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [243, 186, 141], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "lidRing": 1.5, "browNy": 0.98, "headC": [0, 0.72, 0]};
    const src = await (await fetch("../compositions/mascot.html")).text();
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.9; o.color.setRGB(0.5, 0.86, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 60, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 60.05, { smooth: 1 });
    m.setView({ fx: P("mx", "330"), fy: P("my", "1990"), h: P("mh", "800"), yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    // asleep (mascot.html's sleep pose): head drooping + tilted, eyes shut
    const hd = B.head || [0, 0, 0], nk = B.neck || [0, 0, 0];
    B.head = [hd[0] + P("hx", "0.12"), hd[1] + P("hy", "-0.1"), hd[2] + P("hz", "0.22")];
    B.neck = [nk[0] + 0.08, nk[1], nk[2]];
    m.setState({ root: { x: 0, y: 0, ry: P("mry", "0.22"), rz: P("mrz", "0"), rx: 0, s: 1 }, bones: B,
      face: { blink: [1, 1], gaze: [0, 0], mouthMix: 1, mouth: [0.02, 0.006, 0, 0.1] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, buildRobot(), buildMascot()]);
</script>
</body>
</html>

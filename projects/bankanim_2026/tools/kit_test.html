<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Poppins;src:url(../assets/fonts/poppins-latin-700-normal.woff2);font-weight:700}
body{margin:0;background:#eef3fb;width:1000px;height:780px;position:relative;font-family:Poppins}</style>
<script src="../vendor/microanim.js"></script></head><body>
<script>
const H=[]; MicroAnim.TYPES.forEach((ty,i)=>{const h=MicroAnim.mount(document.body,ty,{size:220,label:true}); h.el.style.left=(20+(i%4)*245)+'px'; h.el.style.top=(20+Math.floor(i/4)*250)+'px'; H.push(h);});
window.drawAt=(t)=>H.forEach(h=>h.draw(t));
</script></body></html>

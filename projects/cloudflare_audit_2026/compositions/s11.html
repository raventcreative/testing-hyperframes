<template>

  </style>
  <div id="root" data-composition-id="s11" data-width="1080" data-height="1920">
    <div class="s11-abs s11-far" id="s11-far">The verdicts are distinct: confirmed has a complete source trace and bounded observed result, needs_validation has an exact unresolved fact and no severity, and rejected records a disproved candidate.</div>
    <div class="s11-stage"><div class="s11-rig" id="s11-rig">

        <g id="s11-rails" filter="url(#s11-bloom)"></g>

  <script>
    (function () {
      const ID = "s11";
      const R = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => R.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const DUR = 4.6;
      const T = { hasilnya: 0.06, dipisah: 0.64, terkonfirmasi: 1.39, masih: 2.02, perlu: 2.47, diperiksa: 2.74, atau: 3.54, ditolak: 3.83 };
      const ft = (el, a, b, at) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), at);
      let seed = 1111;
      const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const STAR = '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff"/></svg>';
      const NS = "http://www.w3.org/2000/svg";

      // near-plane motes (depth)
      const near = q("#s11-near");
      for (let i = 0; i < 9; i++) { const m = document.createElement("div"); m.className = "s11-abs s11-mote"; const sz = 10 + rnd() * 24;

      // three verdict lanes — official README labels + the spoken Indonesian word (conceptual: one tile each, no counts)
      const GLYPH = {

        rejected: '<svg viewBox="0 0 150 150"><path d="M52 52 L98 98 M98 52 L52 98" fill="none" stroke="#aeb8c8" stroke-width="12" stroke-linecap="round"/></svg>'
      };
      const LANES = [
        { key: "confirmed", word: "terkonfirmasi", label: "confirmed", rgb: "159,216,196", col: "#9fd8c4", top: 646, a: 480, b: 813 },

          <div class="s11-abs s11-label" style="color:${L.col};text-shadow:0 0 18px rgba(${L.rgb},.35)">${L.label}</div>`;
        lanesEl.appendChild(d); L.el = d;
        L.belt = d.querySelector(".s11-belt"); L.tint = d.querySelector(".s11-tint"); L.edge = d.querySelector(".s11-edge"); L.sock = d.querySelector(".s11-sock");
        L.wordEl = d.querySelector(".s11-word"); L.labelEl = d.querySelector(".s11-label");

        t.style.boxShadow = `0 0 0 3px rgba(${L.rgb},.95) inset, 0 0 30px rgba(${L.rgb},.45), 0 30px 50px -14px rgba(0,0,0,.8)`;

        const r = document.createElement("div"); r.className = "s11-abs s11-ring"; r.style.top = (L.top + 2) + "px"; r.style.borderColor = L.col; r.style.boxShadow = `0 0 26px rgba(${L.rgb},.9)`;

        L.sparks = [];
        for (let i = 0; i < 5; i++) { const s = document.createElement("div"); s.className = "s11-abs s11-spark"; s.innerHTML = STAR; s.style.left = (182 - 15) + "px"; s.style.top = (L.top + 112 - 15) + "px"; sparksEl.appendChild(s);
          const ang = (i / 5) * Math.PI * 2 + rnd(); L.sparks.push({ el: s, x: Math.cos(ang) * (110 + rnd() * 60), y: Math.sin(ang) * (80 + rnd() * 40), sc: 0.45 + rnd() * 0.5 }); }
        // rail (the cyan thread) + a travelling light pulse on it
        const p = document.createElementNS(NS, "path"); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#01ccf7"); p.setAttribute("stroke-width", "4"); p.setAttribute("stroke-linecap", "round"); railsEl.appendChild(p); L.rail = p;
        const pu = document.createElementNS(NS, "path"); pu.setAttribute("fill", "none"); pu.setAttribute("stroke", "#c8f6ff"); pu.setAttribute("stroke-width", "6"); pu.setAttribute("stroke-linecap", "round");
        pu.setAttribute("pathLength", "1000"); pu.setAttribute("stroke-dasharray", "60 440"); railsEl.appendChild(pu); L.pulse = pu;
      });

      // rail geometry: one intake line (from s10's slit) → splits into three lane rails → folds into a vertical report spine (s12)
      const lerp = (a, b, t) => a + (b - a) * t;
      const G = { split: 0, fold: 0 };
      function drawRails() {
        const s = G.split, f = G.fold;
        LANES.forEach((L, i) => {
          const Y = L.top;
          // split: endpoints glide down, control points lag to bow the branch
          const sy0 = lerp(560, Y, s), sy1 = lerp(560, Y, Math.pow(s, 0.6)), sy2 = lerp(560, Y, Math.pow(s, 1.8));
          let P = [[lerp(0, 70, s), sy0], [lerp(360, 383, s), sy1], [lerp(720, 697, s), sy2], [lerp(1080, 1010, s), sy0]];
          if (f > 0) { const V = [[180, L.a], [180, lerp(L.a, L.b, 1 / 3)], [180, lerp(L.a, L.b, 2 / 3)], [180, L.b]];
            const fc = Math.min(1, f * 1.25);
            P = P.map((pt, k) => { const tk = k === 0 ? f : Math.max(0, Math.min(1, (f - 0.12 * (3 - k)) / (1 - 0.12 * (3 - k)))); const tt = k === 0 ? fc : tk; return [lerp(pt[0], V[k][0], tt), lerp(pt[1], V[k][1], tt)]; }); }
          const d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)} C${P[1][0].toFixed(1)} ${P[1][1].toFixed(1)} ${P[2][0].toFixed(1)} ${P[2][1].toFixed(1)} ${P[3][0].toFixed(1)} ${P[3][1].toFixed(1)}`;
          L.rail.setAttribute("d", d); L.pulse.setAttribute("d", d);
        });
      }
      tl.set(G, { split: 0, fold: 0, onUpdate: drawRails }, 0); drawRails();

      // ---- initial states
      LANES.forEach((L, i) => {
        tl.set(L.el, { opacity: 0.42, scaleX: 1, scaleY: 1 }, 0);
        tl.set([L.tint, L.edge, L.ring], { opacity: 0 }, 0);
        tl.set(L.wordEl, { clipPath: "inset(0% 100% 0% 0%)" }, 0);
        tl.set(L.labelEl, { clipPath: "inset(0% 100% 0% 0%)" }, 0);
        tl.set(L.tile, { opacity: 0 }, 0);
        tl.set(L.sparks.map((s) => s.el), { opacity: 0, scale: 0 }, 0);
        tl.set(L.pulse, { opacity: 0 }, 0);
        // kinetic belts + pulses run toward the socket for the whole scene
        ft(L.belt, { x: 0 }, { x: -46 * 6, duration: DUR, ease: "none" }, 0);
        ft(L.pulse, { attr: { "stroke-dashoffset": -i * 160 } }, { attr: { "stroke-dashoffset": 1500 - i * 160 }, duration: DUR, ease: "none" }, 0);
      });

      // camera: from frontal (matching s10's rail) into an angled 3D truck across the lanes, back to frontal for the fold
      const rig = q("#s11-rig");
      ft(rig, { rotationY: 0, rotationX: 0 }, { rotationY: -13, rotationX: 9, duration: 0.75, ease: "power2.out" }, 0);
      ft(rig, { rotationY: -13, rotationX: 9 }, { rotationY: 8, rotationX: 4, duration: 3.45 - 0.75 + 0.5, ease: "sine.inOut" }, 0.75);
      ft(rig, { rotationY: 8, rotationX: 4 }, { rotationY: 0, rotationX: 0, duration: 0.3, ease: "power3.inOut" }, 3.95);
      ft(rig, { y: 90 }, { y: 0, duration: 0.34, ease: "power3.out" }, 0);   // lands s10's vertical whip (rail 650 → 560)
      ft(q("#s11-far"), { x: 0 }, { x: -220, duration: DUR, ease: "none" }, 0);

      // "Hasilnya": the intake rail brightens; "dipisah:" it splits into three lanes

      ft(G, { split: 0 }, { split: 1, duration: 0.5, ease: "power3.inOut", onUpdate: drawRails }, T.dipisah - 0.12);
      LANES.forEach((L, i) => {
        ft(L.el, { opacity: 0.42 }, { opacity: 0.78, duration: 0.3, ease: "power2.out" }, T.dipisah + 0.2 + i * 0.05);
        ft(L.pulse, { opacity: 0 }, { opacity: 1, duration: 0.2 }, T.dipisah + 0.3);
      });

      // snap helper: tile flies in from the camera side and locks into its socket on the spoken word
      function snap(L, at, fromX) {
        ft(L.ring, { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.6, duration: 0.4, ease: "power2.out" }, at);
        ft(L.el, { opacity: 0.78 }, { opacity: 1, duration: 0.12 }, at);
        ft(L.edge, { opacity: 0 }, { opacity: 1, duration: 0.1 }, at);
        ft(L.tint, { opacity: 0 }, { opacity: 1, duration: 0.25 }, at);
        ft(L.tile, { scale: 1.14 }, { scale: 1, duration: 0.22, ease: "back.out(3)" }, at);

          ft(s.el, { opacity: 1 }, { opacity: 0, duration: 0.2 }, at + 0.24 + k * 0.012);
        });
      }
      // terkonfirmasi → mint `confirmed`

      snap(L0, T.terkonfirmasi);
      ft(L0.wordEl, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.26, ease: "power3.out" }, T.terkonfirmasi - 0.02);
      ft(L0.labelEl, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.26, ease: "power3.out" }, T.terkonfirmasi + 0.08);

      // masih perlu diperiksa → amber `needs_validation`: arrives, hovers undecided, locks only on "diperiksa"
      ft(L1.tile, { opacity: 0, x: 420, y: 60, z: 720, rotation: 22, filter: "blur(10px)" }, { opacity: 1, x: 26, y: -10, z: 150, rotation: 7, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, T.masih - 0.06);
      ft(L1.tile, { rotation: 7 }, { rotation: -7, duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.masih + 0.18);
      ft(L1.tile, { x: 26, y: -10, z: 150, rotation: 7 }, { x: 0, y: 0, z: 0, rotation: 0, duration: 0.13, ease: "power4.in" }, T.diperiksa - 0.13);
      snap(L1, T.diperiksa);

      ft(L1.labelEl, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.28, ease: "power3.out" }, T.diperiksa + 0.06);
      ft(L1.sock, { scale: 1 }, { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.perlu - 0.1);

      // ditolak → neutral grey `rejected`
      ft(L2.tile, { opacity: 0, x: 360, y: -140, z: 740, rotation: 26, filter: "blur(10px)" }, { opacity: 1, x: 0, y: 0, z: 0, rotation: 0, filter: "blur(0px)", duration: 0.24, ease: "power4.in" }, T.ditolak - 0.24);

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Musim Ramai, Catatan Jangan Ikut Kacau</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's storm cloud raining order cards onto a pile of parcels, while the open notebook (one row per day, Sen..Min ticked)
     and the 5-minute clock stay calm in front. No numbers are shown. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 384px; font: 800 160px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 726px; font: italic 400 68px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: 0; top: 860px; width: 980px; height: 800px; background: radial-gradient(closest-side, rgba(254,209,17,.15), rgba(254,209,17,0)); }
  #cloud { position: absolute; left: 470px; top: 808px; width: 600px; height: 250px; }
  #rain { position: absolute; left: 380px; top: 960px; width: 680px; height: 520px; opacity: .55;
          background-image: repeating-linear-gradient(104deg, rgba(221,225,238,0) 0 30px, rgba(221,225,238,.5) 30px 32.5px, rgba(221,225,238,0) 32.5px 80px);
          -webkit-mask-image: linear-gradient(180deg, #000 0, #000 55%, transparent 100%); mask-image: linear-gradient(180deg, #000 0, #000 55%, transparent 100%); }
  #bolt { position: absolute; left: 812px; top: 960px; width: 80px; height: 160px; }
  .oc { position: absolute; width: 230px; height: 128px; border-radius: 18px; background: #fff; padding: 16px 16px 0; box-shadow: 0 22px 40px rgba(3,6,24,.45); }
  .oc .ot { display: flex; align-items: center; gap: 10px; }
  .oc .ot i { flex: none; width: 38px; height: 38px; border-radius: 11px; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .oc .ot i svg { width: 23px; height: 23px; }
  .oc .ot b { font: 700 15px/1 PS; letter-spacing: .14em; color: #212C5F; white-space: nowrap; }
  .oc .ln { margin-top: 16px; height: 11px; width: 160px; border-radius: 6px; background: #C9CFE0; }
  .oc .ln2 { margin-top: 12px; height: 15px; width: 104px; border-radius: 6px; background: #26367A; }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 420px 1220px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .pg { position: absolute; top: -170px; width: 270px; height: 340px; background-color: #FBF8EF; background-image: repeating-linear-gradient(180deg, transparent 0 39px, rgba(33,44,95,.11) 39px 41px); background-position: 0 60px; box-shadow: 0 40px 70px rgba(3,6,24,.45); }
  .pgL { left: -270px; border-radius: 12px 0 0 12px; box-shadow: inset -14px 0 18px -10px rgba(19,27,64,.22), 0 40px 70px rgba(3,6,24,.45); padding: 22px 24px; }
  .pgR { left: 0; border-radius: 0 12px 12px 0; box-shadow: inset 14px 0 18px -10px rgba(19,27,64,.22), 0 40px 70px rgba(3,6,24,.45); padding: 18px 22px; }
  .pgL b { display: block; font: italic 400 32px/1.1 PF; color: #212C5F; white-space: nowrap; }
  .pgL span { display: block; margin-top: 12px; font: 700 15px/1 PS; letter-spacing: .16em; color: #6b7590; white-space: nowrap; }
  .pgL i { display: block; margin: 26px 0 0 26px; width: 150px; height: 150px; }
  .pgL i svg { width: 150px; height: 150px; }
  .pgL .mn { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0 0 18px; padding: 10px 16px; border-radius: 999px; background: #FED111; font: 800 26px/1 Rubik; font-style: normal; color: #212C5F; white-space: nowrap; }
  .pgL .mn svg { width: 26px; height: 26px; }
  .nr { display: flex; align-items: center; justify-content: space-between; height: 41px; white-space: nowrap; }
  .nr span { font: 700 22px/1 PS; color: #212C5F; }
  .nr em { flex: 1; height: 3px; margin: 8px 14px 0; border-radius: 2px; background: repeating-linear-gradient(90deg, rgba(38,48,79,.55) 0 14px, transparent 14px 20px); }
  .nr i { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .nr i svg { width: 19px; height: 19px; }
  .nh { font: 700 15px/1 PS; letter-spacing: .16em; color: #6b7590; height: 28px; white-space: nowrap; }
  #pile { position: absolute; left: 46px; top: 1360px; width: 330px; height: 250px; }
  #t3 { position: absolute; left: 70px; top: 1548px; display: inline-block; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 31px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-2deg); box-shadow: 0 16px 34px rgba(3,6,24,.35); }
  #t3 b { color: #8F6F00; font-weight: 800; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">MUSIM<br /><span>RAMAI</span></div>
  <div id="t2">catatan jangan ikut kacau</div>
  <div id="rain"></div>
  <div id="cards"></div>
  <svg id="cloud" viewBox="0 0 600 250" aria-hidden="true"><defs>
    <radialGradient id="cA" cx=".36" cy=".28" r=".8"><stop offset="0" stop-color="#6074cc"/><stop offset=".45" stop-color="#34489f"/><stop offset="1" stop-color="#1d2a62"/></radialGradient>
    <radialGradient id="cB" cx=".38" cy=".3" r=".78"><stop offset="0" stop-color="#4a5fbf"/><stop offset=".6" stop-color="#2b3d8c"/><stop offset="1" stop-color="#1a2458"/></radialGradient></defs>
    <g fill="url(#cB)"><circle cx="120" cy="140" r="90"/><circle cx="250" cy="110" r="105"/><circle cx="390" cy="120" r="100"/><circle cx="510" cy="150" r="80"/></g>
    <g fill="url(#cA)"><circle cx="170" cy="180" r="66"/><circle cx="300" cy="186" r="62"/><circle cx="430" cy="182" r="64"/><circle cx="70" cy="190" r="50"/><circle cx="540" cy="196" r="46"/></g></svg>
  <svg id="bolt" viewBox="0 0 180 360" aria-hidden="true"><path d="M102 0 L28 196 L86 196 L52 360 L156 132 L96 132 L136 0 Z" fill="#FED111"/><path d="M106 18 L50 182 L100 182 L76 306 L138 146 L84 146 L118 18 Z" fill="#FFF6C2"/></svg>
  <svg id="pile" viewBox="0 0 330 250" aria-hidden="true">
    <g id="bxs"></g>
  </svg>
  <div class="stage">
    <div class="g3" style="transform: translate3d(410px, 1212px, -60px) rotateY(14deg) rotateX(9deg) rotateZ(-2deg);">
      <div class="pg pgL"><b>Catatan harian</b><span>MUSIM RAMAI</span><i><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#fff" stroke="#26367A" stroke-width="7"/><circle cx="60" cy="60" r="24" fill="none" stroke="#FED111" stroke-width="48" stroke-dasharray="12.6 151" transform="rotate(-120 60 60)"/><path d="M60 60V18M60 60L36 46" stroke="#212C5F" stroke-width="7" stroke-linecap="round"/><circle cx="60" cy="60" r="6" fill="#FED111" stroke="#212C5F" stroke-width="3"/></svg></i><em class="mn"><svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>5 menit</em></div>
      <div class="pg pgR" id="pgR"></div>
    </div>
  </div>
  <div id="t3">catat <b>tiap hari</b>, sebentar aja</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const CHECK = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c || "#212C5F"}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>`;
  const BAG = '<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>';
  document.getElementById("pgR").innerHTML = `<div class="nh">PENJUALAN / HARI</div>` + ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"].map((d) => `<div class="nr"><span>${d}</span><em></em><i>${CHECK()}</i></div>`).join("");
  // order cards raining out of the cloud (tilted, two of them in front of the notebook's upper edge)
  [[560, 1010, -18, 0.9], [790, 1090, 24, 0.8], [440, 948, 14, 0.7], [880, 1240, -30, 0.75], [690, 1000, 8, 0.62]].forEach(([x, y, r, s]) => {
    const e = document.createElement("div"); e.className = "oc"; e.style.cssText = `left:${x - 115}px; top:${y - 64}px; transform: rotate(${r}deg) scale(${s});`;
    e.innerHTML = `<div class="ot"><i>${BAG}</i><b>PESANAN BARU</b></div><div class="ln"></div><div class="ln2"></div>`; document.getElementById("cards").appendChild(e); });
  // parcel pile (flat isometric boxes: yellow kraft, navy tape)
  const box = (x, y) => `<g transform="translate(${x} ${y})"><path d="M0 22 L50 0 L100 22 L50 44 Z" fill="#F1CF72"/><path d="M0 22 L50 44 L50 104 L0 82 Z" fill="#E9BE55"/><path d="M50 44 L100 22 L100 82 L50 104 Z" fill="#CF9F3A"/>
    <path d="M22 12.5 L72 34.5 L78 32 L28 10 Z" fill="#2f4296"/><path d="M22 32 L28 34.6 L28 50 L22 47.4 Z" fill="#2f4296"/></g>`;
  document.getElementById("bxs").innerHTML = [[20, 140], [120, 140], [220, 140], [70, 80], [170, 80], [120, 20]].map(([x, y]) => box(x, y)).join("");
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no title past the safe line, the pill inside the 4:5 crop
    const t1 = document.getElementById("t1").getBoundingClientRect(), t2 = document.getElementById("t2").getBoundingClientRect(), t3 = document.getElementById("t3").getBoundingClientRect();
    if (t1.right > 1010 || t2.right > 1010) console.log("pageerror TITLE WIDE", t1.right, t2.right);
    if (t3.bottom > 1635) console.log("pageerror PILL LOW", t3.bottom);
    r.render({ x: 930, y: 1610, h: 600, yaw: -24, roll: 0, headYaw: -18, headPitch: -10, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 140, fwd: 26, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.5, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

<template>
  <script src="assets/brand_icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/kit.js"></script>
  <div id="s1-root" data-composition-id="s1" data-width="1080" data-height="1350" style="position:absolute;inset:0;overflow:hidden">
    <div id="s1-host" class="k-full" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      // COVER — headline left with a 3D Claude spark, the org chart below as a fan: Claude Code (CEO) wires out to
      // five department cards, data pulses run along the wires, then a highlight walks the departments.
      window.__timelines = window.__timelines || {};
      const K = window.K, S = window.STACK, P = "s1";
      const host = document.getElementById("s1-host");
      const CEO = { x: 540, y: 735 };
      const DX = [138, 339, 540, 741, 942], DY = [1020, 1060, 1078, 1060, 1020], ROT = [-7, -3.5, 0, 3.5, 7];
      const CWD = 186, CHT = 250;
      let wires = "", cards = "";
      S.order.forEach((k, i) => {
        const d = S.depts[k];
        const x0 = CEO.x, y0 = CEO.y + 92, x1 = DX[i], y1 = DY[i] - CHT / 2;
        wires += `<path id="s1-w${i}" d="M${x0} ${y0} C ${x0} ${y0 + 90}, ${x1} ${y1 - 120}, ${x1} ${y1}" fill="none" stroke="${d.accent}" stroke-width="3" stroke-dasharray="10 9" opacity="0.85"/>
                  <circle id="s1-dot${i}" r="7" fill="${d.accent}" opacity="0"/>`;
        cards += `<div id="s1-cw${i}" style="position:absolute;left:${DX[i] - CWD / 2}px;top:${DY[i] - CHT / 2}px;width:${CWD}px;height:${CHT}px;perspective:900px">
          <div id="s1-c${i}" style="position:absolute;inset:0;border-radius:24px;background:linear-gradient(170deg,${d.accent}2e,rgba(255,255,255,0.04));box-shadow:inset 0 0 0 1.5px ${d.accent}88,0 22px 44px rgba(2,6,24,0.45)">
            <div id="s1-cg${i}" style="position:absolute;inset:-2px;border-radius:26px;box-shadow:0 0 0 3px ${d.accent},0 0 36px ${d.accent}aa;opacity:0"></div>
            <img id="s1-ma${i}" class="k-pix" src="assets/mascots/${d.mascots[0]}" style="position:absolute;left:${CWD / 2 - 50}px;top:${parseInt(d.mascots[0]) >= 7 ? 22 : 8}px;width:100px"/>
            <img id="s1-mb${i}" class="k-pix" src="assets/mascots/${d.mascots[1]}" style="position:absolute;left:${CWD / 2 - 52}px;top:${parseInt(d.mascots[1]) >= 7 ? 112 : 90}px;width:104px"/>
            <div class="k-txt" style="position:absolute;left:0;right:0;top:196px;text-align:center;font-weight:700;font-size:20px;letter-spacing:0.2em;color:${d.accent}">${d.key}</div>
            <div class="k-txt" id="s1-n${i}" style="position:absolute;left:0;right:0;top:222px;text-align:center;font-weight:400;font-size:16px;color:rgba(222,232,255,0.75)">${d.count} add-ons</div>
          </div></div>`;
      });
      host.innerHTML = `
        ${K.bgHTML("s1b", "#d97757")}
        <div id="s1-tag" class="k-txt" style="position:absolute;left:64px;top:136px;height:46px;padding:0 20px 0 14px;border-radius:23px;display:flex;align-items:center;gap:10px;
          background:rgba(217,119,87,0.14);box-shadow:inset 0 0 0 1px rgba(217,119,87,0.55);font-weight:700;font-size:16px;letter-spacing:0.2em;color:#ffc2ab">
          <span style="width:22px;height:22px;display:block">${K.sparkSVG("#d97757")}</span>MY CLAUDE SETUP · 60 DAYS OF LOGS</div>
        <div id="s1-h1" class="k-txt" style="position:absolute;left:58px;top:200px;font-weight:700;font-size:128px;line-height:1;letter-spacing:-0.045em;padding-bottom:10px;
          background:linear-gradient(100deg,#4da3ff 0%,#bfe1ff 45%,#4da3ff 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent">42 Things</div>
        <div id="s1-h2" class="k-txt" style="position:absolute;left:58px;top:330px;font-weight:700;font-size:96px;line-height:1;letter-spacing:-0.04em;color:#fff">to Install</div>
        <div id="s1-h3" class="k-txt" style="position:absolute;left:58px;top:428px;font-weight:700;font-size:96px;line-height:1;letter-spacing:-0.04em;color:#fff">in Claude</div>
        <div id="s1-sub" class="k-txt" style="position:absolute;left:64px;top:548px;width:620px;font-size:25px;line-height:1.4;color:rgba(222,232,255,0.7)">
          <b style="font-weight:700;color:#fff">42 add-ons, organised like a real team.</b> One CEO, five departments.</div>
        <div style="position:absolute;left:690px;top:170px">${K.spark3dHTML("s1-sp", 300)}</div>
        <svg class="k-full" viewBox="0 0 1080 1350" style="position:absolute;left:0;top:0">${wires}</svg>
        <div id="s1-ceo" style="position:absolute;left:${CEO.x - 130}px;top:${CEO.y - 92}px;width:260px;height:184px;border-radius:26px;
          background:linear-gradient(170deg,rgba(217,119,87,0.25),rgba(255,255,255,0.05));box-shadow:inset 0 0 0 2px #d97757,0 0 50px rgba(217,119,87,0.35),0 24px 50px rgba(2,6,24,0.5)">
          <div class="k-txt" style="position:absolute;left:50%;top:-16px;transform:translateX(-50%);padding:4px 14px;border-radius:10px;background:#d97757;font-weight:700;font-size:15px;letter-spacing:0.2em;color:#fff">CEO</div>
          <img id="s1-ceom" class="k-pix" src="assets/mascots/10_default_mascot.png" style="position:absolute;left:55px;top:14px;width:150px"/>
          <div class="k-txt" style="position:absolute;left:0;right:0;top:128px;text-align:center;font-weight:700;font-size:25px;color:#fff;letter-spacing:0.01em">Claude Code</div>
        </div>
        ${cards}
        ${K.chromeHTML("s1c", 0, 6)}`;
      const $ = (s) => document.getElementById("s1-" + s);
      // wire geometry (cubic bezier) for the pulses
      const bez = (i, u) => {
        const x0 = CEO.x, y0 = CEO.y + 92, x1 = DX[i], y1 = DY[i] - CHT / 2;
        const p = [[x0, y0], [x0, y0 + 90], [x1, y1 - 120], [x1, y1]], v = 1 - u;
        return [v * v * v * p[0][0] + 3 * v * v * u * p[1][0] + 3 * v * u * u * p[2][0] + u * u * u * p[3][0], v * v * v * p[0][1] + 3 * v * v * u * p[1][1] + 3 * v * u * u * p[2][1] + u * u * u * p[3][1]];
      };
      function render(t) {
        const { seg, eo, eo4, back } = K;
        K.bg("s1b", t); K.chrome("s1c", t);
        const tg = eo(seg(t, 0.05, 0.5)); $("tag").style.opacity = tg.toFixed(3); $("tag").style.transform = `translateX(${((1 - tg) * -30).toFixed(1)}px)`;
        [["h1", 0.12], ["h2", 0.26], ["h3", 0.38]].forEach(([id, t0]) => {
          const a = eo4(seg(t, t0, t0 + 0.55)); $(id).style.opacity = a.toFixed(3);
          $(id).style.transform = `translateY(${((1 - a) * 80).toFixed(1)}px) skewY(${((1 - a) * 4).toFixed(2)}deg)`;
        });
        $("h1").style.backgroundPosition = `${(100 - ((t * 24) % 200)).toFixed(1)}% 0`;
        const sb = eo(seg(t, 0.55, 1.0)); $("sub").style.opacity = sb.toFixed(3); $("sub").style.transform = `translateY(${((1 - sb) * 20).toFixed(1)}px)`;
        // 3D Claude spark: pops in, keeps spinning
        const sp = back(seg(t, 0.2, 0.8), 1.8);
        $("sp").style.transform = `scale(${sp.toFixed(3)})`; $("sp").style.opacity = seg(t, 0.2, 0.35).toFixed(3);
        K.spark3d("s1-sp", t, { spin: 62, ry0: -40 });
        // CEO card
        const ce = back(seg(t, 0.9, 1.35), 1.7);
        $("ceo").style.transform = `scale(${ce.toFixed(3)})`; $("ceo").style.opacity = seg(t, 0.9, 1.0).toFixed(3);
        const ch = t > 1.4 ? K.hop(t, 1.6, 0.3, 10) : { y: 0, sx: 1, sy: 1 };
        $("ceom").style.transform = `translateY(${ch.y.toFixed(1)}px) scale(${ch.sx.toFixed(3)},${ch.sy.toFixed(3)})`;
        // wires draw, cards flip in, mascots hop, pulses travel, highlight walks
        S.order.forEach((k, i) => {
          const w0 = 1.3 + i * 0.12, dw = eo(seg(t, w0, w0 + 0.55));
          const w = $("w" + i); w.style.strokeDashoffset = "0"; w.style.clipPath = `inset(0 0 ${((1 - dw) * 100).toFixed(1)}% 0)`;
          const c0 = w0 + 0.35, f = eo4(seg(t, c0, c0 + 0.6));
          $("c" + i).style.transform = `rotateX(${((1 - f) * 80).toFixed(2)}deg) translateY(${((1 - f) * 60).toFixed(1)}px)`;
          $("cw" + i).style.opacity = seg(t, c0, c0 + 0.18).toFixed(3);
          const fl = Math.sin(t * 1.6 + i * 1.1) * 6;
          $("cw" + i).style.transform = `translateY(${(f > 0.99 ? fl : 0).toFixed(2)}px) rotate(${ROT[i]}deg)`;
          ["ma", "mb"].forEach((m, j) => {
            const h = t > c0 + 0.6 ? K.hop(t, 1.8, i * 0.33 + j * 0.9, 12) : { y: 0, sx: 1, sy: 1 };
            $(m + i).style.transform = `translateY(${h.y.toFixed(1)}px) scale(${h.sx.toFixed(3)},${h.sy.toFixed(3)})`;
          });
          const cn = Math.round(S.depts[k].count * eo(seg(t, c0 + 0.3, c0 + 0.9)));
          $("n" + i).textContent = cn + " add-ons";
          // pulse dot along the wire, every 1.4 s after the wire is drawn
          const dot = $("dot" + i);
          if (t > w0 + 0.55) { const u = ((t - w0 - 0.55 + i * 0.27) % 1.4) / 1.4, [x, y] = bez(i, u); dot.setAttribute("cx", x.toFixed(1)); dot.setAttribute("cy", y.toFixed(1)); dot.setAttribute("opacity", (Math.sin(Math.PI * u)).toFixed(3)); }
          else dot.setAttribute("opacity", "0");
          const h0 = 3.3 + i * 0.55, hl = Math.max(0, Math.sin(Math.PI * seg(t, h0, h0 + 0.7)));
          $("cg" + i).style.opacity = hl.toFixed(3);
        });
      }
      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { t: 0 }, { t: 7, duration: 7, ease: "none", onUpdate: () => render(st.t) }, 0);
      render(0);
      window.__timelines["s1"] = tl;
    })();
  </script>
</template>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Stok Itu Uang yang Lagi Diam</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero object = the film's kardus: one box turned round to show the money it cost (Rp400.000, labelled "Ilustrasi data"), two plain
     boxes behind it on a navy shelf board, and a yellow MODAL tag hanging off the board ("nyangkut"). -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 380px; font: 800 150px/0.98 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 702px; font: italic 400 60px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: -40px; top: 820px; width: 960px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.18), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 420px 1150px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .bdt { background: linear-gradient(180deg, #4a5fc0 0%, #3a4fab 100%); }
  .bdl { background: linear-gradient(180deg, #4357b4 0%, #2b3c88 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.2); }
  .kf { background: linear-gradient(180deg, #E0C293 0%, #CFA772 100%); box-shadow: inset 0 0 0 3px rgba(122,84,34,.14); overflow: hidden; }
  .kf .tp { position: absolute; left: 50%; top: 0; width: 60px; height: 76px; margin-left: -30px; background: linear-gradient(180deg, rgba(255,244,220,.55), rgba(255,244,220,.25)); }
  .kf .lb { position: absolute; left: 50%; bottom: 34px; width: 160px; height: 72px; margin-left: -80px; border-radius: 14px; background: #26367A; color: #fff; font: 800 34px/72px Rubik; letter-spacing: 3px; text-align: center; }
  .ks { background: linear-gradient(180deg, #CCA36B 0%, #B88E57 100%); box-shadow: inset 0 0 0 3px rgba(122,84,34,.12); }
  .kt { background-color: #E4C899; background-image: linear-gradient(90deg, transparent 0 41%, rgba(255,246,226,.62) 41% 59%, transparent 59%); box-shadow: inset 0 0 0 3px rgba(122,84,34,.12); }
  .km { background: radial-gradient(ellipse 120% 90% at 50% 20%, #3a4fab 0%, #26367A 55%, #1d2a63 100%); box-shadow: inset 0 0 0 9px #FED111; overflow: hidden; }
  .km .bn { position: absolute; left: 36px; top: 34px; width: 196px; height: 98px; border-radius: 12px; background: #F5F0DD; box-shadow: 0 10px 0 -2px #E5DDC2, 0 20px 0 -4px #D7CEB0, 0 26px 18px rgba(0,0,0,.3); }
  .km .bn i { position: absolute; left: 16px; top: 15px; width: 50px; height: 68px; border-radius: 50%; border: 5px solid rgba(38,54,122,.35); }
  .km .bn em { position: absolute; left: 78px; top: 0; width: 58px; height: 98px; background: #FED111; }
  .km .bn b { position: absolute; left: 74px; top: 32px; width: 66px; text-align: center; font: 800 30px/34px Rubik; color: #212C5F; }
  .km .bn s { position: absolute; right: 16px; top: 22px; width: 36px; height: 10px; border-radius: 5px; background: rgba(38,54,122,.3); box-shadow: 0 20px 0 rgba(38,54,122,.22), 0 40px 0 rgba(38,54,122,.22); }
  .km .pc { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 0 20px; height: 58px; border-radius: 999px; background: #FED111; font: 800 36px/58px Rubik; color: #212C5F; white-space: nowrap; }
  .tagw { position: absolute; left: -110px; top: 0; width: 220px; height: 220px; }
  .tagw svg { position: absolute; left: 0; top: 0; width: 220px; height: 70px; overflow: visible; }
  .tag { position: absolute; left: 10px; top: 54px; width: 200px; height: 126px; border-radius: 20px; background: #FED111; box-shadow: 0 20px 36px rgba(3,6,24,.4), inset 0 0 0 5px rgba(255,255,255,.35); text-align: center; }
  .tag .hole { position: absolute; left: 50%; top: 12px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #2a3a84; box-shadow: inset 0 3px 4px rgba(0,0,0,.35); }
  .tag b { position: absolute; left: 0; width: 200px; top: 40px; font: 800 44px/1 Rubik; letter-spacing: 1px; color: #212C5F; }
  .tag span { position: absolute; left: 0; width: 200px; top: 90px; font: 700 22px/1 PS; letter-spacing: .06em; color: #26367A; }
  #ilus { position: absolute; left: 78px; top: 800px; padding: 8px 18px 9px; border-radius: 999px; border: 2px solid rgba(221,225,238,.4); font: 600 22px/1 PS; letter-spacing: .04em; color: #DDE1EE; white-space: nowrap; }
  #t3 { position: absolute; left: 590px; top: 930px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 32px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(3deg); }
  #t3 i { width: 30px; height: 30px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  #t3 svg { width: 20px; height: 20px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">STOK ITU<br /><span>UANG DIAM</span></div>
  <div id="t2">modal yang nyangkut di rak</div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <div id="t3"><i><svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></i>Modal, bukan untung</div>
  <span id="ilus">Ilustrasi data</span>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // world origin = front edge of the shelf board, centre; camera above and to the left
  w.style.transform = "translate3d(500px, 1330px, 0px) rotateX(-16deg) rotateY(22deg)";
  const KW = 270, KH = 256, KD = 232;
  function kardus(x, z, ry, money) {
    const g = mk("div", "g3", w); g.style.transform = `translate3d(${x}px, ${-KH / 2}px, ${z}px) rotateY(${ry}deg)`;
    const P = (cls, wd, ht, tr) => mk("div", "pl " + cls, g, `left:${-wd / 2}px; top:${-ht / 2}px; width:${wd}px; height:${ht}px; transform:${tr};`);
    const fr = P(money ? "km" : "kf", KW, KH, `translate3d(0px, 0px, ${KD / 2}px)`);
    fr.innerHTML = money ? '<div class="bn"><i></i><em></em><b>Rp</b><s></s></div><div class="pc">Rp400.000</div>' : '<i class="tp"></i><b class="lb">STOK</b>';
    P("ks", KD, KH, `translate3d(${KW / 2}px, 0px, 0px) rotateY(90deg)`);
    P("ks", KD, KH, `translate3d(${-KW / 2}px, 0px, 0px) rotateY(-90deg)`);
    P("kt", KW, KD, `translate3d(0px, ${-KH / 2}px, 0px) rotateX(90deg)`);
  }
  const P0 = (cls, wd, ht, tr) => mk("div", "pl " + cls, w, `left:${-wd / 2}px; top:${-ht / 2}px; width:${wd}px; height:${ht}px; transform:${tr};`);
  P0("bdt", 1100, 420, `translate3d(0px, 0px, -150px) rotateX(90deg)`);
  P0("bdl", 1100, 44, `translate3d(0px, 22px, 60px)`);
  kardus(-290, -215, 0, false);
  kardus(30, -245, 0, false);
  kardus(-110, -50, -12, true);
  // MODAL tag hooked on the board lip
  const tg = mk("div", "g3", w); tg.style.transform = "translate3d(-120px, 14px, 64px) rotateZ(5deg)";
  tg.innerHTML = '<div class="tagw"><svg viewBox="0 0 220 70"><path d="M110 0 L110 70" stroke="#FED111" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="0" r="9" fill="#FED111"/></svg><div class="tag"><i class="hole"></i><b>MODAL</b><span>nyangkut</span></div></div>';
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: nothing may overflow its box
    document.querySelectorAll(".pc, .lb, .tag b, .tag span, #t3").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror OVERFLOW", e.textContent); });
    r.render({ x: 905, y: 1500, h: 640, yaw: -24, roll: 0, headYaw: -18, headPitch: -6, headRoll: 6, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 112, fwd: 30, bend: 14, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.2, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

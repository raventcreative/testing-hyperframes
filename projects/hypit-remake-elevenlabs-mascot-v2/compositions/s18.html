  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="s18"]');
      const q = (s) => R.querySelector(s);
      const qa = (s) => R.querySelectorAll(s);
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

      // page contents: step markers as dot counts (1/2/3), line bars, mini pictogram tile
      [[q("#s18-c1"), 166], [q("#s18-c2"), 415], [q("#s18-c3"), 664]].forEach((pg, idx) => {
        const g = pg[0], x0 = pg[1] + 26;
        for (let d = 0; d <= idx; d++) {
          mk("circle", { cx: x0 + 16 + d * 38, cy: 524, r: 15, fill: "url(#s18-navy)" }, g);
          mk("circle", { cx: x0 + 16 + d * 38, cy: 524, r: 5, fill: "#ffffff" }, g);
        }
        for (let l = 0; l < 4; l++) {
          const w = 120 + Math.round(70 * Math.abs(Math.sin((idx * 4 + l) * 1.73)));
          mk("rect", { x: x0, y: 568 + l * 30, width: w, height: 11, rx: 5.5, fill: l === 0 ? "#274976" : "#c6d6ec" }, g);
        }
        mk("rect", { x: x0, y: 700, width: 198, height: 92, rx: 14, fill: "url(#s18-navy)" }, g);
        mk("path", { d: "M" + (x0 + 22) + " 732 l14 12 l-14 12", stroke: "#dce8f6", "stroke-width": 5, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
        mk("rect", { x: x0 + 50, y: 739, width: 60 + idx * 22, height: 10, rx: 5, fill: "#8ea9cc" }, g);
        mk("rect", { x: x0 + 22, y: 766, width: 40, height: 8, rx: 4, fill: "#3a5d8f" }, g);
      });
      // hinge knuckles along the flap's bottom
      const hinge = q("#s18-hinge");
      for (let i = 0; i < 6; i++) mk("rect", { x: 210 + i * 126, y: 1426, width: 64, height: 20, rx: 10 }, hinge);
      // sparkles
      const star = (x, y, s) => "M" + x + " " + (y - s) + " L" + (x + s * .28) + " " + (y - s * .28) + " L" + (x + s) + " " + y + " L" + (x + s * .28) + " " + (y + s * .28) + " L" + x + " " + (y + s) + " L" + (x - s * .28) + " " + (y + s * .28) + " L" + (x - s) + " " + y + " L" + (x - s * .28) + " " + (y - s * .28) + "Z";
      [[110, 560, 22], [975, 590, 20], [990, 860, 14], [95, 840, 13], [720, 545, 11]].forEach((p) => mk("path", { d: star(p[0], p[1], p[2]), class: "s18-sp" }, q("#s18-sparks")));
      const sp = qa(".s18-sp");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- initial states ----
      gsap.set("#s18-cam", { scale: 1, transformOrigin: "540px 900px" });
      gsap.set("#s18-book", { y: 400 });
      gsap.set("#s18-bookTilt", { rotation: 0, scale: 1, svgOrigin: "540 824" });
      gsap.set("#s18-pL", { scaleX: 0, svgOrigin: "416 650" });
      gsap.set("#s18-pR", { scaleX: 0, svgOrigin: "664 650" });
      gsap.set("#s18-cover", { scaleX: 1, svgOrigin: "415 650" });
      gsap.set("#s18-front", { scaleY: 1, svgOrigin: "540 1438" });
      gsap.set("#s18-flapshade", { opacity: 0 });
      gsap.set("#s18-sweepbar", { x: 0 });
      gsap.set("#s18-shock", { scale: 0.5, opacity: 0, svgOrigin: "540 800" });
      gsap.set(sp, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(["#s18-far1", "#s18-far2", "#s18-far3"], { x: 0, y: 0 });
      gsap.set("#s18-near", { x: 0, y: 0, rotation: 0 });

      // ---- camera push ----
      tl.fromTo("#s18-cam", { scale: 1 }, { scale: 1.05, duration: 1.99, ease: "power1.inOut", immediateRender: false }, 0);
      tl.fromTo("#s18-far1", { x: 0 }, { x: -16, duration: 1.99, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s18-far2", { x: 0 }, { x: 14, duration: 1.99, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s18-far3", { x: 0 }, { x: 10, duration: 1.99, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s18-near", { x: 0, y: 0, rotation: 0 }, { x: -50, y: -24, rotation: -10, duration: 1.99, ease: "none", immediateRender: false }, 0);

      // ---- 'Mau link repo dan': flap lowers, chain plate glints on 'link'/'repo', booklet peeks ----
      tl.fromTo("#s18-front", { scaleY: 1 }, { scaleY: 0.82, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 0.12);
      tl.fromTo("#s18-flapshade", { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 0.12);
      tl.fromTo("#s18-sweepbar", { x: 0 }, { x: 420, duration: 0.42, ease: "power2.inOut", immediateRender: false }, 0.335);
      tl.fromTo("#s18-book", { y: 400 }, { y: 300, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.3);
      // anticipation dip
      tl.fromTo("#s18-book", { y: 300 }, { y: 322, duration: 0.12, ease: "power2.inOut", immediateRender: false }, 0.84);
      // APEX 'panduan' 0.964: booklet launches up and unfurls
      tl.fromTo("#s18-book", { y: 322 }, { y: 150, duration: 0.3, ease: "expo.out", immediateRender: false }, 0.964);
      tl.fromTo("#s18-bookTilt", { rotation: 0, scale: 1 }, { rotation: 0, scale: 1.12, duration: 0.34, ease: "expo.out", immediateRender: false }, 0.964);
      tl.fromTo("#s18-cover", { scaleX: 1 }, { scaleX: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, 0.964);
      tl.fromTo("#s18-pL", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "back.out(1.5)", immediateRender: false }, 1.04);
      tl.fromTo("#s18-pR", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "back.out(1.5)", immediateRender: false }, 1.1);
      tl.fromTo("#s18-shock", { scale: 0.5, opacity: 0.85 }, { scale: 1.9, opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.964);
      tl.fromTo(sp, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)", stagger: 0.035, immediateRender: false }, 1.12);
      tl.fromTo(sp, { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.28, ease: "power2.in", stagger: 0.035, immediateRender: false }, 1.42);
      // settle: booklet tilts toward the viewer and holds
      tl.fromTo("#s18-bookTilt", { rotation: 0, scale: 1.12 }, { rotation: -2.5, scale: 1.15, duration: 0.6, ease: "sine.out", immediateRender: false }, 1.38);

      window.__timelines["s18"] = tl;
    })();

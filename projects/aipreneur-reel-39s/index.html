      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef3fa; }

      .kit-paper { background: linear-gradient(178deg, #fffefb, #f6f4ee); border: 1px solid rgba(46,46,46,0.08); box-shadow: var(--shadow-md); }
      .kit-glass { background: linear-gradient(140deg, rgba(255,255,255,0.92), rgba(214,228,247,0.78)); border: 2px solid rgba(255,255,255,0.95);

      .kit-navy { background: linear-gradient(135deg, #3a6299, #294b77 55%, #1f3a5f); color: #fbfcfe; box-shadow: var(--shadow-md); }
      .kit-contact { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(28,51,84,0.45), rgba(28,51,84,0.14) 45%, rgba(28,51,84,0) 72%); }
      .kit-mono { font-family: "IBM Plex Mono", monospace; letter-spacing: 0.06em; }

      /* ===== BG ===== */

      #bg .grid { position: absolute; inset: -60px;

      .haze { position: absolute; border-radius: 50%; }
      #haze-a { left: -260px; top: -120px; width: 900px; height: 900px; background: radial-gradient(circle, rgba(172,198,231,0.5), rgba(172,198,231,0) 68%); }
      #haze-b { left: 420px; top: 1240px; width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(203,219,244,0.55), rgba(203,219,244,0) 68%); }

      #grain { position: absolute; left: -64px; top: -64px; width: 1208px; height: 2048px; background: url(assets/brand/grain_256.png); opacity: 0.5; }
      .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffffff, rgba(203,219,244,0.75) 60%, rgba(172,198,231,0.2)); box-shadow: 0 0 10px rgba(255,255,255,0.8); }

      .cap { position: absolute; left: 70px; right: 70px; top: 232px; text-align: center; font: 700 46px/1.22 Montserrat, sans-serif; color: var(--ink); letter-spacing: -0.01em; }

      .cap .w { display: inline-block; }
      .cap .key { color: var(--navy); background: linear-gradient(transparent 62%, rgba(172,198,231,0.75) 62%, rgba(172,198,231,0.75) 92%, transparent 92%); }

    <script>

          ["Jadi",12.09],["bukan",12.35],["cuma",12.6],["bilang",12.86],["bikin",13.32],["yang",13.75],["keren,",14.0],

        const capRoot = document.getElementById("caps");
        CAPS.forEach(([s, e, a, b, keys], ci) => {

          c.id = "cap" + ci;
          c.setAttribute("data-start", s); c.setAttribute("data-duration", (e - s).toFixed(3)); c.setAttribute("data-track-index", 8);
          for (let i = a; i <= b; i++) {
            const m = mk("span", "m", c);
            const w = mk("span", "w" + (keys.includes(i) ? " key" : ""), m, W[i][0]);
            if (i < b) c.appendChild(document.createTextNode(" "));
            const t = Math.max(s + 0.02, W[i][1] - 0.08);
            S(w, { yPercent: 110, opacity: 0 });
            tl.set(w, { opacity: 1 }, t);
            tl.to(w, { yPercent: 0, duration: 0.34, ease: "power4.out" }, t);
          }
        });

        // ambient BG (seeded, seekable)
        let seed = 20261021;
        const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        for (let i = 0; i < 22; i++) {

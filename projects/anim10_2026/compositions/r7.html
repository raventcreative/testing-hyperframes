  <script>
    (function () {
      // r7 EXPLAINER 3D "Tujuh, Explainer 3D, lembut, cocok buat jelasin produk."

      // "jelasin produk." -> the three pins ping in turn and the chips bump together; everything folds away before the next round.

      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }

      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const wt = (w) => T(window.VO_WORDS.find((x) => x[0] === w && x[1] > R.start)[1]);

      // measured stage-local part positions [global t, x, y] (face screen centre, chest logo centre, left floating hand)
      const VIS = [[27.1, 381, 546], [28.3, 392, 544], [28.7, 391, 547], [29.0, 383, 537], [29.3, 372, 526], [29.6, 361, 539], [29.9, 360, 530], [30.15, 362, 544], [30.4, 363, 546]];
      const LOGO = [[27.1, 371, 676], [28.3, 380, 674], [28.7, 376, 680], [29.0, 370, 672], [29.3, 360, 662], [29.6, 356, 666], [29.9, 354, 668], [30.15, 350, 676], [30.4, 349, 677]];
      const HAND = [[27.1, 233, 719], [28.3, 234, 717], [28.7, 228, 716], [29.0, 221, 711], [29.3, 215, 711], [29.6, 211, 722], [29.9, 209, 723], [30.15, 207, 724], [30.4, 206, 724]];
      const at = (S, g) => { let i = 0; while (i + 2 < S.length && g >= S[i + 1][0]) i++; const [t0, x0, y0] = S[i], [t1, x1, y1] = S[i + 1], u = Math.max(0, Math.min(1, (g - t0) / (t1 - t0))); return [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u]; };
      // the group follows its part from tIn (local) to the end of the scene
      function track(g, S, off, tIn) {
        const p0 = at(S, tIn + R.start); I(g, { x: p0[0] + off[0], y: p0[1] + off[1] });
        let tp = tIn, pp = p0;
        S.forEach(([gt]) => {
          const tk = Math.min(T(gt), DUR - 0.005); if (tk <= tp + 1e-3) return;

          tp = tk; pp = p;
        });
      }
      const CALL = [
        { k: "A", S: VIS, off: [86, -50], t: wt("3D,") + 0.02, o: "0% 50%", xp: 0, yp: -50 },
        { k: "C", S: HAND, off: [4, -2], t: wt("lembut,") - 0.02, o: "22% 100%", xp: 0, yp: -100 },

      ];
      const tJ = wt("jelasin"), tP = wt("produk."), tX = tP + 0.175;
      CALL.forEach((c, i) => {
        const g = $("r7-g" + c.k), dot = $("r7-d" + c.k), ring = $("r7-r" + c.k), chip = $("r7-c" + c.k);
        const lines = [$("r7-h" + c.k), $("r7-l" + c.k)], len = lines[1].getTotalLength() || 120;
        track(g, c.S, c.off, c.t - 0.05);
        // pin pops, ring ripples, leader draws out, chip springs from the leader's end
        I(dot, { scale: 0, opacity: 1 }); I(ring, { scale: 0.4, opacity: 0 });
        lines.forEach((l) => { l.setAttribute("stroke-dasharray", `${len + 1} ${len + 40}`); I(l, { attr: { "stroke-dashoffset": len + 1 } }); });
        I(chip, { scale: 0.55, opacity: 0, transformOrigin: c.o, xPercent: c.xp, yPercent: c.yp });
        ft(dot, { scale: 0 }, { scale: 1, duration: 0.42, ease: "back.out(3.2)" }, c.t);
        ft(ring, { scale: 0.4, opacity: 0.95 }, { scale: 2.3, opacity: 0, duration: 0.55, ease: "power2.out" }, c.t);
        lines.forEach((l) => ft(l, { attr: { "stroke-dashoffset": len + 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.inOut" }, c.t + 0.08));
        ft(chip, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, c.t + 0.3);
        ft(chip, { scale: 0.55 }, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.6)" }, c.t + 0.3);
        // "jelasin produk.": pins ping in turn, chips bump together
        ft(ring, { scale: 0.4, opacity: 0.95 }, { scale: 2.3, opacity: 0, duration: 0.4, ease: "power2.out" }, tJ + i * 0.1);
        ft(dot, { scale: 1 }, { scale: 1.35, duration: 0.1, ease: "power2.out" }, tJ + i * 0.1);

      });

            slider: { bg: "#ffffff", svg:
              '<rect x="0" y="0" width="124" height="206" fill="url(#s15-grich)"/><path d="M84 52 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z" fill="#fff"/><rect x="66" y="120" width="44" height="8" rx="4" fill="#fff" opacity="0.8"/><rect x="66" y="134" width="30" height="6" rx="3" fill="#acc6e7"/>' +
              '<g class="s15-bf"><rect x="0" y="0" width="124" height="206" fill="#e9edf2"/><rect x="12" y="120" width="44" height="8" rx="4" fill="#c4ccd6"/><rect x="12" y="134" width="30" height="6" rx="3" fill="#d3d9e0"/><circle cx="34" cy="64" r="12" fill="#d3d9e0"/></g>' +
              '<g class="s15-hd"><rect x="60" y="0" width="4" height="206" fill="#fff"/><circle cx="62" cy="103" r="12" fill="#fff" stroke="#294b77" stroke-width="2"/><path d="M57 103 l-3 0 M67 103 l3 0" stroke="#294b77" stroke-width="2"/></g>' },
            gem: { bg: "#eef4fb", svg:
              '<ellipse cx="62" cy="168" rx="36" ry="8" fill="#cbdbf4"/><rect x="38" y="150" width="48" height="18" rx="3" fill="#fff" stroke="#acc6e7" stroke-width="2"/>' +
              '<g class="s15-gm"><polygon points="44,62 80,62 100,84 62,140 24,84" fill="url(#s15-ggem)" stroke="#294b77" stroke-width="2" stroke-linejoin="round"/><path d="M24 84 H100 M44 62 L54 84 L62 140 L70 84 L80 62 M54 84 L62 62 L70 84" fill="none" stroke="#ffffff" stroke-width="1.5"/></g>' +
              '<g class="s15-tw"><path d="M98 40 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2 l7 -2z" fill="#f2c46d"/></g><g class="s15-tw"><path d="M24 116 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z" fill="#3a6299"/></g>' + foot },
          };
          const order = ["bubbles", "gauge", "chip", "conveyor", "focus", "board", "lock", "slider", "gem"];
          const svgOf = (k) => `<svg class="s15-svg" viewBox="0 0 124 206">${B[k].svg}</svg>`;

          const grid = q("#s15-grid");
          const tiles = [];
          order.forEach((k, i) => {
            const c = i % 3, r = Math.floor(i / 3);
            const x = 8 + c * 134, y = 110 + r * 220;
            mk("s15-slot", grid, `left:${x}px;top:${y}px`);
            const t = mk("s15-tile", grid, `left:${x}px;top:${y}px;background:linear-gradient(170deg,#ffffff,${B[k].bg})`, svgOf(k) + '<div class="s15-tflash"></div>');
            tiles.push({ t, k });
          });

          // far floating tiles (depth)
          const far = q("#s15-far");
          const farT = [["gauge", 96, 520, 0.8], ["lock", 76, 930, 0.7], ["bubbles", 860, 560, 0.74], ["gem", 870, 900, 0.82]].filter((f) => B[f[0]]);
          const farEls = farT.map(([k, x, y, s], i) => {
            const e = mk("s15-abs s15-ftile", far, `left:${x}px;top:${y}px`, svgOf(k));
            return { e, s, dir: i % 2 ? 1 : -1 };
          });

          // sparkles around the final phone
          const spk = q("#s15-sparks");
          const sparks = [];
          [[310, 520, 0.6], [770, 470, 0.8], [292, 880, 0.45], [800, 1010, 0.55], [720, 640, 0.4]].forEach(([x, y, s], i) => {
            const d = mk("s15-abs s15-spark", spk, `left:${x - 32}px;top:${y - 32}px`,
              `<svg class="s15-svg" viewBox="-32 -32 64 64"><path d="M0 -30 C2 -6 6 -2 30 0 C6 2 2 6 0 30 C-2 6 -6 2 -30 0 C-6 -2 -2 -6 0 -30Z" fill="${i === 1 ? "#f2c46d" : "#ffffff"}" stroke="rgba(41,75,119,0.25)" stroke-width="1"/></svg>`);
            sparks.push({ d, s });
          });
          const fg = q("#s15-fg");
          const motes = [];
          for (let i = 0; i < 8; i++) {
            const s = 10 + rnd() * 20;
            motes.push(mk("s15-abs s15-fmote", fg, `left:${(60 + rnd() * 960).toFixed(0)}px;top:${(470 + rnd() * 1000).toFixed(0)}px;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;opacity:${(0.4 + rnd() * 0.4).toFixed(2)}`));
          }

          // ---------- initial states ----------
          const PH = q("#s15-phone");
          tl.set(PH, { transformPerspective: 1800 }, 0);
          tiles.forEach(({ t }) => tl.set(t, { opacity: 0 }, 0));
          tl.set(q("#s15-plinth"), { opacity: 0 }, 0);
          tl.set(q("#s15-plshadow"), { opacity: 0 }, 0);
          tl.set(q("#s15-logow"), { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" }, 0);
          tl.set(q("#s15-sheen"), { rotation: 18, x: 0 }, 0);
          tl.set(q("#s15-glint"), { rotation: 16, x: 0 }, 0);
          tl.set(q("#s15-pring"), { opacity: 0 }, 0);
          tl.set(q("#s15-pshadow"), { opacity: 0 }, 0);
          tl.set(q("#s15-prog"), { scaleX: 0.02, transformOrigin: "0% 50%" }, 0);
          sparks.forEach((s) => tl.set(s.d, { scale: 0, opacity: 0 }, 0));

          // ---------- ambient ----------
          tl.fromTo(q("#s15-halo"), { rotation: -6, scale: 1.15, opacity: 0.6 }, { rotation: 12, scale: 1, opacity: 1, duration: D, ease: "power2.out" }, 0);
          tl.fromTo(q("#s15-key"), { x: -30 }, { x: 30, duration: D, ease: "sine.out" }, 0);
          motes.forEach((m, i) => tl.fromTo(m, { y: 0, x: 0 }, { y: -(70 + i * 12), x: i % 2 ? 22 : -18, duration: D - 0.15, ease: "power1.out" }, 0));
          tl.to(q("#s15-prog"), { scaleX: 1, duration: 3.5, ease: "none" }, 0);
          tl.fromTo(q("#s15-knob"), { x: 0 }, { x: 314, duration: 3.5, ease: "none" }, 0);
          farEls.forEach((f, i) => {
            tl.fromTo(f.e, { opacity: 0, scale: f.s * 0.7, y: 160, rotation: f.dir * 10 }, { opacity: 0.85, scale: f.s, y: 0, rotation: f.dir * 6, duration: 1.6, ease: "power3.out" }, 0.2 + i * 0.12);
            tl.to(f.e, { y: -24, rotation: f.dir * 4, duration: 1.4, ease: "sine.out" }, 2.1);
          });

          // ---------- camera: close on the screen, pan as tiles cascade ----------
          tl.fromTo(PH, { scale: 1.75, y: 270, x: 14, rotation: -2, rotationY: 0 }, { y: -20, x: -12, duration: 1.8, ease: "sine.inOut" }, 0);
          tl.to(PH, { rotation: -4, duration: 1.8, ease: "none" }, 0);

          // tiles cascade 0.17 → 1.69
          tiles.forEach(({ t, k }, i) => {
            const t0 = 0.17 + i * 0.19;
            tl.fromTo(t, { opacity: 0, scale: 0.6, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(1.5)" }, t0);
            tl.fromTo(t.querySelector(".s15-tflash"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, t0 + 0.05);
            const a = t0 + 0.25;
            const g = (s) => t.querySelectorAll(s);
            if (k === "bubbles") g(".s15-p").forEach((p, j) => {
              tl.fromTo(p, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, t0 + 0.08 + j * 0.07);
              tl.to(p, { y: -4, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: reps(a + 0.3 + j * 0.1, 0.45) }, a + 0.3 + j * 0.1);
            });
            if (k === "gauge") tl.fromTo(g(".s15-nd")[0], { rotation: -70, svgOrigin: "62 124" }, { rotation: 20, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: reps(a - 0.2, 0.5) }, a - 0.2);
            if (k === "chip") {
              tl.fromTo(g(".s15-core")[0], { opacity: 0.55 }, { opacity: 1, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: reps(a, 0.35) }, a);
              tl.fromTo(g(".s15-glow")[0], { opacity: 0.3, scale: 0.85, svgOrigin: "62 100" }, { opacity: 1, scale: 1.05, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: reps(a, 0.35) }, a);
            }
            if (k === "conveyor") {
              tl.fromTo(g(".s15-bx")[0], { x: 0 }, { x: 30, duration: 0.3, ease: "none", repeat: reps(t0, 0.3) }, t0);
              tl.fromTo(g(".s15-sw")[0], { rotation: 0, svgOrigin: "62 64" }, { rotation: 360, duration: 0.6, ease: "none", repeat: reps(t0, 0.6) }, t0);
            }
            if (k === "focus") {
              tl.fromTo(g(".s15-rot")[0], { rotation: 0, svgOrigin: "62 103" }, { rotation: 180, duration: LOOP_END - t0, ease: "none" }, t0);
              tl.fromTo(g(".s15-dot")[0], { scale: 0.6, svgOrigin: "62 103" }, { scale: 1.25, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: reps(a, 0.4) }, a);
            }
            if (k === "board") {
              g(".s15-sws circle").forEach((c, j) => tl.fromTo(c, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.22, ease: "back.out(2.5)" }, t0 + 0.12 + j * 0.06));
              tl.fromTo(g(".s15-film")[0], { x: 0 }, { x: -26, duration: 0.5, ease: "none", repeat: reps(a, 0.5) }, a);
            }
            if (k === "lock") {
              tl.fromTo(g(".s15-key")[0], { y: 18 }, { y: 0, duration: 0.3, ease: "power3.out" }, a - 0.1);
              tl.fromTo(g(".s15-key")[0], { scaleX: 1, svgOrigin: "62 160" }, { scaleX: 0.25, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, a + 0.2);
              tl.fromTo(g(".s15-sh")[0], { y: 0 }, { y: -10, duration: 0.25, ease: "back.out(2)" }, a + 0.45);
            }
            if (k === "slider") {
              tl.fromTo(g(".s15-bf")[0], { scaleX: 0.85, svgOrigin: "0 0" }, { scaleX: 0.2, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: reps(a - 0.15, 0.6) }, a - 0.15);
              tl.fromTo(g(".s15-hd")[0], { x: 43.4 }, { x: -37.2, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: reps(a - 0.15, 0.6) }, a - 0.15);
            }
            if (k === "gem") {
              tl.fromTo(g(".s15-gm")[0], { scaleX: 1, svgOrigin: "62 100" }, { scaleX: 0.82, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: reps(a, 0.45) }, a);
              g(".s15-tw").forEach((w, j) => tl.fromTo(w, { scale: 0.2, transformOrigin: "50% 50%" }, { scale: 1.2, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: reps(a + j * 0.15, 0.3) }, a + j * 0.15));
            }
          });

          // ---------- "selevel ini," 1.93 — pull back to the whole phone ----------
          tl.to(PH, { scale: 1.0, y: 0, x: 0, rotation: -6, rotationY: -12, duration: 0.52, ease: "power3.inOut" }, 1.8);
          tl.fromTo(q("#s15-pring"), { opacity: 0, scale: 0.55 }, { opacity: 0.9, scale: 1, duration: 0.35, ease: "power3.out" }, 1.93);
          tl.to(q("#s15-pring"), { opacity: 0, scale: 1.18, duration: 0.45, ease: "power2.in" }, 2.28);

          // ---------- "asal" 2.40 — settle to upper-middle, logo plate reveals ----------
          tl.to(PH, { scale: 0.78, y: -160, rotation: -4, rotationY: -8, duration: 0.62, ease: "power3.inOut" }, 2.4);
          tl.fromTo(q("#s15-pshadow"), { opacity: 0, scaleX: 0.5 }, { opacity: 0.85, scaleX: 0.8, duration: 0.5, ease: "power3.out" }, 2.55);
          tl.to(PH, { y: -166, duration: 0.6, ease: "sine.out" }, 3.02);
          tl.fromTo(q("#s15-plinth"), { opacity: 0, y: 70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 2.42);
          tl.fromTo(q("#s15-plshadow"), { opacity: 0, scaleX: 0.7 }, { opacity: 0.9, scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.45);
          tl.to(q("#s15-logow"), { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.33, ease: "power2.inOut" }, 2.55);
          tl.fromTo(q("#s15-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 2.75);

          // ---------- "tepat." 3.20 — sheen ----------
          tl.to(q("#s15-sheen"), { x: 1200, duration: 0.5, ease: "power2.inOut" }, 3.08);
          tl.to(q("#s15-glint"), { x: 820, duration: 0.5, ease: "power2.inOut" }, 3.1);
          sparks.forEach((s, i) => {
            const t0 = 3.18 + i * 0.05;
            tl.fromTo(s.d, { scale: 0, opacity: 0, rotation: 0 }, { scale: s.s, opacity: 1, rotation: 45, duration: 0.24, ease: "back.out(2.5)" }, t0);
            tl.to(s.d, { scale: s.s * 0.6, rotation: 60, duration: Math.max(0.05, 3.65 - t0 - 0.24), ease: "power2.out" }, t0 + 0.24);
          });

          window.__timelines["s15"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

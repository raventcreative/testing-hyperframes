  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const ei = (x) => Math.pow(clamp(x, 0, 1), 3);
      const back = (x) => { x = clamp(x, 0, 1); const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const H = window.HFP;
      const $ = (id) => document.getElementById(id);
      $("e7-bd").innerHTML = H.backdropHTML("e7b");
      $("e7-chrome").innerHTML = H.chromeHTML("e7c", 7, "Checklist");

      const card = $("e7-card"), cast = $("e7-cast"), cap = $("e7-cap"), num = $("e7-n"), count = $("e7-count"), fill = $("e7-fill");
      const rows = Array.from(card.querySelectorAll(".e7-row")).map((r) => ({
        box: r.querySelector(".e7-box"), fl: r.querySelector(".fl"), bx: r.querySelector(".bx"), ring: r.querySelector(".e7-ring"),
        path: r.querySelector("path"), lb: r.querySelector(".e7-lb"), st: r.querySelector(".e7-st") }));
      const CHECK = [1.0, 1.2, 1.4];                   // one tick every 0.2 s

      function render(t) {
        const inP = seg(t, 0.3, 0.68), outP = ei(seg(t, 3.42, 3.85));
        const vis = clamp(inP * 2, 0, 1) * (1 - outP);
        const sc = (0.9 + 0.1 * back(inP)) * (1 - 0.06 * outP);
        card.style.opacity = vis.toFixed(3);
        card.style.transform = "translateY(" + ((1 - eo(inP)) * 26 - outP * 30).toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
        cast.style.opacity = (vis * 0.9).toFixed(3);
        let done = 0;
        for (let i = 0; i < 3; i++) {
          const r = rows[i], p = seg(t, CHECK[i], CHECK[i] + 0.22);
          if (t >= CHECK[i]) done++;
          const pop = p > 0 ? 1 + 0.28 * Math.sin(Math.PI * clamp(p * 1.25, 0, 1)) : 1;   // small pop 1 -> 1.28 -> 1
          r.box.style.transform = "scale(" + pop.toFixed(3) + ")";
          r.fl.style.opacity = clamp(p * 3, 0, 1).toFixed(3);
          r.bx.style.opacity = (1 - clamp(p * 3, 0, 1)).toFixed(3);
          r.path.setAttribute("stroke-dashoffset", (30 * (1 - eo(seg(t, CHECK[i] + 0.03, CHECK[i] + 0.2)))).toFixed(2));
          const rp = seg(t, CHECK[i], CHECK[i] + 0.4);
          r.ring.style.opacity = (rp > 0 ? (1 - rp) * 0.9 : 0).toFixed(3);
          r.ring.style.transform = "scale(" + (1 + rp * 0.9).toFixed(3) + ")";
          r.lb.style.color = p > 0.3 ? "#9fe9ff" : "#eaf4ff";
          r.st.style.opacity = eo(seg(t, CHECK[i] + 0.08, CHECK[i] + 0.3)).toFixed(3);
          r.st.style.transform = "translateX(" + ((1 - eo(seg(t, CHECK[i] + 0.08, CHECK[i] + 0.3))) * -10).toFixed(1) + "px)";
        }
        num.textContent = String(done);
        const np = seg(t, CHECK[Math.max(0, done - 1)], CHECK[Math.max(0, done - 1)] + 0.18);
        num.style.transform = done > 0 ? "scale(" + (1 + 0.35 * Math.sin(Math.PI * np)).toFixed(3) + ")" : "scale(1)";
        const full = seg(t, 1.42, 1.6);
        count.style.background = full > 0 ? "rgba(0,201,255," + (0.1 + 0.9 * full).toFixed(3) + ")" : "rgba(127,216,255,0.10)";
        count.style.color = full > 0.5 ? "#04203a" : "#a9c2de";
        num.style.color = full > 0.5 ? "#04203a" : "#ffffff";
        count.style.boxShadow = full > 0 ? "inset 0 0 0 1.5px rgba(0,201,255,0.9), 0 0 " + (18 * full).toFixed(1) + "px rgba(0,201,255,0.55)" : "inset 0 0 0 1.5px rgba(127,216,255,0.28)";
        // progress bar steps to each tick
        let w = 0;
        for (let i = 0; i < 3; i++) w += eo(seg(t, CHECK[i], CHECK[i] + 0.18)) / 3;
        fill.style.width = (w * 100).toFixed(2) + "%";
        const c = eo(seg(t, 0.5, 0.85)) * (1 - seg(t, 3.45, 3.8));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px)";
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e07"] = tl;
    })();
  </script>

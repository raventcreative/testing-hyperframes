<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 9 aplikasi berbayar, kembaran gratisnya di GitHub</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<script src="../vendor/apps.js"></script>
<!-- Elegant IG Reels cover 1080x1920 on the client's light background (+ its grid, top-right): hook "9 aplikasi berbayar" ->
     "ada kembaran GRATIS-nya di GitHub", the nine real paid logos (struck) above their nine free twins (real GitHub org logos, checked),
     mascot (host) + robot. Poppins 700/400 in the navy gradient. Everything that matters sits inside the 4:5 grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8766 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f8fe; font-family: Poppins, sans-serif; color: #0a0d2c; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  #gridwrap { position: absolute; left: 330px; top: 160px; width: 900px; height: 820px;
    -webkit-mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); }
  #grid { position: absolute; left: -473px; top: -473px; width: 1846px; height: 1766px; background-image: linear-gradient(90deg, rgba(104,132,186,.30) 2px, transparent 2px), linear-gradient(0deg, rgba(104,132,186,.30) 2px, transparent 2px); background-size: 43px 43px; }
  #glow { position: absolute; left: 90px; top: 380px; width: 900px; height: 760px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.95), rgba(255,255,255,0) 66%); }
  .grad { background: linear-gradient(172deg, #0a0d2c 8%, #294b77 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; z-index: 30; }
  #eyebrow { top: 362px; display: flex; justify-content: center; }
  #eyebrow > span { height: 56px; padding: 0 22px 0 12px; border-radius: 28px; display: flex; align-items: center; gap: 10px; background: #ffffff;
    box-shadow: 0 12px 26px -12px rgba(20,40,90,.4), 0 0 0 1.5px rgba(10,13,44,.07); font: 700 20px/1 Poppins; letter-spacing: 3px; }
  #eyebrow .gh { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(160deg, #1f2a5a, #0a0d2c); position: relative; }
  #eyebrow .gh i { position: absolute; left: 7px; top: 7px; width: 22px; height: 22px; background: #fff; -webkit-mask: url(../assets/icons/si-github.svg) center / contain no-repeat; mask: url(../assets/icons/si-github.svg) center / contain no-repeat; }
  #hero { top: 440px; display: flex; justify-content: center; align-items: center; gap: 24px; }
  #nine { font: 700 250px/0.86 Poppins; letter-spacing: -12px; padding-right: 12px; filter: drop-shadow(0 18px 30px rgba(10,13,44,.18)); }
  #st { display: flex; flex-direction: column; gap: 2px; text-align: left; }
  #st b { font: 700 88px/1 Poppins; letter-spacing: -3px; }
  #st b.r { position: relative; }
  #st b.r::after { content: ""; position: absolute; left: -4px; right: -6px; top: 52%; height: 8px; border-radius: 4px; background: #e5484d; transform: rotate(-3deg); box-shadow: 0 3px 10px rgba(229,72,77,.35); }
  #sub { top: 700px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 400 46px/1 Poppins; }
  #sub .g { height: 72px; padding: 0 24px; border-radius: 20px; background: linear-gradient(160deg, #2da44e, #116329); color: #fff; font: 700 48px/72px Poppins; letter-spacing: 1px; box-shadow: 0 16px 34px -14px rgba(17,99,41,.7); transform: rotate(-3deg); }
  .row { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; gap: 14px; z-index: 12; }
  .t { position: relative; width: 92px; height: 92px; border-radius: 24px; overflow: hidden; background: #fff; box-shadow: 0 12px 24px -12px rgba(20,40,90,.45), 0 0 0 1.5px rgba(10,13,44,.07); }
  .lg { position: absolute; inset: 0; }
  .lg.png { background-size: 100% 100%; }
  .lg i { position: absolute; left: 22px; top: 22px; width: 48px; height: 48px; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .paid .t { opacity: .9; }
  .paid .t::after { content: ""; position: absolute; left: 8px; right: 8px; top: 43px; height: 6px; border-radius: 3px; background: #e5484d; transform: rotate(-24deg); }
  .ok { position: absolute; right: -6px; bottom: -6px; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(160deg, #2da44e, #116329); box-shadow: 0 0 0 3px #fff; z-index: 2; }
  .ok i { position: absolute; left: 7px; top: 7px; width: 20px; height: 20px; background: #fff; -webkit-mask: url(../assets/icons/lucide-check.svg) center / contain no-repeat; mask: url(../assets/icons/lucide-check.svg) center / contain no-repeat; }
  .wrapok { position: relative; }
  #arrows { position: absolute; left: 0; width: 1080px; top: 940px; display: flex; justify-content: center; gap: 14px; z-index: 12; }
  #arrows i { display: block; width: 92px; height: 34px; background: #2da44e; opacity: .85; -webkit-mask: url(../assets/icons/lucide-arrow-right.svg) center / 30px 30px no-repeat; mask: url(../assets/icons/lucide-arrow-right.svg) center / 30px 30px no-repeat; transform: rotate(90deg); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #r { z-index: 21; } #m { z-index: 22; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="gridwrap"><div id="grid"></div></div><div id="glow" style="position:absolute"></div>
  <div class="row paid" id="paid" style="top:836px"></div>
  <div id="arrows"></div>
  <div class="row free" id="free" style="top:986px"></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><span class="gh"><i></i></span><b class="grad">OPEN SOURCE · GITHUB</b></span></div>
  <div id="hero" class="ctr"><div id="nine" class="grad">9</div><div id="st"><b class="grad">aplikasi</b><b class="grad r">berbayar</b></div></div>
  <div id="sub" class="ctr"><span class="grad">punya kembaran</span><span class="g">GRATIS</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS, A = window.APPS;
  const logo = (l) => l.type === "png" ? `<div class="lg png" style="background-image:url(../${l.src});${l.bg ? `background-color:${l.bg};` : ""}"></div>`
    : `<div class="lg" style="background:${l.bg || "#fff"}"><i style="--m:url(../${l.src});background:${l.color}"></i></div>`;
  document.getElementById("paid").innerHTML = A.map((a) => `<div class="t">${logo(a.paid.logo)}</div>`).join("");
  document.getElementById("free").innerHTML = A.map((a) => `<div class="wrapok"><div class="t">${logo(a.free.logo)}</div><div class="ok"><i></i></div></div>`).join("");
  document.getElementById("arrows").innerHTML = A.map(() => "<i></i>").join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    rb.setView({ fx: P("rx", "842"), fy: P("ry", "1580"), h: P("rh", "340"), pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0, ry: -0.42, rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] - 0.06, HF[1] - 0.12, HF[2]], hand_L: [-0.3, 0, -0.35], hand_R: [-0.3, 0, 0.35] },
      offs: { hand_L: [-0.13, 0.26, 0.06], hand_R: [0.13, 0.26, 0.06], head: [0, 0, 0] },
      face: { blink: 0, gaze: [-0.12, 0.06], happy: 1, squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.6, shadow: false });
    rb.render();
  }
  async function buildMascot() {
    const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.037, 0.034], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.037, 0.034], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [243, 186, 141], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "lidRing": 1.5, "browNy": 0.98, "headC": [0, 0.72, 0]};
    const src = await (await fetch("../compositions/mascot.html")).text();
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.6; o.color.setRGB(0.72, 0.84, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 60, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 60.05, { smooth: 1 });
    m.setView({ fx: P("mx", "330"), fy: P("my", "2010"), h: P("mh", "760"), yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    B.upperarm_R = [-2.7, 0, -0.25]; B.forearm_R = [0, 0, 0]; B.hand_R = [-0.12, 0.1, -0.12];
    B.head = [-0.08, 0.08, 0.04]; B.neck = [-0.02, 0.03, 0.02];
    m.setState({ root: { x: 0, y: 0, ry: 0.22, rz: 0, rx: 0, s: 1 }, bones: B, face: { blink: [0, 0], gaze: [-0.003, 0.006], mouthMix: 1, mouth: [0.04, 0.012, 0.005, 0.2] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, buildRobot(), buildMascot()]);
</script>
</body>
</html>

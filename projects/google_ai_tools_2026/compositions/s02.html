            tl.fromTo(c.sh, { x: 6, y: 8, scale: 0.98, opacity: 0.85 }, { x: 46, y: 58, scale: 1.55, opacity: 0.32, duration: 0.26, ease: "power2.out", immediateRender: false }, A - 0.02);
            tl.fromTo(q("#s02-sr" + i), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, A);
            tl.fromTo(ledOn[i], { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, A + 0.02);
            tl.fromTo(c.tag, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, A + 0.12 + n * 0.04);
            // "sedang" (0.81): hover; seal stamps onto the enamel face
            tl.fromTo(c.lift, { z: 124 }, { z: 140, duration: T.pensi - T.sedang, ease: "sine.inOut", immediateRender: false }, T.sedang);
            tl.fromTo(c.tilt, { rotation: d * 5 }, { rotation: d * -6, duration: T.pensi - T.sedang, ease: "sine.inOut", immediateRender: false }, T.sedang);
            tl.fromTo(c.seal, { opacity: 0, scale: 1.9, rotation: -30 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.2, ease: "back.out(2.2)", immediateRender: false }, T.sedang + 0.04 + n * 0.05);
          });
          KEEP.forEach((i, n) => {
            const c = carts[i];
            tl.fromTo(c.tag, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.32, ease: "back.out(2.2)", immediateRender: false }, A + 0.05 + n * 0.05);
            tl.fromTo(c.sheen, { x: 0 }, { x: 230, duration: 0.45, ease: "power2.inOut", immediateRender: false }, A + 0.02 + n * 0.05);
          });
          // hub status pips: two go graphite, three go bright (one tween per pip)
          TH.forEach((th, i) => tl.fromTo(R.querySelector("#s02-pip" + i), { attr: { fill: "#cbdbf4" } }, { attr: { fill: RET.includes(i) ? "#6b7077" : "#ffffff" }, duration: 0.12, ease: "none", immediateRender: false }, A + 0.02));
          tl.fromTo(q("#s02-punch"), { scale: 1, transformOrigin: "50% 54%" }, { scale: 1.04, duration: 0.1, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s02-punch"), { scale: 1.04 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, A + 0.1);
          tl.fromTo(q("#s02-flick"), { opacity: 0 }, { opacity: 0.32, duration: 0.05, ease: "none", immediateRender: false }, A - 0.02);
          tl.fromTo(q("#s02-flick"), { opacity: 0.32 }, { opacity: 0.12, duration: 0.06, ease: "none", immediateRender: false }, A + 0.03);
          tl.fromTo(q("#s02-flick"), { opacity: 0.12 }, { opacity: 0.26, duration: 0.05, ease: "none", immediateRender: false }, A + 0.09);
          tl.fromTo(q("#s02-flick"), { opacity: 0.26 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, A + 0.14);
          sparks.forEach(([sp, dx, dy], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: 0.45 + (i % 3) * 0.22, opacity: 0, rotation: 90, duration: 0.6, ease: "power3.out", immediateRender: false }, A + (i >> 1) * 0.012);
          });

          // ---- "dipensiunkan" (1.15): the two spiral up and away, trailed by fading ghost copies ----
          const P0 = T.pensi, FLY = 0.72;
          const flight = (c, o, d) => {
            const a1 = c.th + d * 42;
            tl.fromTo(c.orb, { rotation: c.th }, { rotation: a1, duration: FLY, ease: "power2.in", immediateRender: false }, P0 + o);
            tl.fromTo(c.ctr, { rotation: -c.th }, { rotation: -a1, duration: FLY, ease: "power2.in", immediateRender: false }, P0 + o);
            tl.fromTo(c.arm, { x: RS }, { x: 1180, duration: FLY, ease: "power2.in", immediateRender: false }, P0 + o);
            tl.fromTo(c.lift, { z: 140 }, { z: 500, duration: FLY, ease: "power1.in", immediateRender: false }, P0 + o);
            tl.fromTo(c.tilt, { rotation: d * -6, scale: 1 }, { rotation: d * 210, scale: 0.82, duration: FLY, ease: "power1.in", immediateRender: false }, P0 + o);
          };
          RET.forEach((i) => {
            const c = carts[i];
            flight(c, 0, DIR[i]);
            tl.fromTo(c.sh, { opacity: 0.32 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, P0);
            tl.fromTo(c.spring, { scaleY: 1, opacity: 1 }, { scaleY: 0.1, opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, P0 + 0.04);
          });
          ghosts.forEach((g) => {
            const o = g.k * 0.045, al = [0, 0.5, 0.36, 0.24, 0.14][g.k];
            flight(g, o, DIR[g.i]);
            tl.fromTo(g.tilt, { opacity: 0 }, { opacity: al, duration: 0.05, ease: "none", immediateRender: false }, P0 + o);
          });

          // keepers glow; the hub starts to turn (hand-off to the S03 turntable)
          KEEP.forEach((i, n) => {
            const c = carts[i];
            c.cled.forEach((led, k) => tl.fromTo(led, { attr: { fill: "#acc6e7" } }, { attr: { fill: k === 2 ? "#9fd8c4" : "#ffffff" }, duration: 0.1, ease: "none", immediateRender: false }, P0 + 0.1 + n * 0.04 + k * 0.03));
            tl.fromTo(c.ctr, { rotation: -c.th }, { rotation: -(c.th + SPIN_DEG), duration: DUR - T.spin, ease: "power2.in", immediateRender: false }, T.spin);
          });
          qa(".s02-en").forEach((e, i) => {
            if (!KEEP.includes(i)) return;
            tl.fromTo(e, { opacity: 1, strokeDashoffset: 26 }, { strokeDashoffset: -110, duration: 0.42, ease: "power1.inOut", immediateRender: false }, P0 + 0.05);
          });
          tl.fromTo(q("#s02-spin"), { rotation: 0 }, { rotation: SPIN_DEG, duration: DUR - T.spin, ease: "power2.in", immediateRender: false }, T.spin);
          tl.fromTo(q("#s02-coreglow"), { opacity: 0.55, scale: 0.9 }, { opacity: 0.85, scale: 1.1, duration: 0.4, ease: "power2.out", immediateRender: false }, P0);
          // seek-order safety: a backward seek first rewinds to 0, then plays forward to the target, so every frame
          // equals a clean forward render (chained fromTo tweens on one property otherwise depend on where the seek came from)
          (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>

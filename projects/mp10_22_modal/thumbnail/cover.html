<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Modal Masuk Bukan Penjualan</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's sorting line in 3D: a short conveyor with the yellow "Penjualan" token heading into the OMZET gauge board (tick),
     while "Pinjaman", "Tambahan modal" and "Uang pribadi" tokens are kicked off the belt with a coral cross. No numbers on the cover. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 0; width: 1080px; top: 380px; text-align: center; font: 800 128px/1.02 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1 .l2 { display: inline-block; margin-top: 10px; color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 82%; padding: 0 .08em; }
  #t2 { position: absolute; left: 0; width: 1080px; top: 668px; text-align: center; font: italic 400 58px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: -40px; top: 780px; width: 900px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.16), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 520px 1150px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* gauge board */
  .bd { border-radius: 26px; background: #fff; overflow: hidden; box-shadow: 0 40px 80px rgba(3,6,24,.5); }
  .bh { height: 86px; display: flex; align-items: center; justify-content: center; gap: 14px; background: #FED111; font: 800 40px/1 Rubik; letter-spacing: .06em; color: #212C5F; }
  .bh i { width: 52px; height: 52px; border-radius: 14px; background: #212C5F; display: flex; align-items: center; justify-content: center; } .bh i svg { width: 32px; height: 32px; }
  .gw { position: relative; width: 360px; height: 200px; margin: 26px auto 0; }
  .gw svg { position: absolute; inset: 0; width: 360px; height: 200px; }
  .ndl { position: absolute; left: 172px; top: 50px; width: 16px; height: 130px; background: #212C5F; clip-path: polygon(50% 0, 100% 100%, 0 100%); transform-origin: 50% 100%; transform: rotate(58deg); }
  .hub { position: absolute; left: 163px; top: 163px; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 10px #212C5F, inset 0 0 0 17px #FED111; background: #212C5F; }
  .gk { margin-top: 8px; text-align: center; font: 700 26px/1 PS; letter-spacing: .2em; color: #5B6478; }
  .gv { margin-top: 10px; text-align: center; font: 800 84px/1 Rubik; color: #212C5F; white-space: nowrap; } .gv b { color: #E0563F; font-weight: 800; }
  /* belt */
  .btop { background: #232c5f; box-shadow: inset 0 12px 0 #33468f, inset 0 -12px 0 #FED111; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 7px, rgba(255,255,255,0) 7px 60px); }
  .bfr { background-image: radial-gradient(circle at 50% 54%, #c9cfe0 0 9px, #8E99C2 10px 14px, #2b3c86 15px 19px, rgba(0,0,0,0) 20px), linear-gradient(180deg, #3a4fab 0 9px, #2e418f 9px, #1f2d6a 100%);
         background-size: 96px 100%, 100% 100%; background-repeat: repeat-x, no-repeat; box-shadow: inset 0 6px 0 #FED111; }
  .bend { background: linear-gradient(180deg, #2b3c86, #1a2558); box-shadow: inset 0 6px 0 #FED111; }
  /* tokens */
  .tok { position: absolute; width: 330px; height: 118px; border-radius: 59px; display: flex; align-items: center; gap: 14px; padding: 0 30px 0 16px; white-space: nowrap; }
  .tok.s { background: linear-gradient(180deg, #FFE440, #FED111); box-shadow: 0 10px 0 #c9a300, 0 30px 50px rgba(3,6,24,.45); }
  .tok.n { background: linear-gradient(180deg, #34489f, #26367A); box-shadow: 0 10px 0 #151f4d, 0 30px 50px rgba(3,6,24,.5); }
  .tok .coin { flex: none; width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .tok.s .coin { background: #212C5F; } .tok.n .coin { background: #fff; }
  .tok .coin svg { width: 48px; height: 48px; }
  .tok .tl { font: 700 32px/1.04 Rubik; color: #212C5F; } .tok.n .tl { color: #fff; }
  .mk { position: absolute; right: -18px; top: -24px; width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(3,6,24,.4); }
  .mk svg { width: 36px; height: 36px; }
  .mk.ok { background: #212C5F; box-shadow: 0 0 0 5px #FED111, 0 10px 22px rgba(3,6,24,.4); } .mk.no { background: #E0563F; box-shadow: 0 0 0 5px #fff, 0 10px 22px rgba(3,6,24,.4); }
  #t3 { position: absolute; left: 560px; top: 1240px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 32px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-3deg); box-shadow: 0 20px 40px rgba(3,6,24,.4); }
  #t3 i { width: 18px; height: 18px; border-radius: 50%; background: #FED111; box-shadow: 0 0 0 5px rgba(254,209,17,.3); }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">MODAL MASUK<br /><span class="l2">≠ PENJUALAN</span></div>
  <div id="t2">jangan ikut dicatat jadi omzet</div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const ICO = {
    bag: '<path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
    loan: '<path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h5"/><path d="M14 3l4 4v5"/><path d="M14 3v4h4"/><path d="M9 9h3M9 13h4"/><path d="M21 18h-6.5M17.5 15l-3 3 3 3"/>',
    modal: '<ellipse cx="9" cy="6.5" rx="5" ry="2.2"/><path d="M4 6.5v4.2c0 1.2 2.2 2.2 5 2.2s5-1 5-2.2V6.5"/><path d="M4 10.7v4.2c0 1.2 2.2 2.2 5 2.2 1.1 0 2.1-.15 2.9-.4"/><path d="M18 13v7M14.5 16.5h7"/>',
    wallet: '<path d="M4 7.5h15a1.5 1.5 0 0 1 1.5 1.5v9.5A1.5 1.5 0 0 1 19 20H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 7.5l11.5-3.5v3.5"/><path d="M20.5 11.5h-4a2 2 0 0 0 0 4h4"/>',
    ok: '<path d="M5 12.5l4.2 4.2L19 7"/>', no: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  };
  const svg = (n, c, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round">${ICO[n]}</svg>`;
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // world: floor at y = 0, camera above-front; origin placed on screen at (520, 1420)
  w.style.transform = "translate3d(520px, 1460px, -420px) rotateX(-15deg) rotateY(12deg)";
  const P = (cls, wd, ht, tr, par) => mk("div", "pl " + cls, par || w, `left:${-wd / 2}px; top:${-ht / 2}px; width:${wd}px; height:${ht}px; transform:${tr};`);
  // the gauge board (back left)
  const bd = P("bd", 420, 470, "translate3d(-300px, -470px, -300px) rotateY(-6deg)");
  const tk = [...Array(11)].map((_, i) => { const a = Math.PI * (1 - i / 10), c = Math.cos(a), s = Math.sin(a); return `<path d="M${(180 + 114 * c).toFixed(1)} ${(180 - 114 * s).toFixed(1)} L${(180 + (i % 5 ? 124 : 130) * c).toFixed(1)} ${(180 - (i % 5 ? 124 : 130) * s).toFixed(1)}" stroke="#8E99C2" stroke-width="${i % 5 ? 3 : 5}" stroke-linecap="round"/>`; }).join("");
  bd.innerHTML = `<div class="bh"><i>${svg("bag", "#FED111")}</i>PENJUALAN</div>
    <div class="gw"><svg viewBox="0 0 360 200"><path d="M36 180 A144 144 0 0 1 324 180" stroke="#E1E5EE" stroke-width="28" fill="none"/>
      <path d="M36 180 A144 144 0 0 1 324 180" stroke="#FED111" stroke-width="28" fill="none" stroke-dasharray="452.4" stroke-dashoffset="${452.4 * 0.18}"/>
      <path d="M314 86 A164 164 0 0 1 344 180" stroke="#E0563F" stroke-width="9" fill="none" stroke-linecap="round"/>${tk}</svg><i class="ndl"></i><i class="hub"></i></div>
    <div class="gk">OMZET</div><div class="gv">Rp<b>???</b></div>`;
  // a short conveyor segment (front) running toward the board
  const BL = 1500, BD = 230, BH = 96, bz = 40;
  P("btop", BL, BD, `translate3d(200px, ${-BH}px, ${bz}px) rotateX(90deg)`);
  P("bfr", BL, BH, `translate3d(200px, ${-BH / 2}px, ${bz + BD / 2}px)`);
  P("bend", BD, BH, `translate3d(${200 - BL / 2}px, ${-BH / 2}px, ${bz}px) rotateY(-90deg)`);
  // tokens: penjualan rides on the belt toward the board (tick); the other three are kicked up and away (cross)
  const tok = (cls, ico, label, mark, tr) => { const t = P("tok " + cls, 330, 118, tr); t.innerHTML = `<i class="coin">${svg(ico, cls === "s" ? "#FED111" : "#212C5F", 2.1)}</i><div class="tl">${label}</div><i class="mk ${mark}">${svg(mark, mark === "ok" ? "#FED111" : "#fff", 3.2)}</i>`; return t; };
  tok("s", "bag", "Penjualan", "ok", `translate3d(-260px, ${-BH - 59}px, ${bz}px) rotateZ(-2deg)`);
  tok("n", "loan", "Pinjaman", "no", `translate3d(250px, -640px, -120px) rotateZ(7deg) rotateY(-10deg)`);
  tok("n", "modal", "Tambahan<br />modal", "no", `translate3d(330px, -470px, -40px) rotateZ(-5deg) rotateY(-8deg)`);
  tok("n", "wallet", "Uang<br />pribadi", "no", `translate3d(200px, -310px, 40px) rotateZ(5deg) rotateY(-12deg)`);
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no title line wider than the frame margin, no token label wider than its pill
    const t1 = document.getElementById("t1"), rg = document.createRange(); rg.selectNodeContents(t1); const b = rg.getBoundingClientRect();
    if (b.left < 60 || b.right > 1020) console.log("pageerror TITLE OVERFLOW", b.left, b.right);
    document.querySelectorAll(".tok .tl").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror TOKEN OVERFLOW", e.textContent); });
    r.render({ x: 905, y: 1540, h: 640, yaw: -24, roll: 0, headYaw: -20, headPitch: -8, headRoll: 9, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 132, fwd: 28, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.3, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

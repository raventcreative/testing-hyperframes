<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}} — House Style</title>
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <style>
      /* ===== shared design kit (available to every scene sub-composition) ===== */
      :root {
        --ink: #202b3b; --navy: #294b77; --navy-2: #3a6299; --navy-deep: #1c3354;
        --ice1: #acc6e7; --ice2: #cbdbf4; --ice3: #e8f0fb; --ice4: #fbfcfe;
        --graphite: #2e2e2e; --muted: #5b6676; --paper: #fffefb;
        --shadow-lg: 0 2px 0 rgba(255,255,255,0.9) inset, 0 40px 70px -24px rgba(28,51,84,0.38), 0 10px 22px rgba(28,51,84,0.12);
        --shadow-md: 0 2px 0 rgba(255,255,255,0.9) inset, 0 22px 40px -16px rgba(28,51,84,0.32), 0 6px 14px rgba(28,51,84,0.10);
        --shadow-sm: 0 10px 20px -8px rgba(28,51,84,0.30), 0 2px 6px rgba(28,51,84,0.10);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef3fa; }
      #main-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--ink); }
      .layer { position: absolute; inset: 0; }
      .kit-card { background: linear-gradient(175deg, #ffffff, #f4f7fb); border: 2px solid rgba(41,75,119,0.10); border-radius: 26px; box-shadow: var(--shadow-lg); }
      .kit-paper { background: linear-gradient(178deg, #fffefb, #f6f4ee); border: 1px solid rgba(46,46,46,0.08); box-shadow: var(--shadow-md); }
      .kit-glass { background: linear-gradient(140deg, rgba(255,255,255,0.92), rgba(214,228,247,0.78)); border: 2px solid rgba(255,255,255,0.95);
        box-shadow: inset 0 0 40px rgba(255,255,255,0.8), 0 30px 60px -20px rgba(28,51,84,0.35); }
      .kit-navy { background: linear-gradient(135deg, #3a6299, #294b77 55%, #1f3a5f); color: #fbfcfe; box-shadow: var(--shadow-md); }
      .kit-contact { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(28,51,84,0.45), rgba(28,51,84,0.14) 45%, rgba(28,51,84,0) 72%); }
      .kit-mono { font-family: "IBM Plex Mono", monospace; letter-spacing: 0.06em; }
      .kit-line { display: block; height: 12px; border-radius: 6px; background: #c9d4e3; }

      /* ===== BG ===== */
      #bg .plate { position: absolute; inset: 0; background: url(assets/brand/pastel_background_1080x1920.png) center / cover no-repeat; }
      #bg .grid { position: absolute; inset: -60px;
        background: repeating-linear-gradient(90deg, rgba(41,75,119,0.055) 0 1px, transparent 1px 54px), repeating-linear-gradient(0deg, rgba(41,75,119,0.055) 0 1px, transparent 1px 54px);
        -webkit-mask-image: radial-gradient(ellipse 75% 60% at 50% 52%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 75% 60% at 50% 52%, #000 30%, transparent 85%); }
      .haze { position: absolute; border-radius: 50%; }
      #haze-a { left: -260px; top: -120px; width: 900px; height: 900px; background: radial-gradient(circle, rgba(172,198,231,0.5), rgba(172,198,231,0) 68%); }
      #haze-b { left: 420px; top: 1240px; width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(203,219,244,0.55), rgba(203,219,244,0) 68%); }
      #haze-c { left: 140px; top: 560px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0) 66%); }
      #grain { position: absolute; left: -64px; top: -64px; width: 1208px; height: 2048px; background: url(assets/brand/grain_256.png); opacity: 0.5; }
      .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffffff, rgba(203,219,244,0.75) 60%, rgba(172,198,231,0.2)); box-shadow: 0 0 10px rgba(255,255,255,0.8); }

      /* ===== caption (small, word-synced; visuals carry the story) ===== */
      .cap { position: absolute; left: 70px; right: 70px; top: 232px; text-align: center; font: 700 46px/1.22 Montserrat, sans-serif; color: var(--ink); letter-spacing: -0.01em; }
      .cap .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.06em 0.14em; margin: -0.04em -0.06em -0.14em; }
      .cap .w { display: inline-block; }
      .cap .key { color: var(--navy); background: linear-gradient(transparent 62%, rgba(172,198,231,0.75) 62%, rgba(172,198,231,0.75) 92%, transparent 92%); }
    </style>
  </head>
  <body>
    <div id="main-root" data-composition-id="main" data-start="0" data-duration="{{TOTAL_SEC}}" data-width="1080" data-height="1920">
      <div id="bg" class="clip layer" data-start="0" data-duration="{{TOTAL_SEC}}" data-track-index="0">
        <div class="plate"></div>
        <div class="grid" id="bggrid"></div>
        <div id="haze-a" class="haze"></div>
        <div id="haze-b" class="haze"></div>
        <div id="haze-c" class="haze"></div>
        <div id="motes"></div>
        <div id="grain"></div>
      </div>

      <!-- SCENE SLOTS: one sub-composition per spoken phrase (0.8–5.5 s each, avg ~2.6 s).
           Copy compositions/_scene_template.html to compositions/sNN.html for each slot.
           data-start/data-duration are GLOBAL seconds; cut on phrase boundaries from the verified transcript.
           Alternate data-track-index 2/3/4 so Studio lanes stay readable. -->
      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="{{S01_DUR}}" data-track-index="2" data-width="1080" data-height="1920"></div>

      <div id="caps" class="clip layer" data-start="0" data-duration="{{TOTAL_SEC}}" data-track-index="7"></div>

      <audio id="vo" src="assets/audio/{{VO_FILE}}" data-start="0" data-duration="{{VO_SEC}}" data-track-index="9" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const S = (t, v, at) => tl.set(t, v, at || 0);
        const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };

        // VERIFIED transcript words: [displayText, startSeconds]. Fill from the reviewed transcript
        // (word starts anchored to verified pauses). Only spoken words may appear on screen.
        const W = [
          ["{{WORD_1}}", 0.10], ["{{WORD_2}}", 0.42]
        ];
        // one caption per scene: [start, end, firstWordIndex, lastWordIndex, [keyWordIndexes]]
        // key words = navy + ice highlighter. Keep a caption to 1–2 lines (46 px).
        const CAPS = [
          [0, {{S01_DUR}}, 0, 1, [1]],
        ];
        const capRoot = document.getElementById("caps");
        CAPS.forEach(([s, e, a, b, keys], ci) => {
          const c = mk("div", "cap clip", capRoot);
          c.id = "cap" + ci;
          c.setAttribute("data-start", s); c.setAttribute("data-duration", (e - s).toFixed(3)); c.setAttribute("data-track-index", 8);
          for (let i = a; i <= b; i++) {
            const m = mk("span", "m", c);
            const w = mk("span", "w" + (keys.includes(i) ? " key" : ""), m, W[i][0]);
            if (i < b) c.appendChild(document.createTextNode(" "));
            const t = Math.max(s + 0.02, W[i][1] - 0.08);
            S(w, { yPercent: 110, opacity: 0 });
            tl.set(w, { opacity: 1 }, t);
            tl.to(w, { yPercent: 0, duration: 0.34, ease: "power4.out" }, t);
          }
        });

        // ambient BG (seeded, seekable)
        let seed = 20261021;
        const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        for (let i = 0; i < 22; i++) {
          const m = mk("div", "mote", document.getElementById("motes"));
          const sz = 4 + rnd() * 9;
          m.style.cssText += `width:${sz}px;height:${sz}px;left:${rnd() * 1080}px;top:${300 + rnd() * 1500}px;`;
          S(m, { opacity: 0.3 + rnd() * 0.45 });
          tl.to(m, { y: -(120 + rnd() * 240), duration: {{TOTAL_SEC}}, ease: "none" }, 0);
        }
        tl.to("#haze-a", { x: 70, y: 60, duration: {{TOTAL_SEC_HALF}}, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
        tl.to("#haze-b", { x: -90, y: -50, duration: {{TOTAL_SEC_HALF}}, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
        tl.to("#bggrid", { x: 27, y: 27, duration: {{TOTAL_SEC}}, ease: "none" }, 0);
        tl.to("#grain", { x: 64, y: 40, duration: {{TOTAL_SEC}}, ease: "steps({{TOTAL_SEC_X10}})" }, 0);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>

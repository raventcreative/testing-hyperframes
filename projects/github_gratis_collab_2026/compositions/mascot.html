      // AI PRENEUR chibi businessman (mascot_biz_rigged.glb), live WebGL.
      // OPENING (0 – 2.0 s, no VO): back to camera while the 4 logos pop -> turns to the front ->
      // stands up -> turns to look back at the 4 paid tools -> turns forward as they come forward -> steps in to half body.
      // Then he presents every round (half body, bottom of frame, below the caption band).

      const { buildPerformance, buildLipTrack, syllableAccents, vnoise, bump, REST } = M3;

      const one = (x) => Math.max(0, Math.min(1, x));
      const sm = (u) => { u = one(u); return u * u * (3 - 2 * u); };
      const e3 = (u) => { u = one(u); return 1 - Math.pow(1 - u, 3); };
      const io3 = (u) => { u = one(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const L = (a, b, u) => a + (b - a) * u;
      const add = (...ds) => { const o = {}; for (const d of ds) for (const [k, v] of Object.entries(d || {})) { const a = o[k] || [0, 0, 0]; o[k] = [a[0] + v[0], a[1] + v[1], a[2] + v[2]]; } return o; };
      const mixP = (a, b, u) => { const o = {}; const ks = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]); for (const k of ks) { const x = (a && a[k]) || [0, 0, 0], y = (b && b[k]) || [0, 0, 0]; o[k] = [L(x[0], y[0], u), L(x[1], y[1], u), L(x[2], y[2], u)]; } return o; };
      const scl = (a, k) => { const o = {}; for (const [n, v] of Object.entries(a)) o[n] = [v[0] * k, v[1] * k, v[2] * k]; return o; };
      const S = (id) => SC.find((s) => s.id === id);

      const ssm = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * u * (u * (u * 6 - 15) + 10); };
      const VO_SC = (id) => window.VO_SCENES.find((s) => s.id === id);
      const VO_NEXT = (id) => { const i = window.VO_SCENES.findIndex((s) => s.id === id); return window.VO_SCENES[i + 1]; };

      // ---- TAG-TEAM STAGING: the speaker is in front (half body, sharp); the partner stays behind (smaller, depth-of-field blur)

      const ROBOT_TURNS = ["s06", "s09", "s12", "s15"].map((id) => { const a = VO_SC(id); const b = VO_NEXT(id); return [a.start, b ? b.start : a.start + a.dur]; });

      const PERF = buildPerformance(DIR.tracks, D + 0.05, { smooth: 1 });

        s04: { fx: 430, fy: 2235, h: 1120, pitch: 4 }, s05: HALF, s06: HALF,

      function presView(t) {

          const d = rf, f = d > 0.01 ? `blur(${(3.2 * d).toFixed(2)}px)` : "none";
          if (canvas.style.filter !== f) canvas.style.filter = f;
          const o = String(1 - 0.08 * d); if (canvas.style.opacity !== o) canvas.style.opacity = o;
          setZ("mascot", rf > 0.5 ? 5 : 7);
        }
        if (mascot.shadow) mascot.shadow.visible = shadow;

        mascot.setState({ root, bones, face: { blink: [blink, blink], gaze: [gz[0] * (1 - lg), gz[1] * (1 - lg)], mouthMix: 1, mouth, brow } });
        mascot.render();
      }

<template>

  <div id="root" data-composition-id="s01" data-width="1080" data-height="1920">

  <script>
    (function () {
      const D = 4.3333;
      const root = document.querySelector('[data-composition-id="s01"]');
      const $ = (id) => root.querySelector("#" + id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      let seed = 4101;
      const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

      // ---------------- WHITE WORLD: landing ----------------
      const LAND = 0.18;
      tl.set($("s01-pool"), { opacity: 0.5, scaleX: 0.75 }, 0);
      ft($("s01-pool"), { opacity: 0.5, scaleX: 0.75 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.05);
      tl.set($("s01-ring"), { opacity: 0, scale: 0.3 }, 0);
      ft($("s01-ring"), { opacity: 0.95, scale: 0.3 }, { opacity: 0, scale: 2.3, duration: 0.62, ease: "power3.out" }, LAND);
      const dusts = $("s01-dusts");
      for (let i = 0; i < 9; i++) {
        const d = document.createElement("div"); d.className = "s01-abs s01-dust"; dusts.appendChild(d);
        const side = i % 2 ? 1 : -1, w = 70 + rnd() * 70;
        d.style.cssText += `left:${540 - w / 2 + side * (40 + rnd() * 60)}px;top:${1480 - w * 0.35 + rnd() * 20}px;width:${w}px;height:${w * 0.72}px;`;
        tl.set(d, { opacity: 0, scale: 0.4, x: 0, y: 0 }, 0);
        ft(d, { opacity: 0.95, scale: 0.4, x: 0, y: 0 }, { opacity: 0, scale: 1.4 + rnd(), x: side * (120 + rnd() * 160), y: -(20 + rnd() * 70), duration: 0.75 + rnd() * 0.3, ease: "power3.out" }, LAND + rnd() * 0.04);
      }
      // impact: the whole set shakes a hair
      [[0, 0], [7, -5], [-6, 4], [4, -2], [-2, 1], [0, 0]].forEach((p, k, a) => { if (k) ft(root, { x: a[k - 1][0], y: a[k - 1][1] }, { x: p[0], y: p[1], duration: 0.045, ease: "none" }, LAND + (k - 1) * 0.045); });

      // ---------------- the 4 paid tools rise behind him ----------------
      // end layout (shared with s02): centres x 195/425/655/885, y 640
      const TOOLS = [
        ["higgsfield", "Higgsfield", "300", 1.18], ["elevenlabs", "ElevenLabs", "350", 1.31],
        ["midjourney", "Midjourney", "500", 1.59], ["openai", "ChatGPT Plus", "330", 1.81],
      ];
      const X = [195, 425, 655, 885], Y = 640;
      const ARC = [[250, 722, -10], [430, 636, -4], [650, 636, 4], [830, 722, 10]];
      const tiles = $("s01-tiles");
      TOOLS.forEach(([f, nm, pr, t0], i) => {
        const w = document.createElement("div"); w.className = "s01-abs s01-t"; w.style.left = X[i] + "px"; w.style.top = Y + "px";
        w.innerHTML = `<div class="s01-abs s01-ic" style="background-image:url(assets/logos/${f}.png)"></div><div class="s01-abs s01-nm">${nm}</div><div class="s01-abs s01-pr"><b>Rp${pr}rb</b><i>/bln</i></div>`;
        tiles.appendChild(w);
        const nmE = w.children[1], prE = w.children[2];
        const ax = ARC[i][0] - X[i], ay = ARC[i][1] - Y, ar = ARC[i][2];
        tl.set(w, { x: 540 - X[i], y: 1220 - Y, scale: 0.3, rotation: 0, opacity: 0, filter: "blur(10px)" }, 0);
        // rise (on "4 / tools / AI / ini")
        ft(w, { x: 540 - X[i], y: 1220 - Y, scale: 0.3, rotation: 0, opacity: 0, filter: "blur(10px)" },
              { x: ax, y: ay, scale: 0.86, rotation: ar, opacity: 1, filter: "blur(0px)", duration: 0.62, ease: "back.out(1.5)" }, t0 - 0.12);
        // gentle float while he looks at them
        tl.set(w, { filter: "none" }, t0 + 0.5);
        ft(w, { x: ax, y: ay, scale: 0.86, rotation: ar }, { x: ax, y: ay - 14, scale: 0.86, rotation: ar * 0.6, duration: 3.41 - (t0 + 0.5), ease: "sine.inOut" }, t0 + 0.5);
        // "sebulan?": the logos come forward into a row
        ft(w, { x: ax, y: ay - 14, scale: 0.86, rotation: ar * 0.6 }, { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.7, ease: "power4.inOut" }, 3.41 + i * 0.04);
        // price tags on "sampai"
        tl.set([nmE, prE], { opacity: 0, y: 14 }, 0);
        ft(nmE, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.05 + i * 0.07);
        ft(prE, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "back.out(2.2)" }, 2.11 + i * 0.07);
      });

      const cnt = { v: 0 };

      ft(tot, { scale: 1 }, { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 3.09);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s01"] = tl;
    })();

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Uang Pribadi vs Uang Usaha</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     The film's hero object: the glass coin jar, split by the light blade — usaha coins (yellow) left, pribadi coins (grey) right. No numbers on the cover. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 386px; font: 800 132px/1 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1b { position: absolute; left: 70px; top: 530px; font: 800 132px/1 Rubik; letter-spacing: -4px; white-space: nowrap; }
  #t1b i { font: italic 400 96px/1 PF; letter-spacing: 0; color: #DDE1EE; margin-right: 20px; }
  #t1b span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 702px; font: italic 400 70px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #t3 { position: absolute; left: 80px; top: 806px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px; background: #fff; font: 700 34px/1 PS; color: #212C5F; white-space: nowrap; }
  #t3 svg { width: 32px; height: 32px; }
  /* the split jar */
  #jarS { position: absolute; left: 112px; top: 1000px; width: 480px; height: 600px; }
  .half { position: absolute; top: -20px; width: 252px; height: 640px; overflow: hidden; }
  .half > .in { position: absolute; top: 20px; width: 480px; height: 600px; }
  .half.L { left: -12px; transform: translateX(-30px) rotate(-3.5deg); transform-origin: 100% 100%; } .half.L > .in { left: 12px; }
  .half.R { left: 240px; transform: translateX(30px) rotate(3.5deg); transform-origin: 0% 100%; } .half.R > .in { left: -240px; }
  .lid { position: absolute; left: -12px; top: 0; width: 504px; height: 84px; border-radius: 28px;
         background: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 4px, transparent 4px 12px), linear-gradient(180deg, #4a5fbe 0%, #2a3a86 55%, #1c2861 100%);
         box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -6px 0 rgba(0,0,0,.2), 0 10px 20px rgba(3,6,24,.35); }
  .lid::after { content: ""; position: absolute; left: 0; right: 0; top: 22px; height: 4px; background: rgba(254,209,17,.6); }
  .body { position: absolute; left: 0; top: 74px; width: 480px; height: 526px; border-radius: 46px 46px 96px 96px; clip-path: inset(0 round 46px 46px 96px 96px);
          background: linear-gradient(90deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 18%, rgba(255,255,255,.04) 60%, rgba(255,255,255,.16) 92%, rgba(255,255,255,.26) 100%);
          border: 5px solid rgba(221,225,238,.42); }
  .jsh { position: absolute; left: 40px; top: 560px; width: 400px; height: 70px; border-radius: 50%; background: radial-gradient(closest-side, rgba(3,6,24,.45), rgba(3,6,24,0)); }
  .body .hi { position: absolute; top: 40px; bottom: 60px; width: 22px; border-radius: 11px; background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.08)); }
  .cn { position: absolute; width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .cn svg { width: 46px; height: 46px; }
  .cn.u { background: radial-gradient(circle at 34% 30%, #FFF6B8 0%, #FFE04A 30%, #FED111 55%, #DDAE00 100%); box-shadow: inset 0 0 0 6px #E9BA00, inset 0 0 0 9px #FFE66A, 0 7px 0 #B98E00, 0 14px 22px rgba(3,6,24,.4); }
  .cn.p { background: radial-gradient(circle at 34% 30%, #FFFFFF 0%, #E8EBF2 35%, #CCD2DE 62%, #A3ABBE 100%); box-shadow: inset 0 0 0 6px #AEB5C6, inset 0 0 0 9px #F1F3F7, 0 7px 0 #7f879c, 0 14px 22px rgba(3,6,24,.4); }
  #blade { position: absolute; left: 345px; top: 900px; width: 14px; height: 760px; border-radius: 7px; background: linear-gradient(180deg, rgba(255,228,64,0), #FFE440 10%, #fff 50%, #FFE440 90%, rgba(255,228,64,0));
           box-shadow: 0 0 30px 12px rgba(254,209,17,.55), 0 0 70px 24px rgba(254,209,17,.2); }
  .tagL { position: absolute; padding: 12px 22px; border-radius: 999px; font: 700 30px/1 PS; white-space: nowrap; box-shadow: 0 14px 30px rgba(3,6,24,.4); display: flex; align-items: center; gap: 10px; }
  .tagL i { width: 26px; height: 26px; border-radius: 50%; }
  #tgU { left: 70px; top: 948px; background: #FED111; color: #212C5F; transform: rotate(-4deg); }
  #tgU i { background: #212C5F; }
  #tgP { left: 420px; top: 948px; background: #fff; color: #4b536a; transform: rotate(3deg); }
  #tgP i { background: #A3ABBE; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">Uang pribadi</div>
  <div id="t1b"><i>vs</i><span>uang usaha</span></div>
  <div id="t2">jangan dicampur.</div>
  <div id="t3">Pisahin dulu catatannya<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div id="blade"></div>
  <div id="jarS"></div>
  <div class="tagL" id="tgU"><i></i>usaha</div>
  <div class="tagL" id="tgP"><i></i>pribadi</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const NS = (d, col) => '<svg viewBox="0 0 24 24" fill="none" stroke="' + col + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' + d + "</svg>";
  const BAG = NS('<path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>', "#212C5F");
  const HOME = NS('<path d="M4 11.5L12 5l8 6.5"/><path d="M6.5 10v9.5h11V10"/>', "#5B6478");
  const coinHTML = (k, x, y, r) => '<div class="cn ' + k + '" style="left:' + x + 'px; top:' + y + 'px; transform:rotate(' + r + 'deg)">' + (k === "u" ? BAG : HOME) + "</div>";
  // the pile inside the jar: usaha coins on the left half, pribadi on the right half (each half is a clipped copy of the same jar)
  // drawn as one inline SVG (robust in software GL): two clipped copies of the jar, rotated apart about the bottom centre
  const ICB = '<path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>', ICH = '<path d="M4 11.5L12 5l8 6.5"/><path d="M6.5 10v9.5h11V10"/>';
  const svgCoin = (k, cx, cy, r) => `<g transform="rotate(${r} ${cx} ${cy})"><circle cx="${cx}" cy="${cy + 7}" r="48" fill="${k === "u" ? "#B98E00" : "#7f879c"}"/>` +
    `<circle cx="${cx}" cy="${cy}" r="45" fill="url(#g${k})" stroke="${k === "u" ? "#E9BA00" : "#AEB5C6"}" stroke-width="6"/><circle cx="${cx}" cy="${cy}" r="38" fill="none" stroke="${k === "u" ? "#FFE66A" : "#F1F3F7"}" stroke-width="3"/>` +
    `<g transform="translate(${cx - 23} ${cy - 23}) scale(1.92)" fill="none" stroke="${k === "u" ? "#212C5F" : "#5B6478"}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${k === "u" ? ICB : ICH}</g></g>`;
  const X0 = 60, Y0 = 90, X1 = 540, Y1 = 616;
  const body = `M${X0 + 46} ${Y0} H${X1 - 46} A46 46 0 0 1 ${X1} ${Y0 + 46} V${Y1 - 96} A96 96 0 0 1 ${X1 - 96} ${Y1} H${X0 + 96} A96 96 0 0 1 ${X0} ${Y1 - 96} V${Y0 + 46} A46 46 0 0 1 ${X0 + 46} ${Y0} Z`;
  const pileOf = (k) => { let s = "";
    [[540, 8], [478, 7], [416, 7], [356, 6]].forEach(([y, n], r) => { for (let i = 0; i < n; i++) { const x = X0 + 50 + i * (380 / (n - 1)) + (r % 2 ? 18 : 0) + ((i * 37 + r * 11) % 14) - 7;
      s += svgCoin(k, x, y + ((i * 13 + r * 7) % 16) - 8, ((i * 47 + r * 31) % 50) - 25); } }); return s; };
  const jarOf = (k) => `<g clip-path="url(#jb)"><path d="${body}" fill="url(#gg)"/>${pileOf(k)}<rect x="${X0 + 30}" y="${Y0 + 40}" width="22" height="400" rx="11" fill="url(#gh)"/><rect x="${X1 - 64}" y="${Y0 + 50}" width="12" height="330" rx="6" fill="url(#gh)" opacity=".6"/></g>` +
    `<path d="${body}" fill="none" stroke="rgba(221,225,238,.5)" stroke-width="6"/>` +
    `<rect x="${X0 - 12}" y="16" width="${X1 - X0 + 24}" height="84" rx="28" fill="url(#gl)"/><rect x="${X0 - 12}" y="16" width="${X1 - X0 + 24}" height="84" rx="28" fill="url(#rib)"/><rect x="${X0 - 12}" y="38" width="${X1 - X0 + 24}" height="4" fill="rgba(254,209,17,.65)"/>`;
  document.getElementById("jarS").innerHTML = '<div class="jsh"></div><svg width="600" height="700" viewBox="0 0 600 700" style="position:absolute; left:-60px; top:-20px; overflow:visible">' +
    '<defs><radialGradient id="gu" cx=".34" cy=".3" r=".75"><stop offset="0" stop-color="#FFF6B8"/><stop offset=".3" stop-color="#FFE04A"/><stop offset=".55" stop-color="#FED111"/><stop offset="1" stop-color="#DDAE00"/></radialGradient>' +
    '<radialGradient id="gp" cx=".34" cy=".3" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#E8EBF2"/><stop offset=".62" stop-color="#CCD2DE"/><stop offset="1" stop-color="#A3ABBE"/></radialGradient>' +
    '<linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".18" stop-color="#fff" stop-opacity=".07"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset=".92" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".28"/></linearGradient>' +
    '<linearGradient id="gh" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>' +
    '<linearGradient id="gl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4a5fbe"/><stop offset=".55" stop-color="#2a3a86"/><stop offset="1" stop-color="#1c2861"/></linearGradient>' +
    '<pattern id="rib" width="12" height="84" patternUnits="userSpaceOnUse"><rect width="4" height="84" fill="rgba(255,255,255,.08)"/></pattern>' +
    `<clipPath id="jb"><path d="${body}"/></clipPath><clipPath id="cL"><rect x="-100" y="-100" width="400" height="900"/></clipPath><clipPath id="cR"><rect x="300" y="-100" width="400" height="900"/></clipPath></defs>` +
    `<g transform="translate(-30 0) rotate(-3.5 300 ${Y1})"><g clip-path="url(#cL)">${jarOf("u")}</g></g><g transform="translate(30 0) rotate(3.5 300 ${Y1})"><g clip-path="url(#cR)">${jarOf("p")}</g></g></svg>` +
    coinHTML("u", -60, 160, -18) + coinHTML("u", 40, 40, 12) + coinHTML("p", 420, 30, 20) + coinHTML("p", 520, 170, -10);
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: 868, y: 1640, h: 700, yaw: -22, roll: 0, headYaw: -16, headPitch: -6, headRoll: 6, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14, bendYaw: 0 }, aR: { raise: 172, fwd: 10, bend: 15, bendYaw: 0 },
      face: { blink: 0.25, lookX: -0.9, lookY: 0.3, happy: 0, smile: 0, o: 0.55 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

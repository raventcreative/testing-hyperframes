<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Sebelum vs Sesudah</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Split frame like the video's slider rig:
     SEBELUM (paper, three files that never match) | SESUDAH (navy, one clear laporan laba rugi). The robot (rendered live with the
     project runtime) holds the divider knob. Numbers carry "Ilustrasi data", the report UI "Simulasi alur". -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .half { position: absolute; top: 0; height: 1920px; overflow: hidden; }
  #L { left: 0; width: 520px; background: radial-gradient(ellipse 700px 1100px at 60% 38%, #ffffff 0%, #F6F7FB 55%, #E3E7F1 100%); }
  #R { left: 520px; width: 560px; background: radial-gradient(ellipse 760px 1150px at 40% 38%, #2c3c88 0%, #212C5F 55%, #151d48 100%); }
  .persp { position: absolute; inset: 0; perspective: 1200px; perspective-origin: 50% 900px; }
  .floor { position: absolute; left: -900px; top: -1400px; width: 2400px; height: 3320px; transform-origin: 50% 100%; transform: rotateX(62deg); }
  #L .floor { background-image: linear-gradient(90deg, rgba(33,44,95,.11) 0 2px, transparent 2px), linear-gradient(0deg, rgba(33,44,95,.11) 0 2px, transparent 2px); background-size: 90px 90px;
    -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 30%, transparent 78%); mask-image: linear-gradient(0deg, #000 0%, #000 30%, transparent 78%); }
  #R .floor { background-image: linear-gradient(90deg, rgba(255,255,255,.10) 0 2px, transparent 2px), linear-gradient(0deg, rgba(255,255,255,.10) 0 2px, transparent 2px); background-size: 108px 108px;
    -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 30%, transparent 78%); mask-image: linear-gradient(0deg, #000 0%, #000 30%, transparent 78%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 296px; display: flex; justify-content: center; }
  #lock span { display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 28px 0 18px; border-radius: 999px; background: #212C5F; font: 700 32px/1 Rubik; color: #fff; box-shadow: 0 12px 30px rgba(19,27,64,.35); }
  #lock img { height: 36px; } #lock em { font-style: normal; white-space: nowrap; } #lock b { color: #FED111; font-weight: 700; }
  .big { position: absolute; top: 410px; font: 800 104px/1 Rubik; letter-spacing: -2px; white-space: nowrap; }
  #bL { left: 44px; color: #212C5F; } #bR { left: 584px; color: #FED111; }
  .sub { position: absolute; top: 528px; font: italic 400 50px/1 PF; white-space: nowrap; }
  #sL { left: 54px; color: #5B6478; } #sR { left: 588px; color: #DDE1EE; }
  .win { position: absolute; width: 400px; border-radius: 18px; background: #fff; overflow: hidden; box-shadow: 0 26px 46px rgba(19,27,64,.22), 0 4px 10px rgba(19,27,64,.1); }
  .win .bar { height: 42px; display: flex; align-items: center; gap: 7px; padding: 0 16px; background: #EDEFF5; font: 600 19px/1 PS; color: #5B6478; white-space: nowrap; }
  .win .bar i { width: 10px; height: 10px; border-radius: 50%; background: #C9CFDF; flex: none; }
  .win .bar em { font-style: normal; margin-left: 6px; }
  .win .sum { display: flex; justify-content: space-between; align-items: center; height: 66px; padding: 0 18px; }
  .win .sum span { font: 700 16px/1 PS; letter-spacing: .08em; color: #8E99C2; white-space: nowrap; }
  .win .sum b { font: 800 34px/1 Rubik; color: #161D3A; white-space: nowrap; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 2%, #FFE440 98%, rgba(255,228,64,0) 100%) no-repeat 0 88% / 100% 70%; padding: 0 .08em; }
  .neq { position: absolute; right: 12px; top: 5px; width: 34px; height: 34px; border-radius: 50%; background: #FED111; color: #212C5F; font: 800 26px/34px Rubik; text-align: center; }
  #w1 { left: 40px; top: 660px; transform: rotate(-5deg); } #w2 { left: 70px; top: 800px; transform: rotate(3deg); } #w3 { left: 30px; top: 940px; transform: rotate(-2deg); }
  .qm { position: absolute; font: 800 150px/1 Rubik; color: #212C5F; }
  .lbl { position: absolute; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 9px; font: 700 17px/1 PS; letter-spacing: .1em; white-space: nowrap; }
  .lbl i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  #lbL { left: 50px; top: 1100px; background: rgba(255,255,255,.92); color: #5B6478; box-shadow: 0 6px 16px rgba(19,27,64,.1); }
  #rep { position: absolute; left: 580px; top: 650px; width: 440px; border-radius: 26px; background: #fff; padding: 22px 26px 18px; box-shadow: 0 36px 70px rgba(3,6,24,.55); transform: perspective(1200px) rotateY(-10deg) rotateX(6deg); }
  #rep .rt { display: flex; align-items: center; gap: 14px; font: 700 30px/1 Rubik; color: #212C5F; white-space: nowrap; padding-bottom: 14px; border-bottom: 2px solid #EDEFF5; }
  #rep .rt i { width: 52px; height: 52px; border-radius: 14px; background: #212C5F; display: flex; align-items: center; justify-content: center; }
  #rep .rt svg { width: 30px; height: 30px; }
  #rep .rr { display: flex; justify-content: space-between; align-items: center; height: 52px; border-bottom: 2px solid #F1F3F8; font: 600 22px/1 PS; color: #5B6478; white-space: nowrap; }
  #rep .rr b { font: 700 23px/1 PS; color: #161D3A; }
  #rep .lb { height: 74px; border-bottom: 0; } #rep .lb span { font: 800 30px/1 Rubik; color: #212C5F; }
  #rep .lb b { font: 800 36px/1 Rubik; color: #212C5F; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 2%, #FFE440 98%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 72%; padding: 2px .1em; }
  #rep .rf { margin-top: 6px; font: 700 15px/1 PS; letter-spacing: .1em; color: #8E99C2; white-space: nowrap; }
  #ok { position: absolute; left: 930px; top: 610px; width: 70px; height: 70px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(254,209,17,.35); }
  #ok svg { width: 40px; height: 40px; }
  #dvd { position: absolute; left: 516px; top: 0; width: 8px; height: 1920px; background: #FED111; box-shadow: 0 0 24px rgba(254,209,17,.85), 0 0 70px rgba(254,209,17,.35); }
  #vs { position: absolute; left: 470px; top: 600px; width: 100px; height: 100px; border-radius: 50%; background: #FED111; font: 800 40px/100px Rubik; color: #212C5F; text-align: center; box-shadow: 0 0 0 10px rgba(254,209,17,.25), 0 16px 30px rgba(19,27,64,.35); }
  #knob { position: absolute; width: 104px; height: 104px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 9px rgba(254,209,17,.28), 0 16px 30px rgba(19,27,64,.38); }
  #knob svg { width: 64px; height: 36px; }
  #cta { position: absolute; left: 50px; top: 1450px; display: inline-flex; align-items: center; gap: 12px; height: 74px; padding: 0 30px; border-radius: 999px; background: #212C5F; color: #fff; font: 700 32px/1 PS; white-space: nowrap; box-shadow: 0 14px 30px rgba(19,27,64,.3); }
  #cta svg { width: 30px; height: 30px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="half" id="L"><div class="persp"><div class="floor"></div></div></div>
  <div class="half" id="R"><div class="persp"><div class="floor"></div></div></div>
  <div id="dvd"></div>
  <div id="lock"><span><img src="../assets/mp/mp_m_reverse.png" alt="" /><em>Master<b>Pajak AI</b></em></span></div>
  <div class="big" id="bL">SEBELUM</div><div class="big" id="bR">SESUDAH</div>
  <div class="sub" id="sL">nebak-nebak…</div><div class="sub" id="sR">jelas.</div>
  <div class="win" id="w1"><div class="bar"><i></i><i></i><i></i><em>rekap_manual.xlsx</em><span class="neq">≠</span></div><div class="sum"><span>TOTAL</span><b>Rp47.180.000</b></div></div>
  <div class="win" id="w2"><div class="bar"><i></i><i></i><i></i><em>pesanan_toko.csv</em><span class="neq">≠</span></div><div class="sum"><span>TOTAL</span><b>Rp48.250.000</b></div></div>
  <div class="win" id="w3"><div class="bar"><i></i><i></i><i></i><em>mutasi_bank.pdf</em><span class="neq">≠</span></div><div class="sum"><span>MASUK</span><b>Rp44.730.000</b></div></div>
  <div class="qm" style="left: 380px; top: 1000px; transform: rotate(12deg); color: #FED111">?</div>
  <div class="lbl" id="lbL"><i></i>ILUSTRASI DATA</div>
  <div id="rep">
    <div class="rt"><i><svg viewBox="0 0 24 24" fill="none" stroke="#FED111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z" /><path d="M14 3v5h5M9 13h7M9 17h5" /></svg></i>Laporan Laba Rugi</div>
    <div class="rr"><span>Penjualan</span><b>Rp48.250.000</b></div>
    <div class="rr"><span>Biaya</span><b>−Rp37.390.000</b></div>
    <div class="rr lb"><span>Laba</span><b>Rp10.860.000</b></div>
    <div class="rf">ILUSTRASI DATA · SIMULASI ALUR</div>
  </div>
  <div id="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#212C5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
  <div id="vs">VS</div>
  <div id="knob"><svg viewBox="0 0 70 40"><path d="M24 8L12 20l12 12M46 8l12 12-12 12" fill="none" stroke="#212C5F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
  <div id="cta">Lihat bedanya<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  // robot on the SESUDAH side, its screen-left hand on the divider knob (same pose + hand offset as the video's slider rig)
  const RX = 860, RY = 1440, RH = 640, HX = Math.round(RX - RH * (0.502 - 0.000025 * Math.abs(RX - 540))), HY = RY + 0.009 * RH;
  const $ = (s) => document.getElementById(s);
  $("knob").style.left = (HX - 52) + "px"; $("knob").style.top = (HY - 52) + "px";
  $("dvd").style.left = (HX - 4) + "px"; $("vs").style.left = (HX - 50) + "px";
  $("L").style.width = HX + "px"; $("R").style.left = HX + "px"; $("R").style.width = (1080 - HX) + "px";
  $("bR").style.left = (HX + 40) + "px"; $("sR").style.left = (HX + 44) + "px"; $("rep").style.left = (HX + 34) + "px";
  document.fonts.ready.then(() => {
    // the two big words: same size, the largest that fits both halves with 40 px margins (never touching the divider or the edge)
    let fs = 104; const fits = () => $("bL").offsetWidth <= HX - 40 - 44 && $("bR").offsetWidth <= 1080 - HX - 40 - 50;
    while (!fits() && fs > 60) { fs -= 1; $("bL").style.fontSize = $("bR").style.fontSize = fs + "px"; }
    return 1;
  }).then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: RX, y: RY, h: RH, yaw: 20, roll: 0, headYaw: -18, headPitch: -6, headRoll: 6, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14, bendYaw: 0 }, aR: { raise: 115, fwd: -20, bend: 5, bendYaw: 0 },
      face: { blink: 0, lookX: -0.6, lookY: 0.2, happy: 1, smile: 1 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

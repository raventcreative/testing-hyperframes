    <script>
      window.__timelines = window.__timelines || {};
      // Per-word headline animation: give EACH word its own .k-hl (gradient text), then call
      // window.__kitAlign(fieldEl) once at build — it offsets every word's gradient so the whole block
      // still reads as one #00c9ff→#294b77 field (opacity/blur on a child of a single .k-hl does not hide it).
      window.__kitAlign = function (field) {
        if (!field) return;
        const run = () => field.querySelectorAll(".k-hl").forEach((el) => {
          let x = 0, n = el;
          while (n && n !== field) { x += n.offsetLeft || 0; n = n.offsetParent; if (n && !field.contains(n)) break; }
          el.style.backgroundSize = "900px 100%";
          el.style.backgroundPosition = (-x) + "px 0";
        });
        run();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
      };
      const tl = gsap.timeline({ paused: true });
      try {
        const v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
        if (v && v["show-captions"] === false) document.getElementById("captions").style.display = "none";
      } catch (e) {}
      // ---- global camera: punch-ins on apex words + gentle drift; the plate follows at 30 % (differential parallax) ----
      const CAM = [[0,1,0],[4.5,1,0],[6.35,1.055,0],[7.0,1.055,0],[7.5,1,0],[8.6,1,0],[9.9,1.04,-0.6],[10.6,1.04,-0.6],[11.2,1,0],
        [14.35,1,0],[14.85,1.03,0],[16.1,1.03,0],[16.5,1,0],[18.8,1,0],[19.6,1.04,0.4],[20.5,1.04,0.4],[21.0,1,0],
        [21.6,1,0],[23.4,1.06,0],[24.0,1.06,0],[24.5,1,0],[29.9,1,0],[31.2,1.04,-0.4],[32.3,1.04,-0.4],[32.9,1,0],
        [34.9,1,0],[35.5,1.035,0],[36.2,1.035,0],[36.6,1,0],[40.9,1,0],[41.6,1.04,0.5],[44.3,1.04,0.5],[44.83,1,0],
        [49.7,1,0],[50.2,1.04,0],[50.9,1.04,0],[51.1,1,0],[51.45,1.06,-1],[52.6,1.06,-1],[53.13,1,0],
        [60.6,1,0],[61.3,1.03,0],[62.2,1.03,0],[62.67,1,0],[65.5,1,0],[66.1,1.04,0],[66.7,1.04,0],[67.2,1,0],
        [71.8,1,0],[72.4,1.05,0.6],[73.3,1.05,0.6],[74.0,1,0],[78.4,1,0],[79.0,1.03,0],[79.6,1,0],
        [82.9,1,0],[83.6,1.04,0],[84.7,1.04,0],[85.15,1,0],[87.3,1,0],[87.9,1.03,0],[88.8,1.03,0],[89.6,0.99,0],[90.3,1,0],
        [90.5,1,0],[93.3,1.04,0],[95,1.04,0]];
      const ioE = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      function camAt(t) {
        for (let i = 0; i < CAM.length - 1; i++) {
          const a = CAM[i], b = CAM[i + 1];
          if (t <= b[0]) { const k = ioE(Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])))); return [a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
        }
        const z = CAM[CAM.length - 1]; return [z[1], z[2]];
      }
      const gcamEl = document.getElementById("gcam"), plateEl = document.getElementById("plate");
      const camState = { t: 0 };
      // orbs: home positions just outside each corner, slow elliptical drift; brighter + drawn inward while text is being typed
      const ORB = [[-400, -330, 620, 0.0, 11.0], [860, -280, 520, 1.7, 9.0], [-380, 1560, 560, 3.1, 12.5], [880, 1620, 600, 4.4, 10.0]];
      const orbEls = ORB.map((o, i) => document.getElementById("orb" + (i + 1)));
      const TYPE = [[4.5, 6.6], [21.7, 23.9]];
      function typingK(t) { let k = 0; for (const [a, b] of TYPE) { const u = Math.min(1, Math.max(0, (t - a) / 0.5)) * Math.min(1, Math.max(0, (b - t) / 0.5)); k = Math.max(k, ioE(u)); } return k; }
      function applyOrbs(t) {
        const k = typingK(t);
        ORB.forEach((o, i) => {
          const [hx, hy, sz, ph, per] = o, a = (t / per) * Math.PI * 2 + ph;
          const cx = 540 - sz / 2, cy = 960 - sz / 2, pull = 0.16 * k;
          const x = hx + Math.cos(a) * 70 + (cx - hx) * pull, y = hy + Math.sin(a * 0.8) * 60 + (cy - hy) * pull;
          orbEls[i].style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + (1 + 0.12 * k).toFixed(3) + ")";
          orbEls[i].style.opacity = (0.24 + 0.22 * k).toFixed(3);
        });
      }
      function applyCam() {
        applyOrbs(camState.t);
        const [sc, rot] = camAt(camState.t);
        gcamEl.style.transform = "scale(" + sc.toFixed(4) + ") rotate(" + rot.toFixed(3) + "deg)";
        plateEl.style.transform = "scale(" + (1 + (sc - 1) * 0.3).toFixed(4) + ") rotate(" + (rot * 0.3).toFixed(3) + "deg)";
      }
      tl.fromTo(camState, { t: 0 }, { t: 95, duration: 95, ease: "none", onUpdate: applyCam }, 0);
      applyCam();
      window.__timelines["main"] = tl;
    </script>

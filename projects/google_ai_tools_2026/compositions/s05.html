          const toks = TOKS.map(([html, w, h, src, deg], i) => {
            const el = document.createElement("div");
            el.className = "s05-tok"; el.innerHTML = html.replace(/id="g"/g, 'id="s05-tg' + i + '"').replace(/url\(#g\)/g, "url(#s05-tg" + i + ")");
            el.style.width = w + "px"; el.style.height = h + "px";
            tokRoot.appendChild(el);
            return { el, w, h, src: { x: src[0] - w / 2, y: src[1] - h / 2 }, deg };
          });

          // sparkles
          const STAR = '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff" stroke="#acc6e7" stroke-width="1.5"/></svg>';
          const sparks = [];
          for (let i = 0; i < 16; i++) {
            const sp = document.createElement("div");
            sp.className = "s05-abs s05-spark"; sp.innerHTML = STAR;
            sp.style.left = 513 + "px"; sp.style.top = 843 + "px";
            q("#s05-sparks").appendChild(sp);
            const a = (i / 16) * Math.PI * 2 + rnd() * 0.35, r = 380 + rnd() * 180;
            sparks.push([sp, Math.cos(a) * r, Math.sin(a) * r, 0.5 + rnd() * 0.7]);
          }

          // ---------- refs ----------
          const world = q("#s05-world"), laptop = q("#s05-laptop"), cap = q("#s05-cap"), scroll = q("#s05-scroll");
          const scan = q("#s05-scanbar");

          // ---------- initial states ----------
          tl.set(world, { transformOrigin: "540px 960px" }, 0);
          tl.set(laptop, { transformOrigin: "50% 100%", rotationX: 6, rotationY: -26, y: 70, scale: 1.1, z: 0 }, 0);
          tl.set(cap, { y: -150, scale: 1.25, opacity: 0, transformOrigin: "50% 50%" }, 0);
          tl.set(["#s05-ub1", "#s05-ub2", "#s05-ub3"].map(q), { scaleX: 0, transformOrigin: "0% 50%" }, 0);
          tl.set(q("#s05-caret"), { x: -362 }, 0);
          tl.set(q("#s05-okdot"), { scale: 0, transformOrigin: "50% 50%" }, 0);
          tl.set(scan, { y: -130, opacity: 0 }, 0);
          tl.set(q("#s05-scanled"), { scaleX: 0 }, 0);
          tl.set(boxEls, { opacity: 0 }, 0);
          tl.set([q("#s05-glow"), q("#s05-shock"), q("#s05-cone"), q("#s05-pastefx")], { opacity: 0 }, 0);
          tl.set(q("#s05-rail"), { opacity: 0 }, 0);
          toks.forEach((t) => tl.set(t.el, { x: t.src.x, y: t.src.y, scale: 0.3, opacity: 0, transformOrigin: "50% 50%" }, 0));
          tl.set(sparks.map((s) => s[0]), { opacity: 0 }, 0);

          // ---------- camera + planes ----------
          tl.fromTo(world, { scale: 1 }, { scale: 1.065, duration: DUR, ease: "sine.inOut", immediateRender: false }, 0);
          tl.fromTo("#s05-far", { y: 0, x: 0 }, { y: -50, x: 14, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo("#s05-near", { y: 80 }, { y: -170, duration: DUR, ease: "none", immediateRender: false }, 0);

          // laptop swings in (already moving at frame 0)
          tl.fromTo(laptop, { rotationY: -26, y: 70, scale: 1.1 }, { rotationY: -9, y: 0, scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(laptop, { rotationY: -9 }, { rotationY: -6, duration: DUR - 0.6, ease: "sine.inOut", immediateRender: false }, 0.6);
          tl.fromTo(["#s05-shadow", "#s05-shadow2"].map(q), { scaleX: 0.82, opacity: 0.5, x: 40 }, { scaleX: 1, opacity: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 0);
          // slow scroll / pan of the real website inside the screen
          tl.fromTo(scroll, { x: 0, y: 0 }, { x: -40, y: -86, duration: DUR, ease: "sine.inOut", immediateRender: false }, 0);

          // "Tempel" -> capsule drops in; lands on "website"
          tl.fromTo(cap, { y: -150, scale: 1.25, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "back.out(1.6)", immediateRender: false }, T.website - 0.30);
          // abstract URL "types" in until "bisnismu"
          [["#s05-ub1", 0.52, 0.12], ["#s05-ub2", 0.62, 0.14], ["#s05-ub3", 0.74, 0.1]].forEach(([s, t, d]) => {
            tl.fromTo(q(s), { scaleX: 0 }, { scaleX: 1, duration: d, ease: "steps(5)", immediateRender: false }, t);
          });
          tl.fromTo(q("#s05-caret"), { x: -362 }, { x: 0, duration: 0.34, ease: "steps(8)", immediateRender: false }, 0.5);
          // "bisnismu" -> paste: capsule presses into the console, screen ripples
          tl.fromTo(cap, { y: 0, scale: 1 }, { y: 18, scale: 0.97, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, T.bisnismu - 0.06);
          tl.fromTo(q("#s05-okdot"), { scale: 0 }, { scale: 1, duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, T.bisnismu);
          tl.fromTo(q("#s05-pastefx"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, T.bisnismu);
          tl.fromTo(q("#s05-pastefx"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, T.bisnismu + 0.12);
          tl.fromTo(laptop, { scale: 1 }, { scale: 1.02, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.bisnismu);

          // "dia bisa" -> scanner LED charges in the chin
          tl.fromTo(q("#s05-scanled"), { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power2.inOut", immediateRender: false }, T.dia);
          tl.fromTo(q("#s05-rail"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, T.bisa);
          tl.fromTo(q("#s05-railline"), { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -160 }, duration: DUR - T.bisa, ease: "none", immediateRender: false }, T.bisa);

          // "membaca" -> scanning bar sweeps the real page, regions get bracketed as it passes
          tl.fromTo(scan, { y: -130, opacity: 0 }, { y: -100, opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, T.membaca - 0.06);
          tl.fromTo(scan, { y: -100 }, { y: 470, duration: 0.42, ease: "power1.inOut", immediateRender: false }, T.membaca);
          tl.fromTo(scan, { y: 470, opacity: 1 }, { y: 560, opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, T.membaca + 0.42);
          [[0, 0.04], [1, 0.06], [2, 0.18], [3, 0.36]].forEach(([i, dt]) => {
            tl.fromTo(boxEls[i], { opacity: 0, scale: 1.08, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)", immediateRender: false }, T.membaca + dt);
          });

          // tokens lift out of the page and land on the orbit exactly on "identitas"
          const A = T.identitas;
          toks.forEach((t, i) => {
            const p = orbitPt(t.deg, t.w, t.h), d = 0.26 + (i % 4) * 0.03;
            tl.fromTo(t.el, { x: t.src.x, y: t.src.y, scale: 0.3, opacity: 0 }, { x: p.x, y: p.y, scale: 1, opacity: 1, duration: d, ease: "power3.inOut", immediateRender: false }, A - d);
            // slow orbit after the apex (sampled along the tilted ellipse, deterministic)
            const N = 8, sweep = 12, d2 = 3.38 - A - 0.02;
            const kf = [];
            for (let k = 1; k <= N; k++) { const pp = orbitPt(t.deg + (sweep * k) / N, t.w, t.h); kf.push({ x: pp.x, y: pp.y, duration: d2 / N, ease: "none" }); }
            tl.fromTo(t.el, { x: p.x, y: p.y }, { keyframes: kf, immediateRender: false }, A + 0.02);
            // "brand" beat: chips bob in a ripple
            tl.fromTo(t.el, { scale: 1 }, { scale: 1.12, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.brand + i * 0.025);
            // exit: token swipe off to the right
            const pe = orbitPt(t.deg + sweep, t.w, t.h);
            tl.fromTo(t.el, { x: pe.x, scaleX: 1 }, { x: pe.x + 1250, scaleX: 1.5, duration: 0.33, ease: "power3.in", immediateRender: false }, 3.4 + (i % 4) * 0.02);
          });
          tl.fromTo(q("#s05-rail"), { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 3.42);

          // ---------- APEX FX on "identitas" ----------
          tl.fromTo(q("#s05-glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.75, scale: 1.1, duration: 0.25, ease: "power2.out", immediateRender: false }, A - 0.03);
          tl.fromTo(q("#s05-glow"), { opacity: 0.75 }, { opacity: 0.2, duration: 0.6, ease: "power2.out", immediateRender: false }, A + 0.22);
          tl.fromTo(q("#s05-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s05-cone"), { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power2.out", immediateRender: false }, A - 0.2);
          tl.fromTo(laptop, { scale: 1 }, { scale: 1.04, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
          tl.fromTo(q("#s05-railline"), { attr: { stroke: "#acc6e7" } }, { attr: { stroke: "#3a6299" }, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
          sparks.forEach(([sp, dx, dy, s], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: s, opacity: 0, rotation: 90, duration: 0.7, ease: "power3.out", immediateRender: false }, A + i * 0.01);
          });
          tl.fromTo(q("#s05-cone"), { opacity: 0.85 }, { opacity: 0.3, duration: 0.6, ease: "power2.inOut", immediateRender: false }, A + 0.4);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>

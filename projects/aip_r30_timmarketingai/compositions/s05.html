  </style>

  <script>
    (function () {
      const K = window.R30K, P = "s05", D = K.dur(P);
      const S = K.scene(P, D), { tl, ft, I, wt, $, popIn, fadeOut } = S;
      $("s05-wrap").innerHTML = K.layers(P);
      const cam = $("s05-cam"), hud = $("s05-hud");

      const SN = ["Riset &amp; konten", "Kreatif &amp; distribusi", "Analitik"];

      const WK = [0.32, 0.46, 0.6, 0.78], WX = (i) => 40 + i * 200;

          `<div class="k-demo" style="left:262px;top:17px">CONTOH</div></div>` +
        `<div id="s05-chart">` + WK.map((v, i) => `<div class="s05-col" id="s05-c${i}" style="left:${WX(i)}px;height:${v * 300}px"></div><div class="s05-wl" style="left:${WX(i)}px" id="s05-wl${i}">Minggu ${i + 1}</div>`).join("") +
          `<svg id="s05-cl" viewBox="0 0 800 420"><path id="s05-cp" d="${WK.map((v, i) => `${i ? "L" : "M"}${WX(i) + 60} ${350 - v * 300 - 26}`).join(" ")}" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="1000"/></svg>` +
          `<div class="k-demo" style="left:0;top:0">ILUSTRASI &middot; konten yang terbukti jalan</div></div>` +
        `<div id="s05-sheet"><div class="h">${K.svg("file-spreadsheet")}rekap-manual.xlsx</div><div class="g"></div></div>`;
      hud.innerHTML = K.headerHTML(P, 3) + SN.map((n, i) => `<div class="s05-st" id="s05-s${i}"><i>${i + 1}</i>${n}</div>`).join("") +

      const T = { tig: wt("tiga,"), ana: wt("analitik."), tia: wt("Tiap"), dic: wt("dicek:"), cha: wt("chat,"), boo: wt("booking,"), pen: wt("penjualan."), buk: wt("Bukan"),
        lik: wt("likes."), has: wt("Hasilnya"), bal: wt("balik"), sat: wt("satu."), min: wt("Minggu"), ban: wt("banyak"), ter: wt("terbukti"), jal: wt("jalan,"),
        tan: wt("tanpa"), rek: wt("rekap"), man: wt("manual.") };
      K.cam(S);
      // ---------------------------------------------------------------- whip in from the right
      const zone = $("s05-zone"); I(zone, { x: 1080, filter: "blur(8px)" });
      ft(zone, { x: 1080, filter: "blur(8px)" }, { x: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out" }, 0.005);
      K.headerIn(S, 0.2, false);
      // ---------------------------------------------------------------- the loop, station 3 lit
      const ring = $("s05-ring"); I(ring, { opacity: 0, scale: 0.7, rotation: 0, transformOrigin: "50% 50%" });

      ft(ring, { rotation: 0 }, { rotation: 40, duration: 2.2, ease: "none" }, 0.3);
      const st = SN.map((_, i) => $(`s05-s${i}`));
      st.forEach((e, i) => { K.at(S, e, SP[i][0], SP[i][1], { scale: 0.5, opacity: 0 }); ft(e, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.4 + i * 0.08); });
      tl.set(st[2], { className: "s05-st on" }, T.ana - 0.05);
      ft(st[2], { scale: 1 }, { scale: 1.2, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, T.ana - 0.05);
      const dot = $("s05-dot"); I(dot, { x: SP[2][0], y: SP[2][1] - 40, scale: 0, opacity: 1 });
      ft(dot, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, T.ana);
      // ---------------------------------------------------------------- results table
      const out1 = [ring, ...st]; out1.forEach((e) => ft(e, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in" }, T.tia - 0.2));
      ft(dot, { scale: 1 }, { scale: 0, duration: 0.2 }, T.tia - 0.2);
      const tab = $("s05-tab"); I(tab, { opacity: 0, y: 40 }); ft(tab, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T.tia - 0.05);

        [T.dic, T.cha, T.boo, T.pen].forEach((t, c) => { const b = $(`s05-b${r}${c}`); I(b, { scaleX: 0 }); ft(b, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, t - 0.05 + r * 0.06); }); });
      CN.forEach((_, c) => { const h = $(`s05-ch${c}`); I(h, { opacity: c ? 0.35 : 1 }); if (c) ft(h, { opacity: 0.35 }, { opacity: 1, duration: 0.2 }, [T.cha, T.boo, T.pen][c - 1] - 0.1); });

      tl.set(dot, { x: 540, y: 660 }, T.has - 0.1);
      ft(dot, { scale: 0 }, { scale: 1.4, duration: 0.3, ease: "back.out(2)" }, T.has + 0.05);
      ft(ring, { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.has + 0.1);
      st.forEach((e, i) => ft(e, { opacity: 0 }, { opacity: 1, duration: 0.25 }, T.has + 0.15 + i * 0.05));
      tl.to(dot, { x: SP[2][0], y: SP[2][1], scale: 1, duration: 0.3, ease: "power2.inOut" }, T.bal - 0.4);
      { const kf = []; for (let i = 1; i <= 12; i++) { const a = ((150 + i * 10) * Math.PI) / 180; kf.push({ x: RC.x + RC.r * Math.cos(a), y: RC.y + RC.r * Math.sin(a), duration: 0.6 / 12, ease: "none" }); }
        tl.to(dot, { keyframes: kf }, T.bal - 0.05); }
      tl.set(st[2], { className: "s05-st" }, T.bal + 0.3); tl.set(st[0], { className: "s05-st on" }, T.sat - 0.1);
      ft(st[0], { scale: 1 }, { scale: 1.2, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, T.sat - 0.1);
      const inn = $("s05-in"); K.at(S, inn, 540, 690, { scale: 0.5, opacity: 0 });
      ft(inn, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, T.sat);
      ft(dot, { scale: 1 }, { scale: 0, duration: 0.18, ease: "power2.in" }, T.bal + 0.45);
      // ---------------------------------------------------------------- 4-week chart, the dot draws the line
      [ring, ...st, inn].forEach((e) => ft(e, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in" }, T.min - 0.25));
      const ch = $("s05-chart"); I(ch, { opacity: 0 }); ft(ch, { opacity: 0 }, { opacity: 1, duration: 0.25 }, T.min - 0.1);
      WK.forEach((_, i) => { const c = $(`s05-c${i}`); I(c, { scaleY: 0 }); ft(c, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "back.out(1.4)" }, T.min + i * 0.22); });
      const PT = WK.map((v, i) => [140 + WX(i) + 60, 480 + 350 - v * 300 - 26]);
      const cp = $("s05-cp"); I(cp, { strokeDashoffset: 1000 });
      const tD = T.ban - 0.1, dD = T.jal - tD;
      tl.set(dot, { x: PT[0][0], y: PT[0][1] }, tD - 0.4);
      ft(dot, { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.4)" }, tD - 0.3);
      tl.to(dot, { keyframes: PT.slice(1).map(([x, y]) => ({ x, y, duration: dD / 3, ease: "none" })) }, tD);
      // path length (3 segments) ~ sum of hypot
      let L = 0; for (let i = 1; i < 4; i++) L += Math.hypot(PT[i][0] - PT[i - 1][0], PT[i][1] - PT[i - 1][1]);
      ft(cp, { strokeDashoffset: 1000 }, { strokeDashoffset: 1000 - L, duration: dD, ease: "none" }, tD);
      ft(dot, { scale: 1 }, { scale: 1.6, duration: 0.18, yoyo: true, repeat: 1 }, T.ter);

      const sh = $("s05-sheet"), sx = $("s05-sx");

      ft(dot, { scale: 1 }, { scale: 0, duration: 0.2, ease: "power2.in" }, T.tan - 0.3);

      ft(sh, { x: 1100 }, { x: 800, duration: 0.4, ease: "power3.out" }, T.tan - 0.15);

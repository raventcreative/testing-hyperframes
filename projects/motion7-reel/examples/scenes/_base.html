<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <style>

      .ctr { position: absolute; left: 0; width: 1280px; text-align: center; white-space: nowrap; }

      {{CSS}}

  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1280" data-height="720" data-fps="30">
      {{HTML}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const D = {{DUR}};
        const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });
        const ft = (el, a, b, at) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), at);
        const st = (el, v, at) => tl.set(el, v, at);
        let seed = 9; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        // typewriter: characters start hidden (CSS) and appear one by one
        const typeIn = (el, text, t0, cps) => {
          el.innerHTML = Array.from(text).map((c) => `<s style="text-decoration:none;display:none">${c}</s>`).join("") + '<i class="caret"></i>';
          $$("s", el).forEach((c, k) => ft(c, { display: "none" }, { display: "inline", duration: 0.01 }, t0 + k / cps));
          return t0 + text.length / cps;
        };
        {{JS}}
        tl.set({}, {}, D - 0.01);
        window.__timelines["main"] = tl;
      })();
    </script>

<!doctype html><html><head><meta charset="UTF-8"/>
<!-- Simple Icons (CC0) SVG -> Three.js SVGLoader -> ExtrudeGeometry with bevel. Usage: logo3d.html?s=n8n&c=EA4B71&ry=-0.35 -->
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
<style>html,body{margin:0;width:700px;height:700px;background:transparent;overflow:hidden}</style></head>
<body><canvas id="c" width="700" height="700"></canvas>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search), slug = q.get("s"), col = "#" + q.get("c"), ry = +(q.get("ry") ?? -0.35);
const txt = await (await fetch(`assets/logos/${slug}.svg`)).text();
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(700, 700, false); r.setClearColor(0, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const k = new THREE.DirectionalLight(0xffffff, 2.2); k.position.set(2, 3, 5); scene.add(k);
const rim = new THREE.DirectionalLight(0x9fe8ff, 1.8); rim.position.set(-4, 2, -3); scene.add(rim);
const shapes = new SVGLoader().parse(txt).paths.flatMap((p) => SVGLoader.createShapes(p));
const geo = new THREE.ExtrudeGeometry(shapes, { depth: 3, bevelEnabled: true, bevelThickness: 0.7, bevelSize: 0.3, bevelSegments: 5, curveSegments: 28 });
geo.center(); geo.scale(1, -1, 1);
const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color(col), roughness: 0.3, emissive: new THREE.Color(col), emissiveIntensity: 0.18 }));
mesh.rotation.set(0.14, ry, 0.04); scene.add(mesh);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 200); cam.position.set(0, 0, 54); cam.lookAt(0, 0, 0);
r.render(scene, cam); window.READY = true;
</script></body></html>

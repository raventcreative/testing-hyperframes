            s += '<path d="M30 92 A96 96 0 0 1 92 28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>';
            coreTop.innerHTML = s;
          })();
          CORE.appendChild(coreTop);

          // ---------- cartridges ----------
          const EMB = [
            '<path d="M0 -30 C2 -8 8 -2 30 0 C8 2 2 8 0 30 C-2 8 -8 2 -30 0 C-8 -2 -2 -8 0 -30Z" fill="#e8f0fb"/><path d="M20 -26 C21 -21 22 -20 27 -19 C22 -18 21 -17 20 -12 C19 -17 18 -18 13 -19 C18 -20 19 -21 20 -26Z" fill="#acc6e7"/>',
            '<polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#e8f0fb" stroke-width="5" stroke-linejoin="round"/><polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" fill="#acc6e7"/>',
            '<g fill="none" stroke-linecap="round" stroke-width="5"><path d="M-28 -12 C-20 -24 -10 0 0 -12 S 20 -24 28 -12" stroke="#e8f0fb"/><path d="M-28 2 C-20 -10 -10 14 0 2 S 20 -10 28 2" stroke="#cbdbf4"/><path d="M-28 16 C-20 4 -10 28 0 16 S 20 4 28 16" stroke="#acc6e7"/></g>',
            '<circle r="9" fill="#e8f0fb"/><ellipse rx="29" ry="11" fill="none" stroke="#cbdbf4" stroke-width="4.5" transform="rotate(-28)"/><circle cx="22" cy="-14" r="5" fill="#e8f0fb"/>',
            '<path d="M0 -28 L27 21 H-27Z" fill="none" stroke="#e8f0fb" stroke-width="5" stroke-linejoin="round"/><path d="M0 -28 V21 M0 -2 L14 21" stroke="#acc6e7" stroke-width="3" fill="none"/>'
          ];
          function cartSVG(i) {
            const id = "s01-c" + i;
            let s = '<svg class="s01-cart" viewBox="0 0 180 260"><defs>' +
              '<linearGradient id="' + id + 'b" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#f1f5fb"/><stop offset="1" stop-color="#cfdcec"/></linearGradient>' +
              '<linearGradient id="' + id + 'x" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8bad2"/><stop offset="1" stop-color="#6d84a6"/></linearGradient>' +
              '<linearGradient id="' + id + 'c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c2cedc"/><stop offset="0.56" stop-color="#eef3f8"/><stop offset="1" stop-color="#8fa1b8"/></linearGradient>' +
              '<linearGradient id="' + id + 'n" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#4f7ab3"/><stop offset="0.5" stop-color="#294b77"/><stop offset="1" stop-color="#1c3354"/></linearGradient>' +
              '<radialGradient id="' + id + 'g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#acc6e7" stop-opacity="0.55"/><stop offset="1" stop-color="#acc6e7" stop-opacity="0"/></radialGradient>' +
              '<clipPath id="' + id + 'p"><rect x="26" y="58" width="116" height="94" rx="16"/></clipPath>' +
              '</defs>';
            s += '<rect x="24" y="23" width="140" height="222" rx="24" fill="url(#' + id + 'x)"/>';                 // extrusion (right/bottom faces)
            s += '<rect x="14" y="14" width="140" height="222" rx="24" fill="url(#' + id + 'b)" stroke="rgba(41,75,119,0.20)" stroke-width="1.5"/>';
            s += '<path d="M19 210 V40 Q19 19 40 19 H128" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>';
            s += '<rect x="26" y="26" width="116" height="24" rx="8" fill="url(#' + id + 'c)" stroke="rgba(41,75,119,0.18)" stroke-width="1"/>';
            for (let k = 0; k < 9; k++) s += '<line x1="' + (38 + k * 11.5) + '" y1="30" x2="' + (38 + k * 11.5) + '" y2="46" stroke="rgba(41,75,119,0.28)" stroke-width="1.6"/>';
            s += '<rect x="24" y="56" width="120" height="98" rx="18" fill="none" stroke="rgba(28,51,84,0.35)" stroke-width="2"/>';
            s += '<rect x="26" y="58" width="116" height="94" rx="16" fill="url(#' + id + 'n)"/>';
            s += '<g clip-path="url(#' + id + 'p)"><path d="M26 58 H104 L52 152 H26Z" fill="#ffffff" opacity="0.13"/>';
            s += '<g class="s01-sheen"><rect x="-60" y="40" width="26" height="140" fill="#ffffff" opacity="0.5" transform="rotate(24 0 100)"/></g></g>';
            s += '<rect x="27.5" y="59.5" width="113" height="91" rx="15" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>';
            s += '<circle cx="84" cy="105" r="40" fill="url(#' + id + 'g)"/>';
            s += '<g transform="translate(84 105)">' + EMB[i] + '</g>';
            s += '<circle cx="128" cy="68" r="3" fill="#9fd8c4"/><circle cx="118" cy="68" r="3" fill="#acc6e7" opacity="0.8"/>';
            // etch zone: traces, pads, LEDs, vent
            s += '<g fill="none" stroke="#8ea7c8" stroke-width="1.7" stroke-linecap="round"><path d="M32 170 H48 L56 178 H70"/><path d="M32 184 H44 L50 190 H62"/><path d="M76 166 V176 L84 184"/><path d="M90 168 H98"/></g>';
            s += '<g fill="#ffffff" stroke="#8ea7c8" stroke-width="1.4"><circle cx="70" cy="178" r="2.6"/><circle cx="62" cy="190" r="2.6"/><circle cx="84" cy="184" r="2.6"/><circle cx="98" cy="168" r="2.4"/></g>';
            s += '<g class="s01-cled">' + [108, 121, 134].map((x) => '<circle cx="' + x + '" cy="176" r="4" fill="#acc6e7" stroke="#6f93c3" stroke-width="1"/>').join("") + '</g>';
            s += '<g stroke="rgba(41,75,119,0.28)" stroke-width="2" stroke-linecap="round">' + [104, 112, 120, 128, 136].map((x) => '<line x1="' + x + '" y1="186" x2="' + x + '" y2="194"/>').join("") + '</g>';
            [[30, 168], [138, 196]].forEach(([x, y]) => { s += '<circle cx="' + x + '" cy="' + y + '" r="4.6" fill="#e2e9f2" stroke="rgba(41,75,119,0.35)" stroke-width="1"/><path d="M' + (x - 2.6) + " " + (y + 2.6) + " L" + (x + 2.6) + " " + (y - 2.6) + '" stroke="rgba(41,75,119,0.55)" stroke-width="1.3"/>'; });
            // contact strip (sinks into the socket)
            s += '<rect x="28" y="204" width="112" height="26" rx="6" fill="#c7d3e2" stroke="rgba(41,75,119,0.2)" stroke-width="1"/>';
            for (let k = 0; k < 9; k++) s += '<rect x="' + (33 + k * 11.8) + '" y="208" width="7.5" height="19" rx="2" fill="url(#' + id + 'c)"/>';
            s += '</svg>';
            return s;
          }
          const SIG = '<svg class="s01-sig" viewBox="0 0 120 70"><g fill="none" stroke-linecap="round"><path d="M38 58 A26 26 0 0 1 82 58" stroke="#294b77" stroke-width="7"/><path d="M24 50 A42 42 0 0 1 96 50" stroke="#3a6299" stroke-width="6" opacity="0.8"/><path d="M10 42 A58 58 0 0 1 110 42" stroke="#acc6e7" stroke-width="5"/></g><circle cx="60" cy="64" r="6" fill="#294b77"/></svg>';
          const TRAIL = (() => { let s = '<svg class="s01-trail" viewBox="-400 -400 800 800"><g fill="none" stroke-linecap="round">'; for (let k = 0; k < 7; k++) { const a0 = rad(-62 + k * 8), a1 = rad(-62 + (k + 1) * 8 - 1); s += '<path d="M' + f1(330 * Math.cos(a0)) + " " + f1(330 * Math.sin(a0)) + " A330 330 0 0 1 " + f1(330 * Math.cos(a1)) + " " + f1(330 * Math.sin(a1)) + '" stroke="' + (k > 4 ? "#e8f0fb" : "#7fa0cd") + '" stroke-width="' + (4 + k * 2) + '" opacity="' + (0.1 + k * 0.12).toFixed(2) + '"/>'; } return s + "</g></svg>"; })();

          const carts = TH.map((th, i) => {
            const orb = mk("div", "s01-orb", P);
            const tlift = mk("div", "s01-tlift", orb, TRAIL);
            const arm = mk("div", "s01-arm", orb);
            const ctr = mk("div", "s01-ctr", arm);
            const sh = mk("div", "s01-sh", ctr);
            const lift = mk("div", "s01-lift", ctr);
            const bb = mk("div", "s01-bb", lift);
            const tilt = mk("div", "s01-tilt", bb, SIG + cartSVG(i));
            return { th, orb, tlift, trail: tlift.firstChild, arm, ctr, sh, lift, bb, tilt, sig: tilt.querySelector(".s01-sig"), sheen: tilt.querySelector(".s01-sheen"), cled: tilt.querySelectorAll(".s01-cled circle") };
          });

          // ---------- sparkles (seeded) ----------
          const STAR = (c, st) => '<svg viewBox="0 0 40 40" width="100%" height="100%" style="overflow:visible"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="' + c + '" stroke="' + st + '" stroke-width="1.8" style="filter:drop-shadow(0 3px 4px rgba(28,51,84,0.25))"/></svg>';
          const sparks = [];
          for (let i = 0; i < 14; i++) {
            const sp = mk("div", "s01-abs s01-spark", q("#s01-fx"), i % 5 === 2 ? STAR("#f2c46d", "#ffffff") : STAR("#ffffff", "#6f93c3"));
            sp.style.left = "513px"; sp.style.top = "905px";
            const a = (i / 14) * Math.PI * 2 + rnd() * 0.35, r = 250 + rnd() * 230;
            sparks.push([sp, Math.cos(a) * r, Math.sin(a) * r * 0.75]);
          }

          // ================= timeline =================
          const ledOn = qa(".s01-ledon"), energy = qa(".s01-en");
          // initial states
          tl.set(q("#s01-plat"), { rotationX: TILT, transformOrigin: "50% 50%" }, 0);
          tl.set([q("#s01-shock"), q("#s01-shock2")], { z: 4, opacity: 0, scale: 0.4 }, 0);
          tl.set(q("#s01-track"), { z: 190, opacity: 0.0 }, 0);
          tl.set(q("#s01-coreglow"), { z: 46, opacity: 0.3, scale: 0.8 }, 0);
          tl.set(q("#s01-beamw"), { z: 42 }, 0);
          tl.set(q("#s01-beamc"), { rotationX: -90 }, 0);
          tl.set(q("#s01-beam"), { opacity: 0, scaleY: 0.3 }, 0);
          tl.set([q("#s01-flick"), q("#s01-cone")], { opacity: 0 }, 0);
          tl.set(ledOn, { opacity: 0 }, 0);
          tl.set(energy, { opacity: 0 }, 0);
          tl.set(sparks.map((s) => s[0]), { opacity: 0 }, 0);
          const H0 = [170, 120, 200, 150, 230];
          carts.forEach((c, i) => {
            const a0 = c.th - 150;
            tl.set(c.orb, { rotation: a0 }, 0);
            tl.set(c.ctr, { rotation: -a0 }, 0);
            tl.set(c.arm, { x: 340 }, 0);
            tl.set(c.lift, { z: H0[i] }, 0);
            tl.set(c.tlift, { z: H0[i] + 120 }, 0);
            tl.set(c.trail, { scale: 340 / 330, opacity: 1 }, 0);
            tl.set(c.bb, { rotationX: STAND }, 0);
            tl.set(c.tilt, { rotation: i % 2 ? 9 : -9, scaleY: 1 }, 0);
            tl.set(c.sh, { x: 40, y: 50, scale: 1.5, opacity: 0.25 }, 0);
            tl.set(c.sig, { opacity: 0, scale: 0.4 }, 0);
            tl.set(c.sheen, { x: 0 }, 0);
          });

          // camera: entry rise, gentle push, then dive into the ring
          tl.fromTo(q("#s01-rise"), { y: 110, scale: 0.9, transformOrigin: "50% 52%" }, { y: 0, scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s01-cam"), { scale: 1, y: 0, transformOrigin: "50% 50%" }, { scale: 1.06, y: -10, duration: T.dive, ease: "sine.inOut", immediateRender: false }, 0);
          tl.fromTo(q("#s01-cam"), { scale: 1.06, y: -10 }, { scale: 1.62, y: -40, duration: DUR - T.dive, ease: "power2.in", immediateRender: false }, T.dive);
          tl.fromTo(q("#s01-plat"), { rotationX: TILT }, { rotationX: 44, duration: DUR - T.dive, ease: "power2.in", immediateRender: false }, T.dive);
          tl.fromTo(q("#s01-floor"), { scaleX: 0.75, opacity: 0.4 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s01-farw"), { x: 24, y: 30 }, { x: -24, y: -30, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo(q("#s01-halo"), { rotation: -6 }, { rotation: 10, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo(q("#s01-near"), { x: -30, y: 50 }, { x: 40, y: -70, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo(q("#s01-key"), { opacity: 0.7 }, { opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, 0);
          // orbit track ring glows while the cartridges orbit, then fades on lock-in
          tl.fromTo(q("#s01-track"), { opacity: 0.9, rotation: 0 }, { opacity: 0.0, rotation: 60, duration: T.lima, ease: "power1.in", immediateRender: false }, 0);

          // ---- orbit (frame 0 already in flight) -> lock-in exactly on "lima" ----
          const L1 = 0.76;
          carts.forEach((c, i) => {
            const a0 = c.th - 150, a1 = c.th - 14, a2 = c.th;
            tl.fromTo(c.orb, { rotation: a0 }, { rotation: a1, duration: L1, ease: "sine.inOut", immediateRender: false }, 0);
            tl.fromTo(c.ctr, { rotation: -a0 }, { rotation: -a1, duration: L1, ease: "sine.inOut", immediateRender: false }, 0);
            tl.fromTo(c.orb, { rotation: a1 }, { rotation: a2, duration: T.lima - L1, ease: "power2.out", immediateRender: false }, L1);
            tl.fromTo(c.ctr, { rotation: -a1 }, { rotation: -a2, duration: T.lima - L1, ease: "power2.out", immediateRender: false }, L1);
            tl.fromTo(c.arm, { x: 340 }, { x: 262, duration: L1, ease: "sine.inOut", immediateRender: false }, 0);
            tl.fromTo(c.arm, { x: 262 }, { x: RS, duration: T.lima - L1, ease: "power2.out", immediateRender: false }, L1);
            tl.fromTo(c.trail, { scale: 340 / 330, opacity: 1 }, { scale: 262 / 330, opacity: 0.8, duration: L1, ease: "sine.inOut", immediateRender: false }, 0);
            tl.fromTo(c.trail, { scale: 262 / 330, opacity: 0.8 }, { scale: RS / 330, opacity: 0, duration: T.lima - L1, ease: "power2.out", immediateRender: false }, L1);
            tl.fromTo(c.lift, { z: H0[i] }, { z: 46, duration: L1, ease: "sine.inOut", immediateRender: false }, 0);
            tl.fromTo(c.tlift, { z: H0[i] + 120 }, { z: 166, duration: L1, ease: "sine.inOut", immediateRender: false }, 0);
            tl.fromTo(c.lift, { z: 46 }, { z: -60, duration: T.lima - L1, ease: "power3.in", immediateRender: false }, L1);
            tl.fromTo(c.sh, { x: 40, y: 50, scale: 1.5, opacity: 0.25 }, { x: 16, y: 20, scale: 1.12, opacity: 0.55, duration: L1, ease: "sine.inOut", immediateRender: false }, 0);
            tl.fromTo(c.sh, { x: 16, y: 20, scale: 1.12, opacity: 0.55 }, { x: 6, y: 8, scale: 0.98, opacity: 0.85, duration: T.lima - L1, ease: "power3.in", immediateRender: false }, L1);
            tl.fromTo(c.tilt, { rotation: i % 2 ? 9 : -9 }, { rotation: 0, duration: T.lima, ease: "power2.inOut", immediateRender: false }, 0);
            // snap squash on lock-in
            tl.fromTo(c.tilt, { scaleY: 0.9, scaleX: 1.05 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, T.lima);
          });

          // ---- APEX "lima" (0.92): lock-in burst ----
          const A = T.lima;
          ledOn.forEach((g, i) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, A + i * 0.015));
          tl.fromTo(q("#s01-flick"), { opacity: 0 }, { opacity: 0.5, duration: 0.05, ease: "none", immediateRender: false }, A - 0.02);
          tl.fromTo(q("#s01-flick"), { opacity: 0.5 }, { opacity: 0.2, duration: 0.06, ease: "none", immediateRender: false }, A + 0.03);
          tl.fromTo(q("#s01-flick"), { opacity: 0.2 }, { opacity: 0.42, duration: 0.05, ease: "none", immediateRender: false }, A + 0.09);
          tl.fromTo(q("#s01-flick"), { opacity: 0.42 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, A + 0.14);
          tl.fromTo(q("#s01-coreglow"), { opacity: 0.3, scale: 0.8 }, { opacity: 0.95, scale: 1.12, duration: 0.18, ease: "power2.out", immediateRender: false }, A - 0.02);
          tl.fromTo(q("#s01-coreglow"), { opacity: 0.95, scale: 1.12 }, { opacity: 0.55, scale: 0.9, duration: 0.5, ease: "power2.out", immediateRender: false }, A + 0.16);
          tl.fromTo(q("#s01-coreglow"), { opacity: 0.55, scale: 0.9 }, { opacity: 1, scale: 1.5, duration: DUR - T.dive, ease: "power2.in", immediateRender: false }, T.dive);
          tl.fromTo(q("#s01-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s01-shock2"), { opacity: 0.7, scale: 0.3 }, { opacity: 0, scale: 1.35, duration: 0.55, ease: "power2.out", immediateRender: false }, A + 0.07);
          tl.fromTo(q("#s01-beam"), { opacity: 0, scaleY: 0.3 }, { opacity: 0.85, scaleY: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, A);
          tl.fromTo(q("#s01-beam"), { opacity: 0.85, scaleY: 1 }, { opacity: 0.3, scaleY: 0.9, duration: 0.6, ease: "power2.out", immediateRender: false }, A + 0.2);
          tl.fromTo(q("#s01-punch"), { scale: 1, transformOrigin: "50% 54%" }, { scale: 1.05, duration: 0.11, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s01-punch"), { scale: 1.05 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, A + 0.11);
          tl.fromTo(q("#s01-cone"), { opacity: 0 }, { opacity: 0.8, duration: 0.35, ease: "power2.out", immediateRender: false }, A - 0.25);
          tl.fromTo(q("#s01-cone"), { opacity: 0.8 }, { opacity: 0.45, duration: 0.8, ease: "power1.inOut", immediateRender: false }, A + 0.4);
          sparks.forEach(([sp, dx, dy], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: 0.5 + (i % 3) * 0.28, opacity: 0, rotation: 90, duration: 0.75, ease: "power3.out", immediateRender: false }, A + i * 0.01);
          });

          // ---- "AI" (1.31): energy runs core -> sockets; cartridge LEDs chase ----
          energy.forEach((e, i) => {
            tl.fromTo(e, { opacity: 1, strokeDashoffset: 26 }, { strokeDashoffset: -110, duration: 0.42, ease: "power1.inOut", immediateRender: false }, T.ai - 0.04 + i * 0.03);
            tl.fromTo(e, { opacity: 1, strokeDashoffset: 26 }, { strokeDashoffset: -110, duration: 0.42, ease: "power1.inOut", immediateRender: false }, T.viral - 0.04 + i * 0.03);
          });
          carts.forEach((c, i) => {
            c.cled.forEach((led, k) => {
              tl.fromTo(led, { attr: { fill: "#acc6e7" } }, { attr: { fill: "#ffffff" }, duration: 0.08, ease: "none", immediateRender: false }, T.ai + 0.2 + i * 0.03 + k * 0.05);
              tl.fromTo(led, { attr: { fill: "#ffffff" } }, { attr: { fill: k === 2 ? "#9fd8c4" : "#cfe6ff" }, duration: 0.25, ease: "none", immediateRender: false }, T.ai + 0.3 + i * 0.03 + k * 0.05);
            });
            // "tools" (1.65): gloss sweep over each enamel face
            tl.fromTo(c.sheen, { x: 0 }, { x: 230, duration: 0.42, ease: "power2.inOut", immediateRender: false }, T.tools - 0.06 + i * 0.045);
            // "viral." (1.94): broadcast arcs pop above every cartridge + hop
            tl.fromTo(c.sig, { opacity: 0, scale: 0.4, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "back.out(2.2)", immediateRender: false }, T.viral - 0.03 + i * 0.03);
            tl.fromTo(c.sig, { opacity: 1 }, { opacity: 0.75, duration: 0.3, ease: "power1.out", immediateRender: false }, T.viral + 0.25 + i * 0.03);
            tl.fromTo(c.tilt, { y: 0 }, { y: -16, duration: 0.11, ease: "power2.out", immediateRender: false }, T.viral - 0.03 + i * 0.03);
            tl.fromTo(c.tilt, { y: -16 }, { y: 0, duration: 0.2, ease: "bounce.out", immediateRender: false }, T.viral + 0.08 + i * 0.03);
          });
          // shared exit: the hub's light builds as the camera dives
          tl.fromTo(q("#s01-beam"), { opacity: 0.3, scaleY: 0.9 }, { opacity: 0.7, scaleY: 1.1, duration: DUR - T.dive, ease: "power2.in", immediateRender: false }, T.dive);
          tl.fromTo(q("#s01-flick"), { opacity: 0 }, { opacity: 0.45, duration: DUR - T.dive, ease: "power3.in", immediateRender: false }, T.dive);
          // seek-order safety: a backward seek first rewinds to 0, then plays forward to the target, so every frame
          // equals a clean forward render (chained fromTo tweens on one property otherwise depend on where the seek came from)
          (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=2700" />
    <title>AIpreneur mascot plate (4 s loop, transparent)</title>
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <script src="vendor/mascot3d.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 2160px; height: 2700px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 2160px; height: 2700px; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- the 3D mascot rendered alone on transparency, 2x the 1080x1350 carousel frame, as reusable "talking head footage" -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="2160" data-height="2700">
      <div id="mascot" class="clip" data-composition-id="mascot" data-composition-src="compositions/mascot.html" data-start="0" data-duration="4" data-track-index="1" data-width="2160" data-height="2700"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

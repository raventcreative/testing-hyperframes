<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Asisten AI vs Tim Ahli</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Versus set in CSS 3D (same look as the film's
     hook), robot rendered live with the project runtime. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t0 { position: absolute; left: 0; width: 1080px; top: 380px; text-align: center; font: italic 400 70px/1 PF; color: #DDE1EE; white-space: nowrap; }
  #t1 { position: absolute; left: 0; width: 1080px; top: 470px; text-align: center; font: 800 150px/1 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1 .p { display: inline-block; background: #fff; color: #212C5F; border-radius: 26px; padding: 0 22px; line-height: 1.12; }
  #t1 .y { color: #FED111; }
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1100px; perspective-origin: 540px 980px; }
  .cam { position: absolute; left: 540px; top: 1010px; transform-style: preserve-3d; transform: translateZ(-120px) rotateY(-6deg); }
  .pnl { position: absolute; top: -250px; width: 340px; height: 500px; border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; padding: 30px 32px 34px; }
  #pA { left: -347px; transform-origin: 100% 50%; transform: rotateY(28deg); color: #fff; background: linear-gradient(165deg, #4a60c0 0%, #2f4292 40%, #1c275c 100%); box-shadow: 0 40px 80px rgba(3,6,24,.55), 0 0 70px rgba(120,150,255,.22), inset 0 0 0 3px rgba(255,255,255,.28); }
  #pB { left: 7px; transform-origin: 0% 50%; transform: rotateY(-28deg); align-items: flex-end; text-align: right; color: #212C5F; background: linear-gradient(165deg, #FFEB6B 0%, #FED111 50%, #f0c000 100%); box-shadow: 0 40px 80px rgba(3,6,24,.5); }
  .k { font: 700 22px/1 PS; letter-spacing: .18em; opacity: .8; }
  .ib { margin-top: 22px; height: 92px; display: flex; align-items: center; }
  .bub { position: relative; width: 116px; height: 86px; border-radius: 24px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .bub img { width: 56px; }
  .avs { display: flex; } .avs i { display: flex; width: 74px; height: 74px; margin-left: -18px; border-radius: 50%; background: #212C5F; border: 4px solid #FED111; align-items: center; justify-content: center; } .avs i:first-child { margin-left: 0; }
  .avs i svg { width: 40px; height: 40px; }
  .sp { flex: 1; }
  .big { font: 800 190px/.8 Rubik; letter-spacing: -6px; white-space: nowrap; }
  #pB .big { font-size: 128px; letter-spacing: -4px; }
  .cap { margin-top: 20px; font: 600 28px/1 PS; white-space: nowrap; } #pA .cap { color: #DDE1EE; }
  .cap small { display: block; margin-top: 8px; font: 700 21px/1 PS; }
  #vs { position: absolute; left: -66px; top: -120px; width: 132px; height: 132px; border-radius: 50%; background: #fff; border: 8px solid #FED111; display: flex; align-items: center; justify-content: center;
        font: 800 52px/1 Rubik; color: #212C5F; transform: translateZ(220px); box-shadow: 0 24px 50px rgba(3,6,24,.55); }
  #t3 { position: absolute; left: 0; width: 1080px; top: 1370px; text-align: center; }
  #t3 span { display: inline-flex; align-items: center; gap: 14px; padding: 20px 34px; border-radius: 999px; background: #fff; font: 700 36px/1 PS; color: #212C5F; white-space: nowrap; }
  #t3 svg { width: 34px; height: 34px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t0">kapan cukup…</div>
  <div id="t1"><span class="p">AI</span> atau <span class="y">ahli?</span></div>
  <div class="stage"><div class="cam">
    <div class="pnl" id="pA"><div class="k">TANYA</div><div class="ib"><div class="bub"><img src="../assets/mp/mp_m.png" alt="" /></div></div><div class="sp"></div><div class="big">AI</div><div class="cap">asisten AI</div></div>
    <div class="pnl" id="pB"><div class="k">TANYA</div><div class="ib"><div class="avs"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></i><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></i><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></i></div></div><div class="sp"></div><div class="big">AHLI</div><div class="cap">tim ahli<small>sesuai layanan</small></div></div>
    <div id="vs">VS</div>
  </div></div>
  <div id="t3"><span>Ini bedanya<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: 900, y: 1640, h: 640, yaw: -22, roll: 0, headYaw: -18, headPitch: -12, headRoll: 10, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 40, fwd: 30, bend: 90, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.7, smile: 1, o: 0 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

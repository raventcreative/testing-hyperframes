<!doctype html>
<html
  lang="id"
  data-resolution="portrait"
  data-composition-variables='[
  {"id":"color-ink","type":"color","label":"Teks","default":"#800000"},
  {"id":"color-accent","type":"color","label":"Aksen emas","default":"#c9a24a"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ink: #800000;
        --color-accent: #c9a24a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f4dce0;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
      }
      #float { z-index: 1; }
      #hero { z-index: 2; }
      #endcard { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.5" data-width="1080" data-height="1920">
      <div
        id="float"
        class="clip"
        data-composition-id="float"
        data-composition-src="compositions/float.html"
        data-start="0"
        data-duration="9.65"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="hero"
        class="clip"
        data-composition-id="hero"
        data-composition-src="compositions/hero.html"
        data-start="9.3"
        data-duration="4.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="13.0"
        data-duration="3.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

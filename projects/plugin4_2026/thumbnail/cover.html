<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 4 plugin Claude Code</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<!-- IG Reels cover 1080x1920 on the client's navy background ("4 plugin sebelum vibe coding"): a CLAUDE CODE chip, the hook
     "4 PLUGIN / wajib sebelum vibe coding", a Claude Code terminal whose PLUGIN DOCK holds the 4 glowing cartridges (the reel's
     .dk-full look, scaled up: Superpowers cyan, Karpathy Skills violet, Caveman amber, Codex green), the mascot (host) presenting at
     bottom-left and the AI PRENEUR robot typing on its holo keyboard at bottom-right.
     Poppins 700/400, white + #01ccf7. Everything that matters sits inside the 4:5 profile-grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8783 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  #g1 { left: 40px; top: 300px; width: 1000px; height: 560px; background: radial-gradient(ellipse, rgba(48,93,143,.40), rgba(48,93,143,0) 66%); }
  #g2 { left: -60px; top: 700px; width: 1200px; height: 640px; background: radial-gradient(ellipse, rgba(1,204,247,.20), rgba(1,204,247,0) 62%); }
  #g3 { left: 140px; top: 1120px; width: 800px; height: 420px; background: radial-gradient(ellipse, rgba(1,204,247,.10), rgba(1,204,247,0) 64%); }
  .grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(../assets/brand/grain_256.png); opacity: .06; z-index: 40; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; filter: drop-shadow(0 2px 8px rgba(4,8,30,.55)); z-index: 30; }
  /* eyebrow chip with the Claude mark */
  #eyebrow { top: 366px; display: flex; justify-content: center; }
  #eyebrow > span { height: 60px; padding: 0 28px 0 10px; border-radius: 30px; display: flex; align-items: center; gap: 13px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.5); font: 700 22px/1 Poppins; letter-spacing: 4px; color: #6adfff; }
  #eyebrow .ic { width: 42px; height: 42px; border-radius: 50%; background: #fbf4ec; position: relative; box-shadow: 0 0 14px rgba(251,244,236,.35); }
  #eyebrow .ic img { position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; }
  /* the hook */
  #h1 { top: 440px; font: 700 212px/1 Poppins; letter-spacing: -7px; color: #fff; text-shadow: 0 8px 26px rgba(4,8,30,.5); }
  #h1 .n { display: inline-block; background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 46%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(0 0 28px rgba(1,204,247,.55)); margin-right: 30px; }
  #k1 { top: 664px; font: 400 62px/1 Poppins; letter-spacing: -1px; color: #e3edfa; }
  #k1 b { font-weight: 700; color: #01ccf7; text-shadow: 0 0 22px rgba(1,204,247,.45); letter-spacing: 1px; }
  /* sparkles */
  #sparks { position: absolute; inset: 0; z-index: 3; }
  .st { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #e3edfa; box-shadow: 0 0 10px rgba(227,237,250,.9); }
  .sp { position: absolute; z-index: 3; filter: drop-shadow(0 0 8px rgba(106,223,255,.8)); }
  /* the Claude Code terminal = the PLUGIN DOCK */
  #term { position: absolute; left: 44px; top: 768px; width: 992px; height: 430px; border-radius: 36px; z-index: 12;
    background: linear-gradient(180deg, rgba(9,15,46,.96), rgba(6,10,34,.96));
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12), 0 44px 90px -30px rgba(0,0,0,.85), 0 0 0 8px rgba(1,204,247,.07), 0 0 70px rgba(1,204,247,.22); }
  #term .bar { position: absolute; left: 0; top: 0; right: 0; height: 74px; border-bottom: 1.5px solid rgba(255,255,255,.08); display: flex; align-items: center; padding: 0 30px; }
  #term .dots { display: flex; gap: 11px; }
  #term .dots i { width: 16px; height: 16px; border-radius: 50%; }
  #term .ttl { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; justify-content: center; gap: 12px; font: 700 27px/1 Poppins; color: #fff; }
  #term .ttl img { width: 32px; height: 32px; }
  #term .cnt { margin-left: auto; height: 40px; padding: 0 16px; border-radius: 20px; display: flex; align-items: center; gap: 9px; background: rgba(61,220,151,.14);
    box-shadow: inset 0 0 0 1.5px rgba(61,220,151,.5); font: 700 20px/1 Poppins; color: #7cf0bd; letter-spacing: .5px; position: relative; z-index: 2; }
  #term .cnt i { width: 10px; height: 10px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 10px #3ddc97; }
  #term .pr { position: absolute; left: 36px; top: 96px; font: 400 29px/1 Poppins; color: #e3edfa; display: flex; align-items: center; gap: 14px; }
  #term .pr b { color: #01ccf7; font-weight: 700; }
  #term .pr .cur { width: 15px; height: 32px; border-radius: 3px; background: #01ccf7; box-shadow: 0 0 12px rgba(1,204,247,.8); }
  #term .pr .ok { margin-left: 10px; font: 400 23px/1 Poppins; color: #7cf0bd; }
  /* sockets + cartridges (the dock's .dk-full style, scaled up) */
  .slot { position: absolute; width: 456px; height: 132px; border-radius: 34px; background: rgba(2,5,20,.9);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.06), inset 0 8px 16px rgba(0,0,0,.65); }
  .cart { position: absolute; inset: 8px; border-radius: 27px; display: flex; align-items: center; gap: 16px; padding: 0 20px 0 16px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.30), inset 0 12px 22px rgba(255,255,255,.18), 0 10px 26px rgba(0,0,0,.30), 0 0 34px var(--gl), 0 0 80px var(--gl2); }
  .cart .ic { width: 76px; height: 76px; flex: 0 0 76px; border-radius: 22px; background: rgba(255,255,255,.2); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.34);
    display: flex; align-items: center; justify-content: center; color: #fff; }
  .cart .ic svg { width: 42px; height: 42px; display: block; }
  .cart .tx { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
  .cart .tx b { font: 700 37px/1 Poppins; color: #fff; white-space: nowrap; letter-spacing: -.5px; text-shadow: 0 1px 3px rgba(0,0,0,.22); }
  .cart .tx em { font-style: normal; height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; gap: 7px; background: rgba(4,10,40,.30);
    font: 400 20px/1 Poppins; color: #fff; white-space: nowrap; }
  .cart .tx em svg { width: 19px; height: 19px; display: block; }
  .badge { position: absolute; right: -10px; top: -12px; width: 44px; height: 44px; border-radius: 50%; background: #2da44e; color: #fff; padding: 9px;
    box-shadow: 0 0 0 4px #070c2a, 0 4px 12px rgba(0,0,0,.35); z-index: 3; }
  .badge svg { width: 100%; height: 100%; display: block; }
  #term .led { position: absolute; left: 120px; right: 120px; bottom: -3px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(1,204,247,0), #6adfff 30%, #6adfff 70%, rgba(1,204,247,0));
    box-shadow: 0 0 18px 4px rgba(1,204,247,.55); }
  /* robot's holo keyboard */
  #kb { position: absolute; left: 0; top: 0; width: 300px; height: 100px; margin: -50px 0 0 -150px; opacity: .9; transform-origin: 50% 50%; z-index: 23; }
  #kb .pl { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, rgba(1,204,247,.30), rgba(1,204,247,.10));
    box-shadow: 0 0 0 1.5px rgba(106,223,255,.7), 0 0 26px rgba(1,204,247,.55), inset 0 0 18px rgba(1,204,247,.25); }
  #kb .ks { position: absolute; left: 16px; top: 13px; width: 268px; height: 74px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
  #kb .ks i { display: block; border-radius: 4px; background: rgba(160,235,255,.22); box-shadow: inset 0 0 0 1px rgba(160,235,255,.35); }
  #kb .ks i.on { background: rgba(220,250,255,.95); box-shadow: 0 0 10px rgba(1,204,247,.95); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #r { z-index: 21; } #m { z-index: 22; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div><div id="g3" class="glow"></div>
  <div id="sparks"></div>
  <div id="term">
    <div class="bar"><span class="dots"><i style="background:#e5484d"></i><i style="background:#ffb35c"></i><i style="background:#3ddc97"></i></span>
      <span class="cnt"><i></i>4/4 plugin</span></div>
    <div class="ttl"><img src="../assets/icons/lobe-claude-color.svg" alt="">Claude Code</div>
    <div class="pr"><b>&gt;</b><span>/plugin install</span><span class="cur"></span></div>
    <div id="slots"></div>
    <div class="led"></div>
  </div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <div id="kb"><div class="pl"></div><div class="ks" id="keys"></div></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><span class="ic"><img src="../assets/icons/lobe-claude-color.svg" alt=""></span>CLAUDE CODE</span></div>
  <div id="h1" class="ctr"><span class="n">4</span>PLUGIN</div>
  <div id="k1" class="ctr"><b>WAJIB</b> sebelum vibe coding</div>
  <div class="grain"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D;
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  // ---- lucide icons (ISC), inlined (stroke currentColor) — same paths as compositions/dock.html
  const SV = (d, w = 2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const IC = {
    zap: '<path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/>',
    file: '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
    shrink: '<path d="m15 15 6 6m-6-6v4.8m0-4.8h4.8"/><path d="M9 19.8V15m0 0H4.2M9 15l-6 6"/><path d="M15 4.2V9m0 0h4.8M15 9l6-6"/><path d="M9 4.2V9m0 0H4.2M9 9 3 3"/>',
    eye: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="1"/><path d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
  };
  const ARR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24" fill="#ffd66b" stroke="#ffd66b" stroke-width="1.5" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>';
  // ---- the 4 cartridges in their sockets (2 x 2), terminal-relative
  {
    const C = [
      ["Superpowers", "#01ccf7", "#0a6fd0", "rgba(1,204,247,.55)", "rgba(1,204,247,.22)", IC.zap, `300K+ ${STAR}`],
      ["Karpathy Skills", "#9d8cff", "#5a3fe0", "rgba(157,140,255,.55)", "rgba(157,140,255,.22)", IC.file, "CLAUDE.md · 4 aturan"],
      ["Caveman", "#ffb35c", "#e2712a", "rgba(255,179,92,.55)", "rgba(255,179,92,.22)", IC.shrink, `63 ${ARR} 20 token`],
      ["Codex", "#3ddc97", "#0f9a62", "rgba(61,220,151,.55)", "rgba(61,220,151,.22)", IC.eye, "/codex:review"],
    ];
    const X = [28, 508], Y = [146, 290];
    document.getElementById("slots").innerHTML = C.map(([n, c1, c2, gl, gl2, ic, sub], k) =>
      `<div class="slot" id="s${k}" style="left:${X[k % 2]}px;top:${Y[k >> 1]}px"><div class="cart" style="--c1:${c1};--c2:${c2};--gl:${gl};--gl2:${gl2}">` +
      `<span class="ic">${SV(ic)}</span><span class="tx"><b>${n}</b><em>${sub}</em></span></div><i class="badge">${SV(IC.check, 3)}</i></div>`).join("");
  }
  // ---- sparkles + a few dots (seeded), never inside the logo / chip / hook / terminal
  {
    let h = "";
    for (let i = 0; i < 46; i++) {
      const x = 24 + rnd() * 1032, y = 120 + rnd() * 660, s = 0.45 + rnd() * 0.8, o = 0.25 + rnd() * 0.5;
      if ((x > 60 && x < 1020 && y > 430 && y < 740) || (x > 290 && x < 790 && y > 300 && y < 440)) continue;
      h += `<i class="st" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;opacity:${o.toFixed(2)};transform:scale(${s.toFixed(2)})"></i>`;
    }
    const SP = [[180, 400, 30], [930, 392, 26], [1028, 600, 20], [52, 560, 22], [1010, 760, 16], [80, 250, 16], [960, 230, 18]];
    for (const [x, y, s] of SP) h += `<svg class="sp" style="left:${x - s / 2}px;top:${y - s / 2}px" width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0Z" fill="#eaf8ff"/></svg>`;
    document.getElementById("sparks").innerHTML = h;
  }
  document.getElementById("keys").innerHTML = Array.from({ length: 30 }, (_, i) => `<i class="${[3, 7, 12, 16, 21, 25, 28].includes(i) ? "on" : ""}"></i>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    const fx = P("rx", "842"), fy = P("ry", "1560"), h = P("rh", "360");
    rb.setView({ fx, fy, h, pitch: 5 });
    // typing on the holo keyboard (robot.html "type" gesture at full weight)
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0.05, ry: P("bry", "-0.12"), rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] + P("rhx", "0.1"), HF[1] + P("rhy", "-0.16"), HF[2]], hand_L: [0.55, 0, 0], hand_R: [0.6, 0, 0] },
      offs: { hand_L: [-0.09, -0.06, 0.15], hand_R: [0.09, -0.07, 0.15], head: [0, 0, 0] },
      face: { blink: 0, gaze: [P("gx", "-0.24"), P("gy", "0.12")], happy: P("hap", "0.8"), squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.4, shadow: false });
    rb.render();
    const kb = document.getElementById("kb"), x = fx - 0.06 * h + P("kx", "0"), y = fy - 0.1 * h + P("ky", "0");
    kb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) perspective(600px) rotateX(52deg) scale(${P("ks", "1")})`;
  }
  async function buildMascot() {
    const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.037, 0.034], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.037, 0.034], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [243, 186, 141], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "lidRing": 1.5, "browNy": 0.98, "headC": [0, 0.72, 0]};
    const src = await (await fetch("../compositions/mascot.html")).text();
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.9; o.color.setRGB(0.5, 0.86, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    // presenting the dock (mascot.html's "present" intent, sampled once the gesture is held)
    const DIR = M3.direct([["lihat", 0.3, 3.2, 1]], 6, { intents: [{ t: 0.3, action: q.get("act") || "point", side: q.get("side") || "right" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 6.05, { smooth: 1 });
    m.setView({ fx: P("mx", "300"), fy: P("my", "1912"), h: P("mh", "720"), yaw: 0, pitch: 4 });
    const pf = PERF(P("pt", "0.9")), B = Object.assign({}, pf.bones);
    const hd = B.head || [0, 0, 0];
    B.head = [hd[0] + P("hx", "0"), hd[1] + P("hy", "0"), hd[2] + P("hz", "0")];
    m.setState({ root: { x: pf.root.x, y: pf.root.y, ry: P("mry", "0.22"), rz: P("mrz", "0"), rx: 0, s: 1 }, bones: B,
      face: { blink: [0, 0], gaze: [P("mgx", "0"), P("mgy", "0")], mouthMix: 1, mouth: [P("mw", "0.03"), P("mo", "0.012"), P("ms", "0.012"), 0.5] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, q.get("nor") ? 0 : buildRobot(), buildMascot()]);
</script>
</body>
</html>

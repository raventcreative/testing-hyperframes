            s += '<rect x="96" y="344" width="28" height="104" rx="14" fill="url(#' + id + 'g)" stroke="rgba(41,75,119,0.25)" stroke-width="1.5"/><rect x="100" y="350" width="7" height="90" rx="3.5" fill="#ffffff" opacity="0.8"/>';
            s += '<g class="s03-cled">' + [370, 396, 422].map((y) => '<circle cx="110" cy="' + y + '" r="5" fill="#acc6e7" stroke="#6f93c3" stroke-width="1"/>').join("") + '</g>';
            // capital
            s += '<rect x="28" y="214" width="164" height="32" fill="url(#' + id + 'c)"/><ellipse cx="110" cy="246" rx="82" ry="9" fill="#b2c3da"/><ellipse cx="110" cy="214" rx="82" ry="10" fill="url(#' + id + 't)" stroke="rgba(41,75,119,0.18)" stroke-width="1.2"/>';
            s += '<path d="M30 236 H190" stroke="url(#' + id + 'h)" stroke-width="3"/>';
            // medallion (porcelain bezel, chrome ring, bolts, navy ring, frosted glass, accent)
            s += '<rect x="90" y="186" width="40" height="30" fill="url(#' + id + 'h)"/>';
            s += '<circle cx="117" cy="114" r="100" fill="#9fb3cf"/><circle cx="110" cy="106" r="100" fill="url(#' + id + 'b)" stroke="rgba(41,75,119,0.22)" stroke-width="1.6"/>';
            s += '<path d="M28 80 A88 88 0 0 1 84 18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>';
            s += '<circle cx="110" cy="106" r="86" fill="none" stroke="url(#' + id + 'h)" stroke-width="8"/>';
            for (let i = 0; i < 12; i++) { const a = rad(i * 30 + 15); s += '<circle cx="' + f1(110 + 94 * Math.cos(a)) + '" cy="' + f1(106 + 94 * Math.sin(a)) + '" r="3" fill="url(#' + id + 'h)" stroke="rgba(28,51,84,0.35)" stroke-width="0.8"/>'; }
            s += '<circle cx="110" cy="106" r="78" fill="url(#' + id + 'n)"/>';
            for (let i = 0; i < 36; i++) { const a = rad(i * 10); s += '<line x1="' + f1(110 + 68 * Math.cos(a)) + '" y1="' + f1(106 + 68 * Math.sin(a)) + '" x2="' + f1(110 + 74 * Math.cos(a)) + '" y2="' + f1(106 + 74 * Math.sin(a)) + '" stroke="rgba(203,219,244,' + (i % 9 === 0 ? 0.95 : 0.45) + ')" stroke-width="' + (i % 9 === 0 ? 3 : 1.5) + '"/>'; }
            s += '<circle cx="110" cy="106" r="62" fill="url(#' + id + 'g)"/>';
            s += '<g class="s03-sym" transform="translate(110 106)"><g class="s03-symi">' + SYM[k] + '</g></g>';
            s += '<circle class="s03-gflash" cx="110" cy="106" r="62" fill="#ffffff" opacity="0"/>';
            s += '<path d="M64 84 A50 50 0 0 1 96 54" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/><circle cx="146" cy="138" r="4" fill="#ffffff" opacity="0.8"/>';
            s += '</svg>';
            return s;
          }
          const cols = TH.map((th, k) => {
            const orb = mk("div", "s03-orb", P);
            const arm = mk("div", "s03-arm", orb);
            const ctr = mk("div", "s03-ctr", arm);
            const sh = mk("div", "s03-sh", ctr);
            const lift = mk("div", "s03-lift", ctr);
            const bb = mk("div", "s03-bb", lift);
            const riser = mk("div", "s03-riser", bb);
            const mglow = mk("div", "s03-mglow", riser);
            riser.insertAdjacentHTML("beforeend", colSVG(k));
            return { th, orb, arm, ctr, sh, lift, bb, riser, mglow, sym: riser.querySelector(".s03-symi"), gflash: riser.querySelector(".s03-gflash"), cled: riser.querySelectorAll(".s03-cled circle") };
          });

          // ---------- sparkles ----------
          const STAR = (c, st) => '<svg viewBox="0 0 40 40" width="100%" height="100%" style="overflow:visible"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="' + c + '" stroke="' + st + '" stroke-width="1.8" style="filter:drop-shadow(0 3px 4px rgba(28,51,84,0.25))"/></svg>';
          const sparks = [];
          for (let i = 0; i < 15; i++) {
            const sp = mk("div", "s03-abs s03-spark", q("#s03-fx"), i % 5 === 2 ? STAR("#f2c46d", "#ffffff") : STAR("#ffffff", "#6f93c3"));
            sp.style.left = "513px"; sp.style.top = "843px";
            const a = (i / 15) * Math.PI * 2 + rnd() * 0.35, r = 260 + rnd() * 220;
            sparks.push([sp, Math.cos(a) * r, Math.sin(a) * r * 0.8]);
          }

          // ================= timeline =================
          const ledOn = qa(".s03-ledon"), pips = qa(".s03-pip");
          const S0 = -30, S1 = 0, S2 = 5;               // turntable spin: hand-off from S02, settle, slow drift
          tl.set(q("#s03-plat"), { rotationX: TILT, transformOrigin: "50% 50%" }, 0);
          tl.set(q("#s03-spin"), { rotation: S0, transformOrigin: "50% 50%" }, 0);
          tl.set([q("#s03-shock"), q("#s03-shock2")], { z: 4, opacity: 0, scale: 0.4 }, 0);
          tl.set([q("#s03-flick"), q("#s03-cone")], { opacity: 0 }, 0);
          tl.set(q("#s03-rays"), { opacity: 0.25, scale: 0.9 }, 0);
          tl.set([ledOn, pips], { opacity: 0 }, 0);
          tl.set(sparks.map((s) => s[0]), { opacity: 0 }, 0);
          tl.set(q("#s03-dive"), { scale: 1, transformOrigin: "296px 800px" }, 0);
          const RISE = [[0, 0.42], [0.1, 0.12], [0.2, 0.0]];   // [start time, scaleY at start]
          cols.forEach((c, k) => {
            tl.set(c.orb, { rotation: c.th }, 0);
            tl.set(c.ctr, { rotation: -(c.th + S0) }, 0);
            tl.set(c.arm, { x: RS }, 0);
            tl.set(c.lift, { z: -26 }, 0);
            tl.set(c.bb, { rotationX: STAND, scale: k === 1 ? 1.06 : 1 }, 0);
            tl.set(c.riser, { scaleY: RISE[k][1] + 0.02, y: 0 }, 0);
            tl.set(c.sh, { x: 14, y: 14, scale: 0.7, opacity: 0.3 }, 0);
            tl.set(c.mglow, { opacity: 0, scale: 0.6 }, 0);
            tl.set(c.sym, { scale: 0, rotation: -30, transformOrigin: "50% 50%" }, 0);
          });

          // camera
          tl.fromTo(q("#s03-rise"), { y: 70, scale: 0.94, transformOrigin: "50% 55%" }, { y: 0, scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s03-cam"), { scale: 1, y: 0, transformOrigin: "50% 50%" }, { scale: 1.06, y: -14, duration: T.exit, ease: "sine.inOut", immediateRender: false }, 0);
          tl.fromTo(q("#s03-spin"), { rotation: S0 }, { rotation: S1, duration: 1.55, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s03-spin"), { rotation: S1 }, { rotation: S2, duration: DUR - 1.55, ease: "none", immediateRender: false }, 1.55);
          cols.forEach((c) => {
            tl.fromTo(c.ctr, { rotation: -(c.th + S0) }, { rotation: -(c.th + S1), duration: 1.55, ease: "power3.out", immediateRender: false }, 0);
            tl.fromTo(c.ctr, { rotation: -(c.th + S1) }, { rotation: -(c.th + S2), duration: DUR - 1.55, ease: "none", immediateRender: false }, 1.55);
          });
          tl.fromTo(q("#s03-floor"), { scaleX: 0.8, opacity: 0.5 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s03-farw"), { x: 20, y: 24 }, { x: -24, y: -30, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo(q("#s03-halo"), { rotation: 0 }, { rotation: 14, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo(q("#s03-near"), { x: -30, y: 50 }, { x: 40, y: -70, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo(q("#s03-cone"), { opacity: 0 }, { opacity: 0.6, duration: 0.6, ease: "power2.out", immediateRender: false }, 0.2);

          // three columns rise out of the turntable (frame 0: the left one is already emerging)
          cols.forEach((c, k) => {
            const [t0, s0] = RISE[k];
            tl.fromTo(c.riser, { scaleY: s0 + 0.02 }, { scaleY: 1, duration: 0.5, ease: "back.out(1.5)", immediateRender: false }, t0);
            tl.fromTo(c.lift, { z: -26 }, { z: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, t0);
            tl.fromTo(c.sh, { x: 14, y: 14, scale: 0.7, opacity: 0.3 }, { x: 22, y: 26, scale: 1, opacity: 0.8, duration: 0.5, ease: "power3.out", immediateRender: false }, t0);
            tl.fromTo(ledOn[k], { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t0 + 0.3);
          });

          // accents light one by one: layak -> left, kamu -> centre, coba -> right
          [T.layak, T.kamu, T.coba].forEach((t, k) => {
            const c = cols[k];
            tl.fromTo(c.gflash, { opacity: 0.95 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t - 0.04);
            tl.fromTo(c.sym, { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.34, ease: "back.out(2.2)", immediateRender: false }, t - 0.04);
            tl.fromTo(c.mglow, { opacity: 0, scale: 0.6 }, { opacity: 0.55, scale: 0.85, duration: 0.2, ease: "power2.out", immediateRender: false }, t - 0.04);
            tl.fromTo(c.mglow, { opacity: 0.55, scale: 0.85 }, { opacity: 0.12, scale: 0.8, duration: 0.4, ease: "power2.out", immediateRender: false }, t + 0.16);
            tl.fromTo(c.riser, { y: 0 }, { y: -12, duration: 0.1, ease: "power2.out", immediateRender: false }, t - 0.04);
            tl.fromTo(c.riser, { y: -12 }, { y: 0, duration: 0.28, ease: "bounce.out", immediateRender: false }, t + 0.06);
            c.cled.forEach((led, j) => tl.fromTo(led, { attr: { fill: "#acc6e7" } }, { attr: { fill: j === 2 ? "#9fd8c4" : "#ffffff" }, duration: 0.08, ease: "none", immediateRender: false }, t + 0.05 + j * 0.05));
          });

          // "sekarang" (1.35): light rays open behind the trio
          tl.fromTo(q("#s03-rays"), { opacity: 0.25, scale: 0.9, rotation: 0 }, { opacity: 0.75, scale: 1, rotation: 8, duration: 0.6, ease: "power2.out", immediateRender: false }, T.sekarang);
          // "ada" (1.74): small anticipation dip
          tl.fromTo(q("#s03-punch"), { scale: 1, transformOrigin: "50% 60%" }, { scale: 0.975, duration: T.tiga - T.ada, ease: "sine.inOut", immediateRender: false }, T.ada);

          // ---- APEX "tiga" (2.04) ----
          const A = T.tiga;
          tl.fromTo(q("#s03-punch"), { scale: 0.975 }, { scale: 1.055, duration: 0.1, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s03-punch"), { scale: 1.055 }, { scale: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false }, A + 0.1);
          cols.forEach((c, k) => {
            tl.fromTo(c.mglow, { opacity: 0.12, scale: 0.8 }, { opacity: 1, scale: 1.15, duration: 0.14, ease: "power2.out", immediateRender: false }, A - 0.02 + k * 0.02);
            tl.fromTo(c.mglow, { opacity: 1, scale: 1.15 }, { opacity: 0.5, scale: 0.95, duration: 0.4, ease: "power2.out", immediateRender: false }, A + 0.14 + k * 0.02);
            tl.fromTo(c.sym, { scale: 1 }, { scale: 1.18, duration: 0.1, ease: "power2.out", immediateRender: false }, A + k * 0.02);
            tl.fromTo(c.sym, { scale: 1.18 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)", immediateRender: false }, A + 0.1 + k * 0.02);
          });
          pips.forEach((p, k) => tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, A - 0.03 + k * 0.03));
          tl.fromTo(q("#s03-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s03-shock2"), { opacity: 0.7, scale: 0.3 }, { opacity: 0, scale: 1.35, duration: 0.55, ease: "power2.out", immediateRender: false }, A + 0.07);
          tl.fromTo(q("#s03-flick"), { opacity: 0 }, { opacity: 0.45, duration: 0.05, ease: "none", immediateRender: false }, A - 0.02);
          tl.fromTo(q("#s03-flick"), { opacity: 0.45 }, { opacity: 0.18, duration: 0.06, ease: "none", immediateRender: false }, A + 0.03);
          tl.fromTo(q("#s03-flick"), { opacity: 0.18 }, { opacity: 0.38, duration: 0.05, ease: "none", immediateRender: false }, A + 0.09);
          tl.fromTo(q("#s03-flick"), { opacity: 0.38 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, A + 0.14);
          tl.fromTo(q("#s03-cone"), { opacity: 0.6 }, { opacity: 0.9, duration: 0.2, ease: "power2.out", immediateRender: false }, A - 0.05);
          tl.fromTo(q("#s03-rays"), { opacity: 0.75, scale: 1 }, { opacity: 1, scale: 1.08, duration: 0.3, ease: "power2.out", immediateRender: false }, A);
          sparks.forEach(([sp, dx, dy], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: 0.5 + (i % 3) * 0.28, opacity: 0, rotation: 90, duration: 0.7, ease: "power3.out", immediateRender: false }, A + i * 0.01);
          });

          // ---- exit: whip-push into the LEFT column's lens (S04 = Pomelli scanner lens) ----
          tl.fromTo(q("#s03-dive"), { scale: 1 }, { scale: 3.6, duration: DUR - T.exit, ease: "power3.in", immediateRender: false }, T.exit);
          tl.fromTo(cols[0].gflash, { opacity: 0 }, { opacity: 0.55, duration: DUR - T.exit, ease: "power2.in", immediateRender: false }, T.exit);
          tl.fromTo(q("#s03-near"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, T.exit);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>

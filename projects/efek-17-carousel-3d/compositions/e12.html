  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const eio = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const back = (x) => { x = clamp(x, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const H = window.HFP;
      const $ = (id) => document.getElementById(id);
      $("e12-bd").innerHTML = H.backdropHTML("e12b");
      $("e12-chrome").innerHTML = H.chromeHTML("e12c", 12, "Green Screen");

      const ROWS = [["Rekam 3 video", 0], ["Edit pakai AI", 1], ["Upload & jadwal", 2]];
      $("e12-rows").innerHTML = ROWS.map((r, i) => `<div class="e12-row" id="e12-row${i}" style="top:${86 + i * 90}px">
          <div class="e12-box" id="e12-box${i}"></div><span id="e12-txt${i}">${r[0]}</span>
          ${i === 1 ? '<span class="e12-tag" id="e12-tag1" style="background:rgba(0,201,255,0.14);color:#0089b8">JALAN</span>' : ""}</div>` +
        (i < 2 ? `<div style="position:absolute;left:26px;right:26px;top:${86 + i * 90 + 84}px;height:2px;background:#edf2f8"></div>` : "")).join("");
      const CK = '<svg width="40" height="40" viewBox="0 0 40 40" style="position:absolute;left:0;top:0"><path d="M11 20.5 L17.5 27 L29 13.5" fill="none" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const setBox = (i, done, active) => {
        const b = $("e12-box" + i);
        b.style.background = done ? "#00c9ff" : "#ffffff";
        b.style.boxShadow = done ? "0 6px 14px rgba(0,201,255,0.35)" : active ? "inset 0 0 0 3px #00c9ff" : "inset 0 0 0 3px #c7d4e3";
        b.innerHTML = done ? CK : "";
        $("e12-txt" + i).style.color = done ? "#7f93b3" : "#0d1a3d";
        $("e12-txt" + i).style.textDecoration = done ? "line-through" : "none";
      };
      let eq = "";
      for (let i = 0; i < 25; i++) eq += `<rect x="${i * 10}" width="5" rx="2.5" fill="#00c9ff"/>`;
      $("e12-eq").innerHTML = eq;
      const eqBars = Array.from($("e12-eq").children);

      const green = $("e12-green"), app = $("e12-app"), sweep = $("e12-sweep"), fw = $("e12-figwrap"), key = $("e12-keytag");
      const STAG = [["e12-tlabel", 1.02], ["e12-timer", 1.06], ["e12-tbar", 1.14], ["e12-focus", 1.1], ["e12-tasks", 1.18], ["e12-line", 1.4], ["e12-player", 1.5]];
      function render(t) {
        // wipes: room → green (0.25–0.55), green → app (0.85–1.2); exit: both peel back right → left (3.35–3.7)
        const g = eio(seg(t, 0.25, 0.55)), a = eio(seg(t, 0.85, 1.2)), ex = eio(seg(t, 3.35, 3.7));
        const gx = 1080 * g * (1 - ex), ax = 1080 * a * (1 - ex);
        green.style.clipPath = "inset(0 " + (1080 - gx).toFixed(1) + "px 0 0)";
        app.style.clipPath = "inset(0 " + (1080 - ax).toFixed(1) + "px 0 0)";
        green.style.visibility = gx > 0.5 ? "visible" : "hidden";
        app.style.visibility = ax > 0.5 ? "visible" : "hidden";
        let sx = -1, so = 0;
        if (t > 0.25 && t < 0.55) { sx = gx; so = Math.sin(Math.PI * seg(t, 0.25, 0.55)); }
        else if (t > 0.85 && t < 1.2) { sx = ax; so = Math.sin(Math.PI * seg(t, 0.85, 1.2)); }
        else if (t > 3.35 && t < 3.7) { sx = ax; so = Math.sin(Math.PI * seg(t, 3.35, 3.7)); }
        sweep.style.left = sx.toFixed(1) + "px"; sweep.style.opacity = (sx >= 0 ? clamp(so * 1.6, 0, 1) : 0).toFixed(3);
        // presenter: re-placed lower & to the right so the timer and list read clearly
        const mv = eio(seg(t, 0.5, 0.98)) * (1 - eio(seg(t, 3.35, 3.85)));
        // default framing (scale 0.78, feet y 1160) → app framing (scale 0.66, feet y 1250, centred x 760)
        const s = 0.78 - 0.12 * mv, dx = 220 * mv, dy = -44 + 90 * mv;
        fw.style.transformOrigin = "540px 1204px";
        fw.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
        const sh = a * (1 - ex);
        fw.style.filter = sh > 0.01 ? "drop-shadow(-22px 16px 16px rgba(13,26,61," + (0.3 * sh).toFixed(3) + "))" : "none";
        const k = eo(seg(t, 0.45, 0.62)) * (1 - seg(t, 0.92, 1.05));
        key.style.opacity = k.toFixed(3); key.style.transform = "translateY(" + ((1 - k) * 14).toFixed(1) + "px)";
        // app content staggers in after the key, leaves together before the peel
        for (const [id, t0] of STAG) {
          const p = back(seg(t, t0, t0 + 0.4)), o = eo(seg(t, t0, t0 + 0.25)) * (1 - seg(t, 3.22, 3.4));
          const el = $(id); el.style.opacity = o.toFixed(3);
          el.style.transform = "translateY(" + ((1 - p) * 30).toFixed(1) + "px)";
        }
        for (let i = 0; i < 3; i++) {
          const t0 = 1.28 + i * 0.08, o = eo(seg(t, t0, t0 + 0.25));
          const row = $("e12-row" + i); row.style.opacity = o.toFixed(3); row.style.transform = "translateX(" + ((1 - o) * -20).toFixed(1) + "px)";
        }
        const tg = eio(seg(t, 1.6, 1.85));
        $("e12-knob").style.left = (4 + 32 * tg).toFixed(1) + "px";
        $("e12-tog").style.background = tg > 0.5 ? "#00c9ff" : "#c7d4e3";
        const done1 = t >= 2.25;
        setBox(0, true, false); setBox(1, done1, !done1); setBox(2, false, done1);
        const pop = done1 ? back(seg(t, 2.25, 2.5)) : 1;
        $("e12-box1").style.transform = "scale(" + (done1 ? 0.6 + 0.4 * pop : 1).toFixed(3) + ")";
        $("e12-tag1").style.opacity = done1 ? (1 - seg(t, 2.25, 2.4)).toFixed(3) : "1";
        $("e12-count").textContent = done1 ? "2/3" : "1/3";
        // countdown: 49:57 → ticks once per second
        const sec = 57 - Math.max(0, Math.floor(t - 1.0));
        $("e12-timer").textContent = "49:" + String(sec).padStart(2, "0");
        $("e12-tfill").style.width = (470 * (0.36 + 0.01 * (57 - sec))).toFixed(1) + "px";
        for (let i = 0; i < eqBars.length; i++) {
          const h = 5 + 15 * (0.5 + 0.5 * Math.sin(t * 7.3 + i * 1.7) * Math.cos(t * 3.1 + i * 0.6));
          eqBars[i].setAttribute("y", (11 - h / 2).toFixed(1)); eqBars[i].setAttribute("height", h.toFixed(1));
        }
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e12"] = tl;
    })();
  </script>

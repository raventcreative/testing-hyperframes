<!doctype html>
<html><head><meta charset="UTF-8" />
<!-- Topic logos as REAL 3D objects (client rule): Simple Icons path (CC0) -> SVGLoader -> ExtrudeGeometry with a small bevel, brand colour.
     ?name=github|claude&frame=i&n=N&size=S  renders frame i of an N-frame turntable (spin = 360 deg about Y with a small tilt), or
     ?name=..&still=1 one 3/4 view. Driven by tools/logo3d.cjs, which packs the frames into a sprite sheet for the scenes / cover. -->
<script src="logos.js"></script>
<script type="importmap">{"imports":{"three":"./three/three.module.min.js","three/addons/":"./three/addons/"}}</script>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const name = q.get("name") || "github", size = +(q.get("size") || 400);
const Lg = window.LOGOS[name];
const cv = document.getElementById("c"); cv.width = cv.height = size;
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(size, size, false); r.setClearColor(0, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const k = new THREE.DirectionalLight(0xffffff, 2.3); k.position.set(2, 3, 5); scene.add(k);
const rim = new THREE.DirectionalLight(0x8fb4ff, 1.6); rim.position.set(-4, 2, -3); scene.add(rim);
const data = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="${Lg.path}"/></svg>`);
const shapes = data.paths.flatMap((p) => SVGLoader.createShapes(p));
const geo = new THREE.ExtrudeGeometry(shapes, { depth: 3, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.35, bevelSegments: 4, curveSegments: 24 });
geo.center(); geo.scale(1, -1, 1); geo.computeVertexNormals();
const col = new THREE.Color(Lg.hex);
const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.32, metalness: 0.05, emissive: col, emissiveIntensity: 0.05 }));
const g = new THREE.Group(); g.add(mesh); scene.add(g);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 200); cam.position.set(0, 0, 60); cam.lookAt(0, 0, 0);
if (q.get("still")) { g.rotation.set(0.12, -0.42, 0.04); }
else { const n = +(q.get("n") || 36), i = +(q.get("frame") || 0); g.rotation.set(0.14, (i / n) * Math.PI * 2, 0.03); }
r.render(scene, cam); window.READY = true;
</script></body></html>

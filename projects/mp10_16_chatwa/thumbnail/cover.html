<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Siapin 4 Data Ini</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero object = the film's 3D "DATA USAHA" archive box, open, with the 4-item checklist card rising out of it (all ticked). No numbers. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 384px; font: 800 168px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 742px; font: italic 400 64px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: -60px; top: 860px; width: 900px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.18), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 380px 1200px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .bxo { background: linear-gradient(180deg, #4a60c0 0%, #34489f 50%, #2a3c8c 100%); }
  .bxs { background: linear-gradient(180deg, #2d3f8c 0%, #22306f 100%); }
  .bxi { background: linear-gradient(180deg, #1d2a63 0%, #121a45 100%); }
  .bxib { background: #0f163c; }
  .bxr { background: #8396ea; }
  .hole { position: absolute; left: 50%; top: 26px; width: 110px; height: 26px; margin-left: -55px; border-radius: 13px; background: #0b1232; box-shadow: inset 0 5px 7px rgba(0,0,0,.55); }
  .blab { position: absolute; left: 50%; top: 70px; width: 300px; height: 120px; margin-left: -150px; border-radius: 14px; background: #FBF8EF; box-shadow: 0 5px 0 rgba(0,0,0,.2); text-align: center; padding-top: 18px; }
  .blab b { display: block; font: 800 32px/1 Rubik; letter-spacing: 1px; color: #212C5F; white-space: nowrap; }
  .cks { display: flex; justify-content: center; gap: 14px; margin-top: 16px; }
  .cks i { position: relative; width: 38px; height: 38px; border-radius: 9px; background: #FED111; border: 3px solid #26367A; }
  .cks i svg { position: absolute; left: -3px; top: -3px; width: 38px; height: 38px; }
  .card { position: absolute; background: #fff; border-radius: 22px; padding: 28px 26px; box-shadow: 0 30px 60px rgba(3,6,24,.4); }
  .card .k { font: 700 22px/1 PS; letter-spacing: .16em; color: #5B6478; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 12px; height: 72px; border-bottom: 2px solid #E8EBF3; white-space: nowrap; overflow: hidden; }
  .row:first-of-type { margin-top: 12px; }
  .row i { flex: none; width: 44px; height: 44px; border-radius: 12px; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .row i svg { width: 28px; height: 28px; }
  .row b { font: 700 26px/1 PS; color: #161D3A; }
  .row em { flex: none; font: 800 24px/1 Rubik; font-style: normal; color: #8E99C2; width: 20px; }
  .paper { position: absolute; border-radius: 12px; }
  #t3 { position: absolute; left: 640px; top: 860px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 32px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(3deg); }
  #t3 svg { width: 30px; height: 30px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">SIAPIN<br /><span>4 DATA</span></div>
  <div id="t2">sebelum cek gambaran pajakmu</div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <div id="t3">Udah lengkap?<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // world origin = floor centre of the box; camera above and to the left
  w.style.transform = "translate3d(360px, 1500px, 0px) rotateX(-20deg) rotateY(20deg)";
  const W = 500, H = 240, D = 300, T = 14;
  const P = (cls, wd, ht, tr) => mk("div", "pl " + cls, w, `left:${-wd / 2}px; top:${-ht / 2}px; width:${wd}px; height:${ht}px; transform:${tr};`);
  P("bxib", W - 2 * T, D - 2 * T, `translate3d(0px, ${-T}px, 0px) rotateX(90deg)`);
  P("bxi", W - 2 * T, H - T, `translate3d(0px, ${-(H + T) / 2}px, ${-D / 2 + T}px)`);
  P("bxi", D - 2 * T, H - T, `translate3d(${-W / 2 + T}px, ${-(H + T) / 2}px, 0px) rotateY(90deg)`);
  P("bxi", D - 2 * T, H - T, `translate3d(${W / 2 - T}px, ${-(H + T) / 2}px, 0px) rotateY(-90deg)`);
  P("bxs", D, H, `translate3d(${-W / 2}px, ${-H / 2}px, 0px) rotateY(-90deg)`);
  P("bxs", D, H, `translate3d(${W / 2}px, ${-H / 2}px, 0px) rotateY(90deg)`);
  // files inside: two papers peeking behind the checklist card
  const p1 = P("paper", 380, 420, `translate3d(-40px, -240px, -100px) rotateZ(-6deg)`); p1.style.background = "linear-gradient(180deg, #fff 0 18%, #F3F5FA 18%)";
  p1.innerHTML = '<div style="position:absolute;left:24px;top:22px;width:46px;height:46px;border-radius:13px;background:#212C5F"></div><div style="position:absolute;left:84px;top:30px;width:200px;height:12px;border-radius:6px;background:#C9CFE0"></div><div style="position:absolute;left:84px;top:52px;width:130px;height:10px;border-radius:5px;background:#E1E5EE"></div>';
  const p2 = P("paper", 360, 420, `translate3d(70px, -222px, -60px) rotateZ(7deg)`); p2.style.background = "linear-gradient(180deg, #26367A 0 20%, #fff 20%)";
  p2.innerHTML = '<div style="position:absolute;left:24px;top:22px;width:46px;height:46px;border-radius:13px;background:#FED111"></div><div style="position:absolute;left:84px;top:30px;width:190px;height:12px;border-radius:6px;background:rgba(255,255,255,.7)"></div>';
  // the checklist card (rises out of the box)
  const card = P("card", 456, 540, `translate3d(-6px, -360px, 20px) rotateX(6deg) rotateZ(-2.5deg)`);
  card.innerHTML = `<div class="k">CHECKLIST DATA USAHA</div>` + [["1", "Catatan penjualan"], ["2", "Catatan biaya"], ["3", "Mutasi rekening usaha"], ["4", "Nota &amp; bukti transfer"]].map(([n, t]) => `<div class="row"><em>${n}</em><i>${CHECK}</i><b>${t}</b></div>`).join("");
  P("bxr", W, T, `translate3d(0px, ${-H}px, ${D / 2 - T / 2}px) rotateX(90deg)`);
  P("bxr", T, D, `translate3d(${-W / 2 + T / 2}px, ${-H}px, 0px) rotateX(90deg)`);
  P("bxr", T, D, `translate3d(${W / 2 - T / 2}px, ${-H}px, 0px) rotateX(90deg)`);
  P("bxi", W - 2 * T, H - T, `translate3d(0px, ${-(H + T) / 2}px, ${D / 2 - T}px) rotateY(180deg)`);
  const fr = P("bxo", W, H, `translate3d(0px, ${-H / 2}px, ${D / 2}px)`);
  fr.innerHTML = `<div class="hole"></div><div class="blab"><b>DATA USAHA</b><div class="cks">${[1, 2, 3, 4].map(() => `<i>${CHECK}</i>`).join("")}</div></div>`;
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no checklist row may be wider than its card
    document.querySelectorAll(".row").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror ROW OVERFLOW", e.textContent); });
    r.render({ x: 900, y: 1520, h: 660, yaw: -24, roll: 0, headYaw: -18, headPitch: -10, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 140, fwd: 26, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.4, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

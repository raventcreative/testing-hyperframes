<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@400&display=block"
      rel="stylesheet"
    />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --blue: #087bff;
        --white: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: Inter, Arial, Helvetica, sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ---------- background texture ---------- */
      #glow {
        background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(8, 123, 255, 0.22), rgba(8, 123, 255, 0) 70%);
        opacity: 0;
      }
      #grid {
        background-image:
          linear-gradient(rgba(8, 123, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(8, 123, 255, 0.07) 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: 0;
        -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 20%, transparent 80%);
        mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 20%, transparent 80%);
      }
      #code {
        opacity: 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 15%, #000 75%);
        mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 15%, #000 75%);
      }
      .code-col {
        position: absolute;
        top: -400px;
        width: 260px;
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 22px;
        color: var(--blue);
        white-space: pre;
        opacity: 0.35;
      }
      #scanlines {
        background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 4px);
        pointer-events: none;
      }

      /* ---------- camera ---------- */
      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }

      /* ---------- monogram ---------- */
      #mono {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 716px;
        height: 627px;
        margin-left: -358px;
        margin-top: -313px;
        overflow: visible;
      }
      #mono .stroke {
        fill: none;
        stroke: var(--blue);
        stroke-width: 3.4;
        stroke-linejoin: miter;
      }

      /* ---------- lockup ---------- */
      #lockup {
        position: absolute;
        left: 240px;
        top: 300px;
        width: 1440px;
        height: 308px;
      }
      #lockup .slice,
      #lockup .ghost {
        position: absolute;
        inset: 0;
      }
      #lockup img {
        display: block;
        width: 1440px;
        height: 308px;
      }
      #lockup .ghost {
        mix-blend-mode: screen;
        opacity: 0;
      }
      .logo-bg {
        background: url("assets/fk-logo.png") center / 1440px 308px no-repeat;
      }
      #ghost-b {
        filter: brightness(0.6) sepia(1) hue-rotate(180deg) saturate(8);
      }
      #ghost-w {
        filter: brightness(1.6) grayscale(1);
      }
      #halo {
        position: absolute;
        left: 160px;
        top: 230px;
        width: 1600px;
        height: 450px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(8, 123, 255, 0.28), transparent 70%);
        opacity: 0;
      }

      /* ---------- tagline ---------- */
      #pill {
        position: absolute;
        left: 50%;
        top: 676px;
        height: 72px;
        padding: 0 44px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: var(--blue);
        box-shadow:
          0 0 28px rgba(8, 123, 255, 0.65),
          0 0 80px rgba(8, 123, 255, 0.35);
        display: flex;
        align-items: center;
        overflow: hidden;
        opacity: 0;
      }
      #pill-text {
        color: var(--white);
        font-weight: 800;
        font-size: 32px;
        letter-spacing: 0.22em;
        margin-right: -0.22em;
        white-space: nowrap;
      }
      #pill-shine {
        position: absolute;
        top: 0;
        left: -160px;
        width: 120px;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      }
      #url {
        position: absolute;
        left: 0;
        width: 1920px;
        top: 778px;
        text-align: center;
        color: var(--white);
        font-weight: 500;
        font-size: 34px;
        letter-spacing: 0.12em;
      }
      #url span {
        display: inline-block;
        opacity: 0;
      }

      /* ---------- light FX ---------- */
      .sweep {
        position: absolute;
        left: 0;
        width: 1920px;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(8, 123, 255, 0.9) 30%, #fff 50%, rgba(8, 123, 255, 0.9) 70%, transparent);
        box-shadow:
          0 0 18px rgba(8, 123, 255, 0.9),
          0 0 60px rgba(8, 123, 255, 0.5);
        opacity: 0;
      }
      .sweep-v {
        position: absolute;
        top: 0;
        width: 3px;
        height: 1080px;
        background: linear-gradient(180deg, transparent, rgba(8, 123, 255, 0.9) 30%, #fff 50%, rgba(8, 123, 255, 0.9) 70%, transparent);
        box-shadow: 0 0 22px rgba(8, 123, 255, 0.9);
        opacity: 0;
      }
      .trail {
        position: absolute;
        height: 2px;
        width: 520px;
        background: linear-gradient(90deg, transparent, rgba(8, 123, 255, 0.85), #cfe5ff);
        box-shadow: 0 0 14px rgba(8, 123, 255, 0.8);
        border-radius: 2px;
        opacity: 0;
      }
      #flash {
        background: #087bff;
        mix-blend-mode: screen;
        opacity: 0;
      }
      #vignette {
        background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.85) 100%);
        pointer-events: none;
      }
      #fade {
        background: #000;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="layer">
        <div id="camera">
          <div id="glow" class="layer"></div>
          <div id="grid" class="layer"></div>
          <div id="code" class="layer" data-layout-allow-overflow></div>

          <!-- FK monogram traced 1:1 from the supplied logo (source pixel coordinates) -->
          <svg id="mono" viewBox="0 75 400 336" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="fk-clip">
                <polygon points="83,81 213,81 198,144 134,144 122,196 183,196 168,258 107,258 74,404 8,404" />
                <polygon points="233,81 297,81 268,210 327,81 392,81 322,230 326,404 259,404 259,252 223,404 159,404" />
              </clipPath>
              <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff" stop-opacity="0.85" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
            </defs>
            <g id="mono-fill" opacity="0">
              <polygon fill="#087BFF" points="83,81 213,81 198,144 134,144 122,196 183,196 168,258 107,258 74,404 8,404" />
              <polygon fill="#087BFF" points="233,81 297,81 268,210 327,81 392,81 322,230 326,404 259,404 259,252 223,404 159,404" />
            </g>
            <g clip-path="url(#fk-clip)">
              <g id="sheen-a"><rect x="-60" y="60" width="70" height="380" fill="url(#sheen)" transform="skewX(-18)" /></g>
              <g id="sheen-b"><rect x="-60" y="60" width="40" height="380" fill="url(#sheen)" transform="skewX(-18)" /></g>
            </g>
            <path id="stroke-f" class="stroke" d="M83,81 L213,81 L198,144 L134,144 L122,196 L183,196 L168,258 L107,258 L74,404 L8,404 Z" />
            <path id="stroke-k" class="stroke" d="M233,81 L297,81 L268,210 L327,81 L392,81 L322,230 L326,404 L259,404 L259,252 L223,404 L159,404 Z" />
          </svg>

          <div id="halo"></div>

          <!-- original logo lockup, untouched asset -->
          <div id="lockup">
            <div id="ghost-b" class="ghost logo-bg"></div>
            <div id="ghost-w" class="ghost logo-bg"></div>
            <div id="logo-main" class="slice"><img src="assets/fk-logo.png" alt="Freddie Kashawan" /></div>
            <div class="slice glitch logo-bg" style="clip-path: inset(0 0 82% 0)"></div>
            <div class="slice glitch logo-bg" style="clip-path: inset(18% 0 66% 0)"></div>
            <div class="slice glitch logo-bg" style="clip-path: inset(34% 0 48% 0)"></div>
            <div class="slice glitch logo-bg" style="clip-path: inset(52% 0 30% 0)"></div>
            <div class="slice glitch logo-bg" style="clip-path: inset(70% 0 12% 0)"></div>
            <div class="slice glitch logo-bg" style="clip-path: inset(88% 0 0 0)"></div>
          </div>

          <div id="pill"><span id="pill-text">AI FOR BUSINESS</span><div id="pill-shine"></div></div>
          <div id="url"></div>
        </div>

        <div id="sweep-1" class="sweep"></div>
        <div id="sweep-2" class="sweep"></div>
        <div id="sweep-v" class="sweep-v"></div>
        <div id="trail-1" class="trail" style="top: 214px"></div>
        <div id="trail-2" class="trail" style="top: 866px"></div>
        <div id="trail-3" data-layout-allow-overflow class="trail" style="top: 618px; width: 380px"></div>
        <div id="trail-4" class="trail" style="top: 132px; width: 300px"></div>
        <div id="flash" class="layer"></div>
        <div id="scanlines" class="layer"></div>
        <div id="fade" class="layer"></div>
      </div>
    </div>

    <script>
      // ---------- deterministic setup (no Math.random) ----------
      let seed = 20261016;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      const tokens = [
        "const", "await", "prompt", "model", "=>", "{}", "agent", "flow", "0x087BFF",
        "render()", "scale", "brand", "ai.run", "token", "vector", "deploy", "fk", "ROI",
        "content", "auto", "pipeline", "=", "true", "gen", "seed", "build", "ship()",
      ];
      const codeLayer = document.getElementById("code");
      const cols = [];
      [40, 330, 1320, 1580].forEach((left, c) => {
        const el = document.createElement("div");
        el.className = "code-col";
        el.style.left = left + "px";
        let txt = "";
        for (let i = 0; i < 80; i++) {
          let line = "";
          const n = 2 + Math.floor(rand() * 4);
          for (let j = 0; j < n; j++) line += tokens[Math.floor(rand() * tokens.length)] + " ";
          txt += (i % 7 === 0 ? "// " : "  ") + line + "\n";
        }
        el.textContent = txt;
        codeLayer.appendChild(el);
        cols.push(el);
      });

      const urlEl = document.getElementById("url");
      "freddiekashawan.com".split("").forEach((ch) => {
        const s = document.createElement("span");
        s.textContent = ch;
        urlEl.appendChild(s);
      });

      const strokes = ["#stroke-f", "#stroke-k"].map((sel) => {
        const p = document.querySelector(sel);
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        return { p, len };
      });

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // Open from black + slow cinematic camera push across the whole spot
      tl.to("#fade", { opacity: 0, duration: 0.5, ease: "none" }, 0);
      tl.fromTo("#camera", { scale: 1.08, y: 14 }, { scale: 1, y: 0, duration: 8, ease: "power1.out" }, 0);
      tl.fromTo("#camera", { rotation: -0.4 }, { rotation: 0, duration: 4, ease: "sine.inOut" }, 0);

      // Background texture
      tl.to("#grid", { opacity: 1, duration: 1.2 }, 0.1);
      tl.to("#code", { opacity: 0.45, duration: 1.4 }, 0.2);
      tl.to("#glow", { opacity: 1, duration: 2 }, 0.4);
      cols.forEach((el, i) => {
        tl.fromTo(el, { y: i % 2 ? -120 : 0 }, { y: i % 2 ? 60 : -180, duration: 8, ease: "none" }, 0);
      });

      // 1) FK self-draws as electric-blue outline
      tl.to(strokes[0].p, { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, 0.25);
      tl.to(strokes[1].p, { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, 0.45);
      tl.fromTo("#mono", { scale: 0.94 }, { scale: 1, duration: 2.4, ease: "power2.out" }, 0.2);
      tl.to("#trail-4", { opacity: 1, duration: 0.1 }, 0.6);
      tl.fromTo("#trail-4", { x: -320 }, { x: 2000, duration: 0.9, ease: "power2.in" }, 0.6);
      tl.to("#trail-4", { opacity: 0, duration: 0.1 }, 1.4);

      // 2) Fill to solid blue + light sweeps
      tl.to("#mono-fill", { opacity: 1, duration: 0.8, ease: "power1.inOut" }, 1.6);
      tl.fromTo("#sheen-a", { x: -40 }, { x: 520, duration: 0.9, ease: "power2.inOut" }, 1.85);
      tl.fromTo("#sheen-b", { x: -40 }, { x: 520, duration: 0.8, ease: "power2.inOut" }, 2.1);
      tl.to(".stroke", { strokeWidth: 0.8, duration: 0.6 }, 2.2);

      // 3) Monogram recedes into a faint watermark
      tl.to("#mono", { scale: 1.55, opacity: 0.06, duration: 0.9, ease: "power3.inOut" }, 2.75);
      tl.to("#sweep-1", { opacity: 1, duration: 0.05 }, 3.0);
      tl.fromTo("#sweep-1", { y: -10 }, { y: 1090, duration: 0.55, ease: "power2.in" }, 3.0);
      tl.to("#sweep-1", { opacity: 0, duration: 0.05 }, 3.5);

      // 4) Glitch reveal of the original lockup
      gsap.set("#lockup .slice", { opacity: 0 });
      tl.set("#lockup .glitch", { opacity: 1 }, 3.3);
      const glitchSteps = [3.3, 3.36, 3.42, 3.48, 3.54, 3.6, 3.66, 3.72];
      const slices = gsap.utils.toArray("#lockup .glitch");
      glitchSteps.forEach((t, k) => {
        const amp = 90 * (1 - k / glitchSteps.length);
        slices.forEach((s) => {
          tl.set(s, { x: (rand() - 0.5) * 2 * amp, opacity: rand() > 0.25 ? 1 : 0 }, t);
        });
        tl.set("#ghost-b", { opacity: 0.9, x: -amp * 0.35 }, t);
        tl.set("#ghost-w", { opacity: 0.6, x: amp * 0.25 }, t);
      });
      tl.set("#flash", { opacity: 0.18 }, 3.42);
      tl.set("#flash", { opacity: 0 }, 3.48);
      tl.set("#flash", { opacity: 0.1 }, 3.6);
      tl.set("#flash", { opacity: 0 }, 3.66);
      tl.set("#lockup .glitch", { x: 0, opacity: 0 }, 3.78);
      tl.set("#logo-main", { opacity: 1 }, 3.78);
      tl.to("#ghost-b", { opacity: 0, x: 0, duration: 0.25 }, 3.78);
      tl.to("#ghost-w", { opacity: 0, x: 0, duration: 0.25 }, 3.78);
      tl.to("#halo", { opacity: 1, duration: 0.6 }, 3.75);

      // Light trails ride in with the reveal
      tl.to(["#trail-1", "#trail-2"], { opacity: 1, duration: 0.1 }, 3.7);
      tl.fromTo("#trail-1", { x: -560 }, { x: 2000, duration: 0.85, ease: "power3.in" }, 3.7);
      tl.fromTo("#trail-2", { x: 2000, scaleX: -1 }, { x: -560, scaleX: -1, duration: 0.85, ease: "power3.in" }, 3.75);
      tl.to(["#trail-1", "#trail-2"], { opacity: 0, duration: 0.1 }, 4.5);

      // Vertical scan across the finished logo
      tl.to("#sweep-v", { opacity: 0.9, duration: 0.05 }, 4.0);
      tl.fromTo("#sweep-v", { x: 180 }, { x: 1740, duration: 0.9, ease: "power2.inOut" }, 4.0);
      tl.to("#sweep-v", { opacity: 0, duration: 0.1 }, 4.85);

      // Breathing logo pulse (scale stays tiny so the logo stays crisp)
      tl.to("#lockup", { scale: 1.012, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.0);
      tl.to("#halo", { opacity: 0.55, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.35);
      tl.to("#mono", { opacity: 0.09, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.8);

      // 5) Pill
      tl.fromTo("#pill", { opacity: 0, clipPath: "inset(0 50% 0 50% round 999px)" }, { opacity: 1, clipPath: "inset(0 0% 0 0% round 999px)", duration: 0.55, ease: "expo.out" }, 4.45);
      tl.fromTo("#pill-text", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 4.65);
      tl.fromTo("#pill-shine", { x: 0 }, { x: 620, duration: 0.8, ease: "power2.inOut" }, 5.0);
      tl.to("#trail-3", { opacity: 1, duration: 0.1 }, 4.5);
      tl.fromTo("#trail-3", { x: -420 }, { x: 2000, duration: 0.8, ease: "power2.in" }, 4.5);
      tl.to("#trail-3", { opacity: 0, duration: 0.1 }, 5.2);

      // 6) Website types in
      tl.fromTo("#url span", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.03 }, 5.05);

      // 7) Hold, final scan, fade to black
      tl.to("#sweep-2", { opacity: 0.7, duration: 0.05 }, 6.4);
      tl.fromTo("#sweep-2", { y: 1090 }, { y: -10, duration: 0.7, ease: "power2.inOut" }, 6.4);
      tl.to("#sweep-2", { opacity: 0, duration: 0.05 }, 7.05);
      tl.to("#fade", { opacity: 1, duration: 0.7, ease: "power2.in" }, 7.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

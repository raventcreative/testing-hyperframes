filter><filter id="s04-drop-s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#121532" flood-opacity=".25"/></filter><filter id="s04-inset" x="-10%" y="-10%" width="120%" height="120%"><feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer><feOffset dx="6" dy="8"/><feGaussianBlur stdDeviation="7" result="s04sh"/><feFlood flood-color="#121532" flood-opacity=".55"/><feComposite operator="in" in2="s04sh"/><feComposite operator="in" in2="SourceAlpha"/></filter></defs>

  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="s04"]');
      const q = (s) => R.querySelector(s);
      const qa = (s) => R.querySelectorAll(s);
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const D = Math.PI / 180, CX = 470, CY = 760;

      // heat fins (20)
      const fins = q("#s04-fins");
      for (let i = 0; i < 20; i++) el("rect", { x: 214 + i * 26, y: 438, width: 14, height: 46, rx: 6, fill: i % 5 === 0 ? "url(#s04-navy)" : "url(#s04-chromeV)", stroke: "#ffffff", "stroke-width": 1.5 }, fins);
      // vents x8 (4 each side of the plate)
      const vents = q("#s04-vents");
      for (let i = 0; i < 4; i++) { el("rect", { x: 182, y: 640 + i * 34, width: 62, height: 12, rx: 6, fill: "#c3d4ea" }, vents); el("rect", { x: 696, y: 640 + i * 34, width: 62, height: 12, rx: 6, fill: "#c3d4ea" }, vents); }
      // lens ticks (36) + aperture blades (8)
      const lt = q("#s04-lensticks");
      for (let i = 0; i < 36; i++) { const a = i * 10 * D, r1 = i % 9 === 0 ? 150 : 154; el("line", { x1: (CX + Math.cos(a) * r1).toFixed(1), y1: (CY + Math.sin(a) * r1).toFixed(1), x2: (CX + Math.cos(a) * 158).toFixed(1), y2: (CY + Math.sin(a) * 158).toFixed(1) }, lt); }
      const bl = q("#s04-blades");
      for (let i = 0; i < 8; i++) { const a = i * 45 * D, b = (i * 45 + 58) * D; el("line", { x1: (CX + Math.cos(a) * 96).toFixed(1), y1: (CY + Math.sin(a) * 96).toFixed(1), x2: (CX + Math.cos(b) * 40).toFixed(1), y2: (CY + Math.sin(b) * 40).toFixed(1) }, bl); }

      // rails with code bars (2 rows each, no text)
      const railsG = q("#s04-rails");
      const RY = [1130, 1240, 1350];
      const ROWS = [
        [[[0, 92], [108, 150], [274, 66], [356, 124]], [[30, 60], [106, 176], [298, 84]]],
        [[[40, 62], [118, 112], [246, 168]], [[40, 140], [196, 70], [282, 120], [418, 48]]],
        [[[0, 130], [146, 82], [244, 146]], [[30, 74], [120, 110], [246, 90], [352, 60]]]
      ];
      const bars = [[], [], []], glows = [], leds = [];
      RY.forEach((y, r) => {
        const g = el("g", { filter: "url(#s04-drop-s)" }, railsG);
        el("rect", { x: 128, y: y - 42, width: 636, height: 84, rx: 24, fill: "url(#s04-porc2)", stroke: "#ffffff", "stroke-width": 3 }, g);
        el("rect", { x: 112, y: y - 46, width: 34, height: 92, rx: 12, fill: "url(#s04-navy)" }, railsG);
        el("rect", { x: 750, y: y - 46, width: 34, height: 92, rx: 12, fill: "url(#s04-navy)" }, railsG);
        el("rect", { x: 186, y: y - 32, width: 552, height: 64, rx: 16, fill: "#e6eef9", stroke: "#c9d8ec", "stroke-width": 2 }, railsG);
        glows.push(el("rect", { class: "s04-rglow", x: 186, y: y - 32, width: 552, height: 64, rx: 16, fill: "url(#s04-railglow)" }, railsG));
        el("circle", { cx: 166, cy: y, r: 13, fill: "#ffffff", stroke: "#c9d8ec", "stroke-width": 2 }, railsG);
        leds.push(el("circle", { id: "s04-led" + r, cx: 166, cy: y, r: 8, fill: "#9fb6d6" }, railsG));
        ROWS[r].forEach((row, k) => row.forEach((b) => bars[r].push(el("rect", { class: "s04-bar", x: 202 + b[0], y: y + (k === 0 ? -22 : 4), width: b[1], height: 18, rx: 9, fill: (b[0] + b[1]) % 3 === 0 ? "#3b5f91" : "#274976" }, railsG))));
        el("rect", { x: 186, y: y - 30, width: 552, height: 5, rx: 2.5, fill: "#ffffff", opacity: .7 }, railsG);
      });
      // keycaps x9
      const keysG = q("#s04-keys"), keys = [];
      for (let i = 0; i < 9; i++) {
        const k = el("g", { class: "s04-key" }, keysG);
        el("rect", { x: 198 + i * 62, y: 1428, width: 52, height: 44, rx: 11, fill: "#9fb6d6" }, k);
        el("rect", { x: 198 + i * 62, y: 1424, width: 52, height: 40, rx: 11, fill: i === 4 || i === 8 ? "url(#s04-navy)" : "url(#s04-porc2)", stroke: "#ffffff", "stroke-width": 2 }, k);
        el("rect", { x: 210 + i * 62, y: 1430, width: 28, height: 5, rx: 2.5, fill: "#ffffff", opacity: .8 }, k);
        keys.push(k);
      }

      const sparks = qa(".s04-sp"), allBars = qa(".s04-bar");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- initial states ----------
      gsap.set("#s04-cam", { scale: 1 });
      gsap.set(allBars, { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(glows, { opacity: 0 });
      gsap.set(leds, { fill: "#9fb6d6" });
      gsap.set(["#s04-pm1", "#s04-pm2", "#s04-pm3"], { fill: "#5f7fa8" });
      gsap.set(keys, { y: 0 });
      gsap.set("#s04-glow", { opacity: 0.2, scale: 0.7, svgOrigin: "470 760" });
      gsap.set("#s04-aper", { scale: 1, rotation: 0, svgOrigin: "470 760" });
      gsap.set("#s04-machine", { scale: 1, svgOrigin: "470 1490" });
      gsap.set(["#s04-shock", "#s04-shockb"], { scale: 0.6, opacity: 0, svgOrigin: "470 760" });
      gsap.set(sparks, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s04-masc", { x: 0 });
      gsap.set("#s04-mimg", { rotation: 0, transformOrigin: "50% 100%" });
      gsap.set(["#s04-far1", "#s04-far2", "#s04-far3"], { x: 0 });
      gsap.set("#s04-near", { x: 0, y: 0, rotation: 0 });

      // ---------- camera: slow push, punch at apex, settle ----------
      tl.fromTo("#s04-cam", { scale: 1 }, { scale: 1.022, duration: 2.38, ease: "sine.inOut", immediateRender: false }, 0);
      tl.to("#s04-cam", { scale: 1.048, duration: 0.14, ease: "power3.out" }, 2.5);
      tl.to("#s04-cam", { scale: 1.04, duration: 0.36, ease: "power2.inOut" }, 2.66);
      tl.fromTo("#s04-far1", { x: 0 }, { x: -16, duration: 3.0, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s04-far2", { x: 0 }, { x: 14, duration: 3.0, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s04-far3", { x: 0 }, { x: -10, duration: 3.0, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s04-near", { x: 0, y: 0, rotation: 0 }, { x: 40, y: -18, rotation: 10, duration: 3.0, ease: "none", immediateRender: false }, 0);

      // ---------- code bars type in: rail 1, rail 2, then rail 3 (keys depress in sync) ----------
      let kIdx = 0;
      const typeRail = (list, t0, step) => list.forEach((b, i) => {
        const t = t0 + i * step;
        tl.fromTo(b, { scaleX: 0 }, { scaleX: 1, duration: 0.13, ease: "power2.out", immediateRender: false }, t);
        const key = keys[(kIdx * 4) % 9]; kIdx++;
        tl.fromTo(key, { y: 0 }, { y: 5, duration: 0.05, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
      });
      typeRail(bars[0], 0.12, 0.115);
      typeRail(bars[1], 0.95, 0.115);
      typeRail(bars[2], 1.78, 0.075);
      tl.fromTo("#s04-glow", { opacity: 0.2, scale: 0.7 }, { opacity: 0.38, scale: 0.8, duration: 1.8, ease: "sine.inOut", immediateRender: false }, 0.3);
      tl.fromTo("#s04-aper", { rotation: 0 }, { rotation: 30, duration: 2.2, ease: "sine.inOut", immediateRender: false }, 0.1);
      tl.fromTo("#s04-pm1", { fill: "#5f7fa8" }, { fill: "#dce8f6", duration: 0.1, immediateRender: false }, 0.92);
      tl.fromTo("#s04-pm2", { fill: "#5f7fa8" }, { fill: "#dce8f6", duration: 0.1, immediateRender: false }, 1.75);
      tl.fromTo("#s04-pm3", { fill: "#5f7fa8" }, { fill: "#dce8f6", duration: 0.1, immediateRender: false }, 2.3);

      // ---------- mascot SIDE leans toward the core ----------
      tl.fromTo("#s04-mimg", { rotation: 0 }, { rotation: -2.5, duration: 0.5, ease: "sine.inOut", immediateRender: false }, 0.95);
      tl.fromTo("#s04-masc", { x: 0 }, { x: -6, duration: 0.5, ease: "sine.inOut", immediateRender: false }, 0.95);
      tl.to("#s04-mimg", { rotation: -4, duration: 0.12, ease: "power2.out" }, 2.5);
      tl.to("#s04-mimg", { rotation: -2.5, duration: 0.35, ease: "power2.inOut" }, 2.64);

      // ---------- anticipation 2.35: lens contracts ----------
      tl.to("#s04-aper", { scale: 0.8, duration: 0.13, ease: "power2.in" }, 2.35);
      tl.to("#s04-glow", { scale: 0.55, opacity: 0.25, duration: 0.13, ease: "power2.in" }, 2.35);
      tl.to("#s04-machine", { scale: 0.992, duration: 0.13, ease: "power2.in" }, 2.35);

      // ---------- APEX 'kode' 2.5: all rails light, lens glows, shockwave ----------
      tl.to("#s04-aper", { scale: 1.08, duration: 0.1, ease: "power3.out" }, 2.5);
      tl.to("#s04-aper", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.62);
      tl.to("#s04-glow", { scale: 1.35, opacity: 1, duration: 0.1, ease: "power3.out" }, 2.5);
      tl.to("#s04-glow", { scale: 1.05, opacity: 0.85, duration: 0.35, ease: "power2.inOut" }, 2.62);
      tl.to("#s04-machine", { scale: 1.022, duration: 0.08, ease: "power2.out" }, 2.5);
      tl.to("#s04-machine", { scale: 1, duration: 0.2, ease: "power2.inOut" }, 2.6);
      tl.fromTo(glows, { opacity: 0 }, { opacity: 0.95, duration: 0.08, ease: "power2.out", stagger: 0.03, immediateRender: false }, 2.5);
      tl.to(glows, { opacity: 0.6, duration: 0.3, ease: "power2.inOut" }, 2.66);
      tl.fromTo(leds, { fill: "#9fb6d6" }, { fill: "#ffffff", duration: 0.08, stagger: 0.03, immediateRender: false }, 2.5);
      tl.fromTo(allBars, { attr: { fill: "#274976" } }, { attr: { fill: "#3f6fae" }, duration: 0.12, ease: "power2.out", immediateRender: false }, 2.5);
      tl.fromTo(["#s04-shock", "#s04-shockb"], { scale: 0.6, opacity: 0.85 }, { scale: 1.8, opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 2.5);
      tl.fromTo(sparks, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)", stagger: 0.03, immediateRender: false }, 2.5);
      tl.to(sparks, { scale: 0, opacity: 0, duration: 0.24, ease: "power2.in", stagger: 0.03 }, 2.75);

      window.__timelines["s04"] = tl;
    })();
  </script>

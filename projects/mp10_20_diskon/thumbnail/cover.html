<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Diskon Gede, Untung Ikut Gede?</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's quiz set: the hanging shop-promo tag (DISKON 30% · promo toko), the two answer lozenges A / B tilted in 3D,
     and a buzzer. No answer is given away and no other numbers are shown. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 384px; font: 800 168px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 742px; font: italic 400 72px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: 80px; top: 820px; width: 960px; height: 820px; background: radial-gradient(closest-side, rgba(254,209,17,.16), rgba(254,209,17,0)); }
  /* hanging promo tag (3D tilt) */
  #tagS { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1400px; perspective-origin: 860px 560px; }
  #tagW { position: absolute; left: 868px; top: 404px; width: 0; height: 0; transform-style: preserve-3d; transform: rotateY(-18deg) rotateZ(9deg); }
  .tag { position: absolute; left: -125px; top: -44px; width: 250px; height: 336px; }
  .tag .tb { position: absolute; inset: 0; background: linear-gradient(170deg, #FFE440 0%, #FED111 55%, #f2c200 100%); clip-path: polygon(0 18%, 50% 0, 100% 18%, 100% 100%, 0 100%); }
  .tag .ts { position: absolute; left: 14px; top: 22px; width: 250px; height: 336px; background: rgba(3,6,24,.45); clip-path: polygon(0 18%, 50% 0, 100% 18%, 100% 100%, 0 100%); filter: blur(8px); }
  .tag .th { position: absolute; left: 107px; top: 26px; width: 36px; height: 36px; border-radius: 50%; background: #212C5F; box-shadow: inset 0 3px 4px rgba(0,0,0,.45), 0 0 0 5px rgba(33,44,95,.22); }
  .tag .tk1 { position: absolute; left: 0; top: 96px; width: 250px; text-align: center; font: 800 32px/1 Rubik; letter-spacing: 4px; color: #212C5F; }
  .tag .tk2 { position: absolute; left: 0; top: 140px; width: 250px; text-align: center; font: 800 112px/1 Rubik; letter-spacing: -3px; color: #212C5F; }
  .tag .tk3 { position: absolute; left: 30px; top: 272px; width: 190px; height: 40px; border-radius: 20px; background: #212C5F; text-align: center; font: 700 22px/40px PS; letter-spacing: .06em; color: #FFE440; white-space: nowrap; }
  .tag .str { position: absolute; left: 123px; top: -150px; width: 4px; height: 194px; background: linear-gradient(180deg, rgba(221,225,238,0), rgba(221,225,238,.7)); border-radius: 2px; }
  /* answer lozenges, tilted in 3D */
  #lzS { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1500px; perspective-origin: 540px 1020px; }
  #lzW { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-style: preserve-3d; transform-origin: 540px 1020px; transform: rotateY(-12deg) rotateX(8deg); }
  .lz { position: absolute; left: 70px; width: 940px; height: 120px; filter: drop-shadow(0 26px 30px rgba(3,6,24,.45)); }
  .lz .ln { position: absolute; top: 58px; height: 4px; background: #FED111; border-radius: 2px; }
  .lz .ln.l { left: -70px; width: 74px; } .lz .ln.r { right: -70px; width: 74px; }
  .lz .ob { position: absolute; inset: 0; background: #FED111; clip-path: polygon(52px 0, calc(100% - 52px) 0, 100% 50%, calc(100% - 52px) 100%, 52px 100%, 0 50%); }
  .lz .ib { position: absolute; left: 6px; top: 6px; right: 6px; bottom: 6px; background: linear-gradient(180deg, #3a4ea8 0%, #212C5F 60%, #1a2458 100%); clip-path: polygon(48px 0, calc(100% - 48px) 0, 100% 50%, calc(100% - 48px) 100%, 48px 100%, 0 50%); }
  .lz .lt { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; gap: 26px; padding-left: 84px; white-space: nowrap; }
  .lz .lt b { flex: none; font: 800 60px/1 Rubik; color: #FED111; }
  .lz .lt span { font: 700 54px/1 Rubik; color: #fff; }
  .lz .lt svg { flex: none; width: 52px; height: 52px; }
  #lzA { top: 890px; } #lzB { top: 1040px; }
  /* buzzer */
  #bz { position: absolute; left: 96px; top: 1300px; width: 300px; height: 300px; }
  #bz .base { position: absolute; left: 10px; top: 150px; width: 280px; height: 120px; border-radius: 0 0 140px 140px / 0 0 60px 60px; background: linear-gradient(90deg, #1a2458, #3a4ea8 45%, #1a2458); }
  #bz .top { position: absolute; left: 10px; top: 110px; width: 280px; height: 84px; border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #5a6fd0, #2b3c8c); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); }
  #bz .dome { position: absolute; left: 50px; top: 40px; width: 200px; height: 120px; border-radius: 100px 100px 20px 20px / 110px 110px 20px 20px; background: radial-gradient(ellipse 60% 70% at 38% 28%, #ffffff, #FFE440 42%, #FED111 80%); box-shadow: 0 0 60px 18px rgba(254,209,17,.45); }
  #t3 { position: absolute; left: 430px; top: 1236px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 32px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(-3deg); }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">DISKON<br /><span>GEDE,</span></div>
  <div id="t2">untung ikut gede?</div>
  <div id="tagS"><div id="tagW"><div class="tag"><i class="str"></i><i class="ts"></i><i class="tb"></i><i class="th"></i><div class="tk1">DISKON</div><div class="tk2">30%</div><div class="tk3">promo toko</div></div></div></div>
  <div id="lzS"><div id="lzW">
    <div class="lz" id="lzA"><i class="ln l"></i><i class="ln r"></i><i class="ob"></i><i class="ib"></i><div class="lt"><b>A</b><span>Pasti naik</span><svg viewBox="0 0 24 24" fill="none" stroke="#FED111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div></div>
    <div class="lz" id="lzB"><i class="ln l"></i><i class="ln r"></i><i class="ob"></i><i class="ib"></i><div class="lt"><b>B</b><span>Belum tentu</span></div></div>
  </div></div>
  <div id="bz"><i class="base"></i><i class="top"></i><i class="dome"></i></div>
  <div id="t3">Jawab dulu: A atau B?</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no lozenge text may be wider than its bar, no headline wider than the frame margins
    document.querySelectorAll(".lz .lt").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror LOZENGE OVERFLOW", e.textContent); });
    ["#t1", "#t2", "#t3"].forEach((s) => { const b = document.querySelector(s).getBoundingClientRect(); if (b.left < 60 || b.right > 1020) console.log("pageerror EDGE", s, Math.round(b.left), Math.round(b.right)); });
    r.render({ x: 900, y: 1530, h: 660, yaw: -24, roll: 0, headYaw: -18, headPitch: -10, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 140, fwd: 26, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.4, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

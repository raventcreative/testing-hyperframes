        (function () {
          const R = document.querySelector('[data-composition-id="s11"]');
          const q = (s) => R.querySelector(s), qa = (s) => R.querySelectorAll(s);
          const NS = "http://www.w3.org/2000/svg";
          const sv = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
          const tl = gsap.timeline({ paused: true });
          const D = 1.5;

          // faint desk-mat grid + ruled paper lines (static detail, deliberately plain)
          const mg = q("#s11-matgrid");
          for (let x = 44; x < 968; x += 44) sv("line", { x1: x, y1: 0, x2: x, y2: 1080, stroke: "rgba(46,46,46,0.035)", "stroke-width": 1.5 }, mg);
          for (let y = 44; y < 1080; y += 44) sv("line", { x1: 0, y1: y, x2: 968, y2: y, stroke: "rgba(46,46,46,0.035)", "stroke-width": 1.5 }, mg);
          const rl = q("#s11-rules");
          for (let y = 260; y < 800; y += 56) sv("line", { x1: 0, y1: y, x2: 620, y2: y, stroke: "rgba(172,198,231,0.28)", "stroke-width": 1.5 }, rl);
          sv("line", { x1: 40, y1: 0, x2: 40, y2: 816, stroke: "rgba(172,198,231,0.35)", "stroke-width": 2 }, rl);

          // camera: subtle push-in so the flat frame never sits still
          tl.fromTo(q("#s11-stage"), { scale: 1.0, transformOrigin: "540px 900px" }, { scale: 1.055, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo(q("#s11-light"), { x: 0, opacity: 0.8 }, { x: 40, opacity: 1, duration: D, ease: "sine.inOut" }, 0);
          // clipboard settles (visible from frame 0)
          tl.fromTo(q("#s11-board"), { y: 46, rotation: -7, transformOrigin: "540px 960px" }, { y: 0, rotation: -4, duration: 0.42, ease: "power3.out" }, 0);
          tl.to(q("#s11-board"), { rotation: -3.6, duration: 1.08, ease: "sine.inOut" }, 0.42);
          tl.fromTo(q("#s11-pencil"), { x: 40, y: 10, rotation: -28, transformOrigin: "220px 30px" }, { x: 0, y: 0, rotation: -24, duration: 0.5, ease: "power3.out" }, 0.02);
          tl.to(q("#s11-pencil"), { x: -8, rotation: -23, duration: 0.98, ease: "sine.inOut" }, 0.52);
          tl.fromTo(q("#s11-penshadow"), { x: 40, rotation: -24, transformOrigin: "200px 13px" }, { x: -8, rotation: -23, duration: 1.5, ease: "power2.out" }, 0);

          // typewriter: "teks" @0.41, "biasa," @0.64
          const ch = qa(".s11-ch");
          const times = [0.41, 0.455, 0.5, 0.545, 0.6, 0.64, 0.68, 0.72, 0.76, 0.8, 0.84];

          // caret blink (plain, default)
          const caret = q("#s11-caret");
          [0, 0.2, 0.4, 0.88, 1.12, 1.36].forEach((t, i) => tl.set(caret, { opacity: i % 2 === 0 ? 1 : 0 }, t));
          tl.set(caret, { opacity: 1 }, 0.41);

          window.__timelines["s11"] = tl;
        })();

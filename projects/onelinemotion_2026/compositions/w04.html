          const by = HY + 730 * s, h = 1020 * s, d = palmD(by, h, lean, 77 + i * 31), sw = Math.max(1, Math.min(2.6, 6 * s + 0.6));

      { let m = ""; for (let i = 0; i < 10; i++) m += `<i class="${i < 4 ? "on" : ""}" id="w04-d${i}"></i>`; $("w04-dots").innerHTML = m; }

      [[0.2, "url(#w04-rgb1)", -12, 1.03], [0.2333, "url(#w04-rgb2)", 10, 1.03], [0.2667, "url(#w04-rgb3)", -5, 1.015], [0.3, "none", 0, 1]].forEach(([t, f, x, sx]) => tl.set(world, { filter: f, x, scaleX: sx }, t));

      ft([eT, eB], { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in" }, 0.2);

      // ---------------------------------------------------------------- parallax (linear, whole slot)
      const scroll = (el, v) => ft(el, { x: 0 }, { x: -v * D, duration: D, ease: "none" }, 0);
      scroll($("w04-stars"), 30); scroll($("w04-moon"), 22); scroll($("w04-far"), 50); scroll($("w04-near"), 130);
      PALMS.forEach(([s, x], i) => { const g = $("w04-p" + i); ft(g, { x }, { x: x - 905 * s * D, duration: D, ease: "none" }, 0); });
      // grid, sideways: the receding lines skew about the vanishing point (one line spacing per loop = 905 px/s at the bottom edge)
      {
        const n = 17, P = D / n, vl = $("w04-vl"), tk = (-S / GH).toFixed(5);
        I(vl, { attr: { transform: "matrix(1 0 0 1 0 0)" } });
        for (let k = 0; k < n; k++) ft(vl, { attr: { transform: "matrix(1 0 0 1 0 0)" } }, { attr: { transform: `matrix(1 0 ${tk} 1 0 0)` }, duration: P, ease: "none" }, k * P);

      {
        const n = 7, P = D / n;
        for (let k = 1; k <= 22; k++) {
          const r = $("w04-h" + k), a = { y: zy(k + 1) - zh(k + 1) / 2, height: zh(k + 1) }, b = { y: zy(k) - zh(k) / 2, height: zh(k) };
          const ez = (u) => (1 / (k + 1 - u) - 1 / (k + 1)) / (1 / k - 1 / (k + 1));
          I(r, { attr: a });
          for (let m = 0; m < n; m++) ft(r, { attr: a }, { attr: b, duration: P, ease: ez }, m * P);
        }
      }
      // CRT refresh band rolling down
      { const r = $("w04-roll"), n = 2, P = D / n; I(r, { y: -300 }); for (let k = 0; k < n; k++) ft(r, { y: -300 }, { y: 1920, duration: P, ease: "none" }, k * P); }
      // sun: rises a touch during the entry, sinks on "malam hari"
      const sun = $("w04-sun"), glow = $("w04-sunglow");
      I(sun, { y: 26 });
      ft(sun, { y: 26 }, { y: 0, duration: 1.0, ease: "power2.out" }, 0.1);
      ft(sun, { y: 0 }, { y: 44, duration: D - 1.62, ease: "sine.inOut" }, 1.62);

      for (let i = 0; i < 12; i++) {

      // ---------------------------------------------------------------- title: tubes ignite on their words, stutter + surge on "nyala"
      const flick = (el, t, seq) => seq.forEach(([dt, o]) => tl.set(el, { opacity: o }, t + dt));
      for (const [w, on, hot, t] of [["w04-t1", "w04-t1on", "w04-t1hot", 0.2], ["w04-t2", "w04-t2on", "w04-t2hot", 0.56]]) {
        const W = $(w), O = $(on), H = $(hot);

      ft(title, { y: 0 }, { y: -7, duration: 0.55, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.7);
      const chip = $("w04-chip"); I(chip, { opacity: 0, y: 14 }); ft(chip, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.5);
      const d3 = $("w04-d3"); I(d3, { scale: 1 }); ft(d3, { scale: 1 }, { scale: 1.8, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, 0.72);

        const a = { y: zy(z0) - 6, height: 12 }, b = { y: zy(z1) - 40, height: 80 };
        I(p, { attr: { y: a.y, height: 0 } });
        tl.set(p, { attr: a }, 1.13);

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Utang ke Supplier Jangan Cuma di Kepala</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero = the film's cartoon seller (our own flat drawing) with sticky notes orbiting the head; one note slips away. No numbers. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 380px; font: 800 158px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 80%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 712px; font: italic 400 64px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: -80px; top: 760px; width: 940px; height: 940px; background: radial-gradient(closest-side, rgba(254,209,17,.20), rgba(254,209,17,0)); }
  #ring { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  #head { position: absolute; left: 140px; top: 950px; width: 450px; height: 600px; }
  #head svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .note { position: absolute; left: 0; top: 0; width: 320px; height: 200px; padding: 38px 26px 0 28px; border-radius: 5px 5px 26px 5px;
          background: linear-gradient(165deg, #FFF29A 0%, #FFE440 52%, #F7D727 100%); box-shadow: 0 26px 40px rgba(3,6,24,.38), 0 2px 5px rgba(3,6,24,.2); transform-origin: 160px 100px; }
  .note.bl { background: linear-gradient(165deg, #F7F9FF 0%, #E4E9FA 55%, #D6DDF5 100%); }
  .note.cr { background: linear-gradient(165deg, #FFFBE8 0%, #FFF3BF 55%, #FBE79A 100%); }
  .note::before { content: ""; position: absolute; left: 50%; top: -14px; width: 116px; height: 34px; margin-left: -58px; background: rgba(255,255,255,.62); transform: rotate(-3deg); }
  .note::after { content: ""; position: absolute; right: 0; bottom: 0; width: 46px; height: 46px; border-radius: 0 0 26px 0; background: linear-gradient(135deg, rgba(255,255,255,0) 50%, rgba(19,27,64,.12) 50%, rgba(255,255,255,.55) 100%); }
  .note b { display: block; width: 266px; font: 700 19px/1 PS; letter-spacing: .12em; color: #26367A; text-transform: uppercase; white-space: nowrap; }
  .note i { display: block; width: 266px; margin-top: 16px; font: italic 400 40px/1.1 PF; color: #161D3A; white-space: nowrap; }
  .note.back { filter: blur(2.5px) brightness(.9); }
  .mline { position: absolute; height: 6px; border-radius: 3px; background: rgba(221,225,238,.45); transform-origin: 100% 50%; }
  #t3 { position: absolute; left: 620px; top: 1176px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 34px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(3deg); box-shadow: 0 18px 36px rgba(3,6,24,.4); }
  #t3 svg { width: 32px; height: 32px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">UTANG<br /><span>SUPPLIER</span></div>
  <div id="t2">jangan cuma di kepala</div>
  <div id="back"></div>
  <svg id="ring" viewBox="0 0 1080 1920"><path id="ringB" fill="none" stroke="rgba(221,225,238,.38)" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/></svg>
  <div id="head"></div>
  <svg id="ring2" viewBox="0 0 1080 1920" style="position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible"><path id="ringF" fill="none" stroke="rgba(254,209,17,.75)" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/></svg>
  <div id="front"></div>
  <div id="t3">Udah dicatat?<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  // the film's cartoon seller (same drawing as index.html), worried, looking up at the notes, a sweat drop
  const p = "k", H = 800;
  document.getElementById("head").innerHTML = `<svg viewBox="0 0 600 ${H}" width="450" height="600" xmlns="http://www.w3.org/2000/svg">
    <g fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round"><path d="M60,${H} L60,742 C60,652 162,600 300,600 C438,600 540,652 540,742 L540,${H} Z"/><ellipse cx="126" cy="398" rx="28" ry="40"/><ellipse cx="474" cy="398" rx="28" ry="40"/><ellipse cx="300" cy="380" rx="176" ry="196"/><path d="M122,372 C104,226 196,150 302,150 C416,150 500,228 480,372 Z"/></g>
    <path d="M60,${H} L60,742 C60,652 162,600 300,600 C438,600 540,652 540,742 L540,${H} Z" fill="#26367A"/>
    <path d="M196,606 C228,672 372,672 404,606" stroke="#3A4FA8" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M262,652 L256,724 M338,652 L344,724" stroke="#FED111" stroke-width="8" stroke-linecap="round"/><circle cx="256" cy="728" r="8" fill="#FED111"/><circle cx="344" cy="728" r="8" fill="#FED111"/>
    <path d="M258,520 L342,520 L342,616 C322,640 278,640 258,616 Z" fill="#E6AE8A"/>
    <g transform="rotate(-4 300 600)">
      <ellipse cx="126" cy="398" rx="28" ry="40" fill="#EFBF9C"/><ellipse cx="474" cy="398" rx="28" ry="40" fill="#EFBF9C"/>
      <ellipse cx="300" cy="380" rx="176" ry="196" fill="#F6CDA9"/>
      <path d="M122,372 C104,226 196,150 302,150 C416,150 500,228 480,372 C468,312 440,282 398,266 C356,300 262,306 204,278 C170,300 140,328 122,372 Z" fill="#1D2340"/>
      <path d="M300,168 C340,170 372,188 390,214" stroke="#39417A" stroke-width="9" fill="none" stroke-linecap="round" opacity=".7"/>
      <ellipse cx="196" cy="452" rx="32" ry="16" fill="#F09A86" opacity=".5"/><ellipse cx="404" cy="452" rx="32" ry="16" fill="#F09A86" opacity=".5"/>
      <path d="M302,408 Q288,438 308,442" stroke="#D48E70" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="240" cy="382" rx="34" ry="40" fill="#fff"/><ellipse cx="360" cy="382" rx="34" ry="40" fill="#fff"/>
      <circle cx="244" cy="372" r="17" fill="#161D3A"/><circle cx="364" cy="372" r="17" fill="#161D3A"/><circle cx="250" cy="364" r="5.5" fill="#fff"/><circle cx="370" cy="364" r="5.5" fill="#fff"/>
      <path d="M204,314 L266,298" stroke="#1D2340" stroke-width="12" stroke-linecap="round"/><path d="M334,298 L396,314" stroke="#1D2340" stroke-width="12" stroke-linecap="round"/>
      <path d="M256,492 Q271,478 286,492 Q300,506 314,492 Q329,478 344,492" stroke="#6E2F2A" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M488,250 C472,280 466,298 478,312 C490,326 512,318 512,296 C512,280 500,266 488,250 Z" fill="#A9CDF5" stroke="#fff" stroke-width="5"/>
    </g></svg>`;
  // the orbit: an ellipse around the crown; back notes are smaller and soft, front notes sharp; one note slips away bottom-left
  const CXr = 362, CYr = 1000, RX = 330, RY = 92;
  const ell = (a0, a1) => { const pts = []; for (let a = a0; a <= a1 + 0.01; a += 4) { const r = a * Math.PI / 180; pts.push(`${(CXr + RX * Math.sin(r)).toFixed(1)},${(CYr + RY * Math.cos(r)).toFixed(1)}`); } return "M" + pts.join(" L"); };
  document.getElementById("ringB").setAttribute("d", ell(90, 270)); document.getElementById("ringF").setAttribute("d", ell(-90, 90));
  const NOTE = (par, cls, k, t, x, y, s, r) => { const e = document.createElement("div"); e.className = "note " + cls; e.innerHTML = `<b>${k}</b><i>${t}</i>`;
    e.style.transform = `translate(${x - 160}px, ${y - 100}px) rotate(${r}deg) scale(${s})`; par.appendChild(e); return e; };
  const back = document.getElementById("back"), front = document.getElementById("front");
  NOTE(back, "bl back", "Ongkos jahit", "nanti dulu…", 196, 912, 0.6, 6);
  NOTE(back, "back", "Supplier benang", "udah lunas?", 552, 904, 0.6, -5);
  NOTE(front, "", "Supplier kain", "belum lunas", 150, 1046, 0.84, -9);
  NOTE(front, "cr", "Tukang sablon", "belum dibayar", 600, 1048, 0.84, 8);
  NOTE(front, "bl", "Supplier kemasan", "bayar separuh", 196, 1436, 0.72, -24);
  // motion lines behind the slipping note
  [[128, 1318, 110, 76], [172, 1330, 84, 78], [214, 1342, 60, 80]].forEach(([x, y, w, r]) => { const m = document.createElement("div"); m.className = "mline";
    m.style.cssText = `left:${x - w}px; top:${y}px; width:${w}px; transform: rotate(${r}deg);`; front.appendChild(m); });
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no note text may be wider than its note
    document.querySelectorAll(".note b, .note i").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror NOTE OVERFLOW", e.textContent); });
    r.render({ x: 880, y: 1560, h: 620, yaw: -26, roll: 0, headYaw: -20, headPitch: -12, headRoll: 6, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 128, fwd: 30, bend: 14, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.5, happy: 0, smile: 1, o: 0.35 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

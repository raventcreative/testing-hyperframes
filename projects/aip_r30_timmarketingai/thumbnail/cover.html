<!doctype html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Cover R30 — Tim marketing AI</title>
<!-- R30 cover (brand NAVY, per skills/cover-topik + aipreneur-reels-studio/references/thumbnails.md): the client's navy plate, white text,
     accent #01ccf7 only, white logo. Minimal: logo, one chip, 2-line headline, tagline, the 3D mascot (rendered live from the reel's
     own rig at a chosen moment, ?t=) and ONE topic logo in 3D above its head (Claude, Simple Icons CC0, extruded in logo3d.html).
     Chip "BLUEPRINT" = exactly what production/DM_MARKETING.md delivers. -->
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; }
  #g1 { left: 140px; top: 860px; width: 800px; height: 760px; background: radial-gradient(ellipse, rgba(1,204,247,.22), rgba(1,204,247,0) 64%); }
  .grain { position: absolute; inset: 0; background: url(../assets/brand/grain_256.png); opacity: .05; }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 430px; top: 170px; width: 220px; opacity: .95; }
  #chip { top: 286px; } #chip span { display: inline-block; padding: 14px 30px 16px 36px; border-radius: 34px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.55); font: 700 26px/1 Poppins; letter-spacing: 7px; color: #6adfff; }
  #h1 { top: 378px; font: 700 96px/1 Poppins; letter-spacing: -3px; color: #fff; }
  #h2 { top: 484px; font: 700 124px/1.05 Poppins; letter-spacing: -4px; padding-bottom: .15em;
        background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 50%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tag { top: 654px; font: 400 36px/1 Poppins; color: #e3edfa; }
  #tag b { font-weight: 700; color: #fff; }
  #ico { position: absolute; left: 415px; top: 728px; width: 250px; height: auto; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(1,204,247,.25)); }
  #ms { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style></head>
<body>
  <div class="plate"></div><div class="glow" id="g1"></div><div class="grain"></div>
  <canvas id="ms" width="1080" height="1920"></canvas>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR" />
  <div class="c" id="chip"><span>BLUEPRINT</span></div>
  <div class="c" id="h1">Tim Marketing AI</div>
  <div class="c" id="h2">Kamu Bosnya</div>
  <div class="c" id="tag">3 modul &middot; <b>tiap posting kamu yang setujui</b></div>
  <img id="ico" src="logo3d_claude_cut.png" alt="Claude" />
  <script>
    // the host = the reel's own mascot rig (compositions/mascot.html), re-framed to the centre, posed at the reel time ?t=
    (async () => {
      const q = new URLSearchParams(location.search), T = Number(q.get("t") || 12.6);
      if (q.get("mode") === "host") document.querySelectorAll("body > :not(#ms):not(script)").forEach((e) => (e.style.display = "none")), (document.body.style.background = document.documentElement.style.background = "transparent");
      window.VO_SCENES = window.VO_SCENES || [];
      let src = await (await fetch("../compositions/mascot.html")).text();
      src = src.slice(src.indexOf("<scr" + "ipt>") + 8, src.lastIndexOf("</scr" + "ipt>"));
      src = src.replace('document.getElementById("ms-canvas")', 'document.getElementById("ms")')
               .replace("const HOST = { fx: 392, fy: 2185, h: 1040, pitch: 4 };", "const HOST = { fx: 540, fy: 2235, h: 1080, pitch: 4 };")
               .replace(/assets\//g, "../assets/");
      new Function(src)();
      await window.__hf.buildReady.mascot;
      window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: T } }));
      await document.fonts.ready; await new Promise((r) => setTimeout(r, 300));
      window.COVER_READY = true;
    })();
  </script>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(assets/fonts/Poppins-Regular.ttf)}
@font-face{font-family:Poppins;font-weight:600;src:url(assets/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/Poppins-Bold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:url(assets/bg_light.webp) center/cover;padding:110px}
.logo{height:26px;display:block;position:relative;z-index:2}
.t1{margin-top:70px;font-size:120px;font-weight:700;line-height:.9;letter-spacing:-5px;color:#0a0d2c;position:relative;z-index:2}
.t2{font-size:186px;font-weight:700;line-height:.95;letter-spacing:-8px;background:linear-gradient(100deg,#0a0d2c 0%,#294b77 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:10px;position:relative;z-index:2}
.pill{margin-top:22px;display:inline-flex;align-items:center;gap:16px;padding:18px 32px 18px 26px;border-radius:100px;background:linear-gradient(100deg,#0a0d2c,#294b77);color:#fff;font-size:30px;font-weight:600;position:relative;z-index:2;box-shadow:0 24px 50px -26px rgba(10,13,44,.7)}
.pill svg{width:32px;height:32px}
#gl{position:absolute;left:110px;bottom:110px;height:640px;width:860px}
</style></head><body>
<section class="slide"><img class="logo" src="assets/logo_dark.png">
<div class="t1">comment</div><div class="t2">PROMPTS</div>
<div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>I'll DM you all five prompts</div>
<canvas id="gl" width="1720" height="1200"></canvas></section>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const cv=document.getElementById('gl');
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(860,640,false); r.setPixelRatio(2); r.toneMapping=THREE.ACESFilmicToneMapping; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
const sc=new THREE.Scene(); const pm=new THREE.PMREMGenerator(r); sc.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(30,860/640,0.1,100); cam.position.set(0.15,1.4,9.4); cam.lookAt(0,0.1,0);
const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(-2.5,8,6); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6; key.shadow.radius=8; sc.add(key); const fillL=new THREE.DirectionalLight(0xbfd6ff,0.6); fillL.position.set(5,2,4); sc.add(fillL);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:0.18})); fl.rotation.x=-Math.PI/2; fl.position.y=-1.5; fl.receiveShadow=true; sc.add(fl);
async function logoMesh(file,color){
  const txt=await (await fetch(file)).text(); const d=new SVGLoader().parse(txt);
  const shapes=[]; d.paths.forEach(p=>shapes.push(...SVGLoader.createShapes(p)));
  const g=new THREE.ExtrudeGeometry(shapes,{depth:2.2,bevelEnabled:true,bevelThickness:0.5,bevelSize:0.18,bevelSegments:5,curveSegments:32});
  g.center(); g.scale(0.062,-0.062,0.062);
  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:0.3,metalness:0.0,emissive:color,emissiveIntensity:0.12}));
}
async function tile(file,logoColor,tileColor,x,ry,rz){
  
  const grp=new THREE.Group();
  const box=new THREE.Mesh(new RoundedBoxGeometry(2.7,2.7,0.9,8,0.55),new THREE.MeshStandardMaterial({color:tileColor,roughness:0.45,metalness:0.02}));
  box.castShadow=true; grp.add(box);
  const m=await logoMesh(file,logoColor); m.position.z=0.62; m.castShadow=true; grp.add(m);
  grp.position.set(x,0.05,0); grp.rotation.set(-0.12,ry,rz); sc.add(grp);
}
await tile('assets/logos/claude.svg',0xD97757,0xf3ede4,-1.75,0.32,0.05);
await tile('assets/logos/html5.svg',0xE34F26,0x0f1530,1.3,-0.3,-0.06);
r.render(sc,cam); window.__ready=true;
</script></body></html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover R33 — WhatsApp × Claude (white, minimal)</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<script src="../vendor/mascot_face.js"></script>
<!-- R33 topic cover (cover-topik, WHITE brand theme like the reel): light plate (assets/brand/bg_1080x1920.png = brand/bg-light.png extended
     to 9:16), text gradient #0a0d2c -> #294b77, accent #294b77 (blue gradient #13307e -> #2f6bff for the headline word), dark logo. Minimal:
     logo · ONE chip · 2-line headline · tagline · the 3D mascot · the topic's logos in 3D above its head (WhatsApp + Claude = the topic pair;
     Simple Icons CC0 paths extruded in Three.js, thumbnail/logo3d.html -> assets/logos/*_still.png). No value hook (DM = setup guide +
     safety checklist). Render: node thumbnail/render_cover.cjs <out.png> [dsf] with a static server on :8833 serving the project root. -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f8fe; font-family: Poppins, sans-serif; color: #0a0d2c; -webkit-font-smoothing: antialiased; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  #g1 { position: absolute; left: 90px; top: 760px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 64%); }
  #g2 { position: absolute; left: 290px; top: 640px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(47,107,255,.16), rgba(47,107,255,0) 66%); }
  .grain { position: absolute; inset: 0; background: url(../assets/brand/grain_256.png); opacity: .035; mix-blend-mode: multiply; }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  .grad { background: linear-gradient(172deg, #0a0d2c 8%, #294b77 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .blue { background: linear-gradient(120deg, #13307e 10%, #2f6bff 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #logo { position: absolute; left: 432px; top: 196px; width: 216px; height: auto; }
  #chip { top: 290px; } #chip span { display: inline-block; padding: 14px 30px 16px 36px; border-radius: 34px; background: rgba(41,75,119,.08);
    box-shadow: inset 0 0 0 1.5px rgba(41,75,119,.45); font: 700 26px/1 Poppins; letter-spacing: 7px; color: #294b77; }
  #h1 { top: 380px; font: 700 108px/1.08 Poppins; letter-spacing: -3px; padding-bottom: .1em; }
  #h2 { top: 506px; font: 700 98px/1.08 Poppins; letter-spacing: -3px; padding-bottom: .15em; }
  #tag { top: 672px; font: 400 36px/1 Poppins; color: #5d6f8f; }
  #tag b { font-weight: 700; color: #294b77; }
  #ico, #ico2 { position: absolute; top: 760px; width: 270px; height: 270px; filter: drop-shadow(0 22px 30px rgba(10,13,44,.32)); } #ico { left: 262px; } #ico2 { left: 548px; }
  #x { position: absolute; left: 0; width: 1080px; top: 858px; text-align: center; font: 700 64px/1 Poppins; color: #294b77; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
  <div class="plate"></div><div id="g1"></div><div id="g2"></div><div class="grain"></div>
  <canvas id="m"></canvas>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR" />
  <div class="c" id="chip"><span>OPEN SOURCE</span></div>
  <div class="c" id="h1"><span class="grad">WhatsApp-mu</span></div>
  <div class="c" id="h2"><span class="blue">Nyambung Claude</span></div>
  <div class="c" id="tag">cari chat lama <b>cukup tanya</b> · cek <b>risikonya</b></div>
  <img id="ico" src="../assets/logos/whatsapp_still.png" alt="WhatsApp" /><img id="ico2" src="../assets/logos/claude_still.png" alt="Claude" />
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS, DPR = window.devicePixelRatio || 1;
  async function buildMascot() {
    const FACE = window.MASCOT_FACE;
    const DECALS = JSON.parse(JSON.stringify(window.MASCOT_DECALS).replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080 * DPR; cv.height = 1920 * DPR;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080 * DPR, height: 1920 * DPR, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.6; o.color.setRGB(0.72, 0.84, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 40, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 40.05, { smooth: 1 });
    m.setView({ fx: P("mx", "540") * DPR, fy: P("my", "2130") * DPR, h: P("mh", "1060") * DPR, yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    B.head = [-0.1, 0.0, 0.0]; B.neck = [-0.03, 0, 0];
    m.setState({ root: { x: 0, y: 0, ry: 0, rz: 0, rx: 0, s: 1 }, bones: B, face: { blink: [0, 0], gaze: [0, 0.01], mouthMix: 1, mouth: [0.04, 0.012, 0.005, 0.2] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, buildMascot()]);
</script>
</body>
</html>

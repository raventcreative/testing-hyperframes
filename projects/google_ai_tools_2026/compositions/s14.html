              <div class="s14-mbase"></div>
              <div class="s14-mstem"></div>
              <div class="s14-mring" id="s14-mring"></div>
              <div class="s14-mhead">
                <svg viewBox="0 0 72 72" width="72" height="72">
                  <rect x="23" y="17" width="26" height="5" rx="2.5" fill="#ffffff" /><rect x="23" y="50" width="26" height="5" rx="2.5" fill="#ffffff" />
                  <path d="M26 22 C26 32 33 33 33 36 C33 39 26 40 26 50 L46 50 C46 40 39 39 39 36 C39 33 46 32 46 22 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
                  <path d="M30 46 Q36 40 42 46 L42 49 L30 49 Z" fill="#f2c46d" />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="s14-fx">
          <div class="s14-abs s14-cone" id="s14-cone"></div>
          <div class="s14-abs s14-glow" id="s14-glow" style="left:295px;top:1120px"></div>
          <div class="s14-abs s14-shock" id="s14-shock" style="left:295px;top:1120px"></div>
          <div class="s14-abs s14-shock" id="s14-shock2" style="left:710px;top:1031px"></div>
          <div class="s14-abs s14-shock" id="s14-shock3" style="left:872px;top:742px"></div>
          <div id="s14-spks"></div>
          <div id="s14-motes"></div>
          <div class="s14-abs s14-fg" id="s14-fg1" style="left:-80px;top:1480px;width:260px;height:260px"></div>
          <div class="s14-abs s14-fg" id="s14-fg2" style="left:940px;top:400px;width:150px;height:150px"></div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "s14";
          const R = document.querySelector('[data-composition-id="' + ID + '"]');
          const q = (s) => R.querySelector(s), qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          const DUR = 4.3667;
          // verified local word starts
          const T = { opal: 0.2, juga: 0.57, dijadwalkan: 0.89, berhenti: 1.41, tanggal: 1.85, d17: 2.17, nov: 2.65, y2026: 3.2 };
          const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
          let seed = 1414;
          const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
          const NS = "http://www.w3.org/2000/svg";
          const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

          // ---------- micro detail: arch ticks + rail ticks ----------
          const at = q("#s14-archTicks");
          for (let i = 0; i <= 24; i++) {
            const a = Math.PI + (i / 24) * Math.PI, r0 = 262, r1 = i % 4 === 0 ? 248 : 255;
            svgEl("line", { x1: (540 + Math.cos(a) * r0).toFixed(1), y1: (720 + Math.sin(a) * r0).toFixed(1), x2: (540 + Math.cos(a) * r1).toFixed(1), y2: (720 + Math.sin(a) * r1).toFixed(1), stroke: "rgba(41,75,119,0.3)", "stroke-width": i % 4 === 0 ? 3 : 1.5, "stroke-linecap": "round" }, at);
          }
          const rt = q("#s14-railTicks");
          for (let i = 0; i <= 38; i++) {
            const x = 160 + i * 20, big = i % 5 === 0;
            svgEl("rect", { x: x - 1, y: big ? 1318 : 1324, width: 2, height: big ? 14 : 8, rx: 1, fill: big ? "rgba(41,75,119,0.4)" : "rgba(41,75,119,0.22)" }, rt);
          }

          // ---------- split-flap tiles ----------
          const bars = (w) => { let h = ""; const n = 1 + Math.floor(rnd() * 2); for (let i = 0; i < n; i++) h += '<i style="width:' + ((0.3 + rnd() * 0.4) * w).toFixed(0) + 'px;margin:6px 0"></i>'; return '<div>' + h + '</div>'; };
          const buildTile = (sel, finalTxt, fs, nIdle) => {
            const box = q(sel), W = +box.dataset.w, H = +box.dataset.h, h2 = H / 2;
            const states = ['']; for (let i = 0; i < nIdle; i++) states.push(bars(W)); states.push(finalTxt);
            const face = (html, bottom) => {
              const half = mk("div", "s14-half" + (bottom ? "" : " s14-t"), box, "width:" + W + "px;height:" + h2 + "px;" + (bottom ? "top:" + h2 + "px;border-radius:0 0 16px 16px;" : ""));
              const f = mk("div", "s14-face", half, "width:" + W + "px;height:" + H + "px;top:" + (bottom ? -h2 : 0) + "px;font-size:" + fs + "px");
              f.innerHTML = html;
              if (!bottom) mk("div", "s14-tshade", half, "top:0;height:" + h2 + "px;background:linear-gradient(180deg,rgba(255,255,255,0.4),rgba(255,255,255,0) 40%,rgba(28,51,84,0.06))");
              else mk("div", "s14-tshade", half, "top:0;height:22px;background:linear-gradient(180deg,rgba(28,51,84,0.22),rgba(28,51,84,0))");
              return half;
            };
            const tops = [], bots = [], fTop = [], fBot = [];
            states.forEach((s) => { tops.push(face(s, false)); bots.push(face(s, true)); });
            states.forEach((s, k) => { if (k < states.length - 1) fTop.push(face(s, false)); if (k > 0) fBot.push(face(s, true)); else fBot.push(null); });
            mk("div", "s14-seam", box, "top:" + (h2 - 2) + "px");
            mk("div", "s14-hinge", box, "left:-8px;top:" + (h2 - 13) + "px");
            mk("div", "s14-hinge", box, "right:-8px;top:" + (h2 - 13) + "px");
            tops.forEach((e, k) => tl.set(e, { autoAlpha: k === 0 ? 1 : 0 }, 0));
            bots.forEach((e, k) => tl.set(e, { autoAlpha: k === 0 ? 1 : 0 }, 0));
            fTop.forEach((e) => tl.set(e, { autoAlpha: 0, transformOrigin: "50% 100%", rotationX: 0, transformPerspective: 900, zIndex: 5 }, 0));
            fBot.forEach((e) => e && tl.set(e, { autoAlpha: 0, transformOrigin: "50% 0%", rotationX: 90, transformPerspective: 900, zIndex: 5 }, 0));
            return { box, tops, bots, fTop, fBot, n: states.length };
          };
          const flip = (o, k, t, d) => {
            // transition k -> k+1 starting at t; lands (fully settled) at t + d
            const h = d / 2;
            tl.set(o.tops[k + 1], { autoAlpha: 1 }, t);
            tl.set(o.tops[k], { autoAlpha: 0 }, t);
            tl.set(o.fTop[k], { autoAlpha: 1, rotationX: 0 }, t);
            tl.to(o.fTop[k], { rotationX: -90, duration: h, ease: "power2.in" }, t);
            tl.set(o.fTop[k], { autoAlpha: 0 }, t + h);
            tl.set(o.fBot[k + 1], { autoAlpha: 1, rotationX: 90 }, t + h);
            tl.to(o.fBot[k + 1], { rotationX: 0, duration: h, ease: "power2.out" }, t + h);
            tl.set(o.bots[k + 1], { autoAlpha: 1 }, t + d);
            tl.set(o.bots[k], { autoAlpha: 0 }, t + d);
            tl.set(o.fBot[k + 1], { autoAlpha: 0 }, t + d);
          };
          const tD = buildTile("#s14-tD", "17", 196, 2);
          const tM = buildTile("#s14-tM", "NOVEMBER", 60, 3);
          const tY = buildTile("#s14-tY", "2026", 94, 4);
          const FD = 0.16;
          // idle shuffles start on "tanggal", each tile LANDS on its spoken word
          [T.tanggal - 0.02, T.tanggal + 0.12].forEach((t, k) => flip(tD, k, t, FD));
          flip(tD, 2, T.d17 - FD, FD);
          [T.tanggal + 0.06, T.tanggal + 0.28, T.tanggal + 0.5].forEach((t, k) => flip(tM, k, t, FD));
          flip(tM, 3, T.nov - FD, FD);
          [T.tanggal + 0.12, T.tanggal + 0.4, T.tanggal + 0.68, T.tanggal + 0.98].forEach((t, k) => flip(tY, k, t, FD));
          flip(tY, 4, T.y2026 - FD, FD);

          // ---------- sparks / motes ----------
          const STAR = '<svg viewBox="0 0 40 40"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff" stroke="#acc6e7" stroke-width="1.5"/></svg>';
          const STARA = '<svg viewBox="0 0 40 40"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#fff7e2" stroke="#f2c46d" stroke-width="1.5"/></svg>';
          const mkSparks = (n, cx, cy, r0, r1) => {
            const arr = [];
            for (let i = 0; i < n; i++) {
              const sp = mk("div", "s14-abs s14-spk", q("#s14-spks"), "left:" + cx + "px;top:" + cy + "px");
              sp.innerHTML = i % 5 === 2 ? STARA : STAR;
              const a = (i / n) * Math.PI * 2 + rnd() * 0.5, r = r0 + rnd() * (r1 - r0);
              arr.push([sp, Math.cos(a) * r, Math.sin(a) * r * 0.9, 0.45 + rnd() * 0.65]);
            }
            return arr;
          };
          const spA = mkSparks(16, 295, 1120, 200, 360), spB = mkSparks(10, 710, 1031, 160, 300), spC = mkSparks(8, 710, 1209, 120, 240);
          for (let i = 0; i < 14; i++) {
            const m = mk("div", "s14-abs s14-mote", q("#s14-motes"), "left:" + (80 + rnd() * 920).toFixed(0) + "px;top:" + (420 + rnd() * 1160).toFixed(0) + "px;opacity:" + (0.4 + rnd() * 0.5).toFixed(2));
            tl.set(m, { scale: 0.6 + rnd() * 1.4 }, 0);
            tl.fromTo(m, { x: 0, y: 0 }, { x: (rnd() - 0.5) * 50, y: -30 - rnd() * 60, duration: DUR, ease: "none" }, 0);
          }

          // ---------- initial states ----------
          const world = q("#s14-world"), station = q("#s14-station"), gate = q("#s14-gate"), marker = q("#s14-marker");
          tl.set([q("#s14-glow"), q("#s14-shock"), q("#s14-shock2"), q("#s14-shock3"), q("#s14-cone")], { opacity: 0 }, 0);
          tl.set(spA.concat(spB, spC).map((s) => s[0]), { opacity: 0 }, 0);
          tl.set(world, { transformOrigin: "540px 1040px" }, 0);
          tl.set(station, { transformOrigin: "540px 1150px" }, 0);
          tl.set(gate, { transformOrigin: "540px 1000px" }, 0);
          tl.set(q("#s14-doorL"), { transformOrigin: "0% 50%", transformPerspective: 1100, rotationY: 58 }, 0);
          tl.set(q("#s14-doorR"), { transformOrigin: "100% 50%", transformPerspective: 1100, rotationY: -58 }, 0);
          tl.set(marker, { y: -300, opacity: 0 }, 0);
          tl.set(q("#s14-linkRev"), { attr: { "stroke-dasharray": "700 700", "stroke-dashoffset": 700 } }, 0);
          tl.set(q("#s14-sandTop"), { transformOrigin: "50% 100%", scaleY: 1 }, 0);
          tl.set(q("#s14-sandBot"), { transformOrigin: "50% 100%", scaleY: 0.5 }, 0);

          // ---------- entry (frame 0 populated) ----------
          tl.fromTo(world, { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
          tl.fromTo(station, { y: 110, rotationX: 12 }, { y: 0, rotationX: 0, duration: 0.55, ease: "power3.out" }, 0);
          tl.fromTo(gate, { y: 40, scale: 0.86, opacity: 0.5, filter: "blur(4px)" }, { y: 0, scale: 0.94, opacity: 1, filter: "blur(1.2px)", duration: 0.7, ease: "power3.out" }, 0);
          tl.fromTo(q("#s14-contact"), { scaleX: 0.75, opacity: 0.4 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
          tl.fromTo(q("#s14-farp"), { y: 0 }, { y: -40, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s14-beam"), { rotation: -4 }, { rotation: 3, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo([q("#s14-fg1"), q("#s14-fg2")], { y: 0 }, { y: -120, duration: DUR, ease: "none" }, 0);
          // hourglass sand keeps running (time remaining)
          tl.fromTo(q("#s14-sandTop"), { scaleY: 1 }, { scaleY: 0.55, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s14-sandBot"), { scaleY: 0.5 }, { scaleY: 0.95, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s14-stream"), { opacity: 0.6 }, { opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 13 }, 0);
          // active "now" lamp breathing
          tl.fromTo([q("#s14-nowRing")], { attr: { r: 10 }, opacity: 1 }, { attr: { r: 26 }, opacity: 0, duration: 1.1, ease: "power2.out", repeat: 3 }, 0);
          tl.fromTo(q("#s14-lamp"), { opacity: 1 }, { opacity: 0.55, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
          // "Opal": crest glints
          tl.fromTo(q("#s14-crestSheen"), { x: 0 }, { x: 700, duration: 0.55, ease: "power2.inOut", immediateRender: false }, T.opal);
          tl.fromTo(q("#s14-crest"), { y: 0 }, { y: -8, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.opal);

          // "dijadwalkan": future marker drops onto the rail + dotted link draws to the gate
          tl.to(marker, { opacity: 1, duration: 0.08, ease: "none" }, T.dijadwalkan - 0.2);
          tl.to(marker, { y: 0, duration: 0.24, ease: "back.out(1.6)" }, T.dijadwalkan - 0.2);
          tl.fromTo(q("#s14-shock3"), { opacity: 0.85, scale: 0.25 }, { opacity: 0, scale: 0.9, duration: 0.5, ease: "power2.out", immediateRender: false }, T.dijadwalkan + 0.03);
          tl.fromTo(q("#s14-mring"), { rotation: 0 }, { rotation: 120, duration: DUR, ease: "none" }, 0);
          tl.to(q("#s14-linkRev"), { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" }, T.dijadwalkan + 0.08);
          // "berhenti": the gate shows it WILL close (ghost outline pulses, doors twitch) but stays open
          tl.fromTo(q("#s14-ghost"), { opacity: 1 }, { opacity: 0.35, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, T.berhenti);
          tl.to(q("#s14-doorL"), { rotationY: 46, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, T.berhenti);
          tl.to(q("#s14-doorR"), { rotationY: -46, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, T.berhenti);

          // "17" APEX
          tl.fromTo(q("#s14-cone"), { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power2.out", immediateRender: false }, T.d17 - 0.25);
          tl.to(q("#s14-cone"), { opacity: 0, duration: 0.9, ease: "power2.inOut" }, T.d17 + 0.3);
          tl.fromTo(q("#s14-glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.1, duration: 0.25, ease: "power2.out", immediateRender: false }, T.d17 - 0.03);
          tl.to(q("#s14-glow"), { opacity: 0, duration: 0.8, ease: "power2.out" }, T.d17 + 0.25);
          tl.fromTo(q("#s14-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, T.d17);
          tl.fromTo(station, { scale: 1 }, { scale: 1.045, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.d17);
          spA.forEach(([sp, dx, dy, s], i) => tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 }, { x: dx, y: dy, scale: s, opacity: 0, rotation: 90, duration: 0.7, ease: "power3.out", immediateRender: false }, T.d17 + i * 0.012));
          // "November"
          tl.fromTo(q("#s14-shock2"), { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.5, duration: 0.55, ease: "power2.out", immediateRender: false }, T.nov);
          tl.fromTo(q("#s14-tM"), { scale: 1 }, { scale: 1.05, duration: 0.11, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.nov);
          spB.forEach(([sp, dx, dy, s], i) => tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 }, { x: dx, y: dy * 0.6, scale: s * 0.85, opacity: 0, rotation: 90, duration: 0.6, ease: "power3.out", immediateRender: false }, T.nov + i * 0.012));
          // "2026": sheen across the tiles + small sparkle
          tl.fromTo(q("#s14-tY"), { scale: 1 }, { scale: 1.04, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.y2026);
          tl.fromTo(q("#s14-tileSheen"), { x: 0 }, { x: 1300, duration: 0.7, ease: "power2.inOut", immediateRender: false }, T.y2026 + 0.02);
          spC.forEach(([sp, dx, dy, s], i) => tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 }, { x: dx, y: dy * 0.6, scale: s * 0.7, opacity: 0, rotation: 90, duration: 0.6, ease: "power3.out", immediateRender: false }, T.y2026 + i * 0.012));
          // seek-order safety: a backward seek first rewinds to 0, then plays forward to the target, so every frame
          // equals a clean forward render (chained fromTo tweens on one property otherwise depend on where the seek came from)
          (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>

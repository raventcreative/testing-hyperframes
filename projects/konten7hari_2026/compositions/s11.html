    (function () {
      // s11 LANGKAH 5 "Lima. Tempel tabel dari Manus, lalu ketik: Poles 7 draf ini sesuai gaya saya. Jangan ubah fakta, angka, atau sumber."
      // Hand-over IN (fixed): s10 leaves the style chip "Gaya: Suaramu" alone at (540,520) -> a Claude composer unfolds out of it and the chip

      const D = 7.8;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }

        </div></div>`).join("");

      // ---------------------------------------------------------------- build: the prompt, one span per character (typed with tl.set windows)
      // [word, spoken time, lock index]; the locked words are bold from the start (no reflow when they light up)
      const LINES = [
        [["Poles", 3.09], ["7", 3.60], ["draf", 3.77], ["ini", 4.03], ["sesuai", 4.22], ["gaya", 4.80], ["saya.", 5.01]],
        [["Jangan", 5.18], ["ubah", 5.74], ["fakta,", 6.03, 0], ["angka,", 6.58, 1], ["atau", 7.07], ["sumber.", 7.31, 2]],
      ];
      const CH = [];   // [id, time]
      LINES.forEach((words, li) => {
        let h = "";
        words.forEach(([w, tw, lk], wi) => {
          const last = li === 1 && wi === words.length - 1;
          const lead = last ? 0.19 : 0.1, ci = last ? 0.026 : 0.032;

            if (open && k === core - 1) { h += `<i class="s11-ul" id="s11-ul${lk}"></i></span>`; open = false; }
          });
        });
        $("s11-l" + li).innerHTML = h;
      });

      const wrap = $("s11-wrap"), win = $("s11-win"), chip = $("s11-chip");
      I(win, { opacity: 0, clipPath: "inset(25px 290px 225px 290px round 33px)" });

      ft(win, { clipPath: "inset(25px 290px 225px 290px round 33px)" }, { clipPath: "inset(0px 0px 0px 0px round 30px)", duration: 0.56, ease: "expo.out" }, 0.08);

      ft(chip, { x: 0 }, { x: -242, duration: 0.46, ease: "power2.inOut" }, 0.26);
      ft(chip, { y: 0 }, { y: 205.5, duration: 0.46, ease: "power3.in" }, 0.26);
      ft(chip, { scaleX: 1, scaleY: 1 }, { scaleX: 0.8, scaleY: 0.8, duration: 0.46, ease: "power2.inOut" }, 0.26);
      ft(chip, { rotation: 0 }, { rotation: -5, duration: 0.23, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.26);
      ft(chip, { scaleX: 0.8, scaleY: 0.8 }, { scaleX: 0.86, scaleY: 0.72, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out" }, 0.72);
      const slot = $("s11-slot");
      I(slot, { opacity: 0 }); ft(slot, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.34);
      ft(slot, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.out" }, 0.74);
      // switch slides ON
      const sw = $("s11-sw"), knob = $("s11-knob"), swon = $("s11-swon");
      I(sw, { opacity: 0, scale: 0.3 }); ft(sw, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2.6)" }, 0.76);
      I(swon, { opacity: 0 }); ft(swon, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 0.94);
      I(knob, { x: 0 }); ft(knob, { x: 0 }, { x: 26, duration: 0.2, ease: "power3.inOut" }, 0.92);
      const ring = $("s11-ring");
      I(ring, { opacity: 0, scale: 1 });
      ft(ring, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.3, duration: 0.45, ease: "power2.out" }, 1.0);
      // composer furniture settles in
      [["s11-brand", 0.3], ["s11-tag", 0.42], ["s11-ph", 0.48], ["s11-clip", 0.52], ["s11-send", 0.58]].forEach(([id, t]) => {
        const e = $(id); I(e, { opacity: 0, y: 12 }); ft(e, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, t);
      });
      ft($("s11-bmk"), { rotation: -40, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(3)" }, 0.32);

      // ---------------------------------------------------------------- "Tempel tabel dari Manus": paste the table, it spills its 7 raw drafts
      const att = $("s11-att"), atr = $("s11-atr"), paste = $("s11-paste");
      I(paste, { opacity: 0, scale: 0.4, y: 0 });
      ft(paste, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, 0.78);
      ft(paste, { opacity: 1, y: 0 }, { opacity: 0, y: -22, duration: 0.3, ease: "power2.in" }, 1.08);
      I(att, { opacity: 0, y: -26, scale: 1.14 });
      ft(att, { opacity: 0, y: -26, scale: 1.14 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(2)" }, 0.86);
      I(atr, { opacity: 0, scale: 1 });
      ft(atr, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.12, duration: 0.45, ease: "power2.out" }, 1.08);
      ft(atr, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.12, duration: 0.5, ease: "power2.out" }, 5.2);     // "Jangan": guard the table
      ft($("s11-amk"), { rotation: -28, scale: 0.7 }, { rotation: 0, scale: 1, duration: 0.45, ease: "back.out(3)" }, 1.57);
      const AX = 60 + 24 + 196, AY = 462 + 72 + 26;   // attachment centre (page)
      for (let i = 0; i < 7; i++) {
        const w = $("s11-w" + i), t = 1.24 + i * 0.055;
        const dx = AX - (X0 + i * (CW + G) + CW / 2), dy = AY - (CT + 66);
        I(w, { x: dx, y: dy, scale: 0.25, rotation: (i - 3) * 6, opacity: 0 });
        ft(w, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, t);
        ft(w, { x: dx, y: dy, scale: 0.25, rotation: (i - 3) * 6 }, { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.52, ease: "power3.out" }, t);

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 3 prompt buat ngedit reels pakai Claude Code</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<script src="../vendor/r14kit.js"></script>
<!-- IG Reels cover 1080x1920 (LIGHT, like the reel): eyebrow "EDIT REELS · CLAUDE CODE", headline "[3] prompt" / "buat ngedit reels",
     the reel's three prompt cards (1 Siapin alat · 2 Bikin selera · 3 Edit, each with its Salin button, same design as the scenes),
     the "Simpan dulu" pill, mascot (host) + robot. Poppins 700/400, navy gradient. Everything that matters sits inside the 4:5 crop
     (y 285-1635). Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8934 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f8fe; font-family: Poppins, sans-serif; color: #0a0d2c; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .a { position: absolute; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  #gridtint { position: absolute; left: 520px; top: -260px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(126,164,226,.22), rgba(126,164,226,0) 64%); }
  #gridwrap { position: absolute; left: 330px; top: 160px; width: 900px; height: 820px;
    -webkit-mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); mask-image: radial-gradient(ellipse 430px 360px at 450px 405px, #000 35%, transparent 100%); }
  #grid { position: absolute; left: -473px; top: -473px; width: 1846px; height: 1766px; background-image: linear-gradient(90deg, rgba(104,132,186,.30) 2px, transparent 2px), linear-gradient(0deg, rgba(104,132,186,.30) 2px, transparent 2px); background-size: 43px 43px; }
  #glow { position: absolute; left: 0; top: 640px; width: 1080px; height: 760px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.95), rgba(255,255,255,0) 66%); }
  .r14-cl { background-image: url(../assets/icons/lobe-claude-color.svg) !important; }
  .grad { background: linear-gradient(172deg, #0a0d2c 8%, #294b77 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; z-index: 30; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; z-index: 30; }
  #eyebrow { top: 370px; display: flex; justify-content: center; }
  #eyebrow > span { height: 60px; padding: 0 26px 0 12px; border-radius: 30px; display: flex; align-items: center; gap: 12px; background: #ffffff;
    box-shadow: 0 12px 26px -12px rgba(20,40,90,.4), 0 0 0 1.5px rgba(10,13,44,.07); font: 700 21px/1 Poppins; letter-spacing: 2px; }
  #eyebrow i { position: relative; width: 40px; height: 40px; border-radius: 50%; background: #fff4ee; box-shadow: inset 0 0 0 2px #f3d9cc; }
  #eyebrow i .r14-cl { position: absolute; left: 9px; top: 9px; width: 22px; height: 22px; }
  #h1 { top: 450px; display: flex; justify-content: center; align-items: center; gap: 30px; }
  #h1 .n3 { width: 156px; height: 156px; border-radius: 46px; background: linear-gradient(150deg, #294b77, #0a0d2c); color: #fff; font: 700 110px/156px Poppins; text-align: center;
    box-shadow: 0 26px 44px -20px rgba(10,13,44,.75); }
  #h1 b { font: 700 140px/170px Poppins; letter-spacing: -5px; padding-bottom: 10px; filter: drop-shadow(0 16px 26px rgba(10,13,44,.14)); }
  #h2 { top: 628px; display: flex; justify-content: center; align-items: baseline; gap: 16px; font: 400 58px/1 Poppins; letter-spacing: -1px; }
  #h2 b { position: relative; font-weight: 700; }
  #h2 b::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: -12px; height: 7px; border-radius: 4px; background: linear-gradient(90deg, #0a0d2c, #294b77); }
  .cv { position: absolute; left: 110px; width: 860px; height: 136px; z-index: 12; transform-origin: 50% 50%; }
  .cv .cb { position: absolute; inset: 0; border-radius: 30px; background: linear-gradient(180deg, #ffffff, #f6f8fd); box-shadow: 0 36px 60px -32px rgba(10,13,44,.6), 0 0 0 1.5px rgba(10,13,44,.07); }
  .cv .num { position: absolute; left: 22px; top: 22px; width: 92px; height: 92px; border-radius: 28px; background: linear-gradient(150deg, #294b77, #0a0d2c); color: #fff; font: 700 52px/92px Poppins; text-align: center;
    box-shadow: 0 14px 24px -12px rgba(10,13,44,.8); }
  .cv .lab { position: absolute; left: 138px; top: 24px; font: 700 16px/22px Poppins; letter-spacing: .18em; color: #5d6f8f; white-space: nowrap; }
  .cv .tt { position: absolute; left: 136px; top: 46px; font: 700 46px/58px Poppins; letter-spacing: -.01em; white-space: nowrap; }
  .cv .cp { position: absolute; right: 22px; top: 36px; width: 160px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .cv .cp svg { width: 24px; height: 24px; display: block; }
  .cv .cp b { font: 700 21px/64px Poppins; }
  .cv .cp.o { background: #ffffff; box-shadow: inset 0 0 0 2px #cfdbee; color: #294b77; }
  .cv .cp.f { background: linear-gradient(150deg, #294b77, #0a0d2c); color: #fff; box-shadow: 0 14px 22px -12px rgba(10,13,44,.85); }
  #pill { left: 220px; top: 1230px; width: 640px; height: 92px; border-radius: 46px; background: linear-gradient(135deg, #0a0d2c, #294b77); z-index: 14;
    box-shadow: 0 26px 40px -22px rgba(10,13,44,.75), inset 0 0 0 1.5px rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; gap: 14px; color: #ffffff; }
  #pill .di { position: relative; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.14); flex: none; }
  #pill .di svg { position: absolute; left: 13px; top: 13px; width: 28px; height: 28px; display: block; color: #8fd8ff; }
  #pill b { font: 700 36px/92px Poppins, sans-serif; white-space: nowrap; }
  #pill span { font: 400 30px/92px Poppins, sans-serif; white-space: nowrap; color: rgba(227,237,250,.85); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #m { z-index: 22; } #r { z-index: 21; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="gridtint"></div><div id="gridwrap"><div id="grid"></div></div><div id="glow"></div>
  <div id="cards"></div>
  <div class="a" id="pill"></div>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><i id="ebi"></i><b class="grad">EDIT REELS · CLAUDE CODE</b></span></div>
  <div id="h1" class="ctr"><div class="n3">3</div><b class="grad">prompt</b></div>
  <div id="h2" class="ctr"><span class="grad">buat ngedit</span><b class="grad">reels</b></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS, R14 = window.R14;
  document.getElementById("ebi").innerHTML = R14.CL;
  document.getElementById("pill").innerHTML = `<div class="di">${R14.svg("bookmark", 2.2)}</div><b>Simpan dulu</b><span>· tinggal salin</span>`;
  // the three prompt cards (cover pose: a slight alternating tilt; card 1's Salin is filled)
  const POSE = [[750, -1.6, 0], [902, 1.2, 14], [1054, -0.8, -8]];
  document.getElementById("cards").innerHTML = R14.P.map((p, i) => `<div class="cv" style="top:${POSE[i][0]}px;transform:translateX(${POSE[i][2]}px) rotate(${POSE[i][1]}deg)"><div class="cb"></div>` +
    `<div class="num">${p.n}</div><span class="lab">PROMPT ${p.n}</span><b class="tt grad">${p.title}</b><div class="cp ${i === 0 ? "f" : "o"}">${R14.svg("copy", 2.2)}<b>Salin</b></div></div>`).join("");
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const HF = [-0.0775, -0.227, -0.1287];
    rb.setView({ fx: P("rx", "850"), fy: P("ry", "1620"), h: P("rh", "235"), pitch: 5 });
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0, ry: -0.42, rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] - 0.06, HF[1] - 0.12, HF[2]], hand_L: [-0.3, 0, -0.35], hand_R: [-0.3, 0, 0.35] },
      offs: { hand_L: [-0.13, 0.26, 0.06], hand_R: [0.13, 0.26, 0.06], head: [0, 0, 0] },
      face: { blink: 0, gaze: [-0.12, 0.06], happy: 1, squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.6, shadow: false });
    rb.render();
  }
  async function buildMascot() {
    const src = await (await fetch("../compositions/mascot.html")).text();
    const FACE = JSON.parse(src.match(/const FACE = (\{.*?\});\n/s)[1]);
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.6; o.color.setRGB(0.72, 0.84, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 60, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 60.05, { smooth: 1 });
    m.setView({ fx: P("mx", "290"), fy: P("my", "2100"), h: P("mh", "740"), yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    B.upperarm_R = [-2.7, 0, -0.25]; B.forearm_R = [0, 0, 0]; B.hand_R = [-0.12, 0.1, -0.12];
    B.head = [-0.08, 0.08, 0.04]; B.neck = [-0.02, 0.03, 0.02];
    m.setState({ root: { x: 0, y: 0, ry: 0.22, rz: 0, rx: 0, s: 1 }, bones: B, face: { blink: [0, 0], gaze: [-0.003, 0.006], mouthMix: 1, mouth: [0.04, 0.012, 0.005, 0.2] } });
    m.render();
  }
  window.COVER_READY = Promise.all([document.fonts.ready, buildRobot(), buildMascot()]);
</script>
</body>
</html>

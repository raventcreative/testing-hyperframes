<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    .s05-a { position: absolute; }
    #s05-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s05-glow { left: 40px; top: 300px; width: 1000px; height: 700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); }
    #s05-cmd { left: 418px; top: 318px; }
    #s05-hot { left: 680px; top: 312px; height: 36px; padding: 0 14px 0 38px; border-radius: 18px; background: #f4b400; color: #0a0d2c; font: 700 14px/36px Poppins, sans-serif; letter-spacing: .12em;
      white-space: nowrap; box-shadow: 0 8px 16px -8px rgba(217,154,0,.9); transform-origin: 0% 50%; }
    #s05-hot svg { position: absolute; left: 12px; top: 9px; width: 18px; height: 18px; display: block; }
    #s05-tt { left: 0; top: 372px; width: 1080px; text-align: center; font: 700 50px/62px Poppins, sans-serif; letter-spacing: -.01em; white-space: nowrap; transform-origin: 50% 60%; }
    /* persona cards */
    .s05-pc { position: absolute; left: 160px; top: 566px; width: 760px; height: 352px; transform-origin: 50% 50%; }
    .s05-pc .pa { position: absolute; left: 28px; top: 24px; }
    .s05-pc .pk { position: absolute; left: 134px; top: 28px; font: 700 14px/20px Poppins, sans-serif; letter-spacing: .16em; color: #5d6f8f; white-space: nowrap; }
    .s05-pc .pn { position: absolute; left: 132px; top: 48px; font: 700 34px/44px Poppins, sans-serif; white-space: nowrap; }
    .s05-pc .pj { position: absolute; left: 134px; top: 92px; font: 400 18px/24px Poppins, sans-serif; color: #5d6f8f; white-space: nowrap; }
    .s05-pc .r6-ex { right: 24px; top: 26px; }
    .s05-f { position: absolute; left: 28px; width: 704px; height: 58px; border-radius: 18px; background: #f3f6fc; transform-origin: 50% 50%; }
    .s05-f .fi { position: absolute; left: 10px; top: 9px; width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: #ffffff; }
    .s05-f .fi svg { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; display: block; }
    .s05-f .fl { position: absolute; left: 64px; top: 0; font: 400 18px/58px Poppins, sans-serif; color: #5d6f8f; white-space: nowrap; }
    .s05-f .fv { position: absolute; left: 210px; top: 0; font: 700 21px/58px Poppins, sans-serif; color: #0a0d2c; white-space: nowrap; }
    .s05-f .hl { position: absolute; left: -3px; top: -3px; right: -3px; bottom: -3px; border-radius: 21px; box-shadow: 0 0 0 3px var(--c); opacity: 0; }
    .s05-bk .pn { font-size: 30px; }
  </style>
  <div id="root" data-composition-id="s05" data-width="1080" data-height="1920">
    <div id="s05-cam"></div>
  </div>
  <script>
    (function () {
      // s05 "Tapi yang paling seru: panel konsumen. 100 pembeli AI, masing-masing punya penghasilan, kebiasaan, dan keraguan sendiri."
      // START: empty stage · "paling seru": /founder-consumer pill + gold "PALING SERU" tag · "panel konsumen": the title slams ·
      // "100 pembeli AI": the PANEL (100 avatars) pops in as a wave · "masing-masing": three avatars ring and their persona cards fly out
      // (fanned stack; front = Rina, 27 · back = Dimas, Sari), the panel dims · "penghasilan" / "kebiasaan" / "keraguan": the three
      // fields of the front card land one by one (CONTOH SIMULASI; fictional persona). TRANSITION → s06: all out. END STATE: all invisible.
      const D = 7.3667, ST = 18.1, VW = window.VO_WORDS, R6 = window.R6;
      const L = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 0.05); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const tPal = L("paling"), tSeru = L("seru:"), tPan = L("panel"), t100 = L("100"), tAI = L("AI,"), tMas = L("masing-masing"),
        tPen = L("penghasilan,"), tKeb = L("kebiasaan,"), tKer = L("keraguan"), tSen = L("sendiri.");
      const CY = 448, P = R6.PEOPLE, CR = R6.CROWD;
      const avXY = (i) => [100 + (i % 20) * CR.pitch + CR.size / 2, CY + Math.floor(i / 20) * CR.pitch + CR.size / 2];

      // ================================================================ DOM
      let h = `<div class="s05-a" id="s05-glow"></div>`;
      h += `<div class="r6-cmd" id="s05-cmd"><i></i>/founder-consumer</div><div class="s05-a" id="s05-hot">${R6.svg("star", 2.4)}PALING SERU</div>`;
      h += `<div class="s05-a r6-grad" id="s05-tt">Panel Konsumen</div>`;
      h += R6.crowd("s05", 100, CY);
      // back cards (Dimas, Sari) then the front card (Rina)
      [1, 2].forEach((k) => {
        const p = P[k];
        h += `<div class="r6-card s05-pc s05-bk" id="s05-pc${k}"><div class="pa">${R6.avatar("s05-pv" + k, p.i, 0, 0, 88)}</div><div class="pk">PEMBELI AI #0${p.i}</div>` +
          `<div class="pn r6-grad">${p.nm}</div><div class="pj">${p.job}</div></div>`;
      });
      const p0 = P[0];
      h += `<div class="r6-card s05-pc" id="s05-pc0"><div class="pa">${R6.avatar("s05-pv0", p0.i, 0, 0, 88)}</div><div class="pk">PEMBELI AI #0${p0.i}</div>` +
        `<div class="pn r6-grad">${p0.nm}</div><div class="pj">${p0.job}</div><div class="r6-ex">${R6.svg("flask", 2.2)}CONTOH SIMULASI</div>` +
        [["wallet", "Penghasilan", p0.inc, "#3a6fe0"], ["repeat", "Kebiasaan", p0.hab, "#7c5cff"], ["help", "Keraguan", p0.dbt, "#e5484d"]].map((f, q) =>
          `<div class="s05-f" id="s05-f${q}" style="top:${138 + q * 68}px;--c:${f[3]}"><i class="hl" id="s05-h${q}"></i><div class="fi">${R6.svg(f[0], 2.2)}</div><span class="fl">${f[1]}</span><b class="fv">${f[2]}</b></div>`).join("") +
        `</div>`;
      $("s05-cam").innerHTML = h;
      const cam = $("s05-cam"), glow = $("s05-glow"), cmd = $("s05-cmd"), hot = $("s05-hot"), tt = $("s05-tt"), cr = $("s05-cr");

      // ================================================================ header: "paling seru" · "panel konsumen"
      I(cam, { x: 0, y: 0 });
      I(glow, { opacity: 0 }); ft(glow, { opacity: 0 }, { opacity: 0.9, duration: 0.3 }, 0);
      I(cmd, { opacity: 0, scale: 0.5, y: 10 }); ft(cmd, { opacity: 0, scale: 0.5, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, 0.05);
      I(hot, { opacity: 0, scale: 0.3, rotation: -8 });
      ft(hot, { opacity: 0, scale: 0.3, rotation: -8 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.3, ease: "back.out(2.6)" }, tSeru - 0.1);
      I(tt, { opacity: 0, scale: 1.5 });
      ft(tt, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power4.in" }, tPan - 0.16);
      [[0, 6], [0, -4], [0, 2], [0, 0]].forEach(([x, y], k) => tl.set(cam, { x, y }, tPan + 0.08 + k * 0.034));

      // ================================================================ "100 pembeli AI": the panel pops in
      I(cr, { opacity: 1 });
      for (let i = 0; i < 100; i++) {
        const a = $("s05-a" + i), c = i % 20, r = Math.floor(i / 20);
        const d = Math.hypot((c - 9.5) / 9.5, (r - 2) / 2.6), t = t100 - 0.12 + d * 0.55 + R6.hash(i + 9) * 0.08;
        I(a, { opacity: 0, scale: 0 });
        ft(a, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.4)" }, t);
      }
      ft(cr, { y: 0 }, { y: -6, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, tAI);

      // ================================================================ "masing-masing": three avatars ring, their cards fly out
      const FAN = [{ x: 0, y: 0, r: 0 }, { x: -34, y: -26, r: -4 }, { x: 34, y: -22, r: 4 }];
      P.forEach((p, k) => {
        const av = $("s05-a" + p.i), pc = $("s05-pc" + k), [ax, ay] = avXY(p.i), dx = ax - 540, dy = ay - 742, t = tMas - 0.12 + [0.16, 0, 0.08][k];
        ft(av, { scale: 1 }, { scale: 1.6, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, t - 0.14);
        I(pc, { opacity: 0, x: dx, y: dy, scale: 0.08, rotation: 0 });
        ft(pc, { opacity: 0, x: dx, y: dy, scale: 0.08, rotation: 0 }, { opacity: 1, x: FAN[k].x, y: FAN[k].y, scale: 1, rotation: FAN[k].r, duration: 0.42, ease: "back.out(1.3)" }, t);
        // "sendiri": the back cards spread a little more
        if (k) ft(pc, { x: FAN[k].x, rotation: FAN[k].r }, { x: FAN[k].x * 1.9, rotation: FAN[k].r * 1.6, duration: 0.3, ease: "power2.out" }, tSen - 0.1);
      });
      ft(cr, { opacity: 1 }, { opacity: 0.35, duration: 0.3 }, tMas);
      // the three fields of the front card
      [tPen, tKeb, tKer].forEach((t, q) => {
        const f = $("s05-f" + q), hl = $("s05-h" + q);
        I(f, { opacity: 0, x: -24 }); ft(f, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.26, ease: "power3.out" }, t - 0.14);
        I(hl, { opacity: 0 }); ft(hl, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t - 0.1);
        const tn = [tKeb, tKer, D - 0.6][q]; ft(hl, { opacity: 1 }, { opacity: 0, duration: 0.2 }, tn - 0.1);
        ft(f, { scale: 1 }, { scale: 1.03, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, t - 0.02);
      });

      // ================================================================ TRANSITION → s06
      const tOut = D - 0.28;
      [0, 1, 2].forEach((k) => ft($("s05-pc" + k), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, tOut + k * 0.02));
      ft(cr, { opacity: 0.35, y: 0 }, { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" }, tOut);
      ft([cmd, hot, tt], { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.2, ease: "power2.in" }, tOut);
      ft(glow, { opacity: 0.9 }, { opacity: 0, duration: 0.22 }, tOut);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s05"] = tl;
    })();
  </script>
</template>

  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="s03"]');
      const q = (s) => R.querySelector(s);
      const qa = (s) => R.querySelectorAll(s);
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const D = Math.PI / 180, CX = 580, CY = 870;

      // bezel: 24 ticks + 5 LEDs on the top arc
      const ticks = q("#s03-ticks");
      for (let i = 0; i < 24; i++) {
        const a = i * 15 * D, r1 = i % 6 === 0 ? 216 : 221, r2 = 230;
        el("line", { x1: (CX + Math.cos(a) * r1).toFixed(1), y1: (CY + Math.sin(a) * r1).toFixed(1), x2: (CX + Math.cos(a) * r2).toFixed(1), y2: (CY + Math.sin(a) * r2).toFixed(1) }, ticks);
      }
      const ledG = q("#s03-leds"), leds = [];
      [-142, -116, -90, -64, -38].forEach((deg, i) => {
        const a = deg * D;
        el("circle", { cx: (CX + Math.cos(a) * 241).toFixed(1), cy: (CY + Math.sin(a) * 241).toFixed(1), r: 10, fill: "#ffffff", stroke: "#c9d8ec", "stroke-width": 2 }, ledG);
        leds.push(el("circle", { id: "s03-led" + i, cx: (CX + Math.cos(a) * 241).toFixed(1), cy: (CY + Math.sin(a) * 241).toFixed(1), r: 6.5, fill: "#9fb6d6" }, ledG));
      });
      // coil turns (11) — back halves behind capsule, front halves over it
      const cb = q("#s03-coilback"), cf = q("#s03-coilfront");
      for (let i = 0; i < 9; i++) {
        const x = 34 + i * 34;
        el("path", { d: "M" + x + " 796 A14 74 0 0 0 " + x + " 944" }, cb);
        el("path", { d: "M" + x + " 944 A14 74 0 0 0 " + x + " 796", stroke: "#8ea9cc", "stroke-width": 5, opacity: .25 }, cf);
        el("path", { d: "M" + x + " 944 A14 74 0 0 0 " + x + " 796", stroke: "#ffffff", "stroke-width": 3, opacity: .7 }, cf);
      }
      // reel spokes (5 windows)
      const sp = q("#s03-spokes");
      for (let i = 0; i < 5; i++) el("path", { d: "M555 845 a25 25 0 0 1 17 7 l-10 10 a11 11 0 0 0 -7 -3Z", transform: "rotate(" + i * 72 + " 555 870)" }, sp);
      // film perforations
      const pf = q("#s03-perf");
      for (let i = 0; i < 9; i++) { el("rect", { x: -2 + i * 11, y: -18, width: 6, height: 4, rx: 1 }, pf); el("rect", { x: -2 + i * 11, y: 14, width: 6, height: 4, rx: 1 }, pf); }
      // cable nodes x4
      const nodes = q("#s03-nodes");
      [[884, 1060], [918, 1300], [300, 1408], [190, 1418]].forEach((p) => {
        el("circle", { cx: p[0], cy: p[1], r: 17, fill: "url(#s03-chrome)", stroke: "#ffffff", "stroke-width": 2 }, nodes);
        el("circle", { cx: p[0], cy: p[1], r: 7, fill: "url(#s03-navy)" }, nodes);

      // pedestal trim ticks
      const pt = q("#s03-pticks");
      for (let i = 0; i < 19; i++) el("line", { x1: 400 + i * 20, y1: 1362, x2: 400 + i * 20, y2: i % 3 === 0 ? 1378 : 1370 }, pt);

      const sparks = qa(".s03-sp");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- initial states ----------
      gsap.set("#s03-cam", { x: 0, scale: 1.03 });
      gsap.set("#s03-cap", { x: -420, y: 0, rotation: -4, scale: 1, svgOrigin: "580 870" });
      gsap.set("#s03-reel", { rotation: 0, svgOrigin: "555 870" });
      gsap.set(leds, { fill: "#9fb6d6" });
      gsap.set("#s03-ringflash", { opacity: 0 });
      gsap.set("#s03-core", { opacity: 0.18, scale: 0.8, svgOrigin: "580 870" });
      gsap.set("#s03-portal", { scale: 1, svgOrigin: "580 870" });
      gsap.set("#s03-clampL", { x: -24 }); gsap.set("#s03-clampR", { x: 24 });
      gsap.set(["#s03-shock", "#s03-shockb"], { scale: 0.6, opacity: 0, svgOrigin: "580 870" });
      gsap.set(sparks, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(["#s03-far1", "#s03-far2", "#s03-far3"], { x: 0 });
      gsap.set("#s03-near", { x: 0, y: 0 });

      // ---------- camera: lateral drift following capsule, then still ----------
      tl.fromTo("#s03-cam", { x: 0 }, { x: -56, duration: 3.85, ease: "power1.inOut", immediateRender: false }, 0);
      tl.fromTo("#s03-far1", { x: 0 }, { x: -18, duration: 3.85, ease: "power1.inOut", immediateRender: false }, 0);
      tl.fromTo("#s03-far2", { x: 0 }, { x: -14, duration: 3.85, ease: "power1.inOut", immediateRender: false }, 0);
      tl.fromTo("#s03-far3", { x: 0 }, { x: -20, duration: 3.85, ease: "power1.inOut", immediateRender: false }, 0);
      tl.fromTo("#s03-near", { x: 0, y: 0 }, { x: -90, y: 14, duration: 3.85, ease: "power1.inOut", immediateRender: false }, 0);

      // ---------- capsule travel ----------
      tl.fromTo("#s03-reel", { rotation: 0 }, { rotation: 420, duration: 3.88, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s03-cap", { x: -420 }, { x: -300, duration: 1.6, ease: "power2.out", immediateRender: false }, 0);   // 'Caranya lo kasih satu video'
      tl.to("#s03-cap", { x: -262, duration: 1.15, ease: "power2.inOut" }, 1.62);                                   // 'referensi ke coding agent' — aligns
      tl.fromTo("#s03-cap", { rotation: -4 }, { rotation: 0, duration: 0.9, ease: "back.out(1.6)", immediateRender: false }, 1.72);
      tl.to("#s03-cap", { x: -288, duration: 0.17, ease: "power2.out" }, 3.55);                                     // anticipation pull-back
      tl.to("#s03-cap", { x: 0, duration: 0.163, ease: "power3.in" }, 3.72);                                        // DOCK at 3.883
      tl.fromTo("#s03-cap", { scale: 1 }, { scale: 0.94, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.883);

      // LEDs light one by one with the words
      [1.72, 2.1, 2.45, 2.75, 3.0].forEach((t, i) => tl.fromTo(leds[i], { fill: "#9fb6d6" }, { fill: "#ffffff", duration: 0.1, immediateRender: false }, t));
      tl.fromTo("#s03-core", { opacity: 0.18, scale: 0.8 }, { opacity: 0.4, scale: 0.95, duration: 1.2, ease: "sine.inOut", immediateRender: false }, 1.8);

      // ---------- APEX 'Claude' 3.883: dock, clamps bite, inner ring flashes ----------
      tl.to("#s03-clampL", { x: 0, duration: 0.09, ease: "power4.in" }, 3.86);
      tl.to("#s03-clampR", { x: 0, duration: 0.09, ease: "power4.in" }, 3.86);
      tl.fromTo("#s03-portal", { scale: 1 }, { scale: 1.035, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.883);
      tl.fromTo("#s03-ringflash", { opacity: 0 }, { opacity: 0.95, duration: 0.06, ease: "power2.out", immediateRender: false }, 3.883);
      tl.to("#s03-ringflash", { opacity: 0.1, duration: 0.5, ease: "power2.inOut" }, 3.95);
      tl.to("#s03-core", { opacity: 1, scale: 1.25, duration: 0.12, ease: "power2.out" }, 3.883);
      tl.to("#s03-core", { opacity: 0.7, scale: 1.1, duration: 0.45, ease: "power2.inOut" }, 4.02);
      tl.fromTo(["#s03-shock", "#s03-shockb"], { scale: 0.6, opacity: 0.85 }, { scale: 1.8, opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 3.883);

      tl.to(sparks, { scale: 0, opacity: 0, duration: 0.26, ease: "power2.in", stagger: 0.03 }, 4.2);

      window.__timelines["s03"] = tl;
    })();
  </script>

  <div id="root" data-composition-id="t2" data-width="1080" data-height="1920">
    <div id="t2-cam"></div>
  </div>
  <script>
    (function () {
      // t2 "Dua, Paperclip. Kamu bikin perusahaan isi AI agent: ada struktur tim, tugas, budget, dan approval dari kamu."
      // (README: "Open-source orchestration for teams of AI agents … org charts, budgets, governance … Tasks, approvals & review gates")
      // START: rail = pill 1 done, 2–4 upcoming; the card flips in from rotationY −90 (t1 ended edge-on at +90); pill 2 active on "Dua,".
      // "Paperclip.": title · "Kamu": owner node · "perusahaan": "Perusahaan AI kamu" chip · "AI agent:": Agent CEO + 3 agent employees ·
      // "struktur tim,": the org lines draw · "tugas,": task chips · "budget,": budget meter fills · "approval": approval request slides up,
      // a pointer travels to "Setujui" · "kamu.": click → "Disetujui". END: pill 2 done; the card is pushed off to the left (x −1100) → t3 slides in from the right.
      const ID = "t2", K = 1;
      const SC = window.VO_SCENES.find((s) => s.id === ID), ST = SC.start, D = SC.dur, VW = window.VO_WORDS, R2 = window.R2, RD = window.ROUNDS[K];
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= ST + after - 1e-3); return w ? w[1] - ST : 0; };
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const tNum = RD.tNum - ST, tName = RD.tName - ST;
      const tKamu = wt("Kamu"), tPer = wt("perusahaan"), tAI = wt("AI"), tStr = wt("struktur"), tTug = wt("tugas,"), tBud = wt("budget,"), tApp = wt("approval"), tKm = wt("kamu.");
      // ---------------------------------------------------------------- DOM
      const node = (id, x, y, w, icn, t, s, k) => `<div class="t2-nd${k ? " k" : ""}" id="${id}" style="left:${x}px;top:${y}px;width:${w}px"><div class="t2-nb${k ? " k" : ""}"></div>` +
        `<div class="t2-ni">${R2.ic(icn, 22, k ? "#ffffff" : "#294b77")}</div><div class="t2-nt">${t}</div><div class="t2-ns">${s}</div></div>`;
      const WK = [["Agent Engineer", "ngoding", "Tugas:", "landing page", 40], ["Agent Desainer", "bikin visual", "Tugas:", "logo baru", 340], ["Agent Marketing", "bikin konten", "Tugas:", "caption IG", 640]];
      let h = `<div class="t2-a" id="t2-glow"></div>` + R2.railHTML("t2") + `<div class="rk-card" id="t2-card">` + R2.cardHeadHTML("t2", K, "");
      h += `<svg class="t2-a" id="t2-lines" viewBox="0 0 940 538"><path id="t2-l0" pathLength="1" d="M470 186 L470 214"/><path id="t2-l1" pathLength="1" d="M470 272 L470 288 L170 288 L170 304"/>` +
        `<path id="t2-l2" pathLength="1" d="M470 272 L470 304"/><path id="t2-l3" pathLength="1" d="M470 272 L470 288 L770 288 L770 304"/></svg>`;
      h += node("t2-nk", 360, 128, 220, "user-round", "Kamu", "pemilik", 1);
      h += node("t2-np", 40, 128, 262, "building-2", "Perusahaan AI", "isinya agent", 0);
      h += node("t2-nc", 345, 214, 250, "crown", "Agent CEO", "atur strategi", 0);
      h += WK.map((w, i) => node("t2-nw" + i, w[4], 304, 262, "bot", w[0], w[1], 0)).join("");
      h += WK.map((w, i) => `<div class="t2-tk" id="t2-tk${i}" style="left:${w[4] + 8}px">${R2.ic("list-checks", 16, "#294b77")}<b>${w[2]}</b> ${w[3]}</div>`).join("");
      h += `<div class="t2-nd" id="t2-bud" style="width:262px"><div class="t2-nb"></div><div class="t2-ni">${R2.ic("wallet", 22, "#294b77")}</div><div class="t2-nt">Budget</div>` +
        `<div class="t2-bar"><div id="t2-bfill"></div></div></div>`;
      h += `<div class="t2-a" id="t2-ap"><div class="t2-a" id="t2-apb"></div><div class="t2-a" id="t2-apr"></div><div class="t2-a" id="t2-api">${R2.ic("shield-check", 28, "#b07f00")}</div>` +
        `<div class="t2-a" id="t2-apt">Butuh approval kamu</div><div class="t2-a" id="t2-aps">Rencana minggu ini · dari Agent CEO</div>` +
        `<div class="t2-a" id="t2-no">Tolak</div><div class="t2-a" id="t2-ok"><div id="t2-ok0">Setujui</div><div id="t2-ok1">${R2.CHECK(20)}Disetujui</div></div>` +
        `<div class="t2-a" id="t2-ptr"><i class="f"></i><i class="g"></i></div><div class="t2-a" id="t2-rip" style="left:800px;top:17px"></div></div>`;
      h += `</div>`;
      $("t2-cam").innerHTML = h;

      // ---------------------------------------------------------------- rail + card flip-in
      R2.railInit(tl, "t2", [2, 0, 0, 0]);
      R2.railActivate(tl, "t2", K, tNum, tName);
      const card = $("t2-card"), glow = $("t2-glow");
      I(glow, { opacity: 0.7 });
      I(card, { rotationY: -90, scale: 0.9, x: 0, opacity: 1, transformPerspective: 3200 });
      ft(card, { rotationY: -90, scale: 0.9 }, { rotationY: 0, scale: 1, duration: 0.42, ease: "power3.out" }, 0);
      const hic = $("t2-hic"), ht = $("t2-ht"), hr = $("t2-hr"), hos = $("t2-hos");
      I(ht, { yPercent: 110 }); ft(ht, { yPercent: 110 }, { yPercent: 0, duration: 0.42, ease: "power4.out" }, tName - 0.12);
      I(hr, { opacity: 0, x: -14 }); ft(hr, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, tName + 0.2);
      I(hos, { opacity: 0, scale: 0.6 }); ft(hos, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.6)" }, tName + 0.35);
      I(hic, { scale: 1, rotation: 0 }); ft(hic, { scale: 0.6, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" }, tName - 0.12);
      // ---------------------------------------------------------------- the company
      const pop = (el, t, from) => { I(el, Object.assign({ opacity: 0, scale: 0.6, y: 14 }, from || {})); ft(el, Object.assign({ opacity: 0, scale: 0.6, y: 14 }, from || {}), { opacity: 1, scale: 1, y: 0, x: 0, duration: 0.4, ease: "back.out(2.2)" }, t); };
      pop($("t2-nk"), tKamu - 0.1);
      pop($("t2-np"), tPer - 0.08, { x: -30 });
      pop($("t2-nc"), tAI - 0.12);
      [0, 1, 2].forEach((i) => pop($("t2-nw" + i), tAI + 0.02 + i * 0.09));
      // "struktur tim,": org lines draw, the nodes nod once
      [0, 1, 2, 3].forEach((i) => { const p = $("t2-l" + i); I(p, { strokeDashoffset: 1 }); ft(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.36, ease: "power2.inOut" }, tStr - 0.06 + (i ? 0.12 : 0)); });
      ["t2-nk", "t2-nc", "t2-nw0", "t2-nw1", "t2-nw2"].forEach((id, k) => ft($(id), { y: 0 }, { y: -6, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, tStr + 0.1 + k * 0.06));
      // "tugas,": task chips
      [0, 1, 2].forEach((i) => { const e = $("t2-tk" + i); I(e, { opacity: 0, scaleY: 0.3, y: -10 }); ft(e, { opacity: 0, scaleY: 0.3, y: -10 }, { opacity: 1, scaleY: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, tTug - 0.08 + i * 0.07); });
      // "budget,": the meter
      pop($("t2-bud"), tBud - 0.12, { x: 30 });
      const bf = $("t2-bfill"); I(bf, { scaleX: 0 }); ft(bf, { scaleX: 0 }, { scaleX: 0.62, duration: 0.6, ease: "power2.out" }, tBud + 0.1);
      // "approval … dari kamu.": request slides up, pointer clicks "Setujui"
      const ap = $("t2-ap"), ptr = $("t2-ptr"), rip = $("t2-rip"), ok1 = $("t2-ok1"), okw = $("t2-ok"), apr = $("t2-apr");
      I(ap, { opacity: 0, y: 60 }); ft(ap, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, tApp - 0.3);
      I(ptr, { opacity: 0, x: 860, y: 120 });
      tl.set(ptr, { opacity: 1 }, tApp - 0.05);
      ft(ptr, { x: 860, y: 120 }, { x: 826, y: 44, duration: tKm - tApp - 0.05, ease: "power2.inOut" }, tApp - 0.05);
      ft(ptr, { scale: 1 }, { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out" }, tKm - 0.06);
      ft(okw, { scale: 1 }, { scale: 0.93, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out" }, tKm - 0.05);
      I(ok1, { opacity: 0 }); ft(ok1, { opacity: 0 }, { opacity: 1, duration: 0.14 }, tKm + 0.02);
      I(apr, { opacity: 0 }); ft(apr, { opacity: 0 }, { opacity: 1, duration: 0.2 }, tKm + 0.04);
      I(rip, { opacity: 0, scale: 0.4 }); ft(rip, { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.9, duration: 0.42, ease: "power2.out" }, tKm);
      // ---------------------------------------------------------------- TRANSITION → t3: pill done, the card is pushed off to the left
      R2.railDone(tl, "t2", K, D - 0.42);
      ft(card, { x: 0 }, { x: -1100, duration: 0.32, ease: "power3.in" }, D - 0.33);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>

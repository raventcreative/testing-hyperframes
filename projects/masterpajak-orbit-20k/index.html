<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>MasterPajak — 20K EFEK orbital mascot (10 s)</title>
    <script src="vendor/gsap/gsap.min.js"></script>
    <script src="vendor/masterpajak-rig.js"></script>
    <script src="vendor/mp-puppet.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1638; }
      #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; isolation: isolate; background: #0d1638; }
      /* MasterPajak navy plate: deep navy, soft radial key behind the mascot, gentle floor bounce, vignette */
      #bg { position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(ellipse 70% 42% at 50% 43%, rgba(44,62,128,.95) 0%, rgba(30,44,98,.6) 45%, rgba(13,22,56,0) 78%),
          radial-gradient(ellipse 120% 80% at 50% 50%, #1a2758 0%, #121c46 55%, #0a1130 100%); }
      #bg-key { position: absolute; left: 140px; top: 370px; width: 800px; height: 920px; z-index: 1; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 45%, rgba(170,196,255,.16) 0%, rgba(120,150,230,.07) 40%, rgba(120,150,230,0) 70%); }
      #bg-floor { position: absolute; left: 240px; top: 1190px; width: 600px; height: 130px; z-index: 1; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%, rgba(249,202,24,.07) 0%, rgba(120,150,230,.06) 35%, rgba(0,0,0,0) 70%); }
      #vig { position: absolute; inset: 0; z-index: 90; pointer-events: none;
        background: radial-gradient(ellipse 85% 70% at 50% 46%, rgba(0,0,0,0) 60%, rgba(2,5,20,.45) 100%); }
      #grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 91; opacity: .5; pointer-events: none;
        background: url(assets/brand/grain_256.png); mix-blend-mode: overlay; }
      #orbit { z-index: 20 !important; position: absolute !important; }
      #mascot { z-index: 30 !important; position: absolute !important; }
      #headline { z-index: 40 !important; position: absolute !important; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-fps="30">
      <div id="bg" data-layout-ignore></div>
      <div id="bg-key" data-layout-ignore></div>
      <div id="bg-floor" data-layout-ignore></div>
      <!-- orbital capsule ring (reusable: count, radius, speed, colours, timing are host variables) -->
      <div id="orbit" class="clip" data-composition-id="orbit" data-composition-src="compositions/orbit.html"
        data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"count":20,"cx":540,"cy":830,"rx":410,"ry":480,"turns":1,"buildStart":1.2,"buildEnd":3.0,"exitStart":9.0}'></div>
      <!-- the supplied MasterPajak mascot as a 2.5D puppet (one WebGL canvas) -->
      <div id="mascot" class="clip" data-composition-id="mascot" data-composition-src="compositions/mascot.html"
        data-start="0" data-duration="10" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"preset":"orbit-host","heightPx":840,"centerX":540,"feetY":1250}'></div>
      <div id="headline" class="clip" data-composition-id="headline" data-composition-src="compositions/headline.html"
        data-start="0" data-duration="10" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"accent":"20K","main":"EFEK","centerY":1450,"fontSize":150,"revealAt":5.5,"exitAt":9.3}'></div>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
    </div>
    <script>
      // camera: small controlled push-in on the mascot + its key light, origin = orbit centre (540, 830)
      const tl = gsap.timeline({ paused: true });
      for (const [sel, origin] of [["#mascot", "540px 830px"], ["#bg-key", "400px 460px"], ["#bg-floor", "300px -360px"]]) {
        tl.fromTo(sel, { scale: 0.94, transformOrigin: origin }, { scale: 1, duration: 1.9, ease: "power2.out" }, 0);
      }
      tl.fromTo("#bg-key", { opacity: 0.4 }, { opacity: 1, duration: 1.4, ease: "power1.out" }, 0);
      tl.set({}, {}, 10);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

<template>
  <script src="assets/presenter.js"></script>
  <style>
    #e16-root { position: absolute; inset: 0; overflow: hidden; } #e16-word { -webkit-text-fill-color: red !important; } #e16-shadow { display: none; }
    .e16-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
    #e16-tint { background: linear-gradient(180deg, rgba(4,10,30,0.72) 0%, rgba(4,10,30,0.25) 38%, rgba(4,10,30,0) 55%, rgba(4,10,30,0.7) 100%); opacity: 0; }
    #e16-mast { position: absolute; left: 0; top: 232px; width: 1080px; height: 320px; text-align: center; opacity: 0; }
    #e16-mast span { display: inline-block; font: 700 228px/1 "Poppins", sans-serif; color: #ffffff; transform: scaleY(1.42); transform-origin: 50% 0;
      background: linear-gradient(180deg, #ffffff 0%, #e9f4ff 55%, #a9d8f5 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap; }
    .e16-lab { position: absolute; top: 146px; font: 700 22px/1 "Poppins", sans-serif; letter-spacing: 0.22em; color: #eaf4ff; opacity: 0; }
    .e16-lab b { color: #00c9ff; font-weight: 700; }
    #e16-rule { position: absolute; left: 60px; top: 184px; width: 960px; height: 2px; background: rgba(234,244,255,0.55); transform-origin: 0 50%; transform: scaleX(0); }
    #e16-quote { position: absolute; left: 60px; top: 1062px; width: 330px; font: italic 400 40px/1.18 "Poppins", sans-serif; color: #ffffff; letter-spacing: -0.01em;
      text-shadow: 0 4px 18px rgba(2,8,26,0.85); opacity: 0; }
    #e16-quote b { font-weight: 700; color: #00c9ff; }
    #e16-quote i { display: block; width: 64px; height: 5px; border-radius: 3px; background: #00c9ff; margin-bottom: 18px; }
    #e16-num { position: absolute; left: 856px; top: 860px; width: 170px; text-align: left; opacity: 0; }
    #e16-num .n { font: 700 118px/0.9 "Poppins", sans-serif; color: #00c9ff; letter-spacing: -0.04em; text-shadow: 0 8px 24px rgba(2,8,26,0.6); }
    #e16-num .s { font: 700 21px/1.25 "Poppins", sans-serif; color: #ffffff; letter-spacing: 0.08em; margin-top: 10px; text-shadow: 0 3px 12px rgba(2,8,26,0.8); }
    #e16-bar { position: absolute; left: 892px; top: 1166px; width: 128px; height: 92px; background: #f7f9fc; border-radius: 6px; padding: 10px 10px 6px; opacity: 0;
      box-shadow: 0 10px 24px rgba(2,8,26,0.5); }
  </style>
  <div id="e16-root" data-composition-id="e16" data-width="1080" data-height="1350">
    <div id="e16-bd" class="e16-layer"></div>
    <div id="e16-tint" class="e16-layer"></div>
    <div id="e16-back" class="e16-layer" data-layout-ignore>
      <div id="e16-mast"><span id="e16-word">KONTEN</span></div>
      <svg id="e16-shadow" class="e16-layer" viewBox="0 0 1080 1350" style="opacity:0">
        <defs><filter id="e16-blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="11"/></filter></defs>
        <path id="e16-silsh" fill="#020818" fill-opacity="0.8" filter="url(#e16-blur)" transform="translate(250,400)"/>
      </svg>
    </div>
    <div id="e16-figwrap" class="e16-layer"></div>
    <div id="e16-front" class="e16-layer" data-layout-ignore>
      <div id="e16-rule"></div>
      <div id="e16-labL" class="e16-lab" style="left:60px">VOL. <b>17</b></div>
      <div id="e16-labR" class="e16-lab" style="right:60px">EDISI <b>AI</b></div>
      <div id="e16-num"><div class="n">17</div><div class="s">EFEK<br>VIDEO AI</div></div>
      <div id="e16-quote"><i></i>Bikin konten yang <b>dilirik</b>, bukan di-skip.</div>
      <div id="e16-bar"><svg id="e16-bars" viewBox="0 0 108 64" width="108" height="64"></svg>
        <div style="font:700 11px/1 Poppins,sans-serif;color:#0d1a3d;letter-spacing:0.18em;text-align:center;margin-top:4px">AIPRENEUR</div></div>
    </div>
    <div id="e16-chrome" class="e16-layer"></div>
  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const ei = (x) => Math.pow(clamp(x, 0, 1), 3);
      const H = window.HFP;
      const $ = (id) => document.getElementById("e16-" + id);
      $("bd").innerHTML = H.backdropHTML("e16b");
      const R = H.mount($("figwrap"), "e16f");
      $("chrome").innerHTML = H.chromeHTML("e16c", 16, "Cover Story");
      $("silsh").setAttribute("d", H.SIL);
      // barcode: fixed stripe widths
      const W = [3, 1, 2, 1, 1, 3, 1, 2, 2, 1, 1, 2, 3, 1, 1, 2, 1, 3, 2, 1, 1, 1, 2, 3, 1, 2, 1, 1, 3, 1, 2, 2, 1];
      let x = 0, bars = "";
      W.forEach((w, i) => { if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w * 1.3}" height="64" fill="#0d1a3d"/>`; x += w * 1.3 + 0.6; });
      $("bars").innerHTML = bars;

      function fade(el, v, dy, dx) {
        el.style.opacity = v.toFixed(3);
        el.style.transform = "translate(" + ((dx || 0) * (1 - v)).toFixed(1) + "px," + ((dy || 0) * (1 - v)).toFixed(1) + "px)";
      }
      function render(t) {
        H.animate(R, t);
        const out = ei(seg(t, 3.4, 3.85));
        $("tint").style.opacity = (eo(seg(t, 0.15, 0.5)) * (1 - out)).toFixed(3);
        // masthead: tracking 30px → 3px in 0.45 s (and back out for the loop)
        const m = eo(seg(t, 0.3, 0.75)), mo = 1 - ei(seg(t, 3.35, 3.8));
        const ls = 3 + 27 * (1 - m) + 27 * (1 - mo);
        const w = $("word"); w.style.letterSpacing = ls.toFixed(2) + "px"; w.style.paddingLeft = ls.toFixed(2) + "px";
        $("mast").style.opacity = (clamp(seg(t, 0.3, 0.55), 0, 1) * mo).toFixed(3);
        $("shadow").style.opacity = (eo(seg(t, 0.35, 0.75)) * mo).toFixed(3);
        // cover furniture
        const r = eo(seg(t, 0.5, 0.95)) * (1 - ei(seg(t, 3.3, 3.7)));
        $("rule").style.transform = "scaleX(" + r.toFixed(4) + ")";
        const lb = eo(seg(t, 0.6, 0.9)) * (1 - seg(t, 3.35, 3.6));
        fade($("labL"), lb, 10); fade($("labR"), lb, 10);
        fade($("quote"), eo(seg(t, 0.85, 1.2)) * (1 - seg(t, 3.4, 3.65)), 0, -40);
        fade($("num"), eo(seg(t, 0.95, 1.3)) * (1 - seg(t, 3.4, 3.65)), 0, 40);
        fade($("bar"), eo(seg(t, 1.1, 1.4)) * (1 - seg(t, 3.4, 3.65)), 16);
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e16"] = tl;
    })();
  </script>
</template>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>AIpreneur — Motion Pack s04</title>
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: block; }
      :root { --n0: #0a0d2c; --n1: #294b77; --grad: linear-gradient(135deg, #0a0d2c 0%, #294b77 100%); --acc: #2c68d8; --acc2: #5b8cff; --mut: #5d6b8a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #eef3fb; }
      body { font-family: "Poppins", sans-serif; font-synthesis: none; color: var(--n0); -webkit-font-smoothing: antialiased; }
      #main { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: url(assets/brand/pastel_bg_1080x1350.jpg) 0 0 / 1080px 1350px; }
      .abs { position: absolute; }
      .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      /* chrome */
      #logo { position: absolute; left: 64px; top: 66px; width: 200px; height: 18.1px; }
      #chip { position: absolute; right: 64px; top: 52px; height: 46px; padding: 0 20px; border-radius: 23px; border: 1.5px solid rgba(41,75,119,.25);
        background: rgba(255,255,255,.65); font-size: 19px; line-height: 43px; letter-spacing: 2.5px; color: var(--n1); white-space: nowrap; }
      #chip b { color: var(--acc); }
      #num { position: absolute; left: 58px; top: 116px; font-size: 158px; line-height: 170px; font-weight: 700; letter-spacing: -8px; }
      #ttl { position: absolute; left: 262px; top: 138px; font-size: 74px; line-height: 88px; font-weight: 700; letter-spacing: -2px; white-space: nowrap; }
      #sub { position: absolute; left: 266px; top: 228px; font-size: 32px; line-height: 44px; color: var(--n1); white-space: nowrap; }
      #stage { position: absolute; left: 64px; top: 318px; width: 952px; height: 742px; perspective: 1800px; }
      .win { position: absolute; left: 30px; top: 18px; width: 892px; height: 690px; border-radius: 30px; overflow: hidden; background: #fff;
        box-shadow: 0 40px 90px rgba(20,40,90,.22), 0 0 0 1.5px rgba(41,75,119,.08); transform: rotateY(-5deg) rotateX(3deg); transform-origin: 50% 50%; }
      .ghost { position: absolute; left: 62px; top: 0; width: 828px; height: 690px; border-radius: 30px; background: rgba(255,255,255,.45); border: 1.5px solid rgba(255,255,255,.8);
        transform: rotateY(-5deg) rotateX(3deg) translateZ(-60px); }
      .bar { position: absolute; left: 0; top: 0; width: 100%; height: 46px; background: #f3f6fb; border-bottom: 1px solid #e3e9f3; z-index: 5; }
      .bar i { position: absolute; top: 17px; width: 12px; height: 12px; border-radius: 50%; }
      .bar .url { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 360px; height: 26px; border-radius: 13px; background: #fff;
        font-size: 15px; line-height: 26px; text-align: center; color: #8a96b0; }
      .view { position: absolute; left: 0; top: 46px; width: 892px; height: 644px; overflow: hidden; }
      .spec { position: absolute; height: 54px; padding: 0 22px; border-radius: 27px; background: #fff; box-shadow: 0 14px 34px rgba(20,40,90,.18);
        font-size: 21px; line-height: 54px; white-space: nowrap; color: var(--n0); z-index: 10; }
      .spec b { color: var(--acc); }
      #use { position: absolute; left: 64px; top: 1086px; font-size: 29px; line-height: 40px; color: var(--n0); white-space: nowrap; }
      #use b { font-size: 19px; letter-spacing: 3px; color: var(--acc); margin-right: 14px; vertical-align: 3px; }
      #lock { position: absolute; left: 64px; top: 1150px; width: 952px; height: 104px; border-radius: 52px; background: rgba(255,255,255,.88);
        box-shadow: 0 18px 44px rgba(20,40,90,.14), 0 0 0 1.5px rgba(41,75,119,.08); }
      #lock .ic { position: absolute; left: 24px; top: 22px; width: 60px; height: 60px; border-radius: 50%; background: #e8eefa; }
      #lock .ic svg { position: absolute; left: 17px; top: 15px; }
      #lock .lb { position: absolute; left: 102px; top: 18px; font-size: 18px; letter-spacing: 2px; color: var(--mut); }
      #lock .ln { position: absolute; left: 102px; height: 12px; border-radius: 6px; background: #d9e1ef; filter: blur(2.5px); }
      #lock .btn { position: absolute; right: 16px; top: 16px; height: 72px; padding: 0 32px; border-radius: 36px; background: var(--grad); color: #fff;
        font-size: 26px; line-height: 72px; white-space: nowrap; box-shadow: 0 12px 26px rgba(10,13,44,.3); }
      #lock .btn b { color: #9fc0ff; }
      #foot { position: absolute; left: 64px; top: 1284px; width: 952px; height: 40px; font-size: 18px; letter-spacing: 3px; line-height: 40px; color: var(--mut); }
      #foot .r { position: absolute; right: 0; top: 0; font-weight: 700; color: var(--n0); }
      #arrow { display: inline-block; margin-left: 8px; }
      #grain { position: absolute; inset: 0; opacity: .06; background: url(assets/brand/grain_256.png); mix-blend-mode: multiply; pointer-events: none; }
      .view.dk2 { background: radial-gradient(ellipse 80% 70% at 50% 45%, #22406e 0%, #0a0d2c 78%); }
.rc { position: absolute; left: 196px; top: 150px; width: 500px; height: 250px; border-radius: 26px; background: #fff; box-shadow: 0 26px 60px rgba(0,0,0,.35); transform-origin: 50% 100%; }
.rc .s { position: absolute; left: 34px; top: 30px; font-size: 24px; letter-spacing: 3px; color: #f5a524; }
.rc .q { position: absolute; left: 34px; top: 70px; width: 440px; font-size: 27px; line-height: 38px; font-weight: 700; color: var(--n0); }
.rc .av { position: absolute; left: 34px; top: 178px; width: 46px; height: 46px; border-radius: 23px; color: #fff; font-size: 18px; font-weight: 700; line-height: 46px; text-align: center; }
.rc .nm { position: absolute; left: 94px; top: 178px; font-size: 18px; font-weight: 700; color: var(--n0); }
.rc .rl { position: absolute; left: 94px; top: 202px; font-size: 15px; color: #8a96b0; }
.avg { position: absolute; left: 0; top: 470px; width: 892px; text-align: center; font-size: 22px; color: rgba(255,255,255,.75); white-space: nowrap; }
.avg b { color: #fff; } .avg span { color: #f5a524; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1350" data-fps="30">
      <img id="logo" src="assets/brand/logo_dark.png" alt="AIpreneur">
      <div id="chip">SOCIAL PROOF · <b>04</b> / 12</div>
      <div id="num" class="g">04</div><div id="ttl" class="g">Review shuffle</div><div id="sub">Testimoni yang ngocok sendiri.</div>
      <div id="stage"><div class="ghost"></div>
<div class="win"><div class="bar"><i style="left:20px;background:#ff6159"></i><i style="left:40px;background:#ffbd2e"></i><i style="left:60px;background:#28c941"></i><div class="url">brand-kamu.id</div></div>
  <div class="view dk2"><div id="deck"></div><div class="avg"><span>★</span> <b>4,9</b> rata-rata dari 2.140 ulasan</div></div></div>
<div class="spec" style="left:-6px;top:24px">🃏 <b>4 testimoni</b> bergiliran</div>
<div class="spec" style="right:-4px;top:600px">✦ <b>1</b> prompt Claude</div></div>
      <div id="use"><b>COCOK UNTUK</b>Review tanpa grid yang ngebosenin.</div>
      <div id="lock"><div class="ic"><svg width="26" height="30" viewBox="0 0 26 30"><rect x="2" y="13" width="22" height="15" rx="4" fill="#294b77"/><path d="M7 13V9a6 6 0 0 1 12 0v4" stroke="#294b77" stroke-width="3.5" fill="none"/></svg></div>
        <div class="lb">PROMPT LENGKAP · DIKIRIM VIA DM</div><div class="ln" style="top:52px;width:330px"></div><div class="ln" style="top:72px;width:250px"></div>
        <div class="btn">Komen <b>MOTION</b></div></div>
      <div id="foot">AIPRENEUR · MOTION PACK<div class="r">Geser<span id="arrow">→</span></div></div>
      <div id="grain"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const D = 7;
        const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });
        const ft = (el, a, b, at) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), at);
        const st = (el, v, at) => tl.set(el, v, at);
        // chrome life: arrow nudge + slow window float (static otherwise, so the loop is seamless)
        ft("#arrow", { x: 0 }, { x: 10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: Math.round(D / 0.5) - 1 }, 0);
        ft(".win", { y: 0 }, { y: -8, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        ft(".spec", { y: 0 }, { y: -12, duration: D / 4, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.4 }, 0);
        // top card flies off and tucks behind the deck; four shuffles bring the first card back on top for a seamless loop
const R = [["Konversi naik 38% di minggu pertama.", "Nadia K.", "Owner, Skincare lokal", "#e0732a"],
           ["Landing page terbaik yang pernah kami rilis.", "Raka P.", "CMO, SaaS", "#2c68d8"],
           ["Rilis Senin, Jumat jadwal udah full booking.", "Dewi S.", "Founder, Studio foto", "#16a06a"],
           ["Rasanya kayak pakai agency mahal, tapi biayanya jauh lebih kecil.", "Bima A.", "Founder, Coffee shop", "#7b4fd6"]];
const deck = $("#deck");
const cards = R.map(([q, n, r, c]) => { const d = document.createElement("div"); d.className = "rc"; d.innerHTML = `<div class="s">★★★★★</div><div class="q">“${q}”</div><div class="av" style="background:${c}">${n[0]}</div><div class="nm">${n}</div><div class="rl">${r}</div>`; deck.appendChild(d); return d; });
const pose = (depth) => ({ y: -depth * 22, scale: 1 - depth * 0.06, opacity: depth > 2 ? 0 : 1 - depth * 0.18, zIndex: 10 - depth, rotation: 0, x: 0 });
cards.forEach((c, i) => st(c, pose(i), 0));
const T = [1.25, 2.75, 4.25, 5.75];
T.forEach((t, k) => {
  cards.forEach((c, i) => {
    const d0 = (i - k + 4) % 4, d1 = (d0 + 3) % 4;
    if (d0 === 0) {
      ft(c, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1 }, { x: 560, y: -60, rotation: 16, scale: 0.92, opacity: 1, duration: 0.42, ease: "power3.in" }, t);
      ft(c, Object.assign({ x: 560, y: -60, rotation: 16 }, { scale: 0.92, opacity: 1 }), Object.assign(pose(3), { duration: 0.45, ease: "power3.out" }), t + 0.42);
      st(c, { zIndex: 6 }, t + 0.42);
    } else {
      ft(c, pose(d0), Object.assign(pose(d1), { duration: 0.5, ease: "back.out(1.4)" }), t + 0.28);
    }
  });
});
        tl.set({}, {}, D - 0.01);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>

  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="s05"]');

      window.__warpTL && window.__warpTL(tl, 16.8667, 20.4667); // v4: hits follow the measured VO timing
      const pop = (sel, t, ox, oy) => {
        gsap.set(sel, { scale: 0, rotation: -14, opacity: 0, svgOrigin: ox + " " + oy });

      const sparks = ["#s05-sp1", "#s05-sp2", "#s05-sp3", "#s05-sp4", "#s05-sp5"];
      const TP = [[110, 660, -30, 0.08], [163, 690, 17, 0.33], [216, 720, 4, 0.58], [269, 660, -9, 0.83], [132, 690, -22, 1.08], [185, 720, 25, 1.33], [238, 660, 12, 1.58], [291, 690, -1, 1.83]];
      // ---- initial states
      gsap.set("#s05-xf", { y: 520, scale: 1, filter: "blur(12px)", transformOrigin: "664.33px 1040.47px" });
      gsap.set("#s05-cam", { scale: 1, rotation: 0, transformOrigin: "664.33px 1040.47px" });
      gsap.set("#s05-punch", { scale: 1, transformOrigin: "664.33px 1040.47px" });
      gsap.set("#s05-sheen", { x: -260, skewX: -18 });

      gsap.set(sparks, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });

      gsap.set(qa(".s05-db"), { x: 0, y: 0, rotation: 0, opacity: 0, transformOrigin: "50% 50%" });

      gsap.set(["#s05-ledh0", "#s05-ledh1", "#s05-ledh2"], { opacity: 0 });
      gsap.set("#s05-near", { x: 0, y: 0, rotation: 0 });
      TP.forEach((v, i) => gsap.set("#s05-t" + i, { x: v[0], y: v[1], rotation: v[2], opacity: i === 0 ? 1 : 0, transformOrigin: "50% 50%" }));
      gsap.set(["#s05-far1", "#s05-far2", "#s05-far3", "#s05-far4"], { x: 0, y: 0 });
      tl.fromTo(["#s05-far1", "#s05-far3"], { x: 0 }, { x: 16, duration: 3.56, ease: "sine.inOut", immediateRender: false }, 0);
      tl.fromTo(["#s05-far2", "#s05-far4"], { x: 0 }, { x: -12, duration: 3.56, ease: "sine.inOut", immediateRender: false }, 0);
      qa(".s05-pt").forEach((el, i) => {
        gsap.set(el, { x: 0, y: 0 });
        tl.fromTo(el, { x: 0, y: 0 }, { x: 14 * Math.sin(i * 1.7), y: -(70 + (i % 5) * 18), duration: 3.56, ease: "none", immediateRender: false }, 0);

      // ---- IN: PUSH-UP from s04 (decelerate)
      tl.fromTo("#s05-xf", { y: 520, filter: "blur(12px)" }, { y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, 0);

      tl.fromTo("#s05-cube", { filter: "brightness(1.9)" }, { filter: "brightness(1)", duration: 0.7, ease: "power2.out", immediateRender: false }, 2.282);
      tl.fromTo("#s05-frost", { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none", immediateRender: false }, 2.25);
      tl.fromTo("#s05-glowdisc", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.15, duration: 0.14, ease: "power2.out", immediateRender: false }, 2.282);
      tl.fromTo("#s05-glowdisc", { opacity: 1, scale: 1.15 }, { opacity: 0.55, scale: 1, duration: 0.7, ease: "sine.out", immediateRender: false }, 2.43);

      tl.fromTo("#s05-punch", { scale: 1.06 }, { scale: 1.03, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 2.372);
      tl.fromTo("#s05-shock", { scale: 0.55, opacity: 0.9 }, { scale: 2.0, opacity: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, 2.282);
      tl.fromTo("#s05-shock2", { scale: 0.55, opacity: 0.8 }, { scale: 1.6, opacity: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 2.33);

      window.__timelines["s05"] = tl;
    })();

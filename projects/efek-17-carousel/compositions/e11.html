    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const eio = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const H = window.HFP;
      const $ = (id) => document.getElementById(id);
      $("e11-bdhost").innerHTML = H.backdropHTML("e11b");
      const R = H.mount($("e11-fighost"), "e11f");
      $("e11-chrome").innerHTML = H.chromeHTML("e11c", 11, "Pull-back Reveal");

      // sidebar: 4 finished steps
      const STEPS = [["Transkrip", "0:04"], ["Potong jeda", "0:09"], ["Subtitle + hook", "0:15"], ["Color grade", "0:21"]];
      const CK = '<svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 11.5 L9.5 16 L17.5 6.5" fill="none" stroke="#071a3a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      $("e11-steps").innerHTML = STEPS.map((s, i) => `<div class="e11-step" style="top:${118 + i * 74}px"><div class="ck">${CK}</div><div class="lbl">${s[0]}</div><div class="tm">${s[1]}</div></div>` +
        (i < 3 ? `<div style="position:absolute;left:40px;top:${118 + i * 74 + 50}px;width:2px;height:22px;background:rgba(0,201,255,0.45)"></div>` : "")).join("");
      const TH = ["linear-gradient(150deg,#00c9ff,#294b77)", "linear-gradient(150deg,#ffd166,#ef8354)", "linear-gradient(150deg,#7f5af0,#2cb1bc)", "linear-gradient(150deg,#2ec4b6,#0b3c5d)"];
      $("e11-thumbs").innerHTML = TH.map((g, i) => `<div class="e11-thumb" style="left:${22 + (i % 2) * 162}px;top:${70 + Math.floor(i / 2) * 116}px;background:${g}">
          <div style="position:absolute;left:58px;top:31px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.9)"></div>
          <div style="position:absolute;left:72px;top:41px;border-left:11px solid #0d1a3d;border-top:7px solid transparent;border-bottom:7px solid transparent"></div>
          <div style="position:absolute;right:8px;bottom:6px;font:700 13px/1 Poppins,sans-serif;color:#fff">0:0${3 + i * 2}</div></div>`).join("");
      // timeline strip: ruler + 2 tracks of clips
      let tk = "";
      for (let i = 0; i <= 24; i++) tk += `<path d="M${18 + i * 22.5} 14 V${i % 4 === 0 ? 30 : 22}" stroke="#7fa7d6" stroke-opacity="0.45" stroke-width="2"/>`;
      $("e11-ticks").innerHTML = tk;
      const CL = [[18, 120, 0], [144, 160, 1], [310, 110, 2], [426, 132, 3]];
      $("e11-clips").innerHTML = CL.map((c) => `<div class="e11-clip" style="left:${c[0]}px;top:46px;width:${c[1]}px;background:${TH[c[2]]};box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.18)"></div>`).join("") +
        [[18, 90], [114, 140], [260, 70], [336, 120], [462, 96]].map((c) => `<div class="e11-clip" style="left:${c[0]}px;top:104px;height:30px;width:${c[1]}px;background:rgba(0,201,255,0.22);box-shadow:inset 0 0 0 1.5px rgba(0,201,255,0.5)"><div style="margin:12px 10px;height:6px;border-radius:3px;background:rgba(234,244,255,0.6);width:60%"></div></div>`).join("");

      // camera: world point F (face inside the viewport) sits at frame centre C0 when zoomed (s=2.05), identity at s=1
      const F = { x: 40 + 400 + 288, y: 150 + 74 + 302 }, C0 = { x: 540, y: 610 }, S0 = 2.05;
      const world = $("e11-world");
      function camera(p) { // p: 0 = close-up, 1 = full window
        const s = Math.pow(S0, 1 - p), q = (S0 - s) / (S0 - 1);
        const cx = C0.x + (F.x - C0.x) * q, cy = C0.y + (F.y - C0.y) * q;
        world.style.transform = "translate(" + (cx - F.x * s).toFixed(2) + "px," + (cy - F.y * s).toFixed(2) + "px) scale(" + s.toFixed(4) + ")";
      }
      const vpui = $("e11-vpui"), cap = $("e11-cap");
      function render(t) {
        H.animate(R, t);
        // hold close-up → pull back 0.55 s (slow in, slow out) → hold → push back in for the loop
        const p = eio(seg(t, 0.35, 0.9)) * (1 - eio(seg(t, 3.55, 3.92)));
        camera(p);
        const ui = eo(seg(t, 0.85, 1.15)) * (1 - seg(t, 3.3, 3.5));
        vpui.style.opacity = ui.toFixed(3);
        const fill = 0.62 * eo(seg(t, 0.95, 1.9));
        $("e11-fill").style.width = (312 * fill).toFixed(1) + "px";
        $("e11-pct").textContent = Math.round(fill * 100) + "%";
        // playhead + player progress drift with time
        const ph = 0.22 + 0.5 * seg(t, 0, 4);
        $("e11-head").style.left = (18 + 540 * ph).toFixed(1) + "px";
        $("e11-prog").setAttribute("width", (400 * ph).toFixed(1));
        $("e11-knob").setAttribute("cx", (70 + 400 * ph).toFixed(1));
        $("e11-time").textContent = "0:" + String(Math.floor(30 * ph)).padStart(2, "0") + " / 0:30";
        const lv = 0.55 + 0.45 * Math.cos(t * Math.PI * 2 / 0.9);
        $("e11-live").firstChild.style.opacity = lv.toFixed(3);
        const c = eo(seg(t, 0.95, 1.3)) * (1 - seg(t, 3.25, 3.5));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px)";
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e11"] = tl;
    })();

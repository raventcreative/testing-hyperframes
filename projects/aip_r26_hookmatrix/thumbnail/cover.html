<!doctype html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Cover R26 — minimal (navy)</title>
<!-- Minimal cover (client: "kebanyakan elemen, gak ada negative space"): navy field + soft glow, logo, one small badge,
     2-line headline, a quiet tagline, the mascot. The busy world-still version is kept as cover_ramai.html. -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: Poppins, sans-serif; color: #fff;
    background: radial-gradient(ellipse 820px 900px at 540px 1420px, #1b3f86 0%, #0e2257 38%, #071232 70%, #040a1f 100%); }
  #grid { position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(90deg, #cfe0ff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #cfe0ff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
    -webkit-mask-image: radial-gradient(ellipse 600px 700px at 540px 1300px, #000 0%, transparent 100%); mask-image: radial-gradient(ellipse 600px 700px at 540px 1300px, #000 0%, transparent 100%); }
  #halo { position: absolute; left: 140px; top: 1000px; width: 800px; height: 800px; border-radius: 50%;
    background: radial-gradient(circle, rgba(1,204,247,.28) 0%, rgba(1,204,247,.08) 45%, rgba(1,204,247,0) 70%); }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 450px; top: 170px; width: 180px; opacity: .92; }
  #eb { top: 300px; } #eb span { display: inline-block; padding: 11px 26px 13px 34px; border-radius: 40px; background: #ff4d5e; font: 700 30px/1 Poppins; letter-spacing: 8px; }
  #h1 { top: 392px; font: 700 104px/1 Poppins; letter-spacing: -3px; }
  #h2 { top: 506px; font: 700 124px/1.05 Poppins; letter-spacing: -4px; padding-bottom: .15em;
        background: linear-gradient(180deg, #ffe08a 10%, #ffb627 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tag { top: 676px; font: 400 34px/1 Poppins; color: #a9c4f5; letter-spacing: .5px; }
  #tag b { font-weight: 700; color: #ffffff; }
  #host { position: absolute; left: 190px; bottom: -30px; width: 700px; height: auto; filter: drop-shadow(0 30px 50px rgba(0,0,0,.45)); }
</style></head>
<body>
  <div id="grid"></div><div id="halo"></div>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR" />
  <div class="c" id="eb"><span>PROMPT GRATIS</span></div>
  <div class="c" id="h1">50 Hook Iklan</div>
  <div class="c" id="h2">Dari 1 Prompt</div>
  <div class="c" id="tag">Hook × Isi × CTA · <b>siap copy-paste</b></div>
  <img id="host" src="host_cut.png" alt="" />
  <script>document.fonts.ready.then(() => (window.COVER_READY = true));</script>
</body></html>

<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #m-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="mascot" data-width="1080" data-height="1920">
    <canvas id="m-canvas" width="1080" height="1920" data-layout-ignore data-layout-allow-occlusion></canvas>
  </div>
  <script>
    (function () {
      // 3D chibi businessman mascot (mascot_biz_rigged.glb, AIpreneur chest print) rendered live in one WebGL canvas.
      // Framing = orthographic camera (setView: feet px, figure height px). Hook: small full body far back,
      // walks forward to a half-body framing at the bottom; the upper frame stays free for the explanation panel.
      // Acting = shared director on the measured VO words; lip sync = letters x VO energy.
      const M3 = window.Mascot3D;
      const { buildPerformance, buildLipTrack, syllableAccents, vnoise, bump } = M3;
      const VW = window.VO_WORDS, PH = window.VO_PHR, D = 41.2;
      const canvas = document.getElementById("m-canvas");
      const mouthAt = buildLipTrack(window.VO_PHONES, window.VO_ENV, D);
      const ACC = syllableAccents(window.VO_ENV, VW, window.VO_PHONES, D);
      const one = (x) => Math.max(0, Math.min(1, x));
      const sm = (u) => { u = one(u); return u * u * (3 - 2 * u); };
      const ease3 = (u) => { u = one(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const add = (...ds) => { const o = {}; for (const d of ds) for (const [k, v] of Object.entries(d || {})) { const a = o[k] || [0, 0, 0]; o[k] = [a[0] + v[0], a[1] + v[1], a[2] + v[2]]; } return o; };
      function accents(t) {
        let n = 0;
        for (const a of ACC) { const d = t - a[0]; if (d > -0.25 && d < 0.35) n += bump(t, a[0] + 0.05, 0.17) * a[1]; }
        return Math.min(1.3, n);
      }

      // ------------------------------------------------------------ framing (pure function of t)
      const FAR = { fx: 540, fy: 1790, h: 560 }, HALF = { fx: 540, fy: 2150, h: 1080 };
      const W0 = PH.hook[2].start + 0.2, W1 = PH.hook[2].end - 0.2;     // walk-in during "Ini tujuh prompt ... paling gila"
      const CTA0 = PH.cta[0].start - 0.2;
      const NAMES = PH.items.map((c) => c.label.start).concat([PH.cta[0].start]);
      const SMALL = PH.items.map((c) => c.desc.start);
      function view(t) {
        const u = ease3((t - W0) / (W1 - W0));
        let fx = FAR.fx + (HALF.fx - FAR.fx) * u, fy = FAR.fy + (HALF.fy - FAR.fy) * u, h = FAR.h + (HALF.h - FAR.h) * u;
        // hook: tiny drift; "Pantes nggak nempel" = recoil step back
        fy += -14 * bump(t, PH.hook[0].start + 0.3, 0.35) * (1 - u);
        // codes: lean-in punch on every code name, slow breathing push
        let p = 0;
        for (const n of NAMES) { const d = t - (n - 0.05); if (d > 0 && d < 1.6) p += Math.sin(Math.min(1, d / 0.22) * Math.PI / 2) * Math.exp(-Math.max(0, d - 0.22) * 2.6); }
        for (const n of SMALL) { const d = t - (n - 0.03); if (d > 0 && d < 0.8) p += 0.3 * Math.sin(Math.min(1, d / 0.15) * Math.PI / 2) * Math.exp(-Math.max(0, d - 0.15) * 4); }
        const live = sm((t - W1) / 0.6) * (1 - sm((t - CTA0) / 0.5));
        h += live * (48 * p + 18 * Math.sin(t * 0.9)); fy += live * (26 * p + 8 * Math.sin(t * 0.9));
        fx += live * 16 * Math.sin(t * 0.55 + 0.7);
        // CTA: pull back a little so both hands read
        const c = ease3((t - CTA0) / 0.7);
        h += c * -60; fy += c * -40;
        return { fx, fy, h, yaw: 0, pitch: 4 };
      }

      // ------------------------------------------------------------ acting
      const intents = [
        { t: PH.hook[0].start + 0.05, action: "present", side: "right" },
        { t: PH.hook[1].start, action: "emphasize", side: "left" },
        { t: W0 + 0.3, action: "idle" },
        { t: PH.hook[2].end - 1.4, action: "reveal" },
      ];
      const ROT = ["pointFwd", "present", "explain", "pointFwd", "emphasize", "present", "pointFwd"];
      PH.items.forEach((c, i) => {
        intents.push({ t: c.label.start - 0.05, action: ROT[i % ROT.length], side: i % 2 ? "left" : "right" });
        intents.push({ t: c.desc.start + 0.2, action: "explain", side: i % 2 ? "right" : "left" });
      });
      intents.push({ t: PH.cta[0].start, action: "cta", side: "right" }, { t: PH.cta[1].start + 1.0, action: "welcome", side: "left" });
      const DIR = M3.direct(VW, D, { intents, seed: 5, quiet: 0.2, look: 0 });
      const PERF = buildPerformance(DIR.tracks, D + 0.05, { smooth: 1 });
      const walk = (t) => M3.walk(t, W0, W1, 4, 0.36);

      let mascot = null;
      function apply(t) {
        const Pf = PERF(t), acc = accents(t);
        const still = 1 - sm((t - (D - 0.5)) / 0.4);
        const id = M3.micro(t, 17, vnoise); for (const k in id) id[k] = id[k].map((x) => x * still);
        const wk = walk(t);
        const bones = add(Pf.bones, id, wk.bones, { head: [0.03 * acc * still, 0, 0], neck: [0.012 * acc * still, 0, 0] });
        const root = { x: Pf.root.x, y: Pf.root.y + wk.bob, ry: Pf.root.ry + 0.012 * vnoise(t, 26, 0.18) * still, rz: Pf.root.rz, rx: 0, s: Pf.root.s };
        mascot.setView(view(t));
        const bl = M3.blink(t, 0, D, 3, DIR.blinks);
        mascot.setState({ root, bones, face: { blink: [bl, bl], gaze: DIR.gaze(t), mouthMix: 1, mouth: mouthAt(t) } });
        mascot.render();
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.036, 0.031], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.036, 0.031], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [253, 198, 152], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "headC": [0, 0.72, 0]};
      const DECALS = [{"url": "assets/mascot3d/logo_chest_biz.png", "bone": "chest", "box": [-0.134, -0.03, 0.37437, 0.38763], "zgrid": [[0.05705, 0.05751, 0.05787, 0.05858, 0.05995, 0.06192, 0.06423, 0.06697, 0.07014, 0.07287, 0.07521, 0.0774, 0.07939, 0.08125, 0.08303, 0.08474, 0.08639, 0.08799, 0.08952, 0.09099, 0.09238, 0.0937, 0.09498, 0.0962, 0.09733, 0.09839, 0.09938, 0.10031, 0.10119, 0.10203, 0.10283, 0.10359, 0.10429, 0.10496, 0.10557, 0.10611, 0.1066, 0.10703, 0.10723, 0.10741], [0.05694, 0.05724, 0.05748, 0.05794, 0.05882, 0.06049, 0.0628, 0.06553, 0.06876, 0.07188, 0.07448, 0.07678, 0.07894, 0.08093, 0.0828, 0.0846, 0.08631, 0.08794, 0.08951, 0.09101, 0.09243, 0.09377, 0.09507, 0.09634, 0.09755, 0.09868, 0.09974, 0.10071, 0.1016, 0.10244, 0.10323, 0.10397, 0.1047, 0.10539, 0.10601, 0.10655, 0.10703, 0.10745, 0.10763, 0.1078], [0.05639, 0.0566, 0.05675, 0.05709, 0.05731, 0.0587, 0.0609, 0.06369, 0.06698, 0.0707, 0.0736, 0.07608, 0.07833, 0.08045, 0.08244, 0.08433, 0.08613, 0.08783, 0.08945, 0.09098, 0.09244, 0.09382, 0.09514, 0.09641, 0.09765, 0.09886, 0.09998, 0.101, 0.10195, 0.10282, 0.1036, 0.10435, 0.10508, 0.10578, 0.1064, 0.10694, 0.10742, 0.10783, 0.10801, 0.10819], [0.05566, 0.05581, 0.05588, 0.05608, 0.0561, 0.05723, 0.05924, 0.06208, 0.06546, 0.06938, 0.0726, 0.07534, 0.0777, 0.07991, 0.08199, 0.08398, 0.08587, 0.08762, 0.08931, 0.09091, 0.09242, 0.09384, 0.0952, 0.09648, 0.09772, 0.09893, 0.10009, 0.10117, 0.10218, 0.10311, 0.10395, 0.10472, 0.10544, 0.10613, 0.10674, 0.10729, 0.10776, 0.10819, 0.10838, 0.10857], [0.05484, 0.05492, 0.05494, 0.05502, 0.05494, 0.05555, 0.05739, 0.06009, 0.06358, 0.06761, 0.07141, 0.07441, 0.07708, 0.07936, 0.08153, 0.08356, 0.08555, 0.08734, 0.08908, 0.09076, 0.09235, 0.09382, 0.09522, 0.09654, 0.09779, 0.099, 0.10017, 0.10127, 0.10232, 0.10331, 0.10421, 0.10502, 0.10577, 0.10646, 0.10705, 0.10758, 0.10807, 0.10851, 0.10871, 0.10891], [0.05401, 0.05402, 0.054, 0.05395, 0.05374, 0.05397, 0.0556, 0.05823, 0.06168, 0.06587, 0.07009, 0.07339, 0.07624, 0.07876, 0.08101, 0.08312, 0.08519, 0.08709, 0.08888, 0.0906, 0.09226, 0.09378, 0.09521, 0.09658, 0.09786, 0.09908, 0.10024, 0.10136, 0.10242, 0.10343, 0.10434, 0.10519, 0.10597, 0.10668, 0.10731, 0.10787, 0.10836, 0.1088, 0.10901, 0.10921]], "offset": 0.0016, "emissive": 0.55, "roughness": 0.6}];
      const ready = M3.Mascot.create(canvas, { url: "assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 })
        .then((m) => {
          mascot = m;
          // brand plate is deep blue: cyan rim from behind-right, soft cool key
          for (const o of m.scene.children) {
            if (!o.isDirectionalLight) continue;
            if (o.position.z < 0) { o.intensity = 2.1; o.color.setRGB(0.45, 0.85, 1.0); o.position.set(1.6, 1.5, -1.4); }
          }
          if (m.shadow) m.shadow.visible = false;
          apply(0);
        });
      window.__hf.buildReady["mascot"] = ready;
      window.addEventListener("hf-seek", (e) => {
        const t = e.detail.time;
        if (mascot) apply(t);
        else if (e.detail.waitUntil) e.detail.waitUntil(ready.then(() => apply(t)));
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, D - 0.02);
      window.__timelines["mascot"] = tl;
    })();
  </script>
</template>

            q("#s06-arc").setAttribute("d", `M${285 + r * Math.sin(a0)} ${285 - r * Math.cos(a0)} A${r} ${r} 0 0 1 ${285 + r * Math.sin(a1)} ${285 - r * Math.cos(a1)}`);
          }

          // ---- AF brackets around brief + poster ----
          const brRoot = q("#s06-br");
          const mkBrackets = (x, y, w, h) => {
            const set = [];
            [[0, 0, "top", "left"], [1, 0, "top", "right"], [0, 1, "bottom", "left"], [1, 1, "bottom", "right"]].forEach(([fx, fy, v, hz]) => {
              const b = document.createElement("div"); b.className = "s06-bracket";
              b.style.left = x + fx * (w - 40) + "px"; b.style.top = y + fy * (h - 40) + "px";
              b.style["border" + v[0].toUpperCase() + v.slice(1) + "Width"] = "7px";
              b.style["border" + hz[0].toUpperCase() + hz.slice(1) + "Width"] = "7px";
              b.style["border" + v[0].toUpperCase() + v.slice(1) + hz[0].toUpperCase() + hz.slice(1) + "Radius"] = "10px";
              brRoot.appendChild(b); set.push([b, fx ? 1 : -1, fy ? 1 : -1]);
            });
            return set;
          };
          const brA = mkBrackets(64, 446, 448, 616), brB = mkBrackets(566, 430, 454, 590);

          // ---- camera: slow push-in + parallax ----
          const stage = q("#s06-stage");
          tl.set(stage, { transformOrigin: "540px 980px" }, 0);
          tl.fromTo(stage, { scale: 1.0 }, { scale: 1.035, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo("#s06-far", { y: 0, x: 0 }, { y: -30, x: 12, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s06-fg", { y: 60 }, { y: -90, duration: DUR, ease: "none" }, 0);

          // ---- objects in (frame 0 already populated), heavily defocused ----
          const brief = q("#s06-brief"), poster = q("#s06-poster"), lens = q("#s06-lens");
          const BLUR = "blur(15px) contrast(0.62) saturate(0.55) brightness(1.08)";
          const SHARP = "blur(0px) contrast(1) saturate(1) brightness(1)";
          tl.fromTo(brief, { x: -40, y: 20, rotation: -7, filter: BLUR }, { x: 0, y: 0, rotation: -4, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(poster, { x: 40, y: 20, rotation: 6, filter: BLUR }, { x: 0, y: 0, rotation: 3, duration: 0.6, ease: "power3.out" }, 0);
          tl.set(lens, { transformOrigin: "50% 50%" }, 0);
          tl.fromTo(lens, { scale: 0.9, y: 50 }, { scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);
          tl.fromTo("#s06-grip", { rotation: -35, svgOrigin: "285 285" }, { rotation: 0, svgOrigin: "285 285", duration: 0.7, ease: "power3.out" }, 0);
          // idle sway of objects
          tl.to(brief, { y: -8, duration: 1.2, ease: "sine.inOut" }, 0.6);
          tl.to(poster, { y: -10, duration: 1.2, ease: "sine.inOut" }, 0.6);

          // "hasilnya" 0.35: output nudges forward
          tl.to(poster, { scale: 1.035, duration: 0.18, ease: "power2.out" }, 0.35);
          tl.to(poster, { scale: 1, duration: 0.3, ease: "power2.inOut" }, 0.53);

          // "mengikuti" 0.77: beams draw brief -> lens -> output
          const beams = [["#s06-bl", 0.77], ["#s06-bl-glow", 0.77], ["#s06-brm", 0.95], ["#s06-br-glow", 0.95]];
          beams.forEach(([s, t]) => {
            const p = q(s), L = p.getTotalLength();
            p.setAttribute("stroke-dasharray", L + " " + L);
            tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, t);
          });
          tl.fromTo("#s06-n1", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 0.74);
          tl.fromTo("#s06-n2", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 1.2);
          // pulses travelling along the beams
          [["#s06-pl", [0.85, 1.9]], ["#s06-pr", [1.05, 2.1]]].forEach(([s, ts]) => {
            const p = q(s), L = p.getTotalLength(), seg = 40;
            p.setAttribute("stroke-dasharray", seg + " " + (L + seg));
            tl.set(p, { strokeDashoffset: seg }, 0);
            ts.forEach((t) => tl.fromTo(p, { strokeDashoffset: seg }, { strokeDashoffset: -L, duration: 0.42, ease: "power1.inOut", immediateRender: false }, t));
          });

          // "seberapa" 1.32 -> "jelas" 1.87: focus ring turns ~90°, both sharpen together
          tl.to("#s06-grip", { rotation: 90, svgOrigin: "285 285", duration: 0.55, ease: "power2.inOut" }, 1.32);
          tl.to(brief, { filter: SHARP, duration: 0.55, ease: "power2.inOut" }, 1.32);
          tl.to(poster, { filter: SHARP, duration: 0.55, ease: "power2.inOut" }, 1.32);
          tl.fromTo("#s06-hex", { rotation: 0, svgOrigin: "285 285" }, { rotation: 30, svgOrigin: "285 285", duration: 0.55, ease: "power2.inOut" }, 1.32);
          tl.to(lens, { scale: 1.02, duration: 0.2, ease: "power2.out" }, 1.87);
          tl.to(lens, { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.07);
          // glint sweeps across the glass exactly on "jelas"
          tl.fromTo("#s06-glint", { x: -260 }, { x: 330, duration: 0.42, ease: "power2.inOut" }, 1.8);
          tl.fromTo("#s06-ok", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 1.87);
          // AF brackets snap onto both
          [...brA, ...brB].forEach(([b, sx, sy], i) => {
            tl.fromTo(b, { x: sx * 26, y: sy * 26, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.22, ease: "back.out(2)" }, 1.84 + (i % 4) * 0.02);
          });

          // "brief-nya." 2.16: check tab clips on, output brightens with glow
          tl.fromTo("#s06-tab", { x: 70, opacity: 0, rotation: 12, transformOrigin: "0% 50%" }, { x: 0, opacity: 1, rotation: 0, duration: 0.3, ease: "back.out(1.8)" }, 2.16);
          const ck = q("#s06-check"), CL = ck.getTotalLength();
          ck.setAttribute("stroke-dasharray", CL + " " + CL);
          tl.fromTo(ck, { strokeDashoffset: CL }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 2.24);
          tl.fromTo("#s06-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 2.16);
          tl.to(poster, { filter: "blur(0px) contrast(1.04) saturate(1.1) brightness(1.06)", duration: 0.3, ease: "power2.out" }, 2.16);
          tl.to(brief, { y: -18, duration: 0.3, ease: "power2.out" }, 2.16);
          tl.to(poster, { y: -22, duration: 0.3, ease: "power2.out" }, 2.16);

          window.__timelines["s06"] = tl;
        })();
      </script>
    </template>

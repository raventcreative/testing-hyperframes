    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const ei = (x) => Math.pow(clamp(x, 0, 1), 3);
      const back = (x) => { x = clamp(x, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const H = window.HFP;
      const $ = (id) => document.getElementById(id);
      $("e6-bd").innerHTML = H.backdropHTML("e6b");
      // 3D mascot, framed left of centre so the phone has the right side: feet on y 1160
      $("e6-figwrap").style.transformOrigin = "540px 1204px";
      $("e6-figwrap").style.transform = "translate(-170px,-44px) scale(0.78)";
      $("e6-chrome").innerHTML = H.chromeHTML("e6c", 6, "Phone Mockup");

      const phone = $("e6-phone"), glow = $("e6-glow"), cast = $("e6-cast"), cap = $("e6-cap");
      const msgs = [0, 1, 2, 3].map((i) => $("e6-m" + i));
      const typ = { 1: $("e6-t1"), 3: $("e6-t3") };
      const MSG_AT = [0.62, 1.12, 1.62, 2.18];          // bubble pop times
      const TYP = { 1: [0.82, 1.12], 3: [1.84, 2.18] };  // typing indicator windows

      function render(t) {
        // enter: from the right, rotate 12° -> -8° in 0.32 s; exit back out to the right for the loop
        const inP = eo(seg(t, 0.28, 0.6));
        const outP = ei(seg(t, 3.45, 3.85));
        const settle = back(seg(t, 0.28, 0.6));                     // slight overshoot into the -8° pose
        const x = (1 - inP) * 360 + outP * 380;
        const rot = 12 + (-8 - 12) * settle + outP * 20;
        const idle = seg(t, 0.6, 0.9);
        const bob = Math.sin(((t - 0.6) / 2.2) * Math.PI * 2) * 5 * idle;
        const wob = Math.sin(((t - 0.6) / 3.1) * Math.PI * 2) * 0.6 * idle;
        const vis = clamp(inP * 1.8, 0, 1) * (1 - seg(outP, 0.7, 1));   // stays solid while it slides out
        phone.style.opacity = vis.toFixed(3);
        phone.style.transform = "translate(" + x.toFixed(1) + "px," + bob.toFixed(2) + "px) rotate(" + (rot + wob).toFixed(2) + "deg)";
        cast.style.opacity = (vis * 0.9).toFixed(3);
        cast.style.transform = "translate(" + (x + 18).toFixed(1) + "px," + (bob * 0.6 + 26).toFixed(2) + "px) rotate(" + (rot + wob).toFixed(2) + "deg)";
        glow.style.opacity = vis.toFixed(3);
        // chat bubbles
        for (let i = 0; i < 4; i++) {
          const p = seg(t, MSG_AT[i], MSG_AT[i] + 0.26);
          const s = 0.55 + 0.45 * back(p);
          const o = clamp(p * 3, 0, 1);
          msgs[i].style.opacity = o.toFixed(3);
          msgs[i].style.transformOrigin = i % 2 === 0 ? "100% 100%" : "0% 100%";
          msgs[i].style.transform = "translateY(" + ((1 - eo(p)) * 14).toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
          if (typ[i]) {
            const [a, b] = TYP[i];
            const on = eo(seg(t, a, a + 0.1)) * (1 - seg(t, b - 0.04, b + 0.04));
            typ[i].style.opacity = on.toFixed(3);
            const dots = typ[i].children;
            for (let d = 0; d < 3; d++) {
              const ph = Math.sin((t * 7 - d * 0.9) * Math.PI) * 0.5 + 0.5;
              dots[d].style.transform = "translateY(" + (-ph * 4).toFixed(1) + "px)";
              dots[d].style.opacity = (0.45 + 0.55 * ph).toFixed(2);
            }
          }
        }
        const c = eo(seg(t, 0.4, 0.75)) * (1 - seg(t, 3.45, 3.8));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px)";
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e06"] = tl;
    })();

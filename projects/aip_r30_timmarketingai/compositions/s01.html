<template>
  <style>
    /* s01 HOOK (0.00–13.47) "Cari tren, nulis caption, bikin desain, isi suara, posting, balas komen, cek angka. Semua kamu kerjain
       sendiri? Coba bayangin semua itu dipegang tim marketing AI, dan kamu cukup jadi bosnya."
       Recipe "spinning pain list": a slot-machine to-do reel that enters already spinning (blurred), lands on each chore as it is
       named (small overshoot), counter 1..7 of 7; "angka." spins fast again and lands on "Semua: kamu sendiri" (cyan), the window
       wobbles (CHAOS). "Coba": the reel bursts into 7 chore chips scattered at angles; "tim marketing AI": three AI module boxes
       rise and the chips fly into them (CONTROL); "kamu ... bosnya.": the boss card (crown) lands on top and draws lines to the
       three modules. The accent dot (guide object) is the reel's selector, then sits on the crown (hand-over to s02). */
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s01-win { position: absolute; left: 150px; top: 352px; width: 780px; height: 540px; }
    #s01-wh { position: absolute; left: 0; top: 0; width: 780px; height: 74px; border-bottom: 1.5px solid rgba(255,255,255,.10); }
    #s01-wh b { position: absolute; left: 28px; top: 0; font: 700 26px/74px Poppins; color: #fff; white-space: nowrap; }
    #s01-cnt { position: absolute; right: 22px; top: 16px; height: 42px; width: 150px; border-radius: 21px; background: rgba(1,204,247,.12);
      box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.55); overflow: hidden; }
    #s01-cntc { position: absolute; left: 0; top: 0; width: 150px; }
    #s01-cntc i { display: block; height: 42px; font: 700 19px/42px Poppins; font-style: normal; color: #6adfff; text-align: center; white-space: nowrap; }
    #s01-vp { position: absolute; left: 0; top: 80px; width: 780px; height: 450px; overflow: hidden;
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 78%, transparent 100%); }
    #s01-band { position: absolute; left: 18px; top: 260px; width: 744px; height: 84px; border-radius: 22px; background: rgba(1,204,247,.10);
      box-shadow: inset 0 0 0 2.5px #01ccf7, 0 0 30px rgba(1,204,247,.3); }
    #s01-bandon { position: absolute; left: 18px; top: 260px; width: 744px; height: 84px; border-radius: 22px; background: #01ccf7; box-shadow: 0 0 40px rgba(1,204,247,.6); }
    #s01-col { position: absolute; left: 0; top: 0; width: 780px; }

    #s01-fin .k-ic { left: 52px; top: 12px; width: 60px; height: 60px; background: #0b1440; color: #6adfff; box-shadow: none; }
    #s01-fin b { position: absolute; left: 134px; top: 0; font: 700 40px/84px Poppins; color: #0b1440; white-space: nowrap; }
    #s01-tag { position: absolute; left: 540px; top: 912px; }
    .s01-chip { font-size: 24px; height: 54px; border-radius: 27px; }
    #s01-lines { position: absolute; left: 0; top: 0; width: 1080px; height: 945px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1080" data-height="1920">
    <div id="s01-wrap" class="k-ab" style="width:1080px;height:945px"></div>
  </div>
  <script>
    (function () {
      const K = window.R30K, P = "s01", D = K.dur(P);
      const S = K.scene(P, D), { tl, ft, I, wt, $, popIn, fadeOut } = S;
      const CH = [["trending-up", "Cari tren"], ["pen-line", "Nulis caption"], ["palette", "Bikin desain"], ["mic", "Isi suara"], ["send", "Posting"],
        ["message-circle", "Balas komen"], ["chart-column", "Cek angka"]];
      const ROWS = []; for (let r = 0; r < 4; r++) CH.forEach((c) => ROWS.push(c));
      const RH = 90, BAND = 260 + 42 - 45;   // column y that centres row 0 in the band
      $("s01-wrap").innerHTML = K.layers(P);
      const cam = $("s01-cam"), hud = $("s01-hud");
      cam.innerHTML = `<div class="k-glass" id="s01-win"><div id="s01-wh"><b>To-do marketing minggu ini</b><div id="s01-cnt"><div id="s01-cntc">` +
        [1, 2, 3, 4, 5, 6, 7].map((n) => `<i>${n} dari 7</i>`).join("") + `<i>7 kerjaan</i></div></div></div>` +
        `<div id="s01-vp"><div id="s01-band"></div><div id="s01-col">` + ROWS.map(([ic, t]) => `<div class="s01-row"><div class="k-ico">${K.svg(ic)}</div><b>${t}</b></div>`).join("") +
        `</div><div id="s01-bandon"></div><div id="s01-fin"><div class="k-ic">${K.svg("user")}</div><b>Semua: kamu sendiri?</b></div></div></div>`;
      const SCAT = [[262, 430, -12], [790, 452, 9], [196, 600, -6], [884, 628, 13], [430, 760, -10], [720, 812, 7], [300, 892, -14]];
      const HOME = [0, 0, 1, 1, 1, 1, 2];   // which module each chore goes to
      hud.innerHTML = K.linesHTML(P) + K.BOX.map((_, i) => K.boxHTML(P, i)).join("") + CH.map(([ic, t], i) => K.chipHTML(`s01-c${i}`, ic, t)).join("") + K.bossHTML(P) + K.dotHTML(P);
      document.querySelectorAll("#s01-hud .k-chip").forEach((e) => e.classList.add("s01-chip"));
      const w = (x, a) => wt(x, a);
      const T = { cari: w("Cari"), nul: w("nulis"), bik: w("bikin"), isi: w("isi"), pos: w("posting,"), bal: w("balas"), cek: w("cek"), ang: w("angka."),
        sem: w("Semua"), sen: w("sendiri?"), cob: w("Coba"), dip: w("dipegang"), tim: w("tim"), mar: w("marketing"), ai: w("AI,"), kam: w("kamu", 11), bos: w("bosnya.") };
      K.cam(S);
      // ---------------------------------------------------------------- the reel (enters already spinning)
      const col = $("s01-col"), win = $("s01-win"), cntc = $("s01-cntc");
      const Y = (r) => BAND - r * RH;
      I(win, { opacity: 1, scale: 1, rotation: 0, transformOrigin: "50% 50%" });
      I(col, { y: Y(0), filter: "blur(5px)" });
      ft(col, { y: Y(0), filter: "blur(5px)" }, { y: Y(7), filter: "blur(0px)", duration: T.cari + 0.1, ease: "power3.out" }, 0.005);
      const lands = [T.nul, T.bik, T.isi, T.pos, T.bal, T.cek];
      lands.forEach((t, k) => ft(col, { y: Y(7 + k) }, { y: Y(8 + k), duration: 0.3, ease: "back.out(1.7)" }, t - 0.12));
      I(cntc, { y: 0 });
      [T.cari, ...lands].forEach((t, k) => { if (k) ft(cntc, { y: -(k - 1) * 42 }, { y: -k * 42, duration: 0.25, ease: "power3.out" }, t - 0.05); });
      const band = $("s01-band"); I(band, { scale: 1, transformOrigin: "50% 50%" });
      [T.cari, ...lands].forEach((t) => ft(band, { scale: 1.035 }, { scale: 1, duration: 0.3, ease: "power2.out" }, t + 0.12));
      // "angka." -> fast spin, lands on the final row (the band turns cyan)
      ft(col, { y: Y(13), filter: "blur(0px)" }, { y: Y(27), filter: "blur(6px)", duration: T.sem - T.ang - 0.05, ease: "power2.in" }, T.ang + 0.05);
      const on = $("s01-bandon"), fin = $("s01-fin");
      I(on, { opacity: 0, scaleY: 0.2, transformOrigin: "50% 50%" }); I(fin, { opacity: 0, y: -60 });
      ft(col, { opacity: 1 }, { opacity: 0, duration: 0.12 }, T.sem - 0.08);
      ft(on, { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.28, ease: "back.out(1.8)" }, T.sem - 0.06);
      ft(fin, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.32, ease: "back.out(1.6)" }, T.sem - 0.06);
      ft(cntc, { y: -6 * 42 }, { y: -7 * 42, duration: 0.25, ease: "power3.out" }, T.sem);
      // "sendiri?": the window wobbles (chaos)
      ft(win, { rotation: 0 }, { rotation: -1.6, duration: 0.07, yoyo: true, repeat: 5, ease: "sine.inOut" }, T.sen - 0.05);
      ft(win, { scale: 1 }, { scale: 1.03, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, T.sen);
      // "Coba": the reel bursts into 7 chips
      ft(win, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.86, duration: 0.3, ease: "power2.in" }, T.cob - 0.1);
      CH.forEach((_, i) => {
        const c = $(`s01-c${i}`), [x, y, r] = SCAT[i];
        K.at(S, c, 540, 655, { scale: 0.4, opacity: 0, rotation: 0 });
        ft(c, { x: 540, y: 655, scale: 0.4, opacity: 0, rotation: 0 }, { x, y, scale: 1, opacity: 1, rotation: r, duration: 0.5, ease: "back.out(1.4)" }, T.cob + 0.02 + i * 0.04);
        // jitter while they float (chaos)
        ft(c, { rotation: r }, { rotation: r + (i % 2 ? 4 : -4), duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut" }, T.cob + 0.6 + i * 0.05);
      });
      // ---------------------------------------------------------------- "tim marketing AI": three module boxes, chips fly in (control)
      K.BOX.forEach((b, i) => { const bx = $(`s01-bx${i}`); I(bx, { x: b.x, y: b.y + 120, scale: 0.6, opacity: 0 });
        ft(bx, { y: b.y + 120, scale: 0.6, opacity: 0 }, { y: b.y, scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, T.tim - 0.15 + i * 0.12); });
      CH.forEach((_, i) => {
        const c = $(`s01-c${i}`), b = K.BOX[HOME[i]], [x, y, r] = SCAT[i], tf = T.mar + 0.05 + i * 0.07;
        ft(c, { x, y, scale: 1, rotation: r + (i % 2 ? 4 : -4) }, { x: b.x, y: b.y + 40, scale: 0.3, rotation: 0, duration: 0.42, ease: "power3.in" }, tf);
        ft(c, { opacity: 1 }, { opacity: 0, duration: 0.1 }, tf + 0.36);
        const ic = $(`s01-bi${i}`); I(ic, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
        ft(ic, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "back.out(2.2)" }, tf + 0.38);
        ft($(`s01-bx${HOME[i]}`), { scale: 1 }, { scale: 1.04, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, tf + 0.38);
      });
      // ---------------------------------------------------------------- "kamu ... bosnya.": boss card + lines
      const boss = $("s01-boss");
      I(boss, { x: K.BOSS.x, y: K.BOSS.y - 120, scale: 0.7, opacity: 0 });
      ft(boss, { y: K.BOSS.y - 120, scale: 0.7, opacity: 0 }, { y: K.BOSS.y, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, T.kam - 0.15);
      K.BOX.forEach((_, i) => { const l = $(`s01-ln${i}`); I(l, { opacity: 0, strokeDashoffset: 0 });
        ft(l, { opacity: 0 }, { opacity: 1, duration: 0.25 }, T.bos - 0.1 + i * 0.08);
        ft(l, { strokeDashoffset: 0 }, { strokeDashoffset: -64, duration: 1.2, ease: "none", repeat: 0 }, T.bos + 0.1); });
      ft(boss, { scale: 1 }, { scale: 1.06, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, T.bos);
      // ---------------------------------------------------------------- accent dot: reel selector -> boss crown
      const dot = $("s01-dot");
      I(dot, { x: 186, y: 734, scale: 0, opacity: 1 });
      ft(dot, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, T.cari - 0.05);
      [T.cari, ...lands].forEach((t) => ft(dot, { scale: 1.5 }, { scale: 1, duration: 0.3, ease: "power2.out" }, t + 0.1));
      ft(dot, { scale: 1 }, { scale: 0, duration: 0.2 }, T.cob - 0.12);
      const crown = [K.BOSS.x - 190 + 18 + 72, K.BOSS.y - 58 + 22];
      tl.set(dot, { x: crown[0], y: crown[1] }, T.bos - 0.2);
      ft(dot, { scale: 0 }, { scale: 1, duration: 0.34, ease: "back.out(2.6)" }, T.bos);
      S.finish();
    })();
  </script>
</template>

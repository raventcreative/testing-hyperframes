  <script>
    (function () {
      const D = 1.7667;
      const root = document.querySelector('[data-composition-id="s10"]');
      const $ = (id) => root.querySelector("#" + id);
      const tl = gsap.timeline({ paused: true });
      // runtime guard (lead): never let the `scale` shorthand reach GSAP — it can leave scaleY stale depending on seek order
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const mk = (cls, css) => { const e = document.createElement("div"); e.className = "s10-abs " + cls; e.style.cssText = css; $("s10-fx").appendChild(e); return e; };
      // words (local s): Ketiga, 0.25 · gambar 0.82 · AI. 1.27
      const APEX = 0.25, W1 = 0.82, W2 = 1.27;
      const rig = $("s10-rig"), far = $("s10-far"), mid = $("s10-mid"), near = $("s10-near"), nw = $("s10-nw"), pill = $("s10-pill");
      const C = 1369.73, F0 = 0.5, F1 = 0.75;   // progress ring: this round's quarter
      const XS = D - 0.41;                       // exit wind-up starts here

      // ---------------- ENTRY: iris-OPEN out of s09's iris-close (circle grows from the hero centre)
      const IR = "circle(50px at 540px 606px)", IR1 = "circle(1000px at 540px 606px)";
      tl.set(rig, { clipPath: IR }, 0);
      ft(rig, { clipPath: IR }, { clipPath: IR1, duration: 0.52, ease: "power2.out" }, 0);
      tl.set(rig, { clipPath: "none" }, 0.52);
      const iris = $("s10-iris");
      tl.set(iris, { attr: { r: 50 }, opacity: 1 }, 0);
      ft(iris, { attr: { r: 50 } }, { attr: { r: 1000 }, duration: 0.52, ease: "power2.out" }, 0);
      ft(iris, { opacity: 1 }, { opacity: 0, duration: 0.26, ease: "power1.in" }, 0.08);
      tl.set($("s10-flash"), { opacity: 1, display: "block" }, 0);
      ft($("s10-flash"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 0);
      // the oversized iris helpers leave the render tree once they are spent
      tl.set($("s10-flash"), { display: "none" }, 0.31);
      tl.set($("s10-irisv"), { display: "block" }, 0);
      tl.set($("s10-irisv"), { display: "none" }, 0.35);
      // inside the iris the hero settles from a little closer (depth)
      ft(mid, { scaleX: 1.3, scaleY: 1.3 }, { scaleX: 1, scaleY: 1, duration: 0.42, ease: "power3.out" }, 0);
      ft(near, { scaleX: 1.8, scaleY: 1.8 }, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, 0);

      // ---------------- ROUND-TITLE SYSTEM (identical in s04 / s07 / s10 / s13) ----------------
      // far plane: the light breathes, the near discs drift
      ft($("s10-blob"), { scaleX: 0.92, scaleY: 0.92, opacity: 0.7 }, { scaleX: 1.06, scaleY: 1.06, opacity: 1, duration: D, ease: "sine.inOut" }, 0);
      // the dial spins in and settles (a stopwatch for the round), then keeps creeping

      ft($("s10-b1"), { x: 0, y: 0 }, { x: 26, y: -34, duration: D, ease: "sine.inOut" }, 0);
      ft($("s10-b2"), { x: 0, y: 0 }, { x: -22, y: 30, duration: D, ease: "sine.inOut" }, 0);

      ft(dig, { "--gx": "-320px" }, { "--gx": "480px", duration: 0.55, ease: "power2.inOut" }, APEX - 0.02);

        tl.set(w, { yPercent: 115 }, 0);

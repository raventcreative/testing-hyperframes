      const tl = gsap.timeline({ paused: true });

      const A = 0.783; // 'dipertahankan,'
      const cells = qa(".s10-cell");
      const sp = ["#s10-sp1", "#s10-sp2", "#s10-sp3", "#s10-sp4"];
      gsap.set("#s10-cam", { scale: 1 });
      gsap.set("#s10-frame", { y: -50 });
      gsap.set("#s10-latchL", { rotation: -72, svgOrigin: "121 860" });
      gsap.set("#s10-latchR", { rotation: 72, svgOrigin: "959 860" });
      gsap.set(cells, { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#s10-ring", { scale: 1, opacity: 0, svgOrigin: "540 860" });
      gsap.set("#s10-shL", { scale: 0.4, opacity: 0, svgOrigin: "150 860" });
      gsap.set("#s10-shR", { scale: 0.4, opacity: 0, svgOrigin: "930 860" });
      gsap.set(sp, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(["#s10-rl1", "#s10-rl2"], { fill: "#9fb6d6" });
      gsap.set(["#s10-far1", "#s10-far2"], { x: 0 });
      gsap.set("#s10-near", { x: 0, y: 0 });

      // far / near parallax (still camera)
      tl.fromTo("#s10-far1", { x: 0 }, { x: 14, duration: 1.72, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s10-far2", { x: 0 }, { x: -12, duration: 1.72, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#s10-near", { x: 0, y: 0 }, { x: 26, y: -18, duration: 1.72, ease: "none", immediateRender: false }, 0);

      // 'Formatnya bisa': frame descends along the rails and aligns
      tl.fromTo("#s10-frame", { y: -50 }, { y: -8, duration: 0.58, ease: "power2.inOut", immediateRender: false }, 0.02);
      // anticipation: tiny lift, latches cock open
      tl.to("#s10-frame", { y: -16, duration: 0.1, ease: "power2.out" }, 0.6);
      tl.fromTo("#s10-latchL", { rotation: -72 }, { rotation: -84, duration: 0.12, ease: "power2.out", immediateRender: false }, 0.57);
      tl.fromTo("#s10-latchR", { rotation: 72 }, { rotation: 84, duration: 0.12, ease: "power2.out", immediateRender: false }, 0.57);
      // APEX: slam + clamp
      tl.to("#s10-frame", { y: 0, duration: 0.083, ease: "power4.in" }, A - 0.083);
      tl.to("#s10-latchL", { rotation: 0, duration: 0.09, ease: "power4.in" }, A - 0.09);
      tl.to("#s10-latchR", { rotation: 0, duration: 0.09, ease: "power4.in" }, A - 0.09);
      tl.fromTo(cells, { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "expo.out", stagger: 0.028, immediateRender: false }, A);
      tl.fromTo("#s10-ring", { scale: 1, opacity: 0.9 }, { scale: 1.09, opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, A);
      tl.fromTo(["#s10-shL", "#s10-shR"], { scale: 0.4, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, A);
      tl.fromTo(sp, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)", stagger: 0.03, immediateRender: false }, A);
      tl.to(sp, { scale: 0, opacity: 0, duration: 0.28, ease: "power2.in", stagger: 0.03 }, A + 0.28);
      tl.fromTo(["#s10-rl1", "#s10-rl2"], { fill: "#9fb6d6" }, { fill: "#ffffff", duration: 0.06, immediateRender: false }, A);
      // camera: still, then a tiny punch
      tl.fromTo("#s10-cam", { scale: 1 }, { scale: 1.018, duration: 0.07, ease: "power2.out", immediateRender: false }, A);
      tl.to("#s10-cam", { scale: 1, duration: 0.3, ease: "power2.inOut" }, A + 0.07);

      window.__timelines["s10"] = tl;
    })();
  </script>
</template>

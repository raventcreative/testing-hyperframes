<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 30 Plugin Claude</title>
<!-- Reels cover 1080x1920; key content inside the centred 4:5 grid crop (y 285-1635).
     Render: node thumbnail/render_thumb.cjs <pose t> <out.png> [mouth t]  (static server on :8765 at project root) -->
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<script src="../vendor/plugins_data.js"></script>
<style>
  @font-face { font-family: "Poppins"; src: url("../assets/fonts/poppins-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Poppins"; src: url("../assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root { --grad: linear-gradient(135deg, #0a0d2c 0%, #294b77 100%); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Poppins", sans-serif; color: #0a0d2c; -webkit-font-smoothing: antialiased; }
  #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: url(../assets/brand/pastel_background_1080x1920.png) 0 0 / 1080px 1920px; }
  .abs { position: absolute; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #blobA { left: -300px; top: 100px; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(circle, rgba(120,160,235,.32), rgba(120,160,235,0) 65%); }
  #wallWrap { left: 0; top: 920px; width: 1080px; height: 700px; perspective: 1100px; perspective-origin: 540px 0; }
  #wall { position: absolute; left: 60px; top: 0; width: 960px; height: 700px; transform: rotateX(30deg) scale(.78); transform-origin: 50% 0;
    -webkit-mask: linear-gradient(180deg, #000 30%, transparent 92%); mask: linear-gradient(180deg, #000 30%, transparent 92%); }
  .tl { position: absolute; border-radius: 26%; overflow: hidden; background: #fff; box-shadow: 0 12px 26px rgba(20,40,90,.16), 0 0 0 1.5px rgba(41,75,119,.08); }
  .tl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tl span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; letter-spacing: -1px; }
  .card { position: absolute; width: 470px; height: 150px; border-radius: 28px; background: #fff; box-shadow: 0 26px 60px rgba(20,40,90,.22), 0 0 0 1.5px rgba(41,75,119,.07); overflow: hidden; }
  .card .acc { position: absolute; left: 0; top: 0; width: 9px; height: 150px; }
  .card .nm { position: absolute; left: 132px; top: 24px; font-size: 36px; line-height: 46px; font-weight: 700; white-space: nowrap; }
  .card .rp { position: absolute; left: 132px; top: 76px; font-size: 20px; color: #5d6b8a; white-space: nowrap; }
  .card .st { position: absolute; left: 132px; top: 104px; height: 34px; padding: 0 14px; border-radius: 17px; background: #fff5d6; color: #8a5a00; font-size: 21px; font-weight: 700; line-height: 34px; }
  #m { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #logo { left: 425px; top: 205px; width: 230px; height: 20.8px; }
  #chip { left: 50%; top: 330px; transform: translateX(-50%); height: 62px; padding: 0 30px; border-radius: 31px; background: var(--grad); color: #fff;
    font-size: 27px; font-weight: 700; line-height: 62px; letter-spacing: 3px; white-space: nowrap; box-shadow: 0 12px 30px rgba(10,13,44,.25); }
  #big { top: 410px; font-size: 206px; line-height: 260px; font-weight: 700; letter-spacing: -8px; }
  #l2 { top: 678px; font-size: 64px; line-height: 80px; font-weight: 400; color: #294b77; }
  #l3 { top: 754px; font-size: 128px; line-height: 150px; font-weight: 700; letter-spacing: -4px; }
  #l3 svg { vertical-align: -10px; margin-right: 18px; }
  #badge { left: 50%; top: 1790px; transform: translateX(-50%); height: 96px; padding: 0 40px; border-radius: 48px; white-space: nowrap;
    background: var(--grad); color: #fff; font-size: 40px; line-height: 96px; box-shadow: 0 20px 60px rgba(10,13,44,.35); }
  #badge b { color: #ffd76a; }
  #grain { inset: 0; opacity: .07; background: url(../assets/brand/grain_256.png); mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="main">
  <div id="blobA" class="abs"></div>
  <div id="wallWrap" class="abs"><div id="wall"></div></div>
  <div id="cardA" class="card" style="left:-62px;top:1120px;transform:rotate(-6deg)"></div>
  <div id="cardB" class="card" style="left:604px;top:985px;transform:rotate(5deg)"></div>
  <canvas id="m" width="1080" height="1920"></canvas>
  <img id="logo" class="abs" src="../assets/brand/logo_dark.png" alt="AIpreneur">
  <div id="chip" class="abs">PLUGIN CLAUDE TERBAIK</div>
  <div id="big" class="ctr g">30 PLUGIN</div>
  <div id="l2" class="ctr">yang wajib lu tahu, semua dari</div>
  <div id="l3" class="ctr"><svg width="112" height="112" viewBox="0 0 24 24"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d2c"/><stop offset="1" stop-color="#294b77"/></linearGradient></defs><path fill="url(#gg)" d="M12 1C5.9 1 1 5.9 1 12c0 4.9 3.2 9 7.5 10.4.6.1.8-.2.8-.5v-1.9c-3.1.7-3.7-1.3-3.7-1.3-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.4-.3-5-1.2-5-5.4 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.1-5 5.4.4.3.7 1 .7 2v3c0 .3.2.6.8.5C19.8 21 23 16.9 23 12 23 5.9 18.1 1 12 1z"/></svg><span class="g">GitHub</span></div>
  <div id="badge" class="abs">Komen <b>PLUGIN</b> → 30 link ke DM</div>
  <div id="grain" class="abs"></div>
</div>
<script>
  const PL = window.PLUGINS, CATS = window.CATS;
  const catOf = (id) => CATS.find((c) => c.id === id);
  function tile(p, size) {
    const d = document.createElement("div"); d.className = "tl"; d.style.width = size + "px"; d.style.height = size + "px";
    const c = catOf(p.cat);
    if (p.logo) d.innerHTML = `<img src="../${p.logo}" alt="">`;
    else { d.style.background = c.tint; d.innerHTML = `<span style="color:${c.col};font-size:${Math.round(size * (p.mono.length > 2 ? 0.3 : 0.4))}px">${p.mono}</span>`; }
    return d;
  }
  // wall: all 30 in category rows (6 x 5), tilted away
  const wall = document.getElementById("wall"), T = 128, G = 30;
  PL.forEach((p, i) => { const t = tile(p, T); t.style.left = (i % 6) * (T + G) + "px"; t.style.top = Math.floor(i / 6) * (T + G) + "px"; wall.appendChild(t); });
  // two real repo cards with live star counts
  function card(el, p) {
    const c = catOf(p.cat);
    el.innerHTML = `<div class="acc" style="background:${c.col}"></div><div class="nm g">${p.name}</div><div class="rp">${p.repo}</div><div class="st">★ ${p.starsTxt}</div>`;
    const t = tile(p, 92); Object.assign(t.style, { left: "26px", top: "29px" }); el.appendChild(t);
  }
  card(document.getElementById("cardA"), PL[0]);
  card(document.getElementById("cardB"), PL[26]);
  // mascot: same rig, face calibration and director as the reel; pose from the reel at ?t=
  const q = new URLSearchParams(location.search), Tp = parseFloat(q.get("t") || "8.2");
  const M3 = window.Mascot3D, VW = window.VO_WORDS, PH = window.VO_PHR, D = 48.4;
  const W0 = PH.hook[1].start + 0.2;
  const intents = [{ t: PH.hook[0].start + 0.05, action: "emphasize", side: "left" }, { t: PH.hook[1].start, action: "present", side: "right" }, { t: W0 + 0.4, action: "idle" }, { t: PH.hook[2].start + 0.3, action: "reveal" }];
  const ROT = ["pointFwd", "explain", "present", "emphasize", "pointFwd"];
  PH.cats.forEach((c, ci) => {
    intents.push({ t: c.label.start - 0.05, action: ci % 2 ? "present" : "reveal", side: ci % 2 ? "left" : "right" });
    c.names.forEach((n, k) => { if (k % 2 === 0) intents.push({ t: n.start - 0.05, action: ROT[(ci + k / 2) % ROT.length], side: (ci + k / 2) % 2 ? "left" : "right" }); });
  });
  intents.push({ t: PH.outro[0].start, action: "emphasize", side: "right" }, { t: PH.outro[1].start, action: "pointFwd", side: "left" }, { t: PH.outro[2].start, action: "explain", side: "right" });
  intents.push({ t: PH.cta[0].start, action: "cta", side: "right" }, { t: PH.cta[1].start + 0.9, action: "welcome", side: "left" });
  const DIR = M3.direct(VW, D, { intents, seed: 5, quiet: 0.2, look: 0 });
  const PERF = M3.buildPerformance(DIR.tracks, D + 0.05);
  const FACE = {"eyeA": {"c": [-0.091, 0.596], "r": [0.041, 0.034], "n": 757, "J": [0.4997633976754324, 0.3065330127591157, 0.314518943050391, -0.453702164567319], "uv0": [0.6328573151105054, 0.6167170084324972], "maxErr": 0.003818576762005663}, "eyeB": {"c": [0.091, 0.596], "r": [0.041, 0.034], "n": 753, "J": [0.5500133280433187, -0.06824460818744192, -0.09499495020823343, -0.5077214816509605], "uv0": [0.12402271349668496, 0.8611807690751265], "maxErr": 0.0028305745008792753}, "browA": {"c": [-0.09, 0.68], "n": 510, "J": [0.43108254869646895, 0.4376875904621281, 0.3523513551101368, -0.4754305212249294], "uv0": [0.6629852372177631, 0.5810053999225538], "maxErr": 0.004289199391581338}, "browB": {"c": [0.09, 0.68], "n": 362, "J": [0.5552915360962205, 0.08489039751259354, 0.1020935044591921, -0.6884358006120392], "uv0": [0.8350086373766634, 0.9448922678325264], "maxErr": 0.0020738571975070096}, "mouth": {"c": [0, 0.548], "r": [0.026, 0.016]}, "skin": [252, 240, 232], "skinEye": [252, 244, 234], "coverNormal": 0, "lidLit": [0.992, 0.975, 0.968], "mouthDy": 0.0, "faceSmooth": 1.0, "headC": [0, 0.7, -0.02]};
  window.THUMB_READY = fetch("../tools/decals.json").then((r) => r.json()).then((decals) => {
    decals.forEach((d) => { d.url = "../" + d.url; });
    return M3.Mascot.create(document.getElementById("m"), { url: "../assets/mascot3d/mascot_jas3_rigged.glb", face: FACE, decals, width: 1080, height: 1920, envIntensity: 0.75 });
  }).then((m) => {
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.5; o.color.setRGB(1.0, 0.97, 0.93); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const Pf = PERF(Tp);
    m.setView({ fx: 540, fy: 2060, h: 1000, yaw: 0, pitch: 4 });
    m.setState({ root: { x: Pf.root.x, y: Pf.root.y, ry: Pf.root.ry, rz: Pf.root.rz, rx: 0, s: Pf.root.s }, bones: Pf.bones,
      face: { blink: [0, 0], gaze: [0, 0], mouthMix: 1, mouth: M3.buildLipTrack(window.VO_PHONES, window.VO_ENV, D)(parseFloat(q.get("mt") || Tp)) } });
    m.render();
    return document.fonts.ready;
  });
</script>
</body>
</html>

<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    .s01-a { position: absolute; }
    #s01-zone { left: 0; top: 0; width: 1080px; height: 945px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 0, #000 930px, transparent 945px); mask-image: linear-gradient(180deg, #000 0, #000 930px, transparent 945px); }
    #s01-spot { left: 140px; top: 470px; width: 800px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(106,223,255,.30), rgba(1,204,247,.08) 55%, rgba(1,204,247,0)); }
    #s01-beams { left: 0; top: 0; width: 1080px; height: 945px; overflow: visible; }
    #s01-beams line { stroke-width: 3; stroke-linecap: round; }
    #s01-pill { left: 744px; top: 548px; height: 68px; padding: 0 24px 0 12px; border-radius: 34px; display: flex; align-items: center; gap: 12px; white-space: nowrap;
      background: #ffffff; color: #e5484d; font: 700 32px/68px Poppins, sans-serif; box-shadow: 0 18px 34px -14px rgba(0,0,0,.7), 0 0 0 3px rgba(229,72,77,.35); transform-origin: 0 50%; }
    #s01-pill i { position: relative; width: 46px; height: 46px; border-radius: 50%; background: #e5484d; color: #fff; }
    #s01-pill i svg { position: absolute; left: 11px; top: 11px; width: 24px; height: 24px; }
    .s01-ink { left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 6px solid rgba(229,72,77,.75); }
  </style>
  <div id="root" data-composition-id="s01" data-width="1080" data-height="1920">
    <div class="s01-a" id="s01-zone">
      <div class="s01-a" id="s01-spot"></div>
      <svg class="s01-a" id="s01-beams" viewBox="0 0 1080 945"><defs><linearGradient id="s01-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6adfff" stop-opacity=".9"/><stop offset="1" stop-color="#01ccf7" stop-opacity=".15"/></linearGradient></defs><g id="s01-bl"></g></svg>
      <div class="s01-a" id="s01-cvw"></div>
      <div class="s01-a" id="s01-inks"></div>
      <div class="s01-a" id="s01-pill"><i></i>7× ditolak</div>
    </div>
  </div>
  <script>
    (function () {
      // s01 HOOK "Aku bikin panel rekrutmen isinya 7 Claude. Tugasnya cuma satu: nolak CV kamu."
      // FRAME 0: the judges' table + 7 empty seats (panel.html) and YOUR CV under a spotlight (striking, readable). "7": the 7 Claude
      // reviewers drop into their seats (panel.html) · "Tugasnya cuma satu:": 7 cyan sight-lines from the seats lock onto the CV ·
      // "nolak": 7 TOLAK stamps slam onto the CV, one per reviewer (order CVK.STAMP_ORDER), the CV shudders · "kamu.": "7× ditolak" pill.
      // END STATE (t = D): CV centre (540,722) scale .75 rotationX 10 (perspective 1400) with all 7 stamps · pill x744 y548 · spot.
      const SC = window.VO_SCENES.find((s) => s.id === "s01");
      const D = SC.dur, ST = SC.start, VW = window.VO_WORDS, K = window.CVK;
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= after); return w ? w[1] : 0; };
      const L = (txt) => wt(txt, ST - 0.05) - ST;
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const KF = (el, init, steps) => { I(el, init); const cur = Object.assign({}, init);
        steps.sort((a, b) => a[0] - b[0]).forEach(([t, d, to, ease]) => { const fr = {}; for (const k in to) fr[k] = cur[k];
          if (d <= 0) tl.set(el, to, t); else ft(el, fr, Object.assign({ duration: d, ease: ease || "power3.out" }, to), t); Object.assign(cur, to); }); };

      const root = $("s01-zone");
      root.insertAdjacentHTML("afterbegin", `<style>${K.css("s01")}</style>`);
      $("s01-cvw").innerHTML = K.cv("s01", "cv", 1); K.pin(tl, "s01", "cv", 1);
      $("s01-cv-st").innerHTML = K.stamps("s01", "cv");
      $("s01-pill").querySelector("i").innerHTML = K.isvg("x", 3);

      const t7 = L("7"), tTug = L("Tugasnya"), tSat = L("satu:"), tNol = L("nolak"), tKam = L("kamu.");
      // ---------------------------------------------------------------- the CV: slow push-in from frame 0, small lift on "7"
      const cv = $("s01-cv");
      KF(cv, { x: 540, y: 734, scale: 0.72, rotationX: 12, transformPerspective: 1400, rotation: 0 }, [
        [0, t7 - 0.1, { y: 726, scale: 0.74 }, "sine.out"],
        [t7 - 0.1, tNol - t7, { y: 722, scale: 0.75, rotationX: 10 }, "sine.inOut"]]);
      const spot = $("s01-spot");
      KF(spot, { opacity: 0.75, scale: 0.94 }, [[0, 2.2, { opacity: 1, scale: 1 }, "sine.out"], [tTug - 0.1, 0.5, { opacity: 0.85 }, "power1.out"]]);

      // ---------------------------------------------------------------- "Tugasnya cuma satu:": sight-lines from each seat onto the CV
      const bl = $("s01-bl"); let lines = "";
      const AIM = [[0, 0], [430, 640], [470, 610], [510, 590], [540, 580], [570, 590], [610, 610], [650, 640]];
      for (let k = 1; k <= 7; k++) { const x1 = K.SEAT_X(k), y1 = 500, [x2, y2] = AIM[k];
        lines += `<line id="s01-ln${k}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#s01-bg)"/>`; }
      bl.innerHTML = lines;
      for (let k = 1; k <= 7; k++) { const ln = $("s01-ln" + k), [x2, y2] = AIM[k], len = Math.hypot(x2 - K.SEAT_X(k), y2 - 500), q = Math.abs(k - 4);
        I(ln, { strokeDasharray: len, strokeDashoffset: len, opacity: 1 });
        ft(ln, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, tTug - 0.04 + q * 0.05);
        ft(ln, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in" }, tNol - 0.16 + q * 0.02); }

      // ---------------------------------------------------------------- "nolak": the 7 stamps (one per reviewer, from its seat)
      const CX = 540 - 230 * 0.75, CY = 722 - 280 * 0.75;   // CV-local origin in frame coords (approx., ignoring the tilt)
      const inks = $("s01-inks");
      K.STAMPS.forEach(([x, y, r], i) => {
        const k = K.STAMP_ORDER[i], s = $("s01-cv-s" + i), t = tNol - 0.06 + i * 0.075;
        const sx = (K.SEAT_X(k) - CX) / 0.75, sy = (480 - CY) / 0.75;
        KF(s, { x: sx, y: sy, rotation: r * 3, scale: 0.4, opacity: 0 }, [
          [t - 0.16, 0.05, { opacity: 1 }, "none"],
          [t - 0.16, 0.16, { x, y, rotation: r, scale: 1.7 }, "power2.out"],
          [t, 0.09, { scale: 1 }, "power4.in"]]);
        // ink ring at the impact (frame coords)
        const e = document.createElement("div"); e.className = "s01-a s01-ink"; e.id = "s01-ink" + i; inks.appendChild(e);
        KF(e, { x: CX + x * 0.75, y: CY + y * 0.75 + 4, scale: 0.3, opacity: 0 }, [[t + 0.08, 0.02, { opacity: 0.9 }, "none"],
          [t + 0.08, 0.36, { scale: 1.5, opacity: 0 }, "power2.out"]]);
      });
      // the CV shudders under the stamps
      const shake = [];
      for (let i = 0; i < 7; i++) { const t = tNol - 0.06 + i * 0.075 + 0.085; shake.push([t, 0.03, { rotation: (i % 2 ? 1.4 : -1.4) }, "power2.out"], [t + 0.03, 0.04, { rotation: 0 }, "power2.in"]); }
      KF(cv, { rotation: 0 }, shake);
      // ---------------------------------------------------------------- "kamu.": the tally pill
      const pill = $("s01-pill");
      KF(pill, { opacity: 0, scale: 0.4, x: -30 }, [[tKam - 0.12, 0.1, { opacity: 1 }, "none"], [tKam - 0.12, 0.38, { scale: 1, x: 0 }, "back.out(2.4)"]]);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["s01"] = tl;
    })();
  </script>
</template>

    (function () {
      // s08 CTA "Mau panduan sama bank animasinya? Komen EDIT, aku kirim lewat DM."
      // Starts on the GRID · "Mau panduan": a "Panduan + Bank Animasi" folder opens and the 12 live cards are sucked into its tray in
      // reading order (anticipation, then a pop each — the "12 animasi" badge counts every landing) · "bank animasinya?": the title and
      // the two files (panduan.pdf, bank-animasi.js) settle, a sheen runs over the pack · "Komen": the pack lifts and a big comment row
      // slides up, the field focuses · "EDIT,": EDIT types itself huge, one letter per keystroke, the send button lights up, heart pops
      // · "aku kirim": send is pressed, its icon lifts off as a paper plane, loops up to grab the pack and carries it down into a DM card
      // · "DM.": delivered — check draws, "terkirim" · end beat (~1 s): the DM card rises, a soft glow blooms, the dark AI PRENEUR
      // logo settles under it. Ends on this end card (the reel's last frame). Cards are drawn from GLOBAL time (hf-seek).
      const D = 5.1333, ST = 24.0667, VW = window.VO_WORDS, MA = window.MicroAnim;
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= after); return w ? w[1] : 0; };
      const L = (txt, after = 0) => wt(txt, after) - ST;   // local time of a word
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };
      const tPand = L("panduan"), tBank = L("bank", 25), tAnim = L("animasinya?"), tKom = L("Komen"), tEdit = L("EDIT,");
      const tAku = L("aku", 26.5), tKir = L("kirim"), tDM = L("DM.");

      // ---------------------------------------------------------------- the pack opens, the 12 cards are sucked into its tray
      const pack = $("s08-pack"), bw = $("s08-bw"), badge = $("s08-badge");
      I(pack, { x: 0, y: 0, scale: 1 });
      I(bw, { opacity: 0, scale: 0.84, rotationX: 64, y: 30, transformPerspective: 1300 });
      const tOpen = tPand - 0.33;
      ft(bw, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, tOpen);
      ft(bw, { scale: 0.84, rotationX: 64, y: 30 }, { scale: 1, rotationX: 0, y: 0, duration: 0.46, ease: "back.out(1.2)", transformPerspective: 1300 }, tOpen);
      const H = MA.grid($("s08-cards"), "s08-c");
      const TS = 82 / MA.GRID_SIZE, FL = 0.4;                 // tile scale, flight time
      const tLand0 = tPand + 0.15;                            // = the SFX pops (panduan + 0.15 + k · 0.035)
      I(badge, { opacity: 0, scale: 0.3, rotation: -10, textContent: "0 animasi" });
      H.forEach((h, i) => {
        const c = i % 4, r = Math.floor(i / 4);

        const tL = tLand0 + i * 0.035, t0 = tL - FL;
        I(h.el, { x: 0, y: 0, scale: 1 });
        ft(h.el, { x: 0 }, { x: dx, duration: FL, ease: "back.in(1.3)" }, t0);
        ft(h.el, { y: 0 }, { y: dy, duration: FL, ease: "back.in(1.7)" }, t0);
        ft(h.el, { scale: 1 }, { scale: TS, duration: FL, ease: "power2.in" }, t0);
        ft(h.el, { scale: TS }, { scale: TS * 1.12, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out" }, tL);
        tl.set(badge, { textContent: `${i + 1} animasi` }, tL);
      });
      ft(badge, { opacity: 0, scale: 0.3, rotation: -10 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.3, ease: "back.out(2.2)" }, tLand0 - 0.04);
      ft(badge, { scale: 1 }, { scale: 1.14, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out" }, tLand0 + 11 * 0.035 + 0.01);
      // title + the two files
      const h1 = $("s08-h1"), h2 = $("s08-h2"), p1 = $("s08-p1"), p2 = $("s08-p2");
      [[h1, tPand + 0.02], [h2, tBank - 0.06], [p1, tAnim + 0.02], [p2, tAnim + 0.1]].forEach(([e, t]) => {
        I(e, { opacity: 0, y: 26 }); ft(e, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, t);
      });
      // a sheen runs over the finished pack
      const shi = $("s08-shi"); I(shi, { x: 0 });
      ft(shi, { x: 0 }, { x: 1300, duration: 0.5, ease: "power2.inOut" }, tAnim + 0.28);

      // ---------------------------------------------------------------- "Komen": the pack lifts, the comment row slides up
      ft(pack, { y: 0, scale: 1 }, { y: -116, scale: 0.78, duration: 0.42, ease: "power3.inOut" }, tKom - 0.3);
      const cmt = $("s08-cmt");
      I(cmt, { opacity: 0, y: 150 });
      ft(cmt, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "none" }, tKom - 0.12);
      ft(cmt, { y: 150 }, { y: 0, duration: 0.42, ease: "power4.out" }, tKom - 0.12);
      const ring = $("s08-ring"), phd = $("s08-ph"), txt = $("s08-txt"), caret = $("s08-caret");
      I(ring, { opacity: 0 }); ft(ring, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, tKom + 0.12);
      I(phd, { opacity: 1 }); I(txt, { textContent: "", scale: 1 }); I(caret, { opacity: 0 });
      const tType = tEdit - 0.02;                             // = the SFX keystrokes (EDIT − 0.02 + k · 0.07)
      tl.set(caret, { opacity: 1 }, tKom + 0.12);
      tl.set(phd, { opacity: 0 }, tType);
      "EDIT".split("").forEach((_, k) => tl.set(txt, { textContent: "EDIT".slice(0, k + 1) }, tType + k * 0.07));
      for (let k = 1; k <= 6; k++) tl.set(caret, { opacity: k % 2 ? 0 : 1 }, tType + 0.3 + k * 0.13);
      ft(txt, { scale: 1 }, { scale: 1.1, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out" }, tType + 0.24);
      // the send button lights up once there is text
      const son = $("s08-sendon"), sendb = $("s08-send"), sendi = $("s08-sendi");
      I(son, { opacity: 0 }); ft(son, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, tType + 0.21);
      // heart pops (SFX pop at EDIT + 0.35)
      const hs = $("s08-hs"), tHeart = tEdit + 0.35;
      I(hs, { opacity: 0, scale: 0 });
      ft(hs, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(3)" }, tHeart - 0.06);
      const HC = ["#e5484d", "#f4b400", "#e5484d", "#3a6fe0", "#e5484d", "#f4b400"];
      for (let k = 0; k < 6; k++) {
        const b = $("s08-hp" + k), a = (k / 6) * Math.PI * 2 - Math.PI / 2;
        I(b, { x: 0, y: 0, opacity: 0, scale: 1, background: HC[k] });

        ft(b, { x: 0, y: 0, opacity: 1, scale: 1 }, { x: Math.cos(a) * 58, y: Math.sin(a) * 58, opacity: 0, scale: 0.4, duration: 0.36, ease: "power3.out" }, tHeart);
      }

      I(sendb, { scale: 1 }); I(sendi, { opacity: 1 });
      ft(sendb, { scale: 1 }, { scale: 0.88, duration: 0.05, yoyo: true, repeat: 1, ease: "power2.out" }, tAku + 0.01);
      const tLift = tAku + 0.03, t1 = tLift + 0.12, t2 = tDM - 0.32, tDel = tDM - 0.04;   // t2 → tDM − 0.02 the pack lands
      tl.set(sendi, { opacity: 0 }, tLift);
      const SX = 70 + 800 + 55, SY = 690 + 45 + 55;           // send button centre
      const CX0 = 872, CY0 = 344, CX1 = 350, CY1 = 747;       // the pack's top-right corner before / after the carry
      const plane = (el, dly, alpha) => {
        I(el, { x: SX, y: SY, scale: 0.45, rotation: 0, opacity: 0 });
        tl.set(el, { opacity: alpha }, tLift + dly);
        ft(el, { x: SX, y: SY, scale: 0.45, rotation: 0 }, { x: SX - 18, y: SY - 50, scale: 1, rotation: -22, duration: 0.12, ease: "power2.out" }, tLift + dly);
        ft(el, { x: SX - 18 }, { x: CX0, duration: t2 - t1, ease: "sine.inOut" }, t1 + dly);
        ft(el, { y: SY - 50 }, { y: CY0, duration: t2 - t1, ease: "power2.out" }, t1 + dly);
        ft(el, { rotation: -22 }, { rotation: -64, duration: t2 - t1 - 0.05, ease: "power1.out" }, t1 + dly);
        ft(el, { rotation: -64 }, { rotation: -172, duration: 0.15, ease: "power2.inOut" }, t2 - 0.05 + dly);
        ft(el, { x: CX0 }, { x: CX1, duration: 0.3, ease: "power2.inOut" }, t2 + dly);
        ft(el, { y: CY0 }, { y: CY1, duration: 0.3, ease: "power2.in" }, t2 + dly);
        ft(el, { scale: 1, opacity: alpha }, { scale: 0.3, opacity: 0, duration: 0.12, ease: "power2.in" }, tDel + dly);

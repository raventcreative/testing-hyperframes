<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Dari Chat ke Catatan Rapi</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero objects = the film's tilted chat phone (generic UI, no app branding) with its three bubbles peeling off toward a tidy
     "Catatan jualan" sheet (tanggal · pesanan · nominal, "Ilustrasi data"). -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  .t1 { position: absolute; left: 0; width: 1080px; text-align: center; font: 800 150px/1 Rubik; letter-spacing: -4px; color: #fff; white-space: nowrap; }
  #t1a { top: 378px; }
  #t1b { top: 536px; }
  #t1b span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 82%; padding: 0 .08em; }
  #t2 { position: absolute; left: 0; width: 1080px; top: 712px; text-align: center; font: italic 400 60px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: 80px; top: 820px; width: 920px; height: 900px; background: radial-gradient(closest-side, rgba(254,209,17,.16), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 540px 1180px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* phone */
  .pthk { left: -170px; top: -350px; width: 340px; height: 700px; border-radius: 54px; background: linear-gradient(160deg, #5a67a3 0%, #26306a 45%, #0d1233 100%); }
  .pbody { left: -170px; top: -350px; width: 340px; height: 700px; border-radius: 54px; background: #0c1130; box-shadow: inset 0 0 0 3px #3b4677, inset 0 0 0 6px #0c1130, inset 0 0 0 7px rgba(255,255,255,.10); }
  .pscr { left: -158px; top: -338px; width: 316px; height: 676px; border-radius: 42px; overflow: hidden; background-color: #E9ECF4; background-image: radial-gradient(rgba(33,44,95,.07) 1.6px, transparent 1.8px); background-size: 22px 22px; }
  .hdr { position: absolute; left: 0; top: 34px; width: 316px; height: 72px; background: #fff; }
  .hdr i { position: absolute; left: 16px; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: #26367A; }
  .hdr b { position: absolute; left: 72px; top: 18px; font: 700 20px/1 PS; color: #161D3A; white-space: nowrap; }
  .hdr span { position: absolute; left: 72px; top: 44px; font: 600 14px/1 PS; color: #5B6478; white-space: nowrap; }
  .hdr em { position: absolute; right: 14px; top: 20px; height: 32px; padding: 0 12px; border-radius: 16px; background: #FED111; font: 800 18px/32px Rubik; font-style: normal; color: #212C5F; }
  .fb { position: absolute; left: 12px; height: 58px; padding: 8px 12px; border-radius: 18px; border-top-left-radius: 5px; background: #fff; white-space: nowrap; box-shadow: 0 2px 4px rgba(19,27,64,.1); }
  .fb s { display: block; height: 15px; text-decoration: none; font: 700 13px/15px PS; color: #26367A; }
  .fb b { display: block; margin-top: 3px; font: 600 19px/22px PS; color: #161D3A; }
  .fb.dim { opacity: .28; }
  .bub { position: absolute; left: 0; top: 0; height: 92px; padding: 12px 20px; border-radius: 26px; border-top-left-radius: 8px; background: #fff; white-space: nowrap;
         box-shadow: 0 0 0 5px #FED111, 0 26px 50px rgba(3,6,24,.45); }
  .bub s { display: block; height: 22px; text-decoration: none; font: 700 19px/22px PS; color: #26367A; }
  .bub b { display: block; margin-top: 4px; font: 700 32px/40px PS; color: #161D3A; }
  /* sheet */
  .sheet { left: -300px; top: -280px; width: 600px; height: 560px; border-radius: 26px; background: #fff; box-shadow: 0 50px 90px rgba(3,6,24,.5); padding: 28px 30px; }
  .sh { display: flex; align-items: center; gap: 14px; height: 60px; }
  .sh i { flex: none; width: 56px; height: 56px; border-radius: 16px; background: #212C5F; display: flex; align-items: center; justify-content: center; }
  .sh i svg { width: 32px; height: 32px; }
  .sh b { flex: 1; min-width: 0; font: 700 23px/1 PS; letter-spacing: .12em; color: #212C5F; white-space: nowrap; }
  .sh em { flex: none; padding: 6px 14px 7px; border-radius: 999px; border: 2px solid rgba(91,100,120,.28); font: 600 17px/1 PS; font-style: normal; color: #5B6478; white-space: nowrap; }
  .th { display: flex; margin-top: 18px; height: 40px; align-items: center; border-bottom: 2px solid #D5DAE6; font: 700 15px/1 PS; letter-spacing: .14em; color: #4b5470; white-space: nowrap; }
  .th span { background: #FFE440; padding: 3px 4px; }
  .c1 { flex: none; width: 96px; } .c2 { flex: none; width: 250px; } .c3 { flex: none; width: 150px; text-align: right; } .c4 { flex: none; width: 34px; margin-left: 10px; }
  .tr { display: flex; height: 66px; align-items: center; border-bottom: 2px solid #E8EBF3; white-space: nowrap; overflow: hidden; }
  .tr .c1 { font: 700 20px/1 PS; color: #5B6478; } .tr .c2 { font: 600 24px/1 PS; color: #161D3A; } .tr .c3 { font: 700 25px/1 Rubik; color: #212C5F; }
  .ck { width: 32px; height: 32px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .ck svg { width: 20px; height: 20px; }
  .tr.hl { background: linear-gradient(90deg, rgba(255,228,64,0), rgba(255,228,64,.9) 3%, rgba(255,228,64,.9) 97%, rgba(255,228,64,0)); }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div class="t1" id="t1a">DARI CHAT</div>
  <div class="t1" id="t1b"><span>KE CATATAN</span></div>
  <div id="t2">yang rapi &amp; gampang dicek</div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const SV = (d, c, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c || "#fff"}" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const CHECK = SV('<path d="M5 12.5l4.2 4.2L19 7"/>', "#212C5F", 3);
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // phone: left, tilted toward the sheet
  const ph = mk("div", "g3", w); ph.style.transform = "translate3d(250px, 1270px, -60px) rotateX(10deg) rotateY(26deg) rotateZ(-7deg)";
  for (let k = 6; k >= 1; k--) mk("div", "pl pthk", ph, `transform: translateZ(${-k * 2.6}px)`);
  mk("div", "pl pbody", ph, "transform: translateZ(-0.6px)");
  const scr = mk("div", "pl pscr", ph);
  scr.innerHTML = `<div class="hdr"><i></i><b>Chat pembeli</b><span>Toko Benang Biru</span><em>99+</em></div>` +
    [["Sinta", "Kak, ready?"], ["Joko", "Bisa kirim hari ini?"], ["Mega", "Warna hitam ada?"], ["Dina", "Mau 2 ya, kak", 1], ["Bayu", "Jadi transfer ya", 1], ["Rara", "Ongkirnya berapa?", 1], ["Tari", "Kapan dikirim?"], ["Andi", "Kak, jadi 3 ya"]]
      .map(([n, t, d], k) => `<div class="fb${d ? " dim" : ""}" style="top:${120 + k * 68}px"><s>${n}</s><b>${t}</b></div>`).join("");
  // sheet: right, big
  const sh = mk("div", "g3", w); sh.style.transform = "translate3d(670px, 1150px, 40px) rotateX(8deg) rotateY(-16deg) rotateZ(2deg)";
  const s = mk("div", "pl sheet", sh);
  s.innerHTML = `<div class="sh"><i>${SV('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/>')}</i><b>CATATAN JUALAN</b><em>Ilustrasi data</em></div>
    <div class="th"><div class="c1"><span>TANGGAL</span></div><div class="c2"><span>PESANAN</span></div><div class="c3"><span>NOMINAL</span></div></div>` +
    [["3 Mei", "Kaos polos ×2", "Rp178.000"], ["3 Mei", "Tote bag ×1", "Rp65.000"], ["4 Mei", "Topi rajut ×1", "Rp49.000"], ["4 Mei", "Kemeja linen ×1", "Rp189.000"], ["5 Mei", "Hoodie ×1", "Rp215.000"]]
      .map((r, k) => `<div class="tr${k === 2 ? " hl" : ""}"><div class="c1">${r[0]}</div><div class="c2">${r[1]}</div><div class="c3">${r[2]}</div><div class="c4"><i class="ck">${CHECK}</i></div></div>`).join("");
  // the three read-out bubbles, peeling off the phone toward the sheet (in front of both)
  [["Dina", "Mau 2 ya, kak", 180, 990, 160, -7], ["Bayu", "Jadi transfer ya", 240, 1130, 200, 4], ["Rara", "Ongkirnya berapa?", 170, 1290, 220, -3]].forEach(([n, t, x, y, z, r]) => {
    const b = mk("div", "pl bub", w); b.innerHTML = `<s>${n}</s><b>${t}</b>`; b.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(14deg) rotateZ(${r}deg)`;
  });
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no title wider than the safe width, no row text wider than its cell
    document.querySelectorAll(".t1, #t2").forEach((e) => { const g = document.createRange(); g.selectNodeContents(e); const q = g.getBoundingClientRect(); if (q.left < 60 || q.right > 1020) console.log("pageerror TITLE WIDE", e.textContent, q.left, q.right); });
    document.querySelectorAll(".tr > div, .sh b, .bub, .fb").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror OVERFLOW", e.textContent); });
    r.render({ x: 905, y: 1690, h: 560, yaw: -26, roll: 0, headYaw: -20, headPitch: -12, headRoll: 6, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 128, fwd: 30, bend: 16, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.6, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

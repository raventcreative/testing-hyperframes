<!doctype html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Cover — Panel 7 AI (voxel, tema putih)</title>
<!-- Background = clean world still at 10.1 s + the mascot layer at 10.1 s (tools/still.cjs world|host), headline in the sky. -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: Poppins, sans-serif; background: linear-gradient(180deg, #9fc4f3 0%, #b3d0f6 30%, #c9dcf8 100%); }
  #bg { position: absolute; left: 0; top: 390px; width: 1080px; height: auto; }
  #host { position: absolute; left: 10px; bottom: -40px; width: 640px; height: auto; filter: drop-shadow(0 18px 30px rgba(10,13,44,.25)); }
  #fadeB { position: absolute; left: 0; bottom: 0; width: 1080px; height: 300px; background: linear-gradient(0deg, rgba(240,245,252,.6), rgba(240,245,252,0)); }
  #fadeT { position: absolute; left: 0; top: 0; width: 1080px; height: 760px; background: linear-gradient(180deg, rgba(246,250,255,.96) 0%, rgba(246,250,255,.9) 45%, rgba(246,250,255,.45) 75%, rgba(246,250,255,0) 100%); }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 430px; top: 150px; width: 220px; }
  #eb { top: 214px; font: 700 26px/1 Poppins; letter-spacing: 9px; color: #294b77; }
  #eb span { display: inline-block; padding: 10px 22px 12px 30px; border-radius: 40px; background: #0a0d2c; color: #7fe3ff; }
  #h1 { top: 290px; font: 700 92px/1 Poppins; letter-spacing: -2.5px; color: #0a0d2c; }
  #h2 { top: 396px; font: 700 118px/1.05 Poppins; letter-spacing: -3.5px; padding-bottom: .2em;
        background: linear-gradient(180deg, #13307e 10%, #2f6bff 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #h2 u { text-decoration: none; position: relative; }
  #h2 u::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: 10px; height: 26px; background: rgba(1,204,247,.45); border-radius: 8px; z-index: -1; }
</style></head>
<body>
  <img id="bg" src="still_world.png" alt="" />
  <div id="fadeB"></div>
  <img id="host" src="host_cut.png" alt="" />
  <div id="fadeT"></div>
  <img id="logo" src="../assets/brand/logo_dark_trim.png" alt="AI PRENEUR" />
  <div class="c" id="eb"><span>PANEL 7 AI</span></div>
  <div class="c" id="h1">CV Ditolak Terus?</div>
  <div class="c" id="h2">Suruh <u>7 AI</u> Nilai</div>
  <script>document.fonts.ready.then(() => (window.COVER_READY = true));</script>
</body></html>

        (function () {

          const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };

          const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
          const DUR = 2.3;

          // ---------- paper (from s11) built as shards ----------
          const PW = 600, PH = 760, PX = 240, PY = 580;
          const paperHTML = (() => {
            let h = '<div class="s12-paper">';
            const rows = [[70, 300], [118, 430], [150, 380], [182, 455], [214, 330], [262, 440], [294, 400], [326, 460], [358, 250], [406, 430], [438, 390], [470, 450], [502, 300], [550, 420], [582, 360], [614, 200]];

          const pts = [];
          for (let r = 0; r <= ROWS; r++) {

          const DEP = ["#3a6299", "#4f74a8", "#6687ba", "#7e9dca", "#97b3da", "#b2c9e8"];
          const words = [];
          qa(".s12-word").forEach((w) => {
            const txt = w.textContent, size = +w.dataset.size, ink = w.dataset.tone === "ink";
            w.textContent = "";
            w.style.fontSize = size + "px";
            const st = size / 176;
            const layers = [];
            for (let i = DEP.length; i >= 1; i--) {
              const d = mk("span", "s12-dep", w, "color:" + DEP[i - 1] + ";" + (i === DEP.length ? "text-shadow:0 " + (22 * st).toFixed(1) + "px " + (26 * st).toFixed(1) + "px rgba(28,51,84,0.28);" : ""));
              d.textContent = txt;
              tl.set(d, { x: i * 1.6 * st, y: i * 2.1 * st, z: -i * 6 * st }, 0);
              layers.push(d);
            }
            const rim = mk("span", "s12-rim", w); rim.textContent = txt;
            tl.set(rim, { x: -1.6 * st, y: -1.8 * st, z: -1 }, 0);
            layers.push(rim);
            const f = mk("span", "s12-face" + (ink ? " s12-ink" : ""), w); f.textContent = txt;
            tl.set(f, { z: 0.5 }, 0);
            layers.push(f);
            words.push({ w, layers, face: f });
          });
          const land = (k, t, from, dur, ease) => {
            const { w, layers } = words[k];
            tl.set(w, Object.assign({ z: 60 }, from), 0);
            tl.set(layers, { opacity: 0 }, 0);
            tl.to(layers, { opacity: 1, duration: 0.08, ease: "none" }, t - 0.09);
            tl.to(w, { x: 0, y: 0, z: 60, rotationX: 0, rotationY: 0, rotation: 0, scale: 1, duration: dur, ease }, t - 0.09);
          };
          land(0, 0.61, { y: -60, z: 520, rotationX: -55, scale: 1 }, 0.42, "power4.out");
          land(1, 0.99, { y: 70, rotationX: 85, scale: 0.9 }, 0.34, "back.out(1.5)");
          land(2, 1.21, { y: 70, rotationX: 85, scale: 0.9 }, 0.34, "back.out(1.5)");
          land(3, 1.75, { y: 20, z: 700, rotationX: -20, scale: 1.25 }, 0.34, "power4.out");
          // tiny settle wobble on each landing (depth breathing)
          [0, 1, 2].forEach((k) => tl.to(words[k].w, { z: 70, duration: 0.5, ease: "sine.inOut" }, [0.61, 0.99, 1.21][k] + 0.3));
          // sheen across the type at "mahal."
          words.forEach((o, k) => tl.fromTo(o.face, { backgroundPosition: "160% 0%, 0% 0%" }, { backgroundPosition: "-60% 0%, 0% 0%", duration: 0.38, ease: "power2.inOut" }, 1.76 + k * 0.03));
          tl.fromTo(words[0].face, { backgroundPosition: "160% 0%, 0% 0%" }, { backgroundPosition: "-60% 0%, 0% 0%", duration: 0.45, ease: "power2.inOut", immediateRender: false }, 0.66);

          // ---------- orbiters ----------
          const orb = [
            ["#s12-o1", "#s12-o1c", 470, -40, 80, 0.48],
            ["#s12-o2", "#s12-o2c", 400, 150, 250, 0.52],
            ["#s12-o3", "#s12-o3c", 430, 220, 330, 0.56],
            ["#s12-o4", "#s12-o4c", 380, 110, 200, 0.5],
            ["#s12-o5", "#s12-o5c", 460, 30, -30, 0.6],
            ["#s12-o6", "#s12-o6c", 500, 20, 120, 0.46],
          ];
          orb.forEach(([o, c, rad, a0, a1, tin], i) => {
            const oe = q(o), ce = q(c);
            const ring = ce.classList.contains("s12-ring"), pill = ce.classList.contains("s12-pill");
            tl.set(oe, { rotationY: a0 }, 0);
            tl.set(ce, { x: rad, rotationY: -a0, rotationX: ring ? 62 : 0, rotation: pill ? -30 : 0, scale: 0, opacity: 0 }, 0);
            tl.to(oe, { rotationY: a1, duration: DUR, ease: "none" }, 0);
            tl.to(ce, { rotationY: ring ? -a1 + 160 : -a1, rotation: pill ? 30 : 0, duration: DUR, ease: "none" }, 0);
            tl.to(ce, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, tin + i * 0.03);
          });

          // ---------- timeline strip ----------
          const strip = q("#s12-strip"), tracks = q("#s12-tracks");
          tl.set(strip, { y: 90, opacity: 0, rotationX: -40, transformOrigin: "50% 100%" }, 0);
          tl.to(strip, { y: 0, opacity: 1, rotationX: 0, duration: 0.42, ease: "power3.out" }, 0.42);
          const TW = 760, TX = 70;
          const tX = (t) => (t / DUR) * TW;
          const TR = [
            { y: 42, head: "#294b77", clips: [[0.05, 0.9, "s12-c1", 1], [1.0, 2.25, "s12-c1", 1]], kf: [0.61, 1.75] },
            { y: 76, head: "#acc6e7", clips: [[0.3, 1.5, "s12-c2", 0], [1.6, 2.2, "s12-c3", 0]], kf: [0.99, 1.21, 2.0] },
            { y: 110, head: "#9fd8c4", clips: [[0.0, 0.55, "s12-c3", 0], [0.6, 2.28, "s12-c2", 1]], kf: [0.07, 0.4, 1.4] },
            { y: 144, head: "#cbdbf4", clips: [[0.5, 1.2, "s12-c3", 0], [1.3, 1.9, "s12-c2", 0]], kf: [0.85, 1.55, 2.15] },
          ];
          TR.forEach((tr) => {
            const row = mk("div", "s12-track", tracks, "top:" + tr.y + "px");
            const h = mk("div", "s12-thead", tracks, "top:" + (tr.y + 4) + "px");
            mk("i", "", h, "background:" + tr.head);
            tr.clips.forEach(([a, b, cls, wave]) => {
              const c = mk("div", "s12-clip " + cls, row, "left:" + tX(a).toFixed(1) + "px;width:" + (tX(b) - tX(a)).toFixed(1) + "px");
              if (wave) mk("div", "s12-wave", c);
            });
            tr.kf.forEach((t) => {
              const k = mk("div", "s12-kf", tracks, "left:" + (TX + tX(t)).toFixed(1) + "px;top:" + (tr.y + 14) + "px");
              mk("div", "s12-kfi", k);
              const on = mk("div", "s12-kfon", k);
              tl.set(on, { opacity: 0 }, 0);
              tl.set(k, { scale: 1 }, 0);
              tl.to(on, { opacity: 1, duration: 0.06, ease: "none" }, t);
              tl.to(k, { scale: 1.6, duration: 0.08, ease: "power2.out" }, t);
              tl.to(k, { scale: 1, duration: 0.22, ease: "back.out(2)" }, t + 0.08);
            });
          });
          const ph = q("#s12-ph");
          tl.set(ph, { x: 0 }, 0);
          tl.to(ph, { x: TW, duration: DUR, ease: "none" }, 0);
          const cpath = q("#s12-cpath");
          const cl = 900;
          tl.set(cpath, { strokeDasharray: cl, strokeDashoffset: cl, stroke: "rgba(58,98,153,0.35)" }, 0);
          tl.to(cpath, { strokeDashoffset: 0, duration: DUR - 0.4, ease: "none" }, 0.4);

          // ---------- sparkle burst at "mahal." ----------
          const spks = q("#s12-spks");
          const SPK = '<svg viewBox="-24 -24 48 48"><path d="M0 -24 C 3 -6, 6 -3, 24 0 C 6 3, 3 6, 0 24 C -3 6, -6 3, -24 0 C -6 -3, -3 -6, 0 -24 Z" fill="#ffffff" stroke="rgba(41,75,119,0.35)" stroke-width="1.2"/><circle r="5" fill="#f2c46d" opacity="0.55"/></svg>';
          const C0 = { x: 540, y: 1030 };
          for (let i = 0; i < 14; i++) {
            const s = mk("div", "s12-spk", spks);
            s.innerHTML = SPK;
            const ang = (i / 14) * Math.PI * 2 + rnd() * 0.3;
            const r0 = 120 + rnd() * 60, r1 = 300 + rnd() * 160;
            const sx = C0.x + Math.cos(ang) * r0, sy = C0.y + Math.sin(ang) * r0 * 0.55;
            s.style.left = sx + "px"; s.style.top = sy + "px";
            const sc = 0.5 + rnd() * 0.9;
            tl.set(s, { scale: 0, opacity: 0, rotation: 0 }, 0);
            const t = 1.76 + rnd() * 0.08;
            tl.to(s, { opacity: 1, scale: sc, duration: 0.12, ease: "back.out(2.5)" }, t);
            tl.to(s, { x: Math.cos(ang) * (r1 - r0), y: Math.sin(ang) * (r1 - r0) * 0.55, rotation: 90, duration: 0.5, ease: "power3.out" }, t);
            tl.to(s, { scale: 0, opacity: 0, duration: 0.2, ease: "power2.in" }, t + 0.3 + rnd() * 0.1);
          }
          // small sparkles on each earlier word landing
          [[0.61, 820, 640], [1.21, 820, 830], [0.99, 250, 830]].forEach(([t, x, y], j) => {
            for (let i = 0; i < 3; i++) {
              const s = mk("div", "s12-spk", spks, "left:" + (x + i * 46 - 30) + "px;top:" + (y + (i % 2) * 40) + "px");
              s.innerHTML = SPK;
              tl.set(s, { scale: 0, opacity: 0 }, 0);
              tl.to(s, { scale: 0.45 + i * 0.1, opacity: 1, rotation: 45, duration: 0.14, ease: "back.out(2)" }, t + i * 0.04);
              tl.to(s, { scale: 0, opacity: 0, rotation: 90, duration: 0.2, ease: "power2.in" }, t + 0.24 + i * 0.04);
            }
          });
          const flash = q("#s12-flash");
          tl.set(flash, { opacity: 0, scale: 0.6 }, 0);
          tl.to(flash, { opacity: 0.95, scale: 1.05, duration: 0.12, ease: "power2.out" }, 1.75);
          tl.to(flash, { opacity: 0, scale: 1.2, duration: 0.4, ease: "power2.out" }, 1.87);

          // ---------- camera + world orbit ----------
          const cam = q("#s12-cam"), world = q("#s12-world");
          tl.set(cam, { scale: 1, transformOrigin: "50% 48%" }, 0);
          tl.to(cam, { scale: 1.025, duration: 1.75, ease: "sine.inOut" }, 0);
          tl.to(cam, { scale: 1.07, duration: 0.3, ease: "power3.out" }, 1.75);
          tl.to(cam, { scale: 1.08, duration: 0.25, ease: "none" }, 2.05);
          tl.set(world, { rotationY: -6, rotationX: 4, transformOrigin: "540px 920px" }, 0);
          tl.to(world, { rotationY: 6, rotationX: 2, duration: DUR, ease: "sine.inOut" }, 0);

          // ---------- far / fore planes ----------
          tl.set(q("#s12-beam"), { rotation: -24, opacity: 0.55 }, 0);
          tl.to(q("#s12-beam"), { rotation: -20, opacity: 0.8, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set(q("#s12-glow"), { opacity: 0.6, scale: 0.9 }, 0);
          tl.to(q("#s12-glow"), { opacity: 1, scale: 1.05, duration: 0.6, ease: "power2.out" }, 0.4);
          [["#s12-bk1", 30, -40], ["#s12-bk2", -40, -30], ["#s12-bk3", -25, 30], ["#s12-bk4", 35, -25], ["#s12-fg1", 60, -50], ["#s12-fg2", -70, 40]].forEach(([s, x, y]) => {
            tl.fromTo(q(s), { x: 0, y: 0 }, { x, y, duration: DUR, ease: "none" }, 0);
          });
          tl.fromTo(q("#s12-floor"), { scaleX: 0.7, opacity: 0.4 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);

          window.__timelines["s12"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

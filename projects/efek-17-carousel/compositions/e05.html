<template>
  <script src="assets/presenter.js"></script>
  <style>
    #e5-root { position: absolute; inset: 0; overflow: hidden; background: #070f26; }
    .e5-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
    #e5-cam { transform-origin: 540px 588px; }
    #e5-vig { background: radial-gradient(ellipse 62% 52% at 50% 46%, rgba(3,8,24,0) 40%, rgba(3,8,24,0.78) 100%); opacity: 0; }
    #e5-flash { background: #ffffff; opacity: 0; }
    .e5-br { position: absolute; width: 74px; height: 74px; border-color: rgba(255,255,255,0.85); border-style: solid; border-width: 0; }
    #e5-read { position: absolute; left: 60px; top: 150px; height: 46px; padding: 0 18px 0 14px; border-radius: 23px; display: flex; align-items: center; gap: 10px;
      background: rgba(7,15,38,0.72); box-shadow: inset 0 0 0 1.5px rgba(127,216,255,0.3); font: 700 22px/46px "Poppins", sans-serif; color: #fff; letter-spacing: 0.04em; }
    #e5-rec { width: 14px; height: 14px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 10px rgba(255,77,94,0.8); }
    #e5-x { color: #00c9ff; }
    #e5-key { position: absolute; left: 0; width: 1080px; top: 880px; text-align: center; font: 700 140px/1 "Poppins", sans-serif; color: #00c9ff;
      letter-spacing: -0.015em; text-shadow: 0 4px 0 #0a5f8a, 0 16px 40px rgba(2,8,26,0.8); opacity: 0; transform-origin: 540px 70px; }
    #e5-sub { position: absolute; left: 0; width: 1080px; top: 1040px; text-align: center; font: 700 40px/1.2 "Poppins", sans-serif; color: #fff;
      letter-spacing: 0.01em; text-shadow: 0 4px 18px rgba(2,8,26,0.85); opacity: 0; }
  </style>
  <div id="e5-root" data-composition-id="e05" data-width="1080" data-height="1350">
    <div id="e5-cam" class="e5-layer">
      <div id="e5-bd" class="e5-layer"></div>
      <div id="e5-figwrap" class="e5-layer"></div>
    </div>
    <div id="e5-vig" class="e5-layer" data-layout-ignore></div>
    <div id="e5-front" class="e5-layer" data-layout-ignore>
      <div id="e5-b0" class="e5-br" style="border-left-width:6px;border-top-width:6px;border-radius:18px 0 0 0"></div>
      <div id="e5-b1" class="e5-br" style="border-right-width:6px;border-top-width:6px;border-radius:0 18px 0 0"></div>
      <div id="e5-b2" class="e5-br" style="border-left-width:6px;border-bottom-width:6px;border-radius:0 0 0 18px"></div>
      <div id="e5-b3" class="e5-br" style="border-right-width:6px;border-bottom-width:6px;border-radius:0 0 18px 0"></div>
      <div id="e5-read"><div id="e5-rec"></div><span>ZOOM</span><span id="e5-x">1.0x</span></div>
      <div id="e5-key">KONSISTEN</div>
      <div id="e5-sub">Itu kuncinya.</div>
    </div>
    <div id="e5-cap" class="k-cap" style="opacity:0">Rahasianya cuma <span class="hl">satu</span>…</div>
    <div id="e5-flash" class="e5-layer" data-layout-ignore></div>
    <div id="e5-chrome" class="e5-layer"></div>
  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
      const ei = (x) => Math.pow(clamp(x, 0, 1), 3);
      const eio = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const $ = (id) => document.getElementById(id);
      const H = window.HFP;
      $("e5-bd").innerHTML = H.backdropHTML("e5b");
      const R = H.mount($("e5-figwrap"), "e5f");
      $("e5-chrome").innerHTML = H.chromeHTML("e5c", 5, "Digital Zoom");
      const cam = $("e5-cam"), vig = $("e5-vig"), flash = $("e5-flash"), key = $("e5-key"), sub = $("e5-sub"), cap = $("e5-cap"), rx = $("e5-x");
      const BR = [0, 1, 2, 3].map((i) => $("e5-b" + i));
      const T0 = 1.0;                       // the keyword beat: punch in 1.0 → 1.7 in 0.1 s
      function render(t) {
        H.animate(R, t);
        const punch = eo(seg(t, T0, T0 + 0.1));
        const back = eio(seg(t, 3.22, 3.58));
        const drift = 0.04 * seg(t, T0 + 0.1, 3.22);  // tiny push while holding keeps it alive
        const z = 1 + (0.7 * punch + drift * punch) * (1 - back);
        // impact shake: 3 px left-right for 0.15 s once the zoom lands
        const sk = seg(t, T0 + 0.1, T0 + 0.25);
        const sx = (sk > 0 && sk < 1) ? Math.sin(sk * Math.PI * 6) * 3 * (1 - sk * 0.5) : 0;
        cam.style.transform = "translateX(" + sx.toFixed(2) + "px) scale(" + z.toFixed(4) + ")";
        const zr = (z - 1) / 0.7;
        vig.style.opacity = clamp(zr, 0, 1).toFixed(3);
        flash.style.opacity = (0.18 * Math.max(0, 1 - Math.abs(t - (T0 + 0.05)) / 0.05)).toFixed(3);
        rx.textContent = z.toFixed(1) + "x";
        // viewfinder brackets tighten on the face while zoomed
        const ins = 20 * clamp(zr, 0, 1.1);
        const L = 60 + ins, Rr = 1020 - 74 - ins, T = 220 + ins, B = 1150 - 74 - ins;
        const pos = [[L, T], [Rr, T], [L, B], [Rr, B]];
        BR.forEach((b, i) => { b.style.transform = "translate(" + pos[i][0].toFixed(1) + "px," + pos[i][1].toFixed(1) + "px)";
          b.style.borderColor = zr > 0.5 ? "#00c9ff" : "rgba(255,255,255,0.85)"; });
        // keyword: big, accent colour, scale 1.8 → 1 under the face
        const k = eo(seg(t, T0 + 0.02, T0 + 0.3)), kout = ei(seg(t, 3.1, 3.35));
        key.style.opacity = (clamp(k * 2, 0, 1) * (1 - kout)).toFixed(3);
        key.style.transform = "scale(" + (1.8 - 0.8 * k - 0.2 * kout).toFixed(3) + ")";
        const s = eo(seg(t, T0 + 0.35, T0 + 0.65)) * (1 - kout);
        sub.style.opacity = s.toFixed(3); sub.style.transform = "translateY(" + ((1 - s) * 16).toFixed(1) + "px)";
        // set-up line before the beat
        const c = eo(seg(t, 0.15, 0.4)) * (1 - seg(t, T0 - 0.08, T0));
        cap.style.opacity = c.toFixed(3); cap.style.transform = "translateY(" + ((1 - c) * 18).toFixed(1) + "px)";
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(state.t) }, 0);
      render(0);
      window.__timelines["e05"] = tl;
    })();
  </script>
</template>

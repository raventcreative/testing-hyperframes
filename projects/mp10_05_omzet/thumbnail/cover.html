<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Omzet vs Untung</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     The 3D money column is the film's hero object: dashed ghost = what the costs took away, yellow block = laba. Numbers = Ilustrasi data. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 392px; font: 800 176px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1 i { font: italic 400 110px/1 PF; letter-spacing: 0; color: #DDE1EE; margin-right: 18px; }
  #t1 span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 78%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 770px; font: italic 400 76px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #t3 { position: absolute; left: 80px; top: 880px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px; background: #fff; font: 700 34px/1 PS; color: #212C5F; white-space: nowrap; }
  #t3 svg { width: 32px; height: 32px; }
  /* 3D column */
  .stage { position: absolute; inset: 0; perspective: 1600px; perspective-origin: 760px 1250px; }
  .w { position: absolute; left: 800px; top: 1540px; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(-12deg) rotateY(-28deg); }
  .bx { position: absolute; transform-style: preserve-3d; }
  .bx > i { position: absolute; display: block; backface-visibility: hidden; }
  .lb > i.fr { background: #FED111; } .lb > i.rt { background: #D3A800; } .lb > i.tp { background: #FFE440; box-shadow: inset 0 0 0 14px rgba(255,255,255,.18); }
  .gh > i { border: 3px dashed rgba(221,225,238,.55); background: rgba(255,255,255,.035); }
  .ck > i.fr { background: #AEB6D8; } .ck > i.rt { background: #7D87B4; } .ck > i.tp { background: #C9CFE6; } .ck > i.lf { background: #8f99c4; } .ck > i.bt { background: #9aa3c9; }
  .lb .lab, .ck .lab { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 54px/1 Rubik; color: #212C5F; white-space: nowrap; }
  .ck .lab { font-size: 26px; }
  .tg { position: absolute; padding: 14px 20px; border-radius: 18px; background: #fff; box-shadow: 0 18px 40px rgba(3,6,24,.4); white-space: nowrap; }
  .tg small { display: block; font: 700 22px/1.2 PS; letter-spacing: .12em; color: #5B6478; }
  .tg b { display: block; margin-top: 4px; font: 800 44px/1.1 Rubik; color: #161D3A; }
  #tgO { left: 318px; top: 1000px; transform: rotate(-3deg); }
  #tgL { left: 282px; top: 1405px; background: #FFE440; transform: rotate(2deg); }
  #ilus { position: absolute; left: 352px; top: 1532px; font: 600 22px/1 PS; letter-spacing: .04em; color: #8E99C2; border: 2px solid rgba(142,153,194,.45); border-radius: 999px; padding: 8px 16px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">OMZET<br /><i>vs</i><span>UNTUNG</span></div>
  <div id="t2">gede belum tentu untung.</div>
  <div id="t3">Cek yang beneran laba<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="stage"><div class="w" id="w"></div></div>
  <div class="tg" id="tgO"><small>OMZET</small><b>Rp50.000.000</b></div>
  <div class="tg" id="tgL"><small>LABA</small><b>Rp11.000.000</b></div>
  <div id="ilus">Ilustrasi data</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const w = document.getElementById("w");
  function box(cls, x, yTop, W, H, D, faces, lab, tf) {
    const b = document.createElement("div"); b.className = "bx " + cls; b.style.cssText = `left:${x - W / 2}px; top:${yTop}px; width:${W}px; height:${H}px; transform:${tf || "none"}`;
    const F = { fr: [W, H, 0, 0, `translateZ(${D / 2}px)`], rt: [D, H, (W - D) / 2, 0, `rotateY(90deg) translateZ(${W / 2}px)`], lf: [D, H, (W - D) / 2, 0, `rotateY(-90deg) translateZ(${W / 2}px)`],
      tp: [W, D, 0, (H - D) / 2, `rotateX(90deg) translateZ(${H / 2}px)`], bt: [W, D, 0, (H - D) / 2, `rotateX(-90deg) translateZ(${H / 2}px)`] };
    faces.forEach((f) => { const [fw, fh, l, t, tr] = F[f]; const e = document.createElement("i"); e.className = f; e.style.cssText = `left:${l}px; top:${t}px; width:${fw}px; height:${fh}px; transform:${tr}`;
      if (f === "fr" && lab) { const d = document.createElement("div"); d.className = "lab"; d.textContent = lab; e.appendChild(d); } b.appendChild(e); });
    w.appendChild(b);
  }
  // world: column W=D=230, ghost 760 tall above a 168 tall laba block (same 22 % proportion as the film)
  box("gh", 0, -560, 210, 437, 210, ["rt", "tp", "fr"]);
  box("lb", 0, -123, 210, 123, 210, ["rt", "tp", "fr"], "LABA");
  box("ck", -330, -390, 190, 120, 190, ["rt", "tp", "fr", "lf", "bt"], "Biaya produk", "translate3d(0,0,-60px) rotateZ(-22deg) rotateX(-24deg)");
  box("ck", -400, -235, 180, 72, 180, ["rt", "tp", "fr", "lf", "bt"], "Iklan", "translate3d(0,0,-40px) rotateZ(16deg) rotateX(-18deg)");
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    r.render({ x: 150, y: 1660, h: 600, yaw: 24, roll: 0, headYaw: 16, headPitch: -8, headRoll: -6, t: 2,
      aL: { raise: 132, fwd: 26, bend: 14, bendYaw: 0 }, aR: { raise: 18, fwd: 0, bend: 14 },
      face: { blink: 0, lookX: 0.9, lookY: 0.5, happy: 0, smile: 0, o: 0.55 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

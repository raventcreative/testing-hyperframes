<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>AIpreneur — Motion Pack s00</title>
    <script src="vendor/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: block; }
      :root { --n0: #0a0d2c; --n1: #294b77; --grad: linear-gradient(135deg, #0a0d2c 0%, #294b77 100%); --acc: #2c68d8; --acc2: #5b8cff; --mut: #5d6b8a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #eef3fb; }
      body { font-family: "Poppins", sans-serif; font-synthesis: none; color: var(--n0); -webkit-font-smoothing: antialiased; }
      #main { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: url(assets/brand/pastel_bg_1080x1350.jpg) 0 0 / 1080px 1350px; }
      .abs { position: absolute; }
      .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      /* chrome */
      #logo { position: absolute; left: 64px; top: 66px; width: 200px; height: 18.1px; }
      #chip { position: absolute; right: 64px; top: 52px; height: 46px; padding: 0 20px; border-radius: 23px; border: 1.5px solid rgba(41,75,119,.25);
        background: rgba(255,255,255,.65); font-size: 19px; line-height: 43px; letter-spacing: 2.5px; color: var(--n1); white-space: nowrap; }
      #chip b { color: var(--acc); }
      #num { position: absolute; left: 58px; top: 116px; font-size: 158px; line-height: 170px; font-weight: 700; letter-spacing: -8px; }
      #ttl { position: absolute; left: 262px; top: 138px; font-size: 74px; line-height: 88px; font-weight: 700; letter-spacing: -2px; white-space: nowrap; }
      #sub { position: absolute; left: 266px; top: 228px; font-size: 32px; line-height: 44px; color: var(--n1); white-space: nowrap; }
      #stage { position: absolute; left: 64px; top: 318px; width: 952px; height: 742px; perspective: 1800px; }
      .win { position: absolute; left: 30px; top: 18px; width: 892px; height: 690px; border-radius: 30px; overflow: hidden; background: #fff;
        box-shadow: 0 40px 90px rgba(20,40,90,.22), 0 0 0 1.5px rgba(41,75,119,.08); transform: rotateY(-5deg) rotateX(3deg); transform-origin: 50% 50%; }
      .ghost { position: absolute; left: 62px; top: 0; width: 828px; height: 690px; border-radius: 30px; background: rgba(255,255,255,.45); border: 1.5px solid rgba(255,255,255,.8);
        transform: rotateY(-5deg) rotateX(3deg) translateZ(-60px); }
      .bar { position: absolute; left: 0; top: 0; width: 100%; height: 46px; background: #f3f6fb; border-bottom: 1px solid #e3e9f3; z-index: 5; }
      .bar i { position: absolute; top: 17px; width: 12px; height: 12px; border-radius: 50%; }
      .bar .url { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 360px; height: 26px; border-radius: 13px; background: #fff;
        font-size: 15px; line-height: 26px; text-align: center; color: #8a96b0; }
      .view { position: absolute; left: 0; top: 46px; width: 892px; height: 644px; overflow: hidden; }
      .spec { position: absolute; height: 54px; padding: 0 22px; border-radius: 27px; background: #fff; box-shadow: 0 14px 34px rgba(20,40,90,.18);
        font-size: 21px; line-height: 54px; white-space: nowrap; color: var(--n0); z-index: 10; }
      .spec b { color: var(--acc); }
      #use { position: absolute; left: 64px; top: 1086px; font-size: 29px; line-height: 40px; color: var(--n0); white-space: nowrap; }
      #use b { font-size: 19px; letter-spacing: 3px; color: var(--acc); margin-right: 14px; vertical-align: 3px; }
      #lock { position: absolute; left: 64px; top: 1150px; width: 952px; height: 104px; border-radius: 52px; background: rgba(255,255,255,.88);
        box-shadow: 0 18px 44px rgba(20,40,90,.14), 0 0 0 1.5px rgba(41,75,119,.08); }
      #lock .ic { position: absolute; left: 24px; top: 22px; width: 60px; height: 60px; border-radius: 50%; background: #e8eefa; }
      #lock .ic svg { position: absolute; left: 17px; top: 15px; }
      #lock .lb { position: absolute; left: 102px; top: 18px; font-size: 18px; letter-spacing: 2px; color: var(--mut); }
      #lock .ln { position: absolute; left: 102px; height: 12px; border-radius: 6px; background: #d9e1ef; filter: blur(2.5px); }
      #lock .btn { position: absolute; right: 16px; top: 16px; height: 72px; padding: 0 32px; border-radius: 36px; background: var(--grad); color: #fff;
        font-size: 26px; line-height: 72px; white-space: nowrap; box-shadow: 0 12px 26px rgba(10,13,44,.3); }
      #lock .btn b { color: #9fc0ff; }
      #foot { position: absolute; left: 64px; top: 1284px; width: 952px; height: 40px; font-size: 18px; letter-spacing: 3px; line-height: 40px; color: var(--mut); }
      #foot .r { position: absolute; right: 0; top: 0; font-weight: 700; color: var(--n0); }
      #arrow { display: inline-block; margin-left: 8px; }
      #grain { position: absolute; inset: 0; opacity: .06; background: url(assets/brand/grain_256.png); mix-blend-mode: multiply; pointer-events: none; }
      #c1 { position: absolute; left: 64px; top: 122px; font-size: 58px; line-height: 70px; color: var(--n1); white-space: nowrap; }
#c2 { position: absolute; left: 58px; top: 182px; font-size: 122px; line-height: 136px; font-weight: 700; letter-spacing: -4px; white-space: nowrap; }
#c3 { position: absolute; left: 64px; top: 326px; font-size: 27px; line-height: 38px; color: var(--n1); white-space: nowrap; }
#c3 b { color: var(--n0); }
#stage { top: 412px; height: 652px; perspective: none; }
.t { position: absolute; width: 296px; height: 148px; border-radius: 22px; background: #fff; overflow: hidden; box-shadow: 0 14px 32px rgba(20,40,90,.12), 0 0 0 1.5px rgba(41,75,119,.07); }
.t .m { position: absolute; left: 12px; top: 12px; width: 272px; height: 92px; border-radius: 14px; background: #f3f6fb; overflow: hidden; }
.t .m.dk { background: linear-gradient(135deg, #0a0d2c, #294b77); }
.t .lb { position: absolute; left: 16px; top: 110px; font-size: 19px; line-height: 30px; color: var(--n0); white-space: nowrap; }
.t .lb b { color: var(--acc); margin-right: 8px; font-size: 16px; letter-spacing: 1px; }
.bx { position: absolute; border-radius: 6px; }
.tx { position: absolute; white-space: nowrap; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1350" data-fps="30">
      <img id="logo" src="assets/brand/logo_dark.png" alt="AIpreneur">
      <div id="chip">CLAUDE OPUS · <b>1</b> PROMPT / ANIMASI</div>
      <div id="c1">Paket Motion</div><div id="c2" class="g">Landing Page</div>
<div id="c3"><b>12 animasi</b> untuk tiap section, dari hero sampai checkout.</div>
      <div id="stage"><div id="grid"></div></div>
      <div id="use"><b>ISINYA</b>Animasi + prompt Claude yang tinggal copy-paste.</div>
      <div id="lock"><div class="ic"><svg width="26" height="30" viewBox="0 0 26 30"><rect x="2" y="13" width="22" height="15" rx="4" fill="#294b77"/><path d="M7 13V9a6 6 0 0 1 12 0v4" stroke="#294b77" stroke-width="3.5" fill="none"/></svg></div>
        <div class="lb">12 PROMPT LENGKAP · DIKIRIM VIA DM</div><div class="ln" style="top:52px;width:330px"></div><div class="ln" style="top:72px;width:250px"></div>
        <div class="btn">Komen <b>MOTION</b></div></div>
      <div id="foot">AIPRENEUR · MOTION PACK<div class="r">Geser<span id="arrow">→</span></div></div>
      <div id="grain"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const D = 7;
        const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });
        const ft = (el, a, b, at) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), at);
        const st = (el, v, at) => tl.set(el, v, at);
        // chrome life: arrow nudge + slow window float (static otherwise, so the loop is seamless)
        ft("#arrow", { x: 0 }, { x: 10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: Math.round(D / 0.5) - 1 }, 0);
        ft(".win", { y: 0 }, { y: -8, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        ft(".spec", { y: 0 }, { y: -12, duration: D / 4, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.4 }, 0);
        // 12 tiles, each with a tiny looping demo of its animation (deterministic, finite repeats)
const N = ["Hero reveal", "Word rotator", "Sale pings", "Review shuffle", "Count-up stats", "Bento build", "Cursor tour", "Process draw", "Before / after", "Price roll", "Us vs them", "Klik → sukses"];
const grid = $("#grid"), M = [];
N.forEach((n, i) => {
  const t = document.createElement("div"); t.className = "t"; t.style.left = (i % 3) * 328 + "px"; t.style.top = Math.floor(i / 3) * 168 + "px";
  t.innerHTML = `<div class="m${[1, 3].includes(i) ? " dk" : ""}"></div><div class="lb"><b>${String(i + 1).padStart(2, "0")}</b>${n}</div>`;
  grid.appendChild(t); M.push($(".m", t));
});
const box = (m, css) => { const d = document.createElement("div"); d.className = "bx"; Object.assign(d.style, css); m.appendChild(d); return d; };
const txt = (m, s, css) => { const d = document.createElement("div"); d.className = "tx"; d.textContent = s; Object.assign(d.style, css); m.appendChild(d); return d; };
const loop = (el, a, b, per, start = 0) => ft(el, a, Object.assign({ duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: Math.floor((D - start) / (per / 2)) - 1 }, b), start);
// 01 hero reveal: three lines rise in turn
[0, 1, 2].forEach((k) => { const b = box(M[0], { left: 60 + k * 8 + "px", top: 18 + k * 22 + "px", width: 152 - k * 16 + "px", height: "14px", background: k === 1 ? "#2c68d8" : "#0a0d2c" });
  loop(b, { opacity: 1, y: 0 }, { opacity: 0.15, y: 8 }, 2.2, k * 0.15); });
// 02 word rotator
const pl = box(M[1], { left: "76px", top: "30px", width: "120px", height: "32px", borderRadius: "10px", background: "linear-gradient(135deg,#5b8cff,#2c68d8)" });
loop(pl, { width: 120, x: 0 }, { width: 80, x: 20 }, 1.6);
// 03 sale pings: mini phone + pings
box(M[2], { left: "26px", top: "8px", width: "48px", height: "84px", borderRadius: "10px", background: "#0b0f24" });
[0, 1, 2].forEach((k) => { const n = box(M[2], { left: "30px", top: 24 + k * 18 + "px", width: "40px", height: "13px", borderRadius: "4px", background: "#fff" });
  loop(n, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.7 }, 2.4, k * 0.3); });
const v3 = txt(M[2], "Rp3,18 jt", { left: "100px", top: "30px", fontSize: "24px", color: "#0a0d2c" });
loop(v3, { scale: 1 }, { scale: 1.08 }, 1.2);
// 04 review shuffle
[2, 1, 0].forEach((k) => { const c = box(M[3], { left: 66 + k * 6 + "px", top: 22 - k * 6 + "px", width: "140px", height: "56px", borderRadius: "8px", background: k ? "rgba(255,255,255,.5)" : "#fff" });
  if (!k) loop(c, { x: 0, rotation: 0 }, { x: 40, rotation: 8 }, 1.4); });
// 05 count-up stats
const c5 = txt(M[4], "98%", { left: "86px", top: "20px", fontSize: "44px", color: "#0a0d2c" });
const o5 = { v: 0 }; loop(o5, { v: 12 }, { v: 98, onUpdate: () => { c5.textContent = Math.round(o5.v) + "%"; } }, 2.4);
// 06 bento build
[[16, 10, 110, 34], [16, 50, 52, 32], [74, 50, 52, 32], [134, 10, 120, 72]].forEach(([x, y, w, h], k) => { const b = box(M[5], { left: x + "px", top: y + "px", width: w + "px", height: h + "px", background: k === 3 ? "#2c68d8" : "#cfdaf0" });
  loop(b, { scale: 1, opacity: 1 }, { scale: 0.6, opacity: 0.2 }, 2.0, k * 0.12); });
// 07 cursor tour
box(M[6], { left: "30px", top: "34px", width: "70px", height: "24px", borderRadius: "12px", background: "#0a0d2c" });
box(M[6], { left: "170px", top: "34px", width: "70px", height: "24px", borderRadius: "12px", background: "#cfdaf0" });
const cur = txt(M[6], "➤", { left: "60px", top: "46px", fontSize: "22px", color: "#0a0d2c", transform: "rotate(-60deg)" });
loop(cur, { x: 0 }, { x: 140 }, 2.0);
// 08 process draw
const ln8 = box(M[7], { left: "40px", top: "45px", width: "190px", height: "4px", background: "#2c68d8", transformOrigin: "0% 50%" });
loop(ln8, { scaleX: 0 }, { scaleX: 1 }, 2.4);
[0, 1, 2].forEach((k) => box(M[7], { left: 32 + k * 95 + "px", top: "37px", width: "20px", height: "20px", borderRadius: "10px", background: "#fff", border: "4px solid #2c68d8" }));
// 09 before / after
box(M[8], { left: "0", top: "0", width: "272px", height: "92px", borderRadius: "0", background: "#cfdaf0" });
const af = box(M[8], { left: "0", top: "0", width: "272px", height: "92px", borderRadius: "0", background: "linear-gradient(135deg,#5b8cff,#2c68d8)", transformOrigin: "0% 50%" });
loop(af, { scaleX: 0.2 }, { scaleX: 0.85 }, 2.6);
// 10 price roll
const p10 = txt(M[9], "Rp99rb", { left: "76px", top: "22px", fontSize: "38px", color: "#0a0d2c" });
loop(p10, { y: 0, opacity: 1 }, { y: -18, opacity: 0.2 }, 1.4);
// 11 us vs them
txt(M[10], "✓ Kami", { left: "28px", top: "30px", fontSize: "22px", color: "#16a06a" });
const th = txt(M[10], "✕ Mereka", { left: "146px", top: "30px", fontSize: "22px", color: "#c2410c" });
loop(th, { opacity: 1 }, { opacity: 0.3 }, 1.6);
// 12 click -> success
const bt = box(M[11], { left: "76px", top: "28px", width: "120px", height: "36px", borderRadius: "18px", background: "#0a0d2c" });
const ok = txt(M[11], "✓", { left: "124px", top: "26px", fontSize: "30px", color: "#fff" });
loop(bt, { scale: 1, background: "#0a0d2c" }, { scale: 0.92, background: "#16a06a" }, 1.8);
// title shimmer (subtle)
ft("#c2", { backgroundPosition: "0% 50%" }, { backgroundPosition: "100% 50%", duration: D, ease: "none" }, 0);
        tl.set({}, {}, D - 0.01);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>

              <polygon points="40,420 90,270 112,286 66,404" fill="#f4f8fd" />

              <polygon points="740,420 790,270 790,622 740,778" fill="url(#s16-gSide)" />

              <rect x="110" y="540" width="560" height="74" rx="37" fill="url(#s16-gGlass)" stroke="#ffffff" stroke-width="2.5" />

              <path d="M84 650 H696" stroke="rgba(41,75,119,0.14)" stroke-width="2" /><path d="M84 653 H696" stroke="#ffffff" stroke-width="1.5" />
              <path d="M84 668 H696" stroke="rgba(41,75,119,0.10)" stroke-width="1.5" stroke-dasharray="2 8" />
              <rect x="84" y="690" width="612" height="40" rx="20" fill="url(#s16-gNavy)" />
              <rect x="96" y="693" width="588" height="4" rx="2" fill="rgba(255,255,255,0.4)" />
              <g id="s16-bticks"></g>
              <circle cx="66" cy="446" r="7" fill="url(#s16-gScrew)" stroke="rgba(41,75,119,0.3)" />
              <circle cx="714" cy="446" r="7" fill="url(#s16-gScrew)" stroke="rgba(41,75,119,0.3)" />
              <circle cx="66" cy="754" r="7" fill="url(#s16-gScrew)" stroke="rgba(41,75,119,0.3)" />
              <circle cx="714" cy="754" r="7" fill="url(#s16-gScrew)" stroke="rgba(41,75,119,0.3)" />
              <!-- feet -->
              <rect x="92" y="774" width="96" height="16" rx="8" fill="#a9bfdf" />
              <rect x="592" y="774" width="96" height="16" rx="8" fill="#a9bfdf" />

          </div>
          <div id="s16-glow" class="s16-abs"></div>
          <div id="s16-shock" class="s16-abs"></div>

        </div>
        <!-- NEAR PLANE -->
        <div id="s16-fg" class="s16-abs" style="inset:0"></div>
      </div>
      <script>
        (function () {
          const ID = "s16";
          const R = document.querySelector('[data-composition-id="' + ID + '"]');
          const q = (s) => R.querySelector(s), qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          const NS = "http://www.w3.org/2000/svg";
          const DUR = 3.0333;
          // scene-local word starts (verified): Mau .13 link .39 tiga .55 tools .82 yang .97 masih 1.24 aktif 1.52 plus 1.86 contoh 2.10 promptnya 2.42
          const T = { tiga: 0.55, tools: 0.82, third: 1.10, aktif: 1.52, plus: 1.86, contoh: 2.10, apex: 2.42 };
          let seed = 1616;
          const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
          const mk = (cls, parent, css, html) => { const e = document.createElement("div"); e.className = cls; if (css) e.style.cssText = css; if (html) e.innerHTML = html; parent.appendChild(e); return e; };
          const line = (g, x1, y1, x2, y2, stroke, w) => { const l = document.createElementNS(NS, "line"); l.setAttribute("x1", x1.toFixed(1)); l.setAttribute("y1", y1.toFixed(1)); l.setAttribute("x2", x2.toFixed(1)); l.setAttribute("y2", y2.toFixed(1)); l.setAttribute("stroke", stroke); l.setAttribute("stroke-width", w); g.appendChild(l); return l; };

          // halo ticks (far plane ornament)
          const ht = q("#s16-hticks");
          for (let i = 0; i < 72; i++) { const a = (i / 72) * Math.PI * 2, r2 = i % 6 === 0 ? 384 : 394; line(ht, 420 + Math.cos(a) * 404, 420 + Math.sin(a) * 404, 420 + Math.cos(a) * r2, 420 + Math.sin(a) * r2, "rgba(41,75,119,0.15)", i % 6 === 0 ? 3 : 1.5); }
          // lid ornament ticks
          const lt = q("#s16-lticks");
          for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2, r1 = 108, r2 = i % 4 === 0 ? 120 : 114; line(lt, 350 + Math.cos(a) * r1, 176 + Math.sin(a) * r1, 350 + Math.cos(a) * r2, 176 + Math.sin(a) * r2, "rgba(41,75,119,0.22)", i % 4 === 0 ? 2.5 : 1.2); }

          // front status wells (3) + tick marks
          const wells = q("#s16-wells"), fLeds = [];
          [175, 390, 605].forEach((cx) => {
            const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", cx); c.setAttribute("cy", 577); c.setAttribute("r", 15); c.setAttribute("fill", "#dbe4f0"); c.setAttribute("stroke", "rgba(41,75,119,0.22)"); c.setAttribute("stroke-width", "1.5"); wells.appendChild(c);
            const on = document.createElementNS(NS, "circle"); on.setAttribute("cx", cx); on.setAttribute("cy", 577); on.setAttribute("r", 10); on.setAttribute("fill", "url(#s16-gMint)"); wells.appendChild(on); fLeds.push(on);
            for (let k = -2; k <= 2; k++) if (k) line(wells, cx + k * 14 + (k > 0 ? 18 : -18), 600, cx + k * 14 + (k > 0 ? 18 : -18), 606, "rgba(41,75,119,0.25)", 1.5);
            line(wells, cx + 26, 570, cx + 80, 570, "rgba(41,75,119,0.16)", 5).setAttribute("stroke-linecap", "round");
            line(wells, cx + 26, 584, cx + 62, 584, "rgba(41,75,119,0.10)", 5).setAttribute("stroke-linecap", "round");
          });

          const bt = q("#s16-bticks");
          for (let i = 0; i < 40; i++) { const x = 130 + i * 13.3; line(bt, x, 712, x, i % 5 === 0 ? 722 : 718, "rgba(203,219,244,0.7)", i % 5 === 0 ? 2 : 1.2); }
          [110, 670].forEach((cx) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", cx); c.setAttribute("cy", 710); c.setAttribute("r", 6); c.setAttribute("fill", "url(#s16-gScrew)"); bt.appendChild(c); });

          // ---------- PLAQUES with REAL footage crops ----------
          // crop(src, srcW, cropX, cropY, cropW, cropH, bg) -> fits crop into the 170x76 inner window, centred
          const WIN_W = 170, WIN_H = 76;
          const P = [
            { src: "assets/footage/pom_title.jpg", sw: 1560, cx: 400, cy: 480, cw: 770, ch: 330, bg: "#161c00", x: 102, r0: -14, rf: -4, y0: -300 },   // 'Pomelli' wordmark
            { src: "assets/footage/stitch_prompt.jpg", sw: 1419, cx: 375, cy: 22, cw: 850, ch: 340, bg: "#000000", x: 319, r0: 10, rf: 0, y0: -360 }, // 'Design at the speed of AI'
            { src: "assets/footage/anti_wordmark.jpg", sw: 1920, cx: 140, cy: 256, cw: 1630, ch: 356, bg: "#ffffff", x: 536, r0: 16, rf: 4, y0: -330 }, // 'Antigravity' wordmark
          ];
          const pw = q("#s16-plaques");
          const plaques = P.map((p, i) => {
            const el = mk("s16-plq", pw, `left:${p.x}px`);
            mk("s16-plq-edge", el);
            const body = mk("s16-plq-body", el);
            const win = mk("s16-win", body, `background:${p.bg}`);
            const s = Math.min(WIN_W / p.cw, WIN_H / p.ch);
            const w = p.cw * s, h = p.ch * s;
            const crop = mk("s16-crop", win, `left:${((WIN_W - w) / 2).toFixed(2)}px;top:${((WIN_H - h) / 2).toFixed(2)}px;width:${w.toFixed(2)}px;height:${h.toFixed(2)}px`);
            const img = document.createElement("img");
            img.src = p.src; img.alt = "";
            img.style.cssText = `width:${(p.sw * s).toFixed(2)}px;left:${(-p.cx * s).toFixed(2)}px;top:${(-p.cy * s).toFixed(2)}px`;
            crop.appendChild(img);
            mk("s16-wglass", win);
            const led = mk("s16-led", body); const ledOn = mk("s16-ledon", led);
            const ring = mk("s16-abs s16-lring", body);
            const tog = mk("s16-tog", body); const togOn = mk("s16-togon", tog); const knob = mk("s16-knob", tog);
            mk("s16-pb", body, "left:42px;top:104px;width:88px");
            mk("s16-pb", body, "left:42px;top:118px;width:58px;background:#dfe7f2");
            mk("s16-pb", body, "left:16px;top:142px;width:164px;height:5px;background:#e3eaf4");
            mk("s16-pb", body, "left:16px;top:156px;width:120px;height:5px;background:#e3eaf4");
            mk("s16-screw", body, "left:93px;top:170px");
            const puff = mk("s16-abs s16-puff", q("#s16-hero"), `left:${p.x + 98 - 110}px;top:${376}px`);
            return { el, crop, ledOn, ring, togOn, knob, puff, p };
          });

          // sparkles (seeded), placed around the prompt sheet (screen ~540,585)
          const STAR = (fill) => `<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="${fill}" stroke="rgba(41,75,119,0.35)" stroke-width="1.5"/></svg>`;
          const sparks = [];
          for (let i = 0; i < 14; i++) {
            const sp = mk("s16-abs s16-spark", q("#s16-sparks"), "left:508px;top:553px", STAR(i % 5 === 2 ? "#f2c46d" : "#ffffff"));
            const a = (i / 14) * Math.PI * 2 + rnd() * 0.35;
            const rx = 250 + rnd() * 120, ry = 150 + rnd() * 70;
            let dy = Math.sin(a) * ry; if (dy < -170) dy = -170;
            sparks.push([sp, Math.cos(a) * rx, dy, 0.7 + rnd() * 0.7]);
          }
          // near-plane motes and bokeh
          const fg = q("#s16-fg"), motes = [];
          for (let i = 0; i < 9; i++) {
            const s = 10 + rnd() * 20;
            motes.push(mk("s16-abs s16-fmote", fg, `left:${(60 + rnd() * 960).toFixed(0)}px;top:${(470 + rnd() * 1000).toFixed(0)}px;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;opacity:${(0.45 + rnd() * 0.4).toFixed(2)}`));
          }
          const bok = [mk("s16-abs s16-bokeh", fg, "left:-70px;top:1420px;width:230px;height:230px;opacity:0.8"), mk("s16-abs s16-bokeh", fg, "left:900px;top:430px;width:170px;height:170px;opacity:0.65")];

          // ---------- initial states (set FIRST) ----------
          const LID = q("#s16-lid"), SH = q("#s16-sheet");
          tl.set(q("#s16-world"), { transformOrigin: "540px 960px" }, 0);
          tl.set(LID, { transformOrigin: "50% 100%", transformPerspective: 1500 }, 0);
          tl.set(q("#s16-box"), { transformOrigin: "50% 89%" }, 0);
          tl.set(q("#s16-hero"), { transformOrigin: "50% 90%" }, 0);
          tl.set(SH, { opacity: 0, transformOrigin: "50% 60%" }, 0);
          tl.set(q("#s16-panL"), { transformOrigin: "100% 50%", transformPerspective: 900 }, 0);
          tl.set(q("#s16-panR"), { transformOrigin: "0% 50%", transformPerspective: 900 }, 0);
          tl.set(q("#s16-lidglint"), { rotation: 18, x: 0 }, 0);
          tl.set([q("#s16-glow"), q("#s16-shock"), q("#s16-cone"), q("#s16-lglow")], { opacity: 0 }, 0);
          tl.set(fLeds, { opacity: 0 }, 0);
          plaques.forEach((pl) => {
            tl.set(pl.el, { transformOrigin: "50% 100%" }, 0);
            tl.set([pl.ledOn, pl.togOn], { opacity: 0 }, 0);
            tl.set(pl.ring, { opacity: 0, scale: 0.5 }, 0);
            tl.set(pl.puff, { opacity: 0, scale: 0.4 }, 0);
          });
          tl.set(sparks.map((s) => s[0]), { opacity: 0, scale: 0 }, 0);

          // ---------- camera + ambient (continuous) ----------
          tl.fromTo(q("#s16-world"), { scale: 1 }, { scale: 1.065, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s16-far"), { y: 0 }, { y: -36, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s16-halo"), { rotation: -8, scale: 1.12 }, { rotation: 10, scale: 1, duration: DUR, ease: "power2.out" }, 0);
          tl.fromTo(q("#s16-key"), { x: -30 }, { x: 30, duration: DUR, ease: "sine.out" }, 0);
          motes.forEach((m, i) => tl.fromTo(m, { x: 0, y: 0 }, { x: i % 2 ? 26 : -20, y: -(60 + i * 12), duration: DUR, ease: "none" }, 0));
          bok.forEach((b, i) => tl.fromTo(b, { x: 0, y: 0 }, { x: i ? -40 : 50, y: i ? 30 : -60, duration: DUR, ease: "none" }, 0));
          plaques.forEach((pl, i) => tl.fromTo(pl.crop, { scale: 1.0 }, { scale: 1.07, duration: DUR, ease: "none" }, 0));

          // ---------- entry: box rises, lid swings open (frame 0 already moving) ----------
          tl.fromTo(q("#s16-hero"), { y: -60, rotation: -1.5 }, { y: 0, rotation: 0, duration: 0.5, ease: "power2.out" }, 0);
          tl.fromTo(q("#s16-shadow"), { scaleX: 0.8, opacity: 0.45 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(q("#s16-shadow-wide"), { scaleX: 0.85, opacity: 0.5 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(LID, { rotationX: -66 }, { rotationX: 7, duration: 0.55, ease: "back.out(1.5)" }, 0);
          tl.to(q("#s16-lidglint"), { x: 1100, duration: 0.7, ease: "power2.inOut" }, 0.35);

          // ---------- plaques fall into the three raised sections ----------
          const LAND = [T.tiga, T.tools, T.third];
          plaques.forEach((pl, i) => {
            const L = LAND[i];
            tl.fromTo(pl.el, { y: pl.p.y0, rotation: pl.p.r0 }, { y: 0, rotation: pl.p.rf, duration: L, ease: "power2.in", immediateRender: false }, 0);
            tl.to(pl.el, { y: -14, duration: 0.09, ease: "power2.out" }, L);
            tl.to(pl.el, { y: 0, duration: 0.14, ease: "power2.in" }, L + 0.09);
            tl.fromTo(pl.puff, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.35, duration: 0.4, ease: "power2.out", immediateRender: false }, L);
            tl.fromTo(q("#s16-box"), { scaleY: 1, scaleX: 1 }, { scaleY: 0.985, scaleX: 1.006, duration: 0.06, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, L);
          });

          // ---------- "aktif" 1.52: status LEDs + toggles switch on ----------
          plaques.forEach((pl, i) => {
            const t0 = T.aktif + i * 0.05;
            tl.fromTo(pl.ledOn, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(pl.ring, { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.8, duration: 0.45, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(pl.togOn, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(pl.knob, { x: 0 }, { x: 19, duration: 0.22, ease: "back.out(2)", immediateRender: false }, t0);
            tl.to(pl.el, { y: -10, duration: 0.14, ease: "power2.out" }, t0);
            tl.to(pl.el, { y: 0, duration: 0.22, ease: "power2.inOut" }, t0 + 0.14);
            tl.fromTo(fLeds[i], { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, t0);
          });

          // ---------- "plus" 1.86: prompt sheet rises out of the box (folded) ----------
          tl.set(SH, { opacity: 1 }, T.plus - 0.04);
          tl.fromTo(SH, { y: 300, scale: 0.6, rotation: -3 }, { y: 0, scale: 1, rotation: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, T.plus - 0.04);
          tl.fromTo(q("#s16-panL"), { rotationY: -86 }, { rotationY: -82, duration: 0.2, ease: "none", immediateRender: false }, T.plus - 0.04);
          tl.fromTo(q("#s16-panR"), { rotationY: 86 }, { rotationY: 82, duration: 0.2, ease: "none", immediateRender: false }, T.plus - 0.04);
          tl.fromTo(q("#s16-cone"), { opacity: 0 }, { opacity: 0.85, duration: 0.4, ease: "power2.out", immediateRender: false }, T.plus);

          // ---------- "contoh" 2.10: sheet unfolds ----------
          tl.to(q("#s16-panL"), { rotationY: 10, duration: 0.3, ease: "back.out(1.4)" }, T.contoh - 0.04);
          tl.to(q("#s16-panR"), { rotationY: -10, duration: 0.3, ease: "back.out(1.4)" }, T.contoh - 0.02);

          // ---------- APEX "promptnya?" 2.42 ----------
          const A = T.apex;
          tl.fromTo(q("#s16-lglow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.08, duration: 0.25, ease: "power2.out", immediateRender: false }, A - 0.03);
          tl.to(q("#s16-lglow"), { opacity: 0.45, duration: 0.5, ease: "power2.out" }, A + 0.24);
          tl.fromTo(q("#s16-glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.55, scale: 1.1, duration: 0.25, ease: "power2.out", immediateRender: false }, A - 0.03);
          tl.to(q("#s16-glow"), { opacity: 0.12, duration: 0.5, ease: "power2.out" }, A + 0.24);
          tl.fromTo(q("#s16-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.58, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(SH, { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
          tl.fromTo(q("#s16-box"), { scale: 1 }, { scale: 1.03, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A + 0.02);
          sparks.forEach(([sp, dx, dy, s], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: s, opacity: 0, rotation: 90, duration: 0.58, ease: "power3.out", immediateRender: false }, A + i * 0.008);
          });
          tl.fromTo(q("#s16-lidglint"), { x: 0 }, { x: 1100, duration: 0.5, ease: "power2.inOut", immediateRender: false }, A - 0.05);
          // settle + gentle float
          tl.to(SH, { y: -8, duration: DUR - A - 0.26, ease: "sine.inOut" }, A + 0.26);

          window.__timelines[ID] = tl; // register LAST
        })();
      </script>
    </template>

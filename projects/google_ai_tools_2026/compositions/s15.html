          });

          // ---------- sparks / motes ----------
          const STAR = '<svg viewBox="0 0 40 40"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff" stroke="#acc6e7" stroke-width="1.5"/></svg>';
          const STARA = '<svg viewBox="0 0 40 40"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#fff7e2" stroke="#f2c46d" stroke-width="1.5"/></svg>';
          const mkSparks = (n, cx, cy, r0, r1, amber) => {
            const arr = [];
            for (let i = 0; i < n; i++) {
              const sp = mk("div", "s15-abs s15-spk", q("#s15-spks"), "left:" + cx + "px;top:" + cy + "px");
              sp.innerHTML = amber && i % 5 === 2 ? STARA : STAR;
              const a = (i / n) * Math.PI * 2 + rnd() * 0.5, r = r0 + rnd() * (r1 - r0);
              arr.push([sp, Math.cos(a) * r, Math.sin(a) * r * 0.85, 0.45 + rnd() * 0.65]);
            }
            return arr;
          };
          const spA = mkSparks(10, 300, 900, 140, 260, false), spB = mkSparks(16, 560, 1040, 220, 380, true);
          for (let i = 0; i < 14; i++) {
            const m = mk("div", "s15-abs s15-mote", q("#s15-motes"), "left:" + (80 + rnd() * 920).toFixed(0) + "px;top:" + (420 + rnd() * 1160).toFixed(0) + "px;opacity:" + (0.4 + rnd() * 0.5).toFixed(2));
            tl.set(m, { scale: 0.6 + rnd() * 1.4 }, 0);
            tl.fromTo(m, { x: 0, y: 0 }, { x: (rnd() - 0.5) * 50, y: -30 - rnd() * 60, duration: DUR, ease: "none" }, 0);
          }

          // ---------- initial states ----------
          const world = q("#s15-world"), plane = q("#s15-plane"), chips = [q("#s15-c1"), q("#s15-c2"), q("#s15-c3")];
          tl.set([q("#s15-flash"), q("#s15-shockA"), q("#s15-glow"), q("#s15-shockB")], { opacity: 0 }, 0);
          tl.set(spA.concat(spB).map((s) => s[0]), { opacity: 0 }, 0);
          tl.set(world, { transformOrigin: "540px 1000px" }, 0);
          tl.set(plane, { transformOrigin: "50% 50%" }, 0);
          chips.forEach((c, i) => tl.set(c, { z: 14, rotation: [-4, 2, 5][i], transformOrigin: "50% 50%" }, 0));
          tl.set(top._scan, { opacity: 0, y: 0 }, 0);
          tl.set(q("#s15-lever"), { rotation: 0, z: 6 }, 0);
          tl.set(top.querySelector(".s15-dog"), { transformOrigin: "100% 100%", scale: 1 }, 0);

          // ---------- entry (frame 0 populated) ----------
          tl.fromTo(world, { scale: 1 }, { scale: 1.06, duration: DUR, ease: "none" }, 0);
          tl.fromTo(plane, { y: 150, rotationX: 44, rotationY: -4, rotationZ: -6 }, { y: 0, rotationX: 26, rotationY: -10, rotationZ: 2, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(q("#s15-floor"), { scaleX: 0.8, opacity: 0.5 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(q("#s15-farp"), { y: 0 }, { y: -36, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s15-beam"), { rotation: -4 }, { rotation: 3, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo([q("#s15-fgS"), q("#s15-fg2")], { y: 0 }, { y: -120, duration: DUR, ease: "none" }, 0);
          chips.forEach((c, i) => tl.fromTo(c, { z: 70, y: -30 }, { z: 14, y: 0, duration: 0.45, ease: "back.out(1.5)", immediateRender: false }, 0.04 + i * 0.06));

          // "jangan": PUNCH — lever flips, rings snap open, flash + shock + sparks
          const J = T.jangan;
          tl.to(q("#s15-lever"), { rotation: -38, duration: 0.1, ease: "power3.in" }, J - 0.08);
          rings.forEach(([a, b], i) => {
            tl.to(a, { rotation: -34, x: -8, duration: 0.12, ease: "back.out(2.2)" }, J + i * 0.015);
            tl.to(b, { rotation: 34, x: 10, duration: 0.12, ease: "back.out(2.2)" }, J + i * 0.015);
          });
          tl.fromTo(q("#s15-flash"), { opacity: 0, scale: 0.6 }, { opacity: 0.9, scale: 1.05, duration: 0.15, ease: "power2.out", immediateRender: false }, J - 0.03);
          tl.to(q("#s15-flash"), { opacity: 0, duration: 0.5, ease: "power2.out" }, J + 0.15);
          tl.fromTo(q("#s15-shockA"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, J);
          tl.fromTo(plane, { scale: 1 }, { scale: 1.05, duration: 0.11, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, J);
          sheets.forEach((sh, s) => tl.to(sh, { z: 4 + s * 3, duration: 0.18, ease: "power2.out" }, J + 0.02));
          spA.forEach(([sp, dx, dy, s], i) => tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 }, { x: dx, y: dy, scale: s, opacity: 0, rotation: 90, duration: 0.6, ease: "power3.out", immediateRender: false }, J + i * 0.012));

          // "asal" / "simpan": the stack riffles and gets a first tug
          tl.to(top.querySelector(".s15-dog"), { scale: 1.25, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1 }, T.asal);
          sheets.forEach((sh, s) => tl.to(sh, { x: "+=14", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, T.simpan + s * 0.02));
          // "daftar": stale-list scan — rows fade as the scanner passes
          tl.to(top._scan, { opacity: 1, duration: 0.08, ease: "none" }, T.daftar - 0.08);
          tl.to(top._scan, { y: 690, duration: 0.55, ease: "power1.inOut" }, T.daftar - 0.08);
          tl.to(top._scan, { opacity: 0, duration: 0.1, ease: "none" }, T.daftar + 0.47);
          top._rows.forEach((r, i) => tl.to(r, { opacity: 0.45, duration: 0.12, ease: "none" }, T.daftar - 0.05 + i * 0.038));
          // "AI": keeper chips glint
          chips.forEach((c, i) => tl.fromTo(c.querySelector(".s15-chl"), { x: 0, y: 0 }, { x: 260, y: 230, duration: 0.5, ease: "power2.inOut", immediateRender: false }, T.ai + i * 0.06));
          chips.forEach((c, i) => tl.to(c, { z: 30, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, T.ai + i * 0.05));
          // "yang": wind-up
          sheets.forEach((sh) => tl.to(sh, { x: "-=16", duration: 0.2, ease: "power2.out" }, T.yang));
          // "sudah lama": the old list is yanked out from under the chips
          chips.forEach((c) => tl.to(c, { z: 44, duration: 0.14, ease: "power2.out" }, T.sudah - 0.14));
          [3, 2, 1, 0].forEach((s, k) => {
            tl.to(sheets[s], { x: 980, y: 30 + k * 16, z: 30, rotation: 7 + k * 2, duration: 0.3, ease: "power3.in" }, T.sudah - 0.04 + k * 0.05);
          });
          chips.forEach((c, i) => {
            tl.to(c, { z: 0, rotation: 0, duration: 0.14, ease: "power2.in" }, T.lama - 0.14 + i * 0.012);
            tl.to(c, { z: 10, duration: 0.1, ease: "power2.out" }, T.lama + 0.0 + i * 0.012);
            tl.to(c, { z: 4, duration: 0.2, ease: "bounce.out" }, T.lama + 0.1 + i * 0.012);
          });
          // APEX on "lama": keeper chips settle — glow + shock + sparkle + punch
          tl.fromTo(q("#s15-glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.95, scale: 1.1, duration: 0.25, ease: "power2.out", immediateRender: false }, T.lama - 0.03);
          tl.to(q("#s15-glow"), { opacity: 0.3, duration: 0.5, ease: "power2.out" }, T.lama + 0.25);
          tl.fromTo(q("#s15-shockB"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.9, duration: 0.55, ease: "power2.out", immediateRender: false }, T.lama);
          spB.forEach(([sp, dx, dy, s], i) => tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 }, { x: dx, y: dy, scale: s, opacity: 0, rotation: 90, duration: 0.55, ease: "power3.out", immediateRender: false }, T.lama + i * 0.01));
          // mint "keeper" checks pop on the three chips
          chips.forEach((c, i) => {
            const k = c.querySelector(".s15-chk");
            tl.set(k, { scale: 0, rotation: -40 }, 0);
            tl.to(k, { scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.8)" }, T.lama + 0.1 + i * 0.07);
          });
          // rings close again around nothing (clean binder) just before the cut
          rings.forEach(([a, b], i) => {
            tl.to(a, { rotation: 0, x: 0, duration: 0.16, ease: "back.out(2)" }, T.lama + 0.2 + i * 0.02);
            tl.to(b, { rotation: 0, x: 0, duration: 0.16, ease: "back.out(2)" }, T.lama + 0.2 + i * 0.02);
          });
          tl.to(q("#s15-lever"), { rotation: 0, duration: 0.14, ease: "back.out(2)" }, T.lama + 0.2);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>

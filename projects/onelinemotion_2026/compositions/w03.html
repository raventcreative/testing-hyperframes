      const nearOff = (t) => -NEAR_PX * Math.max(0, Math.floor((t - 1 / 60) / NEAR_TAU + 1e-6));   // near-layer offset at local time t

      // ---------------------------------------------------------------- sky: banded night gradient with dithered seams
      {
        const B = [[0, "#1a1a40"], [624, "#1d1b47"], [864, "#221d4f"], [1044, "#2b1e5a"], [1188, "#382267"], [1308, "#4a2873"], [1404, "#5d2e7d"], [1500, "#72358a"]];

      // ---------------------------------------------------------------- ENTRY: PIXEL DISSOLVE from the rocket nose
      const NX = 796, NY = 897, BS = 64, NT = 8, TICK = 1 / 15;

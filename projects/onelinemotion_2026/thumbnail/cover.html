<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover Reels — 1 kalimat, 10 gaya animasi</title>
<script src="../vendor/mascot3d.js"></script>
<script src="../vendor/robot3d.js"></script>
<script src="../vendor/vo_words.js"></script>
<!-- Elegant IG Reels cover 1080x1920 on the client's navy background: one hook ("1 kalimat" -> "10 gaya animasi"), the fan of the ten
     mini worlds (same art as the reel), the ONE LINE swooping through with the AI PRENEUR robot riding the rocket, the mascot waving
     below. Poppins 700/400, white + #01ccf7. Everything that matters sits inside the 4:5 profile-grid crop (y 285-1635).
     Render: node thumbnail/render_cover.cjs <out.png>   (static server on :8765 at the project root) -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1033; font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; }
  .plate { position: absolute; inset: 0; background: url(../assets/brand/bg_1080x1920.png) center / 1080px 1920px no-repeat; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  #g1 { left: 90px; top: 300px; width: 900px; height: 700px; background: radial-gradient(ellipse, rgba(48,93,143,.42), rgba(48,93,143,0) 66%); }
  #g2 { left: 140px; top: 820px; width: 800px; height: 600px; background: radial-gradient(ellipse, rgba(1,204,247,.16), rgba(1,204,247,0) 64%); }
  .grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(../assets/brand/grain_256.png); opacity: .06; }
  .ctr { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 432px; top: 318px; width: 216px; height: auto; filter: drop-shadow(0 2px 8px rgba(4,8,30,.55)); }
  #eyebrow { top: 372px; display: flex; justify-content: center; }
  #eyebrow span { height: 42px; padding: 0 20px; border-radius: 21px; display: flex; align-items: center; gap: 10px; background: rgba(1,204,247,.12);
    box-shadow: inset 0 0 0 1.5px rgba(1,204,247,.5); font: 700 19px/1 Poppins; letter-spacing: 4px; color: #6adfff; }
  #eyebrow i { width: 22px; height: 22px; background: #d97757; -webkit-mask: url(../assets/icons/si-claude.svg) center / contain no-repeat; mask: url(../assets/icons/si-claude.svg) center / contain no-repeat; }
  #k1 { top: 462px; font: 400 58px/1 Poppins; letter-spacing: -1px; color: #e3edfa; }
  #k1 b { font-weight: 700; color: #fff; }
  #hero { top: 530px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  #ten { font: 700 262px/0.86 Poppins; letter-spacing: -14px; background: linear-gradient(170deg, #b8f1ff 4%, #01ccf7 46%, #0aa7d6 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(1,204,247,.45)); padding-right: 14px; }
  #st { display: flex; flex-direction: column; gap: 4px; text-align: left; }
  #st b { font: 700 92px/0.98 Poppins; letter-spacing: -3.5px; color: #fff; text-shadow: 0 6px 24px rgba(4,8,30,.5); }
  #k2 { top: 812px; font: 400 34px/1 Poppins; color: #e3edfa; }
  #k2 s { text-decoration: none; position: relative; color: #fff; font-weight: 700; }
  #k2 s::after { content: ""; position: absolute; left: -6px; right: -6px; top: 53%; height: 5px; border-radius: 3px; background: #01ccf7; transform: rotate(-4deg); box-shadow: 0 0 12px rgba(1,204,247,.8); }
  /* mini world cards (art from compositions/s16.html) */
  .cv-a { position: absolute; }
  .cv-mc { left: 0; top: 0; width: 180px; height: 240px; margin: -120px 0 0 -90px; }
  .cv-mfl, .cv-mi { position: absolute; left: 0; top: 0; width: 180px; height: 240px; }
  .cv-mf { position: absolute; left: 0; top: 0; width: 180px; height: 240px; border-radius: 22px; overflow: hidden; background: #0b1440; box-shadow: 0 30px 50px -20px rgba(0,0,0,.8), 0 0 0 2px rgba(255,255,255,.18); }
  .cv-ms { position: absolute; left: 0; top: 0; display: block; }
  .cv-ml { position: absolute; left: 0; top: 196px; width: 180px; height: 44px; background: #0b1440; box-shadow: inset 0 1.5px 0 rgba(106,223,255,.32); font: 700 16px/44px Poppins; color: #fff; text-align: center; white-space: nowrap; }
  .cv-mg, .cv-fw { display: none; }
  .cv-mn { position: absolute; left: -16px; top: -16px; width: 54px; height: 54px; border-radius: 50%; background: #01ccf7; color: #071033; text-align: center;
    font: 700 29px/55px Poppins; letter-spacing: -0.03em; box-shadow: 0 0 0 4px #0b1440, 0 8px 16px rgba(0,0,0,.45); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #line { z-index: 20; } #r { z-index: 21; } #m { z-index: 22; } #logo, .ctr { z-index: 30; } .grain { z-index: 40; } #fan { position: absolute; inset: 0; z-index: 10; }
</style>
</head>
<body>
<div id="c">
  <div class="plate"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div>
  <div id="fan"></div>
  <svg class="abs" id="line" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
  <canvas id="r"></canvas>
  <canvas id="m"></canvas>
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR">
  <div id="eyebrow" class="ctr"><span><i></i>CLAUDE SKILL · GRATIS</span></div>
  <div id="k1" class="ctr">cukup <b>1 kalimat</b>, jadi</div>
  <div id="hero" class="ctr"><div id="ten">10</div><div id="st"><b>gaya</b><b>animasi</b></div></div>
  <div id="k2" class="ctr">tanpa <s>After Effects</s></div>
  <div class="grain"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), P = (k, d) => parseFloat(q.get(k) || d);
  const M3 = window.Mascot3D, VW = window.VO_WORDS;
  // ---------------------------------------------------------------- the fan of the ten mini worlds (art reused from s16)
  async function buildFan() {
    const src = await (await fetch("../compositions/s16.html")).text();
    const a = src.indexOf("const MW = ["), b = src.indexOf("      // lab = true");
    const miniArt = new Function(src.slice(a, b) + "; return miniArt;")();
    const MW = ["Kartun Flat", "Papan Tulis Sains", "Pixel 8-bit", "Retro Neon", "Panel Komik", "Low-poly 3D", "Clay", "Sinematik", "Stickman", "Cat Air"];
    const CX = 540, CY = P("fy", "2120"), R = P("fr", "1060"), A = P("fa", "4.6"), S = P("fs", "0.86");
    let h = "";
    for (let i = 0; i < 10; i++) {
      const ang = (i - 4.5) * A, rad = (ang * Math.PI) / 180;
      const x = CX + Math.sin(rad) * R, y = CY - Math.cos(rad) * R;
      h += `<div class="cv-a cv-mc" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;transform:rotate(${ang.toFixed(2)}deg) scale(${S});z-index:${i}">
        <div class="cv-mfl"><div class="cv-mi"><div class="cv-mf"><svg class="cv-ms" viewBox="0 0 180 196" width="180" height="196" preserveAspectRatio="xMidYMax slice">${miniArt("cv", i)}</svg>
        <div class="cv-ml"${MW[i].length > 13 ? ' style="font-size:14.5px"' : ""}>${MW[i]}</div></div><div class="cv-mn">${i + 1}</div></div></div></div>`;
    }
    document.getElementById("fan").innerHTML = h;
  }
  // ---------------------------------------------------------------- the one line + the brand rocket (same geometry/paint as the reel)
  const RK = { x: P("rx", "706"), y: P("ry", "1352"), rot: P("rr", "-15"), s: P("rs", "1.14") };
  function buildLine() {
    const G = {
      BODY: "M -128,-40 L 52,-40 C 104,-40 146,-18 162,0 C 146,18 104,40 52,40 L -128,40 Q -138,40 -138,30 L -138,-30 Q -138,-40 -128,-40 Z",
      NOSE: "M 80,-36.5 C 116,-32 148,-15 162,0 C 148,15 116,32 80,36.5 C 89,20 89,-20 80,-36.5 Z",
      BAND: "M -100,-40 L -84,-40 L -84,40 L -100,40 Z", FIN_T: "M -88,-38 L -122,-80 Q -128,-88 -138,-86 L -146,-84 L -128,-38 Z",
      FIN_B: "M -88,38 L -122,80 Q -128,88 -138,86 L -146,84 L -128,38 Z", NOZ: "M -136,-25 L -156,-31 L -156,31 L -136,25 Z",
      SHADE: "M -128,14 L 70,14 C 96,14 130,8 150,3 C 140,14 104,40 52,40 L -128,40 Q -138,40 -138,30 L -138,14 Z", HI: "M -118,-30 L 46,-30 C 76,-30 104,-24 124,-14" };
    const r = (RK.rot * Math.PI) / 180, tx = RK.x - Math.cos(r) * 150 * RK.s, ty = RK.y - Math.sin(r) * 150 * RK.s;
    // the line: enters bottom-left, dips under the fan, rises into the rocket's tail
    const d = `M -60,${P("l0", "1250")} C 150,${P("l1", "1330")} 260,${P("l2", "1520")} ${(tx - 150).toFixed(0)},${(ty + 52).toFixed(0)} S ${(tx - 40).toFixed(0)},${(ty + 14).toFixed(0)} ${tx.toFixed(1)},${ty.toFixed(1)}`;
    const L = (op) => `<path d="${d}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${op}/>`;
    const fl = (l, h) => `M -154,${-h} C ${-154 - l * 0.38},${-h * 1.12} ${-154 - l * 0.82},${-h * 0.34} ${-154 - l},0 C ${-154 - l * 0.82},${h * 0.34} ${-154 - l * 0.38},${h * 1.12} -154,${h} Z`;
    document.getElementById("line").innerHTML = `<defs>
        <linearGradient id="t-fade" gradientUnits="userSpaceOnUse" x1="-60" y1="1250" x2="${tx}" y2="${ty}"><stop offset="0" stop-color="#01ccf7" stop-opacity="0"/><stop offset=".3" stop-color="#01ccf7"/><stop offset="1" stop-color="#01ccf7"/></linearGradient>
        <linearGradient id="t-core" gradientUnits="userSpaceOnUse" x1="-60" y1="1250" x2="${tx}" y2="${ty}"><stop offset="0" stop-color="#e9fbff" stop-opacity="0"/><stop offset=".35" stop-color="#e9fbff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
        <linearGradient id="g-body" x1="0" y1="-40" x2="0" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef4fc"/><stop offset="1" stop-color="#c9d8ec"/></linearGradient>
        <linearGradient id="g-fin" x1="0" y1="-86" x2="0" y2="86" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#01ccf7"/><stop offset=".5" stop-color="#0a8fc4"/><stop offset="1" stop-color="#01ccf7"/></linearGradient>
        <radialGradient id="g-glass" cx="20" cy="-10" r="26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b8f1ff"/><stop offset=".55" stop-color="#3fd6ff"/><stop offset="1" stop-color="#0b7fb3"/></radialGradient>
        <radialGradient id="g-halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#01ccf7" stop-opacity=".34"/><stop offset="1" stop-color="#01ccf7" stop-opacity="0"/></radialGradient>
      </defs>
      ${L('stroke="url(#t-fade)" stroke-width="44" stroke-opacity=".14"')}${L('stroke="url(#t-fade)" stroke-width="16"')}${L('stroke="url(#t-core)" stroke-width="5"')}
      <g transform="translate(${RK.x} ${RK.y}) rotate(${RK.rot}) scale(${RK.s})">
        <ellipse cx="-10" cy="0" rx="250" ry="140" fill="url(#g-halo)"/>
        <path d="${fl(118, 23)}" fill="#01ccf7" fill-opacity=".85"/><path d="${fl(66, 13)}" fill="#f2fdff"/>
        <path d="${G.FIN_T}" fill="url(#g-fin)"/><path d="${G.FIN_B}" fill="url(#g-fin)"/><path d="${G.NOZ}" fill="#33415f"/>
        <path d="${G.BODY}" fill="url(#g-body)"/><path d="${G.SHADE}" fill="#9fb6d6" fill-opacity=".22"/><path d="${G.BAND}" fill="#01ccf7"/><path d="${G.NOSE}" fill="#01ccf7"/>
        <circle cx="26" cy="-2" r="22" fill="#0b1440"/><circle cx="26" cy="-2" r="14.5" fill="url(#g-glass)"/>
        <path d="${G.HI}" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".9" stroke-linecap="round"/><circle cx="20" cy="-8" r="4.5" fill="#fff" fill-opacity=".9"/>
      </g>
      ${[[180, 1400, 3], [300, 1316, 2.2], [452, 1270, 2.6], [610, 1236, 1.8], [980, 1020, 2.4], [1010, 1110, 1.6]].map(([x, y, r2]) => `<circle cx="${x}" cy="${y}" r="${r2}" fill="#e9fbff" opacity=".85"/>`).join("")}`;
  }
  // ---------------------------------------------------------------- robot riding the rocket (same pose as the reel's ride)
  async function buildRobot() {
    const cv = document.getElementById("r"); cv.width = 1080; cv.height = 1920;
    const rb = await window.Robot3D.Robot.create(cv, { url: "../assets/robot3d/robot_aipreneur.glb", width: 1080, height: 1920, envIntensity: 0.55 });
    const r = (RK.rot * Math.PI) / 180, sx = -34 * RK.s, sy = -33 * RK.s;
    const fx = RK.x + Math.cos(r) * sx - Math.sin(r) * sy, fy = RK.y + Math.sin(r) * sx + Math.cos(r) * sy;
    rb.setView({ fx, fy, h: 205 * RK.s, pitch: 5 });
    const HF = [-0.0775, -0.227, -0.1287];
    rb.setState({ root: { x: 0, y: 0, z: 0, rx: 0.1, ry: P("bry", "0.95"), rz: 0, s: 1 },
      bones: { body: [0, 0, 0], head: [HF[0] - 0.06, HF[1] - P("bhy", "0.52"), HF[2]], hand_L: [-0.3, 0, -0.35], hand_R: [0.5, 0, 0] },
      offs: { hand_L: [0.04, 0.3, 0.1], hand_R: [0.085, -0.035, 0.17], head: [0, 0, 0] },      // one hand on the hull, one waving
      face: { blink: 0, gaze: [-0.2, 0.04], happy: P("bh", "1"), squint: 0, talk: 0, bars: [0, 0, 0, 0, 0], glow: 1 }, ring: 1.5, shadow: false });
    rb.render();
    cv.style.transformOrigin = `${fx}px ${fy}px`; cv.style.transform = `rotate(${RK.rot}deg)`;
  }
  // ---------------------------------------------------------------- the mascot waving, half body at the bottom
  async function buildMascot() {
    const FACE = {"eyeA": {"c": [-0.1017, 0.6033], "r": [0.037, 0.034], "n": 344, "J": [-0.8070804081852212, -0.28336927447264443, -0.2689292148517819, 0.767464652853189], "uv0": [0.41428961906002, 0.6508527738073399], "maxErr": 0.0075728971647898765}, "eyeB": {"c": [0.1, 0.602], "r": [0.037, 0.034], "n": 344, "J": [0.7239884387099991, -0.06125307155111093, -0.04553605872381199, -0.7027396856405153], "uv0": [0.10665626011522979, 0.44039104240012367], "maxErr": 0.005958813097786782}, "browA": {"c": [-0.101, 0.689], "n": 99, "J": [-0.2397367555212638, 0.8539817292816768, 0.7021133260473107, 0.3275224085304049], "uv0": [0.6104683461950666, 0.4751860845807758], "maxErr": 0.0034168031311564056}, "browB": {"c": [0.1, 0.689], "n": 183, "J": [0.7452202855149699, -0.1768453408899853, -0.1387417639801932, -0.7149624190012184], "uv0": [0.09597917118934614, 0.3768964421328661], "maxErr": 0.004863166031021183}, "mouth": {"c": [0, 0.547], "r": [0.03, 0.016]}, "skin": [253, 200, 156], "skinEye": [243, 186, 141], "coverNormal": 0, "lidLit": [1, 1, 1], "mouthDy": 0, "faceSmooth": 1, "lidRing": 1.5, "browNy": 0.98, "headC": [0, 0.72, 0]};
    const src = await (await fetch("../compositions/mascot.html")).text();
    const DECALS = JSON.parse(src.match(/const DECALS = (\[.*?\]);\n/s)[1].replace(/"assets\//g, '"../assets/'));
    const cv = document.getElementById("m"); cv.width = 1080; cv.height = 1920;
    const m = await M3.Mascot.create(cv, { url: "../assets/mascot3d/mascot_biz_rigged.glb", face: FACE, decals: DECALS, width: 1080, height: 1920, envIntensity: 0.6 });
    for (const o of m.scene.children) if (o.isDirectionalLight && o.position.z < 0) { o.intensity = 1.9; o.color.setRGB(0.5, 0.86, 1.0); o.position.set(1.6, 1.5, -1.4); }
    if (m.shadow) m.shadow.visible = false;
    const DIR = M3.direct(VW, 60, { intents: [{ t: 0.4, action: "idle" }], seed: 9, quiet: 0, look: 0 });
    const PERF = M3.buildPerformance(DIR.tracks, 60.05, { smooth: 1 });
    m.setView({ fx: P("mx", "214"), fy: P("my", "1915"), h: P("mh", "640"), yaw: 0, pitch: 4 });
    const B = Object.assign({}, PERF(0).bones);
    B.upperarm_R = [P("ux", "-2.7"), 0, P("uz", "-0.25")]; B.forearm_R = [0, 0, 0]; B.hand_R = [-0.12, 0.1, -0.12];
    B.head = [P("hx", "-0.08"), P("hy", "0.1"), 0.04]; B.neck = [-0.02, 0.04, 0.02];
    m.setState({ root: { x: 0, y: 0, ry: P("mry", "0.32"), rz: 0, rx: 0, s: 1 }, bones: B,
      face: { blink: [0, 0], gaze: [-0.003, 0.006], mouthMix: 1, mouth: [0.04, 0.012, 0.005, 0.2] } });
    m.render();
  }
  buildLine();
  window.COVER_READY = Promise.all([document.fonts.ready, buildFan(), buildRobot(), q.get("nomascot") ? null : buildMascot()]);
</script>
</body>
</html>

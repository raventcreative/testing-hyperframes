            const l = document.createElementNS(NS, "line");
            l.setAttribute("x1", (480 + Math.cos(a) * r0).toFixed(1)); l.setAttribute("y1", (480 + Math.sin(a) * r0).toFixed(1));
            l.setAttribute("x2", (480 + Math.cos(a) * r1).toFixed(1)); l.setAttribute("y2", (480 + Math.sin(a) * r1).toFixed(1));
            l.setAttribute("stroke-width", major ? "3" : "1.4");
            ticks.appendChild(l);
          }
          const riv = q("#s10-rivets");
          for (let i = 0; i < 24; i++) {
            const a = (i / 24) * Math.PI * 2 + Math.PI / 24;
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", (480 + Math.cos(a) * 389).toFixed(1)); c.setAttribute("cy", (480 + Math.sin(a) * 389).toFixed(1));
            c.setAttribute("r", "5.5"); c.setAttribute("fill", "url(#s10-gRiv)"); c.setAttribute("stroke", "rgba(28,51,84,0.3)"); c.setAttribute("stroke-width", "0.8");
            riv.appendChild(c);
          }

          // ---------- portal extrusion depth ----------
          qa(".s10-thk").forEach((d) => tl.set(d, { z: -(+d.dataset.d) * 5 }, 0));
          tl.set(q(".s10-memb"), { z: -44 }, 0);
          tl.set(q(".s10-face"), { z: 1 }, 0);
          tl.set(qa(".s10-rod, .s10-hub"), { z: 14 }, 0);
          tl.set(q(".s10-glass"), { z: 34, transformOrigin: "0% 50%" }, 0);
          tl.set(qa(".s10-clamp"), { z: 30 }, 0);
          // orbit meridians: flat (parallel) planes behind the hoop, ellipse via 2D squash -> no plane intersections
          tl.set(q(".s10-orbA"), { z: -70, rotation: -24, scaleY: 0.86 }, 0);
          tl.set(q(".s10-orbB"), { z: -110, rotation: 18, scaleY: 0.8 }, 0);
          tl.set(qa(".s10-stub"), { z: -24 }, 0);
          tl.set(q(".s10-base"), { z: 12 }, 0);
          tl.set(q(".s10-neck"), { z: 6 }, 0);

          // ---------- crystal glints on the rim (light up on "Antigravity") ----------
          const glintRoot = q("#s10-glints");
          const GL = '<svg viewBox="-40 -40 80 80" style="position:absolute;left:-40px;top:-40px;width:80px;height:80px;overflow:visible"><path d="M0 -40 C 2 -8, 8 -2, 40 0 C 8 2, 2 8, 0 40 C -2 8, -8 2, -40 0 C -8 -2, -2 -8, 0 -40 Z" fill="#ffffff"/><path d="M0 -16 L 5 0 L 0 16 L -5 0 Z" fill="#e8f0fb" stroke="#acc6e7" stroke-width="1.2"/><circle r="6" fill="#ffffff"/></svg>';
          const glints = [];
          [205, 228, 250, 300, 18, 120, 330, 160].forEach((deg, i) => {
            const a = (deg * Math.PI) / 180, r = i % 2 ? 446 : 412;
            const g = mk("div", "s10-a", glintRoot, "left:" + (480 + Math.cos(a) * r).toFixed(1) + "px;top:" + (480 + Math.sin(a) * r).toFixed(1) + "px;width:0;height:0");
            g.innerHTML = GL;
            glints.push(g);
            tl.set(g, { z: 50, scale: 0, opacity: 0, rotation: 0 }, 0);
            const t = T.apex + i * 0.03;
            const sc = i < 4 ? 1.1 - i * 0.12 : 0.6;
            tl.to(g, { scale: sc, opacity: 1, rotation: 45, duration: 0.16, ease: "back.out(2.2)" }, t);
            tl.to(g, { scale: sc * 0.45, opacity: 0.75, rotation: 90, duration: 0.5, ease: "power2.out" }, t + 0.16);
          });

          // ---------- portal swing into alignment ----------
          const portal = q(".s10-portal"), glass = q(".s10-glass");
          tl.set(portal, { transformOrigin: "480px 480px", rotationY: 64, rotationX: 10, rotation: -6, z: -360, x: 170, y: 40, scale: 1 }, 0);
          tl.to(portal, { rotationY: 15, rotationX: 3, rotation: -1.5, z: -60, x: 20, y: 0, duration: 0.56, ease: "power3.out" }, 0);
          tl.to(portal, { rotationY: 0, rotationX: 0, rotation: 0, z: 0, x: 0, duration: 0.3, ease: "power2.in" }, 0.56);
          tl.to(portal, { rotationY: -2.2, duration: 0.12, ease: "power2.out" }, T.apex);
          tl.to(portal, { rotationY: 0, duration: 0.32, ease: "back.out(1.6)" }, T.apex + 0.12);
          // scale punch on the word
          tl.to(portal, { scale: 1.05, duration: 0.12, ease: "power2.out" }, T.apex);
          tl.to(portal, { scale: 1, duration: 0.3, ease: "power2.out" }, T.apex + 0.12);
          // orbit rings + membrane beads keep turning (meaningful continuous motion)
          tl.set(q(".s10-orbAs"), { rotation: 0 }, 0);
          tl.to(q(".s10-orbAs"), { rotation: 150, duration: DUR, ease: "none" }, 0);
          tl.set(q(".s10-orbBs"), { rotation: 0 }, 0);
          tl.to(q(".s10-orbBs"), { rotation: -110, duration: DUR, ease: "none" }, 0);
          tl.set(q(".s10-spin"), { rotation: 0, transformOrigin: "372px 372px" }, 0);
          tl.to(q(".s10-spin"), { rotation: 200, duration: DUR, ease: "none" }, 0);

          // real footage: slight settle pan (still image, never altered)
          const img = q(".s10-img");
          tl.set(img, { scale: 1.14, x: 26, y: 8 }, 0);
          tl.to(img, { scale: 1.0, x: 0, y: 0, duration: T.apex + 0.1, ease: "power3.out" }, 0);
          tl.to(img, { scale: 1.035, duration: T.exit - T.apex - 0.1, ease: "sine.inOut" }, T.apex + 0.1);
          // glass sheen on the word
          const sheen = q(".s10-sheen");
          tl.set(sheen, { x: -300, rotation: 16, opacity: 1 }, 0);
          tl.to(sheen, { x: 980, duration: 0.5, ease: "power2.inOut" }, T.apex - 0.06);

          // ---------- "Ketiga": third lamp lights ----------
          const l3 = q(".s10-l3");
          tl.set(l3, { opacity: 0, scale: 0.4 }, 0);
          tl.to(l3, { opacity: 1, scale: 1.35, duration: 0.14, ease: "back.out(2.4)" }, T.ketiga);
          tl.to(l3, { scale: 1, duration: 0.25, ease: "power2.out" }, T.ketiga + 0.14);

          // ---------- far / fore planes ----------
          tl.set(q(".s10-beam"), { rotation: -24, opacity: 0.5 }, 0);
          tl.to(q(".s10-beam"), { rotation: -19, opacity: 0.85, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set(q(".s10-keyl"), { opacity: 0.55, scale: 0.9 }, 0);
          tl.to(q(".s10-keyl"), { opacity: 1, scale: 1.04, duration: 0.6, ease: "power2.out" }, T.apex - 0.3);
          qa(".s10-far").forEach((e, i) => tl.fromTo(e, { x: 0, y: 0 }, { x: (i % 2 ? -1 : 1) * 24, y: -30 - i * 6, duration: DUR, ease: "none" }, 0));
          tl.fromTo(q(".s10-farring"), { x: 0, rotation: 0 }, { x: 30, rotation: 30, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q(".s10-fg1"), { x: 0, y: 0 }, { x: 70, y: -60, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q(".s10-fg2"), { x: 0, y: 0 }, { x: -80, y: 50, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q(".s10-floor"), { scaleX: 0.72, opacity: 0.45 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0);

          // foreground ice crystal shards (near plane, blurred, drifting)
          const SH = '<svg viewBox="-30 -40 60 80"><path d="M0 -38 L 18 -6 L 6 36 L -16 10 Z" fill="rgba(255,255,255,0.85)" stroke="rgba(172,198,231,0.9)" stroke-width="1.5"/><path d="M0 -38 L 6 36 L -16 10 Z" fill="rgba(203,219,244,0.6)"/></svg>';
          const shardRoot = q("#s10-shards");
          [[120, 640, 0.9, 7], [960, 1080, 1.2, 9], [180, 1500, 1.4, 10], [870, 1450, 0.7, 5], [70, 980, 0.6, 4]].forEach(([x, y, s, b], i) => {
            const e = mk("div", "s10-a s10-shard", shardRoot, "left:" + x + "px;top:" + y + "px;filter:blur(" + b + "px)");
            e.innerHTML = SH;
            tl.set(e, { scale: s, rotation: rnd() * 80 - 40, opacity: 0.85 }, 0);
            tl.to(e, { x: (rnd() - 0.5) * 120, y: -60 - rnd() * 80, rotation: "+=" + (40 + rnd() * 60), duration: DUR, ease: "none" }, 0);
          });

          // ---------- APEX "Antigravity": flash + rays + shockwave + sparkles ----------
          const flash = q(".s10-flash"), rays = q(".s10-rays"), shock = q(".s10-shock");
          tl.set(flash, { opacity: 0, scale: 0.6 }, 0);
          tl.to(flash, { opacity: 0.95, scale: 1.05, duration: 0.12, ease: "power2.out" }, T.apex - 0.02);
          tl.to(flash, { opacity: 0.18, scale: 1.15, duration: 0.45, ease: "power2.out" }, T.apex + 0.1);
          tl.set(rays, { opacity: 0, scale: 0.7, rotation: 0 }, 0);
          tl.to(rays, { opacity: 0.85, scale: 1.05, rotation: 8, duration: 0.2, ease: "power2.out" }, T.apex);
          tl.to(rays, { opacity: 0, scale: 1.2, rotation: 16, duration: 0.5, ease: "power2.out" }, T.apex + 0.2);
          tl.set(shock, { opacity: 0, scale: 0.4 }, 0);
          tl.fromTo(shock, { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out", immediateRender: false }, T.apex);

          const SPK = '<svg viewBox="-24 -24 48 48"><path d="M0 -24 C 3 -6, 6 -3, 24 0 C 6 3, 3 6, 0 24 C -3 6, -6 3, -24 0 C -6 -3, -3 -6, 0 -24 Z" fill="#ffffff" stroke="rgba(41,75,119,0.35)" stroke-width="1.2"/><circle r="5" fill="#f2c46d" opacity="0.5"/></svg>';
          const spks = q("#s10-spks");
          for (let i = 0; i < 14; i++) {
            const ang = (i / 14) * Math.PI * 2 + rnd() * 0.3;
            const r0 = 380 + rnd() * 50, r1 = 520 + rnd() * 140;
            const s = mk("div", "s10-a s10-spk", spks, "left:" + (540 + Math.cos(ang) * r0).toFixed(1) + "px;top:" + (940 + Math.sin(ang) * r0).toFixed(1) + "px");
            s.innerHTML = SPK;
            const sc = 0.5 + rnd() * 0.8, t = T.apex + rnd() * 0.07;
            tl.set(s, { scale: 0, opacity: 0, rotation: 0, x: 0, y: 0 }, 0);
            tl.to(s, { opacity: 1, scale: sc, duration: 0.12, ease: "back.out(2.5)" }, t);
            tl.to(s, { x: Math.cos(ang) * (r1 - r0), y: Math.sin(ang) * (r1 - r0), rotation: 90, duration: 0.6, ease: "power3.out" }, t);
            tl.to(s, { scale: 0, opacity: 0, duration: 0.2, ease: "power2.in" }, t + 0.4 + rnd() * 0.1);
          }

          // ---------- camera: push-in, then swing THROUGH the portal (-> s11) ----------
          const cam = q(".s10-cam"), world = q(".s10-world");
          tl.set(world, { scale: 1, rotationY: 0, transformOrigin: "540px 940px" }, 0);
          tl.to(world, { scale: 1.06, duration: T.exit, ease: "sine.inOut" }, 0);
          tl.set(cam, { scale: 1, rotation: 0, transformOrigin: "540px 940px" }, 0);
          // glass plane swings open like a door, camera dives into the opening
          tl.to(glass, { rotationY: 82, duration: 0.42, ease: "power2.in" }, T.exit);
          tl.to(qa(".s10-clamp"), { opacity: 0, duration: 0.2, ease: "none" }, T.exit + 0.1);
          tl.to(q(".s10-scr"), { opacity: 0, duration: 0.18, ease: "power1.in" }, DUR - 0.24);
          tl.to(world, { rotationY: -10, duration: DUR - T.exit, ease: "power2.in" }, T.exit);
          tl.to(cam, { scale: 3.1, rotation: 4, duration: DUR - T.exit, ease: "power3.in" }, T.exit);
          tl.to(q(".s10-keyl"), { opacity: 1, scale: 1.3, duration: DUR - T.exit, ease: "power2.in" }, T.exit);

          window.__timelines[ID] = tl; // register LAST
        })();
      </script>

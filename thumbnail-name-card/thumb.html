<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;src:url(fonts/poppins400.woff2);font-weight:400}
@font-face{font-family:Poppins;src:url(fonts/poppins500.woff2);font-weight:500}
@font-face{font-family:Poppins;src:url(fonts/poppins600.woff2);font-weight:600}
@font-face{font-family:Poppins;src:url(fonts/poppins700.woff2);font-weight:700}
:root{--navy:#070d26;--navy2:#0b1640;--blue:#2f6bff;--sky:#9cc0ff}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:Poppins,sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
.photo{position:absolute;left:-54px;top:110px;width:1188px;filter:saturate(.82) contrast(1.06) brightness(.96)}
/* cool navy grade over the warm room */
.tint{position:absolute;inset:0;background:#1a2f6e;mix-blend-mode:soft-light;opacity:.55}
.person{position:absolute;left:-54px;top:110px;width:1188px;filter:saturate(.82) contrast(1.06) brightness(.98)}
/* top: black fade over the room only */
.top{position:absolute;inset:0;background:
  linear-gradient(180deg,#020308 0%,rgba(2,3,8,.92) 7%,rgba(2,3,10,.62) 16%,rgba(2,3,10,.3) 28%,rgba(2,3,10,.12) 40%,rgba(2,3,10,.12) 100%),
  radial-gradient(120% 70% at 50% 45%,rgba(2,4,14,0) 55%,rgba(2,4,14,.45) 100%)}
/* grid sits behind the person */
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.42) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.42) 1.5px,transparent 1.5px);
  background-size:108px 108px;background-position:-1px 52px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.75) 40%,rgba(0,0,0,.7) 100%)}
/* bottom: see-through royal blue, strongest at the bottom edge, gone by mid-frame */
.bottom{position:absolute;inset:0;background:
  linear-gradient(0deg,rgba(18,40,175,.62) 0%,rgba(18,40,175,.48) 12%,rgba(14,32,150,.3) 26%,rgba(10,24,120,.14) 38%,rgba(8,18,90,0) 52%)}
.logo{position:absolute;top:286px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:2px;
  color:#fff;font-weight:600;font-size:30px;letter-spacing:.02em}
.logo img{height:30px;margin-right:6px;filter:brightness(1.4)}
.name{position:absolute;left:110px;top:1380px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
/* name tag in the "NELSON" style: bold caps name, role on square navy-blue gradient bars */
.name h1{font-weight:700;font-size:66px;line-height:1;letter-spacing:.005em;color:#fff;text-transform:uppercase;margin:0 0 8px 2px;
  text-shadow:0 3px 14px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4)}
.bar{display:inline-block;padding:7px 22px 8px 16px;font-weight:500;font-size:36px;line-height:1.15;color:#fff;
  background:linear-gradient(90deg,rgba(14,34,98,.96) 0%,rgba(30,62,150,.9) 55%,rgba(52,92,180,.72) 100%);
  box-shadow:0 8px 20px rgba(2,6,22,.35)}
.nologo .logo{display:none}
</style></head><body>
<div class="stage" id="stage">
  <img class="photo" src="photo_up.jpg">
  <div class="tint"></div><div class="top"></div><div class="grid"></div>
  <img class="person" src="person.png">
  <div class="bottom"></div>
  <div class="logo"><img src="logo.png">AI PRENEUR</div>
  <div class="name">
    <h1>Henny Aska Daulika</h1>
    <span class="bar">Pebisnis Skincare</span>
  </div>
</div></body></html>

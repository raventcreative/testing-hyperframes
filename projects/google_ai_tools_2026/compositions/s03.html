<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!--
      HOUSE STYLE SCENE TEMPLATE (Ice-Ivory Illustrated Diorama)
      1. Copy to compositions/sNN.html and replace every "s03" with the scene id (s01, s02, ...).
      2. Replace the placeholder hero (.s03-hero) with ONE detailed illustrated metaphor (SVG + CSS).
      3. Keep the shared FX helpers (contact shadow, spotlight cone, far bokeh, apex burst) and retime them
         to the scene's spoken words (scene-local seconds, 0 = scene start).
      Rules: production/SCENE_CONTRACT (doc 12). No full-screen opaque background. Text only = spoken words.
    -->
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        .s03-abs { position: absolute; }
        /* far plane: soft blurred porcelain discs (depth cue) */
        .s03-far { border-radius: 50%; filter: blur(7px); opacity: 0.65;
          background: radial-gradient(circle at 35% 30%, #ffffff, #e8f0fb 45%, #acc6e7 100%); box-shadow: 0 30px 50px -20px rgba(28,51,84,0.3); }
        /* key light pool behind the hero */
        .s03-key { left: -120px; top: 330px; width: 1100px; height: 1100px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 64%); }
        /* spotlight cone (use on the key moment) */
        .s03-cone { left: 190px; top: 400px; width: 700px; height: 820px; clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
          background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.6) 55%, rgba(255,255,255,0.85)); filter: blur(8px);
          -webkit-mask-image: linear-gradient(180deg, #000 0, #000 70%, transparent 96%); mask-image: linear-gradient(180deg, #000 0, #000 70%, transparent 96%); }
        /* HERO placeholder — replace with the illustrated metaphor */
        .s03-hero { left: 240px; top: 640px; width: 600px; height: 520px; border-radius: 34px;
          background: linear-gradient(172deg, #ffffff, #eef3fa); border: 2px solid rgba(41,75,119,0.10);
          box-shadow: 0 2px 0 rgba(255,255,255,0.9) inset, 0 40px 70px -24px rgba(28,51,84,0.38), 0 10px 22px rgba(28,51,84,0.12); }
        .s03-hero-inner { position: absolute; left: 60px; top: 70px; right: 60px; height: 260px; border-radius: 22px;
          background: linear-gradient(135deg, #3a6299, #294b77 55%, #1f3a5f); box-shadow: inset 0 2px 0 rgba(255,255,255,0.25); }
        /* contact shadow on the ground (light from upper-left -> shadow slightly right/below) */
        .s03-shadow { left: 270px; top: 1150px; width: 580px; height: 80px; border-radius: 50%;
          background: radial-gradient(ellipse, rgba(28,51,84,0.45), rgba(28,51,84,0.14) 45%, rgba(28,51,84,0) 72%); }
        /* apex FX kit */
        .s03-glow { left: 240px; top: 600px; width: 600px; height: 600px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,255,255,1), rgba(255,247,226,0.7) 30%, rgba(242,196,109,0.15) 52%, rgba(242,196,109,0) 70%); }
        .s03-shock { left: 340px; top: 700px; width: 400px; height: 400px; border-radius: 50%;
          border: 5px solid rgba(255,255,255,0.95); box-shadow: 0 0 30px rgba(172,198,231,0.9), inset 0 0 24px rgba(172,198,231,0.7); }
        .s03-spark { width: 56px; height: 56px; }
        .s03-check { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(160deg, #bfe9da, #9fd8c4); border: 3px solid #ffffff; box-shadow: 0 10px 18px -6px rgba(28,51,84,0.4); }
      </style>
      <div id="root" data-composition-id="s03" data-width="1080" data-height="1920">
        <div class="s03-abs s03-key"></div>
        <div class="s03-abs s03-far" style="left:70px;top:780px;width:110px;height:110px"></div>
        <div class="s03-abs s03-far" style="left:905px;top:860px;width:84px;height:84px"></div>
        <div class="s03-abs s03-far" style="left:920px;top:1230px;width:120px;height:120px"></div>
        <div class="s03-abs s03-cone"></div>
        <div class="s03-abs s03-world" style="inset:0">
          <div class="s03-abs s03-shadow"></div>
          <div class="s03-abs s03-glow"></div>
          <div class="s03-abs s03-hero"><div class="s03-hero-inner"></div></div>
          <div class="s03-abs s03-shock"></div>
          <div class="s03-abs s03-check" style="left:792px;top:612px">
            <svg width="34" height="34" viewBox="0 0 34 34"><path d="M7 18 L14 25 L27 10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "s03";
          const R = document.querySelector('[data-composition-id="' + ID + '"]');
          const q = (s) => R.querySelector(s), qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          const DUR = 2.6333;                 // = host slot data-duration
          const T = { apex: 1.2 };         // scene-local word times (key action lands on the word)

          // seeded PRNG for sparkle placement (never Math.random)
          let seed = 7;
          const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
          const STAR = '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff" stroke="#acc6e7" stroke-width="1.5"/></svg>';
          const sparks = [];
          for (let i = 0; i < 10; i++) {
            const sp = document.createElement("div");
            sp.className = "s03-abs s03-spark"; sp.innerHTML = STAR;
            sp.style.left = 515 + "px"; sp.style.top = 875 + "px";
            q(".s03-world").appendChild(sp);
            const a = (i / 10) * Math.PI * 2 + rnd() * 0.4, r = 220 + rnd() * 160;
            sparks.push([sp, Math.cos(a) * r, Math.sin(a) * r]);
          }

          // initial hidden states (set FIRST; later fromTo tweens use immediateRender:false)
          tl.set([q(".s03-shock"), q(".s03-glow"), q(".s03-cone")], { opacity: 0 }, 0);
          tl.set(q(".s03-check"), { scale: 0 }, 0);
          tl.set(sparks.map((s) => s[0]), { opacity: 0 }, 0);

          // frame 0 is never empty: hero already rising, slow push-in all scene
          tl.fromTo(q(".s03-world"), { scale: 1 }, { scale: 1.07, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q(".s03-hero"), { y: 60, rotation: -2 }, { y: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo(q(".s03-shadow"), { scaleX: 0.8, opacity: 0.5 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo(qa(".s03-far"), { y: 0 }, { y: -40, duration: DUR, ease: "none" }, 0);   // far plane parallax (slower)
          tl.fromTo(q(".s03-cone"), { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: "power2.out", immediateRender: false }, T.apex - 0.3);

          // APEX on the spoken word: glow + shockwave + sparkles + scale punch + mint check
          tl.fromTo(q(".s03-glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.1, duration: 0.25, ease: "power2.out", immediateRender: false }, T.apex - 0.03);
          tl.to(q(".s03-glow"), { opacity: 0.35, duration: 0.8, ease: "power2.out" }, T.apex + 0.25);
          tl.fromTo(q(".s03-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, T.apex);
          tl.fromTo(q(".s03-hero"), { scale: 1 }, { scale: 1.045, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T.apex);
          tl.fromTo(q(".s03-check"), { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, T.apex + 0.05);
          sparks.forEach(([sp, dx, dy], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: 0.6 + (i % 3) * 0.25, opacity: 0, rotation: 90, duration: 0.7, ease: "power3.out", immediateRender: false }, T.apex + i * 0.012);
          });

          window.__timelines[ID] = tl; // register LAST
        })();
      </script>
    </template>
  </body>
</html>

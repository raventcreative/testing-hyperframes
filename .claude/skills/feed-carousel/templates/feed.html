<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
.slide{position:relative;width:1080px;height:1350px;background-size:cover;
  /* SAFE ZONE: 96px kiri/kanan (aman dari crop grid IG 3:4), 88px atas, 96px bawah */
  padding:88px 96px 96px}
.navy{color:#fff}
.white{color:#0a0d2c}
.logo{display:block;height:34px;width:auto}
/* Konten mulai >=120px di bawah logo (88+34+120 = 242) */
.content{position:absolute;left:96px;right:96px;top:242px;bottom:150px;display:flex;flex-direction:column;justify-content:var(--align,flex-start)}
h1{font-family:Poppins;font-weight:700;font-size:var(--h,76px);line-height:1.12;letter-spacing:-.01em;max-width:860px}
.white h1,.white .grad{background:linear-gradient(100deg,#0a0d2c 0%,#294b77 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.navy .acc{color:#00c9ff}
.white .acc{color:#294b77}
p{font-family:Inter;font-weight:400;font-size:var(--b,34px);line-height:1.5;max-width:820px;margin-top:40px}
.navy p{color:rgba(255,255,255,.88)}
.white p{color:#0a0d2c}
.foot{position:absolute;left:96px;right:96px;bottom:96px;display:flex;justify-content:space-between;font-family:Inter;font-size:24px;opacity:.7}
</style></head>
<body><div id="root"></div>
<script src="slides.js"></script>
<script>
// BRAND = path to repo brand/ folder, relative to this html (set window.BRAND in slides.js)
const B=window.BRAND||'../../../brand';
document.head.insertAdjacentHTML('beforeend',`<style>
@font-face{font-family:Poppins;font-weight:700;src:url(${B}/fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(${B}/fonts/inter-latin-400-normal.woff2)}
.navy{background-image:url(${B}/feed/bg-navy.png)}.white{background-image:url(${B}/feed/bg-white.png)}</style>`);
// ?s=<index> ; data from window.SLIDES (slides.js next to this file, see SKILL.md)
const q=new URLSearchParams(location.search), i=+(q.get('s')||0);
const s=(window.SLIDES||[])[i]||{theme:'navy',title:'Headline <span class="acc">contoh</span>',body:'Teks biasa Inter Regular.'};
const n=(window.SLIDES||[1]).length;
document.getElementById('root').innerHTML=`<div class="slide ${s.theme}" style="--h:${s.h||76}px;--b:${s.b||34}px;--align:${s.align||'flex-start'}">
<img class="logo" src="${B}/feed/logo-${s.theme==='navy'?'white':'dark'}.png">
<div class="content"><h1>${s.title||''}</h1>${s.body?`<p>${s.body}</p>`:''}</div>
${n>1?`<div class="foot"><span>${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}</span><span>${i<n-1?'Geser →':''}</span></div>`:''}
</div>`;
</script></body></html>

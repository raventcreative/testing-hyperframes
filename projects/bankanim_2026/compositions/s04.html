  <script>
    (function () {
      // s04 "Semuanya gerak halus, kayak bikinan motion designer."
      // Starts on the GRID. "Semuanya gerak halus,": ONE silky wave rolls diagonally through the whole bank (stagger by distance from
      // the top-left card): each card swells toward the viewer, tips back and settles, a glossy band sweeping across it as the crest
      // passes (crest at the centre on "gerak", on the last card on "halus"). "kayak bikinan": a dark EASING-CURVE editor glides in over
      // the right ¾ of the grid (a door-swing from the right), its two bezier handles drag the straight curve into an S, the chip flips
      // "linear" → "ease-in-out" and the Grafik card gets a selection box. "motion designer.": a gold dot runs the curve (x = time,
      // y = eased value, a gold trail behind it, playhead + keyframes below) and DRIVES the Grafik card: it spins 360° with exactly that
      // easing while the Rotasi readout counts 0° → 360°. Then the editor swings away; every card is at rest on the GRID.
      const D = 2.9333, ST = 9.7667, VW = window.VO_WORDS, MA = window.MicroAnim;
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= after); return w ? w[1] : 0; };
      const L = (txt) => wt(txt, ST - 0.05) - ST;   // local time of a word
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };

      // ---- the easing: cubic-bezier(.65, 0, .35, 1) — the SAME function drives the dot, the trail, the card spin and the readout
      const X1 = 0.65, Y1 = 0, X2 = 0.35, Y2 = 1;
      const bz = (a, b, s) => 3 * (1 - s) * (1 - s) * s * a + 3 * (1 - s) * s * s * b + s * s * s;
      const sOf = (p) => { let lo = 0, hi = 1; for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (bz(X1, X2, m) < p) lo = m; else hi = m; } return (lo + hi) / 2; };
      const EASE = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : bz(Y1, Y2, sOf(p)));
      // arc length along the drawn curve (graph px), for the trail's dash
      const GX = (s) => 20 + 360 * bz(X1, X2, s), GY = (s) => 380 - 360 * bz(Y1, Y2, s);
      const NS = 600, CUM = [0];
      for (let k = 1; k <= NS; k++) { const a = (k - 1) / NS, b = k / NS; CUM.push(CUM[k - 1] + Math.hypot(GX(b) - GX(a), GY(b) - GY(a))); }
      const LEN = CUM[NS];
      const ARC = (p) => { if (p <= 0) return 0; if (p >= 1) return 1; const s = sOf(p) * NS, k = Math.floor(s); return (CUM[k] + (CUM[Math.min(NS, k + 1)] - CUM[k]) * (s - k)) / LEN; };

      const stage = $("s04-stage");
      const H = MA.grid(stage, "s04-c");
      const REST = { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, rotation: 0, scale: 1, opacity: 1 };
      H.forEach((h) => I(h.el, Object.assign({ zIndex: 0 }, REST)));

      // ---- 1) "Semuanya gerak halus,": one diagonal wave (stagger by distance from the top-left card)
      const tSem = L("Semuanya"), tHal = L("halus,");
      const ang = Math.atan2(424, 636), ca = Math.cos(ang), sa = Math.sin(ang), SMAX = 636 * ca + 424 * sa;
      const W0 = tSem - 0.01, SPREAD = tHal - 0.4 - W0;     // first card starts on "Semuanya"; the last card crests on "halus,"
      // crest: the tile swells toward the viewer IN PLACE (x/y cancel the perspective drift, so nothing leaves the hero zone) and
      // tips along the wave's direction
      const ZC = 60, KC = 1500 / (1500 - ZC);
      H.forEach((h, i) => {
        const cx = h.home.x + 95, cy = h.home.y + 95, d = (cx - 222) * ca + (cy - 395) * sa, t = W0 + SPREAD * d / SMAX;
        const lift = cy < 500 ? -8 : -16;                   // a gentle rise (less on the top row: the logo sits just above it)
        const CREST = { x: (cx - 540) * (1 / KC - 1), y: (cy - 607) * (1 / KC - 1) + lift, z: ZC, rotationX: 20, rotationY: -14 };
        const FLAT = { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0 };
        ft(h.el, FLAT, Object.assign({ duration: 0.4, ease: "sine.inOut" }, CREST), t);
        ft(h.el, CREST, Object.assign({ duration: 0.62, ease: "sine.inOut" }, FLAT), t + 0.4);
        const sh = document.createElement("i"); sh.className = "s04-sh"; sh.id = "s04-sh" + i; h.el.appendChild(sh);
        I(sh, { xPercent: -135 });
        ft(sh, { xPercent: -135 }, { xPercent: 135, duration: 0.72, ease: "power1.inOut" }, t + 0.04);
      });

      // ---- 2) "kayak bikinan": the editor swings in from the right over columns 2–4
      const tKay = L("kayak"), tBik = L("bikinan"), tMot = L("motion");
      const panel = $("s04-panel");
      const PIN = { x: 380, rotationY: -30, scale: 0.94 }, PON = { x: 0, rotationY: 0, scale: 1 };
      I(panel, Object.assign({ opacity: 0 }, PIN));
      const pIn = tKay - 0.16;                                // ≈ 1.37: right as "halus," ends
      ft(panel, PIN, Object.assign({ duration: 0.62, ease: "expo.out" }, PON), pIn);
      ft(panel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, pIn);
      // inner rows settle in a hair later (the UI "builds")
      [["s04-graph", 0.06], ["s04-ro", 0.12], ["s04-tlz", 0.17]].forEach(([id, dt]) => {
        const e = $(id); I(e, { opacity: 0, y: 22 });
        ft(e, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, pIn + dt);
      });
      // the handles drag the straight curve into an S (ease-in-out)
      const tDrag = tBik - 0.1, dDrag = 0.36;
      const LIN = "M20 380 C140 260 260 140 380 20", EIO = "M20 380 C254 380 146 20 380 20";
      ["s04-curve", "s04-cglow"].forEach((id) => ft($(id), { attr: { d: LIN } }, { attr: { d: EIO }, duration: dDrag, ease: "power3.inOut" }, tDrag));
      ft($("s04-h1"), { attr: { x2: 140, y2: 260 } }, { attr: { x2: 254, y2: 380 }, duration: dDrag, ease: "power3.inOut" }, tDrag);
      ft($("s04-h2"), { attr: { x2: 260, y2: 140 } }, { attr: { x2: 146, y2: 20 }, duration: dDrag, ease: "power3.inOut" }, tDrag);
      ft($("s04-k1"), { attr: { cx: 140, cy: 260 } }, { attr: { cx: 254, cy: 380 }, duration: dDrag, ease: "power3.inOut" }, tDrag);
      ft($("s04-k2"), { attr: { cx: 260, cy: 140 } }, { attr: { cx: 146, cy: 20 }, duration: dDrag, ease: "power3.inOut" }, tDrag);
      // label flips linear → ease-in-out, the bezier numbers follow
      const tLab = tDrag + 0.24;
      const chA = $("s04-chA"), chB = $("s04-chB"), vA = $("s04-vA"), vB = $("s04-vB");
      I(chA, { opacity: 1, y: 0 }); I(chB, { opacity: 0, scale: 0.7 }); I(vA, { opacity: 1, y: 0 }); I(vB, { opacity: 0, y: 14 });
      ft(chA, { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: 0.16, ease: "power2.in" }, tLab);
      ft(chB, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.2)" }, tLab + 0.08);
      ft(vA, { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.16, ease: "power2.in" }, tLab);
      ft(vB, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, tLab + 0.08);
      // the Grafik card (GRID 4, left column, not covered) is selected
      const card = H[4].el, sel = $("s04-sel");
      I(sel, { opacity: 0, scale: 1.14, rotation: 0 });
      ft(sel, { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, tBik + 0.02);
      tl.set(card, { zIndex: 30 }, tBik);

      // ---- 3) "motion designer.": the dot runs the curve and drives the card
      const T0 = Math.round((tMot - 0.1) * 30) / 30, DUR = 0.6;   // frame-aligned (2.0 → 2.6)
      const dot = $("s04-dot"), dg = $("s04-dg"), trail = $("s04-trail"), ph = $("s04-ph"), rot = $("s04-rot");
      trail.setAttribute("stroke-dasharray", `${(LEN + 2).toFixed(2)} ${(LEN + 2).toFixed(2)}`);
      I(trail, { attr: { "stroke-dashoffset": LEN + 2 } });
      ft(trail, { attr: { "stroke-dashoffset": LEN + 2 } }, { attr: { "stroke-dashoffset": 0 }, duration: DUR, ease: ARC }, T0);
      [dot, dg].forEach((e) => {
        ft(e, { attr: { cx: 20 } }, { attr: { cx: 380 }, duration: DUR, ease: "none" }, T0);
        ft(e, { attr: { cy: 380 } }, { attr: { cy: 20 }, duration: DUR, ease: EASE }, T0);
      });
      I(ph, { x: 0 }); ft(ph, { x: 0 }, { x: 360, duration: DUR, ease: "none" }, T0);
      // keyframes tick as the playhead leaves / arrives
      const kfA = $("s04-kfA"), kfB = $("s04-kfB"); I(kfA, { scale: 1 }); I(kfB, { scale: 1 });
      ft(kfA, { scale: 1 }, { scale: 1.45, duration: 0.1, ease: "power2.out" }, T0); ft(kfA, { scale: 1.45 }, { scale: 1, duration: 0.22, ease: "power2.inOut" }, T0 + 0.1);
      ft(kfB, { scale: 1 }, { scale: 1.6, duration: 0.1, ease: "power2.out" }, T0 + DUR - 0.03); ft(kfB, { scale: 1.6 }, { scale: 1, duration: 0.2, ease: "power2.inOut" }, T0 + DUR + 0.07);
      // the driven card: a 360° spin with exactly that curve (+ a soft dip so its corners clear the neighbours)
      // dip shaped on the ANGLE: full within the first/last 36°, so the turning corners always clear the neighbours (ends at 1)
      const ssm = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
      const DIP = (p) => { const a = EASE(p); return ssm(a / 0.1) * ssm((1 - a) / 0.1); };
      [card, sel].forEach((e) => {
        ft(e, { rotation: 0 }, { rotation: 360, duration: DUR, ease: EASE }, T0);
        ft(e, { scale: 1 }, { scale: 0.85, duration: DUR, ease: DIP }, T0);
        tl.set(e, { rotation: 0 }, T0 + DUR + 0.01);       // 360° ≡ 0°
      });
      const knobs = Array.from(sel.children); I(knobs, { opacity: 1 });
      ft(knobs, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power1.out" }, T0);
      I(rot, { textContent: "0°" });
      for (let f = Math.round(T0 * 30) + 1; f <= Math.round((T0 + DUR) * 30); f++) tl.set(rot, { textContent: Math.round(360 * EASE((f / 30 - T0) / DUR)) + "°" }, f / 30);

      // ---- 4) the editor swings away; the selection box lets go; the bank is at rest on the GRID
      const tOut = T0 + DUR + 0.01;                             // 2.61 → 2.88 (last frame 2.9)
      ft(sel, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.08, duration: 0.16, ease: "power2.in" }, tOut);
      // opaque all the way: it swings off-frame to the right (the reverse of its entry), wiping the grid back into view
      ft(panel, PON, { x: 820, rotationY: 18, scale: 0.97, duration: 0.27, ease: "power3.in" }, tOut);
      tl.set(panel, { opacity: 0 }, tOut + 0.27);
      tl.set(card, { zIndex: 0 }, tOut + 0.28);

      tl.set({}, {}, D - 0.01);
      (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);
      const drawAll = (t) => H.forEach((h) => h.draw(t));
      drawAll(ST);
      window.addEventListener("hf-seek", (e) => drawAll(e.detail.time + (window.__T0 || 0)));
      window.__timelines = window.__timelines || {};
      window.__timelines["s04"] = tl;
    })();

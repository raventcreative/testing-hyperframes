<!doctype html>
<html><head><meta charset="utf-8">
<!-- feed-carousel template (skills/feed-carousel) + media block for photos / UI cards -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
.slide{position:relative;width:1080px;height:1350px;background-size:cover;padding:88px 96px 96px}
.navy{color:#fff}
.logo{display:block;height:34px;width:auto}
.content{position:absolute;left:96px;right:96px;top:242px;bottom:150px;display:flex;flex-direction:column}
h1{font-family:Poppins;font-weight:700;font-size:var(--h,68px);line-height:1.12;letter-spacing:-.01em;max-width:860px}
.navy .acc{color:#00c9ff}
p.b{font-family:Inter;font-weight:400;font-size:var(--b,31px);line-height:1.5;max-width:860px;margin-top:32px;color:rgba(255,255,255,.88)}
.media{position:relative;flex:1;min-height:0;margin-top:44px}
.ph{position:absolute;inset:0;border-radius:30px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,13,44,0) 40%,rgba(10,13,44,.55))}
.foot{position:absolute;left:96px;right:96px;bottom:96px;display:flex;justify-content:space-between;font-family:Inter;font-size:24px;opacity:.7}
/* comment card */
.cm{position:absolute;display:flex;gap:14px;align-items:flex-start;padding:16px 20px;border-radius:20px;background:#fff;color:#0a0d2c;font-family:Inter;box-shadow:0 22px 50px -18px rgba(0,0,0,.6);max-width:520px}
.cm .av{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#294b77,#0a0d2c)}
.cm small{display:block;font-size:17px;color:#294b77;opacity:.8}
.cm span{display:block;font-size:22px;line-height:1.35}
.cm em{font-style:normal;display:block;margin-top:4px;font-size:16px;color:#294b77;opacity:.7}
.cm.hl{outline:4px solid #00c9ff}
/* glass card */
.gc{position:absolute;padding:20px 24px;border-radius:22px;background:rgba(10,13,44,.82);border:2px solid rgba(255,255,255,.16);font-family:Inter;backdrop-filter:blur(6px);box-shadow:0 22px 50px -18px rgba(0,0,0,.6)}
.gc h4{font-family:Poppins;font-weight:700;font-size:25px}
.gc .mono{font-family:ui-monospace,Menlo,monospace;font-size:17px;color:#00c9ff;margin-top:4px}
.gc p{font-size:19px;line-height:1.4;color:rgba(255,255,255,.8);margin-top:8px}
.gc .btn{display:inline-block;margin-top:12px;padding:7px 16px;border-radius:10px;background:#00c9ff;color:#0a0d2c;font-size:18px;font-family:Poppins;font-weight:700}
.lg{position:absolute;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.chip{display:inline-block;margin:0 8px 10px 0;padding:9px 18px;border-radius:40px;border:2px solid #00c9ff;color:#fff;font-family:Inter;font-size:21px;background:rgba(10,13,44,.7)}
.chip.on{background:#00c9ff;color:#0a0d2c}
table{width:100%;border-collapse:collapse;font-size:18px}
th{text-align:left;color:#00c9ff;font-weight:400;padding:6px 6px;border-bottom:1.5px solid rgba(255,255,255,.2)}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.88)}
td s{color:rgba(255,255,255,.4)}
.arr{position:absolute;color:#00c9ff;font-family:Poppins;font-weight:700;font-size:40px}
</style></head>
<body><div id="root"></div>
<script src="slides.js"></script>
<script>
const B=window.BRAND||'../../brand';
document.head.insertAdjacentHTML('beforeend',`<style>
@font-face{font-family:Poppins;font-weight:700;src:url(${B}/fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(${B}/fonts/inter-latin-400-normal.woff2)}
.navy{background-image:url(${B}/feed/bg-navy.png)}</style>`);
const q=new URLSearchParams(location.search), i=+(q.get('s')||0);
const s=window.SLIDES[i], n=window.TOTAL||window.SLIDES.length;
document.getElementById('root').innerHTML=`<div class="slide navy" style="--h:${s.h||68}px;--b:${s.b||31}px">
<img class="logo" src="${B}/feed/logo-white.png">
<div class="content"><h1>${s.title}</h1>${s.body?`<p class="b">${s.body}</p>`:''}${s.media?`<div class="media">${s.media}</div>`:''}</div>
<div class="foot"><span>${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}</span><span>${i<n-1?'Geser →':''}</span></div>
</div>`;
</script></body></html>

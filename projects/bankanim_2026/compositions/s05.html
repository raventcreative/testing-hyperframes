  <script>
    (function () {
      // s05 "Caranya gampang. Copy satu perintah, tempel ke Claude Code, animasinya langsung jadi."
      // Starts on the GRID · "Caranya": the bank parks in a one-row DOCK (mini cards, labels off) while the "Like" card rises to the

      // (dashed "+") · a cursor glides in from the robot's side · "Copy": click, ripple, "Tersalin ✓", the text gets selected ·
      // "satu perintah": a "1 perintah" clipboard chip clings to the cursor and the prompt card collapses into it · "tempel": the
      // cursor pastes and a dark terminal (Claude mark + "Claude Code") IRISES OPEN from the paste point; the prompt types in at the
      // robot's holo-keyboard rhythm (14 key ticks/s, same clock as its keys) · "Claude Code,": the mark spins, the title lights ·
      // "animasinya": Enter → progress 0–100 % · "langsung": "Jadi!" and the NEW Like card is born from the terminal · "jadi.": the
      // terminal snaps shut, the card lands in its slot (squash + ring) as the dock unfurls back onto the GRID. Ends on the GRID.
      const D = 5.0333, ST = 12.7, VW = window.VO_WORDS, MA = window.MicroAnim;
      const wt = (txt, after = 0) => { const w = VW.find((x) => x[0] === txt && x[1] >= after); return w ? w[1] : 0; };
      const L = (txt) => wt(txt, ST - 0.05) - ST;   // local time of a word (this scene's occurrence)
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const _sc = (v) => { if (!v || typeof v !== "object" || v.scale === undefined) return v; const o = Object.assign({}, v); o.scaleX = o.scaleY = o.scale; delete o.scale; return o; };
      { const s0 = tl.set.bind(tl), f0 = tl.fromTo.bind(tl), t0 = tl.to.bind(tl); tl.set = (a, v, p) => s0(a, _sc(v), p); tl.fromTo = (a, x, y, p) => f0(a, _sc(x), _sc(y), p); tl.to = (a, v, p) => t0(a, _sc(v), p); }
      const ft = (el, a, b, t) => tl.fromTo(el, a, Object.assign({ immediateRender: false }, b), t);
      const I = (el, v) => { gsap.set(el, _sc(v)); tl.set(el, v, 0); };

      // ---------------------------------------------------------------- the bank (GRID) → a one-row dock

      const NEW = 6;                                     // the "Like" card is the one we (re)make
      const G2 = MA.GRID_SIZE / 2, DS = 0.36, DP = 76, DCY = 362;
      const dock = H.map((h, i) => ({ x: 540 + (i - 5.5) * DP - (h.home.x + G2), y: DCY - (h.home.y + G2) }));

      const tray = $("s05-tray"), ph = $("s05-ph");

      // bottom row first, the whole bank is pulled up into the shelf (x / y on different curves = a soft arc)
      const FOLD = [8, 9, 10, 11, 4, 5, 7, 0, 1, 2, 3];

        const h = H[i], d = dock[i], t0 = tCar - 0.07 + k * 0.024;
        ft(h.el, { x: 0 }, { x: d.x, duration: 0.6, ease: "power3.inOut" }, t0);
        ft(h.el, { y: 0, scale: 1 }, { y: d.y, scale: DS, duration: 0.6, ease: "expo.inOut" }, t0);
        ft(lbs[i], { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.out" }, t0 + 0.04);
      });
      // the Like card rises to the centre and unfolds into its prompt
      const N = H[NEW], ncx = N.home.x + G2, ncy = N.home.y + G2, PCX = 540, PCY = 550;
      ft(N.el, { x: 0, y: 0, scale: 1 }, { x: PCX - ncx, y: PCY - ncy, scale: 1, duration: 0.36, ease: "power3.inOut" }, tCar - 0.08);
      ft(lbs[NEW], { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out" }, tGam - 0.08);
      ft(N.el, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.in" }, tGam - 0.02);
      I(ph, { opacity: 0, scale: 0.6 });
      ft(ph, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)" }, tGam + 0.3);

      // ---------------------------------------------------------------- the prompt card
      const pc = $("s05-pc"), cp = (a, b, r) => `inset(${a}px ${b}px ${a}px ${b}px round ${r}px)`;
      I(pc, { opacity: 0, clipPath: cp(15, 345, 28), scale: 1, y: 0 });
      tl.set(pc, { opacity: 1 }, tGam - 0.06);
      ft(pc, { clipPath: cp(15, 345, 28) }, { clipPath: cp(-80, -80, 108), duration: 0.5, ease: "expo.out" }, tGam - 0.05);
      [["s05-pch", 0.1], ["s05-pbox", 0.15]].forEach(([id, d]) => { const e = $(id); I(e, { opacity: 0, y: 14 });
        ft(e, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, tGam + d); });
      const btn = $("s05-btn"), btng = $("s05-btng"), bst = $("s05-bst"), sel = $("s05-sel");
      I(btn, { scale: 0.7 }); ft(btn, { scale: 0.7 }, { scale: 1, duration: 0.42, ease: "back.out(2.2)" }, tGam + 0.22);
      I(btng, { opacity: 0 }); I(bst, { y: 0 }); I(sel, { scaleX: 0, opacity: 1 });

      const cg = $("s05-cg"), cur = $("s05-cur"), chip = $("s05-chip");
      const BX = 915, BY = 596, PX = 480, PY = 650;   // click point on Copy · paste point in the terminal
      I(cg, { x: 1040, y: 872, opacity: 0 }); I(cur, { scale: 1 }); I(chip, { opacity: 0, scale: 0, x: 10, y: -30 });
      const tIn = tCopy - 0.56;
      ft(cg, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, tIn);
      ft(cg, { x: 1040 }, { x: BX, duration: 0.5, ease: "power3.out" }, tIn);
      ft(cg, { y: 872 }, { y: BY, duration: 0.5, ease: "power2.inOut" }, tIn);

      // "Copy": click → ripple, press, "Tersalin ✓", the command gets selected
      press(tCopy);
      ft(btn, { scale: 1 }, { scale: 0.93, duration: 0.06, ease: "power2.out" }, tCopy - 0.04);
      ft(btn, { scale: 0.93 }, { scale: 1, duration: 0.24, ease: "back.out(3)" }, tCopy + 0.02);
      const rp1 = $("s05-rp1"); I(rp1, { opacity: 0, scale: 0.2 });
      ft(rp1, { opacity: 0.85, scale: 0.2 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out" }, tCopy);
      ft(btng, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, tCopy + 0.02);
      ft(bst, { y: 0 }, { y: -62, duration: 0.32, ease: "power3.inOut" }, tCopy + 0.02);

      ft(sel, { opacity: 1 }, { opacity: 0.55, duration: 0.3, ease: "power1.inOut" }, tCopy + 0.42);

      ft(chip, { opacity: 0, scale: 0, x: 10, y: -30 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.34, ease: "back.out(2)" }, tSatu - 0.05);
      ft(pc, { scale: 1, opacity: 1 }, { scale: 0.12, opacity: 0, duration: 0.26, ease: "power3.in" }, tPer + 0.16);
      ft(cg, { x: BX }, { x: PX, duration: 0.4, ease: "power3.inOut" }, tTem - 0.42);
      ft(cg, { y: BY }, { y: PY, duration: 0.4, ease: "power2.inOut" }, tTem - 0.42);
      // "tempel": paste → the chip drops in, the terminal irises open from that point
      press(tTem);
      ft(chip, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0, duration: 0.16, ease: "power2.in" }, tTem - 0.02);
      ft(cg, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in" }, tTem + 0.16);

      ft(rp2, { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 1.9, duration: 0.5, ease: "power2.out" }, tTem);

      const term = $("s05-term"), ir = (r) => `circle(${r}px at ${PX - 100}px ${PY - 432}px)`;
      I(term, { opacity: 0, clipPath: ir(0), y: 14, scale: 0.985 });

          });

          // sparkles
          const STAR = '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff" stroke="#acc6e7" stroke-width="1.5"/></svg>';
          const sparks = [];
          for (let i = 0; i < 14; i++) {
            const sp = document.createElement("div");
            sp.className = "s04-abs s04-spark"; sp.innerHTML = STAR;
            sp.style.left = 516 + "px"; sp.style.top = 978 + "px";
            q("#s04-sparks").appendChild(sp);
            const a = (i / 14) * Math.PI * 2 + rnd() * 0.35, r = 330 + rnd() * 170;
            sparks.push([sp, Math.cos(a) * r, Math.sin(a) * r * 0.9, 0.5 + rnd() * 0.7]);
          }

          // ---------- refs ----------
          const world = q("#s04-world"), bed = q("#s04-bed"), lens = q("#s04-lens"), lshadow = q("#s04-lensshadow");
          const mag = q("#s04-mag"), magimg = q("#s04-magimg");
          const brk = ["#s04-b1", "#s04-b2", "#s04-b3", "#s04-b4"].map(q);

          // ---------- initial states ----------
          // lens travel path (offsets from the locked position). The image inside the glass is counter-moved so the
          // magnifier always shows the real still underneath it (lock position = wordmark).
          const P0 = { x: -300, y: -330 }, P1 = { x: -70, y: -92 };
          const M0 = 1.1, ML = 1.26;
          tl.set(world, { transformOrigin: "540px 1000px" }, 0);
          tl.set(lens, { x: P0.x, y: P0.y, scale: 0.86, transformOrigin: "400px 400px" }, 0);
          tl.set(lshadow, { x: P0.x + 30, y: P0.y + 40, scale: 0.86, opacity: 0.7 }, 0);
          tl.set(magimg, { x: -P0.x, y: -P0.y }, 0);
          tl.set(mag, { scale: M0, transformOrigin: "300px 300px" }, 0);
          tl.set(q("#s04-ticks"), { rotation: -70, svgOrigin: "400 400" }, 0);
          tl.set(q("#s04-sweep"), { rotation: -40, transformOrigin: "50% 50%" }, 0);
          tl.set([q("#s04-glow"), q("#s04-shock"), q("#s04-flash"), q("#s04-wash"), q("#s04-cone")], { opacity: 0 }, 0);
          tl.set(q("#s04-pip"), { scale: 0, transformOrigin: "50% 50%" }, 0);
          tl.set(brk, { opacity: 0 }, 0);
          tl.set(sparks.map((s) => s[0]), { opacity: 0 }, 0);
          tl.set(q("#s04-glintbar"), { x: -420 }, 0);

          // ---------- camera + planes ----------
          tl.fromTo(world, { scale: 1 }, { scale: 1.06, duration: 1.17, ease: "sine.inOut", immediateRender: false }, 0);
          tl.fromTo("#s04-far", { y: 0, x: 0 }, { y: -36, x: 10, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo("#s04-near", { y: 70 }, { y: -110, duration: DUR, ease: "none", immediateRender: false }, 0);
          tl.fromTo(q("#s04-frost-sheen"), { x: -100 }, { x: 900, duration: DUR, ease: "none", immediateRender: false }, 0);

          // bed rises in (frame 0 already moving)
          tl.fromTo(bed, { y: 70, scale: 0.95, transformOrigin: "50% 50%" }, { y: 0, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s04-bedshadow"), { scaleX: 0.8, opacity: 0.5 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(q("#s04-progress"), { attr: { width: 20 } }, { attr: { width: 152 }, duration: 0.79, ease: "power2.inOut", immediateRender: false }, 0);

          // lens swoops in (power3.out), searches, then power3.in into the lock exactly on "Pomelli."
          const travel = (t0, d, from, to, ease) => {
            tl.fromTo(lens, { x: from.x, y: from.y }, { x: to.x, y: to.y, duration: d, ease, immediateRender: false }, t0);
            tl.fromTo(magimg, { x: -from.x, y: -from.y }, { x: -to.x, y: -to.y, duration: d, ease, immediateRender: false }, t0);
            tl.fromTo(lshadow, { x: from.x + 30, y: from.y + 40 }, { x: to.x + (to.x === 0 ? 22 : 30), y: to.y + (to.y === 0 ? 28 : 40), duration: d, ease, immediateRender: false }, t0);
          };
          travel(0, 0.5, P0, P1, "power3.out");
          travel(0.5, 0.29, P1, { x: 0, y: 0 }, "power3.in");
          tl.fromTo(lens, { scale: 0.86 }, { scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo(lshadow, { scale: 0.86, opacity: 0.7 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);

          // "Pertama," -> bezel clicks a notch, sweep radar rotates
          tl.fromTo(q("#s04-ticks"), { rotation: -70 }, { rotation: -30, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, T.pertama - 0.04);
          tl.fromTo(q("#s04-sweep"), { rotation: -40 }, { rotation: 400, duration: 0.95, ease: "power1.inOut", immediateRender: false }, 0);
          // bezel winds to index while closing in (lands on the word)
          tl.fromTo(q("#s04-ticks"), { rotation: -30 }, { rotation: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, T.pomelli - 0.3);
          // magnification rises as the lens drops into focus
          tl.fromTo(mag, { scale: M0 }, { scale: ML + 0.04, duration: 0.3, ease: "power3.in", immediateRender: false }, T.pomelli - 0.3);
          tl.fromTo(mag, { scale: ML + 0.04 }, { scale: ML, duration: 0.3, ease: "power2.out", immediateRender: false }, T.pomelli);

          // ---------- APEX on "Pomelli." (0.79) ----------
          const A = T.pomelli;
          tl.fromTo(brk, { opacity: 0, scale: 1.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)", stagger: 0.015, immediateRender: false }, A - 0.02);
          tl.fromTo(q("#s04-brk"), { attr: { stroke: "#e8f0fb" } }, { attr: { stroke: "#9fd8c4" }, duration: 0.2, ease: "power1.out", immediateRender: false }, A + 0.18);
          tl.fromTo(q("#s04-pip"), { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.6)", immediateRender: false }, A);
          tl.fromTo(q("#s04-flash"), { opacity: 0 }, { opacity: 0.5, duration: 0.08, ease: "power2.out", immediateRender: false }, A - 0.02);
          tl.fromTo(q("#s04-flash"), { opacity: 0.5 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, A + 0.06);
          tl.fromTo(q("#s04-glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.85, scale: 1.1, duration: 0.25, ease: "power2.out", immediateRender: false }, A - 0.03);
          tl.fromTo(q("#s04-glow"), { opacity: 0.85 }, { opacity: 0.25, duration: 0.5, ease: "power2.out", immediateRender: false }, A + 0.22);
          tl.fromTo(q("#s04-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s04-cone"), { opacity: 0 }, { opacity: 0.9, duration: 0.3, ease: "power2.out", immediateRender: false }, A - 0.2);
          tl.fromTo(lens, { scale: 1 }, { scale: 1.045, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
          tl.fromTo(q("#s04-navy"), { attr: { "stroke-width": 22 } }, { attr: { "stroke-width": 30 }, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
          tl.fromTo(q("#s04-glintbar"), { x: -420 }, { x: 420, duration: 0.45, ease: "power2.inOut", immediateRender: false }, A - 0.05);
          tl.fromTo(q("#s04-led"), { attr: { r: 5 } }, { attr: { r: 8 }, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, A);
          sparks.forEach(([sp, dx, dy, s], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
              { x: dx, y: dy, scale: s, opacity: 0, rotation: 90, duration: 0.7, ease: "power3.out", immediateRender: false }, A + i * 0.01);
          });
          // settle: tiny micro-drift of the locked lens (breathing)
          tl.fromTo(q("#s04-ticks"), { rotation: 0 }, { rotation: 6, duration: 0.38, ease: "sine.inOut", immediateRender: false }, A + 0.05);

          // ---------- EXIT: lens swells to fill the frame (hand-off to s05) ----------
          const X0 = 1.2;
          tl.fromTo(lens, { scale: 1, y: 0 }, { scale: 2.25, y: 190, duration: DUR - X0, ease: "power2.in", immediateRender: false }, X0);
          tl.fromTo(lshadow, { scale: 1, opacity: 1 }, { scale: 2.4, opacity: 0, duration: DUR - X0, ease: "power2.in", immediateRender: false }, X0);
          tl.fromTo(bed, { scale: 1 }, { scale: 1.12, duration: DUR - X0, ease: "power2.in", immediateRender: false }, X0);
          tl.fromTo(q("#s04-wash"), { opacity: 0 }, { opacity: 0.8, duration: DUR - X0 - 0.06, ease: "power2.in", immediateRender: false }, X0 + 0.06);
          tl.fromTo(q("#s04-ticks"), { rotation: 6 }, { rotation: 60, duration: DUR - X0, ease: "power2.in", immediateRender: false }, X0);
          tl.fromTo(q("#s04-glow"), { opacity: 0.25 }, { opacity: 0, duration: 0.2, ease: "none", immediateRender: false }, X0);
          // seek-order safety: a backward seek first rewinds to 0, then plays forward to the target, so every frame
          // equals a clean forward render (chained fromTo tweens on one property otherwise depend on where the seek came from)
          (function (t) { const r = t.render; t.render = function (tt, se, f) { if (tt < this._tTime - 1e-7) r.call(this, 0, true, true); return r.call(this, tt, se, f); }; })(tl);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>

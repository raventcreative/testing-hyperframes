      <script>
        (function () {

          const NS = "http://www.w3.org/2000/svg";

          [[166, 556], [914, 556], [166, 1382], [914, 1382], [166, 700], [914, 700], [166, 1048], [914, 1048]].forEach(([x, y]) => {

            c.setAttribute("fill", "#c9d3e0"); c.setAttribute("stroke", "rgba(28,51,84,0.35)"); c.setAttribute("stroke-width", "1.2"); rv.appendChild(c);

          const drum = (sel, final, size, n) => {

          const dD = drum("#s13-drD", "28", 98, 6), dM = drum("#s13-drM", "SEPTEMBER", 40, 6), dY = drum("#s13-drY", "2026", 54, 6);
          const roll = (o, start, land) => {
            tl.set(o.st, { y: 0 }, 0);

          roll(dM, T.sept - 0.4, T.sept);
          roll(dY, T.y2026 - 0.4, T.y2026);

          // ---------- sparks / dust / motes ----------
          const STAR = '<svg viewBox="0 0 40 40"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="#ffffff" stroke="#acc6e7" stroke-width="1.5"/></svg>';
          const mkSparks = (n, cx, cy, r0, r1) => {
            const arr = [];
            for (let i = 0; i < n; i++) {
              const sp = mk("div", "s13-abs s13-spk", q("#s13-spks"), "left:" + cx + "px;top:" + cy + "px");
              sp.innerHTML = STAR;
              const a = (i / n) * Math.PI * 2 + rnd() * 0.5, r = r0 + rnd() * (r1 - r0);

          };

          const sparksB = mkSparks(10, 540, 1218, 140, 300);

            const side = i % 4;

            else if (side === 1) { x = 186; y = 740 + rnd() * 280; dx = -60 - rnd() * 80; dy = (rnd() - 0.5) * 60; }
            else if (side === 2) { x = 894; y = 740 + rnd() * 280; dx = 60 + rnd() * 80; dy = (rnd() - 0.5) * 60; }
            else { x = 200 + rnd() * 680; y = 1036; dx = (rnd() - 0.5) * 90; dy = 30 + rnd() * 50; }

          tl.fromTo(rig, { y: 90, rotationX: 10, rotationY: -8, opacity: 0.85 }, { y: 0, rotationX: 0, rotationY: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo(q("#s13-contact"), { scaleX: 0.75, opacity: 0.4 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo(q("#s13-farp"), { y: 0 }, { y: -36, duration: DUR, ease: "none" }, 0);
          tl.fromTo(q("#s13-beam"), { rotation: -4 }, { rotation: 3, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo([q("#s13-fg1"), q("#s13-fg2")], { y: 0 }, { y: -110, duration: DUR, ease: "none" }, 0);

          tl.fromTo(q("#s13-lblSheen"), { x: 0 }, { x: 900, duration: 0.55, ease: "power2.inOut", immediateRender: false }, T.mixboard + 0.02);

          // "sudah": frosted glass shutter slides over the icon, icon blurs

          tl.fromTo(icon, { filter: "blur(0px)" }, { filter: "blur(4px)", duration: 0.3, ease: "power2.out", immediateRender: false }, T.sudah);

          // "ditutup": drawer slams shut (lands on the word)

          tl.to(tray, { scaleY: 0.02, scaleX: 0.9, duration: 0.24, ease: "power3.in" }, close0);
          tl.set(tray, { opacity: 0 }, T.ditutup);
          tl.to(q("#s13-dshadow"), { opacity: 0, duration: 0.24, ease: "power2.in" }, close0);

          const shake = [[-7, 3], [6, -2], [-4, 2], [3, -1], [-1.5, 0.5], [0, 0]];

          tl.fromTo(q("#s13-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out", immediateRender: false }, T.ditutup);

          dusts.forEach(([d, dx, dy, s], i) => {
            tl.fromTo(d, { opacity: 0.9, x: 0, y: 0, scale: 0.4 }, { opacity: 0, x: dx, y: dy, scale: s, duration: 0.7 + (i % 3) * 0.1, ease: "power2.out", immediateRender: false }, T.ditutup + 0.01);
          });
          // engraved label cools to archive grey (closed, past)
          tl.fromTo(q("#s13-engr"), { color: "#2b4a75" }, { color: "#5a687c", duration: 0.5, ease: "power2.out", immediateRender: false }, T.ditutup + 0.05);

          tl.to(q("#s13-lamp"), { opacity: 0, duration: 0.15, ease: "none" }, T.ditutup + 0.05);

          tl.fromTo(q("#s13-impsh"), { opacity: 0, scale: 2.4 }, { opacity: 0.9, scale: 1, duration: 0.2, ease: "power3.in", immediateRender: false }, T.d28 - 0.2);

          tl.fromTo(q("#s13-glow"), { opacity: 0, scale: 0.5, x: 0, y: 49 }, { opacity: 0.9, scale: 0.9, x: 0, y: 49, duration: 0.18, ease: "power2.out", immediateRender: false }, T.d28 - 0.03);
          tl.to(q("#s13-glow"), { opacity: 0, duration: 0.7, ease: "power2.out" }, T.d28 + 0.2);

            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 }, { x: dx, y: dy * 0.6, scale: s * 0.8, opacity: 0, rotation: 90, duration: 0.65, ease: "power3.out", immediateRender: false }, T.y2026 + i * 0.012);
          });
          // calm hold to the cut: slow seal sheen breathe
          tl.to(q("#s13-lblSheen"), { x: 0, duration: 0.01 }, 3.0);
          tl.to(q("#s13-lblSheen"), { x: 900, duration: 0.7, ease: "power2.inOut" }, 3.2);

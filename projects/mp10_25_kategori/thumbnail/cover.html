<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · Kategori Biaya</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Robot rendered live with the project runtime.
     Hero object = the film's navy 5-drawer filing cabinet, labelled per category, the IKLAN drawer pulled out with receipts inside and
     two receipts flying into their drawers. No numbers on the cover. -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #131B40; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse 1000px 1200px at 50% 40%, #2a3a84 0%, #212C5F 55%, #131B40 100%); }
  .ngrid { position: absolute; inset: 0; opacity: .1; background-image: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px), linear-gradient(0deg, #fff 0 1.5px, transparent 1.5px); background-size: 108px 108px;
           -webkit-mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 620px 900px at 50% 50%, #000 30%, transparent 100%); }
  #lock { position: absolute; left: 0; width: 1080px; top: 300px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #fff; }
  #lock img { height: 40px; } #lock b { color: #FED111; font-weight: 700; }
  #t1 { position: absolute; left: 70px; top: 380px; font: 800 168px/0.98 Rubik; letter-spacing: -5px; color: #fff; white-space: nowrap; }
  #t1b { position: absolute; left: 70px; top: 552px; font: 800 118px/1 Rubik; letter-spacing: -3px; white-space: nowrap; }
  #t1b span { color: #161D3A; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.5%, #FFE440 98.5%, rgba(255,228,64,0) 100%) no-repeat 0 90% / 100% 82%; padding: 0 .08em; }
  #t2 { position: absolute; left: 76px; top: 700px; font: italic 400 56px/1.05 PF; color: #DDE1EE; white-space: nowrap; }
  #glow { position: absolute; left: -80px; top: 820px; width: 960px; height: 960px; background: radial-gradient(closest-side, rgba(254,209,17,.18), rgba(254,209,17,0)); }
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 380px 980px; }
  .g3 { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0 0; }
  .pl { position: absolute; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .cbt { background: linear-gradient(180deg, #5a70d0 0%, #4357b8 100%); box-shadow: inset 0 0 0 5px rgba(255,255,255,.12); }
  .cbs { background: linear-gradient(180deg, #34489f 0%, #26367A 100%); }
  .cbf { background: linear-gradient(180deg, #3d53b4, #31459e); }
  .cbp { background: linear-gradient(180deg, #1a2457, #121a45); }
  .cbg { background: #0e1538; }
  .dfr { border-radius: 10px; background: linear-gradient(180deg, #4a61c4 0%, #3a4fae 55%, #31459e 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -4px 0 rgba(0,0,0,.2); }
  .dlab { position: absolute; left: 34px; top: 14px; width: 340px; height: 84px; border-radius: 10px; background: #FBF8EF; box-shadow: 0 0 0 5px #8a9be3, 0 0 0 7px rgba(0,0,0,.2); }
  .dl1 { position: absolute; left: 0; top: 0; width: 340px; height: 84px; display: flex; align-items: center; justify-content: center; gap: 12px; white-space: nowrap; }
  .dl1 i { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .dl1 i svg { width: 27px; height: 27px; }
  .dl1 b { font: 800 33px/1 Rubik; color: #212C5F; }
  .dhd { position: absolute; left: 129px; top: 112px; width: 150px; height: 20px; border-radius: 10px; background: linear-gradient(180deg, #FFEC86 0%, #FED111 55%, #d7b000 100%); box-shadow: 0 4px 0 rgba(0,0,0,.22); }
  .dtb { background: linear-gradient(180deg, #121a45, #1b2660); box-shadow: inset 0 0 0 4px rgba(99,120,216,.35); }
  .dtk { background: linear-gradient(180deg, #0f163c, #172153); }
  .dts { background: linear-gradient(90deg, #2c3e8e, #22316f); backface-visibility: visible !important; -webkit-backface-visibility: visible !important; }
  .rc { position: absolute; border-radius: 6px; background: #fff; padding: 16px 16px; box-shadow: 0 20px 40px rgba(3,6,24,.45); }
  .rc i { display: block; height: 10px; border-radius: 5px; background: #DDE1EE; margin-top: 12px; }
  .rc i.h { height: 14px; width: 60%; background: #212C5F; margin: 0 auto 4px; }
  .rc i.y { background: #FED111; height: 16px; width: 70%; margin-left: auto; }
  .rc.nt { background: #FBF8EF; }
  .tag { position: absolute; right: -16px; top: -16px; width: 58px; height: 58px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(3,6,24,.4), inset 0 0 0 4px rgba(255,255,255,.45); }
  .tag svg { width: 34px; height: 34px; }
  #t3 { position: absolute; left: 610px; top: 868px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: #fff; font: 700 32px/1 PS; color: #212C5F; white-space: nowrap; transform: rotate(3deg); }
  #t3 svg { width: 30px; height: 30px; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="c">
  <div class="ngrid"></div>
  <div id="glow"></div>
  <div class="stage"><div class="g3" id="w"></div></div>
  <div id="lock"><img src="../assets/mp/mp_m_reverse.png" alt="" /><span>Master<b>Pajak AI</b></span></div>
  <div id="t1">BIAYA</div>
  <div id="t1b"><span>CAMPUR ADUK?</span></div>
  <div id="t2">pisahin per kategori, biar jelas</div>
  <div id="flyL"></div>
  <div id="t3">Habis buat apa?<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  const IC = {
    bb: '<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.45 3.1 2.6 7 2.6s7-1.15 7-2.6V6"/><path d="M5 12c0 1.45 3.1 2.6 7 2.6s7-1.15 7-2.6"/>',
    ok: '<path d="M2.5 6.5h11v9.5h-11zM13.5 9.5h4l3 3.2v3.3h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.8" cy="17.5" r="1.8"/>',
    ik: '<path d="M3 10v4h3l6 4V6L6 10z"/><path d="M16 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>',
    km: '<path d="M3.5 8.5L12 4l8.5 4.5v9L12 22l-8.5-4.5z"/><path d="M3.5 8.5L12 13l8.5-4.5M12 13v9"/><path d="M7.8 6.2l8.5 4.6"/>',
    op: '<path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="#212C5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
  const CAT = [["bb", "BAHAN BAKU"], ["ok", "ONGKIR"], ["ik", "IKLAN"], ["km", "KEMASAN"], ["op", "OPERASIONAL"]];
  const mk = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; parent.appendChild(e); return e; };
  const w = document.getElementById("w");
  // world origin = floor centre of the cabinet; camera slightly above and to the right
  w.style.transform = "translate3d(330px, 1570px, -320px) rotateX(-16deg) rotateY(22deg)";
  const W = 440, D = 340, DH = 150, N = 5, PH = 36, TT = 22, H = PH + N * DH + TT, TD = 150, OPEN = 4;
  const P = (cls, wd, ht, tr, par) => mk("div", "pl " + cls, par || w, `left:${-wd / 2}px; top:${-ht / 2}px; width:${wd}px; height:${ht}px; transform:${tr};`);
  P("cbt", W, D, `translate3d(0px, ${-H}px, 0px) rotateX(90deg)`);
  P("cbs", D, H, `translate3d(${-W / 2}px, ${-H / 2}px, 0px) rotateY(-90deg)`);
  P("cbs", D, H, `translate3d(${W / 2}px, ${-H / 2}px, 0px) rotateY(90deg)`);
  P("cbf", 16, H, `translate3d(${-W / 2 + 8}px, ${-H / 2}px, ${D / 2}px)`);
  P("cbf", 16, H, `translate3d(${W / 2 - 8}px, ${-H / 2}px, ${D / 2}px)`);
  P("cbf", W - 32, TT, `translate3d(0px, ${-H + TT / 2}px, ${D / 2}px)`);
  P("cbp", W - 32, PH, `translate3d(0px, ${-PH / 2}px, ${D / 2}px)`);
  for (let k = 1; k < N; k++) P("cbg", W - 32, 8, `translate3d(0px, ${-H + TT + k * DH}px, ${D / 2}px)`);
  CAT.forEach(([key, name], k) => {
    const dg = mk("div", "g3", w), z = D / 2 + (k === OPEN ? 125 : 0);
    dg.style.transform = `translate3d(0px, ${-H + TT + k * DH}px, ${z}px)`;
    if (k === OPEN) {
      const tb = P("dtb", W - 60, TD, `translate3d(0px, ${DH - 12}px, ${-TD / 2}px) rotateX(90deg)`, dg);
      // receipts already inside the open drawer (flat, painted inside the tray floor)
      tb.innerHTML = '<div style="position:absolute;left:40px;top:30px;width:150px;height:110px;background:#fff;border-radius:6px;transform:rotate(-6deg)"></div><div style="position:absolute;left:150px;top:20px;width:150px;height:120px;background:#FBF8EF;border-radius:6px;transform:rotate(8deg)"></div><div style="position:absolute;left:250px;top:34px;width:110px;height:100px;background:#fff;border-radius:6px;transform:rotate(-3deg);border-top:10px solid #FED111"></div>';
      P("dtk", W - 60, 104, `translate3d(0px, ${DH - 12 - 52}px, ${-TD + 1}px)`, dg);
      P("dts", TD, 104, `translate3d(${-(W - 60) / 2}px, ${DH - 12 - 52}px, ${-TD / 2}px) rotateY(90deg)`, dg);
      P("dts", TD, 104, `translate3d(${(W - 60) / 2}px, ${DH - 12 - 52}px, ${-TD / 2}px) rotateY(90deg)`, dg);
    }
    const fr = P("dfr", W - 32, DH - 8, `translate3d(0px, ${(DH - 8) / 2 + 4}px, 0px)`, dg);
    fr.innerHTML = `<div class="dlab"><div class="dl1"><i>${svg(key)}</i><b>${name}</b></div></div><i class="dhd"></i>`;
  });
  // two receipts flying into their drawers (screen space, tag shows their category); no numbers on the cover
  const fl = document.getElementById("flyL");
  [[620, 1090, -14, "ik", ""], [660, 1320, 12, "op", " nt"]].forEach(([x, y, r, k, v]) => {
    const e = mk("div", "rc" + v, fl, `left:${x}px; top:${y}px; width:150px; height:196px; transform: rotate(${r}deg);`);
    e.innerHTML = '<i class="h"></i><i></i><i style="width:80%"></i><i></i><i class="y"></i>' + `<span class="tag">${svg(k)}</span>`;
  });
  document.fonts.ready.then(() => RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" })).then((r) => {
    // self-check: no label may be wider than its holder, no title wider than 940 px
    document.querySelectorAll(".dl1").forEach((e) => { if (e.scrollWidth > e.clientWidth + 0.5) console.log("pageerror LABEL OVERFLOW", e.textContent); });
    ["t1", "t1b", "t2"].forEach((id) => { const e = document.getElementById(id); if (e.getBoundingClientRect().width > 940.5) console.log("pageerror TITLE TOO WIDE", id, e.getBoundingClientRect().width); });
    r.render({ x: 905, y: 1500, h: 640, yaw: -24, roll: 0, headYaw: -18, headPitch: -10, headRoll: 8, t: 2,
      aL: { raise: 18, fwd: 0, bend: 14 }, aR: { raise: 128, fwd: 26, bend: 12, bendYaw: 0 },
      face: { blink: 0, lookX: -0.9, lookY: 0.4, happy: 1, smile: 1, o: 0.3 }, rim: 2.0, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>

      const W2 = {
        t0: 4.2, t1: 16.867, inK: ["zoom", 400, 1050], outK: ["push"],

        rootX: K([[0, -0.52], [0.45, -0.52], [1.05, -0.47, "out"], [1.95, -0.47], [2.65, 0.0, "io"]]),

      // W4 — SWAP (s11, 31.867–35.933): tracks each swap, surprised on "presenter", opens both hands.

      // W5 — RIGHTS PRESENTER (s13–s14, 40.7–46.867): "jangan" stop-hand + head shake, explains

      const W5 = {

        face(a) {

      // W6 — BRIEF CAMEO (s16, 49.867–51.767): explains, nods on "brief".
      const W6 = {

        },

      // W7 — CTA (s18–s19, 56.7–61.1): asks the question as presenter, then steps aside to the
      //      comment bubble: points at it on "HYPIT", waves, calm closed-mouth final pose.
      const G_VIEW = { fx: 855, fy: 1670, h: 720, pitch: 4 };
      const W7 = {

<!doctype html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Cover — R26 1x Syuting 750 Iklan (navy)</title>
<!-- world still (slot machine, 18.9 s) + mascot layer, both from tools/still.cjs; headline in the night sky -->
<style>

  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }

  #eb { top: 196px; } #eb span { display: inline-block; padding: 14px 34px 16px 40px; border-radius: 48px; background: #ff4d5e; color: #ffffff; font: 700 46px/1 Poppins; letter-spacing: 7px; box-shadow: 0 10px 30px rgba(255,77,94,.45); transform: rotate(-3deg); }

<body>
  <img id="bg" src="still_world.png" alt="" />

  <img id="host" src="host_cut.png" alt="" />
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR" />
  <div class="c" id="eb"><span>PROMPT GRATIS</span></div>
  <div class="c" id="h1">50 Hook Iklan</div>
  <div class="c" id="h2">Dari 1 Prompt</div>
  <script>document.fonts.ready.then(() => (window.COVER_READY = true));</script>
</body></html>

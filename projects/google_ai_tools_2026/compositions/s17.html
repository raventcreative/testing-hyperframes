      <script>
        (function () {
          const ID = "s17";
          const R = document.querySelector('[data-composition-id="' + ID + '"]');
          const q = (s) => R.querySelector(s), qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          const NS = "http://www.w3.org/2000/svg";
          const DUR = 1.0667;
          // verified local word starts: Komen 0.19, GOOGLE. 0.47
          const T = { komen: 0.19, apex: 0.47, still: 0.8 };   // everything is settled & motionless from T.still to DUR
          let seed = 1717;
          const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
          const mk = (cls, parent, css, html) => { const e = document.createElement("div"); e.className = cls; if (css) e.style.cssText = css; if (html) e.innerHTML = html; parent.appendChild(e); return e; };

          const ht = q("#s17-hticks");
          for (let i = 0; i < 60; i++) {
            const a = (i / 60) * Math.PI * 2, r1 = 360, r2 = i % 5 === 0 ? 346 : 354;
            const l = document.createElementNS(NS, "line");
            l.setAttribute("x1", (390 + Math.cos(a) * r1).toFixed(1)); l.setAttribute("y1", (390 + Math.sin(a) * r1).toFixed(1));
            l.setAttribute("x2", (390 + Math.cos(a) * r2).toFixed(1)); l.setAttribute("y2", (390 + Math.sin(a) * r2).toFixed(1));
            l.setAttribute("stroke", "rgba(41,75,119,0.16)"); l.setAttribute("stroke-width", i % 5 === 0 ? 3 : 1.5);
            ht.appendChild(l);
          }
          const STAR = (fill) => `<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2 C21 14 26 19 38 20 C26 21 21 26 20 38 C19 26 14 21 2 20 C14 19 19 14 20 2Z" fill="${fill}" stroke="rgba(41,75,119,0.35)" stroke-width="1.5"/></svg>`;
          const sparks = [];
          for (let i = 0; i < 14; i++) {
            const sp = mk("s17-abs s17-spark", q("#s17-sparks"), "left:508px;top:648px", STAR(i % 5 === 1 ? "#f2c46d" : "#ffffff"));
            const a = (i / 14) * Math.PI * 2 + rnd() * 0.35, rx = 330 + rnd() * 110, ry = 200 + rnd() * 80;
            let dy = Math.sin(a) * ry; if (dy < -230) dy = -230;
            sparks.push([sp, Math.cos(a) * rx, dy, 0.7 + rnd() * 0.7]);
          }
          const fg = q("#s17-fg"), motes = [];
          for (let i = 0; i < 8; i++) {
            const s = 10 + rnd() * 20;
            let mx = 60 + rnd() * 960; const my = 470 + rnd() * 1000;
            if (mx > 220 && mx < 860 && my > 540 && my < 1300) mx = mx < 540 ? 70 + (mx - 220) * 0.4 : 880 + (mx - 540) * 0.4; // keep the lockup clean
            motes.push(mk("s17-abs s17-fmote", fg, `left:${mx.toFixed(0)}px;top:${my.toFixed(0)}px;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;opacity:${(0.4 + rnd() * 0.4).toFixed(2)}`));
          }
          const bok = [mk("s17-abs s17-bokeh", fg, "left:-60px;top:1500px;width:220px;height:220px;opacity:0.75"), mk("s17-abs s17-bokeh", fg, "left:910px;top:440px;width:160px;height:160px;opacity:0.6")];

          const BUB = q("#s17-bub"), dots = qa(".s17-dot");
          // ---------- initial states ----------
          tl.set(q("#s17-world"), { transformOrigin: "540px 960px" }, 0);
          tl.set(BUB, { transformOrigin: "50% 92%", transformPerspective: 1600 }, 0);
          tl.set(q("#s17-word"), { opacity: 0, scale: 1.3 }, 0);
          tl.set(q("#s17-badge"), { scale: 0.4, rotation: -30 }, 0);
          tl.set(q("#s17-bglint"), { rotation: 16, x: 0 }, 0);
          tl.set(q("#s17-logow"), { clipPath: "inset(0% 100% 0% 0%)" }, 0);
          tl.set(q("#s17-sheen"), { rotation: 18, x: 0 }, 0);
          tl.set(q("#s17-rule"), { scaleX: 0 }, 0);
          tl.set([q("#s17-glow"), q("#s17-shock")], { opacity: 0 }, 0);
          tl.set(q("#s17-bshadow"), { opacity: 0.35, scaleX: 0.7 }, 0);
          tl.set(sparks.map((s) => s[0]), { opacity: 0, scale: 0 }, 0);

          // ---------- camera + ambient: all end at T.still ----------
          tl.fromTo(q("#s17-world"), { scale: 1 }, { scale: 1.04, duration: T.still, ease: "power2.out" }, 0);
          tl.fromTo(q("#s17-halo"), { rotation: -10, scale: 1.14, opacity: 0.6 }, { rotation: 6, scale: 1, opacity: 1, duration: T.still, ease: "power2.out" }, 0);
          tl.fromTo(q("#s17-far"), { y: 30 }, { y: 0, duration: T.still, ease: "power2.out" }, 0);
          tl.fromTo(q("#s17-key"), { x: -30 }, { x: 20, duration: T.still, ease: "power2.out" }, 0);
          motes.forEach((m, i) => tl.fromTo(m, { x: 0, y: 0 }, { x: i % 2 ? 18 : -14, y: -(30 + i * 8), duration: T.still, ease: "power2.out" }, 0));
          bok.forEach((b, i) => tl.fromTo(b, { x: 0, y: 0 }, { x: i ? -30 : 40, y: i ? 20 : -40, duration: T.still, ease: "power2.out" }, 0));

          // ---------- entry: bubble already flying in at frame 0, typing dots ----------
          tl.fromTo(BUB, { scale: 0.7, y: 150, rotation: -5, rotationY: -16 }, { scale: 0.95, y: 30, rotation: -1, rotationY: -4, duration: T.apex, ease: "power3.out" }, 0);
          tl.fromTo(q("#s17-badge"), { scale: 0.4, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, 0.08);
          dots.forEach((d, i) => {
            tl.fromTo(d, { y: 0 }, { y: -14, duration: 0.11, ease: "sine.out", immediateRender: false }, 0.04 + i * 0.07);
            tl.to(d, { y: 0, duration: 0.11, ease: "sine.in" }, 0.15 + i * 0.07);
            tl.to(d, { y: -14, duration: 0.11, ease: "sine.out" }, 0.26 + i * 0.03);
            tl.to(d, { y: 0, duration: 0.08, ease: "sine.in" }, 0.37 + i * 0.03);
          });

          // ---------- APEX "GOOGLE" 0.47: punch ----------
          const A = T.apex;
          tl.to(dots, { scale: 0, opacity: 0, duration: 0.05, ease: "power2.in" }, A - 0.07);
          tl.to(q("#s17-word"), { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(1.8)" }, A - 0.03);
          tl.to(BUB, { scale: 1.05, y: 10, rotation: 0, rotationY: 0, duration: 0.07, ease: "power2.out" }, A);
          tl.fromTo(q("#s17-glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.1, duration: 0.12, ease: "power2.out", immediateRender: false }, A - 0.02);
          tl.to(q("#s17-glow"), { opacity: 0, duration: 0.2, ease: "power2.in" }, A + 0.12);
          tl.fromTo(q("#s17-shock"), { opacity: 0.95, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.3, ease: "power2.out", immediateRender: false }, A);
          tl.fromTo(q("#s17-bglint"), { x: 0 }, { x: 900, duration: 0.26, ease: "power2.inOut", immediateRender: false }, A);
          sparks.forEach(([sp, dx, dy, s], i) => {
            tl.fromTo(sp, { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },

          });

          // ---------- settle into the brand lockup (done by T.still) ----------
          tl.to(BUB, { scale: 0.87, y: 100, duration: 0.24, ease: "power3.inOut" }, A + 0.08);
          tl.to(BUB, { scale: 0.85, duration: T.still - (A + 0.32), ease: "power2.out" }, A + 0.32);
          tl.to(q("#s17-bshadow"), { opacity: 0.8, scaleX: 1, duration: 0.3, ease: "power2.out" }, A + 0.02);
          tl.fromTo(q("#s17-plinth"), { y: 300, scale: 0.94 }, { y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.22);
          tl.fromTo([q("#s17-plshadow"), q("#s17-plwide")], { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.22);
          tl.to(q("#s17-logow"), { clipPath: "inset(0% 0% 0% 0%)", duration: 0.24, ease: "power2.inOut" }, A + 0.04);
          tl.to(q("#s17-rule"), { scaleX: 1, duration: 0.2, ease: "power3.out" }, A + 0.12);
          tl.to(q("#s17-sheen"), { x: 1250, duration: 0.3, ease: "power2.inOut" }, A + 0.03);
          // T.still → DUR: intentionally no tweens. Final frame = calm still lockup.
          tl.set({}, {}, DUR);

          window.__timelines[ID] = tl; // register LAST
        })();

<!doctype html>
<html lang="id"><head><meta charset="UTF-8" />
<title>Cover — R26 1x Syuting 750 Iklan (navy)</title>
<!-- world still (slot machine, 18.9 s) + mascot layer, both from tools/still.cjs; headline in the night sky -->
<style>
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: Poppins, sans-serif; background: #050b22; }
  #bg { position: absolute; left: -130px; top: -60px; width: 1458px; height: auto; }
  #fadeT { position: absolute; left: 0; top: 0; width: 1080px; height: 760px; background: linear-gradient(180deg, rgba(4,9,30,.96) 0%, rgba(4,9,30,.85) 50%, rgba(4,9,30,0) 100%); }
  #host { position: absolute; left: 0; bottom: -40px; width: 620px; height: auto; filter: drop-shadow(0 18px 34px rgba(0,0,0,.5)); }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  #logo { position: absolute; left: 430px; top: 150px; width: 220px; }
  #eb { top: 214px; } #eb span { display: inline-block; padding: 10px 26px 12px 34px; border-radius: 40px; background: #01ccf7; color: #0a0d2c; font: 700 28px/1 Poppins; letter-spacing: 8px; }
  #h1 { top: 292px; font: 700 100px/1 Poppins; letter-spacing: -2.5px; color: #ffffff; text-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #h2 { top: 404px; font: 700 150px/1 Poppins; letter-spacing: -4px; color: #ffc531; text-shadow: 0 10px 40px rgba(255,197,49,.35); }
</style></head>
<body>
  <img id="bg" src="still_world.png" alt="" />
  <div id="fadeT"></div>
  <img id="host" src="host_cut.png" alt="" />
  <img id="logo" src="../assets/brand/logo_white_trim.png" alt="AI PRENEUR" />
  <div class="c" id="eb"><span>HOOK × ISI × CTA</span></div>
  <div class="c" id="h1">1x Syuting</div>
  <div class="c" id="h2">750 Iklan</div>
  <script>document.fonts.ready.then(() => (window.COVER_READY = true));</script>
</body></html>

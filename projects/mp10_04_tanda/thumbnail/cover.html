<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Cover — MasterPajak AI · 3 Tanda Pembukuan Berantakan</title>
<!-- 1080x1920 cover; everything that matters sits inside the 4:5 crop (y 285-1635). Same paper room + extruded numeral as the
     film's hook; robot rendered live with the project runtime (dizzy x-eyes + shrug = "berantakan"). -->
<script src="../vendor/robot_mp.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../assets/fonts/rubik-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: PS; src: url(../assets/fonts/public-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: PF; src: url(../assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F4F6FA; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #F4F6FA; }
  .stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 540px 960px; }
  .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-style: preserve-3d; transform-origin: 540px 960px; transform: rotateX(3deg) rotateY(-10deg); }
  #wall { position: absolute; left: -3460px; top: -2040px; width: 8000px; height: 6000px; background-color: #F4F6FA; transform: translateZ(-1600px);
    background-image: linear-gradient(90deg, rgba(33,44,95,.075) 0 2px, transparent 2px), linear-gradient(0deg, rgba(33,44,95,.075) 0 2px, transparent 2px); background-size: 108px 108px; }
  #floor { position: absolute; left: -1660px; top: 450px; width: 4400px; height: 2100px; background-color: #E6EAF3; transform: translateZ(-550px) rotateX(90deg);
    background-image: linear-gradient(180deg, rgba(244,246,250,1) 0%, rgba(244,246,250,0) 26%), linear-gradient(90deg, rgba(33,44,95,.085) 0 3px, transparent 3px), linear-gradient(0deg, rgba(33,44,95,.085) 0 3px, transparent 3px);
    background-size: 100% 100%, 108px 108px, 108px 108px; }
  .nw { position: absolute; transform-style: preserve-3d; }
  .num { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .nl { position: absolute; left: 0; top: 0; width: 100%; text-align: center; font-family: Rubik; font-weight: 800; line-height: 1; white-space: nowrap; }
  .nl.face { color: transparent; -webkit-background-clip: text; background-clip: text; }
  .stamp { position: absolute; padding: 14px 24px 12px; border-radius: 16px; background: #FED111; border: 5px solid #212C5F; font: 800 40px/1 Rubik; color: #212C5F; white-space: nowrap; box-shadow: 0 16px 34px rgba(19,27,64,.28); }
  .pp { position: absolute; left: 0; top: 0; }
  .nota { width: 270px; padding: 26px 24px 52px; background: linear-gradient(180deg, #fffefa, #f6f2e7); color: #2a3045; font: 600 19px/1.5 PS;
          clip-path: polygon(0 0, 100% 0, 100% 96%, 95% 100%, 90% 96%, 85% 100%, 80% 96%, 75% 100%, 70% 96%, 65% 100%, 60% 96%, 55% 100%, 50% 96%, 45% 100%, 40% 96%, 35% 100%, 30% 96%, 25% 100%, 20% 96%, 15% 100%, 10% 96%, 5% 100%, 0 96%); }
  .nota h4 { font: 800 30px/1 Rubik; letter-spacing: .14em; text-align: center; color: #161D3A; }
  .nota hr { border: 0; border-top: 2px dashed #c9cbd3; margin: 14px 0 10px; }
  .nota .r { display: flex; justify-content: space-between; white-space: nowrap; }
  .nota .tot { margin-top: 8px; font: 800 24px/1.3 Rubik; color: #161D3A; }
  .tf { width: 250px; border-radius: 28px; background: #fff; overflow: hidden; box-shadow: 0 22px 44px rgba(19,27,64,.22); font: 600 17px/1.35 PS; color: #5B6478; }
  .tf .bar { height: 54px; background: #212C5F; display: flex; align-items: center; justify-content: center; font: 700 18px/1 PS; letter-spacing: .06em; color: #fff; }
  .tf .bd { padding: 22px 20px 24px; text-align: center; }
  .tf .ok { width: 74px; height: 74px; margin: 0 auto 12px; border-radius: 50%; background: #FED111; display: flex; align-items: center; justify-content: center; }
  .tf .ok svg { width: 40px; height: 40px; }
  .tf b { display: block; font: 700 20px/1.2 PS; color: #161D3A; }
  .tf .amt { display: block; margin: 8px 0 10px; font: 800 34px/1.1 Rubik; color: #212C5F; }
  .neq { position: absolute; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFE45C, #FED111 60%, #EDB900); box-shadow: 0 0 0 0 #b38f00, 0 24px 50px rgba(19,27,64,.35); }
  .neq svg { position: absolute; left: 38px; top: 38px; width: 114px; height: 114px; }
  #lock { position: absolute; left: 0; width: 1080px; top: 312px; display: flex; justify-content: center; align-items: center; gap: 14px; font: 700 34px/1 Rubik; color: #212C5F; }
  #lock img { height: 44px; } #lock span { letter-spacing: -.5px; }
  #tT { position: absolute; left: 548px; top: 860px; font: 800 176px/1 Rubik; letter-spacing: -5px; color: #212C5F; }
  #tA { position: absolute; left: 66px; top: 1040px; font: 800 132px/1 Rubik; letter-spacing: -3px; color: #212C5F; }
  #tB { position: absolute; left: 66px; top: 1182px; font: 800 148px/1 Rubik; letter-spacing: -3px; color: #212C5F; }
  #tB span { display: inline-block; }
  #tB .hl { display: inline; background: linear-gradient(100deg, rgba(255,228,64,0) 0%, #FFE440 1.2%, #FFE440 98.6%, rgba(255,228,64,0) 100%) no-repeat 0 88% / 100% 72%; padding: 0 .06em; }
  #pill { position: absolute; left: 70px; top: 1420px; display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px; background: #212C5F; font: 700 36px/1 PS; color: #fff; white-space: nowrap; box-shadow: 0 16px 34px rgba(19,27,64,.3); }
  #pill b { color: #FED111; }
  #robot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 900px 1300px at 50% 46%, rgba(0,0,0,0) 58%, rgba(20,26,60,.14) 100%); }
</style>
</head>
<body>
<div id="c">
  <div class="stage"><div class="cam">
    <div id="wall"></div><div id="floor"></div>
    <div class="nw" id="n3" style="left: 40px; top: 330px; transform: rotateY(-20deg)"></div>
    <div class="pp" style="transform: translate3d(760px, 560px, -700px) rotateX(14deg) rotateY(-24deg) rotate(10deg); filter: drop-shadow(0 18px 22px rgba(19,27,64,.2)) blur(2.5px)"><div class="nota"><h4>NOTA</h4><hr><div class="r"><span>Kardus 20x30</span><span>60.000</span></div><div class="r"><span>Bubble wrap</span><span>35.000</span></div><hr><div class="r tot"><span>TOTAL</span><span>Rp95.000</span></div></div></div>
    
    <div class="neq" style="transform: translate3d(800px, 560px, 160px) rotate(-12deg)"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M16 4L8 20" fill="none" stroke="#212C5F" stroke-width="3.2" stroke-linecap="round"/></svg></div>
  </div></div>
  <div id="vig"></div>
  <div id="lock"><img src="../assets/mp/mp_m.png" alt="" /><span>MasterPajak AI</span></div>
  <div id="tT">tanda</div>
  <div id="tA">pembukuanmu</div>
  <div id="tB"><span class="hl" id="hlB">berantakan</span></div>
  <div id="pill">Nomor <b>3</b> paling sering</div>
  <canvas id="robot" width="1080" height="1920"></canvas>
</div>
<script>
  // extruded numeral, same build as the film (face + stacked side layers)
  (function () {
    const host = document.getElementById("n3"), fs = 820, L = 18, step = 4.6, g = document.createElement("div"); g.className = "num"; g.style.width = fs * 0.64 + "px"; g.style.height = fs + "px";
    const sa = [254, 209, 17], sb = [150, 112, 0];
    for (let k = L; k >= 0; k--) { const d = document.createElement("div"); d.className = "nl"; d.textContent = "3"; d.style.fontSize = fs + "px"; d.style.transform = "translateZ(" + (-k * step) + "px)";
      if (!k) { d.classList.add("face"); d.style.backgroundImage = "linear-gradient(170deg, #34459a 0%, #212C5F 55%, #182152 100%)"; } else { const u = k / L, c = sa.map((a, i) => Math.round(a + (sb[i] - a) * u)); d.style.color = "rgb(" + c + ")"; d.style.webkitTextStroke = "3px rgb(" + c + ")"; }
      g.appendChild(d); }
    host.appendChild(g);
    const st = document.createElement("div"); st.className = "stamp"; st.textContent = "PALING SERING"; st.style.left = "250px"; st.style.top = "170px"; st.style.transform = "translateZ(60px) rotate(-9deg)"; host.appendChild(st);
    // messy letters
    const B = document.getElementById("hlB"), txt = B.textContent; B.textContent = "";
    [...txt].forEach((ch, k) => { const s = document.createElement("span"); s.textContent = ch; const r = (Math.sin(k * 127.1 + 320) * 43758.5453) % 1; s.style.transform = "translateY(" + ((r - 0.5) * 26).toFixed(1) + "px) rotate(" + ((((Math.sin(k * 77.7 + 9) * 4375.5) % 1)) * 22).toFixed(1) + "deg)"; B.appendChild(s); });
  })();
  document.fonts.ready.then(() => {
    // fit the title lines to their columns
    const fit = (id, maxW) => { const el = document.getElementById(id), rg = document.createRange(); rg.selectNodeContents(el); const w = rg.getBoundingClientRect().width; if (w > maxW) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * maxW / w).toFixed(1) + "px"; };
    fit("tT", 1010 - 540); fit("tA", 950); fit("tB", 950);
    return RobotMP.create(document.getElementById("robot"), { url: "../assets/robot/robot_mp.glb", logoM: "../assets/mp/mp_m_reverse.png" });
  }).then((r) => {
    r.render({ x: 840, y: 1640, h: 620, yaw: -22, roll: 0, headYaw: -12, headPitch: -4, headRoll: 12, t: 2,
      aL: { raise: 72, fwd: 30, bend: 100, bendYaw: 90 }, aR: { raise: 72, fwd: 30, bend: 100, bendYaw: 90 },
      face: { blink: 0, x: 1, smile: 0, lookX: 0, lookY: 0 }, rim: 1.1, shadow: 0.0 });
    window.COVER_READY = true;
  });
</script>
</body>
</html>
